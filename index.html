t-ce que les Lumières ? (1784), traduction française (PDF, lycée Descartes de Rabat)","url":"https://lycee-descartes.ac.ma/medias/rentree2021/Kant_Quest-ce-que-les-Lumieres-1784.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Enlightenment »","url":"https://plato.stanford.edu/entries/enlightenment/"},{"texte":"Stanford Encyclopedia of Philosophy, « Kant's Social and Political Philosophy »","url":"https://plato.stanford.edu/entries/kant-social-political/"},{"texte":"Stéphane Massonet, « Michel Foucault & l'histoire de la pensée critique », Acta fabula, vol. 17, n° 6, 2016","url":"https://www.fabula.org/acta/document9942.php"}]},{"id":"ferenczi-confusion","discipline":"psychanalyse","titre":"La confusion de langue","figure":"Sándor Ferenczi","branche":"objet","fiabilite":"secondaire","fiabilite_note":"Les sources sont des commentaires (en français, en anglais et en portugais) et non le texte de Ferenczi, dont aucune version intégrale accessible n'a été trouvée ; les citations de Ferenczi passent par les études qui les rapportent.","reference":"Confusion de langue entre les adultes et l'enfant (congrès de Wiesbaden, septembre 1932 ; publié en 1933)","accroche":"En 1932, Ferenczi lit à Wiesbaden un texte que Freud lui avait demandé de ne pas présenter. Il y soutient que l'enfant et l'adulte qui abuse de lui ne parlent pas la même langue.","punch":"L'enfant demande de la tendresse. L'adulte répond dans la langue de la passion.","idee":"L'enfant vit dans le registre de la tendresse ; l'adulte qui abuse de lui répond sur celui de la passion. Pour survivre, l'enfant se soumet et s'identifie à l'agresseur, et il peut prendre sur lui la culpabilité de l'adulte. Le silence ou le déni des adultes aggrave le trauma.","repere":"Le titre complet est « Confusion de langue entre les adultes et l'enfant — le langage de la tendresse et de la passion ». La communication portait à l'origine un autre titre : « Les passions des adultes et leur influence sur le développement du caractère et de la sexualité de l'enfant ». Le titre anglais « Confusion of Tongues » a été choisi par Michael Balint pour la traduction de 1949.","liens":["freud-apres-coup","wittgenstein-taire","freud-transfert"],"texte":"Sándor Ferenczi présente sa communication au douzième Congrès international de psychanalyse, à Wiesbaden, en septembre 1932, le 4 septembre selon une encyclopédie[^7]. L'épisode est resté fameux. Freud, perturbé par la conception du trauma de Ferenczi, lui avait demandé de renoncer à son intervention, et Ferenczi l'a présentée malgré tout[^3]. Bernard Pechberty parle de la colère de Freud et d'un malentendu qu'il juge insurmontable entre les deux hommes[^2].\n\nLe texte paraît en allemand en 1933 dans l'*Internationale Zeitschrift für Psychoanalyse* (19, p. 5-15). Sa traduction anglaise par Michael Balint n'apparaît qu'en 1949 dans l'*International Journal of Psycho-Analysis* (30, p. 225-230)[^3][^4]. Ferenczi meurt en 1933 : la communication a été décrite comme son « chant du cygne »[^3].\n\nLe sujet est douloureux, et la fiche le traite sobrement : le texte parle de l'abus sexuel d'enfants.\n\n## Deux langues\n\nLe cœur du texte est une distinction. Ferenczi décrit l'enfant comme étant, à ce stade de sa vie, dans le registre de la tendresse, ce qu'il appelle « le stade de l'amour d'objet passif ou de la tendresse ». L'adulte, lui, relève d'un autre registre, celui des passions. Quand les deux se rencontrent sans que l'adulte se tienne à sa place, « la conséquence doit nécessairement être celle d'une confusion de langues »[^1].\n\nEmmanuel Fleury, qui commente le texte, donne un exemple d'une autre nature : la nurse, dans les familles puritaines, « confond tendresse et érotisme ». L'adulte entend une demande érotique là où l'enfant exprime une tendresse[^1]. Les deux « langues » sont des métaphores : tendresse et passion, deux formes de communication[^3].\n\n> **Illustration (très atténuée, pas un cas de Ferenczi).** Un enfant de six ans court montrer fièrement son dessin à un parent absorbé par une mauvaise nouvelle. Le parent répond sèchement, sans regarder. L'enfant a parlé la langue de la fierté et reçu celle de l'inquiétude d'un autre. Il ne comprend pas le décalage, et il conclut souvent que c'est son dessin, ou lui, qui est en cause. Le cas de Ferenczi est d'une tout autre gravité, mais il ressemble à cette structure : deux langues, et un enfant qui prend la réponse pour un jugement sur lui.\n\n## L'identification à l'agresseur\n\nComment l'enfant réagit-il ? Ferenczi parle de s'« identifier totalement à l'agresseur »[^5]. L'enfant se soumet, devine les désirs de l'adulte, s'y conforme, et finit par intérioriser la figure qui lui fait peur.\n\nFerenczi a repéré ce mécanisme avant qu'Anna Freud ne le reprenne en 1936, dans *Le Moi et les mécanismes de défense*[^2][^6]. C'est aussi lui qui a forgé le terme d'« introjection »[^2].\n\n## La culpabilité de l'adulte\n\nL'enfant « introjecte, ou s'identifie à, la honte et à la culpabilité non dites des parents »[^4]. Il en vient à penser que « sa soumission et sa tendresse méritent punition »[^1]. Une formule de Ferenczi résume cette situation : l'enfant se retrouve « à la fois innocent et coupable »[^5].\n\n## Le clivage\n\nFerenczi parle d'un « clivage » de la personnalité de l'enfant, qu'il décrit aussi comme une fragmentation ou une atomisation[^1]. Il n'y a, écrit-il, ni choc ni effroi sans un début de clivage de la personnalité[^5]. Harold Blum décrit la même idée comme une scission entre le moi qui observe et réconforte, et le moi dissocié, traumatisé[^4].\n\n## Le déni qui suit\n\nLe trauma ne se limite pas à l'acte. Ferenczi relevait chez les adultes « l'hypocrisie, les mensonges pathologiques, les dérobades et la collusion silencieuse », ainsi que « la conspiration du silence, la censure, le blâme de l'enfant, et l'auto-blâme de l'enfant »[^4]. Des commentateurs désignent sous le nom de *désaveu* (en portugais, *desmentido*) le refus du monde adulte de reconnaître et d'accueillir l'épisode[^5]. Ce que l'enfant subit s'aggrave de ce que personne ne le confirme : le trauma tient aussi au silence de ceux qui auraient pu entendre.\n\n## Un texte discuté\n\nCette position a un coût théorique. La conviction de Ferenczi sur la réalité des abus sexuels de l'enfance fut l'une des raisons majeures de ses désaccords avec Freud[^7]. Freud parle d'agressions mises en scène, alors que Ferenczi tient le trauma sexuel pour le plus souvent réel[^1].\n\nLe texte n'est pas pour autant à l'abri de la critique. Blum (1994) estime que Ferenczi n'a pas reconnu sa propre tendance au clivage, ni tenu compte de sa subjectivité, et il rattache le trauma qu'il décrit à la maladie de Ferenczi lui-même : une interprétation de Blum, qui n'est pas de Ferenczi[^4]. On peut donc lire ce texte comme une contribution majeure sur le trauma et comme un document de son époque et de son auteur.","quiz":[{"question":"Quelles sont les deux « langues » que distingue Ferenczi ?","choix":["Le hongrois de Ferenczi et l'allemand de Freud","La tendresse, côté enfant, et la passion, côté adulte","La langue du patient et celle de la théorie analytique","Le langage de la conscience et celui de l'inconscient"],"bonne":1,"explication":"Le titre complet parle du « langage de la tendresse et de la passion » : l'enfant se tient dans la tendresse, l'adulte dans la passion. Les autres oppositions ne sont pas celles du texte."},{"question":"Une adulte raconte qu'enfant, maltraitée par un oncle, elle était devenue « la plus sage et la plus serviable » avec lui, et qu'elle se sentait coupable. Quel mécanisme décrit par Ferenczi reconnaît-on ?","choix":["La sublimation, qui transforme la souffrance en œuvre utile","L'identification à l'agresseur, avec la culpabilité de l'adulte introjectée","La formation réactionnelle, qui inverse un désir en son contraire","Le refoulement simple, qui efface tout souvenir de l'épisode"],"bonne":1,"explication":"L'enfant se soumet, devine et devance les désirs de l'adulte qui lui fait peur, et prend sur lui une culpabilité qui n'est pas la sienne. C'est ce que Ferenczi décrit, avant qu'Anna Freud ne reprenne le terme."},{"question":"Comment Freud a-t-il réagi à la communication de Ferenczi ?","choix":["Il a encouragé Ferenczi à présenter sa communication au congrès","Il n'a manifesté aucune réaction particulière","Il a été perturbé et lui a demandé de renoncer à son intervention","Il a repris le texte dans un article de 1936"],"bonne":2,"explication":"Freud fut fortement perturbé par la conception du trauma de Ferenczi et lui demanda de renoncer ; Ferenczi la présenta malgré tout. C'est Anna Freud qui reprend en 1936 le concept d'identification à l'agresseur."},{"question":"Qu'entend-on par identification à l'agresseur dans ce texte ?","choix":["Le désir de l'enfant de se venger plus tard de l'adulte","L'admiration sincère de l'enfant pour l'adulte qui lui fait violence","La décision de l'enfant d'éviter l'adulte à l'avenir","La soumission de l'enfant, qui s'identifie totalement à celui qui l'effraie"],"bonne":3,"explication":"Ferenczi parle de s'identifier totalement à l'agresseur : l'enfant se soumet et intériorise la figure qui lui fait peur. Il ne s'agit ni de vengeance, ni d'admiration, ni d'une simple stratégie d'évitement."}],"sources":[{"texte":"E. Fleury, article sur la « Confusion de langues » de Ferenczi (Cairn)","url":"https://shs.cairn.info/article/SC_001_0037/pdf?lang=fr"},{"texte":"B. Pechberty, article sur Ferenczi, l'identification à l'agresseur et la réaction de Freud (pepsic)","url":"https://pepsic.bvsalud.org/pdf/estic/v24n2/fr_a04v24n2.pdf"},{"texte":"Evzonas, « Sándor Ferenczi's multiple confusions of tongues and their influence on psychoanalytical thinking » (titre original, publication, réaction de Freud)","url":"https://www.alsf-chile.org/Indepsi/Articulos/Trauma-Abuso/Sandor-Ferenczi-multiple-confusions.-of-tongues-and-their-psychoanalytical-thinking.pdf"},{"texte":"H. P. Blum, « The Confusion of Tongues and Psychic Trauma », Int. J. Psycho-Anal. 75 (1994), p. 871-882","url":"https://www.alsf-chile.org/Indepsi/Articulos/Trauma-Abuso/The-Confusion-of-Tongues-and-psychic-trauma.pdf"},{"texte":"A. P. N. Mendes et C. P. França, « Contribuições de Sándor Ferenczi… », Psicologia em Estudo 17 (1), 2012, p. 121-130","url":"https://www.redalyc.org/pdf/2871/287123554014.pdf"},{"texte":"Wikipédia (anglais), « Identification with the aggressor »","url":"https://en.wikipedia.org/wiki/Identification_with_the_aggressor"},{"texte":"Wikipédia (anglais), « Sándor Ferenczi »","url":"https://en.wikipedia.org/wiki/S%C3%A1ndor_Ferenczi"}]},{"id":"wittgenstein-taire","discipline":"philosophie","titre":"Ce dont on ne peut parler","figure":"Ludwig Wittgenstein","branche":"langage","fiabilite":"primaire","fiabilite_note":"Le Tractatus est cité d'après l'édition bilingue allemand-anglais du Project Gutenberg ; les traductions françaises des propositions sont proposées ici.","reference":"Tractatus logico-philosophicus, 5.6, 6.522, 6.54, 7 (1921 en allemand, 1922 en anglais)","accroche":"La dernière phrase du Tractatus est souvent lue comme un rappel à l'ordre. Wittgenstein y voyait plutôt l'essentiel : ce qui compte vraiment ne se dit pas.","punch":"Les limites de mon langage sont les limites de mon monde.","idee":"Le langage peut dire les faits du monde, et seulement eux. L'éthique, le sens de la vie, le mystique ne se disent pas : ils se montrent. Se taire n'est pas les nier, c'est refuser de les rabattre sur ce qui se dit.","citation":"Sur ce dont on ne peut parler, il faut garder le silence.","citation_source":"Wittgenstein, Tractatus logico-philosophicus, proposition 7 — traduit de l'allemand","citation_url":"https://en.wikipedia.org/wiki/Tractatus_Logico-Philosophicus","liens":["husserl-epoche","ferenczi-confusion","lacan-desir-de-l-autre"],"texte":"Le *Tractatus* est un livre court, composé de propositions numérotées, la plupart d'une ou deux lignes. Wittgenstein en a rédigé l'essentiel pendant la Première Guerre mondiale, où il servait comme soldat dans l'armée austro-hongroise, et l'a achevé en 1918. Il paraît en allemand en 1921, puis en édition bilingue anglaise en 1922. Wittgenstein pensait y avoir résolu, pour l'essentiel, les problèmes de la philosophie[^1].\n\nLa dernière proposition, la septième, tient en une ligne.\n\n## Ce que le langage peut dire\n\nLe livre propose une théorie de la proposition comme *image*. Une proposition a un sens si elle représente un état de choses possible, en partageant avec lui une même forme logique. « Le chat est sur le tapis » est vraie ou fausse selon que le monde est ou non ainsi. Le langage sensé, c'est l'ensemble des propositions qui peuvent représenter des faits[^3].\n\nD'où la proposition 5.6 : les limites de mon langage signifient les limites de mon monde[^2]. Ce qui ne peut pas être représenté n'est pas un fait du monde.\n\n> **Illustration.** « Il pleut à Paris » : on peut aller voir. « La tasse est à gauche de l'assiette » : on peut vérifier. Ces phrases ont un sens au sens du *Tractatus*, qu'elles soient vraies ou fausses. Mais « la vie vaut la peine d'être vécue » ? Aucune observation ne la confirmerait ni ne la réfuterait. Elle ne décrit aucun état du monde. Pour le *Tractatus*, elle n'est pas fausse : elle n'est pas, à proprement parler, une proposition.\n\n## Ce qui se montre\n\nQue faire, alors, de l'éthique, de l'esthétique, du sens de la vie ? Ces choses ne sont pas des faits. Wittgenstein ne conclut pas qu'elles n'existent pas. Il distingue *dire* et *montrer*. Il y a assurément de l'inexprimable, écrit-il ; il se montre, c'est le mystique (6.522)[^2].\n\nCe qui se montre ne peut pas être dit, mais il n'est pas rien. Le langage, en disant clairement ce qui peut se dire, signifie par contraste ce qui ne le peut pas.\n\n> **Illustration.** Une personne prend soin, pendant des années, d'un parent malade, sans jamais faire de discours sur le dévouement. Une autre écrit de beaux textes sur la bonté et n'en fait rien. Le sens éthique de la première vie se *montre* dans la manière dont elle est menée ; il ne gagnerait rien à être énoncé. C'est l'intuition que le *Tractatus* formule à sa façon.\n\n## L'échelle\n\nLe livre se retourne alors contre lui-même. Ses propres propositions ne représentent aucun fait : ce ne sont pas des descriptions du monde, mais des remarques sur la logique et le langage. Elles sont donc, à la lettre, dépourvues de sens.\n\nWittgenstein l'assume. Celui qui le comprend, dit la proposition 6.54, finit par reconnaître ces propositions comme dépourvues de sens, en s'en servant comme d'une échelle pour monter au-delà ; il doit, pour ainsi dire, jeter l'échelle après y être monté[^2].\n\nLa septième proposition prend alors son poids. Il ne s'agit pas d'interdire de parler de l'important. Il s'agit de ne pas le dégrader en le traitant comme une thèse parmi d'autres.\n\nWittgenstein l'écrit à l'éditeur Ludwig von Ficker, à qui il proposait son manuscrit : son ouvrage se compose de deux parties, celle qui est présentée ici et tout ce qu'il n'a pas écrit ; et c'est précisément cette seconde partie qui est la plus importante[^1].\n\n> **Illustration.** Après un deuil, des amis viennent avec des phrases toutes faites : « il est mieux là où il est », « le temps guérit tout ». Un autre ne dit presque rien, s'assoit, reste. On sent souvent que le second a mieux respecté ce qui se passait. Non pas parce que les mots sont mauvais, mais parce que certains moments ne se laissent pas transformer en énoncés sans être trahis.\n\n## Après le Tractatus\n\nWittgenstein se retire de la philosophie pendant des années, devient instituteur dans des villages autrichiens, puis revient à Cambridge en 1929. Le second Wittgenstein, celui des *Recherches philosophiques*, publiées après sa mort en 1953, critique de nombreuses idées du *Tractatus*. Il abandonne l'idée que le langage a une seule fonction, représenter, au profit des *jeux de langage* : le sens d'un mot, c'est son usage dans une forme de vie[^3].\n\nEntre les deux périodes, une constante : la philosophie n'est pas une doctrine mais une activité de clarification. Elle n'ajoute rien au monde ; elle aide à ne plus se laisser ensorceler par le langage.\n\nIl est frappant que ce philosophe de la logique ait placé l'essentiel du côté du silence. On peut y voir une parenté discrète avec toutes les pratiques qui savent que certaines choses ne se transmettent pas par des énoncés, mais par une présence, une forme, une manière d'écouter.","quiz":[{"question":"Selon la théorie du Tractatus, quand une proposition a-t-elle un sens ?","choix":["Quand elle exprime un sentiment sincère de celui qui parle","Quand elle est logiquement nécessaire et ne peut être fausse","Quand elle représente un état de choses possible, vrai ou faux selon le monde","Quand elle est acceptée par une communauté de locuteurs"],"bonne":2,"explication":"La proposition est une image d'un état de choses possible. La sincérité n'y joue aucun rôle ; les tautologies logiques sont justement dites vides de sens ; l'usage communautaire relève du second Wittgenstein."},{"question":"Que fait Wittgenstein de l'éthique et du sens de la vie ?","choix":["Ils ne peuvent se dire, mais ils se montrent","Il les déclare illusoires et sans valeur","Il en fait le sujet principal des propositions du livre","Il les réduit à des préférences psychologiques"],"bonne":0,"explication":"L'inexprimable existe et se montre : c'est le mystique. Wittgenstein ne le juge pas sans valeur, il le tient même pour l'essentiel. Il refuse justement d'en faire des thèses, et ne le réduit pas à la psychologie."},{"question":"Que signifie l'image de l'échelle à la fin du Tractatus ?","choix":["Qu'il faut lire le livre plusieurs fois pour le comprendre","Que les propositions du livre, dénuées de sens, se rejettent une fois comprises","Que la philosophie progresse par étapes vers la vérité absolue","Que la logique est supérieure à l'éthique dans l'ordre du savoir"],"bonne":1,"explication":"Les propositions du Tractatus ne représentent aucun fait : elles servent d'échelle qu'on rejette après y être monté. Il ne s'agit ni d'une méthode de lecture, ni d'un progrès vers l'absolu, ni d'une hiérarchie entre logique et éthique."},{"question":"Dans un débat, quelqu'un tente de « prouver » par des arguments que la vie de son ami défunt avait un sens. Que suggérerait le Tractatus ?","choix":["Que l'argument doit être plus rigoureux pour aboutir","Que ce sens peut se montrer, mais qu'il ne relève pas de propositions démontrables","Que la question n'a aucune importance, puisqu'elle n'est pas un fait","Que seule la science peut trancher une telle question"],"bonne":1,"explication":"Le sens de la vie n'est pas un fait du monde : il ne se dit pas en propositions, mais il n'est pas rien, il se montre. Wittgenstein le tient même pour l'essentiel, ce qu'il écrit à Ludwig von Ficker."}],"sources":[{"texte":"Tractatus Logico-Philosophicus : rédaction, propositions principales, lettre à Ludwig von Ficker (Wikipédia)","url":"https://en.wikipedia.org/wiki/Tractatus_Logico-Philosophicus"},{"texte":"Wittgenstein, Tractatus Logico-Philosophicus, éd. bilingue allemand-anglais, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/5740"},{"texte":"Stanford Encyclopedia of Philosophy, « Ludwig Wittgenstein »","url":"https://plato.stanford.edu/entries/wittgenstein/"}]},{"id":"green-mere-morte","discipline":"psychanalyse","titre":"La mère morte","figure":"André Green","branche":"objet","fiabilite":"secondaire","fiabilite_note":"Le texte de Green n'a pas été consulté : la fiche passe par des commentateurs qui le citent. Les notions de « deuil blanc », de « trou » et de désinvestissement, souvent associées à ce texte, ne sont pas reprises, faute de source consultée qui les rapporte.","reference":"« La mère morte » (1980), dans Narcissisme de vie, narcissisme de mort, Minuit, 1983, p. 222-253","accroche":"Elle est là, elle nourrit, elle répond. Et pourtant elle est ailleurs. Green décrit ce que devient un enfant dont la mère est vivante, mais psychiquement absente.","punch":"La mère n'est pas morte. C'est sa présence psychique qui s'est éteinte.","idee":"Pour Green, la « mère morte » est une mère vivante mais plongée dans une absence dépressive, qui n'investit plus son enfant. L'enfant s'identifie à elle « en négatif », et en garde des défenses narcissiques et des difficultés d'attachement.","repere":"Le texte de Green date de 1980 : conférence à la Société psychanalytique de Paris le 20 mai 1980, puis chapitre de Narcissisme de vie, narcissisme de mort (Minuit, 1983). Sa traduction anglaise, « The Dead Mother », figure dans On Private Madness (Hogarth, 1986). Il ne s'agit pas d'une mère réellement décédée : le mot « morte » est une métaphore.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","freud-deuil-melancolie"],"texte":"André Green, psychanalyste français né au Caire en 1927 et mort à Paris en 2012, est membre de la Société psychanalytique de Paris à partir de 1965 et la préside de 1986 à 1989[^3]. En 1980, il y consacre une communication à une figure rencontrée en clinique : la « mère morte ». Le texte est présenté en conférence à la Société psychanalytique de Paris le 20 mai 1980[^5], puis paraît en 1983 dans *Narcissisme de vie, narcissisme de mort* (Éditions de Minuit, p. 222-253)[^1].\n\n## Une mère vivante, absente\n\nLe titre trompe volontairement. Il ne s'agit pas du deuil réel d'une mère. Le « complexe de la mère morte » est celui d'une mère physiquement présente mais plongée dans « une absence dépressive », qui la prive de la capacité d'investir psychiquement son enfant[^1]. Elle est psychologiquement inaccessible, comme éteinte, peut-être après un deuil dans sa propre famille[^2].\n\nTout tient au décalage entre ce que l'enfant voit et ce qu'il éprouve. La mère est là, elle accomplit les gestes. Mais ce qui faisait d'elle une présence vivante pour l'enfant s'est retiré, sans qu'il puisse comprendre pourquoi.\n\n> **Illustration (pas un cas de Green).** Une enfant de quatre ans montre un dessin à sa mère, qui répond « c'est joli » sans lever les yeux. Le lendemain, c'est pareil, et la semaine suivante aussi. La mère prépare les repas, accompagne à l'école, rien ne manque matériellement. L'enfant, elle, ne sait pas que sa mère traverse une épreuve qu'elle ne dit pas. Elle ne voit qu'une chose : ce qui l'animait jusque-là ne produit plus d'effet. C'est ce vide, et pas un abandon réel, que le concept désigne.\n\n## Ce que fait l'enfant\n\nQue devient l'enfant ? Pour Green, il construit une sorte de doublure protectrice, qui prend la forme d'une « identification en négatif » avec la mère morte. Cette identification détermine ensuite le destin de ses investissements, libidinaux, objectaux et narcissiques[^1]. L'enfant se met à l'unisson de l'absence plutôt que de lutter contre elle.\n\nGreen décrit aussi le fantasme qui en résulte : il viserait « à nourrir la mère morte, à la maintenir perpétuellement embaumée », et il parle d'un « fantasme vampirique inversé »[^4]. Ces images, citées ici en traduction, sont celles de Green, rapportées par un commentaire récent.\n\n> **Illustration.** Un adulte décrit son enfance en disant qu'il était « le petit garçon sage », qui ne demandait rien. Aujourd'hui, il se fait vite oublier dans les groupes, fait passer les autres avant lui, et ne comprend pas pourquoi il se sent à la fois irremplaçable et invisible. On pourrait y entendre une trace de cette identification à une absence, mais seule une analyse peut en décider ; l'exemple illustre la structure, pas un diagnostic.\n\n## Les défenses et leurs effets\n\nLes sources s'accordent sur quelques effets. L'enfant intériorise un « noyau émotionnel dur et sans réponse » ; on relève un narcissisme destructeur, des difficultés d'attachement, et, en analyse, une « résistance majeure au progrès dans le transfert »[^2]. On décrit aussi un sentiment d'abandon psychologique et des défenses narcissiques[^4].\n\nGreen décrit encore une destructivité mise au service de l'appareil psychique à des fins défensives, avec ce paradoxe qu'elle « se sert de la destructivité contre la destructivité ». Et quand l'absence de l'objet devient une menace de disparition de soi, l'enfant peut se replier sur un mode auto-érotique, une forme de « narcissisme négatif »[^1].\n\nUne lecture du concept résume la situation : l'enfant reste prisonnier d'une mère morte psychiquement mais très présente, et connaît une triangulation œdipienne précoce et boiteuse[^6]. La formule est celle d'une commentatrice, non de Green.\n\n## Un voisinage avec d'autres fiches\n\nLe concept se tient dans un voisinage, et les rapprochements qui suivent sont proposés comme repères de lecture, non comme des thèses de Green. Chez Winnicott, la mère « suffisamment bonne » s'adapte à son enfant puis se désadapte progressivement : la mère morte en est une sorte d'envers, ni présente ni absente. Chez Bion, la rêverie suppose une mère capable de recevoir ce que le bébé projette ; ici, la projection rencontre une surface qui ne répond pas. Et chez Freud (*Deuil et mélancolie*), il est question d'un objet perdu auquel on reste attaché.\n\n## Ce que le concept ne dit pas\n\nLe concept décrit une configuration clinique, repérée chez des patients adultes. Il ne dit pas que toute mère déprimée produit cet effet, ni qu'une mère est « responsable » : les sources consultées ne le disent pas, et rien ne permet de le leur faire dire.","quiz":[{"question":"Que désigne la « mère morte » chez André Green ?","choix":["Une mère décédée dans la petite enfance de son enfant","Une mère qui rejette activement son enfant et le punit","Une mère vivante, mais psychiquement absente et déprimée","Une mère trop présente, qui étouffe son enfant de soins"],"bonne":2,"explication":"Il s'agit d'une mère physiquement présente mais dans « une absence dépressive », qui ne peut plus investir son enfant. Le mot « morte » est une métaphore, pas un décès réel."},{"question":"Quelle est la réaction de l'enfant décrite par Green ?","choix":["Il se révolte ouvertement contre sa mère jusqu'à l'adolescence","Il s'identifie à elle « en négatif », comme une doublure protectrice","Il oublie sa mère et s'attache aussitôt à un autre adulte","Il réclame davantage de soins pour la réveiller"],"bonne":1,"explication":"Green décrit une « identification en négatif » avec la mère morte, construite comme une doublure protectrice, qui oriente ensuite les investissements de l'enfant."},{"question":"Dans quel livre le texte « La mère morte » a-t-il été publié en 1983 ?","choix":["L'Interprétation des rêves","Au-delà du principe de plaisir","Le Travail du négatif","Narcissisme de vie, narcissisme de mort"],"bonne":3,"explication":"Le texte, écrit en 1980, figure aux pages 222-253 de Narcissisme de vie, narcissisme de mort (Minuit, 1983). Le Travail du négatif est un autre ouvrage de Green, paru en 1993."},{"question":"Un patient décrit une mère « toujours là, jamais là » et dit avoir été un enfant qui ne demandait jamais rien. Quel rapprochement avec Green est le plus prudent ?","choix":["Diagnostiquer aussitôt un complexe de la mère morte, puisque les signes concordent","Garder l'hypothèse d'une identification à une absence, que seule l'analyse peut confirmer","Conclure que sa mère est responsable de toutes ses difficultés","Écarter Green, puisque sa mère était physiquement présente"],"bonne":1,"explication":"Le concept décrit une configuration clinique, pas un diagnostic à plaquer. La présence physique de la mère est justement au cœur de la notion ; et Green ne fait pas de la mère une coupable."}],"sources":[{"texte":"A. Lindenmeyer, « Au risque d'un destin mélancolique de la perte chez un enfant adopté », Psychologie clinique et projective (2013), p. 151-166 (référence de Green, définition, identification en négatif)","url":"https://shs.cairn.info/revue-psychologie-clinique-et-projective-2013-1-page-151?lang=fr"},{"texte":"Wikipédia (anglais), « Dead mother complex »","url":"https://en.wikipedia.org/wiki/Dead_mother_complex"},{"texte":"Wikipédia (anglais), « André Green (psychoanalyst) » (biographie, SPP, Le Travail du négatif)","url":"https://en.wikipedia.org/wiki/Andr%C3%A9_Green_(psychoanalyst)"},{"texte":"Qiao, « The Shadow of the Dead Mother », TAP Magazine (2025)","url":"https://tapmagazine.org/all-articles/the-shadow-of-the-dead-mother"},{"texte":"Article de Psychoanalysis (HSE) sur la conférence du 20 mai 1980","url":"https://psychoanalysis-journal.hse.ru/article/download/11724/12535"},{"texte":"Proia-Lelouey (2023), lecture du concept, Qeios","url":"https://www.qeios.com/read/0O821D/pdf"}]},{"id":"nietzsche-ressentiment","discipline":"philosophie","titre":"Le ressentiment","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"primaire","fiabilite_note":"Le texte de Nietzsche est cité d'après la traduction anglaise de Horace B. Samuel (1913), dans le domaine public ; les traductions françaises des citations sont proposées ici.","reference":"Généalogie de la morale, première dissertation, § 6–13 (1887)","accroche":"« Bon » et « méchant » ne sont pas des évidences. Nietzsche fait la généalogie d'une valeur qui naît, dit-il, d'une vengeance qui n'a pas pu avoir lieu.","punch":"Le ressentiment ne peut pas agir. Alors il invente des valeurs.","idee":"La morale noble dit oui à elle-même et nomme ensuite « mauvais » ce qui ne lui ressemble pas. La morale du ressentiment commence par un non : elle désigne d'abord le « méchant », l'autre, puis se définit comme « bonne » par contraste. Une vengeance imaginaire devient créatrice de valeurs.","citation":"The revolt of the slaves in morals begins in the very principle of resentment becoming creative and giving birth to values","citation_source":"Nietzsche, Généalogie de la morale, I, § 10 (1887), trad. anglaise H. B. Samuel — « La révolte des esclaves dans la morale commence lorsque le ressentiment lui-même devient créateur et enfante des valeurs »","citation_url":"https://www.gutenberg.org/ebooks/52319","liens":["hegel-maitre-esclave","nietzsche-perspectivisme","spinoza-desir"],"texte":"La *Généalogie de la morale* paraît en 1887 avec un sous-titre qui annonce le ton : *Eine Streitschrift*, « un écrit polémique »[^2]. Nietzsche n'y demande pas ce qui est bien ou mal. Il demande d'où viennent nos évaluations, quels besoins elles servent, et quelle valeur ont ces valeurs elles-mêmes : c'est cette valeur des valeurs qu'il faut mettre en question[^2].\n\nLa morale y devient un symptôme : un signe qu'il faut interpréter, comme un médecin interprète une fièvre.\n\n## Deux manières d'évaluer\n\nLa première dissertation oppose deux couples de mots, dont l'origine, selon Nietzsche, n'est pas du tout la même[^2].\n\n**Bon et mauvais** (*gut* et *schlecht*) : c'est l'évaluation noble. Les forts, les bien-portants, les puissants commencent par se dire oui à eux-mêmes. « Bon » désigne d'abord leur propre manière d'être, leur santé, leur fierté. « Mauvais » ne vient qu'après, comme un terme secondaire, pour désigner le commun, ce qui leur est étranger.\n\n**Bon et méchant** (*gut* et *böse*) : c'est l'évaluation née du ressentiment. Elle procède à l'inverse. Elle commence par concevoir « le méchant », c'est-à-dire l'autre, le fort, celui qui domine. Et c'est seulement ensuite, par contrecoup, qu'elle se pense elle-même comme « bonne » : bon, c'est celui qui n'est pas comme lui.\n\n## Une action détournée\n\nLe § 10 nomme le mécanisme. La révolte des esclaves dans la morale commence lorsque le ressentiment devient créateur et engendre des valeurs[^1]. C'est le ressentiment d'êtres à qui la vraie réaction, celle de l'action, est refusée, et qui sont « contraints de trouver leur compensation dans une vengeance imaginaire »[^1].\n\nAlors que la morale noble naît d'un oui triomphant à soi-même, la morale des esclaves « dit non dès le départ » à ce qui est extérieur, autre, différent[^1]. Et ce non est son acte créateur. Elle a besoin d'un monde hostile pour exister : son action est fondamentalement une réaction.\n\n> **Illustration (pas un exemple de Nietzsche).** Un employé humilié par son chef ne peut ni répondre ni partir. Le soir, il se raconte une autre histoire : ce chef est arrogant, vulgaire, obsédé par l'argent, alors que lui est modeste, honnête, désintéressé. Peut-être est-ce vrai en partie. Mais l'ordre compte : il a d'abord défini l'autre comme mauvais, et c'est à partir de là qu'il s'est trouvé bon. Sa vertu est née de son impuissance. C'est la structure que Nietzsche décrit, à l'échelle d'une civilisation.\n\n## L'agneau et l'oiseau de proie\n\nLe § 13 contient une fable célèbre. Que les agneaux en veuillent aux grands oiseaux de proie, rien d'étonnant[^1]. Mais ils en tirent un raisonnement moral : ces oiseaux sont méchants ; donc celui qui leur ressemble le moins, l'agneau, est bon. Or, note Nietzsche, c'est une erreur de tenir les bêtes de proie pour « méchantes »[^2].\n\nLe coup décisif est l'invention d'un *sujet* séparé de ce qu'il fait. On exige alors de la force qu'elle ne se manifeste pas comme force, comme si l'oiseau de proie était un agent neutre, libre d'être agneau s'il le voulait. Or, dit Nietzsche, il n'y a pas d'« être » derrière le faire, l'agir, le devenir[^1]. L'action est tout.\n\nLa croyance en un sujet libre qui pourrait choisir d'être faible permet alors de transformer la faiblesse en mérite. L'agneau ne se dit plus « je ne peux pas » ; il se dit « je ne veux pas, parce que je suis bon ».\n\n> **Illustration.** « Moi, je ne pourrais jamais écraser les autres pour réussir. » La phrase peut exprimer une vraie valeur. Elle peut aussi transformer en choix moral ce qui était d'abord une incapacité, ou une peur. Nietzsche ne dit pas qu'elle est toujours hypocrite. Il invite à se demander, chaque fois, laquelle des deux voix parle.\n\n## Contre deux contresens\n\n**Ce n'est pas un appel à la cruauté.** Nietzsche ne recommande pas de redevenir des oiseaux de proie. Il juge d'ailleurs que c'est avec la forme sacerdotale de l'existence que l'homme devient « pour la première fois un animal intéressant » (§ 6)[^1], qu'il acquiert de la profondeur. La généalogie est un diagnostic, pas un programme de retour en arrière.\n\n**Ce n'est pas seulement une histoire des mots.** La généalogie interroge l'émergence de nos croyances, une méthode que Foucault reprendra plus tard[^2]. Elle lit les valeurs à partir des types de vie qu'elles expriment. Sa question n'est pas seulement « est-ce vrai ? », mais « quel type d'homme a besoin de croire cela ? ».\n\n> **Illustration, pour soi.** Il arrive qu'un jugement moral procure un soulagement un peu trop vif : l'indignation contre quelqu'un qui réussit, le plaisir de le voir échouer, la satisfaction d'être « du bon côté ». La démarche de Nietzsche invite à prendre ce plaisir lui-même comme un indice. Qu'est-ce qu'il permet de ne pas sentir ? Quelle impuissance vient-il réparer ?\n\n## Pourquoi lire ce texte aujourd'hui\n\nOn peut contester l'histoire que raconte Nietzsche, et beaucoup l'ont fait ; sa critique de la morale reste l'objet de discussions abondantes[^3]. Mais la structure qu'il dégage reste un outil d'une grande finesse : une valeur peut être l'expression d'une blessure plutôt que d'une conviction, et le non adressé à l'autre peut être la manière dont un sujet se fabrique une identité. La psychanalyse retrouvera, avec d'autres mots, cette idée que nos jugements portent la marque de ce qui nous manque.","quiz":[{"question":"Comment procède l'évaluation noble selon Nietzsche ?","choix":["Elle commence par un oui à soi-même ; « mauvais » ne vient qu'ensuite","Elle commence par désigner l'ennemi comme méchant, puis se dit bonne","Elle reçoit ses valeurs d'une révélation divine transmise par les prêtres","Elle s'appuie sur un calcul d'utilité sociale, l'utile étant le bon"],"bonne":0,"explication":"La morale noble affirme d'abord sa propre manière d'être ; « mauvais » est un terme secondaire. Désigner d'abord l'ennemi comme méchant caractérise au contraire la morale du ressentiment."},{"question":"Que signifie que le ressentiment devient « créateur » ?","choix":["Qu'il produit des œuvres d'art remarquables","Qu'il pousse à l'action violente et immédiate","Que, privé d'action réelle, il se venge en inventant des valeurs","Qu'il permet de fonder des institutions politiques stables"],"bonne":2,"explication":"Le ressentiment est le fait d'êtres à qui la réaction par l'action est refusée : ils se dédommagent par une vengeance imaginaire qui crée des valeurs."},{"question":"Une collègue brillante est promue ; un autre, resté en place, déclare : « Moi au moins, je ne lèche les bottes de personne. » Qu'est-ce qui, dans une lecture nietzschéenne, signale le ressentiment ?","choix":["Le fait de juger moralement une promotion, ce qui est toujours suspect","L'ordre : il désigne d'abord l'autre comme fautive, puis s'en déduit vertueux","La jalousie, qui suffit à rendre son jugement faux sur tous les points","La franchise de la remarque, puisque le ressentiment se tait toujours"],"bonne":1,"explication":"Ce qui compte n'est pas la vérité du reproche, mais sa structure : un non adressé à l'autre, dont on tire ensuite sa propre valeur. C'est l'ordre « méchant, donc bon » de la morale du ressentiment."},{"question":"Que conteste Nietzsche dans la fable de l'agneau et de l'oiseau de proie ?","choix":["Que l'agneau ait des raisons d'en vouloir aux oiseaux de proie","L'idée d'un sujet neutre derrière l'action, libre d'être fort ou faible","Le fait que les oiseaux de proie mangent les agneaux","La possibilité pour l'agneau de survivre aux oiseaux"],"bonne":1,"explication":"Il n'y a pas d'« être » derrière le faire : la fiction d'un sujet libre permet d'imputer la force comme une faute et la faiblesse comme un mérite. Le grief de l'agneau, lui, n'a rien d'étonnant."}],"sources":[{"texte":"Nietzsche, The Genealogy of Morals, trad. Horace B. Samuel (1913), Project Gutenberg","url":"https://www.gutenberg.org/ebooks/52319"},{"texte":"Wikipédia (anglais), « On the Genealogy of Morality » (sous-titre, valeur des valeurs, bon/mauvais et bon/méchant, méthode généalogique)","url":"https://en.wikipedia.org/wiki/On_the_Genealogy_of_Morality"},{"texte":"Stanford Encyclopedia of Philosophy, « Nietzsche's Moral and Political Philosophy »","url":"https://plato.stanford.edu/entries/nietzsche-moral-political/"}]},{"id":"lacan-ne-pas-ceder","discipline":"psychanalyse","titre":"Ne pas céder sur son désir","figure":"Jacques Lacan","branche":"lacan","fiabilite":"secondaire","fiabilite_note":"La maxime est donnée d'après la traduction anglaise de Dennis Porter, citée par une encyclopédie lacanienne en ligne ; le texte français de la leçon et sa page dans l'édition du Seuil n'ont pas été retrouvés dans une source accessible.","reference":"Le Séminaire, livre VII. L'éthique de la psychanalyse (1959-1960), éd. J.-A. Miller, Seuil, 1986","accroche":"La phrase ressemble à un slogan de développement personnel. C'est presque l'inverse : une éthique qui se mesure à Antigone, et qui ne promet aucun bonheur.","punch":"Une seule faute, au regard de l'analyse : avoir cédé sur son désir.","idee":"L'éthique de la psychanalyse n'est pas une morale du bien ni du bonheur. Elle pose une question : avez-vous agi conformément au désir qui vous habite ? Céder sur son désir est la seule faute qu'elle reconnaît. Antigone, qui ne cède pas, en est la figure tragique.","citation":"the only thing of which one can be guilty is of having given ground relative to one's desire","citation_source":"Lacan, Le Séminaire, livre VII (1959-1960), trad. anglaise D. Porter (1992), telle que citée sur nosubject.com — en français : « la seule chose dont on puisse être coupable, c'est d'avoir cédé sur son désir »","citation_url":"https://nosubject.com/Seminar_VII","liens":["lacan-desir-de-l-autre","spinoza-desir","kant-lumieres"],"texte":"Le Séminaire VII, tenu en 1959-1960 et publié par Jacques-Alain Miller aux éditions du Seuil en 1986, porte sur l'éthique. On y voit un tournant dans l'œuvre de Lacan : il y est question de Kant, de la figure de la mère comme Autre réel et de *das Ding*, « la Chose »[^3].\n\nLa maxime qu'on en retient, « ne pas céder sur son désir », est devenue une sorte de formule de la psychanalyse lacanienne. Les commentateurs la présentent comme une maxime, c'est-à-dire comme un condensé de la position du séminaire plutôt que comme une phrase isolée : « Ne pas céder sur son désir, telle est la maxime », écrit Thatyana Pitavy[^4]. Ce que dit Lacan lui-même est un peu différent, et plus intéressant.\n\n## La question de l'éthique\n\nL'argument du séminaire tient en deux temps. D'abord, la morale traditionnelle : l'éthique de la tradition, celle d'Aristote, de Kant et d'autres moralistes, s'organise autour de ce que Lacan appelle le « service des biens », qui place le travail et l'ordre avant le désir. Ensuite, l'éthique analytique : elle se ramène à une question, « Avez-vous agi conformément au désir qui vous habite ? » (p. 314 de l'édition anglaise)[^2].\n\nCe déplacement est important. L'éthique de la psychanalyse ne demande pas si l'acte était bon, ni utile, ni conforme à la loi. Elle demande si le sujet a trahi quelque chose en lui.\n\n> **Illustration (pas un cas de Lacan).** Quelqu'un renonce, à vingt-cinq ans, à un projet qui comptait pour lui, parce qu'il faut un revenu stable, une place, de la sécurité. Chaque raison est raisonnable, et personne ne lui en voudrait. Quinze ans plus tard, une insatisfaction diffuse le suit partout, qu'il ne parvient pas à expliquer. La maxime ne dit pas qu'il aurait dû tout abandonner pour son projet. Elle dit que la question mérite d'être posée : y a-t-il là quelque chose auquel il a cédé ?\n\n## La seule faute\n\nLacan énonce la formule dans une version à la fois très simple et très dure. Dans la traduction anglaise de Dennis Porter, elle se lit ainsi : « the only thing of which one can be guilty is of having given ground relative to one's desire »[^1]. La seule chose dont on puisse être coupable est d'avoir cédé sur son désir.\n\nElle déplace le sens de la culpabilité : le sentiment de culpabilité se rattache à l'idée d'avoir « cédé » sur son désir[^1]. La formule ne dit pas qu'il faille s'abandonner à toutes ses envies ; elle dit où se loge, selon Lacan, la faute qui compte.\n\n## Antigone\n\nPour donner un visage à cette position, Lacan prend la tragédie de Sophocle, où Antigone donne une sépulture à son frère Polynice malgré l'interdit du roi Créon, et le paie de sa vie. Antigone y est la figure de celle qui ne « cède » pas, « même au prix de sa vie »[^1]. Elle se situe dans ce que Lacan appelle l'*entre-deux-morts*, un espace entre la mort biologique et la mort symbolique. Et la tragédie est traitée « non comme une leçon morale mais comme un lieu privilégié » où la question du désir apparaît[^1].\n\nCet exemple empêche de lire la maxime comme un encouragement. Antigone ne finit pas heureuse. La fidélité à son désir la mène à la mort. La position qu'elle tient a un prix, et Lacan ne la recommande pas à tout le monde : il en fait un point de repère pour penser l'éthique.\n\n## La Chose et la sublimation\n\nLe séminaire donne à ce désir un horizon. *Das Ding* est « un objet primordial, perdu », qui reste en dehors de la symbolisation. Lacan y redéfinit aussi la sublimation comme « l'élévation d'un objet à la dignité de la Chose »[^1].\n\n## Ce que la maxime ne dit pas\n\nLe désir dont il s'agit ne se confond pas avec l'envie. Pitavy parle d'un « désir averti », c'est-à-dire d'un désir qu'une analyse a permis de reconnaître, et pas d'un caprice immédiat[^4]. Dans une conférence de 2020, Pierre Bruno glose aussi la maxime : ne pas céder sur son désir, c'est ne pas se détourner de l'*atè*[^5]. Ces lectures sont celles de commentateurs, et non des citations du séminaire.\n\n> **Illustration (un parallèle clinique).** Un patient demande à son analyste de lui dire s'il doit quitter son emploi. L'analyste ne répond pas par un conseil. Ce refus n'est pas de l'indifférence : dans l'esprit du séminaire, la cure ne vise pas le « bien » du patient selon une norme extérieure, mais la question de ce qu'il désire, lui.","quiz":[{"question":"Comment se résume l'éthique analytique dans le Séminaire VII ?","choix":["Par la question « Avez-vous fait le bien autour de vous ? »","Par la question « Avez-vous agi conformément au désir qui vous habite ? »","Par la question « Avez-vous obéi aux lois de votre cité ? »","Par la question « Avez-vous cherché le plus grand bonheur ? »"],"bonne":1,"explication":"L'éthique analytique se ramène à la question : « Avez-vous agi conformément au désir qui vous habite ? » Elle s'oppose à la morale traditionnelle du « service des biens », qui met l'ordre et le travail avant le désir."},{"question":"Qu'est-ce que Lacan appelle le « service des biens » ?","choix":["Le fait d'offrir des cadeaux à ses proches pour s'en faire aimer","Le paiement des séances par le patient, qui engage la cure","La charité envers les plus pauvres, prônée par l'Église","L'éthique traditionnelle, qui place le travail et l'ordre avant le désir"],"bonne":3,"explication":"Le « service des biens » désigne l'organisation de la morale traditionnelle (Aristote, Kant et d'autres), où le travail et l'ordre passent avant le désir. Ce n'est ni la charité, ni un paiement, ni des cadeaux."},{"question":"Quel rôle joue Antigone dans le séminaire ?","choix":["Elle figure celle qui ne cède pas, même au prix de sa vie","Elle représente la soumission aux lois de la cité","Elle est un modèle de bonheur que l'analyste doit proposer","Elle illustre une folie dont la cure doit guérir"],"bonne":0,"explication":"Antigone ne « cède » pas, même au prix de sa vie. Elle se tient entre la mort biologique et la mort symbolique : son sort est tragique, loin de tout bonheur promis."},{"question":"Une amie dit, en citant Lacan : « Ne pas céder sur son désir, c'est s'autoriser tout ce dont on a envie. » Que répondre ?","choix":["Qu'elle a raison : la maxime invite à satisfaire chaque envie immédiate","Que le désir dont parle Lacan n'est pas l'envie : c'est un désir « averti », à reconnaître","Que la maxime interdit au contraire tout désir, au profit du devoir","Que la formule n'a aucun rapport avec l'éthique"],"bonne":1,"explication":"Les commentateurs parlent d'un désir « averti », que l'analyse permet de reconnaître, et non d'un caprice. La maxime interroge le rapport du sujet à son désir ; elle ne promet ni le bonheur ni la satisfaction de toutes les envies."}],"sources":[{"texte":"Nosubject.com, « Seminar VII » (maxime, Antigone, entre-deux-morts, das Ding, sublimation ; trad. Porter)","url":"https://nosubject.com/Seminar_VII"},{"texte":"Nosubject.com, « Ethics » (service des biens, question de l'éthique analytique)","url":"https://nosubject.com/Ethics"},{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (Séminaire VII, 1959-1960, éd. Miller, 1986)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"Thatyana Pitavy, texte de séminaire sur « Ne pas céder sur son désir » (freud-lacan.com)","url":"https://freud-lacan.com/wp-content/themes/freudlacan-front/assets/content/2024/02/FINAL-L-16-TXT-ACCORD-T.-PITAVY-05_05_2020.pdf"},{"texte":"Pierre Bruno, conférence de séminaire d'été (29 août 2020) sur l'éthique de la psychanalyse (freud-lacan.com)","url":"https://freud-lacan.com/wp-content/themes/freudlacan-front/assets/content/2024/02/20240216162119-22940-2.pdf"}]},{"id":"ricoeur-soupcon","discipline":"philosophie","titre":"Les maîtres du soupçon","figure":"Paul Ricœur","branche":"fondamentaux","fiabilite":"secondaire","fiabilite_note":"Le livre de Ricœur est présenté à travers Wikipédia, l'Encyclopédie de Stanford et une page de l'université de Pennsylvanie ; il n'a pas été consulté directement.","reference":"De l'interprétation. Essai sur Sigmund Freud, livre I (1965)","accroche":"Marx, Nietzsche, Freud : trois pensées que tout oppose. Ricœur montre qu'elles font le même geste, et qu'il ne suffit pas de démasquer pour comprendre.","punch":"Après Marx, Nietzsche et Freud, la conscience n'est plus crue sur parole.","idee":"Ricœur distingue deux façons d'interpréter. L'une recueille un sens qui s'adresse à nous ; l'autre soupçonne et tient le sens apparent pour un déguisement. Marx, Nietzsche et Freud ont fait du doute sur la conscience une méthode. Mais le soupçon n'est qu'un moment de l'interprétation.","repere":"Herméneutique : art de l'interprétation, d'abord des textes sacrés et juridiques, puis, avec Schleiermacher et Dilthey au XIXe siècle, de toute expression humaine. Ricœur en fait le lieu où se croisent philosophie et psychanalyse.","liens":["nietzsche-perspectivisme","freud-moi-pas-maitre","descartes-malin-genie"],"texte":"En 1965, Paul Ricœur publie un livre de plus de cinq cents pages sur Freud, *De l'interprétation*. L'ouvrage est né de conférences données à l'université Yale en 1961, les Terry Lectures, puis à Louvain en 1962[^1]. Il deviendra l'une des lectures philosophiques les plus rigoureuses de Freud, et l'un de ses chapitres a donné une formule à tout un siècle : les « maîtres du soupçon ».\n\n## Deux manières d'interpréter\n\nRicœur part d'un constat : il n'existe pas une herméneutique générale, une seule bonne manière d'interpréter. Il y a deux pôles opposés, qui se disputent le terrain[^3].\n\n**L'interprétation comme recueil du sens.** Elle aborde un texte, un symbole, un mythe avec une forme de confiance : quelque chose s'y dit, qui nous concerne et nous est adressé. Interpréter, c'est écouter, restaurer un sens. C'est l'attitude de la phénoménologie de la religion, qui décrit le sacré sans le réduire.\n\n**L'interprétation comme exercice du soupçon.** Elle part du principe inverse : le sens apparent est un masque, une ruse. Il faut démystifier, réduire les illusions, remonter du sens manifeste à un sens caché qui le produit[^3].\n\n> **Illustration.** Une personne dit qu'elle donne chaque mois à une association « par pure générosité ». Une lecture de recueil prend la phrase au sérieux : il y a là un geste de solidarité, qui a un sens pour elle. Une lecture de soupçon cherche ce que la générosité recouvre : un avantage fiscal (lecture marxiste), un besoin de se sentir supérieur (lecture nietzschéenne), une culpabilité à apaiser (lecture freudienne). Ricœur ne demande pas de choisir une fois pour toutes ; il demande de comprendre ce que fait chaque lecture.\n\n## Trois maîtres\n\nLe second pôle est dominé, dit Ricœur, par trois maîtres qui semblent s'exclure les uns les autres : Marx, Nietzsche et Freud. Ce qui les réunit malgré tout, c'est d'avoir fait de la conscience elle-même un objet de doute[^2].\n\nDescartes doutait des choses, mais pas de la conscience : ce qu'elle se représentait pouvait être faux, mais que la conscience soit telle qu'elle s'apparaît à elle-même, cela restait certain. Avec les trois maîtres, le doute atteint la conscience. Le sens tel que la conscience le saisit devient un effet, produit par autre chose : l'intérêt de classe et l'idéologie chez Marx, la volonté de puissance chez Nietzsche, le désir inconscient chez Freud[^2].\n\n> **Illustration.** « Je ne me suis pas présenté à ce poste parce qu'il ne m'intéressait pas vraiment. » Pour Descartes, si on le pense, c'est ce qu'on pense. Pour les maîtres du soupçon, la phrase est peut-être le produit d'autre chose : une peur de l'échec, une loyauté envers un milieu d'origine, un ressentiment déguisé en indifférence. La conscience n'est plus le dernier juge de ses propres raisons.\n\n## Démasquer pour comprendre\n\nLe point décisif est souvent oublié. Pour Ricœur, ces trois penseurs ne sont pas des destructeurs, mais les créateurs d'une nouvelle manière d'interpréter. Ils ne se contentent pas de dénoncer : ils inventent un art de déchiffrer, avec ses règles. Ce sont des exégètes du sens, pas des sceptiques qui jettent le sens par la fenêtre[^2].\n\nEt le soupçon n'est pas le dernier mot. Ricœur propose une dialectique : il faut traverser la démystification, renoncer aux idoles, pour pouvoir ensuite écouter autrement. Le soupçon purifie l'écoute ; il ne la remplace pas.\n\n> **Illustration.** Un rêve d'ascension, une montagne gravie avec joie. Le soupçon y lira peut-être un désir de supériorité ou un fantasme infantile de toute-puissance, et il aura peut-être raison. Mais une fois cette lecture faite, il reste la question de ce que ce rêve ouvre pour le rêveur : un projet, un élan, un sens à venir. Ricœur tient aux deux temps.\n\n## Archéologie et téléologie\n\nAppliquée à Freud, cette dialectique donne une thèse forte. La psychanalyse est une *archéologie* du sujet : elle ramène le sens vers l'arrière, vers le désir, l'enfance, ce qui précède la conscience. Il lui faut une contrepartie, une *téléologie*, que Ricœur cherche du côté de Hegel : un mouvement vers l'avant, vers les figures de l'esprit que le sujet n'a pas encore atteintes[^1].\n\n## Une réception orageuse\n\nLe livre est mal reçu dans les milieux lacaniens. Le psychanalyste Jean-Paul Valabrega, dans la revue *Critique*, accuse Ricœur d'avoir emprunté à Lacan sans le dire ; Michel Tort, dans *Les Temps modernes*, en fait une critique sévère au nom de la lecture lacanienne. Ces accusations de plagiat ont été depuis largement contestées[^1].\n\nOn peut discuter la symétrie entre archéologie et téléologie. Elle a le mérite de poser une question que tout clinicien connaît : interpréter, est-ce seulement défaire une illusion, ou aussi rendre possible un sens qui n'existait pas encore ?","quiz":[{"question":"Quelles sont les deux manières d'interpréter que distingue Ricœur ?","choix":["Celle des textes sacrés et celle des textes profanes","Le recueil du sens et l'exercice du soupçon","L'herméneutique juridique et l'herméneutique littéraire","L'herméneutique rationaliste et l'herméneutique empiriste"],"bonne":1,"explication":"Ricœur oppose une interprétation qui écoute un sens qui nous est adressé et une interprétation qui le démasque. Les autres oppositions désignent des domaines ou des écoles, pas ces deux attitudes fondamentales."},{"question":"Qu'est-ce qui rapproche Marx, Nietzsche et Freud selon Ricœur ?","choix":["Une même théorie de l'économie","Une même hostilité à la religion chrétienne","Le fait de soumettre la conscience elle-même au doute","Une même conception de l'inconscient"],"bonne":2,"explication":"Contrairement à Descartes, qui doutait des choses mais pas de la conscience, les trois maîtres font de la conscience un objet de soupçon. Leurs théories sont par ailleurs très différentes, ce que Ricœur souligne en les disant en apparence exclusives."},{"question":"Une patiente raconte qu'elle offre toujours des cadeaux somptueux à sa sœur. Quelle attitude correspond à l'herméneutique que Ricœur défend ?","choix":["S'en tenir au sens déclaré : elle aime sa sœur, rien d'autre","Démasquer une rivalité cachée et s'arrêter là","Chercher ce que le geste recouvre, puis ce qu'il ouvre pour elle","Renoncer à interpréter, puisque toute lecture est arbitraire"],"bonne":2,"explication":"Ricœur tient aux deux temps : traverser le soupçon (ce que le geste masque), puis écouter à nouveau (ce qu'il rend possible). Ni la naïveté, ni le soupçon seul, ni le renoncement."},{"question":"Quel est le statut du soupçon dans la démarche de Ricœur ?","choix":["C'est le dernier mot de toute interprétation véritable","C'est une erreur de méthode dont il faut se garder","C'est une méthode réservée aux sciences sociales","C'est un moment nécessaire, à traverser pour pouvoir écouter autrement"],"bonne":3,"explication":"Ricœur propose une dialectique : le soupçon doit être traversé pour accéder à une écoute renouvelée. Il n'en fait ni le terme ultime, ni une erreur, ni une méthode cantonnée à une discipline."}],"sources":[{"texte":"Freud and Philosophy (De l'interprétation) : genèse, thèses et réception (Wikipédia)","url":"https://en.wikipedia.org/wiki/Freud_and_Philosophy"},{"texte":"« Marx, Nietzsche, Freud: Masters of Suspicion », université de Pennsylvanie","url":"https://web.sas.upenn.edu/psys/?p=790"},{"texte":"Stanford Encyclopedia of Philosophy, « Paul Ricoeur »","url":"https://plato.stanford.edu/entries/ricoeur/"}]},{"id":"austin-quand-dire-c-est-faire","discipline":"philosophie","titre":"Dire, c'est faire","figure":"John L. Austin","branche":"langage","fiabilite":"secondaire","fiabilite_note":"Austin est présenté à travers l'Encyclopédie de Stanford et Wikipédia, qui citent How to Do Things with Words avec ses pages ; le livre lui-même n'a pas été consulté. Les exemples « I bet » et « I promise » ne sont pas attribués à Austin sous une forme précise, faute de l'avoir vérifiée.","reference":"How to Do Things with Words (1962) — Quand dire, c'est faire ; conférences William James, Harvard, 1955","accroche":"Dire « oui » devant un maire ne décrit rien : cela marie. Austin part de ces phrases qui font quelque chose pour rebâtir la théorie du sens.","punch":"Certaines phrases ne décrivent pas le monde. Elles y changent quelque chose.","idee":"Austin remarque que certains énoncés (« je le jure », « oui », « je baptise ce navire ») accomplissent un acte au lieu de décrire. On les juge non pas vrais ou faux, mais réussis ou ratés. Il en tire une théorie : tout énoncé est à la fois dit, fait et produit des effets.","repere":"Le livre reprend les conférences William James données par Austin à Harvard en 1955. Austin meurt en 1960 ; l'ouvrage est publié en 1962 par J. O. Urmson d'après ses notes, et réédité en 1975 par Urmson et Marina Sbisà. Son titre français est Quand dire, c'est faire.","liens":["wittgenstein-taire","ricoeur-soupcon","hegel-maitre-esclave"],"texte":"En 1955, à Harvard, John Langshaw Austin donne les conférences William James. Il meurt en 1960, avant d'avoir publié le livre qu'il en aurait tiré. *How to Do Things with Words* paraît en 1962, édité par J. O. Urmson d'après ses notes, chez Clarendon Press et Harvard University Press ; une seconde édition, revue par Urmson et Marina Sbisà, date de 1975[^2]. On le tient pour le texte fondateur de la théorie des actes de langage[^2]. En français, il s'intitule *Quand dire, c'est faire*[^3].\n\n## Des phrases qui ne décrivent pas\n\nL'idée de départ est simple. On croit souvent qu'une phrase sert à décrire un état de choses, et qu'elle est alors vraie ou fausse. Austin remarque que ce n'est pas le cas de toutes. Certains énoncés ne sont pas des descriptions : ils n'ont pas de valeur de vérité, ou leur énonciation n'est pas une assertion (1962, p. 6)[^1].\n\nLes exemples de référence sont « I name this ship the Queen Elizabeth », prononcé lors d'un baptême, et « I do », le « oui » d'un mariage[^2]. Dans ces cas, dire la formule constitue l'acte lui-même. Austin appelle ces énoncés des *performatifs*, par opposition aux *constatifs*, qui décrivent un fait. Leur forme type est une phrase à la première personne, au présent, à l'indicatif, à la voix active, qui présente son locuteur comme accomplissant un acte, comme « je promets… »[^1].\n\n> **Illustration (pas un exemple d'Austin).** Quelqu'un dit à un ami : « Je te promets de venir samedi. » On ne peut pas répondre « c'est faux » comme on répondrait à « il pleut ». On peut répondre « tu me le promets vraiment ? » ou, plus tard, « tu n'as pas tenu ta promesse ». Dire la phrase, c'est déjà s'engager.\n\n## Réussir ou rater plutôt que vrai ou faux\n\nUn performatif ne se juge donc pas comme vrai ou faux, mais comme réussi ou raté. Austin parle de conditions de félicité : il doit exister, écrit-il, « une procédure conventionnelle acceptée » (*an accepted conventional procedure*, 1962, p. 14), qui implique que certaines personnes disent certains mots dans certaines circonstances[^1].\n\nLes échecs sont de deux sortes. Dans les ratés (*misfires*), l'acte ne se réalise pas : un passant qui baptise un navire devant la reine, en disant « je baptise ce navire *Noam Chomsky* », n'a pas l'autorité nécessaire, et aucun acte n'est accompli. Dans les abus, l'acte est accompli mais sans la sincérité requise : une promesse de déjeuner faite sans aucune intention de la tenir est bien une promesse, mais elle est insincère[^1]. Ces deux exemples sont ceux d'un commentateur, non d'Austin. Il faut enfin que l'acte soit reçu (*uptake*) : on ne peut pas parier avec quelqu'un qui n'accepte pas le pari[^1].\n\n## Trois niveaux dans chaque énoncé\n\nAustin va plus loin. Il abandonne l'opposition simple entre constatifs et performatifs : même les assertions ordinaires partagent des traits des performatifs, comme les conditions de félicité et les engagements, si bien qu'une frontière nette devient difficile à tenir[^2]. Il propose un nouveau départ : s'intéresser à ce qu'on fait en prononçant n'importe quelle phrase.\n\nIl distingue alors trois niveaux. L'acte *locutoire* est la production d'une expression qui a un sens. L'acte *illocutoire* est ce qu'on fait en parlant : avertir, promettre, ordonner, prédire. L'acte *perlocutoire* est l'effet obtenu sur l'auditeur : persuader, effrayer, amuser[^2].\n\nLa phrase « Tu seras plus ponctuel à l'avenir » peut, selon le contexte, être une prédiction, un ordre ou une menace : le même contenu, des forces différentes[^1]. De même, exhorter quelqu'un est une illocution, alors que le persuader est une perlocution, car persuader dépend de l'effet produit[^1].\n\n> **Illustration.** Une enseignante dit à sa classe : « La porte est ouverte. » Le contenu est le même, mais l'acte change selon la situation : un simple constat si un élève demande pourquoi il fait froid, un ordre de la fermer si elle regarde un élève près de la porte. Si l'élève se lève et ferme la porte, l'effet obtenu est l'acte perlocutoire.\n\n## Une première classification\n\nAustin propose aussi une première classification des verbes illocutoires en cinq familles : les verdictifs, les exercitifs, les promissifs, les comportatifs et les expositifs[^1][^2]. John Searle a critiqué cette classification, qu'il juge trop fondée sur le vocabulaire et mal délimitée[^1].\n\n## Pourquoi c'est important\n\nCette approche déplace la question du sens. Plutôt que de demander seulement ce qu'une phrase décrit, on demande ce qu'on fait en la disant, dans quelle situation, et avec quelle autorité. Elle ouvre aux actes de langage une étude qui ne dépend pas de la vérité : on peut promettre, ordonner ou baptiser, et l'on peut échouer sans dire faux.\n\n> **Illustration (un parallèle avec la clinique).** Un patient dit en fin de séance : « De toute façon, je ne reviendrai pas. » On peut se demander si c'est vrai. On peut aussi se demander ce que la phrase fait : une menace, une demande d'être retenu, un test. La question d'Austin, « que fait-on en disant cela ? », est aussi une question d'écoute.","quiz":[{"question":"Que dit Austin des énoncés performatifs ?","choix":["Ils accomplissent un acte et se jugent comme réussis ou ratés, non comme vrais ou faux","Ils décrivent un fait et sont toujours vrais lorsqu'ils sont sincères","Ils sont toujours faux, parce qu'ils n'ont aucun rapport avec le réel","Ils sont réservés aux juges, aux maires et aux autres autorités publiques"],"bonne":0,"explication":"Austin nie que les performatifs soient des descriptions : ils n'ont pas de valeur de vérité ou ne sont pas des assertions. On les évalue selon des conditions de félicité."},{"question":"Un étudiant déclare en plein amphithéâtre : « Je déclare la séance levée. » Personne ne bouge. Pourquoi l'acte échoue-t-il ?","choix":["Parce que la phrase est fausse : la séance n'est pas levée","Parce que l'étudiant était insincère en la prononçant","Parce qu'il n'a pas l'autorité requise par la procédure : c'est un raté","Parce que la phrase n'est pas à la première personne du présent"],"bonne":2,"explication":"Comme le passant qui baptise un navire sans autorité, l'étudiant ne remplit pas une condition de la procédure conventionnelle : l'acte ne se réalise pas. Il ne s'agit ni de fausseté ni d'insincérité, et la forme est bien celle d'un performatif."},{"question":"Quelle est la différence entre acte illocutoire et acte perlocutoire ?","choix":["L'illocutoire est écrit, et le perlocutoire est seulement oral","L'illocutoire est toujours sincère, et le perlocutoire toujours mensonger","L'illocutoire désigne le contenu, et le perlocutoire le volume de la voix","L'illocutoire est ce qu'on fait en parlant ; le perlocutoire, l'effet obtenu"],"bonne":3,"explication":"Promettre, ordonner ou avertir sont des illocutions ; persuader, effrayer ou amuser sont des perlocutions, qui dépendent de l'effet sur l'auditeur."},{"question":"Pourquoi Austin finit-il par abandonner l'opposition simple entre constatifs et performatifs ?","choix":["Parce que les performatifs se révèlent tous faux à l'examen","Parce que même les assertions ordinaires ont des conditions de félicité","Parce que Searle lui a démontré qu'elle était contradictoire","Parce que les constatifs n'existent que dans les langues mortes"],"bonne":1,"explication":"Même une affirmation engage et peut réussir ou rater : la frontière devient difficile à tenir, d'où la théorie générale des actes de langage."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Speech Acts » (performatifs, ratés et abus, locutoire, illocutoire, perlocutoire, pages citées d'Austin)","url":"https://plato.stanford.edu/entries/speech-acts/"},{"texte":"Wikipédia (anglais), « How to Do Things with Words » (conférences de 1955, publication de 1962, exemples d'Austin, abandon de la distinction simple)","url":"https://en.wikipedia.org/wiki/How_to_Do_Things_with_Words"},{"texte":"Notice de catalogue de l'édition française, « Quand dire, c'est faire » (titre français)","url":"https://theses.univ-nantes.fr/vufind/Record/PPN002168065"}]},{"id":"banquet-freud-lacan","discipline":"croisement","titre":"Le Banquet sur le divan","figure":"Platon, Freud, Lacan","branche":"dialogues","fiabilite":"mixte","fiabilite_note":"Le Banquet est cité dans la traduction anglaise de Benjamin Jowett et le passage de Freud dans celle de C. J. M. Hubback (1922), toutes deux dans le domaine public ; la lecture de Lacan, d'après une encyclopédie lacanienne en ligne qui cite le Séminaire VIII.","reference":"Platon, Le Banquet (vers 385 av. J.-C.) ; Freud, Au-delà du principe de plaisir, chap. VI (1920) ; Lacan, Le Séminaire, livre VIII, Le transfert (1960-1961)","accroche":"Un dialogue de Platon sur l'amour revient deux fois dans l'histoire de la psychanalyse : chez Freud, qui y cherche l'origine des pulsions, et chez Lacan, qui y lit le transfert.","punch":"Aimer, c'est donner ce qu'on n'a pas.","idee":"Freud reprend le mythe d'Aristophane, des êtres coupés en deux qui veulent se réunir, pour imaginer des pulsions qui cherchent à rétablir un état antérieur. Lacan lit la fin du dialogue, où Alcibiade prête à Socrate un trésor caché, comme le modèle de l'amour de transfert.","repere":"Dans le Banquet, plusieurs convives font tour à tour l'éloge de l'Amour. Aristophane raconte le mythe des êtres doubles ; Socrate rapporte l'enseignement de Diotime, pour qui l'Amour est fils de Poros (l'Expédient, l'Abondance) et de Pénia (la Pauvreté) ; Alcibiade, ivre, arrive à la fin et fait l'éloge de Socrate.","liens":["platon-reminiscence","freud-transfert","lacan-desir-de-l-autre"],"texte":"Le *Banquet* est un dialogue sur l'amour. Autour d'une table, plusieurs convives prononcent tour à tour un éloge d'Éros. Peu de textes philosophiques ont autant intéressé la psychanalyse : Freud y revient en 1920, Lacan lui consacre une grande partie d'une année de séminaire, en 1960-1961. Chacun y prend un passage différent.\n\n## Le mythe d'Aristophane\n\nLe poète comique Aristophane raconte une fable. Autrefois, la nature humaine était tout autre qu'aujourd'hui. Il y avait trois sexes, et non deux ; les êtres humains étaient doubles. Zeus, pour les affaiblir, les coupa en deux. Depuis, chaque moitié cherche l'autre, et voudrait de nouveau ne faire qu'un[^2][^1]. Aristophane en tire une définition : le désir du tout, la poursuite du tout, voilà ce qu'on appelle l'amour[^1].\n\n## Freud : une pulsion qui veut revenir en arrière\n\nEn 1920, dans *Au-delà du principe de plaisir*, Freud cherche l'origine des pulsions. Il a posé l'hypothèse qu'une pulsion tend à rétablir un état antérieur. Il lui manque une explication de la pulsion sexuelle qui aille dans ce sens. Il la trouve chez Platon.\n\nAu chapitre VI, Freud cite longuement le mythe d'Aristophane : des êtres doubles, coupés en deux par Zeus, et chez chacun le désir de sa moitié, le désir de se réunir de nouveau[^2]. Ce mythe, note-t-il, fait dériver une pulsion de la nécessité de rétablir une situation antérieure[^2]. Freud prend soin de dire qu'il s'agit d'un mythe et non d'une explication scientifique ; mais il remplit la condition qu'il cherchait.\n\n> **Illustration (pas un exemple de Freud).** On dit de deux personnes qui se rencontrent qu'elles ont l'impression de « s'être toujours connues ». Le mythe d'Aristophane donne à ce sentiment une forme saisissante : l'amour comme retrouvailles avec ce qu'on aurait perdu. Freud en retient une structure : un désir tourné vers un état antérieur, plutôt que vers la nouveauté.\n\n## Diotime : l'amour comme manque\n\nSocrate, lui, rapporte l'enseignement d'une étrangère, Diotime. L'Amour n'est pas un dieu comblé : il est fils de l'Abondance et de la Pauvreté[^1]. Il manque toujours de ce qu'il désire, car nul ne désire ce qu'il est ou ce qu'il a déjà[^1].\n\nLacan retiendra cette idée de l'amour comme manque, et la formule qu'il en tire est devenue célèbre : en amour, on donne ce qu'on n'a pas[^3].\n\n## Lacan : Alcibiade et le trésor caché\n\nLe passage que Lacan lit de plus près est la fin du dialogue. Alcibiade, ivre, arrive au banquet et fait l'éloge de Socrate. Il le compare à ces statuettes de silènes, laides au-dehors, qui renferment des images de dieux[^1]. Socrate cache, croit-il, un trésor, un *agalma*, admirable et divin[^3].\n\nDans le Séminaire VIII, tenu de novembre 1960 à juillet 1961 à l'hôpital Sainte-Anne, Lacan lit cette scène comme un modèle de la relation analytique : l'analysant est à la place d'Alcibiade, l'analyste à celle de Socrate[^3]. L'*agalma* désigne l'objet caché et fascinant qu'on prête à l'autre, et dont Lacan juge le rôle dans l'apparition du transfert au moins aussi important que celui du savoir supposé[^4].\n\n> **Illustration (une scène de cure, pas un cas de Lacan).** Un patient finit par dire à son analyste : « Vous, au moins, vous savez ce qui est bon pour moi. » Il prête à l'analyste un trésor de savoir, comme Alcibiade à Socrate. Ce qui fait avancer la cure n'est pas que l'analyste confirme posséder ce trésor ; c'est qu'il ne réponde pas à cette place, pour que la question revienne au patient.\n\n## Deux lectures, deux usages\n\nFreud et Lacan ne cherchent pas la même chose dans le dialogue. Freud y prend un mythe pour soutenir une hypothèse sur la nature des pulsions : il lit le *Banquet* en théoricien. Lacan y lit une scène, celle de l'amour adressé à quelqu'un qui est supposé détenir ce qu'on désire : il le lit en clinicien du transfert, et décrit le dialogue lui-même comme un texte « clinique »[^3].\n\nPour l'amour de transfert, Lacan rappelle deux choses à la fois : qu'il aide la cure, en faisant apparaître les signifiants de l'histoire du sujet, et qu'il peut, sous son aspect imaginaire, faire résistance[^3]. Le *Banquet* tient ensemble ces deux faces : l'éloge passionné d'Alcibiade est à la fois un aveu et un obstacle.\n\n## Ce que Platon apporte à la clinique\n\nPlaton ne pensait évidemment ni aux pulsions ni au transfert. Mais son dialogue fournit à la psychanalyse deux images durables : celle d'un désir qui cherche ce qu'il a perdu, et celle d'un amour qui prête à l'autre ce qui lui manque à lui-même. L'une et l'autre se retrouvent, sous d'autres noms, dans le cabinet de l'analyste.","quiz":[{"question":"Que retient Freud du mythe d'Aristophane ?","choix":["Que l'amour est une illusion qu'il faut dissiper par la raison","Qu'il fait dériver une pulsion de la nécessité de rétablir un état antérieur","Que les êtres humains ont réellement eu quatre bras et quatre jambes","Que la sexualité est d'origine divine et donc sacrée"],"bonne":1,"explication":"Freud y trouve une image de la pulsion comme tendance à rétablir une situation antérieure, tout en précisant qu'il s'agit d'un mythe et non d'une explication scientifique."},{"question":"Que désigne l'agalma dans la lecture de Lacan ?","choix":["Le banquet lui-même, comme lieu de la parole","Le vin que boit Alcibiade avant son éloge","L'objet caché et précieux qu'Alcibiade prête à Socrate","La beauté physique de Socrate, que tous admirent"],"bonne":2,"explication":"Alcibiade compare Socrate aux silènes laids au-dehors qui renferment des images de dieux : l'agalma est ce trésor caché qu'on prête à l'autre, et qui soutient le transfert."},{"question":"Un patient, au bout de quelques mois, idéalise son analyste et lui attribue une sagesse hors du commun. Que suggère la lecture lacanienne du Banquet ?","choix":["Que l'analyste doit confirmer cette sagesse pour renforcer l'alliance","Que le patient occupe la place d'Alcibiade : il prête à l'analyste un trésor","Que la cure a échoué et doit être interrompue","Que le patient reproduit exactement le mythe d'Aristophane"],"bonne":1,"explication":"C'est la scène d'Alcibiade et de Socrate : l'analysant prête à l'analyste un agalma. L'analyste n'a pas à le confirmer ; ce trésor supposé est le moteur et l'enjeu du transfert."},{"question":"Quelle formule Lacan tire-t-il de l'enseignement de Diotime ?","choix":["En amour, on donne ce qu'on n'a pas","En amour, on reçoit ce qu'on mérite","En amour, on retrouve sa moitié perdue","En amour, on possède enfin ce qu'on désire"],"bonne":0,"explication":"Pour Diotime, l'Amour est manque : nul ne désire ce qu'il a déjà. Lacan en tire la formule « donner ce qu'on n'a pas ». La moitié perdue est l'image d'Aristophane."}],"sources":[{"texte":"Platon, Symposium, trad. Benjamin Jowett, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/1600"},{"texte":"Freud, Beyond the Pleasure Principle (1920), trad. C. J. M. Hubback (1922), chap. VI, Project Gutenberg","url":"https://gutenberg.org/ebooks/76031"},{"texte":"nosubject.com, « Le transfert » (Séminaire VIII : dates, Banquet, Socrate et Alcibiade, Diotime)","url":"https://nosubject.com/Le_transfert"},{"texte":"nosubject.com, « Agalma » (Séminaire VIII, éd. Seuil 1991, p. 163-178)","url":"https://nosubject.com/Agalma"}]},{"id":"benjamin-ange-de-l-histoire","discipline":"philosophie","titre":"L'ange de l'histoire","figure":"Walter Benjamin","branche":"histoire","fiabilite":"secondaire","fiabilite_note":"Les citations françaises viennent de la version de Benjamin lui-même, telle que la cite un article de Fabula ; les citations anglaises, d'une page qui n'indique pas son traducteur. Le texte intégral n'a pas été consulté, et l'histoire du tableau (sa possession par Benjamin) n'est pas reprise faute de source.","reference":"« Sur le concept d'histoire » (Über den Begriff der Geschichte, 1940), thèse IX","accroche":"Une tempête pousse un ange vers l'avenir pendant qu'il regarde les ruines derrière lui. Benjamin dit que cette tempête s'appelle le progrès.","punch":"Là où nous voyons une chaîne d'événements, l'ange voit une seule catastrophe.","idee":"Dans sa thèse IX, Benjamin lit un tableau de Klee comme une image de l'histoire : un ange, le visage tourné vers le passé, voit s'accumuler des ruines, tandis qu'une tempête qu'il appelle « Progrès » l'emporte vers l'avenir sans qu'il puisse s'arrêter.","citation":"Nous donnons nom de Progrès à cette tempête","citation_source":"Benjamin, thèse IX, dans sa propre version française (Écrits français, Gallimard, 1991, p. 343-344), citée par Muriel Pic, Fabula, 2017","citation_url":"https://www.fabula.org/colloques/document4666.php","liens":["kant-lumieres","hegel-maitre-esclave","freud-apres-coup"],"texte":"Walter Benjamin écrit « Sur le concept d'histoire » au début de 1940 : c'est son dernier grand texte achevé avant sa tentative de fuite hors de la France de Vichy. Il meurt le 26 septembre 1940, en Espagne[^3]. Le texte est composé de vingt paragraphes numérotés, les « thèses ». Il n'a pas été publié de son vivant : sa première diffusion date du printemps 1942, dans une brochure ronéotypée, *Walter Benjamin zum Gedächtnis*. La traduction française de Pierre Missac paraît dans *Les Temps Modernes* en 1947, et la traduction anglaise de Harry Zohn dans *Illuminations*, en 1968[^3].\n\nLa thèse IX est la plus célèbre. Elle tient en un paragraphe, et c'est une image.\n\n## Le tableau\n\nElle commence par un tableau : « Il y a un tableau de Klee dénommé *Angelus Novus*. » L'œuvre de Paul Klee, une monotypie, est datée de 1920[^3].\n\nBenjamin y voit l'ange de l'histoire. Les citations qui suivent sont celles de sa propre version française, publiée dans ses *Écrits français*[^1] : « Son visage est tourné vers le passé. » Là où nous apparaît une chaîne d'événements, l'ange voit « une catastrophe sans modulation ni trêve, amoncelant les décombres ». La version anglaise dit : « Where we see the appearance of a chain of events, he sees one single catastrophe »[^2].\n\nMais, écrit Benjamin, « une tempête s'est levée, venant du Paradis », et « cette tempête l'emporte vers l'avenir ». Puis vient la phrase qui nomme la tempête : « Nous donnons nom de Progrès à cette tempête »[^1].\n\nCes phrases françaises ne sont pas une traduction après coup : Benjamin avait lui-même rédigé une version française de ses thèses, publiée dans ses *Écrits français* (Gallimard, 1991). La version allemande est traduite dans le troisième volume de ses *Œuvres* (Gallimard, 2000), par Maurice de Gandillac, Pierre Rusch et Rainer Rochlitz[^1]. La thèse IX existe donc en deux langues de la main de son auteur.\n\n## Ce que l'image dit\n\nL'image oppose deux regards sur le temps. Pour le regard ordinaire, l'histoire est une suite d'événements qui s'enchaînent, et le présent est ce qui vient après et améliore. Pour l'ange, le même temps est une accumulation de ruines. L'ange regarde en arrière, et c'est ce qu'il voit qui le définit. Mais il est entraîné en sens inverse, le dos tourné à l'avenir[^3].\n\nOn peut en tirer une lecture, qui est une lecture et non une preuve : le progrès, tel qu'on le vit, avance en laissant derrière lui ce qu'il a détruit. L'image ne dit pas que rien n'a jamais avancé. Elle dit que le récit du progrès oublie ce qu'il laisse sur le bas-côté.\n\n> **Illustration (pas un exemple de Benjamin).** Un guide présente une ville comme une réussite : nouvelles usines, nouveaux quartiers, population doublée. Il montre la hauteur des bâtiments, la rapidité des chantiers. L'ange de Benjamin regarderait la même ville et verrait ce qui a été rasé, déplacé, perdu pour y arriver. Aucun des deux regards n'est faux, mais le premier n'en montre qu'un côté.\n\n## La thèse V, en regard\n\nLa thèse V parle du passé comme d'une image qui ne se laisse saisir qu'au moment où elle apparaît : « The true picture of the past whizzes by »[^2], la vraie image du passé passe en un éclair. Le passé n'est pas un stock disponible. Il est fragile, et il peut disparaître avec chaque présent qui ne s'y reconnaît pas. Les deux thèses se répondent : l'ange voit un passé en ruines, et la thèse V dit que ce passé risque, à chaque instant, de disparaître pour de bon.\n\n> **Illustration (un parallèle avec l'après-coup).** Un souvenir d'enfance, banal pendant des années, revient soudain avec une force nouvelle le jour où une situation présente lui fait écho. Il n'était pas « là » à attendre : c'est le présent qui l'a rendu lisible. La thèse V
