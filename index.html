otte (1772), le diable la prononce lors de sa première apparition devant Alvaro. Lacan aurait découvert le roman à l'occasion d'un colloque sur Cazotte, et il aurait intégré la scène à son graphe du désir, en affirmant qu'il faut se demander sans cesse ce que le grand Autre veut vraiment. Nosubject.com la formule ainsi, en renvoyant au *Séminaire XI* : « Que veut l'Autre de moi ? »\n\n> **Exemple (une illustration).** Un supérieur vous dit seulement : « Passez me voir quand vous avez cinq minutes. » Vous ne dormez pas bien. Qu'est-ce qu'il veut ? Pour quoi me veut-on ? Les hypothèses se multiplient, alors même qu'on ne sait rien. Chacune dit moins ce que veut le supérieur que ce qu'on suppose qu'il attend de vous. Voilà un *Che vuoi ?* ordinaire.\n\n## Ce qu'il faut garder, et ce qu'on ne sait pas\n\nCette fiche s'appuie sur des résumés et des commentaires, plus que sur les textes de Lacan eux-mêmes, dont la formulation exacte, la page et la date varient selon les sources. Les sources citées ne donnent pas toujours les mêmes références pour *Che vuoi ?*, par exemple. On peut tenir comme solide ce qui suit : la formule vient de la lecture de Hegel par Kojève ; Lacan en fait l'axe d'une théorie du désir où celui-ci naît dans l'écart entre besoin et demande ; et la majuscule fait de l'Autre le lieu du langage, non un individu précis, même si des individus (parents, analyste) l'incarnent.","quiz":[{"question":"D'où vient la formule « le désir de l'homme est le désir de l'Autre » ?","choix":["D'une phrase de Freud dans L'interprétation du rêve","D'une lettre de Spinoza sur la liberté","De la lecture de Hegel par Kojève, que Lacan reprend et transforme","D'un passage de Descartes sur la passion"],"bonne":2,"explication":"Stanford y voit un slogan hégélo-kojévien : Kojève fait du désir humain un désir d'un autre désir, un désir de reconnaissance. Lacan le reprend avec une majuscule à « Autre »."},{"question":"Où naît le désir, dans le résumé de la triade lacanienne ?","choix":["Dans la satisfaction complète du besoin biologique","Dans la demande elle-même, quand elle est comblée","Dans l'instinct, indépendamment du langage","Dans l'écart entre le besoin et la demande"],"bonne":3,"explication":"Le besoin est biologique, la demande articule le besoin à l'Autre, et le désir est produit dans l'écart entre les deux. La satisfaction du besoin ne le produit pas, et il ne se confond ni avec la demande ni avec l'instinct."},{"question":"Pourquoi aucun objet ne peut-il satisfaire entièrement la demande ?","choix":["Parce qu'elle est une demande d'amour, qui excède tout objet","Parce que les objets demandés sont toujours trop chers","Parce que l'enfant ne sait pas encore parler","Parce que la demande vient toujours de l'adulte"],"bonne":0,"explication":"Pour la synthèse de nosubject.com, la demande est une demande d'amour : aucun objet ne peut la satisfaire. Ce n'est pas une affaire de prix, d'âge de l'enfant, ni de qui demande."},{"question":"D'où provient la question « Che vuoi ? » que Lacan place dans son graphe du désir ?","choix":["D'un opéra italien du XIXe siècle, où le héros la chante","D'une lettre de Freud à Fliess, où il interroge son propre désir","D'une pièce de Sophocle, où le chœur la pose à Antigone","Du roman de Cazotte, Le Diable amoureux, où le diable la prononce"],"bonne":3,"explication":"Dans le roman de Cazotte (1772), le diable demande « Che vuoi ? » à Alvaro lors de sa première apparition. Lacan l'a intégrée à son graphe pour poser la question de ce que l'Autre veut."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (le slogan « man's desire is the desire of the Other »)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"La demande de reconnaissance de Lacan à Hegel (citations des Écrits, p. 627, et de Kojève, « désir d'un autre désir »), L'Harmattan","url":"https://www.editions-harmattan.fr/media/107060/download/La%20demande%20de%20reconnaissance%20de%20Lacan%20%C3%A0%20Hegel.pdf"},{"texte":"nosubject.com, « Desire of the Other »","url":"https://www.nosubject.com/Desire_of_the_Other"},{"texte":"nosubject.com, « Desire » (besoin, demande, désir ; Che vuoi ?)","url":"https://nosubject.com/Desire"},{"texte":"Wikipédia (anglais), « The Devil in Love »","url":"https://en.wikipedia.org/wiki/The_Devil_in_Love_(novel)"}]},{"id":"spinoza-desir","discipline":"philosophie","titre":"Le désir, essence de l'homme","figure":"Baruch Spinoza","reference":"Éthique, III, prop. 6–9 et Définitions des affects, 1 ; IV, prop. 7 (1677)","accroche":"Nous ne désirons pas une chose parce qu'elle est bonne. Nous la jugeons bonne parce que nous la désirons. Spinoza retourne la morale comme un gant.","punch":"Ce n'est pas parce qu'une chose est bonne que nous la désirons. C'est l'inverse.","idee":"Chaque chose s'efforce de persévérer dans son être : c'est le conatus. Chez l'homme, cet effort conscient de lui-même s'appelle désir. Le bien n'est pas un étalon extérieur que le désir viserait : c'est le nom que nous donnons à ce que nous désirons.","citation":"Le Désir est l'essence même de l'homme en tant qu'elle est conçue comme déterminée à faire quelque chose par une affection quelconque donnée en elle.","citation_source":"Spinoza, Éthique, III, Définitions des affects, 1 — trad. Charles Appuhn","citation_url":"https://shs.cairn.info/article/AFP_015_0033/pdf?lang=fr","liens":["lacan-desir-de-l-autre","nietzsche-ressentiment","aristote-akrasia"],"texte":"Spinoza écrit l'*Éthique* « selon l'ordre géométrique » : définitions, axiomes, propositions démontrées. Le livre paraît après sa mort, en 1677. Au seuil de la troisième partie, il annonce qu'il traitera des actions et des appétits humains comme s'il était question de lignes, de surfaces ou de solides. Ni moquerie, ni lamentation : comprendre.\n\nC'est une déclaration de méthode audacieuse. Les passions humaines, que les moralistes déploraient comme des vices, deviennent des phénomènes naturels, qui ont des causes et des propriétés, comme le reste de la nature.\n\n## Le conatus\n\nTout part d'une proposition d'une simplicité vertigineuse : chaque chose, autant qu'il est en elle, s'efforce de persévérer dans son être (III, 6). Cet effort, le *conatus*, n'est rien d'autre que l'essence actuelle de la chose (III, 7).\n\nUne pierre persévère dans son mouvement, un arbre dans sa croissance, un animal dans sa vie. L'homme aussi. Mais chez lui, cet effort peut être conscient de lui-même.\n\nLe scolie de III, 9 en tire un vocabulaire précis. Rapporté à l'esprit seul, cet effort s'appelle volonté. Rapporté à l'esprit et au corps ensemble, il s'appelle appétit. Et le désir, c'est l'appétit avec la conscience de lui-même. Il n'y a donc pas, chez Spinoza, une faculté rationnelle qui viendrait dompter les appétits de l'extérieur. Il y a un seul effort, plus ou moins clair à lui-même.\n\n## Le renversement\n\nLe même scolie contient la phrase qui fait de Spinoza un penseur scandaleux : nous ne nous efforçons vers rien, nous ne voulons, ne recherchons ni ne désirons rien parce que nous jugeons que c'est bon ; au contraire, nous jugeons qu'une chose est bonne parce que nous nous efforçons vers elle, la voulons, la recherchons et la désirons.\n\nLe bien n'est donc pas une propriété des choses, découverte par l'intellect, qui mettrait ensuite le désir en mouvement. C'est l'inverse : le jugement de valeur est l'expression du désir.\n\n> **Exemple.** Un ami vous explique longuement pourquoi la ville où il vient de déménager est objectivement la meilleure : le climat, les prix, l'ambiance. Un an plus tôt, il ne la connaissait pas. Les raisons sont venues après le choix, pour le justifier. Spinoza ne dit pas que ces raisons sont fausses. Il dit que ce n'est pas d'elles que le désir est parti.\n\n> **Exemple.** Un enfant trouve le chocolat « bon » et les épinards « mauvais ». Personne ne pense qu'il a d'abord constaté une propriété objective des aliments, puis ajusté son désir en conséquence. Spinoza généralise : il en va de même, plus discrètement, pour les adultes, leurs morales et leurs valeurs.\n\n## Pas un relativisme\n\nOn aurait tort d'en conclure que tout se vaut. Spinoza distingue les affects qui augmentent notre puissance d'agir, la joie, et ceux qui la diminuent, la tristesse. Il y a des désirs qui naissent de la raison et des désirs qui naissent des passions, où nous sommes déterminés par des causes extérieures que nous ne comprenons pas.\n\nLa servitude, c'est cela : être mû par des causes qu'on ignore en se croyant libre. Les hommes se trompent en ce qu'ils se croient libres, écrit Spinoza (II, 35, scolie), et cette opinion consiste seulement en ceci qu'ils ont conscience de leurs actions et sont ignorants des causes par lesquelles ils sont déterminés. Dans une lettre, il prend l'image d'un enfant qui croit désirer librement le lait.\n\nLa liberté, pour Spinoza, n'est donc pas l'absence de détermination. Est libre ce qui agit par la seule nécessité de sa nature (I, définition 7). Se libérer, c'est connaître adéquatement ce qui nous détermine, et agir à partir de cette connaissance plutôt que sous l'effet de causes subies.\n\n> **Exemple.** Quelqu'un se met en colère chaque fois qu'un collègue l'interrompt, et il trouve sa colère parfaitement justifiée. Le jour où il comprend que cette interruption rejoue pour lui une humiliation ancienne, quelque chose change : la colère ne disparaît pas sur commande, mais elle cesse d'être une évidence. Il passe, en termes spinozistes, d'une idée inadéquate à une idée plus adéquate de ce qui le meut.\n\n## Un affect ne se combat que par un affect\n\nUne dernière thèse a une portée pratique considérable. Un affect ne peut être réprimé ni supprimé que par un affect contraire et plus fort que celui qu'il s'agit de réprimer (IV, 7).\n\nLa connaissance vraie du bien et du mal, en tant qu'elle est vraie, ne peut rien contre un affect. Elle ne le peut qu'en tant qu'elle est elle-même considérée comme un affect, c'est-à-dire en tant qu'elle nous touche.\n\n> **Exemple.** Un fumeur sait parfaitement que le tabac est dangereux ; l'information n'a rien changé en dix ans. Ce qui le fait arrêter, un jour, c'est la naissance d'un enfant, ou la maladie d'un proche : un affect nouveau, plus fort que le plaisir de fumer. Spinoza n'aurait pas été surpris. Ce n'est pas l'information qui transforme, c'est un autre rapport, vécu, à ce qui nous meut.\n\nC'est sans doute pourquoi Spinoza a été si souvent lu par des cliniciens. Il ne promet pas une maîtrise de la raison sur les passions. Il décrit une libération qui passe par la compréhension, mais par une compréhension qui doit devenir affect pour avoir de l'effet.","quiz":[{"question":"Que désigne le conatus chez Spinoza ?","choix":["La faculté par laquelle la raison parvient à dominer les passions","L'effort par lequel chaque chose s'efforce de persévérer dans son être","La volonté libre de Dieu, qui gouverne toutes choses selon ses fins","La capacité de l'âme à se séparer du corps après la mort"],"bonne":1,"explication":"Le conatus est l'effort de persévérer dans l'être, et il constitue l'essence actuelle de chaque chose. Spinoza refuse l'idée d'une raison qui dompterait les passions de l'extérieur, d'un Dieu doté d'une volonté orientée vers des fins, et d'une âme séparable du corps."},{"question":"Quel rapport Spinoza établit-il entre le désir et le bien ?","choix":["Nous désirons une chose parce que nous avons reconnu qu'elle est bonne","Le bien et le désir n'ont aucun rapport entre eux","Nous jugeons qu'une chose est bonne parce que nous la désirons","Le désir est toujours mauvais, seul le bien rationnel compte"],"bonne":2,"explication":"C'est le renversement du scolie de III, 9 : le jugement de valeur exprime le désir, il ne le précède pas. La première réponse est précisément la thèse que Spinoza retourne ; il ne condamne pas le désir, qui est l'essence de l'homme."},{"question":"Pourquoi les hommes se croient-ils libres selon Spinoza ?","choix":["Parce qu'ils ont conscience de leurs actions mais ignorent les causes qui les déterminent","Parce que Dieu leur a donné un libre arbitre qui échappe à la nature","Parce que leur raison est assez forte pour vaincre toutes les passions","Parce que les lois de leur cité leur garantissent la liberté"],"bonne":0,"explication":"L'illusion du libre arbitre vient de ce qu'on a conscience de ses désirs en ignorant ce qui les cause, comme l'enfant qui croit désirer librement le lait. Spinoza nie le libre arbitre, refuse l'idée d'une raison toute-puissante, et la liberté politique est une autre question."},{"question":"Comment un affect peut-il être supprimé selon l'Éthique ?","choix":["Par la simple connaissance de sa fausseté","Par un effort de la volonté libre de l'esprit","Par la prière et la soumission à Dieu","Par un affect contraire et plus fort"],"bonne":3,"explication":"Un affect ne se combat que par un affect contraire et plus fort (IV, 7). La connaissance vraie n'agit qu'en tant qu'elle devient elle-même affect. Spinoza nie le libre arbitre et ne propose pas la soumission religieuse comme voie de libération."}],"sources":[{"texte":"Spinoza, Éthique : citations commentées (III, 6 ; III, 9 scolie ; préface de III ; IV, 7), étude de J. Lagrée (lycée Chateaubriand)","url":"https://www.lycee-chateaubriand.fr/le-cru/wp-content/uploads/sites/3/2019/08/Spinoza_Desir_Lagree.pdf"},{"texte":"Spinoza, la liberté et l'illusion du libre arbitre (II, 35 scolie ; lettre 58), étude de J. Lagrée","url":"https://www.lycee-chateaubriand.fr/le-cru/wp-content/uploads/sites/3/2016/06/Lagree_HommeLibre.pdf"},{"texte":"Article de Cairn citant la définition du désir (Définitions des affects, 1)","url":"https://shs.cairn.info/article/AFP_015_0033/pdf?lang=fr"},{"texte":"Stanford Encyclopedia of Philosophy, « Baruch Spinoza »","url":"https://plato.stanford.edu/entries/spinoza/"}]},{"id":"freud-apres-coup","discipline":"psychanalyse","titre":"L'après-coup","figure":"Sigmund Freud","reference":"Esquisse d'une psychologie scientifique, IIe partie (1895) ; L'Homme aux loups (1918)","accroche":"Un souvenir anodin peut devenir traumatique des années plus tard, sans que rien ne lui arrive. Freud nomme ce temps à rebours : la Nachträglichkeit.","punch":"Le trauma n'est jamais dans une seule scène. Il est entre deux.","idee":"Un événement ne prend pas toujours son sens au moment où il est vécu. Une seconde scène, plus tardive, peut réinvestir la première et lui conférer, après coup, une portée traumatique. Le passé n'est pas un dépôt fixe : il est remanié par ce qui le suit.","citation":"Partout on découvre qu'un souvenir est refoulé, qui n'est devenu traumatisme qu'après coup.","citation_source":"Freud, Esquisse d'une psychologie scientifique (1895), IIe partie — traduit de l'allemand, cité d'après la trad. anglaise de Strachey","citation_url":"https://en.wikipedia.org/wiki/Emma_Eckstein","liens":["platon-reminiscence","freud-transfert","ferenczi-confusion"],"texte":"Le cas est exposé dans l'*Esquisse d'une psychologie scientifique*, un manuscrit de 1895 que Freud envoie à son ami Wilhelm Fliess et ne publiera jamais. La deuxième partie, consacrée à la psychopathologie, raconte l'histoire d'une jeune femme, Emma.\n\nEmma ne peut pas entrer seule dans un magasin. Elle rattache ce symptôme à un souvenir d'adolescence : elle était entrée dans une boutique, avait vu deux jeunes vendeurs rire ensemble, de sa robe pensait-elle, et s'était enfuie, prise d'une sorte d'effroi. L'un d'eux lui avait plu.\n\nLe souvenir n'explique rien. Pourquoi une scène aussi banale produirait-elle une phobie durable ?\n\n## La première scène\n\nL'analyse fait surgir un second souvenir, plus ancien. À huit ans, Emma était entrée seule chez un marchand qui l'avait touchée à travers ses vêtements, avec un sourire. Elle y était pourtant retournée une seconde fois, ce qu'elle se reprochera plus tard.\n\nAu moment où elle a lieu, cette scène n'a pas été vécue comme sexuelle au sens où l'adulte l'entend. L'enfant n'avait pas les moyens psychiques de la comprendre. Elle n'est pas encore, à proprement parler, un traumatisme.\n\n## La seconde scène\n\nC'est la scène de l'adolescence, après la puberté, qui va réveiller la première. Le rire des vendeurs, la boutique, l'attirance ressentie : par des liens associatifs, le souvenir du marchand revient, et il revient chargé d'une signification sexuelle qu'il n'avait pas. Le déplaisir se déclenche alors. Mais il se rattache au souvenir récent, plus présentable ; le souvenir ancien, lui, est refoulé.\n\nFreud en tire une formule restée célèbre : on découvre partout qu'un souvenir est refoulé, qui n'est devenu traumatisme qu'après coup.\n\n> **Exemple, pour comprendre la logique.** Un enfant de six ans entend ses parents se disputer violemment ; il retient surtout que la soupe était froide ce soir-là. À seize ans, il apprend que sa mère avait découvert, ce même soir, une liaison de son père. Le souvenir de la soupe froide change de nature : il devient lourd, chargé d'une angoisse qu'il n'avait pas. Rien n'est arrivé au souvenir ; c'est sa place dans l'histoire qui a changé. Cet exemple est fictif, mais il a la structure de l'après-coup.\n\n## Un temps qui va à rebours\n\nL'après-coup renverse une conception linéaire de la causalité psychique. Ce n'est pas seulement le passé qui détermine le présent ; c'est aussi le présent qui réécrit le passé. Le trauma n'est ni dans la première scène, ni dans la seconde : il est dans leur rapport.\n\nFreud reprend l'idée dans *L'Homme aux loups* (1918). Une scène observée par un très jeune enfant n'est comprise que plus tard, au moment d'un rêve d'angoisse qui la réactive, et c'est alors qu'elle agit.\n\n> **Exemple, ordinaire.** Un compliment reçu à quinze ans, « tu es mûre pour ton âge », a été entendu comme flatteur. Des années plus tard, devenue adulte, une femme le réentend autrement, en comprenant ce que cherchait celui qui le disait. Le souvenir devient pénible au moment où il prend son sens. C'est pourquoi l'après-coup compte tant dans la clinique des abus : la souffrance peut apparaître longtemps après les faits, sans que cela la rende moins réelle.\n\n## Un concept qu'on a dû dégager\n\nFreud emploie l'adverbe *nachträglich* et le nom *Nachträglichkeit* sans leur consacrer d'étude à part. C'est Jacques Lacan qui, en 1953, attire l'attention sur l'importance de ce terme et le traduit par « après-coup ». Laplanche et Pontalis lui donnent ensuite un article dans le *Vocabulaire de la psychanalyse* (1967). La traduction anglaise de James Strachey avait rendu le mot par *deferred action*, « action différée », ce qui en écrasait le double sens.\n\nLes lectures divergent ensuite. Pour Lacan, le sujet ne cesse de réécrire son histoire, et la cure opère dans ce temps-là. Laplanche, lui, y voit la marque du rôle de l'autre : la première scène contient un message énigmatique, venu de l'adulte, que l'enfant ne peut pas traduire, et qui reste à traduire.\n\n## Ce que cela change dans la cure\n\nUne conséquence clinique s'impose. On ne retrouve pas le passé comme un objet enfoui intact, qu'il suffirait d'exhumer. On le reconstruit, et cette reconstruction est elle-même un nouvel après-coup.\n\n> **Exemple, en séance.** Une patiente évoque pour la vingtième fois un déménagement de son enfance, toujours sur le mode anecdotique. Un jour, en parlant d'une rupture récente, elle s'arrête : « C'est la même chose, je n'ai pas pu dire au revoir. » Le vieux souvenir vient de prendre un sens qu'il n'avait jamais eu. L'analyste n'a rien découvert dans le passé ; c'est le présent de la séance qui a réorganisé ce passé.\n\nCe nom, *Après-coup*, est aussi celui de cette application : une manière de dire que le sens ne vient pas toujours au moment où l'on apprend, mais parfois plus tard, quand une autre lecture le réveille.","quiz":[{"question":"Pourquoi la première scène, chez Emma, n'est-elle pas immédiatement traumatique ?","choix":["Parce que l'enfant ne pouvait pas encore en saisir la signification sexuelle","Parce que le marchand, selon Freud, n'avait rien fait de répréhensible ce jour-là","Parce qu'Emma l'avait totalement oubliée dès le lendemain de l'événement","Parce que la scène avait été entièrement inventée par Emma au cours de la cure"],"bonne":0,"explication":"C'est faute de pouvoir lui donner sens que l'enfant ne la vit pas comme traumatique : la signification viendra après la puberté. L'acte du marchand est bien réel dans le récit de Freud, Emma y était même retournée, et rien n'indique une invention."},{"question":"Que signifie la formule « un souvenir n'est devenu traumatisme qu'après coup » ?","choix":["Que tout souvenir d'enfance finit tôt ou tard par devenir traumatique","Que les traumatismes réels n'existent pas, seuls existent les fantasmes","Que c'est une scène ultérieure qui confère à la première sa portée traumatique","Que le trauma se produit toujours à l'âge adulte, jamais dans l'enfance"],"bonne":2,"explication":"Le trauma se constitue entre deux scènes : la seconde réinvestit la première d'une signification nouvelle. Freud n'en fait pas une loi universelle, ne nie pas la réalité des événements, et la première scène se situe bien dans l'enfance."},{"question":"Qui a d'abord dégagé la Nachträglichkeit comme concept à part entière ?","choix":["Freud lui-même, dans un article qui lui est entièrement consacré","Ferenczi, dans le Journal clinique de 1932","Lacan en 1953, puis Laplanche et Pontalis dans le Vocabulaire de la psychanalyse","Melanie Klein, dans sa théorie des positions"],"bonne":2,"explication":"Freud emploie le mot sans lui consacrer de texte : c'est Lacan qui attire l'attention sur lui en 1953, puis le Vocabulaire de Laplanche et Pontalis en 1967. Ferenczi et Klein ne sont pas à l'origine de ce dégagement."},{"question":"Pourquoi la traduction anglaise « deferred action » est-elle jugée insuffisante ?","choix":["Parce qu'elle est trop longue pour un concept technique","Parce qu'elle dit le retard, pas le remaniement du passé","Parce qu'elle a été choisie par un adversaire de Freud","Parce qu'elle confond l'après-coup avec le refoulement"],"bonne":1,"explication":"« Action différée » suggère un effet simplement retardé, alors que l'après-coup désigne une réécriture : la scène ancienne prend son sens à partir de la nouvelle. Strachey n'était pas un adversaire de Freud mais son traducteur de référence."}],"sources":[{"texte":"Après-coup : Freud, Lacan (1953), Laplanche et Pontalis (Wikipédia)","url":"https://fr.wikipedia.org/wiki/Apr%C3%A8s-coup"},{"texte":"Emma Eckstein et les deux scènes du magasin (Wikipédia)","url":"https://en.wikipedia.org/wiki/Emma_Eckstein"},{"texte":"Freud, le diagramme d'Emma et la Nachträglichkeit, Harvard Collection of Historical Scientific Instruments","url":"https://chsi.harvard.edu/current_exhibitions/freud-interp-drawings/freud-origins-psychoanalysis"}]},{"id":"platon-reminiscence","discipline":"philosophie","titre":"La réminiscence","figure":"Platon","reference":"Ménon, 80a–86c et 97a–98a (vers 385 av. J.-C.)","accroche":"Comment chercher ce qu'on ignore, puisqu'on ne saurait pas le reconnaître en le trouvant ? Platon répond : on ne découvre pas, on se ressouvient.","punch":"Apprendre, ce n'est pas recevoir. C'est se ressouvenir.","idee":"Face au paradoxe de Ménon, Platon soutient que l'âme a déjà su. Un esclave sans instruction retrouve seul comment doubler un carré : le savoir était là, enfoui. Chercher devient un travail sur soi, pas une collecte d'informations.","citation":"Je ne lui enseigne rien, mais tout ce que je fais, c'est de le questionner.","citation_source":"Platon, Ménon, 84c-d — traduction reproduite par l'académie de Bordeaux","citation_url":"https://ent2d.ac-bordeaux.fr/disciplines/mathematiques/wp-content/uploads/sites/3/2016/06/menon.pdf","liens":["freud-apres-coup","freud-transfert","kant-lumieres"],"texte":"Le *Ménon* commence par une question posée sans préambule : la vertu peut-elle s'enseigner ? Très vite, Socrate avoue qu'il ne sait même pas ce qu'est la vertu. Ménon, agacé, le compare à une torpille, ce poisson qui engourdit ceux qui le touchent : Socrate paralyse ses interlocuteurs en les plongeant dans l'embarras.\n\nC'est alors que Ménon pose l'objection qui donne au dialogue sa célébrité. Comment chercheras-tu, Socrate, ce que tu ne connais pas du tout ? Et si tu tombes dessus par hasard, comment sauras-tu que c'est bien cela ?\n\n## Un paradoxe sérieux\n\nL'objection a l'air d'un tour de sophiste. Elle est en réalité redoutable. Ou bien je sais ce que je cherche, et la recherche est inutile. Ou bien je ne le sais pas, et elle est impossible, puisque je ne pourrais pas reconnaître la réponse en la rencontrant.\n\n> **Exemple.** Vous cherchez un mot qui vous échappe. Vous essayez « fugace » : non. « Éphémère » : non plus. « Évanescent » : oui, c'est lui. Comment avez-vous su ? Vous ne le saviez pas, et pourtant vous l'avez reconnu à coup sûr. Le paradoxe de Ménon est là : la recherche suppose qu'on sait déjà, d'une certaine manière, ce qu'on ne sait pas encore.\n\n## Le détour par le mythe\n\nSocrate ne répond pas d'abord par un argument. Il rapporte ce qu'enseignent des prêtres et des prêtresses : l'âme est immortelle, elle naît plusieurs fois, elle a tout vu, ici et ailleurs. Rien d'étonnant, donc, à ce qu'elle puisse se ressouvenir de ce qu'elle a su. Ce qu'on appelle apprendre est un ressouvenir. La traduction anglaise classique de Jowett le dit en une ligne : toute recherche et tout apprentissage ne sont que réminiscence.\n\nLe mythe ne clôt pas la discussion, il en fixe la condition. Platon a besoin qu'il y ait déjà du savoir quelque part dans l'âme pour que la recherche ait un sens. Reste à le montrer.\n\n## L'esclave et le carré\n\nSocrate fait venir un jeune esclave de Ménon, qui parle grec mais n'a jamais appris la géométrie. Il trace sur le sol un carré et pose une question : comment construire un carré deux fois plus grand ?\n\n> **Exemple, avec les nombres du dialogue.** Le carré de départ a deux pieds de côté, donc une surface de quatre pieds carrés. On cherche un carré de huit.\n> L'esclave répond avec assurance : il suffit de doubler le côté. Socrate dessine un carré de quatre pieds de côté. Sa surface est de seize : quatre fois plus grand, pas deux fois. L'esclave le constate lui-même.\n> Il propose alors trois pieds. Surface : neuf. Toujours pas huit.\n> Le voici bloqué. Socrate trace alors la diagonale du premier carré et pose quelques questions. Le carré construit sur cette diagonale a exactement la surface cherchée : huit. Les savants, dit Socrate, appellent cette ligne « diagonale ».\n\nLe moment le plus important n'est pas la solution. C'est l'impasse. Socrate fait remarquer à Ménon que l'esclave, désormais embarrassé, est dans une meilleure situation qu'avant : il croyait savoir, il sait maintenant qu'il ne sait pas, et il va chercher avec plaisir. La traduction de Jowett pose la question en ces termes : n'est-il pas mieux loti en connaissant son ignorance ?\n\nSocrate insiste sur son propre rôle : il n'enseigne rien, il interroge. Les opinions vraies étaient dans l'esclave ; il fallait les réveiller.\n\n## Opinion vraie et savoir\n\nLa fin du dialogue ajoute une distinction qu'on oublie souvent. Avoir une opinion vraie, ce n'est pas encore savoir. Socrate prend l'exemple de quelqu'un qui doit guider un voyageur vers Larissa. Celui qui connaît la route et celui qui devine juste arriveront tous deux à destination. Pour l'action, l'opinion vraie vaut la science.\n\nMais elle est instable. Socrate la compare aux statues de Dédale, si vivantes, disait-on, qu'elles s'enfuyaient si on ne les attachait pas. Une opinion vraie non attachée ne vaut pas grand-chose : elle s'échappe de l'âme. On l'attache par un raisonnement qui rend compte de la cause. Et cette opération, conclut Socrate, c'est la réminiscence.\n\n> **Exemple.** Deux étudiants retiennent que la diagonale permet de doubler le carré. Le premier l'a appris par cœur. Le second sait pourquoi : la diagonale coupe le petit carré en deux triangles égaux, et le grand carré en contient quatre, soit le double. Le jour de l'examen, une variante de la question déroute le premier. Le second retrouve la réponse, parce qu'il en tient la cause. Il a une opinion vraie attachée.\n\n## Ce que la doctrine engage\n\nOn peut ne pas croire à la préexistence de l'âme et garder l'essentiel. La réminiscence soutient trois thèses que la philosophie a souvent reprises.\n\n- **Le savoir ne s'injecte pas.** Le maître ne transvase rien : il provoque un travail chez l'autre. C'est le sens de la méthode socratique par questions.\n- **L'erreur reconnue est un progrès.** L'embarras n'est pas un échec, c'est ce qui rend le désir de chercher possible.\n- **L'opinion vraie n'est pas encore savoir.** Elle doit être liée par la compréhension de sa cause, sans quoi elle s'enfuit.\n\n## Une résonance\n\nIl y a quelque chose de troublant à lire cette scène avec une oreille clinique : un savoir qu'on porte sans le savoir, qu'un autre ne vous apprend pas mais vous aide à retrouver, et qui ne vaut que s'il passe par votre propre parole. La comparaison a ses limites, et elles sont instructives. Chez Platon, ce qui revient est vrai et éternel : des rapports géométriques. Dans la cure freudienne, ce qui revient est singulier et souvent remanié par le temps. Mais la question de Ménon, *comment chercher ce qu'on ne sait pas*, est aussi celle de toute recherche sur soi.","quiz":[{"question":"Quel problème la doctrine de la réminiscence vient-elle résoudre dans le Ménon ?","choix":["Comment prouver l'immortalité de l'âme par la seule raison","Comment il est possible de chercher ce que l'on ignore","Pourquoi les esclaves ne reçoivent aucune éducation à Athènes","Comment distinguer un sophiste d'un vrai philosophe"],"bonne":1,"explication":"C'est le « paradoxe de Ménon » : si l'on ignore ce qu'on cherche, on ne peut ni le chercher ni le reconnaître. L'immortalité de l'âme n'est pas démontrée ici, elle est rapportée par un récit comme condition. La condition des esclaves et la critique des sophistes ne sont pas l'enjeu de ce passage."},{"question":"L'esclave propose d'abord de doubler le côté du carré. Qu'obtient-il ?","choix":["Un carré exactement deux fois plus grand, comme demandé","Un carré trois fois plus grand que le premier","Un carré quatre fois plus grand que le premier","Un rectangle, et non un carré"],"bonne":2,"explication":"Avec un côté doublé, la surface passe de quatre à seize pieds carrés : quatre fois plus. C'est cette erreur, constatée par l'esclave lui-même, qui le conduit à l'embarras puis à la solution par la diagonale."},{"question":"Pourquoi Socrate juge-t-il que l'esclave progresse quand il tombe dans l'embarras ?","choix":["Parce qu'il a enfin compris que la géométrie est inutile","Parce qu'il accepte désormais l'autorité de son maître","Parce qu'il a mémorisé la bonne réponse donnée par Socrate","Parce qu'il sait à présent qu'il ne sait pas, et désire chercher"],"bonne":3,"explication":"L'embarras remplace une fausse certitude par un savoir de son ignorance, qui relance le désir de chercher. Socrate ne donne aucune réponse à mémoriser, il ne réclame aucune soumission, et la géométrie n'est jamais jugée inutile."},{"question":"Que représentent les statues de Dédale à la fin du dialogue ?","choix":["La beauté des œuvres d'art, supérieure au savoir","Les opinions vraies, qui s'enfuient tant qu'on ne les attache pas par la cause","Les âmes des morts, qui reviennent dans de nouveaux corps","Les sophistes, qui changent d'avis selon leur public"],"bonne":1,"explication":"Les opinions vraies sont précieuses mais instables : elles s'échappent tant qu'un raisonnement sur la cause ne les attache pas. C'est cet attachement que Socrate appelle réminiscence. Il ne s'agit ni d'esthétique, ni de réincarnation, ni des sophistes."}],"sources":[{"texte":"Platon, Ménon, traduction française reproduite par l'académie de Bordeaux","url":"https://ent2d.ac-bordeaux.fr/disciplines/mathematiques/wp-content/uploads/sites/3/2016/06/menon.pdf"},{"texte":"Plato, Meno, trad. anglaise de Benjamin Jowett, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/1643"},{"texte":"MIT OpenCourseWare, Ancient Philosophy : Meno 97e–98a, opinion vraie et savoir","url":"https://ocw.mit.edu/courses/24-200-ancient-philosophy-fall-2004/76a62d9a1d03d49cdea8e12f3d9f7ebf_tapmenok_l.pdf"}]},{"id":"freud-transfert","discipline":"psychanalyse","titre":"Répéter au lieu de se souvenir","figure":"Sigmund Freud","reference":"Remémoration, répétition et perlaboration (1914)","accroche":"Le patient ne se souvient pas de ce qu'il a oublié. Il le rejoue, avec l'analyste. Freud fait de cet obstacle le levier même de la cure.","punch":"Ce qu'on ne peut pas se rappeler, on le répète.","idee":"Ce qui est refoulé ne revient pas comme souvenir mais comme acte, sans que le patient sache qu'il répète. Le transfert est un fragment de cette répétition. Il ouvre un espace où le passé se rejoue au présent et peut, enfin, être élaboré : c'est la perlaboration.","citation":"Il le répète, sans savoir, naturellement, qu'il le répète.","citation_source":"Freud, Remémoration, répétition et perlaboration (1914) — traduit de l'allemand ; cf. trad. anglaise de Strachey","citation_url":"https://marcuse.faculty.history.ucsb.edu/classes/201/articles/1914FreudRemembering.pdf","liens":["platon-reminiscence","freud-apres-coup","freud-fort-da"],"texte":"Ce court texte de 1914 fait partie des écrits techniques de Freud, rédigés pour les analystes. Il marque un tournant. La méthode cathartique des débuts, élaborée avec Breuer, visait la remémoration : retrouver la scène oubliée, la revivre avec l'affect qui l'accompagnait, et le symptôme devait disparaître. Freud constate que les choses ne se passent pas ainsi.\n\n## L'agir à la place du souvenir\n\nLe patient, écrit Freud, ne se souvient en général de rien de ce qu'il a oublié et refoulé ; il l'agit. Il ne le reproduit pas comme souvenir mais comme acte. Il le répète, sans savoir, naturellement, qu'il le répète.\n\nFreud donne des exemples précis. Le patient ne se souvient pas d'avoir été insolent et rebelle envers l'autorité de ses parents ; mais il se comporte ainsi envers le médecin. Il ne se souvient pas d'être resté bloqué, désemparé, dans ses recherches sexuelles d'enfant ; mais il apporte en séance un amas de rêves confus, se plaint que rien ne lui réussit, et déclare qu'il est voué à ne jamais mener à bien ce qu'il entreprend.\n\nEt Freud conclut : c'est là sa manière de se souvenir.\n\n> **Exemple, fictif.** Un patient arrive en retard à presque chaque séance, avec une excuse différente à chaque fois. Il n'a aucun souvenir particulier d'avoir dû « mériter » l'attention de ses parents. Mais à chaque séance, il met l'analyste dans la position d'attendre, de s'impatienter peut-être, de le réprimander. Ce qu'il ne se rappelle pas, il le met en scène. La question n'est pas de corriger les retards, mais d'entendre ce qu'ils rejouent.\n\n## Le transfert comme répétition\n\nLe transfert, dit Freud, n'est lui-même qu'un fragment de répétition, et la répétition est le transfert du passé oublié, non seulement sur le médecin, mais sur tous les domaines de la situation présente.\n\nC'est un renversement. Le transfert, qui apparaissait comme un obstacle, l'attachement ou l'hostilité du patient envers l'analyste, devient le lieu même où le passé se rend accessible. Freud l'avait dit deux ans plus tôt, dans « Sur la dynamique du transfert » (1912) : on ne peut tuer personne *in absentia* ou *in effigie*. Le conflit doit se présenter pour être traité.\n\n> **Exemple, fictif.** Une patiente est convaincue que son analyste la trouve ennuyeuse. Elle en guette les signes : un soupir, un silence un peu long. Elle n'a jamais formulé que sa mère, épuisée, l'écoutait d'une oreille distraite. Mais elle le revit, sur la scène de la séance. C'est là que cela peut enfin être reconnu, parce que cela se passe *maintenant*, avec quelqu'un qui ne réagit pas comme prévu.\n\n## Un espace intermédiaire\n\nFreud décrit le transfert comme une zone intermédiaire entre la maladie et la vie réelle. La compulsion de répétition peut s'y manifester presque librement, mais dans un cadre. La maladie y est en quelque sorte rejouée sous les yeux de l'analyste, là où il peut travailler sur elle, et le chemin qui mène de la maladie au souvenir passe par là.\n\nLe maniement du transfert devient le moyen principal de dompter la compulsion de répétition et de la transformer en motif de remémoration.\n\n## Perlaborer\n\nReste un dernier temps, le plus long. Nommer une résistance ne la fait pas disparaître. Les jeunes analystes, remarque Freud, s'étonnent que le patient ne change pas alors qu'on lui a montré sa résistance. Il faut lui laisser le temps de s'enfoncer dans cette résistance qu'il ne connaît pas encore, de la *perlaborer*, *durcharbeiten* en allemand, « travailler à travers ».\n\nFreud prévient : ce travail est une tâche pénible pour l'analysé et une épreuve de patience pour l'analyste. Mais c'est aussi la partie du travail qui produit le plus d'effet de transformation.\n\n> **Exemple.** Comprendre un jour, en séance, qu'on choisit des partenaires qui ressemblent à un parent froid, c'est une découverte. Mais la découverte ne suffit pas : le lendemain, on se sent de nouveau attiré par la même froideur. Il faudra la reconnaître encore, dans d'autres situations, sous d'autres formes, des dizaines de fois, pour que quelque chose se déplace vraiment. C'est cela, perlaborer : non pas comprendre une fois, mais traverser plusieurs fois le même point.\n\n## Pourquoi c'est important\n\nCe texte fixe une idée qui traverse toute la psychanalyse : on ne se libère pas d'un passé en le racontant de loin. On s'en libère en le rencontrant au présent, dans une relation où il peut être rejoué autrement. Il annonce aussi la notion de compulsion de répétition, que Freud développera six ans plus tard dans *Au-delà du principe de plaisir*.","quiz":[{"question":"Comment le refoulé revient-il, selon Freud en 1914 ?","choix":["Sous forme de souvenirs nets que le patient raconte","Sous forme d'actes, que le patient répète sans savoir qu'il répète","Sous forme d'hallucinations visuelles","Il ne revient jamais, il reste définitivement enfoui"],"bonne":1,"explication":"Le patient ne s'en souvient pas mais agit ce qu'il a oublié, sans le reconnaître comme répétition. C'est précisément l'écart avec la méthode cathartique, qui misait sur la remémoration. Le texte ne parle pas d'hallucinations, et l'enjeu est justement le retour du refoulé."},{"question":"Quel exemple Freud donne-t-il du patient rebelle à l'autorité de ses parents ?","choix":["Il se souvient en détail de chaque dispute de son enfance","Il ne s'en souvient pas, mais se comporte ainsi envers le médecin","Il refuse de venir aux séances pendant plusieurs mois","Il se montre au contraire très soumis à toutes les autorités"],"bonne":1,"explication":"Le patient n'a pas le souvenir de sa rébellion, mais il la rejoue face à l'analyste : c'est sa manière de se souvenir. Les autres conduites ne figurent pas dans l'exemple de Freud."},{"question":"Quel rapport Freud établit-il entre transfert et répétition ?","choix":["Ils n'ont aucun rapport entre eux","Le transfert empêche toute répétition","Le transfert est lui-même un fragment de répétition","La répétition ne concerne que la vie hors des séances"],"bonne":2,"explication":"Le transfert est répétition, et la répétition est le transfert du passé oublié sur le médecin comme sur la situation actuelle. Il ne l'empêche pas : il la rend visible et maniable."},{"question":"Que désigne la perlaboration ?","choix":["La rédaction par l'analyste d'un compte rendu détaillé après chaque séance","La première interprétation que l'analyste donne au patient en début de cure","La fin définitive de l'analyse, une fois tous les symptômes disparus","Le travail par lequel le patient traverse et surmonte une résistance nommée"],"bonne":3,"explication":"Nommer une résistance ne suffit pas : il faut laisser au patient le temps de s'y enfoncer et de la surmonter. Ce n'est ni un écrit de l'analyste, ni une première interprétation, ni une fin de cure."}],"sources":[{"texte":"Freud, Remembering, Repeating and Working-Through (1914), trad. James Strachey (PDF, UC Santa Barbara)","url":"https://marcuse.faculty.history.ucsb.edu/classes/201/articles/1914FreudRemembering.pdf"},{"texte":"Remembering, Repeating and Working-Through, notice (No Subject, encyclopédie de psychanalyse)","url":"https://nosubject.com/Remembering,_Repeating_and_Working-Through"},{"texte":"Larousse, « élaboration, perlaboration »","url":"https://www.larousse.fr/encyclopedie/philosophie/%C3%A9laboration_perlaboration/191527"}]},{"id":"pascal-divertissement","discipline":"philosophie","titre":"Le divertissement","figure":"Blaise Pascal","reference":"Pensées, liasse « Divertissement », fragment Lafuma 136 / Sellier 168 (publication posthume, 1670)","accroche":"Pourquoi le roi, qui a tout, a-t-il besoin qu'on l'empêche de penser à lui ? Pascal a une réponse, et elle ne flatte personne.","punch":"Le chasseur ne veut pas le lièvre. Il veut la chasse.","idee":"Si nous courons d'occupation en occupation, ce n'est pas pour ce que nous poursuivons, c'est pour ne pas rester seuls avec notre condition. Le divertissement nous console de notre misère, mais il nous empêche d'y penser, et donc d'en sortir.","citation":"Tout le malheur des hommes vient d'une seule chose, qui est de ne savoir pas demeurer en repos dans une chambre.","citation_source":"Pascal, Pensées, Lafuma 136 / Sellier 168 — édition électronique de D. Descotes et G. Proust","citation_url":"https://www.penseesdepascal.fr/Divertissement/Divertissement4-moderne.php","liens":["freud-fort-da","schopenhauer-pendule","epicure-mort"],"texte":"Pascal regarde les hommes s'agiter : la guerre, le jeu, la chasse, la conversation, les charges et les honneurs. Il cherche la raison commune de tant de mouvements, et il la trouve dans une phrase devenue célèbre : tout le malheur des hommes vient de ce qu'ils ne savent pas demeurer en repos dans une chambre.\n\nLe fragment appartient à la liasse que Pascal a lui-même intitulée « Divertissement ». Il faut entendre le mot en son sens premier : ce qui *divertit*, c'est-à-dire ce qui détourne.\n\n## Le lièvre et la chasse\n\nL'exemple le plus parlant est celui du chasseur. Il court toute la journée après un lièvre. Offrez-lui le lièvre : il n'en voudra pas. Ce n'est pas le lièvre qu'il cherche, c'est la chasse.\n\nLe joueur de même. Donnez-lui tous les matins l'argent qu'il pourrait gagner dans la journée, à condition qu'il ne joue pas : vous le rendrez malheureux. Il lui faut jouer, et il lui faut même s'échauffer, se piquer, s'imaginer que ce gain le rendrait heureux, pour que le jeu fasse son effet.\n\n> **Exemple.** Vous attendez une réponse importante. Plutôt que de rester avec cette attente, vous ouvrez votre téléphone, faites défiler des images, ouvrez une autre application, revenez à la première. Au bout d'une demi-heure, vous ne sauriez pas dire ce que vous avez vu. Ce n'est pas le contenu qui comptait. C'est le défilement, qui occupait la place. Pascal n'a pas connu les écrans, mais il a décrit le geste avec une précision étonnante.\n\nIl faut donc distinguer deux choses que nous confondons sans cesse : l'objet que nous visons et la fonction de la poursuite. L'objet est un prétexte. La poursuite a pour vraie fonction de nous détourner.\n\n## Détourner de quoi ?\n\nDe nous-mêmes, plus exactement de notre condition. Pascal parle du malheur naturel de notre condition faible et mortelle, si misérable que rien ne peut nous consoler lorsque nous y pensons de près.\n\nD'où le paradoxe du roi. Il est entouré de tout ce qu'on peut désirer. Mais laissez-le sans divertissement, à considérer ce qu'il est, et le voilà plus malheureux que le moindre de ses sujets qui joue et se divertit. C'est pourquoi le roi est environné de gens qui ne pensent qu'à le divertir et à l'empêcher de penser à lui.\n\n> **Exemple.** On s'étonne parfois que des gens qui ont « tout pour être heureux » s'effondrent au moment de la retraite, d'une longue convalescence ou d'un confinement. Le poste, les réunions, les déplacements ne faisaient pas seulement vivre : ils occupaient. Quand l'agitation cesse, ce qu'elle tenait à distance revient. Pascal ne dit pas que ces personnes sont superficielles. Il dit que c'est notre condition commune.\n\n## L'agitation nous trompe sur elle-même\n\nLe plus fin, chez Pascal, est la description de la méconnaissance. Ceux qui se divertissent ne savent pas qu'ils fuient. Ils ne savent pas, écrit-il, que ce n'est que la chasse et non la prise qu'ils recherchent. Ils croient sincèrement que l'objet les rendra heureux, et qu'ils goûteront le repos une fois obtenu ce qu'ils poursuivent.\n\nMais à supposer même qu'on se trouve à l'abri de tout, l'ennui ne laisserait pas de sortir du fond du cœur, où il a des racines naturelles, et de remplir l'esprit de son venin.\n\nPascal observe deux instincts contraires. L'un, secret, nous porte à chercher le divertissement et l'occupation au-dehors : il vient du sentiment de nos misères continuelles. L'autre, reste de la grandeur de notre première nature, nous fait connaître que le bonheur n'est en effet que dans le repos. De ces deux instincts contraires se forme un projet confus, qui nous porte à tendre au repos par l'agitation.\n\n> **Exemple.** « Quand j'aurai fini ce dossier, je souffle. » Le dossier fini, un autre arrive, et l'on s'aperçoit qu'on l'a presque accueilli avec soulagement. On visait le repos ; on l'a repoussé dès qu'il s'est approché. C'est le « projet confus » de Pascal : chercher le calme par le mouvement même qui l'empêche.\n\n## Une lecture sans Dieu ?\n\nPascal écrit en apologiste. Les *Pensées* sont les fragments d'une défense de la religion chrétienne qu'il n'a pas eu le temps d'achever ; elles ont paru après sa mort, en 1670. Dans ce projet, le divertissement prouve la misère de l'homme sans Dieu, et prépare le lecteur à chercher ailleurs le repos que le monde ne donne pas.\n\nOn peut lire la liasse sans adhérer à cette conclusion, et garder une observation d'une précision redoutable. Nous ne voulons pas ce que nous croyons vouloir. Notre activité tient d'abord à ce qu'elle nous épargne. Et cette fonction nous reste dissimulée : il faut un autre regard, ou un long moment de repos forcé, pour l'apercevoir.\n\nIl y a là, deux siècles avant Freud, une théorie de la répétition qui ne dit pas son nom : un comportement qui se reproduit sans que le sujet en connaisse la raison, et dont la raison est justement ce qu'il évite de connaître.","quiz":[{"question":"Que montre l'exemple du chasseur à qui l'on offre le lièvre ?","choix":["Que l'objet poursuivi n'est qu'un prétexte : c'est la poursuite qui importe","Que les chasseurs sont des gens cupides qui ne pensent qu'au profit","Que la chasse est une activité aristocratique que la morale condamne","Que le gibier a plus de valeur une fois capturé qu'une fois offert"],"bonne":0,"explication":"Le chasseur refuserait le lièvre offert : ce qu'il veut, c'est la chasse, qui le détourne de lui-même. Pascal ne fait ici ni morale de la cupidité, ni critique sociale de la noblesse, et l'exemple suggère l'inverse d'une valeur accrue du gibier capturé."},{"question":"Pourquoi le roi est-il entouré de gens qui le divertissent ?","choix":["Pour l'aider à gouverner son royaume au quotidien","Pour le protéger de ses ennemis, au-dedans et au-dehors","Pour l'empêcher de penser à lui-même et à sa condition","Pour lui enseigner la vertu et la sagesse des anciens"],"bonne":2,"explication":"Sans divertissement, le roi qui considère ce qu'il est devient plus malheureux que le moindre de ses sujets qui joue. Les courtisans ont pour fonction de l'en détourner. Les fonctions politiques, militaires ou morales ne sont pas ce que Pascal souligne."},{"question":"Que propose-t-on au joueur dans l'exemple de Pascal ?","choix":["De jouer avec l'argent d'un autre pour ne rien risquer","De gagner à coup sûr grâce à un jeu truqué en sa faveur","De recevoir chaque matin ce qu'il gagnerait, à condition de ne pas jouer","De jouer seulement le dimanche, pour se reposer en semaine"],"bonne":2,"explication":"On lui donne d'avance le gain, à condition qu'il ne joue pas, et on le rend malheureux : ce n'est pas l'argent qu'il cherchait, mais l'occupation du jeu. Les autres situations ne figurent pas dans le fragment."},{"question":"Que désigne le « projet confus » dont parle Pascal ?","choix":["Le plan d'une vie entièrement consacrée à Dieu","La volonté d'accumuler le plus de richesses possible","L'organisation des fêtes de la cour autour du roi","Le fait de tendre au repos par l'agitation même qui l'empêche"],"bonne":3,"explication":"De deux instincts contraires, l'un qui pousse à l'occupation, l'autre qui sait que le bonheur est dans le repos, naît un projet confus : chercher le repos par l'agitation. Il ne s'agit ni d'un plan religieux, ni d'avidité, ni des fêtes de cour."}],"sources":[{"texte":"Pascal, Pensées, fragment Divertissement 4 (Lafuma 136, Sellier 168), édition électronique de Dominique Descotes et Gilles Proust","url":"https://www.penseesdepascal.fr/Divertissement/Divertissement4-moderne.php"},{"texte":"Pascal, Pensées, édition de Port-Royal (2e éd. Desprez), section « Misère de l'homme » (Wikisource)","url":"https://fr.wikisource.org/wiki/Pens%C3%A9es_(Pascal)/2e_%C3%A9d._Desprez/XXVI"},{"texte":"Stanford Encyclopedia of Philosophy, « Blaise Pascal »","url":"https://plato.stanford.edu/entries/pascal/"}]},{"id":"freud-fort-da","discipline":"psychanalyse","titre":"Fort-Da","figure":"Sigmund Freud","reference":"Au-delà du principe de plaisir, chap. II (1920)","accroche":"Un enfant d'un an et demi jette une bobine, la fait revenir, recommence. Freud y voit l'énigme qui va bouleverser sa théorie : pourquoi répéter ce qui fait mal ?","punch":"L'enfant jette la bobine pour ne plus subir le départ de sa mère.","idee":"L'enfant met en scène la disparition et le retour d'un objet, en prononçant « o-o-o-o » (fort, parti) puis « da » (voilà). Il transforme une absence subie en jeu dont il est l'auteur. Mais c'est la disparition qu'il rejoue le plus souvent : un indice qu'il existe un au-delà du principe de plaisir.","repere":"Fort : « parti, loin ». Da : « voilà, là ». L'enfant observé est un petit-fils de Freud, fils de sa fille Sophie. Sophie meurt en 1920, pendant que Freud travaille à ce livre.","liens":["pascal-divertissement","freud-transfert","freud-deuil-melancolie"],"texte":"*Au-delà du principe de plaisir* est un livre étrange et spéculatif, que Freud présente lui-même avec précaution. Il part d'un constat : certains phénomènes ne s'expliquent pas par la recherche du plaisir. Les rêves des névroses traumatiques, après la guerre, ramènent sans cesse le rêveur à la scène de l'accident. Les patients répètent en séance ce qui les a fait souffrir. Et un enfant joue.\n\n## La scène\n\nLe petit garçon a dix-huit mois. Il est sage, ne pleure pas quand sa mère s'absente pour quelques heures. Mais il a une habitude : il jette au loin tous les petits objets qu'il trouve, dans un coin, sous le lit, en émettant un long « o-o-o-o » plein d'intérêt et de satisfaction. Sa mère et l'observateur s'accordent à y entendre le mot allemand *fort*, « parti ».\n\nUn jour, Freud observe la version complète du jeu. L'enfant tient une bobine en bois entourée d'une ficelle. Il la jette avec adresse par-dessus le bord de son petit lit à rideaux, où elle disparaît, en disant son « o-o-o-o ». Puis il la ramène en tirant sur la ficelle et salue sa réapparition d'un joyeux *da*, « voilà ». Disparition, retour.\n\n## Ce que le jeu accomplit\n\nFreud relie le jeu aux absences de la mère. L'enfant ne peut pas les empêcher ; il les met en scène avec les objets à sa portée. Ce faisant, il passe de la passivité à l'activité : il était d'abord passif, surpris par l'événement ; il prend maintenant un rôle actif en le répétant comme un jeu, même si l'événement était désagréable.\n\nFreud évoque aussi une autre satisfaction, celle d'une petite vengeance : « Eh bien, va-t'en, je n'ai pas besoin de toi, c'est moi qui t'envoie promener. »\n\n> **Exemple, ordinaire.** Un enfant qui vient d'être vacciné rentre à la maison et « pique » ses peluches avec un crayon, en les grondant gentiment. Il n'a pas aimé la piqûre. Il ne la rejoue pas pour le plaisir de la douleur ; il la rejoue pour passer du côté de celui qui pique. C'est le premier sens du fort-da : maîtriser activement ce qu'on a subi passivement.\n\n## Le problème\n\nMais une difficulté persiste. Le premier acte, la disparition, était répété inlassablement par l'enfant, comme un jeu en soi, bien plus souvent que le jeu complet avec son retour joyeux. Pourquoi répéter ce qui, en soi, est pénible ?\n\nLa maîtrise est une réponse. Freud la retient, mais il ne s'en contente pas. Avec les rêves traumatiques et la répétition dans le transfert, ce petit jeu le conduit à une hypothèse : il existerait une *compulsion de répétition* plus originaire que le principe de plaisir. Au chapitre V, cette hypothèse le mènera aux pulsions qui visent à rétablir un état antérieur, et à l'idée que le but de toute vie est la mort. C'est la naissance de la pulsion de mort.\n\n> **Exemple, clinique et fictif.** Une femme quitte systématiquement ses compagnons avant qu'ils puissent la quitter. Chaque rupture la fait souffrir, et elle recommence. On peut y lire la logique de l'enfant à la bobine : faire partir l'autre plutôt que subir son départ. Et on peut aussi se demander, avec le Freud de 1920, pourquoi ce scénario douloureux se répète avec tant d'insistance, comme s'il obéissait à autre chose qu'à la recherche du plaisir.\n\n## Une bobine et un deuil\n\nIl est difficile de ne pas lire ces pages à la lumière de ce que vivait Freud en les écrivant. Sophie, la mère de l'enfant, meurt en 1920, emportée pendant l'épidémie de grippe. Freud est alors en plein travail sur le livre. Le musée Freud de Londres suggère que l'achever fut peut-être pour lui une manière de maîtriser cette perte, comme l'enfant maîtrisait les absences de sa mère.\n\n## La relecture lacanienne\n\nLacan reviendra souvent à cette scène. Il y lit l'entrée de l'enfant dans le langage : l'opposition de deux sons, *o* et *a*, fait exister l'absence comme telle. Avec deux syllabes, l'enfant ne retient pas sa mère, mais il peut la nommer quand elle n'est pas là. Le symbole commence par la perte de la chose.\n\n> **Exemple.** Un enfant de deux ans dit « maman partie » quand sa mère sort, et le répète pendant un moment, sur un ton presque satisfait. Il ne fait pas revenir sa mère. Mais il a désormais un mot pour son absence, un mot qu'il peut dire, répéter, adresser. L'absence n'est plus seulement un vide : elle est entrée dans la langue.\n\nLes deux lectures ne s'excluent pas. Toutes deux font de ce jeu minuscule le premier acte d'un sujet qui, faute de pouvoir retenir ce qu'il aime, apprend à le perdre lui-même.","quiz":[{"question":"Que met en scène le jeu de la bobine, selon Freud ?","choix":["La disparition et le retour de la mère, que l'enfant ne peut empêcher","Le désir de l'enfant d'obtenir de nouveaux jouets de ses parents","Une imitation des gestes que le père accomplit à son travail","Un simple exercice de coordination motrice, sans valeur psychique"],"bonne":0,"explication":"Freud rapporte le jeu aux absences de la mère : l'enfant rejoue avec un objet ce qu'il subit. Il ne s'agit ni de l'envie de jouets, ni d'imitation du père, ni d'un exercice moteur."},{"question":"Quel déplacement le jeu permet-il à l'enfant d'opérer ?","choix":["De l'activité à la passivité : il se laisse enfin consoler","De la tristesse à l'indifférence complète envers sa mère","De la passivité à l'activité : il n'est plus quitté, il fait partir","De la parole au silence : il cesse de réclamer sa mère"],"bonne":2,"explication":"L'enfant transforme une situation subie en situation agie. L'inverse ne correspond pas au texte ; Freud ne parle pas d'indifférence, et c'est au contraire l'émergence de la parole (fort, da) qui accompagne le jeu."},{"question":"Pourquoi ce jeu pose-t-il problème au principe de plaisir ?","choix":["Parce que l'enfant semble s'ennuyer en jouant, au lieu d'y prendre plaisir","Parce que la mère désapprouve ce jeu et tente de l'en empêcher","Parce que l'enfant ne parle pas encore et ne peut donc rien exprimer","Parce que l'enfant rejoue surtout la disparition, c'est-à-dire ce qui est pénible"],"bonne":3,"explication":"La répétition privilégiée de la disparition, en elle-même déplaisante, est l'énigme qui conduit Freud vers la compulsion de répétition. L'ennui et la désapprobation maternelle ne sont pas en jeu, et l'enfant prononce déjà des proto-mots."},{"question":"Vers quelle hypothèse ce jeu, avec d'autres faits, conduit-il Freud ?","choix":["L'idée que les enfants sont naturellement cruels","L'idée que le jeu n'a aucune signification psychique","L'idée d'une compulsion de répétition, puis d'une pulsion de mort","L'idée que le langage est inné chez l'enfant"],"bonne":2,"explication":"Avec les rêves traumatiques et la répétition dans le transfert, le jeu mène Freud à une compulsion de répétition plus originaire que le principe de plaisir, puis, au chapitre V, à la pulsion de mort."}],"sources":[{"texte":"Freud, Beyond the Pleasure Principle, trad. C. J. M. Hubback (1922), Project Gutenberg","url":"https://gutenberg.org/ebooks/76031"},{"texte":"Freud Museum London, « 1920–2020 : Freud and the pandemic » (Sophie, la bobine et le livre)","url":"https://stories.freud.org.uk/1920-2020-freud-and-pandemic/6/"},{"texte":"Compulsion de répétition (Wikipédia)","url":"https://en.wikipedia.org/wiki/Repetition_compulsion"}]},{"id":"schopenhauer-pendule","discipline":"philosophie","titre":"Le pendule de la souffrance et de l'ennui","figure":"Arthur Schopenhauer","reference":"Le Monde comme volonté et comme représentation, livre IV, § 57 (paru en décembre 1818, daté de 1819)","accroche":"Désirer fait souffrir. Obtenir ennuie. Schopenhauer en tire une conclusion que Freud, un siècle plus tard, reconnaîtra avoir rejointe sans le vouloir.","punch":"Le désir manque, l'ennui comble. La vie oscille entre les deux.","idee":"Le fond de toute chose est une volonté aveugle, sans but ni repos. Chez l'homme, elle prend la forme du désir, qui est souffrance. Satisfait, le désir s'éteint et laisse place à l'ennui. La vie va de l'un à l'autre, comme un pendule.","citation":"La vie oscille, comme un pendule, de droite à gauche, de la souffrance à l'ennui.","citation_source":"Schopenhauer, Le Monde comme volonté et comme représentation, IV, § 57 — trad. française citée par Major Prépa","citation_url":"https://major-prepa.com/culture-generale/schopenhauer-bonheur-desir-ennui/","liens":["pascal-divertissement","freud-moi-pas-maitre","freud-fort-da"],"texte":"Le grand livre de Schopenhauer paraît en décembre 1818, avec la date de 1819 sur la page de titre. Il passe presque inaperçu. Il faudra attendre les années 1850 pour que son auteur devienne célèbre. Son idée directrice tient en une phrase : derrière le monde tel qu'il nous apparaît, il y a la *volonté*.\n\nCe mot ne désigne pas une faculté consciente, comme lorsqu'on dit « j'ai de la volonté ». Il désigne une poussée aveugle, sans fin, un effort incessant sans but, qui s'exprime aussi bien dans la pesanteur d'une pierre que dans la croissance d'une plante ou l'instinct d'un animal. L'Encyclopédie de Stanford le résume ainsi : un effort sans fin, une impulsion aveugle, sans but en vue.\n\n## Le désir est souffrance\n\nChez l'être humain, la volonté se manifeste comme désir. Or le désir, de sa nature, est souffrance : il naît d'un manque, d'un état qui ne nous satisfait pas. Tant qu'il n'est pas satisfait, il fait souffrir.\n\nEt la satisfaction ? Elle ne dure pas. La possession enlève au désir son attrait, et le désir renaît sous une forme nouvelle. La satisfaction n'est pas un état positif qui s'installerait : c'est seulement la cessation, momentanée, d'une douleur.\n\n> **Exemple.** Pendant des mois, vous rêvez d'un appartement plus grand. Vous le trouvez, vous signez, vous emménagez : quelques semaines de joie réelle. Puis il devient « votre appartement », c'est-à-dire le décor ordinaire. Et un nouveau désir s'est déjà formé : un balcon, un autre quartier, une maison. Schopenhauer ne dit pas que la joie était fausse. Il dit qu'elle était la fin d'un manque, pas le début d'un état durable.\n\n## L'ennui\n\nSupposons pourtant que tout soit obtenu, que rien ne manque. Le désir n'ayant plus d'objet, il reste l'existence nue. Elle se révèle alors dans toute sa vacuité : c'est le dégoût, le vide, l'ennui, ennemis plus rudes encore que le besoin.\n\nL'ennui n'est pas pour Schopenhauer un mal mineur. C'est un tourment aussi réel que la faim, et la société tout entière, avec ses jeux et ses distractions, s'emploie à s'en défendre.\n\nD'où l'image du § 57 : la vie oscille, comme un pendule, de droite à gauche, de la souffrance à l'ennui. D'un côté le manque qui fait souffrir, de l'autre la satiété qui ennuie. La vie la plus heureuse, ajoute-t-il, est celle où désir et satisfaction se succèdent à des intervalles ni trop longs ni trop courts, de sorte que la souffrance descend à son minimum.\n\n> **Exemple.** On attend les vacances toute l'année. Les trois premiers jours, c'est le bonheur. Le dixième, sur la plage, on se surprend à consulter ses mails, à chercher une activité, à s'ennuyer franchement. Le pendule est passé de l'autre côté. Ce n'est pas que les vacances soient ratées : c'est que l'absence de manque ne suffit pas à remplir une vie.\n\n## Les issues\n\nSchopenhauer ne se contente pas de ce constat. Il indique des voies, toutes temporaires sauf la dernière.\n\n**L'art**, d'abord, et surtout la musique. Dans la contemplation esthétique, nous cessons pour un moment d'être un individu qui veut, pour devenir un pur regard qui contemple. Mais ce n'est qu'une transcendance de courte durée.\n\n**La compassion**, ensuite, qui reconnaît dans la souffrance de l'autre la même volonté qui souffre en moi. Elle fonde, pour Schopenhauer, la morale.\n\n**La négation du vouloir-vivre**, enfin, chez l'ascète ou le saint, qui éteint le désir à sa source. C'est la seule délivrance durable.\n\n> **Exemple.** Pendant les quatre minutes d'un morceau qui vous bouleverse, vous ne voulez plus rien. Vous ne pensez ni à ce qui vous manque ni à ce que vous ferez ensuite. Puis le morceau s'achève et le monde revient, avec ses demandes. Schopenhauer a décrit exactement ce répit, et sa limite : l'art suspend la volonté, il ne la supprime pas.\n\n## Ce que Freud y a reconnu\n\nFreud a souvent dit n'avoir lu Schopenhauer que tard. Il reconnaît pourtant, dans *Une difficulté de la psychanalyse* (1917), que des philosophes ont précédé la psychanalyse, et cite nommément le grand penseur Schopenhauer, dont la « volonté » inconsciente équivaut aux pulsions de la psychanalyse.\n\nDans *Au-delà du principe de plaisir* (1920), alors qu'il vient de poser l'hypothèse d'une pulsion de mort, il note qu'il est entré, sans le vouloir, dans le port de la philosophie de Schopenhauer, pour qui la mort est le véritable résultat, et donc le but, de la vie.\n\nLa parenté est réelle, et ses limites aussi. Schopenhauer construit une métaphysique du monde ; Freud élabore une théorie à partir de la clinique, révisable selon ce qu'elle observe. Mais tous deux ont refusé de faire de la conscience la maîtresse du jeu, et tous deux ont pris au sérieux l'idée que nous ne voulons pas d'abord ce que nous croyons vouloir.","quiz":[{"question":"Pourquoi le désir est-il souffrance selon Schopenhauer ?","choix":["Parce qu'il est condamné par la morale religieuse","Parce que tout désir naît d'un manque, d'un état non satisfaisant","Parce qu'il conduit nécessairement à la violence","Parce que la société interdit la plupart des désirs"],"bonne":1,"explication":"Le désir est par nature manque, donc souffrance tant qu'il n'est pas satisfait. Schopenhauer ne raisonne pas en moraliste, ne lie pas le désir à la violence, et l'interdit social n'est pas la cause qu'il invoque."},{"question":"Que se passe-t-il lorsqu'un désir est enfin satisfait ?","choix":["On atteint un bonheur durable, qui ne demande plus rien","La volonté disparaît définitivement, comme chez le saint","La satisfaction s'éteint vite et laisse place à un autre désir ou à l'ennui","On devient incapable de désirer à nouveau quoi que ce soit"],"bonne":2,"explication":"La satisfaction n'est que la cessation d'une douleur ; elle est brève, puis vient un autre désir ou l'ennui. Elle n'a rien de durable, et la volonté ne s'abolit que dans la négation du vouloir-vivre, non par la satisfaction."},{"question":"Quelle est la vie la plus heureuse, selon le § 57 ?","choix":["Celle où désir et satisfaction se succèdent à intervalles ni trop longs ni trop courts","Celle où tous les désirs sont satisfaits une fois pour toutes","Celle qui renonce dès l'enfance à tout désir","Celle qui accumule le plus grand nombre de plaisirs différents"],"bonne":0,"explication":"Quand désir et satisfaction alternent à un rythme mesuré, la souffrance descend à son minimum. La satisfaction totale mènerait à l'ennui, le renoncement relève de l'ascèse et non de la vie heureuse ordinaire, et l'accumulation ne change rien au pendule."},{"question":"Quelle voie permet une extinction durable de la volonté ?","choix":["L'art, et surtout la musique","La réussite sociale et l'accumulation des richesses","Le progrès scientifique et la maîtrise de la nature","La négation du vouloir-vivre, chez l'ascète ou le saint"],"bonne":3,"explication":"L'art n'apporte qu'une suspension de courte durée ; la richesse et le progrès relèvent encore de la volonté qui désire. Seule la négation du vouloir-vivre éteint le désir à sa source."}],"sources":[{"texte":"Schopenhauer : bonheur, désir et ennui (citations du livre IV, § 57), Major Prépa","url":"https://major-prepa.com/culture-generale/schopenhauer-bonheur-desir-ennui/"},{"texte":"Stanford Encyclopedia of Philosophy, « Arthur Schopenhauer »","url":"https://plato.stanford.edu/entries/schopenhauer/"},{"texte":"Freud, Une difficulté de la psychanalyse (1917), trad. M. Bonaparte et E. Marty","url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/une-difficulte-de-la-psychanalyse-1917.pdf"},{"texte":"Freud, Beyond the Pleasure Principle, trad. C. J. M. Hubback (1922), Project Gutenberg","url":"https://gutenberg.org/ebooks/76031"}]},{"id":"freud-deuil-melancolie","discipline":"psychanalyse","titre":"Deuil et mélancolie","figure":"Sigmund Freud","reference":"Deuil et mélancolie (rédigé en 1915, publié en 1917)","accroche":"Dans le deuil, c'est le monde qui est devenu pauvre et vide. Dans la mélancolie, c'est le moi. Freud cherche ce qui fait basculer de l'un à l'autre.","punch":"Dans le deuil, le monde s'est vidé. Dans la mélancolie, c'est le moi.","idee":"Le deuil est un travail : retirer, souvenir après souvenir, la libido investie dans l'objet perdu. La mélancolie présente les mêmes traits, plus un : l'effondrement de l'estime de soi. Les autoreproches du mélancolique visent en réalité l'objet perdu, avec lequel le moi s'est identifié.","citation":"L'ombre de l'objet tomba ainsi sur le moi.","citation_source":"Freud, Deuil et mélancolie (1917) — traduit de l'allemand ; cf. trad. anglaise de Strachey, « Thus the shadow of the object fell upon the ego »","citation_url":"https://ia903101.us.archive.org/29/items/FreudMourningAndMelancholia/Freud_MourningAndMelancholia_text.pdf","liens":["epicure-mort","freud-fort-da","green-mere-morte"],"texte":"Freud écrit ce texte en 1915, en pleine guerre, au cours d'une période de grande élaboration théorique, et le publie en 1917. C'est l'un de ses écrits les plus denses, et l'un des plus proches de la clinique. Il part d'une comparaison : le deuil, que tout le monde connaît, éclaire la mélancolie, qui reste énigmatique.\n\n## Le travail du deuil\n\nFreud commence par le deuil normal, qu'il ne considère pas comme une maladie. On ne songe pas à le soigner, remarque-t-il : on sait qu'il passera. Il en décrit les traits : une humeur profondément douloureuse, la perte d'intérêt pour le monde extérieur, l'incapacité de choisir un nouvel objet d'amour, le détournement de toute activité qui ne se rapporte pas au disparu.\n\nCe qui se passe est un *travail*. L'épreuve de la réalité a montré que l'objet aimé n'existe plus, et elle exige que toute la libido soit retirée des liens qui la retenaient à cet objet. Cette exigence suscite une révolte compréhensible : on n'abandonne pas volontiers une position libidinale.\n\nLe travail s'effectue donc en détail, pièce par pièce, au prix d'un grand coût de temps et d'énergie. Chaque souvenir, chaque attente qui liait la libido à l'objet est rappelé, surinvesti, puis le détachement s'opère. Au terme, le moi redevient libre.\n\n> **Exemple.** Après la mort de son père, une femme tombe sur sa liste de courses, écrite de sa main. Elle reste longtemps à la regarder. Un mois plus tard, c'est son parfum dans un manteau ; puis le premier anniversaire sans lui ; puis le match qu'ils regardaient ensemble. Chaque fois, la douleur est vive, puis elle s'apaise un peu. Freud décrit exactement cela : non pas un oubli global, mais une longue série de détachements, souvenir après souvenir.\n\n## Ce qui distingue la mélancolie\n\nLa mélancolie présente les mêmes traits, avec un de plus : une diminution extraordinaire du sentiment d'estime de soi, un immense appauvrissement du moi. Le mélancolique se décrit comme indigne, incapable, moralement condamnable ; il s'injurie, s'avilit, et attend d'être rejeté et puni.\n\nD'où la formule célèbre : dans le deuil, c'est le monde qui est devenu pauvre et vide ; dans la mélancolie, c'est le moi lui-même.\n\nAutre différence : la perte, dans la mélancolie, est en partie soustraite à la conscience. Le mélancolique sait parfois *qui* il a perdu, mais pas *ce qu'il* a perdu en lui.\n\n> **Exemple, fictif.** Après une rupture, un homme ne dit presque rien de sa compagne. Il parle surtout de lui : il est nul, il n'a jamais rien réussi, il ne mérite l'amour de personne. Ses amis tentent de le rassurer, en vain. Il ne semble pas pleurer quelqu'un, mais s'accuser. Freud invite à écouter ces accusations autrement.\n\n## La clé des autoreproches\n\nLe pas décisif vient d'une observation clinique. Quand on écoute patiemment les auto-accusations du mélancolique, on remarque qu'elles s'appliquent souvent mal à lui, et beaucoup mieux à une autre personne : celle qu'il a aimée, qu'il aime ou qu'il devrait aimer. Les reproches qu'il s'adresse sont des reproches contre un objet aimé, qui ont été détournés de cet objet et reportés sur son propre moi. En allemand, Freud joue sur les mots : leurs plaintes (*Klagen*) sont des accusations (*Anklagen*).\n\nLe mécanisme est le suivant. L'objet a été perdu, mais au lieu de se détacher de lui et de se porter sur un autre, la libido s'est retirée dans le moi. Elle y a servi à établir une identification du moi avec l'objet abandonné. L'ombre de l'objet est ainsi tombée sur le moi. Désormais, une partie du moi s'oppose à l'autre et la juge, comme elle jugerait l'objet perdu.\n\n> **Exemple, fictif, suite.** En séance, l'homme finit par dire : « Je suis quelqu'un qui abandonne les gens, qui ne tient jamais ses promesses. » L'analyste remarque que c'est exactement ce qu'il reprochait autrefois à sa compagne, partie sans prévenir. La colère qu'il ne pouvait pas lui adresser s'est retournée contre lui : en s'identifiant à elle, il est devenu l'objet de ses propres reproches.\n\n## L'ambivalence\n\nPour que ce mouvement se produise, il faut deux conditions. D'abord un choix d'objet de type narcissique : on aimait l'autre en partie comme un double de soi. Ensuite une forte ambivalence : l'amour et la haine pour l'objet coexistent. Si l'amour se réfugie dans l'identification, la haine s'exerce sur cet objet de substitution qu'est devenu le moi.\n\n## Ce que le texte prépare\n\nCe texte en prépare d'autres. L'instance critique qui, dans la mélancolie, juge le moi deviendra en 1923, dans *Le Moi et le Ça*, le surmoi. Et l'identification aux objets perdus sera pensée comme constitutive du moi lui-même : le moi serait, en partie, le précipité des objets que nous avons aimés et perdus.\n\nCe qui commence comme une étude d'un état pathologique devient ainsi une théorie de la manière dont chacun se construit, à partir de ses pertes.","quiz":[{"question":"Comment Freud décrit-il le travail du deuil ?","choix":["Comme un oubli rapide et volontaire de l'objet perdu","Comme un détachement progressif de la libido, souvenir par souvenir","Comme une maladie qu'il faut traiter au plus vite par des médicaments","Comme le remplacement immédiat de l'objet perdu par un autre"],"bonne":1,"explication":"Le deuil s'effectue en détail : chaque souvenir est surinvesti puis détaché. Il n'est ni rapide ni volontaire, Freud ne le tient pas pour pathologique, et la difficulté à investir un nouvel objet fait précisément partie de ses signes."},{"question":"Quel trait distingue la mélancolie du deuil ?","choix":["La perte d'intérêt pour tout ce qui concerne le monde extérieur","L'humeur profondément douloureuse","L'effondrement de l'estime de soi et l'appauvrissement du moi","L'inhibition de toute activité"],"bonne":2,"explication":"Les trois autres traits sont communs au deuil et à la mélancolie. Ce qui s'ajoute dans la mélancolie, c'est l'abaissement de l'estime de soi : dans le deuil, le monde se vide ; dans la mélancolie, c'est le moi."},{"question":"Que révèlent les autoreproches du mélancolique ?","choix":["Une lucidité exceptionnelle sur ses propres défauts, enfin aperçus","Une simple exagération, sans signification pour l'analyse","Des reproches contre l'objet aimé, retournés sur le moi","Un désir conscient d'attirer la compassion de l'entourage"],"bonne":2,"explication":"Ces accusations s'appliquent mieux à une autre personne aimée, l'objet perdu, avec lequel le moi s'est identifié. Freud prend au sérieux leur contenu sans y voir une lucidité supérieure, refuse de les réduire à une exagération, et le mécanisme n'est pas conscient."},{"question":"Que deviendra l'instance critique qui juge le moi dans la mélancolie ?","choix":["Le ça, siège des pulsions","La pulsion de mort, découverte en 1920","Le surmoi, dans Le Moi et le Ça (1923)","L'inconscient collectif"],"bonne":2,"explication":"L'agence qui juge le moi annonce le surmoi, que Freud nomme en 1923. Le ça désigne le pôle pulsionnel, la pulsion de mort n'est pas une instance, et l'inconscient collectif est une notion de Jung."}],"sources":[{"texte":"Freud, Mourning and Melancholia, trad. James Strachey (PDF, Internet Archive)","url":"https://ia903101.us.archive.org/29/items/FreudMourningAndMelancholia/Freud_MourningAndMelancholia_text.pdf"},{"texte":"Article sur Trauer und Melancholie : « Klagen sind Anklagen » (Psychotherapie-Wissenschaft)","url":"https://psychotherapie-wissenschaft.info/article/download/231/432/0"},{"texte":"Encyclopædia Universalis, « Mélancolie : psychanalyse et philosophie »","url":"https://www.universalis.fr/encyclopedie/melancolie/2-psychanalyse-et-philosophie/"}]},{"id":"epicure-mort","discipline":"philosophie","titre":"La mort n'est rien pour nous","figure":"Épicure","reference":"Lettre à Ménécée, 124–127 (IIIe s. av. J.-C.)","accroche":"Épicure propose un argument de quelques lignes contre la peur de mourir. Vingt-trois siècles plus tard, on le discute encore. Presque personne n'en est consolé.","punch":"Quand nous sommes, la mort n'est pas là. Quand elle est là, nous ne sommes plus.","idee":"Tout bien et tout mal résident dans la sensation ; la mort est privation de sensation. Elle ne peut donc nous atteindre ni vivants ni morts. Ce qui fait souffrir, c'est l'attente, et l'attente d'un rien est vaine.","citation":"Tout bien et tout mal sont contenus dans la sensation ; or la mort est privation de sensation.","citation_source":"Épicure, Lettre à Ménécée, 124 — traduction reproduite sur mediterranees.net","citation_url":"https://mediterranees.net/litterature/cours_antique/docs_grec/Au-dela/Epicure_Menecee.pdf","liens":["freud-deuil-melancolie","schopenhauer-pendule","pascal-divertissement"],"texte":"La *Lettre à Ménécée* est un abrégé. Épicure y condense, pour un disciple, ce qu'il faut méditer jour et nuit pour vivre heureux. La tradition en a tiré ce qu'on appelle le « quadruple remède » : les dieux ne sont pas à craindre, la mort n'est pas à redouter, le bien est facile à obtenir, le mal facile à supporter.\n\nLe deuxième point tient en un argument d'une sécheresse admirable.\n\n## L'argument\n\nPremier temps : tout bien et tout mal sont contenus dans la sensation. C'est la thèse générale de l'éthique épicurienne. Le plaisir et la douleur sont les critères de ce qui nous importe ; ce qu'on ne sent pas ne peut ni nous réjouir ni nous blesser.\n\nDeuxième temps : la mort est privation de sensation. Pour un atomiste comme Épicure, l'âme est faite d'atomes, comme le corps. Mourir, c'est leur dispersion. Il n'y a personne pour faire l'expérience d'être mort.\n\nConclusion : la mort n'est rien pour nous. Tant que nous sommes, la mort n'est pas présente ; et quand la mort est présente, nous ne sommes plus. Elle ne concerne donc ni les vivants, puisqu'elle n'est pas pour eux, ni les morts, puisqu'ils ne sont plus.\n\n> **Exemple.** Pensez à une anesthésie générale. On compte à rebours, dix, neuf, huit… puis on se réveille en salle de réveil. Entre les deux, il n'y a rien : pas d'attente, pas d'ennui, pas d'angoisse. Personne ne garde un mauvais souvenir de ce rien-là, puisqu'il n'y avait personne pour l'éprouver. L'argument d'Épicure demande de penser la mort sur ce modèle, sans réveil.\n\n## L'attente\n\nÉpicure ajoute une remarque psychologique fine. Celui qui dit craindre la mort, non parce qu'elle le fera souffrir quand elle sera là, mais parce qu'il souffre de l'attendre, se trompe. Ce dont la présence ne nous gêne pas ne suscite, quand on l'attend, qu'une douleur sans fondement.\n\nLa peur de la mort serait donc une souffrance d'anticipation, entièrement fabriquée par celui qui l'éprouve. Elle gâche la vie présente au nom d'un état où il n'y aura plus personne pour être gêné.\n\nD'où une conséquence pratique. Le but n'est pas de rendre la vie plus longue, mais de supprimer le désir d'immortalité. Le sage, dit la lettre, fait comme celui qui choisit sa nourriture : il ne prend pas la plus abondante, mais la plus agréable. Il ne cherche pas le temps le plus long, mais le plus doux.\n\n> **Exemple.** Deux personnes ont rendez-vous pour une biopsie dont le résultat tombera dans dix jours. La première passe les dix jours à imaginer le pire, ne dort plus, ne voit plus personne. La seconde se dit que le résultat sera ce qu'il sera, et qu'en attendant, ces dix jours sont à vivre. Le résultat ne dépend pas de leur attitude. Les dix jours, si. Épicure ne promet pas que le résultat sera bon ; il montre ce que coûte l'attente.\n\n## Les objections qui résistent\n\nL'argument a suscité deux grandes familles de réponses, que l'Encyclopédie de philosophie de Stanford résume bien.\n\n**La privation.** Thomas Nagel, dans un article de 1970 intitulé simplement « Death », soutient qu'on peut subir un tort sans en faire l'expérience. Il donne l'exemple de la promesse faite à un mourant : la rompre après sa mort, c'est lui faire du tort, même s'il n'en saura jamais rien. La mort serait un mal par ce qu'elle nous ôte : les biens que nous aurions eus si nous avions continué de vivre.\n\n**L'asymétrie.** Lucrèce, disciple romain d'Épic
