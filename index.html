</head><body><title>Après-coup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une colonne de lecture (68ch max), barre d'onglets fixe en bas,
   la fiche s'ouvre dans la même colonne. Deux encres : philosophie (sarcelle),
   psychanalyse (sang-de-bœuf), sur un papier gris-vert froid. */
:root {
  --papier: #ECEEE9;
  --feuille: #F7F8F4;
  --encre: #1B2024;
  --gris: #5A6468;
  --filet: #CBD1CA;
  --philo: #1E5C57;
  --psy: #8C2F3E;
  --philo-voile: rgba(30, 92, 87, .10);
  --psy-voile: rgba(140, 47, 62, .10);
  --juste: #2D7A4C;
  --faux: #B3261E;
  --ombre: rgba(27, 32, 36, .08);
  --f-titre: "Gloock", "Bodoni 72", "Didot", Georgia, serif;
  --f-texte: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-repere: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-0: .78rem; --t-1: .9rem; --t-2: 1.05rem; --t-3: 1.2rem; --t-4: 1.55rem; --t-5: 2.2rem; --t-6: 3.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #121618; --feuille: #1A1F22; --encre: #E3E6E0; --gris: #9AA4A7; --filet: #2E363A;
    --philo: #6CC2B8; --psy: #E58A97; --philo-voile: rgba(108, 194, 184, .12); --psy-voile: rgba(229, 138, 151, .12);
    --juste: #6FCF97; --faux: #F28B82; --ombre: rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #121618; --feuille: #1A1F22; --encre: #E3E6E0; --gris: #9AA4A7; --filet: #2E363A;
  --philo: #6CC2B8; --psy: #E58A97; --philo-voile: rgba(108, 194, 184, .12); --psy-voile: rgba(229, 138, 151, .12);
  --juste: #6FCF97; --faux: #F28B82; --ombre: rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--papier); }
body {
  color: var(--encre); font-family: var(--f-texte); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papier); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 3px; border-radius: 2px; }
a { color: inherit; }

.coquille {
  max-width: 44rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}

/* En-tête */
.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.marque { display: flex; align-items: center; gap: 10px; font-family: var(--f-titre); font-size: var(--t-3); letter-spacing: .01em; }
.sceau { position: relative; width: 26px; height: 18px; flex: none; }
.sceau i { position: absolute; top: 0; width: 18px; height: 18px; border-radius: 50%; mix-blend-mode: multiply; }
.sceau i:first-child { left: 0; background: var(--philo); }
.sceau i:last-child { right: 0; background: var(--psy); opacity: .92; }
:root[data-theme="dark"] .sceau i { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sceau i { mix-blend-mode: screen; } }
.date-du-jour { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); text-transform: uppercase; letter-spacing: .08em; }

/* Étiquettes */
.etiquette { font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; color: var(--gris); }
.disc { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; }
.disc::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.disc.philosophie { color: var(--philo); }
.disc.psychanalyse { color: var(--psy); }

/* Vue Aujourd'hui */
.vue { display: grid; gap: 28px; padding-top: 8px; }
.seance-num { font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; color: var(--gris); font-variant-numeric: tabular-nums; }
.une { display: grid; gap: 14px; padding-block: 22px 26px; border-top: 3px solid var(--encre); border-bottom: 1px solid var(--filet); }
.une h1 { font-family: var(--f-titre); font-weight: 400; font-size: clamp(2.3rem, 9vw, var(--t-6)); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.une .figure { font-style: italic; color: var(--gris); font-size: var(--t-2); }
.une .accroche { font-size: var(--t-3); line-height: 1.45; margin: 4px 0 0; max-width: 34em; }
.rang { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bouton {
  display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 3px;
  background: var(--encre); color: var(--papier); padding: 13px 20px;
  font-family: var(--f-repere); font-size: var(--t-1); letter-spacing: .04em;
}
.bouton.secondaire { background: transparent; color: var(--encre); box-shadow: inset 0 0 0 1.5px var(--encre); }
.bouton.discret { background: transparent; color: var(--gris); padding-inline: 4px; }
.bouton:disabled { opacity: .45; cursor: default; }

.verrou { display: grid; gap: 6px; padding: 18px 0 0; }
.compte { font-family: var(--f-titre); font-size: var(--t-5); font-variant-numeric: tabular-nums; line-height: 1; }
.verrou p { margin: 0; color: var(--gris); }

.rappel { background: var(--feuille); border-radius: 4px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 1px 0 var(--filet); }
.rappel h2 { margin: 0; font-weight: 500; font-size: var(--t-3); line-height: 1.35; }

/* Bibliothèque */
.outils { display: grid; gap: 12px; }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre { border: 1.5px solid var(--filet); background: transparent; border-radius: 99px; padding: 6px 14px; font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .06em; text-transform: uppercase; }
.filtre[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: var(--papier); }
.recherche { width: 100%; border: 0; border-bottom: 1.5px solid var(--filet); background: transparent; padding: 10px 2px; font-size: var(--t-2); }
.recherche:focus { outline: none; border-bottom-color: var(--encre); }
.liste { list-style: none; margin: 0; padding: 0; }
.liste li + li { border-top: 1px solid var(--filet); }
.item { width: 100%; text-align: left; background: none; border: 0; padding: 16px 0; display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 4px 14px; align-items: baseline; }
.item .n { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); font-variant-numeric: tabular-nums; grid-row: span 2; }
.item .t { font-family: var(--f-titre); font-size: var(--t-3); line-height: 1.15; min-width: 0; }
.item .s { grid-column: 2; color: var(--gris); font-size: var(--t-1); font-style: italic; min-width: 0; }
.item .etat { grid-row: 1 / span 2; grid-column: 3; align-self: center; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--filet); }
.item .etat.lu.philosophie { background: var(--philo); box-shadow: none; }
.item .etat.lu.psychanalyse { background: var(--psy); box-shadow: none; }
.item:disabled { cursor: default; }
.item:disabled .t { color: var(--gris); }
.a-venir { color: var(--gris); font-size: var(--t-1); padding-top: 6px; }

/* Lecture */
.barre-lecture {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--papier);
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding-block: 12px 10px;
  border-bottom: 1px solid var(--filet);
}
.barre-lecture .retour { border: 0; background: none; padding: 6px 8px 6px 0; font-family: var(--f-repere); font-size: var(--t-1); }
.barre-lecture .titre-court { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-titre); font-size: var(--t-2); }
.progression { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--encre); transition: width .1s linear; }
.fiche { display: grid; gap: 22px; padding-top: 26px; }
.fiche header { display: grid; gap: 12px; }
.fiche h1 { font-family: var(--f-titre); font-weight: 400; font-size: clamp(2.2rem, 8.5vw, var(--t-6)); line-height: 1.03; margin: 0; text-wrap: balance; }
.ref { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .02em; line-height: 1.6; }
.avis { margin: 0; font-family: var(--f-repere); font-size: var(--t-0); line-height: 1.5; color: var(--gris); border-left: 2px solid var(--filet); padding-left: 10px; }
.lead { font-size: var(--t-3); font-style: italic; line-height: 1.45; margin: 0; }
.citation { margin: 0; padding: 18px 0 18px 20px; border-left: 3px solid var(--ink, var(--encre)); background: var(--voile, transparent); }
.citation blockquote { margin: 0; font-size: var(--t-4); line-height: 1.3; font-family: var(--f-texte); font-weight: 500; text-wrap: pretty; }
.citation blockquote::before { content: "« "; } .citation blockquote::after { content: " »"; }
.citation figcaption { margin-top: 10px; font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); }
.repere { margin: 0; padding: 16px 18px; border: 1.5px solid var(--ink, var(--encre)); border-radius: 3px; display: grid; gap: 8px; }
.repere p { margin: 0; font-size: var(--t-1); line-height: 1.55; }
.corps { font-size: 1.15rem; line-height: 1.68; max-width: 36em; }
.corps p { margin: 0 0 1em; hyphens: auto; }
.corps h2 { font-family: var(--f-repere); font-weight: 500; font-size: var(--t-0); letter-spacing: .1em; text-transform: uppercase; margin: 2em 0 .9em; color: var(--ink, var(--encre)); display: flex; align-items: center; gap: 10px; }
.corps h2::after { content: ""; flex: 1; height: 1px; background: var(--filet); }
.corps ul { margin: 0 0 1em; padding-left: 1.1em; }
.corps li { margin-bottom: .5em; }
.ecoute { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ecoute .bouton { padding: 9px 14px; font-size: var(--t-0); }

.bloc { display: grid; gap: 14px; padding-top: 22px; border-top: 1px solid var(--filet); }
.bloc > h2 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: var(--t-4); }
.question { display: grid; gap: 10px; padding-bottom: 14px; }
.question p.q { margin: 0; font-weight: 500; font-size: var(--t-2); line-height: 1.4; }
.choix { display: grid; gap: 8px; }
.choix button { text-align: left; background: var(--feuille); border: 1.5px solid transparent; border-radius: 3px; padding: 11px 14px; line-height: 1.4; font-size: var(--t-1); }
.choix button:hover:not(:disabled) { border-color: var(--filet); }
.choix button:disabled { cursor: default; }
.choix button.juste { border-color: var(--juste); color: var(--juste); font-weight: 500; }
.choix button.faux { border-color: var(--faux); color: var(--faux); }
.choix button.barre { text-decoration: line-through; opacity: .55; }
.explication { margin: 0; font-size: var(--t-1); line-height: 1.55; color: var(--gris); }
.explication strong { color: var(--encre); font-weight: 600; }
.notes textarea { width: 100%; min-height: 7.5rem; resize: vertical; border: 1.5px solid var(--filet); border-radius: 3px; background: var(--feuille); padding: 12px 14px; font-size: var(--t-2); line-height: 1.5; }
.notes textarea:focus { outline: none; border-color: var(--encre); }
.notes small { color: var(--gris); font-family: var(--f-repere); font-size: var(--t-0); }
.resonances { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.resonance { text-align: left; background: none; border: 1.5px solid var(--filet); border-radius: 3px; padding: 14px; display: grid; gap: 6px; }
.resonance .t { font-family: var(--f-titre); font-size: var(--t-3); line-height: 1.15; }
.resonance:disabled { cursor: default; opacity: .6; }
.sources { margin: 0; padding-left: 1.1em; font-size: var(--t-1); color: var(--gris); line-height: 1.55; }
.sources li { margin-bottom: .5em; }
.sources a, .citation figcaption a { color: inherit; text-decoration: underline; text-decoration-color: var(--filet); text-underline-offset: 3px; }
.sources a:hover, .citation figcaption a:hover { text-decoration-color: currentColor; }
.exemple { margin: 0 0 1.2em; padding: 16px 18px; background: var(--voile, var(--feuille)); border-radius: 3px; font-size: 1.04rem; line-height: 1.62; }
.exemple p { margin: 0 0 .7em; } .exemple p:last-child { margin-bottom: 0; }
.exemple p:first-child strong:first-child { font-family: var(--f-repere); font-weight: 500; font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; color: var(--ink, var(--encre)); display: block; margin-bottom: 4px; }
.fin { display: grid; gap: 12px; justify-items: start; padding-block: 26px 10px; border-top: 3px solid var(--encre); }

/* Carnet */
.serie { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: end; padding-block: 18px 22px; border-top: 3px solid var(--encre); border-bottom: 1px solid var(--filet); }
.serie .grand { font-family: var(--f-titre); font-size: 5.2rem; line-height: .85; font-variant-numeric: tabular-nums; grid-row: span 2; }
.serie .mineurs { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .06em; text-transform: uppercase; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.releve { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 22rem; }
.releve span { aspect-ratio: 1; max-width: 100%; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--filet); }
.releve span.philosophie { background: var(--philo); box-shadow: none; }
.releve span.psychanalyse { background: var(--psy); box-shadow: none; }
.releve span.aujourdhui { box-shadow: inset 0 0 0 2px var(--encre); }
.jours-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 22rem; font-family: var(--f-repere); font-size: .68rem; color: var(--gris); text-align: center; }
.repartition { display: grid; gap: 12px; }
.ligne-rep { display: grid; grid-template-columns: 8.5rem 1fr 2rem; gap: 12px; align-items: center; font-size: var(--t-1); }
.ligne-rep .piste { height: 8px; background: var(--feuille); border-radius: 99px; overflow: hidden; }
.ligne-rep .piste i { display: block; height: 100%; border-radius: 99px; }
.ligne-rep b { font-family: var(--f-repere); font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; }
.note-item { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; gap: 4px; }
.note-item .t { font-family: var(--f-titre); font-size: var(--t-3); }
.note-item .extrait { color: var(--gris); font-size: var(--t-1); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Réglages */
.reglage { display: grid; gap: 10px; padding-block: 18px; border-top: 1px solid var(--filet); }
.reglage h2 { margin: 0; font-size: var(--t-2); font-weight: 600; }
.reglage p { margin: 0; color: var(--gris); font-size: var(--t-1); }
.segments { display: flex; flex-wrap: wrap; gap: 8px; }
.segments button { border: 1.5px solid var(--filet); background: transparent; border-radius: 3px; padding: 9px 14px; font-size: var(--t-1); }
.segments button[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: var(--papier); }
select.champ { border: 1.5px solid var(--filet); background: var(--feuille); border-radius: 3px; padding: 9px 12px; max-width: 100%; }
.sync { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .04em; }
.confirmation { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Onglets */
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--papier);
  border-top: 2px solid var(--encre);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.onglets nav { max-width: 44rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.onglet { border: 0; background: none; padding: 12px 2px 14px; display: grid; justify-items: center; gap: 6px; font-family: var(--f-repere); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--gris); }
.onglet i { width: 7px; height: 7px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.onglet[aria-current="page"] { color: var(--encre); font-weight: 500; }
.onglet[aria-current="page"] i { background: var(--encre); box-shadow: none; }

/* Carte partageable */
.voile-carte { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 14, .72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panneau-carte { background: var(--papier); border-radius: 6px; padding: 16px; display: grid; gap: 12px; justify-items: center; max-height: 100%; overflow: auto; width: min(26rem, 100%); }
.panneau-carte img { width: 100%; max-width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 3px; box-shadow: 0 8px 30px var(--ombre); }
.panneau-carte p { margin: 0; color: var(--gris); font-size: var(--t-1); text-align: center; }

.vide { color: var(--gris); font-style: italic; margin: 0; }
@media (max-width: 420px) { .ligne-rep { grid-template-columns: 6.8rem 1fr 1.6rem; } .item { grid-template-columns: 2.6rem 1fr auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="coquille">
  <header class="entete">
    <div class="marque"><span class="sceau" aria-hidden="true"><i></i><i></i></span>Après-coup</div>
    <div class="date-du-jour" id="date-du-jour"></div>
  </header>
  <main id="vue" aria-live="polite"></main>
</div>
<div class="onglets"><nav id="onglets" aria-label="Navigation">
  <button class="onglet" data-onglet="jour"><i></i>Aujourd'hui</button>
  <button class="onglet" data-onglet="biblio"><i></i>Bibliothèque</button>
  <button class="onglet" data-onglet="carnet"><i></i>Carnet</button>
  <button class="onglet" data-onglet="reglages"><i></i>Réglages</button>
</nav></div>

<script>
const FICHES = [{"id":"freud-moi-pas-maitre","discipline":"psychanalyse","titre":"Les trois blessures narcissiques","figure":"Sigmund Freud","reference":"Une difficulté de la psychanalyse (1917)","accroche":"Copernic, Darwin, Freud. La liste a l'air d'un coup d'orgueil. Freud y décrit plutôt pourquoi on ne veut pas entendre la psychanalyse.","punch":"Après Copernic et Darwin, la troisième humiliation : le moi n'est pas maître dans sa propre maison.","idee":"L'humanité a subi trois humiliations : la Terre n'est pas au centre de l'univers, l'homme n'est pas séparé de l'animal, et le moi n'est pas maître dans sa propre maison. La résistance à la psychanalyse est d'abord une résistance narcissique.","citation":"Le moi n'est pas maître dans sa propre maison.","citation_source":"Freud, Une difficulté de la psychanalyse (1917) — trad. Marie Bonaparte et E. Marty","citation_url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/une-difficulte-de-la-psychanalyse-1917.pdf","liens":["descartes-malin-genie","ricoeur-soupcon","schopenhauer-pendule"],"texte":"En 1917, Freud écrit un court article pour la revue littéraire hongroise *Nyugat*, publiée à Budapest ; il paraît la même année en allemand dans la revue *Imago*. On attendrait une présentation de la psychanalyse. Freud choisit un angle inattendu : expliquer pourquoi elle rencontre tant de résistance. La difficulté, dit-il, n'est pas intellectuelle. Elle est *affective*.\n\n## Le narcissisme de l'humanité\n\nFreud part de sa théorie du narcissisme, élaborée en 1914 : le moi est investi de libido, il s'aime. Ce narcissisme vaut aussi, toutes proportions gardées, pour l'humanité dans son ensemble. Elle a de bonnes raisons de se croire au centre. Et la science lui a infligé trois humiliations, trois blessures à cet amour de soi.\n\n**La blessure cosmologique.** L'homme a d'abord cru que la Terre était le centre immobile de l'univers. La ruine de cette illusion narcissique se rattache, écrit Freud, au nom et à l'œuvre de Nicolas Copernic. La Terre devient une petite planète parmi d'autres.\n\n**La blessure biologique.** L'homme s'est ensuite cru d'une nature à part, séparé du règne animal par une âme. Les travaux de Charles Darwin, de ses collaborateurs et de ses prédécesseurs ont mis fin à cette prétention. L'homme descend d'espèces animales et garde en lui les traces de cette parenté.\n\n**La blessure psychologique.** C'est celle que porte la psychanalyse : le moi n'est pas maître dans sa propre maison.\n\n> **Exemple.** On peut mesurer la force de ces blessures aux résistances qu'elles ont suscitées. Galilée a été condamné en 1633 pour avoir défendu le système de Copernic. L'enseignement de l'évolution a été interdit dans certains États américains au XXe siècle : c'est l'objet du célèbre « procès du singe » de 1925. Freud ne compare pas sa théorie à celles de Copernic et Darwin pour sa valeur scientifique. Il compare les réactions qu'elles provoquent.\n\n## Ce que dit la troisième blessure\n\nFreud détaille. Le moi se croit informé de tout ce qui se passe dans le psychisme, et se croit en mesure de le diriger. Les névroses montrent le contraire. Des pensées surgissent sans qu'on sache d'où elles viennent ; des impulsions agissent qu'on ne reconnaît pas comme siennes ; le moi ne parvient pas à les chasser.\n\nFreud fait alors parler la psychanalyse, qui s'adresse au moi : tu te comportes comme un monarque absolu qui se contente des informations que lui donnent les hauts dignitaires de la cour, et qui ne descend jamais vers le peuple pour entendre sa voix.\n\n> **Exemple.** Une personne vérifie trois fois que la porte est fermée avant de partir. Elle sait que c'est fermé, elle l'a vu. Elle trouve cela absurde, en souffre, et le refait pourtant le lendemain. Elle n'a pas choisi cette compulsion et ne peut pas la congédier par décision. C'est le genre de fait clinique sur lequel Freud appuie sa thèse : il se passe dans la « maison » des choses que le maître de maison ne commande pas.\n\n## Deux thèses\n\nLa blessure repose sur deux affirmations de la psychanalyse.\n\nLa première : la vie pulsionnelle de la sexualité ne saurait être complètement domptée en nous. Il reste toujours une part que l'éducation, la morale et la raison ne parviennent pas à soumettre.\n\nLa seconde : les processus psychiques sont en eux-mêmes inconscients. Ils ne deviennent accessibles au moi que par une perception incomplète et peu fiable. La conscience n'est pas le psychisme ; elle n'en est qu'une province.\n\n> **Exemple.** Vous oubliez systématiquement le nom d'un collègue, alors que vous retenez sans peine tous les autres. Vous attribuez cela à la fatigue. Si l'on découvre que ce collègue porte le même prénom qu'une personne avec qui les choses se sont mal terminées, l'oubli prend un autre visage. Freud avait consacré un livre entier à ces petits ratés, la *Psychopathologie de la vie quotidienne* (1901).\n\n## Une résistance qui n'est pas un argument\n\nD'où la portée du texte. Si la psychanalyse est rejetée, ce n'est pas seulement parce qu'elle serait mal fondée. C'est parce qu'elle touche à quelque chose que nous tenons à préserver : l'idée que nous savons ce que nous pensons et que nous voulons ce que nous faisons.\n\nFreud n'est pas dupe de la grandeur de sa comparaison, et il le dit : la psychanalyse n'est pas la première à avoir avancé ces idées. Des philosophes l'ont précédée, et Freud cite nommément le grand penseur Schopenhauer, dont la « volonté » inconsciente équivaut aux pulsions de la psychanalyse. Mais ce que la psychanalyse apporte, c'est une démonstration fondée sur la clinique, sur un matériel qui touche chacun personnellement.\n\n## La blessure comme méthode\n\nOn peut lire la liste autrement que comme une revendication. Elle décrit aussi ce que l'analyse demande au patient : renoncer, sur un point précis de son histoire, à la souveraineté du moi, et accepter d'être surpris par ce qu'il dit. Ce que chacun éprouve en cure à petite échelle, Freud l'a projeté sur l'histoire des idées.","quiz":[{"question":"Quelles sont, dans l'ordre, les trois blessures narcissiques selon Freud ?","choix":["Biologique, cosmologique, sociologique","Cosmologique (Copernic), biologique (Darwin), psychologique (la psychanalyse)","Théologique, politique, psychologique","Cosmologique (Galilée), biologique (Pasteur), psychologique (Charcot)"],"bonne":1,"explication":"Copernic décentre la Terre, Darwin réinscrit l'homme dans le règne animal, la psychanalyse montre que le moi n'est pas maître chez lui. Freud ne parle ni de blessure sociologique, ni théologique ou politique, et c'est Copernic et Darwin qu'il nomme."},{"question":"À quoi Freud compare-t-il le moi ?","choix":["À un monarque absolu qui se fie aux rapports de ses hauts dignitaires","À un cavalier qui maîtrise parfaitement sa monture","À un juge impartial qui tranche entre les pulsions","À un architecte qui construit la personnalité pièce par pièce"],"bonne":0,"explication":"Le moi se contente des informations de sa cour et n'entend pas la voix du peuple. L'image du cavalier et du cheval existe chez Freud, mais ailleurs (Le Moi et le Ça, 1923), et pour dire précisément que le cavalier ne maîtrise pas toujours sa monture."},{"question":"Quelles thèses fondent la blessure psychologique ?","choix":["Le moi est entièrement déterminé par l'hérédité","La vie pulsionnelle reste indomptable et les processus psychiques sont inconscients","La conscience n'existe pas : c'est une illusion du langage","Le cerveau fonctionne comme une machine purement physiologique"],"bonne":1,"explication":"Freud avance deux thèses : l'indomptabilité de la vie pulsionnelle sexuelle et le caractère inconscient des processus psychiques, que le moi ne perçoit que partiellement. Il ne nie pas la conscience et ne réduit pas le psychisme à l'hérédité ou à une machine."},{"question":"Pourquoi, selon Freud, la psychanalyse suscite-t-elle tant de résistance ?","choix":["Parce que ses arguments scientifiques sont trop faibles","Parce qu'elle est trop coûteuse pour les patients","Parce qu'elle contredit la religion catholique","Parce qu'elle blesse le narcissisme : la résistance est d'abord affective"],"bonne":3,"explication":"La difficulté n'est pas intellectuelle mais affective : elle touche à l'idée que nous nous faisons de notre souveraineté. Freud ne concède pas la faiblesse de ses arguments et n'invoque ici ni le coût ni la religion."}],"sources":[{"texte":"Freud, Une difficulté de la psychanalyse (1917), trad. Marie Bonaparte et E. Marty","url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/une-difficulte-de-la-psychanalyse-1917.pdf"},{"texte":"Freud, A Difficulty in the Path of Psycho-Analysis, notice de la Freud-Edition","url":"https://www.freudedition.net/werke/difficulty-path-psycho-analysis/druckschrift"},{"texte":"Internet Encyclopedia of Philosophy, « Sigmund Freud »","url":"https://iep.utm.edu/freud/"}]},{"id":"descartes-malin-genie","discipline":"philosophie","titre":"Le malin génie","figure":"René Descartes","reference":"Méditations métaphysiques, I et II (1641 en latin, 1647 en français)","accroche":"Descartes imagine un être tout-puissant occupé à le tromper sur tout. Il en sort la seule certitude qu'aucune tromperie ne peut atteindre.","punch":"Qu'il me trompe tant qu'il voudra : pour être trompé, il faut être.","idee":"Pour fonder la science, Descartes pousse le doute jusqu'à l'hyperbole : un génie trompeur m'abuse peut-être en tout, même en mathématiques. Mais ce doute bute sur une limite : celui qui doute pense, et celui qui pense existe.","citation":"Cette proposition, je suis, j'existe, est nécessairement vraie toutes les fois que je la prononce, ou que je la conçois en mon esprit.","citation_source":"Descartes, Méditations métaphysiques, II — version française de 1647, orthographe modernisée","citation_url":"https://tim.cegep-lanaudiere.qc.ca/multisites/jeremymajorgauthier/wp-content/uploads/sites/31/2023/05/Meditations_metaphysiques-Meditation_seconde.pdf","liens":["lacan-stade-du-miroir","freud-moi-pas-maitre","husserl-epoche"],"texte":"Descartes ne doute pas par tempérament sceptique. Il doute par méthode : il veut savoir si quelque chose résiste. Une fois dans sa vie, écrit-il au début de la *Première Méditation*, il faut se défaire de toutes les opinions reçues jusque-là et recommencer tout de nouveau dès les fondements.\n\nIl ne passe pas les opinions en revue une à une : ce serait infini. Il s'attaque aux principes sur lesquels elles reposent. Si les fondations cèdent, tout l'édifice tombe avec elles.\n\n## Trois paliers de doute\n\n**Les sens.** Ils nous trompent parfois sur ce qui est petit ou éloigné. Or il est prudent de ne jamais se fier entièrement à qui nous a trompés une fois.\n\n> **Exemple.** Une tour carrée, vue de loin, paraît ronde. Un bâton plongé dans l'eau paraît brisé. Ce sont les exemples classiques que le XVIIe siècle reprend aux sceptiques antiques. Ils ne montrent pas que les sens mentent toujours, mais qu'on ne peut pas leur accorder une confiance absolue.\n\n**Le rêve.** Mais que je sois ici, assis près du feu, en robe de chambre, ce papier entre les mains ? Descartes se souvient d'avoir rêvé exactement cela. Il n'y a pas d'indice certain qui distingue la veille du sommeil.\n\nRestent toutefois les éléments les plus simples, l'étendue, la figure, le nombre, et les vérités mathématiques. Endormi ou éveillé, deux et trois font cinq, un carré n'a pas plus de quatre côtés. Le rêve recompose des images ; il n'invente pas l'arithmétique.\n\n**Le Dieu trompeur, puis le malin génie.** Et si celui qui m'a fait voulait que je me trompe chaque fois que j'additionne deux et trois ? Pour tenir ce doute dans la durée, contre la pente des habitudes qui ramènent sans cesse aux anciennes opinions, Descartes se donne une fiction : un « mauvais génie », aussi rusé et trompeur que puissant, qui emploierait toute son industrie à le tromper. Le ciel, l'air, la terre, les couleurs, les sons ne seraient que des illusions.\n\n> **Exemple.** Le film *Matrix* (1999) a popularisé une version technologique de l'hypothèse : des machines produisent dans votre cerveau un monde entièrement simulé. La philosophie contemporaine parle du « cerveau dans une cuve ». L'intérêt n'est pas de croire à ces scénarios, mais de remarquer qu'aucune expérience ne permettrait de les réfuter de l'intérieur. C'est exactement la fonction du malin génie : un doute qu'aucun fait ne peut lever.\n\n## Le point fixe\n\nLa *Seconde Méditation* s'ouvre sur un homme qui a perdu pied, comme s'il était tombé tout à coup dans une eau très profonde, sans pouvoir ni toucher le fond ni nager pour se soutenir. Il cherche, comme Archimède qui ne demandait qu'un point fixe et immobile pour déplacer la Terre, une seule chose certaine.\n\nLe voici. S'il y a un trompeur qui me trompe, alors *je suis*, puisqu'il me trompe. Qu'il me trompe autant qu'il voudra, il ne saurait faire que je ne sois rien, tant que je penserai être quelque chose. D'où la phrase décisive : la proposition « je suis, j'existe » est nécessairement vraie chaque fois que je la prononce ou que je la conçois.\n\nNotez la temporalité. La certitude ne vaut que dans l'acte. *Je suis, j'existe : mais combien de temps ?* demande Descartes. Autant de temps que je pense.\n\n> **Exemple.** Essayez de douter que vous êtes en train de douter. L'acte même de douter confirme ce dont vous vouliez douter. On peut douter de tout ce qu'on pense ; on ne peut pas douter, en pensant, qu'on pense. La formule « je pense, donc je suis » vient du *Discours de la méthode* (1637) ; les *Méditations* préfèrent « je suis, j'existe », liée à l'instant où on la conçoit.\n\n## Ce que je suis\n\nReste à savoir *ce* que je suis. Pas un corps : je peux encore en douter, le malin génie pourrait me l'avoir fait imaginer. Une chose qui pense, c'est-à-dire, dit Descartes, une chose qui doute, qui conçoit, qui affirme, qui nie, qui veut, qui ne veut pas, qui imagine aussi, et qui sent.\n\nLe sujet moderne naît là : défini par sa pensée, et par la transparence de cette pensée à elle-même.\n\n## Ce que le doute épargne\n\nC'est précisément ce point que d'autres viendront ébranler. Le doute cartésien porte sur les choses : le monde, le corps, les mathématiques. Il ne porte pas sur la conscience elle-même. Que je pense, et ce que je pense, cela m'est donné sans reste.\n\n> **Exemple.** Quelqu'un vous dit, sincèrement : « Je ne suis pas du tout en colère. » Sa voix tremble, il serre les poings. Descartes nous apprend à douter de la colère que nous voyons chez lui. Il ne nous apprend pas à douter de ce qu'il dit éprouver, puisque, pour Descartes, l'esprit est ce qui se connaît le plus facilement. Toute une tradition, de Spinoza à Freud, prendra le parti inverse.\n\nQue la pensée puisse être opaque à celui qui pense, que le « je » soit une construction plutôt qu'un point fixe : voilà l'hypothèse que Descartes n'envisage pas, et qui deviendra l'objet d'un autre genre de méditation.","quiz":[{"question":"Pourquoi Descartes introduit-il la fiction du malin génie ?","choix":["Parce qu'il croit réellement à l'existence d'un démon trompeur","Pour démontrer que Dieu n'existe pas","Pour maintenir un doute radical contre la pente de ses habitudes","Pour prouver que les sens sont toujours trompeurs"],"bonne":2,"explication":"Le malin génie est un artifice de méthode : il sert à tenir le doute dans la durée, l'habitude ramenant sans cesse aux anciennes opinions. Descartes n'y croit pas, il établira au contraire l'existence d'un Dieu vérace dans la Troisième Méditation, et l'argument des sens avait déjà été traité avant."},{"question":"Qu'est-ce que l'argument du rêve laisse encore debout ?","choix":["La certitude d'être assis près du feu, en robe de chambre, ce soir-là","Les vérités mathématiques et les éléments simples comme le nombre","La fiabilité de la perception des objets proches et bien éclairés","L'existence du corps propre, avec ses mains et sa tête"],"bonne":1,"explication":"Endormi ou éveillé, deux et trois font cinq : le rêve n'atteint pas les éléments les plus simples. C'est le Dieu trompeur puis le malin génie qui viendront les ébranler. La scène du feu, les objets proches et le corps tombent, eux, sous le doute du rêve."},{"question":"À quelle condition la certitude « je suis, j'existe » vaut-elle ?","choix":["Pour toujours, une fois qu'elle a été démontrée une seule fois","À condition qu'un Dieu vérace en garantisse la vérité","À condition d'avoir un corps qui perçoit le monde extérieur","Chaque fois que je la prononce ou la conçois, tant que je pense"],"bonne":3,"explication":"La certitude est liée à l'acte de penser : autant de temps que je pense. La garantie divine intervient plus tard pour les vérités qu'on ne considère plus actuellement, et le corps a justement été mis en doute."},{"question":"Quelle image ouvre la Seconde Méditation ?","choix":["Un voyageur égaré dans une forêt obscure","Un homme tombé dans une eau profonde, sans fond ni appui","Un astronome qui découvre que la Terre tourne","Un prisonnier enchaîné au fond d'une caverne"],"bonne":1,"explication":"Descartes se compare à quelqu'un tombé dans une eau très profonde, qui ne peut ni toucher le fond ni nager. L'astronome n'apparaît pas ici, la forêt appartient au Discours de la méthode, et la caverne est platonicienne."}],"sources":[{"texte":"Descartes, Méditations métaphysiques, Méditation seconde, version française de 1647 (PDF, cégep régional de Lanaudière)","url":"https://tim.cegep-lanaudiere.qc.ca/multisites/jeremymajorgauthier/wp-content/uploads/sites/31/2023/05/Meditations_metaphysiques-Meditation_seconde.pdf"},{"texte":"Descartes, Méditations métaphysiques, Méditation première (Wikisource)","url":"https://fr.wikisource.org/wiki/M%C3%A9ditations_m%C3%A9taphysiques/M%C3%A9ditation_premi%C3%A8re"},{"texte":"Stanford Encyclopedia of Philosophy, « Descartes' Epistemology »","url":"https://plato.stanford.edu/entries/descartes-epistemology/"}]},{"id":"freud-reve","discipline":"psychanalyse","titre":"Le travail du rêve","figure":"Sigmund Freud","reference":"L'Interprétation du rêve, chap. II, VI et VII (parue en novembre 1899, datée de 1900)","accroche":"Le rêve n'est pas absurde, il est déformé. Freud décrit la machinerie qui transforme un désir en images, et donne du même coup une grammaire de l'inconscient.","punch":"Le rêve ne dit pas autre chose. Il dit la même chose, autrement.","idee":"Le rêve est l'accomplissement déguisé d'un désir refoulé. Entre les pensées latentes et le contenu manifeste, un travail opère : condensation, déplacement, mise en images, élaboration secondaire. Interpréter, c'est défaire ce travail, association par association.","citation":"L'interprétation des rêves est la voie royale qui mène à la connaissance de l'inconscient dans la vie psychique.","citation_source":"Freud, L'Interprétation du rêve, chap. VII — traduit de l'allemand","citation_url":"https://en.wikipedia.org/wiki/The_Interpretation_of_Dreams","liens":["nietzsche-perspectivisme","lacan-desir-de-l-autre","bion-reverie"],"texte":"*Die Traumdeutung* paraît en novembre 1899, avec la date de 1900 sur la page de titre : Freud voulait que le livre ouvre le siècle. Le premier tirage, six cents exemplaires, mettra huit ans à s'écouler. Freud le considérera pourtant toujours comme son livre le plus important.\n\nSa thèse tient en une phrase : le rêve est l'accomplissement, déguisé, d'un désir, refoulé.\n\n## Deux contenus\n\nFreud distingue deux niveaux. Le *contenu manifeste* est ce dont le rêveur se souvient au réveil : des scènes souvent décousues, bizarres, parfois absurdes. Les *pensées latentes* sont ce que le rêve exprime : des pensées parfaitement cohérentes, liées à la vie du rêveur, à ses désirs et à ses conflits.\n\nLe rêve n'est donc pas un produit du hasard ni un simple bruit de l'activité cérébrale nocturne. C'est une formation psychique qui a un sens. Pourquoi, alors, le contenu manifeste est-il si étrange ? Parce qu'il a subi une *déformation*, exigée par la *censure* : le désir ne peut pas se présenter tel quel, il doit passer déguisé.\n\n> **Exemple, celui de Freud.** Le rêve qui ouvre la méthode, au chapitre II, est le rêve de « l'injection faite à Irma », fait par Freud lui-même en juillet 1895. Irma est une patiente dont le traitement n'a pas entièrement réussi. Dans le rêve, Freud découvre qu'elle souffre d'un mal organique, puis qu'un collègue lui a fait une injection malpropre. Le désir apparaît à l'analyse : n'être pas responsable de l'échec de la cure. Le rêve l'accomplit en rejetant la faute sur d'autres.\n\n## Les opérations du travail du rêve\n\nLe chapitre VI décrit les opérations par lesquelles les pensées latentes deviennent contenu manifeste.\n\n**La condensation.** Le contenu manifeste est bref, les pensées latentes abondantes. Un seul élément du rêve en représente plusieurs : une personne composite qui a le visage de l'un, la voix d'un autre, le métier d'un troisième ; un mot inventé qui fusionne deux mots. Chaque élément est *surdéterminé* : il renvoie à plusieurs pensées à la fois.\n\n**Le déplacement.** L'intensité psychique se détache d'un élément important pour se porter sur un élément accessoire. Ce qui est essentiel dans les pensées latentes peut n'apparaître qu'en marge du rêve, et un détail insignifiant peut occuper toute la scène. C'est l'opération principale au service de la censure.\n\n**La prise en compte de la figurabilité.** Les pensées doivent être converties en images ou en scènes. Les relations logiques, « si », « parce que », « bien que », n'ont pas de figuration directe ; le rêve les rend par juxtaposition, succession, transformation d'une image en une autre.\n\n**L'élaboration secondaire.** Une dernière retouche, proche de la pensée éveillée, donne au rêve une façade d'intelligibilité, un semblant de récit. C'est souvent elle qu'il faut traverser en premier.\n\n> **Exemple, fictif.** Quelqu'un rêve d'une femme qui a les cheveux de sa sœur, porte la blouse de son ancienne institutrice et parle avec l'accent de sa belle-mère. Dans le rêve, tout cela va de soi. À l'analyse, chacune de ces trois figures se rattache à une même pensée : quelqu'un qui le juge. C'est la condensation : un seul personnage pour une pensée qui en traverse plusieurs.\n\n> **Exemple, fictif.** Un autre rêve longuement d'une valise égarée dans une gare, et mentionne au passage, presque sans y penser, un enterrement aperçu par la fenêtre du train. Ce qui l'occupe au réveil, c'est la valise. Ce que les associations font apparaître, c'est l'enterrement. C'est le déplacement : l'accent est mis sur le détail, l'essentiel passe en marge.\n\n## Une méthode\n\nL'interprétation ne consiste pas à appliquer une clé des songes, où un serpent signifierait toujours ceci et une maison toujours cela. Freud rompt avec ce symbolisme fixe, même s'il admet plus tard quelques symboles typiques. C'est le rêveur qui détient le sens, par ses associations libres sur chaque fragment. Le récit du rêve est découpé, et chaque morceau est suivi là où il mène.\n\n## La portée\n\nLa phrase célèbre du chapitre VII dit l'enjeu : l'interprétation des rêves est la voie royale vers la connaissance de l'inconscient dans la vie psychique. Car les mécanismes du rêve ne lui sont pas propres. On les retrouve dans le symptôme, le lapsus, l'acte manqué, le mot d'esprit.\n\nLacan relira plus tard la condensation et le déplacement à partir de la linguistique, comme métaphore et métonymie, dans « L'instance de la lettre dans l'inconscient » (1957). Mais le point de départ est freudien : l'inconscient n'est pas un chaos, il a une logique, et cette logique se laisse lire.","quiz":[{"question":"Quelle est la thèse centrale de L'Interprétation du rêve ?","choix":["Le rêve est le produit aléatoire de l'activité cérébrale nocturne","Le rêve est l'accomplissement déguisé d'un désir refoulé","Le rêve prédit les événements à venir dans la vie du rêveur","Le rêve est un souvenir fidèle des événements de la journée"],"bonne":1,"explication":"Pour Freud, le rêve a un sens : il accomplit un désir, sous une forme déformée par la censure. Il s'oppose explicitement à la thèse du produit aléatoire, aux lectures prophétiques, et les restes du jour ne sont qu'un matériau parmi d'autres."},{"question":"Quel désir Freud découvre-t-il dans le rêve de l'injection faite à Irma ?","choix":["Le désir d'épouser sa patiente Irma","Le désir de ne pas être responsable de l'échec du traitement","Le désir de devenir chirurgien plutôt que neurologue","Le désir de quitter Vienne pour s'installer ailleurs"],"bonne":1,"explication":"Le rêve rejette sur d'autres la faute des douleurs persistantes d'Irma : Freud s'y disculpe. C'est l'exemple qui ouvre la méthode au chapitre II. Les autres désirs ne correspondent pas à son analyse."},{"question":"Que désigne le déplacement dans le travail du rêve ?","choix":["Le changement de lieu ou de décor entre deux scènes successives d'un même rêve","La fusion de plusieurs personnes ou de plusieurs souvenirs en une seule figure","Le transfert de l'intensité psychique d'un élément important vers un élément accessoire","La transformation des pensées abstraites en images visuelles ou sonores"],"bonne":2,"explication":"Le déplacement fait passer l'intensité de l'essentiel vers l'accessoire, au service de la censure. La fusion relève de la condensation ; la conversion en images, de la figurabilité ; un simple changement de décor n'est pas le concept freudien."},{"question":"Comment Freud interprète-t-il un rêve ?","choix":["À l'aide d'un dictionnaire de symboles fixes","En demandant au rêveur ce qu'il pense du rêve dans son ensemble","En comparant le rêve à ceux d'autres patients","En faisant associer librement le rêveur sur chaque fragment"],"bonne":3,"explication":"Le rêve est découpé et chaque élément est suivi par les associations du rêveur, qui détient le sens. Freud rompt avec la clé des songes, ne se contente pas d'une impression globale, et privilégie la singularité du rêveur."}],"sources":[{"texte":"The Interpretation of Dreams : publication, tirage, mécanismes (Wikipédia)","url":"https://en.wikipedia.org/wiki/The_Interpretation_of_Dreams"},{"texte":"Travail du rêve : condensation, déplacement, figurabilité, élaboration secondaire (Wikipédia)","url":"https://fr.wikipedia.org/wiki/Travail_du_r%C3%AAve"},{"texte":"Freud, The Interpretation of Dreams, trad. A. A. Brill (1913), Project Gutenberg","url":"https://www.gutenberg.org/ebooks/66048"}]},{"id":"nietzsche-perspectivisme","discipline":"philosophie","titre":"Pas de faits, seulement des interprétations","figure":"Friedrich Nietzsche","reference":"Fragments posthumes, fin 1886–printemps 1887, 7 [60] ; Par-delà bien et mal, § 22 (1886)","accroche":"La phrase la plus citée de Nietzsche est souvent lue comme un « tout se vaut ». C'est presque l'inverse : une exigence de lecture bien plus rigoureuse.","punch":"Il n'y a pas de faits. Mais il y a de bonnes et de mauvaises lectures.","idee":"Contre le positivisme qui s'en tient aux faits, Nietzsche répond qu'un fait est déjà une interprétation. Ce n'est pas un relativisme : les interprétations se jugent, comme les lectures d'un philologue, à leur probité et à ce qu'elles révèlent du type de vie qui les produit.","citation":"Non, justement, il n'y a pas de faits, seulement des interprétations.","citation_source":"Nietzsche, Fragments posthumes, 7 [60] (« es giebt keine Thatsachen, nur Interpretationen ») — traduit de l'allemand","citation_url":"https://www.nietzschesource.org/#eKGWB/NF-1886,7[60]","liens":["nietzsche-ressentiment","ricoeur-soupcon","freud-reve"],"texte":"Le fragment n'a pas été publié par Nietzsche. Il figure dans ses carnets de la fin de 1886 et du début de 1887, que l'édition critique de Colli et Montinari numérote 7 [60]. Il commence par deux mots : *Gegen den Positivismus*, contre le positivisme.\n\nLe positivisme s'arrête au phénomène et dit : il n'y a que des faits. Nietzsche répond : non, justement, il n'y a pas de faits, seulement des interprétations. Nous ne pouvons constater aucun fait « en soi ». Et il ajoute aussitôt que même le « sujet » n'est pas un donné : c'est quelque chose d'ajouté par l'imagination, glissé derrière.\n\n## L'interprétation n'est pas l'opinion\n\nLe contresens le plus répandu consiste à entendre « interprétation » comme « point de vue personnel », et donc à conclure : à chacun sa vérité, tout se vaut.\n\nMais chez Nietzsche, ce n'est pas d'abord un sujet conscient qui interprète en donnant son avis. Le même fragment le dit : ce sont nos besoins qui interprètent le monde, nos pulsions, leur pour et leur contre. Chaque pulsion est une sorte de soif de domination ; chacune a sa perspective, qu'elle voudrait imposer comme norme à toutes les autres pulsions.\n\nL'interprétation est donc moins un acte de la conscience qu'un processus vital, largement inconscient : sélectionner, simplifier, hiérarchiser ce qui se présente, selon ce dont un vivant a besoin.\n\n> **Exemple.** Trois personnes traversent la même forêt. Le bûcheron voit du bois de chauffage et des arbres à abattre. Le promeneur angoissé voit des ombres et des chemins où se perdre. Le botaniste voit des espèces, des maladies, des âges. Aucun n'invente la forêt : elle « répond » à chacun. Mais aucun ne voit une forêt nue, sans intérêt ni sélection. Ce que chacun appelle « les faits » est déjà découpé par ce qu'il cherche.\n\n## Le modèle philologique\n\nNietzsche était philologue de formation, professeur à Bâle à vingt-quatre ans. C'est de là que vient sa notion d'interprétation. Un texte se lit bien ou mal. Le bon philologue lit lentement, avec probité, sans projeter ses désirs sur le texte. Le mauvais lecteur trouve dans le texte ce qu'il voulait y trouver.\n\nLe § 22 de *Par-delà bien et mal* en offre une illustration saisissante. Les physiciens parlent de la « conformité de la nature à des lois ». Ce n'est pas un fait, dit Nietzsche, c'est une interprétation, et une mauvaise philologie : un arrangement naïvement humanitaire du sens, qui projette sur la nature l'idéal démocratique de l'égalité de tous devant la loi.\n\nUn autre interprète, poursuit-il, pourrait lire dans les mêmes phénomènes l'affirmation tyrannique, sans égards et implacable, de prétentions à la puissance. Et Nietzsche conclut avec malice : à supposer que ce soit là aussi une interprétation, et vous serez assez prompts à l'objecter, eh bien, tant mieux.\n\n> **Exemple.** Deux journaux rapportent la même grève. L'un titre : « Paralysie du pays, les usagers pris en otage ». L'autre : « Mobilisation massive pour défendre les salaires ». Les mêmes trains sont à l'arrêt. Personne ne ment sur les faits ; chacun les fait parler. Le lecteur nietzschéen ne conclut pas que « tout se vaut ». Il apprend à repérer quel besoin organise chaque récit.\n\n## Juger les interprétations\n\nSi tout est interprétation, comment trancher ? Nietzsche ne renonce pas à hiérarchiser. Il ne demande plus seulement si une interprétation correspond à un fait nu, puisqu'il n'y en a pas. Il demande ce qu'elle exprime : une vie ascendante ou déclinante, une volonté de voir ou un besoin de ne pas voir, de la probité ou de la complaisance.\n\nLa question devient : *qui* interprète ainsi, et pourquoi en a-t-il besoin ?\n\n> **Exemple.** Un patient raconte que son père « n'a jamais été là ». Son frère, interrogé, dit l'inverse : le père était présent, mais sévère. On peut chercher à établir « les faits ». On peut aussi se demander ce que chacune de ces versions permet à celui qui la tient : peut-être de ne pas reconnaître une sévérité trop douloureuse, peut-être de ne pas reconnaître un manque. Les deux récits sont des interprétations, et elles ne se valent pas pour autant : l'une peut être plus juste, ou plus vivable, que l'autre.\n\n## Une filiation\n\nC'est ce déplacement qui fera de Nietzsche, aux yeux de Paul Ricœur, l'un des trois « maîtres du soupçon », avec Marx et Freud : des penseurs pour qui le sens qui se présente à la conscience n'est pas le dernier mot, et qu'il faut apprendre à déchiffrer.\n\nDans un tout autre registre, l'analyste rencontre la même exigence. La parole du patient ne livre pas des faits, mais un texte, qu'il s'agit de lire autrement, lentement, sans pour autant y lire n'importe quoi. Nietzsche aurait dit : en bon philologue.","quiz":[{"question":"À quelle position Nietzsche répond-il dans le fragment 7 [60] ?","choix":["Au scepticisme antique qui doute de tout","Au positivisme qui s'en tient aux faits","À l'idéalisme allemand qui pose l'Esprit absolu","À la théologie chrétienne de la création"],"bonne":1,"explication":"Le fragment s'ouvre sur les mots « contre le positivisme », qui s'arrête au phénomène en disant « il n'y a que des faits ». Les autres courants ne sont pas visés ici, même si Nietzsche les critique ailleurs."},{"question":"Qui interprète, selon le fragment ?","choix":["Le sujet conscient, libre de choisir son point de vue","La communauté scientifique, par consensus","Dieu, qui donne leur sens aux choses","Nos besoins et nos pulsions, chacune avec sa perspective"],"bonne":3,"explication":"Ce sont nos besoins qui interprètent le monde : chaque pulsion a sa perspective et veut l'imposer. Nietzsche précise même que le sujet est une fiction « ajoutée », et il récuse l'instance divine."},{"question":"Que reproche Nietzsche aux physiciens dans le § 22 de Par-delà bien et mal ?","choix":["De ne pas faire assez d'expériences rigoureuses en laboratoire","De présenter comme un fait une « conformité aux lois » qui est interprétation","De refuser de croire en Dieu et en la création du monde","D'utiliser trop de mathématiques pour décrire la nature"],"bonne":1,"explication":"La « conformité aux lois » est pour lui une mauvaise philologie, un arrangement naïvement humanitaire du sens. Il ne critique ni la méthode expérimentale, ni l'athéisme, ni les mathématiques."},{"question":"Le perspectivisme nietzschéen est-il un relativisme du « tout se vaut » ?","choix":["Oui, puisque chacun a sa vérité et qu'aucune lecture ne prime","Oui, car Nietzsche refuse toute hiérarchie de valeurs","Non : les interprétations se jugent à leur probité et à la vie qu'elles expriment","Non, car Nietzsche croit en une vérité absolue saisie par la raison"],"bonne":2,"explication":"Nietzsche maintient une hiérarchie : il y a de la bonne et de la mauvaise philologie, des interprétations ascendantes ou déclinantes. Il ne renonce pas à juger, mais il ne revient pas non plus à une vérité absolue saisie par la raison."}],"sources":[{"texte":"Nietzsche, Fragments posthumes 7 [60], édition critique numérique (eKGWB), Nietzsche Source","url":"https://www.nietzschesource.org/#eKGWB/NF-1886,7[60]"},{"texte":"Nietzsche, Beyond Good and Evil, § 22, trad. Helen Zimmern, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/4363"},{"texte":"Stanford Encyclopedia of Philosophy, « Friedrich Nietzsche »","url":"https://plato.stanford.edu/entries/nietzsche/"}]},{"id":"lacan-stade-du-miroir","discipline":"psychanalyse","titre":"Le stade du miroir","figure":"Jacques Lacan","reference":"Le stade du miroir comme formateur de la fonction du Je (Zurich, 1949), dans Écrits (1966)","accroche":"Un enfant qui ne tient pas encore debout jubile devant son reflet. Lacan y voit la naissance du moi, et celle d'un malentendu qui ne nous quittera plus.","punch":"Le moi se forme d'abord comme une image, vue du dehors.","idee":"À partir de six mois environ, l'enfant, encore mal coordonné, reconnaît son image dans le miroir et s'en réjouit. Il s'identifie à une unité qu'il ne possède pas encore. Le moi se forme ainsi à l'extérieur, sur le mode de la méconnaissance.","citation":"the transformation that takes place in the subject when he assumes an image","citation_source":"Lacan, « The Mirror Stage as Formative of the Function of the I… » (1949), traduction anglaise de The Norton Anthology of Theory and Criticism (2001) — « la transformation qui se produit chez le sujet quand il assume une image » (ma traduction)","citation_url":"https://classic-blog.udn.com/Dalloway68/948508","liens":["hegel-maitre-esclave","descartes-malin-genie","winnicott-mere-suffisamment-bonne"],"texte":"Lacan présente une première version du stade du miroir au congrès de l'Association psychanalytique internationale de Marienbad, en août 1936. La version devenue canonique est celle qu'il donne au congrès de Zurich, en juillet 1949, puis qu'il place dans les *Écrits* (1966). Les citations qui suivent viennent d'une traduction anglaise du texte de 1949 : je les traduis en français, et je le signale quand je m'appuie sur un commentaire plutôt que sur le texte lui-même.\n\n## La scène\n\nL'événement, selon Lacan, peut avoir lieu « dès l'âge de six mois », et il garde pour lui le sens qu'il lui donne « jusqu'à dix-huit mois ». Le nourrisson, tenu solidement par un support humain ou artificiel (ce que Lacan appelle en France un « trotte-bébé »), est placé devant un miroir. Il manifeste alors ce que Lacan nomme « l'assomption jubilatoire de son image spéculaire » par l'enfant au stade où il ne parle pas encore, au stade *infans*.\n\nLacan insiste sur un contraste avec l'animal. L'enfant reconnaît déjà son image à un âge où il est, pour un temps, si court soit-il, dépassé par le chimpanzé en intelligence instrumentale. Un commentaire précise que le singe, lui, se désintéresse vite du reflet : chez l'enfant, au contraire, la scène est un événement.\n\n> **Exemple (une illustration, pas une observation de Lacan).** Sur l'écran d'un téléphone en mode selfie, vous vous voyez un peu plus assuré, un peu plus tenu, que vous ne vous sentez. Sans y penser, vous vous redressez pour ressembler à l'image. Ce petit geste ressemble à ce que Lacan décrit : l'image précède le sentiment de soi et lui donne une forme à rejoindre.\n\n## Une identification\n\nLa phrase centrale du texte est une définition : « Il suffit de comprendre le stade du miroir comme une identification », c'est-à-dire, ajoute Lacan, comme « la transformation qui se produit chez le sujet quand il assume une image ».\n\nLe mot compte. Il ne s'agit pas d'une simple reconnaissance de ce qu'on voit, comme on reconnaît un objet familier. L'enfant devient quelque chose en prenant cette image pour sienne. Le sujet est modifié par l'image qu'il s'attribue.\n\n## Une unité anticipée\n\nPourquoi l'image fascine-t-elle ? Lacan parle d'« une prématuration spécifique de la naissance chez l'homme », qu'il rattache à la « fœtalisation ». L'enfant n'a pas encore la maîtrise de son corps. Il en vit l'expérience comme celle d'un corps en morceaux, expression que Lacan dit avoir lui-même introduite, « le corps morcelé ».\n\nLe miroir lui offre une forme d'un tout autre ordre. Lacan décrit un trajet qui va « d'une image du corps fragmentée jusqu'à une forme de sa totalité que j'appellerai orthopédique ». L'adjectif est volontairement médical : l'image est une prothèse, un soutien qui redresse. Elle présente d'avance une unité que l'enfant n'a pas encore, ce qui explique la jubilation : il se voit déjà tel qu'il n'est pas.\n\n## Le moi : une direction fictive\n\nIl en résulte une idée très forte sur la nature du moi. Il se constitue, écrit Lacan, « dans une direction fictive, qui restera toujours irréductible pour l'individu seul ». Il n'est pas le résultat d'un développement qui partirait de l'intérieur ; il s'enracine dans une image qui se tient en dehors du sujet.\n\nLacan en tire une fonction qui caractérise le moi « dans toutes ses structures » : la *méconnaissance*. Le moi se prend pour ce qu'il n'est pas. Un commentaire résume : l'idéal-je, fondé sur la méconnaissance, est fictif, non réel. Cette identification, écrit encore Lacan, marquera de « sa structure rigide » tout le développement mental du sujet, et il ajoute qu'elle prépare une aliénation qu'il qualifie de paranoïaque, issue de la déviation du je spéculaire vers le je social.\n\n> **Exemple (une illustration).** Vous écoutez un enregistrement de votre voix, ou vous voyez une vidéo de vous en réunion, et vous pensez : « Ce n'est pas moi. » Pourtant, c'en est. Ce décalage entre l'image reçue du dehors et l'idée qu'on se fait de soi n'est pas un détail de confort : pour Lacan, il est inscrit dès l'origine, puisque le moi se bâtit sur une image qu'il ne maîtrise pas.\n\n## Contre le cogito\n\nLe texte a une cible. Lacan y prend position contre « toute philosophie directement issue du Cogito », c'est-à-dire contre l'idée d'un sujet qui se connaîtrait d'abord lui-même par la pensée (voir la fiche sur Descartes). Le commentaire de l'université de Napier ajoute que cette critique vise aussi la psychologie du moi, qui voit dans le renforcement du moi l'objectif de la cure : si le moi est l'instance de la méconnaissance, il ne saurait être l'allié naïf de l'analyste.\n\nLacan évoque encore le « transitivisme infantile », notion qu'il rattache à l'école de Charlotte Bühler : la tendance de l'enfant à attribuer à d'autres ce qu'il éprouve lui-même.\n\n## D'où vient l'idée, et ce qu'elle est devenue\n\nLa page de Wikipédia consacrée au stade du miroir note que Wallon avait observé, dans un article de 1931, que les nourrissons et les chimpanzés semblent reconnaître leur reflet vers six mois, les seconds perdant vite leur intérêt. Elle rappelle aussi que, dans les années 1930, Lacan suit les séminaires d'Alexandre Kojève, et que la structure de sa théorie doit beaucoup à la dialectique hégélienne du maître et de l'esclave (voir la fiche sur Hegel).\n\nSa portée a évolué. À l'origine, le stade a une valeur historique : c'est une étape du développement. Au début des années 1950, Lacan le présente plutôt comme une structure permanente de la subjectivité. Dylan Evans note que, dans les années 1950, un miroir littéral n'est plus nécessaire : l'imitation d'un autre enfant ou d'un adulte peut suffire.\n\n## Une objection empirique\n\nLa même page fait aussi état des objections. Les recherches ultérieures sur le « test du miroir » situent la reconnaissance de soi plus tard que Lacan : elle n'apparaîtrait pas avant 15 mois au plus tôt (Lewis, Brooks-Gunn et Jaskir, 1985). Norman Holland va plus loin et conclut qu'il n'y a « aucune preuve » en faveur de la notion lacanienne de stade du miroir. Ces critiques portent sur la valeur de la scène comme observation. Elles ne touchent pas directement la thèse de structure : que le moi s'édifie sur une image, et qu'il en garde une part de méprise. Mais elles invitent à lire le texte comme une construction théorique, et non comme un constat de laboratoire.","quiz":[{"question":"Comment Lacan définit-il le stade du miroir ?","choix":["Comme une identification : le sujet se transforme en assumant une image","Comme l'étape où le cerveau achève sa maturation biologique","Comme le moment où l'enfant apprend à reconnaître sa mère","Comme une illusion d'optique sans conséquence pour le développement"],"bonne":0,"explication":"Lacan parle d'« identification » au sens plein : le sujet est transformé en assumant une image. Il ne s'agit ni d'une simple maturation cérébrale, ni de la reconnaissance de la mère, et l'enjeu est tout sauf anodin."},{"question":"Que montre la comparaison avec le chimpanzé ?","choix":["Que le singe est plus intelligent que l'enfant dans tous les domaines","Que l'enfant ne se reconnaît pas du tout dans un miroir","Que le chimpanzé ne possède aucun sens de la vue","Que l'enfant se reconnaît, quoique dépassé par le chimpanzé en intelligence instrumentale"],"bonne":3,"explication":"Lacan note que l'enfant reconnaît son image alors même qu'il est, pour un temps, dépassé par le chimpanzé en intelligence instrumentale. Ce n'est pas que l'enfant échoue, ni que le chimpanzé soit aveugle, ni qu'il soit meilleur partout."},{"question":"Quelle fonction Lacan attribue-t-il au moi ?","choix":["Celle de synthèse rationnelle de toutes les expériences vécues","Une fonction de méconnaissance, bâtie sur une image extérieure au sujet","Celle d'allié naturel de l'analyste dans la cure","Celle d'instance libre de tout conditionnement"],"bonne":1,"explication":"Le moi se constitue dans une direction fictive, à partir d'une image : il méconnaît ce qu'il est. Lacan s'oppose ainsi aux philosophies issues du Cogito et aux courants qui veulent renforcer le moi."},{"question":"Quelle objection la recherche ultérieure oppose-t-elle à la scène décrite ?","choix":["Qu'aucun enfant ne s'intéresse à un miroir avant l'âge de quatre ans","Que le miroir n'a jamais été utilisé dans l'étude du développement","Que les tests du miroir placent la reconnaissance de soi vers 15 mois au plus tôt","Que les chimpanzés sont plus attachés à leur reflet que les enfants"],"bonne":2,"explication":"Les travaux sur le test du miroir (Lewis et coll., 1985) situent la reconnaissance de soi à 15 mois au plus tôt, plus tard que dans le récit de Lacan. Le désintérêt des chimpanzés pour leur reflet figure au contraire dans la comparaison de Wallon."}],"sources":[{"texte":"Lacan, « The Mirror Stage as Formative of the Function of the I… » (1949), traduction anglaise de la Norton Anthology of Theory and Criticism (2001), reproduite sur un blog","url":"https://classic-blog.udn.com/Dalloway68/948508"},{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (dates 1936 et 1949, âge de six à dix-huit mois)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"Wikipédia (anglais), « Mirror stage » (Wallon, Kojève, évolution du concept, objections)","url":"https://en.wikipedia.org/wiki/Mirror_stage"},{"texte":"Commentaire de l'université de Napier sur le texte de 1949","url":"https://www.napier.ac.uk/-/media/worktribe/output-829301/the-mirror-stage-as-formative-of-the-i-function-as-revealed-in-psychoanalytic-experience.ashx"}]},{"id":"hegel-maitre-esclave","discipline":"philosophie","titre":"Le maître et l'esclave","figure":"G. W. F. Hegel","reference":"Phénoménologie de l'esprit, chap. IV, A, § 178–196 (1807)","accroche":"Deux consciences se rencontrent et chacune veut être reconnue par l'autre. L'une risque sa vie, l'autre cède. La suite renverse tout ce qu'on attendait.","punch":"Le maître a gagné le combat. C'est l'esclave qui gagne l'histoire.","idee":"La conscience de soi n'existe que reconnue par une autre. Dans la lutte, celui qui préfère la vie devient esclave. Mais le maître, reconnu par qui ne compte pas, s'enlise dans la jouissance, tandis que l'esclave, par la peur et le travail, se forme et se découvre.","citation":"La vérité de la conscience indépendante est la conscience servile.","citation_source":"Hegel, Phénoménologie de l'esprit, IV, A, § 193 — trad. Jean Hyppolite, Aubier, t. I, p. 163","citation_url":"https://www.memoireonline.com/11/06/285/m_dialectique-reconnaissance-hegel13.html","liens":["lacan-desir-de-l-autre","lacan-stade-du-miroir","nietzsche-ressentiment"],"texte":"La section la plus commentée de la *Phénoménologie de l'esprit* tient en une dizaine de pages. On l'appelle couramment « dialectique du maître et de l'esclave » ; les traductions anglaises parlent de *Lordship and Bondage*, seigneurie et servitude. Elle a été lue comme une théorie de l'histoire, une philosophie du travail, une anthropologie du désir.\n\nElle part d'une thèse : la conscience de soi n'existe qu'en étant reconnue. Elle n'est, dit le § 178, qu'en tant qu'elle est reconnue par une autre.\n\n## Le désir de reconnaissance\n\nJe ne suis pas certain de moi en me regardant moi-même. Le désir qui consomme les choses ne suffit pas : l'objet mangé, possédé, détruit, le désir renaît, et je ne me suis pas trouvé pour autant. Il faut un objet d'un genre particulier, qui ne disparaisse pas quand il me confirme : une autre conscience qui me reconnaisse.\n\nMais l'autre veut la même chose. La rencontre de deux consciences de soi est donc une lutte. Chacune doit prouver qu'elle n'est attachée à rien d'extérieur, pas même à la vie. Et elle ne peut le prouver qu'en risquant sa vie : c'est seulement en risquant la vie, dit Hegel, que la liberté s'obtient (§ 187).\n\n> **Exemple.** Deux enfants de quatre ans se disputent un jouet dont aucun ne voulait cinq minutes plus tôt. Ce n'est pas l'objet qui compte : c'est de l'avoir *devant l'autre*, d'être celui à qui l'autre a cédé. La scène hégélienne est infiniment plus grave, puisque l'enjeu est la vie, mais sa structure est déjà là : ce que je veux, à travers la chose, c'est être reconnu.\n\n## L'issue de la lutte\n\nSi les deux combattants allaient jusqu'au bout, l'un mourrait, et la reconnaissance serait perdue avec lui : un mort ne reconnaît plus personne. Cette épreuve par la mort, note Hegel, supprime la vérité qu'elle devait produire (§ 188).\n\nL'issue est donc autre : l'un des deux recule devant la mort. Il préfère la vie. Il devient le serviteur, dont l'essence est la vie pour un autre. Celui qui n'a pas reculé devient le maître, dont l'essence est d'être pour soi (§ 189).\n\nLe maître jouit des choses par la médiation de l'esclave, qui les travaille pour lui. Il a ce qu'il voulait : il est reconnu.\n\n## Le renversement\n\nSauf que cette reconnaissance est boiteuse. Le maître est reconnu par une conscience qu'il ne reconnaît pas en retour, par un instrument. Il en résulte, dit Hegel, une reconnaissance unilatérale et inégale. Le maître ne trouve pas, dans l'esclave, l'égal qui pourrait le confirmer. Et il dépend de lui pour tout.\n\nL'esclave, lui, a fait deux expériences décisives.\n\n**La peur.** Il a éprouvé l'angoisse de la mort, que la traduction anglaise de Baillie appelle « le maître souverain » (§ 194). Toute sa substance a été ébranlée, tout ce qui était fixe en lui a vacillé.\n\n**Le travail.** Il forme la chose. Le travail, dit le § 195, est un désir réfréné, une disparition retardée : il façonne la chose. Le maître consomme et l'objet disparaît. L'esclave transforme l'objet et, dans l'objet transformé, il trouve une trace durable de lui-même.\n\nD'où la phrase qui condense le renversement : la vérité de la conscience indépendante est la conscience servile.\n\n> **Exemple.** Un aristocrate n'a jamais rien fait de ses mains ; tout passe par ses domestiques. Le jour où ils partent, il ne sait ni se nourrir, ni se chauffer, ni réparer quoi que ce soit. Ses domestiques, eux, ont appris à transformer le monde. Hegel ne raconte pas une révolution sociale, mais on comprend pourquoi Marx a lu ces pages avec passion : celui qui travaille détient un savoir et une puissance que le maître a perdus.\n\n> **Exemple.** Un apprenti potier, sous un maître exigeant, tourne pendant des mois des bols qu'on lui fait recommencer. Il peste. Puis un jour, il pose sur l'étagère un bol qui tient, et il s'y reconnaît. Le désir de finir vite a été réfréné, et cette retenue a produit quelque chose qui dure. C'est le « travail qui forme » : il forme la chose, et il forme celui qui travaille.\n\n## La postérité française\n\nEn France, cette section doit une large part de sa fortune au séminaire qu'Alexandre Kojève a consacré à la *Phénoménologie* à l'École pratique des hautes études, de 1933 à 1939. Parmi les auditeurs : Raymond Queneau, Georges Bataille, Raymond Aron, Maurice Merleau-Ponty, Jacques Lacan. Queneau a réuni ces leçons en 1947 sous le titre *Introduction à la lecture de Hegel*.\n\nKojève fait de cette section le cœur de toute la *Phénoménologie*, et il en tire une formule qui marquera durablement la psychanalyse française : le désir humain est désir de désir, désir d'être reconnu.\n\nLa lecture de Kojève est discutée par les spécialistes de Hegel, qui y voient une interprétation très libre, plus anthropologique que le texte. Mais elle a produit une pensée du sujet où l'autre n'est pas un ajout extérieur : il est constitutif. On ne devient soi qu'à travers le regard et la reconnaissance d'un autre.","quiz":[{"question":"Pourquoi la conscience de soi a-t-elle besoin d'une autre conscience ?","choix":["Pour se procurer, par l'échange, les biens nécessaires à sa survie","Parce qu'elle n'est elle-même qu'en étant reconnue par une autre","Pour éviter la solitude, que l'être humain juge insupportable","Parce que Dieu l'a créée pour vivre en communauté"],"bonne":1,"explication":"La conscience de soi n'est qu'en tant qu'elle est reconnue par une autre. Il ne s'agit ni de besoins vitaux, ni d'une explication psychologique de la solitude, ni d'un fondement théologique."},{"question":"Qu'est-ce qui fait de l'un des combattants l'esclave ?","choix":["Il est physiquement le plus faible des deux","Il est né dans une classe sociale inférieure","Il recule devant la mort et préfère la vie","Il a perdu la reconnaissance de ses pairs"],"bonne":2,"explication":"L'esclave est celui qui n'a pas voulu risquer sa vie jusqu'au bout. Hegel ne parle ni de force physique ni de condition sociale de naissance, et la reconnaissance est précisément ce qui est en jeu, non un acquis antérieur perdu."},{"question":"Pourquoi la reconnaissance obtenue par le maître est-elle insuffisante ?","choix":["Parce que l'esclave finit toujours par se révolter","Parce qu'elle vient d'une conscience qu'il ne reconnaît pas en retour","Parce que le maître ne sait pas qu'il est reconnu","Parce que la loi interdit la servitude"],"bonne":1,"explication":"La reconnaissance est unilatérale et inégale : le maître est confirmé par quelqu'un qu'il tient pour un instrument. Hegel ne décrit pas de révolte, le maître sait bien qu'il est servi, et la question n'est pas juridique."},{"question":"Quelles expériences permettent à l'esclave de dépasser sa condition ?","choix":["La révolte armée contre le maître, puis la fuite","L'éducation reçue du maître et la lecture","La prière et la résignation devant le destin","La peur de la mort et le travail qui forme la chose"],"bonne":3,"explication":"L'angoisse devant la mort ébranle tout en lui ; le travail, désir réfréné, lui permet de se reconnaître dans l'objet formé. Hegel ne décrit ici ni révolte, ni instruction, ni résignation religieuse."}],"sources":[{"texte":"Hegel, Phenomenology of Mind, « Lordship and Bondage », § 178–196, trad. J. B. Baillie (marxists.org)","url":"https://www.marxists.org/reference/archive/hegel/works/ph/phba.htm"},{"texte":"Mémoire universitaire citant la trad. Hyppolite (t. I, p. 163)","url":"https://www.memoireonline.com/11/06/285/m_dialectique-reconnaissance-hegel13.html"},{"texte":"Alexandre Kojève : le séminaire sur Hegel (1933–1939) et l'Introduction à la lecture de Hegel","url":"https://fr.wikipedia.org/wiki/Alexandre_Koj%C3%A8ve"},{"texte":"Stanford Encyclopedia of Philosophy, « Hegel »","url":"https://plato.stanford.edu/entries/hegel/"}]},{"id":"lacan-desir-de-l-autre","discipline":"psychanalyse","titre":"Le désir est le désir de l'Autre","figure":"Jacques Lacan","reference":"Écrits (1966) ; Séminaire XI (1964) ; formule venue de la lecture de Hegel par Kojève","accroche":"Une formule qu'on récite souvent sans en voir les sens. Chacun change la manière d'entendre ce que l'on désire.","punch":"Je ne désire pas seul. Je désire depuis l'Autre.","idee":"Le désir n'est ni le besoin ni la demande : il se produit dans l'écart entre eux. « Désir de l'Autre » est un génitif ambigu : désirer ce que l'Autre désire, désirer être désiré par lui, désirer à partir de ses signifiants. Lacan reprend ici une formule issue de Kojève lisant Hegel.","citation":"Le désir est ce qui se manifeste dans l'intervalle que creuse la demande en-deçà d'elle-même.","citation_source":"Lacan, Écrits, Seuil, 1966, p. 627 — tel que cité dans « La demande de reconnaissance de Lacan à Hegel » (L'Harmattan)","citation_url":"https://www.editions-harmattan.fr/media/107060/download/La%20demande%20de%20reconnaissance%20de%20Lacan%20%C3%A0%20Hegel.pdf","liens":["spinoza-desir","hegel-maitre-esclave","lacan-ne-pas-ceder"],"texte":"« Le désir de l'homme est le désir de l'Autre. » La formule est l'une des plus citées de Lacan, et l'une des plus déformées. L'*Encyclopédie de philosophie de Stanford* la présente comme un slogan hégélo-kojévien, c'est-à-dire d'abord un héritage de la lecture de Hegel que propose Alexandre Kojève. Pour la comprendre, il faut remonter à cette source, puis passer par ce que Lacan appelle le besoin, la demande et le désir.\n\n## Chez Kojève, un désir d'un autre désir\n\nDans son *Introduction à la lecture de Hegel* (1947), Kojève fait de la dialectique du maître et de l'esclave une anthropologie : elle décrit le passage du désir animal au désir humain. L'étude de L'Harmattan qui rapporte cette lecture retient une expression : le désir humain est un « désir d'un autre désir ». Désirer, au sens humain, c'est désirer être reconnu par un autre qui désire lui aussi (voir la fiche sur Hegel).\n\nLa page de nosubject.com, qui résume la pensée de Lacan, retient cette même origine : le désir y est médiatisé par le désir d'une autre conscience, et désirer, c'est désirer la reconnaissance, être désiré en tant que désirant.\n\n## Besoin, demande, désir\n\nLes commentateurs résument ainsi la triade que Lacan met en place, en renvoyant à « La signification du phallus ». Le **besoin** est un instinct purement biologique, la faim par exemple. La **demande** est l'articulation du besoin à l'Autre : dès que je demande, je m'adresse à quelqu'un. Le **désir** est « produit dans l'écart entre le besoin et la demande ».\n\nPourquoi un écart ? Parce que, comme l'écrit la même synthèse, la demande est une demande d'amour, et qu'aucun objet ne peut la satisfaire. On demande un objet, mais on demande aussi, au-delà de lui, que l'autre soit là, qu'il réponde. Cet excès ne se comble avec rien.\n\n> **Exemple (une illustration, pas un cas de Lacan).** Un enfant réclame un verre d'eau après qu'on l'a mis au lit. On lui apporte l'eau ; il en veut un deuxième, puis un mouchoir, puis une histoire. Ce n'est pas la soif : l'objet demandé change, mais la demande reste la même, qu'on reste avec lui. Aucun verre d'eau n'y répond, et c'est ce reste qui relève du désir.\n\nLa citation de la fiche, tirée des *Écrits* (p. 627), dit la même chose dans les termes de Lacan : le désir se manifeste dans l'intervalle que creuse la demande en deçà d'elle-même. L'étude de L'Harmattan cite aussi la suite : il s'agit de savoir si « l'Autre, lieu de la parole, est aussi le lieu de ce manque ».\n\n## Un génitif ambigu\n\n« Le désir de l'Autre » se dit en français comme en allemand avec un seul petit mot, « de », qui peut vouloir dire plusieurs choses. La page de nosubject.com note que la formule peut désigner le désir que le sujet a pour le désir de l'Autre, ou bien le désir de l'Autre comme tel. Elle distingue trois sens :\n\n- **le désir pour l'Autre** : on désire l'Autre ;\n- **le désir d'être désiré** : on veut être l'objet du désir de l'Autre ;\n- **le désir constitué par les signifiants de l'Autre** : on désire dans un langage et à partir de significations qu'on n'a pas inventées.\n\nLe troisième sens est celui qui fait de l'Autre un lieu plutôt qu'une personne. L'Autre, avec une majuscule, désigne dans ce contexte le lieu du langage et de la loi symbolique. La page ajoute que le désir de l'Autre, c'est aussi « le fait même que l'Autre désire », pas seulement ce qu'il veut.\n\n> **Exemple (une illustration).** Un adulte explique qu'il a toujours voulu être médecin, et que c'est un choix personnel. Il lui revient un jour que, dès l'enfance, son père répétait « mon fils sera médecin » avec une telle conviction que le projet est devenu le sien sans qu'il le décide. Ce qu'il désirait n'était pas faux, mais le désir passait par ce que l'Autre en disait. C'est le troisième sens du génitif.\n\n## « Che vuoi ? »\n\nLa question du sujet, tournée vers l'Autre, devient : « Que me veut-il ? » Lacan la place au cœur de son graphe du désir sous la forme d'une phrase italienne, *Che vuoi ?*, « que veux-tu ? ». Wikipédia, qui s'appuie sur une note de lecture, rapporte son origine : dans *Le Diable amoureux* de Caz
