mot ce qu'une personne dit d'elle-même. Les deux supposent qu'une vie a un sens qu'on ne voit pas d'emblée, et qu'il faut un travail pour le dégager. Elles divergent sur la question de savoir si ce sens se cache dans un inconscient ou dans une liberté qui se fuit.\n\n> **Illustration (une question clinique).** Une patiente répète qu'elle « n'a pas le choix » de rester dans un emploi qui l'épuise. Lire cela comme mauvaise foi, c'est lui rappeler sa liberté, au risque de la culpabiliser. Le lire avec Freud, c'est chercher ce que ce « pas le choix » protège. Le débat entre Sartre et la psychanalyse se rejoue, en petit, dans la manière d'écouter cette phrase.\n\n## Une critique discutée\n\nL'objection de la censure a été beaucoup commentée, et l'interprétation des exemples de Sartre elle-même fait débat : Leslie Stevenson, par exemple, juge que présenter le garçon de café comme un cas de mauvaise foi trahit les intentions de Sartre[^2]. La question de savoir si l'objection touche vraiment Freud, ou seulement une version simplifiée de sa théorie, reste ouverte.","quiz":[{"question":"Quelle objection Sartre adresse-t-il à la censure freudienne ?","choix":["Elle ne repose sur aucune observation clinique sérieuse","Pour refouler, elle doit savoir ce qu'elle refoule : on retrouve le mensonge à soi","Elle accorde trop de place à la sexualité dans la vie psychique","Elle oublie le rôle de la société dans la formation du moi"],"bonne":1,"explication":"La censure doit en savoir assez pour refouler, sans en savoir trop : le problème d'une conscience qui sait et ne sait pas revient au niveau de la censure. Sartre ne conteste pas ici la sexualité ni le rôle social."},{"question":"Qu'est-ce que la mauvaise foi pour Sartre ?","choix":["Un mensonge délibéré adressé à autrui pour en tirer profit","Un processus inconscient, au sens de Freud","Une fuite de la conscience devant sa propre liberté, qui s'appuie sur elle","Une maladie mentale qui relève de la psychiatrie"],"bonne":2,"explication":"La mauvaise foi nie la liberté tout en s'appuyant sur elle : la conscience se dérobe à elle-même. Ce n'est ni un mensonge à autrui, ni un mécanisme inconscient, ni une pathologie."},{"question":"Un collègue dit : « Je suis fonctionnaire, je ne fais qu'appliquer le règlement », pour ne pas répondre d'une décision qui lui revient. Quelle lecture sartrienne s'impose ?","choix":["Une lecture freudienne : il refoule un conflit avec son père","La mauvaise foi : il se fait chose, rôle, pour échapper à sa liberté","L'authenticité : il assume pleinement ce qu'il est","L'angoisse : il prend conscience de sa liberté"],"bonne":1,"explication":"Comme le garçon de café qui joue à n'être que garçon de café, il se réduit à une fonction pour fuir la décision. L'angoisse serait au contraire la conscience de cette liberté."},{"question":"Que cherche la « psychanalyse existentielle » de Sartre ?","choix":["Les souvenirs refoulés de la petite enfance","Les pulsions sexuelles inconscientes du sujet","Le projet fondamental, choix originel vécu sans être connu","Les influences génétiques qui déterminent le caractère"],"bonne":2,"explication":"Sartre cherche un choix originel de soi, entièrement vécu et en ce sens conscient, mais pas connu. Il refuse l'inconscient freudien et ne parle pas d'hérédité."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Jean-Paul Sartre » (§ 4.1-4.2 et 5 : liberté, mauvaise foi, critique de Freud, psychanalyse existentielle, Baudelaire)","url":"https://plato.stanford.edu/entries/sartre/"},{"texte":"Wikipédia (anglais), « Bad faith (existentialism) » (garçon de café, jeune femme au rendez-vous, Stevenson)","url":"https://en.wikipedia.org/wiki/Bad_faith_(existentialism)"}]},{"id":"laplanche-seduction-generalisee","discipline":"psychanalyse","titre":"La séduction généralisée","figure":"Jean Laplanche","branche":"france","fiabilite":"mixte","fiabilite_note":"La théorie est présentée d'après la notice que Laplanche lui-même a rédigée pour le Dictionnaire international de la psychanalyse (traduction anglaise en ligne), complétée par Wikipédia et par l'hommage de Christophe Dejours. Les œuvres de Laplanche n'ont pas été consultées directement.","reference":"Nouveaux fondements pour la psychanalyse (PUF, 1987) ; La Révolution copernicienne inachevée (Aubier, 1992)","accroche":"Freud a cru un temps que les névroses venaient d'une séduction réelle, puis il y a renoncé. Laplanche reprend l'idée autrement : nous avons tous été séduits, sans que personne l'ait voulu.","punch":"L'inconscient commence par un message que l'adulte ne savait pas envoyer.","idee":"Pour Laplanche, l'adulte adresse à l'enfant, à travers les soins, des messages traversés par son propre inconscient sexuel. L'enfant tente de les traduire ; ce qui échoue à être traduit forme l'inconscient. La séduction n'est plus un accident, c'est la situation de tout être humain.","repere":"Jean Laplanche (1924-2012), normalien, agrégé de philosophie, analysé par Lacan, cofonde en 1964 l'Association psychanalytique de France. Il cosigne avec Pontalis le Vocabulaire de la psychanalyse (1967) et dirige la traduction des Œuvres complètes de Freud aux PUF.","liens":["freud-apres-coup","ferenczi-confusion","freud-moi-pas-maitre"],"texte":"Jean Laplanche naît à Paris le 21 juin 1924 et meurt à Beaune le 6 mai 2012[^2]. Normalien, il suit les cours de Jean Hyppolite, de Gaston Bachelard et de Maurice Merleau-Ponty, passe l'agrégation de philosophie en 1950, et commence en 1947 une analyse avec Lacan, qui lui conseille de faire médecine[^2]. Il critique dès 1960 la lecture « structuraliste » de Lacan, rompt avec lui et cofonde en 1964 l'Association psychanalytique de France[^2]. Avec Jean-Bertrand Pontalis, il publie en 1967 le *Vocabulaire de la psychanalyse*, devenu un ouvrage de référence traduit dans plus de quinze langues ; à partir de 1983, il dirige la nouvelle traduction des œuvres complètes de Freud aux PUF[^2].\n\nDétail moins connu : avec sa femme Nadine, il exploite pendant des années le château de Pommard, en Bourgogne. Leur vin était présenté comme le seul au monde produit et mis en bouteille par un ancien disciple de Lacan[^3].\n\n## Ce que Freud a abandonné\n\nEntre 1895 et 1897, Freud soutient que les névroses ont pour origine une séduction sexuelle réelle, subie dans l'enfance. Le 21 septembre 1897, il écrit à son ami Fliess qu'il n'y croit plus[^1]. La psychanalyse se tourne alors vers le fantasme : ce qui compte, c'est ce que l'enfant a imaginé.\n\nPour Laplanche, ce tournant a fait perdre quelque chose d'essentiel. Freud, selon lui, a oublié l'importance et le sens même de sa théorie[^3]. Il parle d'un « fourvoiement » : le passage désastreux d'une conception copernicienne de la psyché à une conception ptolémaïque[^3].\n\n## Copernic et Ptolémée\n\nL'image vient de l'astronomie. Pour Ptolémée, la Terre est au centre et tout tourne autour d'elle. Copernic décentre la Terre : elle tourne autour d'autre chose. Freud, selon Laplanche, a été son propre Copernic, mais aussi son propre Ptolémée[^3]. Copernicien quand il découvre l'inconscient et la séduction, qui mettent l'*autre* à l'origine du sujet ; ptoléméen quand il revient à une théorie centrée sur le sujet lui-même, sur ses pulsions et ses fantasmes. Le recueil de 1992 s'intitule pour cette raison *La Révolution copernicienne inachevée*[^3].\n\n## Une théorie générale\n\nLaplanche ne revient pas à l'idée d'abus réels à l'origine de toute névrose. Il élargit la séduction à la genèse de l'inconscient en général[^1]. Sa théorie repose sur deux piliers : la primauté du message énigmatique de l'autre, et le refoulement compris comme un échec partiel de la traduction de ce message[^1].\n\nLe point de départ est une asymétrie. L'adulte a déjà un inconscient sexuel ; l'enfant n'en a pas encore. Quand l'adulte s'adresse à l'enfant, ses gestes et ses paroles sont traversés par cet inconscient[^1]. La sexualité infantile de l'adulte se trouve réactivée en présence de l'enfant, qui doit traduire ce qu'il reçoit et lui donner un sens[^3]. Laplanche parle d'abord de « signifiant énigmatique », puis de « message compromis », c'est-à-dire infiltré par l'inconscient sexuel des parents[^2].\n\nL'énigme, écrit-il, est en elle-même une séduction, et ses mécanismes sont inconscients[^3]. L'adulte ne sait pas ce qu'il transmet ; l'enfant ne peut pas le comprendre. Personne n'est coupable, et pourtant quelque chose est passé.\n\n> **Illustration (pas un exemple de Laplanche).** Un père change la couche de son bébé. Il est tendre, attentif, et il rit un peu trop fort, gêné sans savoir pourquoi. Le bébé ne perçoit ni la tendresse ni la gêne comme des idées ; il reçoit un ensemble de gestes, de regards, d'intonations, dont une part reste énigmatique, y compris pour le père. Ce reste, que l'enfant ne parvient pas à mettre en forme, est ce que Laplanche place à l'origine de l'inconscient.\n\n## Traduire et refouler\n\nPourquoi parler de traduction ? Parce que Freud lui-même, dans une lettre à Fliess du 6 décembre 1896, compare la barrière entre deux moments d'un trauma psychique à une traduction, ou à un échec partiel de traduction[^1]. Laplanche en tire un modèle du refoulement moins mécanique que les modèles fondés sur des forces[^1]. L'enfant traduit les messages reçus avec les moyens dont il dispose ; ce qui résiste à la traduction n'est pas effacé, il reste là, comme un corps étranger, et devient l'inconscient.\n\nLa traduction n'est pas qu'une métaphore pour lui : il a passé des décennies à traduire Freud, et c'est de ce travail, selon Christophe Dejours, qu'il a tiré sa théorie[^4]. Lire Freud, c'était déjà recevoir un message à décoder.\n\n## La situation anthropologique fondamentale\n\nLaplanche tenait cette situation, avec la séduction en son centre, pour plus universelle que le complexe d'Œdipe[^4]. On peut ne pas avoir de père, ni de mère au sens habituel ; on ne peut pas grandir sans avoir été soigné par un adulte qui avait un inconscient. La théorie n'est pas pour autant un « pansexualisme » : les besoins du corps et les soins qu'ils appellent y ont leur place[^4].\n\nL'asymétrie de la cure reproduit d'ailleurs celle de l'enfance[^2]. L'analyste, en ne répondant pas comme on l'attend, rouvre l'énigme au lieu de la refermer, et permet au patient de traduire à nouveau.\n\n> **Illustration (un parallèle avec la clinique).** Une patiente répète qu'elle n'a « jamais su ce que sa mère attendait d'elle ». Ce n'est pas faute de consignes : la mère en donnait beaucoup. Mais derrière les consignes passait autre chose, que ni l'une ni l'autre ne pouvait nommer. La perspective de Laplanche invite à ne pas chercher une vérité cachée que la mère aurait dissimulée, mais à reconnaître une énigme qui lui échappait à elle aussi.","quiz":[{"question":"Que désigne la « séduction généralisée » chez Laplanche ?","choix":["Des abus sexuels réels, présents dans toutes les enfances","Les messages de l'adulte, traversés par son inconscient, reçus par l'enfant","Le désir de l'enfant de séduire le parent du sexe opposé","La technique par laquelle l'analyste gagne la confiance du patient"],"bonne":1,"explication":"La théorie étend la séduction à la genèse de l'inconscient en général : l'adulte adresse à l'enfant des messages infiltrés par son inconscient sexuel, que l'enfant doit traduire."},{"question":"Comment Laplanche conçoit-il le refoulement ?","choix":["Comme une force qui écrase les désirs interdits par la morale","Comme un échec partiel de la traduction des messages reçus","Comme un oubli volontaire des souvenirs douloureux","Comme une maturation neurologique de la mémoire"],"bonne":1,"explication":"S'appuyant sur une lettre de Freud à Fliess de 1896, Laplanche fait du refoulement un échec partiel de traduction : ce qui ne se traduit pas devient l'inconscient."},{"question":"Une mère répète à son fils qu'elle l'aime, mais se raidit chaque fois qu'il la serre dans ses bras. Adulte, il dit n'avoir jamais compris ce qu'elle voulait. Quelle lecture laplanchienne est la plus juste ?","choix":["Elle mentait volontairement, et il faut retrouver sa vraie pensée","Il a inventé ce raidissement, qui n'existait que dans son fantasme","Il a reçu un message énigmatique pour elle comme pour lui","La relation n'a aucune importance pour son inconscient"],"bonne":2,"explication":"Le message de l'adulte est « compromis » par son propre inconscient : l'énigme n'est cachée par personne, elle échappe à celui qui l'envoie autant qu'à celui qui la reçoit."},{"question":"Que signifie l'image de la révolution « copernicienne inachevée » ?","choix":["Que Freud a décentré le sujet vers l'autre, puis l'a recentré sur lui","Que la psychanalyse doit s'inspirer des méthodes de l'astronomie","Que Freud a refusé dès le départ toute théorie de la séduction","Que l'inconscient tourne autour du complexe d'Œdipe"],"bonne":0,"explication":"Freud a été « son propre Copernic » en plaçant l'autre à l'origine, et « son propre Ptolémée » en revenant à une théorie centrée sur le sujet. Laplanche veut achever le décentrement."}],"sources":[{"texte":"Jean Laplanche, « General Theory of Seduction », International Dictionary of Psychoanalysis, reproduit sur Encyclopedia.com (définition, message énigmatique, traduction, lettres à Fliess)","url":"https://www.encyclopedia.com/psychology/dictionaries-thesauruses-pictures-and-press-releases/general-theory-seduction"},{"texte":"Wikipédia (français), « Jean Laplanche » (biographie, APF, Vocabulaire, traduction de Freud, message compromis)","url":"https://fr.wikipedia.org/wiki/Jean_Laplanche"},{"texte":"Wikipédia (anglais), « Jean Laplanche » (dates, séduction généralisée, Copernic et Ptolémée, Pommard)","url":"https://en.wikipedia.org/wiki/Jean_Laplanche"},{"texte":"Christophe Dejours, « Hommage à Jean Laplanche », Psychologie clinique, n° 34, 2012, p. 243-246","url":"https://doi.org/10.1051/psyc/201234243"}]},{"id":"bergson-duree","discipline":"philosophie","titre":"La durée","figure":"Henri Bergson","branche":"fondamentaux","fiabilite":"secondaire","fiabilite_note":"Bergson est présenté d'après l'Encyclopédie de Stanford, Wikipédia et l'article « Henri Bergson » du Larousse ; l'Essai lui-même n'a pas été consulté. Les exemples célèbres du sucre qui fond et de la mélodie, souvent cités, n'ont pas été retrouvés dans ces sources et ne sont pas attribués à Bergson ici.","reference":"Essai sur les données immédiates de la conscience (1889) ; Matière et mémoire (1896) ; L'Évolution créatrice (1907)","accroche":"L'horloge découpe le temps en instants identiques. Le temps que nous vivons, lui, ne se laisse pas découper. Bergson en tire une idée de la conscience, et de la liberté.","punch":"Le temps vécu n'est pas une ligne de points. Ses moments se fondent les uns dans les autres.","idee":"Bergson oppose le temps de l'horloge, homogène et fait d'instants juxtaposés, à la durée vécue, où les états de conscience se fondent les uns dans les autres. Confondre les deux, c'est traduire l'inétendu en étendu, et c'est de cette confusion que naissent les faux problèmes de la liberté.","repere":"L'Essai sur les données immédiates de la conscience est la thèse de doctorat de Bergson, publiée en 1889. Bergson entre au Collège de France en 1900. Le prix Nobel de littérature de 1927 lui est décerné en 1928.","liens":["freud-apres-coup","schopenhauer-pendule","husserl-epoche"],"texte":"En 1889, Henri Bergson publie sa thèse de doctorat, l'*Essai sur les données immédiates de la conscience*. La traduction anglaise lui donnera un titre plus explicite : *Time and Free Will*, le temps et le libre arbitre[^2]. Le livre part d'une intuition simple : nous parlons du temps comme s'il s'agissait d'espace, et cette habitude nous trompe sur nous-mêmes.\n\n## Deux temps\n\nIl y a d'abord le temps des horloges et des calendriers : une forme homogène, faite d'instants tous semblables, que l'on peut compter, additionner, découper[^1]. C'est le temps dont la science a besoin, et il ressemble à une ligne : chaque moment est à côté de l'autre, extérieur à l'autre.\n\nEt il y a la durée, le temps tel que nous le vivons. Le *Larousse* la définit, d'après Bergson, comme « la forme que prend la succession de nos états de conscience quand notre moi se laisse vivre »[^3]. Dans la durée, il n'y a pas de juxtaposition d'événements, et donc pas de causalité mécanique[^1]. Les états de conscience ne s'alignent pas comme des perles sur un fil : ils se pénètrent, s'organisent en un tout, et s'enrichissent les uns des autres[^1].\n\n## Deux multiplicités\n\nBergson formule cette différence avec un couple de notions. Une multiplicité *quantitative* est faite d'éléments distincts que l'on peut compter. Pour compter des moutons dans un troupeau, il faut ignorer ce qui les différencie et les placer, en pensée, côte à côte dans l'espace[^1].\n\nUne multiplicité *qualitative*, au contraire, est faite d'états qui ne sont pas extérieurs les uns aux autres : plusieurs états de conscience s'organisent en un tout, se pénètrent, et gagnent peu à peu un contenu plus riche[^1]. La durée exclut toute idée de juxtaposition, d'extériorité réciproque et d'étendue[^1].\n\n> **Illustration (pas un exemple de Bergson).** Une heure d'attente dans un couloir d'hôpital et une heure de conversation avec un ami ont la même mesure sur l'horloge. Vécues, elles n'ont rien de commun : l'une s'étire, chaque minute pèse sur la suivante ; l'autre passe sans qu'on ait rien compté. L'horloge dit « soixante minutes » dans les deux cas. La durée, elle, est chaque fois une autre.\n\n## La liberté\n\nPourquoi ce détour par le temps ? Parce qu'il commande, pour Bergson, la question de la liberté. Le débat entre partisans et adversaires du libre arbitre repose, selon lui, sur une confusion : une traduction illégitime de l'inétendu en étendu[^2]. On se représente la décision comme un point sur une ligne, d'où partiraient deux chemins possibles, et l'on se demande si l'un était déterminé d'avance. Mais la décision vécue n'est pas un carrefour dans l'espace : c'est un moment de la durée, où tout le passé du moi se ramasse.\n\nLa liberté, chez Bergson, est d'abord mobilité[^1] : non pas le choix entre deux options figées, mais l'acte qui sort de la personne tout entière. L'Essai répond aussi, à sa manière, à Kant, qui plaçait la liberté hors de l'espace et du temps[^1].\n\n> **Illustration.** Quelqu'un hésite longtemps à quitter son métier. On peut dresser la liste des raisons pour et contre, comme sur une balance. Mais le jour où il décide, ce n'est pas qu'une colonne l'a emporté : c'est que, mûrie par des mois, une décision est venue de lui. Bergson dirait que la liste était une image spatiale de ce qui se jouait dans la durée.\n\n## La suite de l'œuvre\n\n*Matière et mémoire* (1896) prolonge la réflexion sur le temps du côté du souvenir. Le livre est franchement dualiste, tout en cherchant à surmonter les difficultés qui ont toujours accompagné le dualisme[^1] ; le *Larousse* en résume la thèse par l'image du cône : le corps agit sur le plan présent grâce aux souvenirs accumulés[^3]. Avec *L'Évolution créatrice* (1907), la vie elle-même est entraînée par un « élan vital » dans des séries divergentes de transformations[^3].\n\nBergson entre au Collège de France, comme suppléant en 1896 puis comme titulaire en 1900[^3]. Le prix Nobel de littérature de 1927 lui est remis en 1928[^1][^3]. La théorie de la durée a profondément marqué la philosophie continentale du XXe siècle[^2].\n\n## Pourquoi cela compte encore\n\nLa distinction de Bergson ne retire rien à la science : elle lui rend son domaine, l'espace et le mesurable. Mais elle rappelle qu'une vie ne se laisse pas réduire à son emploi du temps. Pour qui écoute quelqu'un parler de son histoire, la remarque est précieuse : ce qui compte n'est pas toujours ce qui a duré le plus longtemps sur le calendrier, mais ce qui a pesé dans la durée.","quiz":[{"question":"Qu'oppose Bergson à la durée vécue ?","choix":["Le temps homogène des horloges, fait d'instants juxtaposés","L'éternité divine, hors de tout changement","Le temps biologique des cellules du corps","Le temps historique des nations et des peuples"],"bonne":0,"explication":"La durée s'oppose au temps spatialisé, homogène et mesurable, que figurent l'horloge et le calendrier. Dans la durée, les états de conscience se pénètrent au lieu de se juxtaposer."},{"question":"Qu'est-ce qu'une multiplicité qualitative ?","choix":["Un ensemble d'objets que l'on peut compter un à un","Des états qui se pénètrent et s'organisent en un tout, sans juxtaposition","Une suite d'instants identiques et mesurables","Un groupe de personnes qui partagent les mêmes qualités"],"bonne":1,"explication":"Les moutons d'un troupeau forment une multiplicité quantitative : on les compte en les plaçant côte à côte. Les états de conscience forment une multiplicité qualitative : ils se fondent et s'enrichissent."},{"question":"Une patiente dit : « Ces trois mois de chômage ont duré une éternité, mes dix ans de mariage sont passés en un éclair. » Que relèverait Bergson ?","choix":["Qu'elle se trompe sur les durées réelles, mesurées par le calendrier","Que la durée vécue ne coïncide pas avec le temps mesuré de l'horloge","Qu'elle confond deux souvenirs distincts","Qu'il faut corriger sa perception par des repères précis"],"bonne":1,"explication":"Le temps de l'horloge est homogène ; la durée vécue, qualitative, ne se laisse pas réduire à la mesure. Sa phrase n'est pas une erreur : elle décrit la durée."},{"question":"D'où viennent, selon Bergson, les faux problèmes de la liberté ?","choix":["D'une ignorance des lois de la physique","D'une croyance religieuse dans le destin","D'une traduction illégitime de l'inétendu en étendu","D'un manque de volonté chez les individus"],"bonne":2,"explication":"On se représente la décision comme un point dans l'espace d'où partiraient deux chemins. Pour Bergson, c'est traduire la durée en espace : la liberté est mobilité, acte de la personne tout entière."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Henri Bergson » (§ 1-4 : durée, multiplicités, liberté, Matière et mémoire, Nobel)","url":"https://plato.stanford.edu/entries/bergson/"},{"texte":"Wikipédia (anglais), « Time and Free Will » (thèse de 1889, confusion de l'inétendu et de l'étendu)","url":"https://en.wikipedia.org/wiki/Time_and_Free_Will"},{"texte":"Larousse, « Henri Bergson » (définition de la durée, Matière et mémoire, élan vital, Collège de France, Nobel)","url":"https://www.larousse.fr/encyclopedie/personnage/Henri_Bergson/108486"}]},{"id":"kohut-self","discipline":"psychanalyse","titre":"Les objets-soi","figure":"Heinz Kohut","branche":"moi","fiabilite":"secondaire","fiabilite_note":"La psychologie du self est présentée d'après Wikipédia (articles « Heinz Kohut » et « Self psychology », en anglais, et « Heinz Kohut » en français) ; les livres de Kohut n'ont pas été consultés directement.","reference":"The Analysis of the Self (1971) ; The Restoration of the Self (1977) ; How Does Analysis Cure? (posthume, 1984)","accroche":"On croit que grandir, c'est cesser d'avoir besoin des autres. Heinz Kohut soutient le contraire : on a besoin, toute sa vie, de personnes qui nous tiennent debout.","punch":"On ne se suffit jamais à soi-même. On apprend à choisir qui nous soutient.","idee":"Kohut fonde la psychologie du self. Le self se construit grâce à des « objets-soi » : des personnes vécues comme une part de soi, qui reflètent, qu'on idéalise, à qui l'on ressemble. Leur défaillance blesse le narcissisme ; l'empathie de l'analyste permet de le restaurer.","repere":"Heinz Kohut (1913-1981), né à Vienne, émigre à Chicago en 1940. Psychanalyste, président de l'Association psychanalytique américaine, il fonde à partir des années 1970 la psychologie du self, en partant du narcissisme.","liens":["winnicott-mere-suffisamment-bonne","lacan-stade-du-miroir","freud-transfert"],"texte":"Heinz Kohut naît à Vienne le 3 mai 1913 et meurt à Chicago le 8 octobre 1981[^1]. Il fait ses études de médecine à Vienne et commence une analyse avec August Aichhorn au début de 1938[^1]. Après l'annexion de l'Autriche, il quitte le pays, passe par un camp de réfugiés en Angleterre, puis traverse l'Atlantique en 1940 et s'installe à Chicago[^1]. Neurologue, puis psychiatre, il devient psychanalyste en 1950[^1] et préside l'Association psychanalytique américaine à partir de 1964[^3].\n\n## L'empathie comme méthode\n\nDès 1959, dans un article intitulé « Introspection, empathie et psychanalyse », Kohut avance une thèse forte : c'est l'empathie qui définit le champ de la psychologie. Ce qui est accessible par l'empathie est psychologique ; le reste relève de l'observation sensorielle[^1]. L'article est d'abord refusé par la revue de l'Association, jugé trop remuant pour la théorie[^1].\n\nKohut définit l'empathie comme une « introspection par procuration » : entrer dans l'expérience subjective d'un autre pour comprendre son monde intérieur[^2]. Elle est à la fois une méthode clinique et une expérience qui peut, en elle-même, aider un self fragmenté à se rassembler[^2].\n\n## Du narcissisme au self\n\nSa psychologie du self naît de son travail sur les troubles de la personnalité narcissique, avant de devenir une théorie générale[^2]. Freud décrivait le psychisme avec trois instances, le ça, le moi et le surmoi, et pensait en termes de pulsions et de conflits. Kohut rejette ce modèle structural et propose un self en trois pôles, qui ne se développe que si ses besoins de valeur et de bien-être sont satisfaits dans les relations avec les autres[^1]. L'accent passe des pulsions aux effets des relations[^1].\n\n## Les objets-soi\n\nLa notion centrale est celle d'*objet-soi* (*selfobject*). Ce sont des personnes, des objets ou des activités qui « complètent » le self et dont il a besoin pour fonctionner. Ils ne sont pas vécus comme des personnes séparées, mais comme une partie de la machinerie du self[^2]. Leur fonction passe d'ailleurs inaperçue jusqu'à ce que la relation soit rompue[^2].\n\nKohut distingue trois besoins, qui correspondent aux trois pôles du self[^2] :\n\n- le besoin d'être **reflété** (*mirroring*) : être reconnu, approuvé, confirmé ;\n- le besoin d'**idéaliser** : s'appuyer sur un autre admiré, qui donne force et stabilité ;\n- le besoin de **gémellité** (*twinship*, ou alter ego) : se sentir semblable aux autres, appartenir.\n\nSurtout, ce besoin ne disparaît pas avec l'enfance. Le besoin de relations à des objets-soi dure toute la vie[^1].\n\n> **Illustration (pas un exemple de Kohut).** Un enfant de cinq ans montre un dessin à son père : « Regarde ! » Le père lève les yeux, sourit, dit « Oh, le beau soleil ! ». Ce n'est pas un compliment de plus : c'est un miroir, où l'enfant se voit valoir quelque chose. Quarante ans plus tard, le même homme envoie un projet à un ami et attend fébrilement la réponse. Le besoin a changé de forme, pas de nature.\n\n## Des frustrations tolérables\n\nLes objets-soi ne sont pas parfaits, et il ne faut pas qu'ils le soient. Kohut parle d'une *frustration optimale* : des déceptions supportables aident l'enfant à construire ses propres structures pour s'apaiser[^2]. Mais des frustrations trop fortes ou mal placées sont traumatiques, et peuvent laisser des dommages durables[^2].\n\n## Le transfert\n\nEn analyse, ces besoins reviennent sous forme de transferts. Dans le transfert en *miroir*, le pôle blessé des ambitions cherche la réponse approbatrice de l'objet-soi ; dans le transfert *idéalisant*, le pôle des idéaux cherche quelqu'un qui accepte d'être idéalisé ; Kohut décrit aussi un transfert de *gémellité*[^2]. L'analyste ne cherche pas à les dissiper trop tôt : il les laisse se déployer, pour que le patient reprenne un développement interrompu.\n\n> **Illustration (un parallèle avec la clinique).** Un patient se fâche violemment parce que son analyste a déplacé une séance. Une lecture classique y verrait d'abord de l'agressivité à interpréter. Une lecture inspirée de Kohut demanderait d'abord ce que le patient a perdu : un appui qui le tenait, et dont l'absence soudaine l'a laissé en morceaux.\n\n## M. Z.\n\nEn 1977, Kohut écrit « Les deux analyses de M. Z. » : le même patient y est analysé deux fois, d'abord dans un cadre freudien classique, puis selon la psychologie du self[^1]. Le texte montre ce que la seconde perspective permet de voir. On le tient largement pour autobiographique, bien que Kohut ne l'ait jamais reconnu[^1].\n\n## Critiques\n\nLa psychologie du self a été vivement critiquée. Des tenants de la théorie des pulsions jugent qu'elle impute aux défaillances parentales presque toutes les difficultés[^2]. Des lacaniens lui reprochent de rester dans l'imaginaire et de négliger le narcissisme de l'analyste lui-même[^2]. Des tenants des relations d'objet notent qu'elle ne laisse guère de place aux déterminants internes[^2]. Ses positions sur l'agressivité ont été jugées naïves, et il a été écarté du conseil de l'Institut de Chicago[^1]. Son influence, pourtant, n'a cessé de grandir.","quiz":[{"question":"Qu'est-ce qu'un objet-soi chez Kohut ?","choix":["Un objet matériel auquel un enfant s'attache, comme un doudou","Une personne vécue comme une part de soi, qui soutient le self","Le moi idéal que chacun cherche à atteindre dans la vie","Une image de soi que l'on projette sur les autres"],"bonne":1,"explication":"Les objets-soi complètent le self et sont vécus comme une part de sa machinerie, non comme des personnes séparées. Leur fonction passe inaperçue tant qu'elle n'est pas rompue."},{"question":"Quels sont les trois besoins décrits par Kohut ?","choix":["Être reflété, idéaliser, se sentir semblable","Manger, dormir, se protéger des dangers","Aimer, travailler, jouer avec les autres","Réprimer, sublimer, projeter ses désirs"],"bonne":0,"explication":"Les trois pôles du self correspondent au besoin de miroir (mirroring), d'idéalisation et de gémellité (twinship)."},{"question":"Une collègue, très sûre d'elle, s'effondre quand son responsable, qu'elle admirait, quitte l'entreprise. Quelle lecture kohutienne est la plus juste ?","choix":["Elle était dépendante d'une manière pathologique et doit s'en guérir","Elle exprime une agressivité refoulée envers son responsable","Elle a perdu un objet-soi idéalisé qui soutenait son self","Elle simule une détresse pour obtenir de l'attention"],"bonne":2,"explication":"Pour Kohut, le besoin d'objets-soi dure toute la vie ; le responsable admiré tenait le pôle des idéaux, et sa perte peut laisser le self fragilisé."},{"question":"Que désigne la « frustration optimale » ?","choix":["L'absence totale de frustration, idéale pour l'enfant","Des déceptions tolérables, qui aident à construire le self","Une technique de punition recommandée aux parents","La frustration maximale qu'un adulte peut supporter"],"bonne":1,"explication":"Des frustrations supportables aident l'enfant à construire ses propres structures d'apaisement ; trop fortes ou mal placées, elles deviennent traumatiques."}],"sources":[{"texte":"Wikipédia (anglais), « Heinz Kohut » (dates, émigration, empathie 1959, self en trois pôles, objets-soi, M. Z., critiques)","url":"https://en.wikipedia.org/wiki/Heinz_Kohut"},{"texte":"Wikipédia (anglais), « Self psychology » (objets-soi, trois besoins, empathie, frustration optimale, transferts, critiques)","url":"https://en.wikipedia.org/wiki/Self_psychology"},{"texte":"Wikipédia (français), « Heinz Kohut » (Chicago, Association psychanalytique américaine, narcissisme, œuvres)","url":"https://fr.wikipedia.org/wiki/Heinz_Kohut"}]},{"id":"nietzsche-mort-de-dieu","discipline":"philosophie","titre":"Dieu est mort","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"mixte","fiabilite_note":"Le § 125 est cité d'après la traduction anglaise de Walter Kaufmann (1974) reproduite sur une page universitaire, et d'après une traduction française citée dans une conférence de classes préparatoires ; le sens de la formule, d'après Wikipédia, qui renvoie notamment à Heidegger.","reference":"Le Gai Savoir (1882), § 125 « L'insensé » ; § 343 (livre V, 1887) ; Ainsi parlait Zarathoustra (1883-1885)","accroche":"La phrase est souvent lue comme un slogan athée. Chez Nietzsche, elle est prononcée par un fou, sur une place, devant des gens qui ne croient déjà plus. Et il se dit venu trop tôt.","punch":"Dieu est mort, et personne n'a encore compris ce que cela change.","idee":"Dans le Gai Savoir, un insensé annonce sur la place du marché que Dieu est mort et que nous l'avons tué. Ce n'est pas une preuve d'athéisme : c'est le diagnostic d'une culture qui a perdu le fondement de ses valeurs sans en avoir mesuré les conséquences.","repere":"L'expression apparaît une première fois dans le Gai Savoir (1882), dans une section intitulée « Nouveaux combats », à propos de l'ombre de Bouddha qu'on montra des siècles durant dans une caverne. Le § 125 la met dans la bouche d'un insensé ; le § 343, ajouté en 1887, en donne l'explication.","liens":["nietzsche-perspectivisme","nietzsche-ressentiment","kierkegaard-angoisse"],"texte":"La phrase est l'une des plus connues de la philosophie, et l'une des plus mal lues. On l'entend comme une thèse : Dieu n'existe pas. Chez Nietzsche, c'est d'abord une scène, et il faut la lire comme une scène.\n\n## L'insensé sur la place\n\nLe § 125 du *Gai Savoir* s'intitule « L'insensé ». Un homme, une lanterne à la main, court sur la place du marché et crie : « Je cherche Dieu ! Je cherche Dieu ! » (*I seek God!*)[^1]. Autour de lui se tiennent beaucoup de gens qui ne croient pas en Dieu, et ils se moquent : Dieu s'est-il perdu ? s'est-il caché ?\n\nL'insensé les fixe et leur répond que Dieu est mort, et que nous l'avons tué, eux et lui[^2]. « Dieu est mort ! Dieu reste mort ! Et c'est nous qui l'avons tué ! » (*God is dead! God remains dead! And we have killed him!*)[^1]. Et il pose une question vertigineuse : « Comment avons-nous fait cela ? »[^3]\n\nPuis il se tait, regarde ses auditeurs, qui se taisent aussi, et jette sa lanterne à terre : « Elle se brisa et s'éteignit ». Et il dit : « je viens trop tôt, ce n'est pas encore mon heure »[^3].\n\n> **Illustration (pas un exemple de Nietzsche).** Imaginez quelqu'un qui annonce à une assemblée de comptables que la monnaie a perdu toute valeur. Ils sourient : chacun sait que les billets ne sont que du papier. Mais ils continuent à compter, à épargner, à se faire confiance comme si de rien n'était. L'annonce n'apprend rien à leur raison ; elle annonce un effondrement dont ils n'ont pas encore éprouvé les effets. C'est la situation de l'insensé.\n\n## À qui il parle\n\nLe détail décisif est le public. L'insensé ne s'adresse pas à des croyants qu'il faudrait convertir à l'athéisme. Il parle à des gens qui ne croient déjà plus. Ce qu'il leur reproche n'est pas de croire, c'est de ne pas mesurer ce que signifie la fin de la croyance.\n\nLe sens de la formule, rappelle-t-on souvent, n'est ni de constater la disparition d'un être surnaturel, ni d'avancer un argument athée. C'est un diagnostic sur l'état de la civilisation occidentale : « Dieu » y est le symbole de la morale chrétienne et de la vision métaphysique qui, pendant des siècles, ont fondé les valeurs, le sens et la morale en Europe[^2].\n\n## Ce que la mort de Dieu emporte\n\nLe § 343, ajouté en 1887 en ouverture du cinquième livre, donne la clé : que Dieu soit mort signifie que la croyance au Dieu chrétien est devenue indigne de foi[^2]. Et Nietzsche annonce ce qui en découle : une « longue profusion et succession de démolitions, de destructions, de déclins, de bouleversements » qui attend l'Europe[^3].\n\nSi la croyance tombe, tout ce qui s'appuyait sur elle vacille : l'idée d'un sens donné d'avance, d'une morale fondée hors du monde, d'une vérité garantie. L'événement est immense, et c'est pourquoi l'insensé vient « trop tôt » : la nouvelle n'est pas encore arrivée jusqu'à ceux qui en vivent pourtant déjà.\n\n> **Illustration.** Une personne a perdu la foi de son enfance depuis des années. Elle n'y pense plus. Mais le jour où elle doit prendre seule une décision grave, sans règle reçue qui tranche pour elle, elle découvre un vide qu'elle n'avait pas mesuré. La croyance était partie ; ce qu'elle soutenait, lui, n'avait pas encore été remplacé.\n\n## Zarathoustra\n\nDans *Ainsi parlait Zarathoustra*, Zarathoustra rencontre dans la forêt un vieux saint et s'étonne, une fois seul, qu'il n'ait pas encore entendu dire que Dieu est mort[^2]. Plus loin, la première partie se termine sur une formule : « Morts sont tous les dieux : maintenant nous voulons que vive le surhomme »[^2]. La mort de Dieu n'est pas un point d'arrivée. Elle ouvre une tâche : créer des valeurs, là où il n'y en a plus de garanties.\n\n## Une postérité\n\nHeidegger consacre en 1943 une étude à « La parole de Nietzsche \"Dieu est mort\" »[^2]. L'expression a depuis nourri bien d'autres lectures, philosophiques et théologiques. Ce que la scène du § 125 garde de singulier, c'est son ton : ni triomphe ni soulagement, mais l'effroi de quelqu'un qui voit ce que les autres ne voient pas encore.\n\nOn peut y entendre une question qui ne regarde pas seulement la religion : que devient un sujet, ou une culture, quand ce qui garantissait le sens se retire, et qu'il faut continuer à vivre sans cette garantie ?","quiz":[{"question":"À qui l'insensé du § 125 annonce-t-il la mort de Dieu ?","choix":["À des prêtres réunis dans leur église","À des incroyants, qui se moquent de lui","À des enfants qu'il veut instruire","Au roi, pour qu'il change les lois"],"bonne":1,"explication":"Il s'adresse à des incroyants. Ce qu'il leur reproche n'est pas leur foi, mais de ne pas mesurer ce que la fin de la croyance emporte."},{"question":"Pourquoi l'insensé dit-il qu'il « vient trop tôt » ?","choix":["Parce que Dieu n'est pas encore mort à ce moment-là","Parce que la place du marché n'est pas encore ouverte à cette heure","L'événement a eu lieu, mais personne n'en mesure la portée","Parce qu'il doit d'abord convaincre les savants"],"bonne":2,"explication":"L'événement a eu lieu, « nous l'avons tué », mais la nouvelle n'est pas encore arrivée jusqu'à ceux qui en vivent. Le décalage entre l'événement et sa prise de conscience fait le sens de la scène."},{"question":"Un étudiant affirme : « Nietzsche démontre que Dieu n'existe pas. » Quelle correction s'impose ?","choix":["Aucune : c'est exactement la thèse du § 125","C'est un diagnostic : la croyance qui fondait les valeurs s'est effondrée","Nietzsche démontre au contraire que Dieu existe","La formule est une plaisanterie, sans portée philosophique réelle"],"bonne":1,"explication":"La formule ne prétend pas démontrer l'inexistence de Dieu : « Dieu » y symbolise la morale et la métaphysique qui fondaient les valeurs européennes. C'est leur effondrement qui est diagnostiqué."},{"question":"Que signifie la mort de Dieu selon le § 343 ?","choix":["Que la croyance au Dieu chrétien est devenue indigne de foi","Que l'Église a été abolie par une révolution","Que la science a prouvé la fausseté de la Bible","Que les hommes ont cessé de chercher le bonheur"],"bonne":0,"explication":"Le § 343 explique la formule : la croyance au Dieu chrétien est devenue indigne de foi, avec les « démolitions » et « bouleversements » qui en découlent."}],"sources":[{"texte":"Nietzsche, The Gay Science, § 125 « The Madman », trad. Walter Kaufmann (1974), page de cours, université de Hong Kong","url":"https://philosophy.hku.hk/courses/200506/yphi0002/files/28-sept.htm"},{"texte":"Wikipédia (anglais), « God is dead » (première apparition, § 343, Zarathoustra, sens, Heidegger)","url":"https://en.wikipedia.org/wiki/God_is_dead"},{"texte":"Conférence « Nietzsche, la mort de Dieu », lycée Bellevue, décembre 2020 (extraits français des § 125 et 343)","url":"https://site.ac-martinique.fr/philosophie/wp-content/uploads/sites/20/2023/11/NIETZSCHE_mort-de-dieu_decembre2020.pdf"}]},{"id":"nietzsche-freud","discipline":"croisement","titre":"Le livre que Freud n'ouvrait pas","figure":"Nietzsche, Freud","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"La relation entre les deux auteurs est reconstituée d'après Wikipédia (qui renvoie à Peter Gay, Paul Roazen et Peter Rudnytsky), un article du British Journal of Psychiatry et l'Encyclopédie de Stanford ; la correspondance de Freud n'a pas été consultée directement.","reference":"Nietzsche, Le Gai Savoir (1882), Généalogie de la morale (1887) ; Freud, déclarations de 1908, Le Moi et le Ça (1923)","accroche":"Freud a acheté les œuvres complètes de Nietzsche, puis a dit ne pas les avoir ouvertes. Une résistance qui en dit long sur une parenté troublante.","punch":"Freud n'a pas lu Nietzsche, dit-il. Il le tenait à distance.","idee":"Freud dit ne pas avoir étudié Nietzsche, dont les intuitions ressemblaient trop aux siennes. Inconscient, refoulement, retournement des sentiments hostiles : les analogies sont réelles. La question n'est pas qui a copié qui, mais pourquoi deux pensées si proches se sont tenues à distance.","repere":"En 1900, Freud achète les œuvres complètes de Nietzsche ; il écrit alors espérer y trouver les mots de beaucoup de choses qui restent muettes en lui. Il dira plus tard ne pas les avoir encore ouvertes. Nietzsche, lui, ne pouvait pas lire Freud : il a cessé d'écrire en 1889.","liens":["nietzsche-ressentiment","nietzsche-perspectivisme","freud-moi-pas-maitre"],"texte":"Les historiens de la psychanalyse aiment cette scène, parce qu'elle a quelque chose d'un symptôme. En 1900, l'année de *L'Interprétation du rêve*, Freud achète les œuvres complètes de Nietzsche. Il écrit à son ami Fliess qu'il espère y trouver « les mots de beaucoup de choses qui restent muettes en moi ». Plus tard, il dira ne pas les avoir encore ouvertes[^1].\n\n## Ce que Freud a dit\n\nFreud a répété qu'il n'avait jamais lu Nietzsche[^2]. Ses déclarations sont pourtant plus nuancées qu'un simple refus. En 1908, il dit lire Nietzsche de temps à autre, et en être fortement fasciné, mais sans l'étudier : ses intuitions ressemblaient trop à ses propres travaux du moment, et il se sentait submergé par sa richesse d'idées[^1].\n\nLes biographes ont relevé d'autres traces. Selon Paul Roazen, qui cite Peter Rudnytsky, Freud aurait lu *La Naissance de la tragédie*, et probablement les deux premières *Considérations inactuelles*, à dix-sept ans[^1]. Et son biographe Peter Gay résume l'attitude de Freud d'une formule : il traitait les écrits de Nietzsche « comme des textes à combattre bien plus qu'à étudier »[^1].\n\nFreud se disait d'ailleurs peu enclin, de manière générale, à rattacher ses idées à des théories philosophiques antérieures[^1].\n\n> **Illustration (pas une thèse des auteurs).** Un chercheur apprend qu'un collègue étranger travaille exactement sur sa question. Il pourrait lire ses articles. Il ne le fait pas : il craint d'y trouver ses propres idées déjà formulées, et de ne plus savoir ce qui lui appartient. Ce n'est pas de l'ignorance, c'est une manière de protéger un travail en cours. Le cas de Freud a quelque chose de cette prudence.\n\n## Ce que les lecteurs ont trouvé\n\nLes analogies sont nombreuses. Un article du *British Journal of Psychiatry* en relève plusieurs : l'inconscient, le refoulement, la formation de substituts, comme des sentiments hostiles qui s'expriment sous la forme de l'altruisme, ou encore la projection de sentiments hostiles à l'origine de la pensée paranoïaque. Certains termes de base de Freud, notent les auteurs, sont identiques à ceux de Nietzsche[^2].\n\nDu côté de Nietzsche, l'idée qu'une grande part de notre vie psychique échappe à la conscience est explicite. Dans *Le Gai Savoir*, il écrit que « de loin la plus grande part de l'activité de notre esprit » reste inconsciente et non ressentie (§ 333) ; dans *Aurore*, que nous avons l'habitude d'exclure de nos comptes tous les processus inconscients (§ 129)[^3]. Et dans la *Généalogie de la morale*, il cherche aux valeurs morales une cause physiologique : le ressentiment a une « cause » réelle, dans le corps[^3].\n\n## Un mot venu d'ailleurs\n\nUn détail de vocabulaire montre à quel point les chemins se croisent. En 1923, dans *Le Moi et le Ça*, Freud nomme *das Es*, « le ça », la part impersonnelle du psychisme. Le terme vient du médecin Georg Groddeck, dont *Le Livre du ça* paraît la même année[^4]. Freud reconnaît lui-même cet emprunt[^1] : pour nommer ce qui, en nous, n'est pas « moi », il prend le mot d'un autre.\n\n## Deux manières de démasquer\n\nPaul Ricœur rangera les deux hommes, avec Marx, parmi les « maîtres du soupçon » : des penseurs qui tiennent le sens qui se présente à la conscience pour un effet, produit par autre chose (voir la fiche sur Ricœur). Mais la manière diffère.\n\nNietzsche interprète en philologue et en généalogiste. Il lit les valeurs comme des symptômes d'un type de vie, et sa question est : quel type d'homme a besoin de croire cela ? Freud travaille en clinicien. Il part de symptômes singuliers, de rêves et de lapsus, et construit une théorie révisable à partir de ce que la cure lui montre.\n\n> **Illustration (un rapprochement, à prendre comme tel).** Le mélancolique de Freud s'accuse de défauts qui conviennent mieux à l'objet perdu : ses plaintes sont des accusations retournées contre lui-même (voir la fiche sur le deuil). L'homme du ressentiment de Nietzsche, privé d'action, invente des valeurs qui accusent l'autre. Dans les deux cas, une hostilité qui ne peut pas s'exprimer directement change de forme et de cible. Les deux auteurs n'en tirent pas les mêmes conclusions ; mais la structure est voisine.\n\n## Ce que la proximité enseigne\n\nOn pourrait chercher qui a anticipé qui. La question est sans grand intérêt : Nietzsche ne pouvait pas lire Freud, et Freud a choisi de ne pas lire Nietzsche de près. Ce qui est plus instructif, c'est la distance elle-même. Une pensée qui s'élabore a parfois besoin de ne pas savoir qu'elle a été devancée. Freud, qui a tant écrit sur la résistance, en offre ici un exemple discret, à propos de ses propres lectures.","quiz":[{"question":"Que dit Freud en 1908 de sa lecture de Nietzsche ?","choix":["Qu'il l'a étudié de près dès ses années de lycée","Qu'il le lit parfois, fasciné, sans l'étudier, tant il lui ressemble","Qu'il n'en a jamais entendu parler avant les années 1920","Qu'il le juge sans intérêt pour la psychanalyse"],"bonne":1,"explication":"Freud se dit fortement fasciné, mais il évite d'étudier Nietzsche : ses intuitions ressemblaient trop à ses propres travaux. Il ne le juge pas sans intérêt, au contraire."},{"question":"D'où vient le terme das Es, « le ça », chez Freud ?","choix":["D'un néologisme forgé par Freud dans L'Interprétation du rêve","Du médecin Georg Groddeck, à qui Freud l'emprunte","D'une traduction de l'anglais « id » par Marie Bonaparte","D'un terme de la philosophie de Kant"],"bonne":1,"explication":"Freud reconnaît emprunter das Es à Georg Groddeck ; « id » est au contraire la traduction latine choisie en anglais."},{"question":"Un collègue soutient : « Freud a tout pris à Nietzsche. » Quelle réponse est la plus juste ?","choix":["Il a raison : Freud reconnaît l'avoir étudié et copié","Il a tort : il n'existe aucune ressemblance entre leurs idées","Les analogies sont réelles, mais Freud l'a tenu à distance et part de la clinique","La question est absurde, puisque Nietzsche est venu après Freud"],"bonne":2,"explication":"Les ressemblances sont relevées par les commentateurs, et Freud lui-même les reconnaît en 1908 ; mais il dit avoir évité d'étudier Nietzsche, et sa méthode est clinique. Nietzsche a cessé d'écrire en 1889."},{"question":"Qu'ont en commun le ressentiment nietzschéen et la mélancolie freudienne, dans le rapprochement proposé ?","choix":["Les deux sont des maladies du corps, sans dimension psychique","Une hostilité empêchée change de forme et de cible","Les deux reposent sur une confiance totale dans la conscience","Les deux décrivent une joie excessive"],"bonne":1,"explication":"Chez Nietzsche, l'impuissance à agir crée des valeurs qui accusent l'autre ; chez Freud, les reproches à l'objet perdu se retournent contre le moi. La structure est voisine, les conclusions diffèrent."}],"sources":[{"texte":"Wikipédia (anglais), « Sigmund Freud » (Nietzsche : déclaration de 1908, achat des œuvres en 1900, Gay, Roazen, Rudnytsky)","url":"https://en.wikipedia.org/wiki/Sigmund_Freud"},{"texte":"A. H. Chapman et M. Chapman-Santana, « The Influence of Nietzsche on Freud's Ideas », British Journal of Psychiatry, 166 (2), 1995, p. 251-253","url":"https://www.cambridge.org/core/journals/the-british-journal-of-psychiatry/article/influence-of-nietzsche-on-freuds-ideas/8557C7EE2793827FB7AD66FE61F3ACFE"},{"texte":"Stanford Encyclopedia of Philosophy, « Nietzsche's Moral and Political Philosophy » (inconscient, cause physiologique du ressentiment)","url":"https://plato.stanford.edu/entries/nietzsche-moral-political/"},{"texte":"Wikipédia (anglais), « Id, ego and superego » (Groddeck et das Es)","url":"https://en.wikipedia.org/wiki/Id,_ego_and_superego"}]},{"id":"anzieu-moi-peau","discipline":"psychanalyse","titre":"Le Moi-peau","figure":"Didier Anzieu","branche":"france","fiabilite":"secondaire","fiabilite_note":"Le Moi-peau est présenté d'après les articles de Wikipédia en français et en anglais, qui citent René Roussillon ; le livre d'Anzieu n'a pas été consulté directement. La liste des fonctions du Moi-peau, souvent reproduite, n'est pas donnée ici, faute de l'avoir vérifiée sur une source accessible.","reference":"« Le Moi-peau », Nouvelle revue de psychanalyse, n° 9, 1974 ; Le Moi-peau (Dunod, 1985)","accroche":"On dit d'une personne qu'elle a « la peau dure » ou qu'elle est « à fleur de peau ». Didier Anzieu prend ces expressions au sérieux : le psychisme aussi a besoin d'une enveloppe.","punch":"Avant d'avoir un moi, on a une peau, et c'est d'abord une peau partagée.","idee":"Anzieu décrit le Moi-peau comme une première enveloppe psychique, modelée sur l'expérience de la peau : elle délimite un dedans et un dehors, contient et protège. Elle se construit d'abord comme une peau commune entre la mère et l'enfant, et sa qualité dépend des soins reçus.","repere":"Didier Anzieu (1923-1999), normalien et agrégé de philosophie, professeur à Nanterre, a d'abord été analysé par Lacan, sans savoir que celui-ci avait soigné sa mère, la patiente « Aimée ». Il expose le Moi-peau dans un article de 1974, puis dans un livre en 1985.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","lacan-stade-du-miroir"],"texte":"Didier Anzieu naît à Melun le 8 juillet 1923 et meurt à Paris le 25 novembre 1999[^2]. Il entre à l'École normale supérieure en 1944, où il a pour camarades Jean Laplanche et Jean-Bertrand Pontalis, et passe l'agrégation de philosophie en 1948[^1]. Assistant de Daniel Lagache, il soutient en 1957 une thèse sur l'auto-analyse de Freud, enseigne à Strasbourg puis, à partir de 1964, à Nanterre, où il contribue à fonder le département de psychologie[^1].\n\n## Une histoire de famille\n\nSa trajectoire comporte un épisode étrange. Anzieu commence une analyse avec Jacques Lacan sans savoir que celui-ci a été le psychiatre de sa mère, internée à l'hôpital Sainte-Anne. Lacan avait décrit son cas dans sa thèse de médecine, sous le nom d'« Aimée »[^1]. Quand il l'apprend, Anzieu entreprend une seconde analyse, avec Georges Favez, et garde rancune à Lacan de ce manque de franchise[^2].\n\n## La peau comme modèle\n\nLe concept de Moi-peau apparaît dans un article de 1974 de la *Nouvelle revue de psychanalyse*, puis dans le livre *Le Moi-peau*[^1]. L'idée lui vient en partie de son travail avec des patients atteints d'eczéma, au cours d'une formation en dermatologie[^1].\n\nLe point de départ est simple. La peau est la première frontière du corps : elle sépare l'intérieur de l'extérieur, elle contient, elle protège, elle met en contact. Anzieu fait l'hypothèse que le psychisme se construit sur ce modèle. Le Moi-peau est, selon une formule reprise en anglais, la première enveloppe narcissique sur laquelle repose le sentiment de bien-être[^2].\n\nRené Roussillon le résume ainsi : le Moi-peau offre une première forme de délimitation entre le moi et son environnement ; une enveloppe délimite un dedans et un dehors, et forme une barrière[^1].\n\n> **Illustration (pas un exemple d'Anzieu).** Un nourrisson qui pleure se calme quand on l'enveloppe dans une couverture et qu'on le tient contre soi. Rien n'a été « expliqué » ; une limite a été donnée. Il sent où il commence et où il finit, et qu'il est tenu. L'hypothèse d'Anzieu est que ce sentiment d'être contenu, d'abord vécu par la peau, devient peu à peu une capacité psychique : celle de contenir ses propres émotions.\n\n## Une peau d'abord commune\n\nLe Moi-peau ne se forme pas tout seul. Pour Anzieu, le processus de différenciation entre l'enfant et sa mère ne peut se faire sans un temps préalable : la construction d'une peau commune entre mère et enfant[^1]. L'enfant doit d'abord être enveloppé avec un autre avant de pouvoir avoir sa propre enveloppe. Et la qualité de cette peau dépend de la qualité des soins maternels[^1].\n\nOn retrouve ici une famille d'idées voisines : le « holding » de Winnicott, la fonction contenante de Bion, sur qui Anzieu s'appuie beaucoup[^2]. L'idée d'une peau qui contient serait d'ailleurs née chez Marion Milner et Winnicott, avant d'entrer dans la psychanalyse continentale[^2]. Anzieu lui donne une ampleur nouvelle : il ne s'agit plus seulement de ce que la mère fait pour l'enfant, mais de ce que l'enfant en garde, une structure qui continue de le tenir quand elle n'est plus là.\n\n## Peaux épaisses, peaux minces\n\nLa notion permet de décrire des différences cliniques. Les personnalités narcissiques auraient un Moi-peau d'une épaisseur inhabituelle, qui les protège mais les isole ; les personnalités masochistes ou limites, un Moi-peau remarquablement mince, qui laisse tout passer[^2].\n\n> **Illustration (un parallèle avec la clinique).** Un patient dit qu'il « prend tout pour lui » : une remarque anodine au travail le blesse pour des jours. Une autre patiente dit qu'« il ne lui arrive jamais rien » et que rien ne la touche. On peut entendre, dans les deux plaintes, deux défaillances d'enveloppe, l'une trop poreuse, l'autre trop rigide. Le travail ne consiste pas seulement à interpréter des contenus, mais aussi à aider à constituer une limite.\n\n## D'autres enveloppes\n\nAnzieu étend ensuite le modèle. Il introduit la notion d'*enveloppe sonore*[^1] : l'image, selon la critique Kaja Silverman, d'un enfant tenu dans la sphère de la voix maternelle[^2], avant même qu'il comprenne les mots. Il parle aussi d'une enveloppe du rêve : le film visuel du rêve vient remplacer, la nuit, l'enveloppe tactile de la peau, cette membrane fine et éphémère[^2].\n\nIl applique enfin l'idée aux groupes, à partir de Bion : il n'y a pas de groupe sans une peau commune, une enveloppe contenante, qui permet aux membres d'éprouver un « soi » de groupe[^2]. Il cofonde en 1962, avec René Kaës et d'autres, le CEFFRAP, consacré au travail psychanalytique en groupe[^1].\n\n## Une notion qui a voyagé\n\nAnzieu a aussi consacré des études à la création, chez Samuel Beckett ou Francis Bacon[^1]. Sa question de fond reste la même : avant de penser, il faut un lieu où les pensées puissent tenir.","quiz":[{"question":"Qu'est-ce que le Moi-peau selon Anzieu ?","choix":["Une maladie de peau d'origine purement psychologique","Une première enveloppe psychique, modelée sur l'expérience de la peau","Le nom donné par Anzieu au surmoi qui juge et punit","Une technique de relaxation fondée sur le toucher"],"bonne":1,"explication":"Le Moi-peau délimite un dedans et un dehors, contient et protège : c'est la première enveloppe narcissique sur laquelle repose le sentiment de bien-être."},{"question":"Que faut-il, selon Anzieu, avant que l'enfant ait son propre Moi-peau ?","choix":["Qu'il apprenne à parler et à dire « je »","Une peau commune entre la mère et l'enfant","Qu'il se reconnaisse dans un miroir vers dix-huit mois","Qu'il soit séparé très tôt de sa mère"],"bonne":1,"explication":"La différenciation suppose un temps préalable : la construction d'une peau commune entre mère et enfant, dont la qualité dépend des soins reçus."},{"question":"Un collègue se dit blessé pendant des jours par la moindre remarque, et dit « tout me traverse ». Quelle notion d'Anzieu éclaire cette plainte ?","choix":["Une enveloppe trop épaisse, qui l'isole des autres","Une enveloppe psychique trop mince, qui laisse tout passer","Une enveloppe sonore, liée à la voix maternelle","Une enveloppe de groupe, propre aux institutions"],"bonne":1,"explication":"Anzieu décrit chez certaines personnalités limites ou masochistes un Moi-peau remarquablement mince : la limite entre dedans et dehors protège mal."},{"question":"Quel épisode marque l'analyse d'Anzieu avec Lacan ?","choix":["Lacan avait été l'élève de son père à l'École normale","Lacan avait soigné sa mère, la patiente « Aimée », sans le lui dire","Lacan l'avait exclu de son séminaire pour indiscipline","Lacan avait refusé de le prendre en analyse"],"bonne":1,"explication":"Lacan avait décrit la mère d'Anzieu dans sa thèse sous le nom d'« Aimée ». L'apprenant, Anzieu fit une seconde analyse avec Georges Favez."}],"sources":[{"texte":"Wikipédia (français), « Didier Anzieu » (biographie, cas Aimée, Moi-peau, peau commune, enveloppe sonore, CEFFRAP)","url":"https://fr.wikipedia.org/wiki/Didier_Anzieu"},{"texte":"Wikipédia (anglais), « Didier Anzieu » (dates, enveloppe narcissique, peaux épaisses et minces, enveloppe du rêve, groupes)","url":"https://en.wikipedia.org/wiki/Didier_Anzieu"}]},{"id":"weil-attention","discipline":"philosophie","titre":"L'attention","figure":"Simone Weil","branche":"morale","fiabilite":"secondaire","fiabilite_note":"Weil est présentée d'après l'Encyclopédie de Stanford, qui cite Attente de Dieu dans sa traduction anglaise (Waiting for God, abrégé WFG) avec ses pages, et d'après Wikipédia. Les citations sont retraduites ici depuis l'anglais : le texte français original n'a pas été consulté.","reference":"« Réflexions sur le bon usage des études scolaires en vue de l'amour de Dieu », dans Attente de Dieu (posthume) ; La Pesanteur et la grâce (posthume, choix de Gustave Thibon)","accroche":"On croit que faire attention, c'est se concentrer, froncer les sourcils, serrer les dents. Simone Weil dit presque l'inverse : c'est suspendre sa pensée, et attendre.","punch":"L'attention est la forme la plus rare et la plus pure de la générosité.","idee":"Pour Simone Weil, l'attention n'est pas un effort de volonté mais une attente : suspendre sa pensée, la laisser disponible, vide et pénétrable à ce qu'on regarde. Elle fonde à la fois l'étude, la prière et l'amour du prochain, qui consiste d'abord à savoir regarder celui qui souffre.","citation":"Attention is the rarest and purest form of generosity.","citation_source":"Simone Weil, lettre à Joë Bousquet du 13 avril 1942, citée en anglais par Wikipédia — « L'attention est la forme la plus rare et la plus pure de la générosité »","citation_url":"https://en.wikipedia.org/wiki/Simone_Weil","liens":["murdoch-attention","levinas-visage","bion-reverie"],"texte":"Simone Weil naît à Paris le 3 février 1909[^1]. Agrégée de philosophie en 1931, elle enseigne par intermittence dans les années 1930, avec des interruptions dues à sa santé et à son engagement politique[^2]. Elle meurt le 24 août 1943 à Ashford, en Angleterre, à trente-quatre ans, alors qu'elle travaille pour la France libre[^2]. Elle n'a presque rien publié de son vivant : ses livres les plus lus sont des recueils posthumes, tirés de ses cahiers et de ses lettres.\n\n## Une année d'usine\n\nEn juin 1934, elle demande un congé pour travailler en usine. Elle sera ouvrière chez Alstom puis chez Renault[^2] ; au total, cette « année d'usine » représente environ vingt-quatre semaines de travail effectif[^1]. Elle en revient marquée. Elle écrit que le temps y était un « fardeau intolérable », et elle décrit cette expérience comme une forme d'« esclavage »[^1].\n\nC'est de là que vient l'une de ses notions centrales, le *malheur*. Le mot ne désigne pas une simple souffrance : c'est l'union d'une douleur physique, d'une angoisse morale et d'une dégradation sociale, qui écrase la personne et la rend comme invisible aux autres[^1]. La question de l'attention naît en partie de ce constat : comment voir celui que le malheur a rendu invisible ?\n\n## Suspendre sa pensée\n\nLa définition de Weil surprend. L'attention consiste à suspendre sa pensée, à la laisser disponible, détachée[^1]. Elle n'est pas un effort crispé. En français, Weil joue sur la parenté entre *attention* et *attente* : la pensée doit être en attente, ne rien chercher, mais être prête à recevoir dans sa vérité nue l'objet qui va y pénétrer[^1].\n\nD'où une formule plus forte encore : l'âme se vide de tout son propre contenu pour recevoir en elle l'être qu'elle regarde, tel qu'il est[^1].\n\n> **Illustration (pas un exemple de Weil).** Un élève bute sur un problème de géométrie. Il serre les dents, relit l'énoncé dix fois, s'énerve : rien ne vient. Il s'arrête, regarde la figure sans rien chercher, laisse les données reposer. Et soudain, il voit le triangle qui manquait. Ce n'est pas l'effort qui a trouvé, c'est la disponibilité. Weil soutient que même une recherche qui échoue a exercé cette faculté-là.\n\n## L'étude et la prière\n\nLe texte le plus connu de Weil sur ce sujet s'intitule « Réflexions sur le bon usage des études scolaires en vue de l'amour de Dieu ». Il part de la prière, définie comme l'orientation vers Dieu de toute l'attention dont l'âme est capable[^1]. L'attention est la substance même de la prière[^2].\n\nL'idée est étonnante : les exercices scolaires, même ceux qu'on n'aime pas, même ceux où l'on échoue, ont une valeur, parce qu'ils forment cette capacité d'attention. On n'étudie pas d'abord pour savoir, mais pour apprendre à regarder.\n\n## L'amour du prochain\n\nL'attention ne sert pas seulement à prier ou à étudier. Elle est aussi, pour Weil, la condition de l'amour d'autrui. Aimer son prochain, c'est d'abord être capable de lui demander : quel est ton tourment ?[^2] Et c'est respecter la dignité du malheur chez celui qui est malheureux[^1].\n\nC'est le sens de la phrase qu'elle écrit au poète Joë Bousquet, en 1942 : l'attention est la forme la plus rare et la plus pure de la générosité[^2]. Elle est rare parce qu'elle coûte : il faut cesser un moment de penser à soi.\n\n> **Illustration (un parallèle avec la clinique).** Une personne raconte à un ami la mort de son père. L'ami, de bonne foi, enchaîne : « Je sais ce que c'est, quand j'ai perdu ma mère… » Il croit compatir ; il a ramené la conversation à lui. L'attention dont parle Weil serait l'inverse : se taire assez pour que l'autre puisse exister dans ce qu'il dit. C'est aussi, dans un autre vocabulaire, la position de l'écoute analytique.\n\n## Pesanteur et grâce\n\nWeil pense l'âme humaine à l'aide d'une image physique. La *pesanteur* est la pente naturelle qui détourne l'attention, vers soi, loin de Dieu et des malheureux ; la *grâce* est la bonté divine qui vient faire contrepoids[^1]. Le recueil qui porte ce titre n'a pas été composé par elle : le philosophe Gustave Thibon a classé par thèmes des passages des cahiers qu'elle lui avait confiés[^2].\n\nSon idée la plus radicale est la *décréation* : le renoncement à l'autonomie et au pouvoir du moi, qu'elle décrit paradoxalement comme une « activité passive »[^1]. L'attention en est la forme quotidienne : se retirer un peu pour laisser place à ce qui est.\n\n## Une influence durable\n\nEn 1951, Albert Camus la décrit comme « le seul grand esprit de notre temps »[^2]. La philosophe britannique Iris Murdoch reprendra sa notion d'attention et en fera le centre de sa philosophie morale (voir la fiche sur Murdoch). L'idée a traversé les frontières de la religion : on peut ne pas partager la foi de Weil et retenir que l'attention est un acte moral, et peut-être le premier.","quiz":[{"question":"Comment Simone Weil définit-elle l'attention ?","choix":["Comme un effort de volonté qui force l'esprit à se concentrer","Comme une suspension de la pensée, disponible et en attente","Comme la capacité de faire plusieurs choses à la fois","Comme une technique de mémorisation pour les examens"],"bonne":1,"explication":"L'attention consiste à suspendre sa pensée, à la laisser disponible et détachée. Weil la rapproche de l'attente : la pensée ne cherche rien, elle est prête à recevoir."},{"question":"Pourquoi les études scolaires ont-elles de la valeur, selon Weil, même quand on échoue ?","choix":["Parce qu'elles préparent à obtenir un emploi stable et rémunéré","Parce que les notes mesurent exactement l'intelligence de chacun","Parce qu'elles exercent la faculté d'attention","Parce que l'échec apprend à obéir aux maîtres et aux règles"],"bonne":2,"explication":"Le texte sur le « bon usage des études scolaires » soutient que l'exercice forme l'attention, qui est la substance de la prière et la condition de l'amour du prochain."},{"question":"Une amie vous confie son chagrin, et vous êtes tenté de raconter aussitôt une expérience semblable. Que suggérerait Weil ?","choix":["Se taire assez pour recevoir ce que l'autre vit, tel qu'il est","Raconter votre histoire pour lui montrer qu'elle n'est pas seule","Lui donner rapidement des conseils pratiques pour avancer","Changer de sujet pour la distraire de sa peine"],"bonne":0,"explication":"Pour Weil, aimer son prochain, c'est pouvoir lui demander « quel est ton tourment ? » et l'âme doit se vider de son contenu pour recevoir l'autre tel qu'il est."},{"question":"Que désigne le « malheur » chez Simone Weil ?","choix":["Une simple tristesse passagère qu'on peut surmonter seul","Une souffrance qui unit douleur, angoisse et dégradation sociale","La punition divine des fautes commises dans une vie","Le sentiment d'ennui que produit le travail répétitif"],"bonne":1,"explication":"Le malheur, que Weil a approché à l'usine, combine douleur physique, angoisse morale et dégradation sociale. Il rend les malheureux comme invisibles, d'où l'importance de l'attention."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Simone Weil » (biographie, usine, malheur, attention et attente, décréation, pesanteur et grâce)","url":"https://plato.stanford.edu/entries/simone-weil/"},{"texte":"Wikipédia (anglais), « Simone Weil » (agrégation, Alstom et Renault, Ashford, attention et générosité, Thibon, Camus)","url":"https://en.wikipedia.org/wiki/Simone_Weil"}]},{"id":"dolto-image-du-corps","discipline":"psychanalyse","titre":"L'image inconsciente du corps","figure":"Françoise Dolto","branche":"france","fiabilite":"secondaire","fiabilite_note":"Dolto est présentée d'après l'Encyclopédie Larousse et Wikipédia ; L'Image inconsciente du corps n'a pas été consulté directement. La formule « l'enfant est une personne », qu'on lui prête souvent, n'est pas d'elle.","reference":"Psychanalyse et pédiatrie (thèse, 1939) ; L'Image inconsciente du corps (Seuil, 1984)","accroche":"Deux enfants du même âge ont le même corps, les mêmes nerfs, les mêmes muscles. Pourtant, ils ne l'habitent pas de la même façon. Dolto appelle cette différence l'image inconsciente du corps.","punch":"Le corps se mûrit tout seul. Son image, elle, se parle.","idee":"Dolto distingue le schéma corporel, qui suit la maturation neurologique et est commun à tous, de l'image inconsciente du corps, propre à chacun, qui se construit dans la relation de langage avec la mère. Les séparations successives, ou « castrations symboligènes », l'ouvrent au symbolique.","repere":"Françoise Dolto (1908-1988), pédiatre et psychanalyste, soutient en 1939 sa thèse Psychanalyse et pédiatrie. Proche de Lacan, elle exerce près de quarante ans à l'hôpital Trousseau, crée la Maison verte en 1979 et parle aux parents sur France Inter.","liens":["winnicott-mere-suffisamment-bonne","lacan-stade-du-miroir","freud-fort-da"],"texte":"Françoise Dolto, née Marette, naît à Paris en 1908 et y meurt en 1988[^1]. Elle choisit la médecine contre l'avis de sa famille : bachelière en 1925, infirmière en 1930, elle commence la médecine en 1931[^2]. Vers 1932, elle entreprend une analyse avec René Laforgue, qui l'encourage à devenir psychanalyste[^2]. Elle travaille à l'hôpital Bretonneau, puis à l'hôpital Trousseau, où elle reste près de quarante ans[^1].\n\nSa thèse de médecine, *Psychanalyse et pédiatrie* (1939), pose déjà les bases de sa méthode : parler directement aux enfants de la réalité de ce qu'ils vivent, dans un langage qui leur est accessible[^2].\n\n## Une psychanalyste publique\n\nElle rencontre Lacan en 1938 et suit son enseignement[^2]. En 1953, elle quitte la Société psychanalytique de Paris avec lui pour fonder la Société française de psychanalyse, tout en gardant son indépendance à l'égard de sa doctrine[^1] ; elle participe ensuite à l'École freudienne de Paris, de 1964 à 1980[^1].\n\nLe grand public la connaît par la radio. À partir de 1977, dans l'émission *Lorsque l'enfant paraît* sur France Inter, elle répond aux lettres de parents[^1]. En 1979, elle participe à la création de la Maison verte, à Paris : un lieu d'accueil pour les enfants de moins de quatre ans, accompagnés de leurs parents[^2].\n\nUne formule lui est souvent attribuée : « l'enfant est une personne ». Elle n'est pas d'elle : c'est le titre d'une série d'émissions de 1984, de Tony Lainé et Daniel Karlin[^2]. Elle soutenait en revanche que l'enfant est un sujet à part entière dès le plus jeune âge[^2].\n\n## Schéma corporel et image du corps\n\n*L'Image inconsciente du corps*, paru en 1984, est son ouvrage théorique le plus important[^1]. Il repose sur une distinction.\n\nLe *schéma corporel* suit la maturation neurologique : il est le même chez tous les enfants d'un âge donné. L'*image du corps*, elle, se construit dans la relation de langage avec la mère ; elle est inconsciente et propre à chacun[^1].\n\nDolto la décompose en trois aspects : une image de base, qui fonde le narcissisme primaire et le sentiment de continuité du corps ; une image fonctionnelle, qui pousse au mouvement et à l'engagement dans le monde ; une image érogène, qui marque certaines parties du corps comme sources de plaisir ou de déplaisir[^1]. Ensemble, elles forment une image dynamique du désir[^1].\n\n> **Illustration (pas un exemple de Dolto).** Deux enfants de trois ans savent marcher, courir, sauter : leur schéma corporel est le même. L'un s'élance vers les autres au square ; l'autre reste collé aux jambes de sa mère, comme si son corps n'était pas tout à fait le sien. Rien de neurologique ne les distingue. Ce qui diffère, dans la perspective de Dolto, c'est la manière dont leur corps a été parlé, accueilli, nommé.\n\nElle s'intéressait pour cette raison aux dessins d'enfants : ils représentent, selon elle, leur propre corps, et la conscience de ce corps structure le sujet[^2].\n\n## Les castrations symboligènes\n\nLe développement de l'enfant passe, pour Dolto, par une série de séparations, qu'elle appelle « castrations symboligènes » : des états infantiles sont symboliquement retirés, puis compensés par la maturation et par le langage[^2]. À la suite des stades décrits par Freud, elle en distingue plusieurs : ombilicale à la naissance, orale avec le sevrage, anale avec l'apprentissage de la propreté, puis la castration œdipienne, par l'intervention du père, qui fonde l'interdit de l'inceste[^1].\n\nLe sevrage, par exemple, ne fait pas disparaître la mère : il change la valeur symbolique de l'objet-mère[^2]. Ce qui était obtenu par la bouche le sera désormais par la parole et l'échange. Tous les désirs sont légitimes, disait-elle, mais tous ne peuvent pas être satisfaits[^1].\n\n> **Illustration (un parallèle avec la vie quotidienne).** Une mère qui reprend le travail explique à son bébé de dix mois, avec des mots simples, qu'elle part le matin et revient le soir. On peut trouver cela absurde : il ne comprend pas. La position de Dolto est qu'il comprend quelque chose, que la séparation dite et nommée devient une épreuve symbolisable, alors que la séparation tue reste un trou.\n\n## Méthode et critiques\n\nDolto préconisait de commencer l'analyse d'enfants dès deux ou trois ans, en parlant leur langage, et elle insistait sur le besoin d'autorité des adultes, contre la permissivité[^1].\n\nSon œuvre a été vivement critiquée. On lui a reproché d'avoir repris l'hypothèse de la « mère réfrigérateur » dans l'autisme et d'avoir culpabilisé des familles ; d'autres la défendent[^2]. Ses affirmations sur la télépathie de certains enfants sont jugées discutables[^2]. Des propos tenus dans un entretien de 1979 sur l'inceste, et sa signature en 1977 d'une pétition demandant la révision du code pénal sur les relations entre adultes et mineurs, ont été mis en cause ; sa fille Catherine Dolto conteste la lecture de ces propos, et plusieurs historiens soutiennent qu'elle n'a pas défendu la pédophilie[^2].","quiz":[{"question":"Qu'est-ce qui distingue l'image inconsciente du corps du schéma corporel ?","choix":["L'image est commune à tous, le schéma propre à chacun","L'image est propre à chacun et se construit dans le langage","L'image ne concerne que les adultes, le schéma les enfants","L'image est consciente, le schéma inconscient et refoulé"],"bonne":1,"explication":"Le schéma corporel suit la maturation neurologique et est le même pour tous ; l'image inconsciente du corps, singulière, se construit dans la relation de langage avec la mère."},{"question":"Que sont les « castrations symboligènes » ?","choix":["Des punitions que les parents doivent infliger à l'enfant","Des séparations qui, une fois parlées, ouvrent l'enfant au symbolique","Des traumatismes qui bloquent définitivement le développement","Des interventions médicales pratiquées à la naissance"],"bonne":1,"explication":"Des états infantiles sont symboliquement retirés (naissance, sevrage, propreté, Œdipe) et compensés par la maturation et le langage : la séparation devient symbolisable."},{"question":"Un père part pour un long voyage sans rien dire à sa fille de deux ans, « parce qu'elle est trop petite pour comprendre ». Que lui objecterait Dolto ?","choix":["Qu'il a raison, puisque l'enfant ne comprend pas les mots","Qu'il aurait dû emmener sa fille avec lui","Qu'il faut parler à l'enfant de ce qu'elle vit, à sa mesure","Qu'il faut lui offrir un cadeau pour compenser l'absence"],"bonne":2,"explication":"Dès sa thèse de 1939, Dolto défend l'idée de parler directement aux enfants de la réalité de ce qu'ils vivent, dans un langage qui leur est accessible."},{"question":"Qui est l'auteur de la formule « l'enfant est une personne » ?","choix":["Françoise Dolto, dans sa thèse de 1939","Tony Lainé et Daniel Karlin, pour une série d'émissions","Jacques Lacan, dans son séminaire sur l'enfant","René Laforgue, son premier analyste"],"bonne":1,"explication":"La formule, souvent attribuée à Dolto, est le titre d'une série d'émissions de 1984 de Tony Lainé et Daniel Karlin."}],"sources":[{"texte":"Encyclopédie Larousse, « Françoise Dolto » (biographie, Trousseau, image inconsciente du corps, schéma corporel, trois images, castrations)","url":"https://www.larousse.fr/encyclopedie/personnage/Françoise_Dolto/116797"},{"texte":"Wikipédia (français), « Françoise Dolto » (formation, thèse, Lacan, Maison verte, castrations symboligènes, formule, critiques)","url":"https://fr.wikipedia.org/wiki/Françoise_Dolto"}]},{"id":"canguilhem-normal-pathologique","discipline":"philosophie","titre":"Le normal et le pathologique","figure":"Georges Canguilhem","branche":"epistemologie","fiabilite":"mixte","fiabilite_note":"Les citations viennent d'extraits du Normal et le pathologique (PUF, coll. Quadrige) reproduits en ligne, sans numéros de page sûrs ; la biographie et la réception, de Wikipédia et d'un article de la revue Contrastes. La formule de Leriche sur le « silence des organes » n'a pas été retrouvée dans les extraits consultés et n'est pas citée.","reference":"Essai sur quelques problèmes concernant le normal et le pathologique (thèse de médecine, 1943) ; Le normal et le pathologique (1966)","accroche":"La maladie n'est-elle qu'un excès ou un défaut par rapport à la santé ? Canguilhem, philosophe devenu médecin, répond non : être malade, c'est vivre autrement, dans un monde rétréci.","punch":"Être sain, ce n'est pas seulement être normal. C'est pouvoir changer de normes.","idee":"Contre l'idée que le pathologique ne diffère du normal que par le degré, Canguilhem soutient que la maladie est une autre manière de vivre, réduite. La santé n'est pas la conformité à une moyenne : c'est la capacité de tolérer les infidélités du milieu et d'instituer des normes nouvelles.","citation":"La maladie n'est pas une variation sur la dimension de la santé ; elle est une nouvelle dimension de la vie.","citation_source":"Canguilhem, Le normal et le pathologique (1966), PUF, coll. Quadrige — extrait reproduit en ligne","citation_url":"https://www.normalesup.org/~sage/Reflexions/Sciences/GCnormalPatho.pdf","liens":["freud-moi-pas-maitre","husserl-epoche","foucault-histoire-de-la-folie"],"texte":"Georges Canguilhem est un philosophe qui a voulu savoir de quoi il parlait. Agrégé de philosophie, il entreprend des études de médecine et soutient sa thèse de médecine en 1943, en pleine guerre ; sous le pseudonyme de « Lafont », il exerce alors comme médecin dans la Résistance, en Auvergne, tout en enseignant depuis 1941 à l'université de Strasbourg, repliée à Clermont-Ferrand[^2]. Sa thèse s'intitule *Essai sur quelques problèmes concernant le normal et le pathologique*. Augmentée, elle devient en 1966 *Le normal et le pathologique*, un texte fondateur pour la philosophie de la médecine[^2].\n\n## La question\n\nQu'est-ce qui distingue un état malade d'un état sain ? La réponse qui dominait au XIXe siècle tenait en une idée simple : le pathologique ne serait qu'une variation quantitative du normal. Trop de sucre dans le sang, ou pas assez ; une fièvre, c'est une température trop haute. La maladie serait la santé, déplacée sur une échelle.\n\nCanguilhem prend position contre cette idée, qu'il rattache à Auguste Comte et à Claude Bernard. Il écrit, de sa propre conception : « On voit combien avec une telle vision de la maladie on se trouve loin de la conception de Comte ou de Cl. Bernard »[^1].\n\n## Une autre manière de vivre\n\nPour lui, la maladie n'est pas un écart sur une ligne, c'est un changement de plan. « La maladie n'est pas une variation sur la dimension de la santé ; elle est une nouvelle dimension de la vie »[^1].\n\nLe malade ne vit pas « moins bien » sur la même échelle : il vit selon d'autres règles. La maladie reste d'ailleurs, écrit Canguilhem, « une sorte de norme biologique »[^1]. Mais c'est une norme plus étroite. « L'état pathologique traduit la réduction des normes de vie tolérées par le vivant »[^1].\n\n> **Illustration (pas un cas de Canguilhem).** Après un infarctus, un homme reprend une vie presque ordinaire. Ses analyses sont « dans les normes ». Mais il ne peut plus monter un étage en courant, ni supporter un été caniculaire, ni enchaîner deux nuits blanches. Ce qui a changé n'est pas d'abord un chiffre : c'est l'éventail des situations qu'il peut affronter. Son monde s'est rétréci. C'est cela, au sens de Canguilhem, être malade.\n\n## La santé comme marge\n\nSi la maladie est un rétrécissement, la santé n'est pas une simple conformité à la moyenne. Elle est une marge. « La santé c'est une marge de tolérance des infidélités du milieu »[^1]. Le milieu change, il est infidèle : il fait froid, on manque de sommeil, on attrape un virus. L'être en bonne santé encaisse ces variations, et il fait pl
