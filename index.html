us : il s'y adapte en créant d'autres manières de vivre.\n\nD'où la formule centrale : « Ce qui caractérise la santé c'est la possibilité de tolérer des infractions à la norme habituelle et d'instituer des normes nouvelles dans des situations nouvelles »[^1]. Être sain, ajoute-t-il, « c'est non seulement être normal dans une situation donnée, mais être aussi normatif »[^1]. À l'inverse, « le malade est malade pour ne pouvoir admettre qu'une norme »[^1].\n\n## Normal et normatif\n\nLe mot *normatif* est la clé. Le vivant n'est pas seulement soumis à des normes : il en produit. Cette « normativité vitale », attachée au vécu et à la souffrance humaine, fonde chez Canguilhem la distinction entre santé et maladie[^3]. Elle déplace le regard : le critère de la santé n'est pas d'abord le chiffre que lit le médecin, c'est la capacité du vivant à faire face, à sa manière, à ce qui lui arrive.\n\n> **Illustration (un parallèle avec la clinique psychique).** Une patiente dit : « Je vais bien tant que rien ne change. » Ses journées sont réglées à l'identique, et le moindre imprévu la jette dans l'angoisse. Elle n'a aucun symptôme spectaculaire. Dans les termes de Canguilhem, on dirait pourtant que sa marge est mince : elle ne supporte qu'une norme. La question clinique n'est pas de la ramener à une moyenne, mais d'élargir ce qu'elle peut affronter.\n\n## Une postérité\n\nCanguilhem succède à Gaston Bachelard à la tête de l'Institut d'histoire des sciences, qu'il dirige jusqu'en 1971[^2]. Il est le parrain de la thèse de Michel Foucault sur l'histoire de la folie, et Foucault écrira l'introduction de la traduction anglaise du *Normal et le pathologique*[^2]. Les deux hommes ne pensent pourtant pas la norme de la même manière : là où Canguilhem fonde la normalité sur le vécu et le biologique, Foucault accorde plus de poids aux dispositifs politiques de normalisation sociale[^3].","quiz":[{"question":"Quelle conception Canguilhem critique-t-il ?","choix":["L'idée que le pathologique n'est qu'une variation quantitative du normal","L'idée que la maladie a toujours une cause psychique","L'idée que la médecine doit s'appuyer sur la physiologie","L'idée que le malade souffre réellement"],"bonne":0,"explication":"Il s'oppose à la conception, rattachée à Comte et à Claude Bernard, d'une maladie qui ne serait que la santé déplacée sur une échelle. Pour lui, elle est « une nouvelle dimension de la vie »."},{"question":"Comment Canguilhem définit-il la santé ?","choix":["Comme la conformité exacte à la moyenne statistique","Comme l'absence totale de douleur et de symptôme","Comme le pouvoir d'instituer des normes nouvelles face au milieu","Comme un état que seul le médecin peut constater et mesurer"],"bonne":2,"explication":"La santé est « une marge de tolérance des infidélités du milieu » : être sain, c'est être « normatif », capable de créer d'autres normes dans des situations nouvelles."},{"question":"Un homme, après une maladie, a des analyses « normales » mais ne supporte plus le moindre effort imprévu. Que dirait Canguilhem ?","choix":["Qu'il est en parfaite santé, puisque ses chiffres sont normaux","Que ses normes de vie se sont réduites : sa marge a rétréci","Qu'il simule, puisque rien ne se voit aux examens","Que sa maladie est uniquement psychique"],"bonne":1,"explication":"« L'état pathologique traduit la réduction des normes de vie tolérées par le vivant. » Le critère n'est pas seulement le chiffre, mais l'éventail des situations que le vivant peut affronter."},{"question":"Que veut dire « normatif » chez Canguilhem ?","choix":["Conforme à la loi et aux règlements en vigueur","Soumis aux normes fixées par la société","Capable de produire ses propres normes de vie","Mesurable par des instruments médicaux précis"],"bonne":2,"explication":"Le vivant n'est pas seulement soumis à des normes, il en institue : être sain, c'est « être aussi normatif ». La maladie, elle, réduit cette capacité à une seule norme."}],"sources":[{"texte":"Canguilhem, Le normal et le pathologique (1966), extraits (PUF, coll. Quadrige)","url":"https://www.normalesup.org/~sage/Reflexions/Sciences/GCnormalPatho.pdf"},{"texte":"Wikipédia (anglais), « Georges Canguilhem » (thèse de 1943, Résistance, Institut d'histoire des sciences, Foucault)","url":"https://en.wikipedia.org/wiki/Georges_Canguilhem"},{"texte":"« The silence of organs. Disagreements between health and normality according to G. Canguilhem and M. Foucault », Contrastes, vol. 19, n° 1","url":"https://revistas.uma.es/index.php/contrastes/en/article/view/1072"}]},{"id":"hegel-kojeve-lacan","discipline":"croisement","titre":"De Hegel à Lacan, le désir de reconnaissance","figure":"Hegel, Kojève, Lacan","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"La filiation est reconstituée à partir de l'Encyclopédie de Stanford, d'un article des Études philosophiques et d'une communication de colloque qui citent Kojève et les Écrits ; les séminaires de Kojève et les textes de Lacan n'ont pas été consultés directement.","reference":"Hegel, Phénoménologie de l'esprit (1807) ; Kojève, Introduction à la lecture de Hegel (1947) ; Lacan, Écrits (1966)","accroche":"Une page de Hegel, lue dans un séminaire parisien des années 1930, finit par donner sa formule centrale à la psychanalyse lacanienne. Histoire d'une transmission.","punch":"Désirer, c'est d'abord vouloir être reconnu par un autre qui désire.","idee":"Kojève lit le maître et l'esclave comme une anthropologie : le désir humain est désir d'un autre désir. Lacan, son auditeur, en tire « le désir de l'homme est le désir de l'Autre », puis transforme la formule : l'Autre devient le lieu du langage, et le désir l'écart que creuse la demande.","repere":"Le séminaire d'Alexandre Kojève sur la Phénoménologie de l'esprit se tient à l'École pratique des hautes études de 1933 à 1939. Raymond Queneau en publie les notes en 1947 sous le titre Introduction à la lecture de Hegel. Lacan fait partie des auditeurs.","liens":["hegel-maitre-esclave","lacan-desir-de-l-autre","lacan-stade-du-miroir"],"texte":"Certaines idées voyagent par les livres. Celle-ci a d'abord voyagé par une salle de cours. De 1933 à 1939, à l'École pratique des hautes études, Alexandre Kojève commente la *Phénoménologie de l'esprit* de Hegel devant un auditoire qui deviendra célèbre : Raymond Queneau, Georges Bataille, Raymond Aron, Maurice Merleau-Ponty, Jacques Lacan[^4]. Comme Kojève, Lacan exercera d'ailleurs son influence d'abord par un enseignement oral[^1].\n\nCette fiche suit une seule ligne dans cette histoire : comment une page de Hegel sur la reconnaissance devient, chez Lacan, une théorie du désir.\n\n## Premier temps : Hegel\n\nLa section de la *Phénoménologie* sur le maître et l'esclave part d'une thèse : la conscience de soi n'existe qu'en étant reconnue par une autre. Deux consciences qui veulent chacune être reconnues s'affrontent ; l'une recule devant la mort et devient l'esclave ; mais la reconnaissance que le maître obtient est « unilatérale et inégale », et c'est l'esclave, par la peur et le travail, qui se forme (voir la fiche sur Hegel).\n\nLe texte est dense, et Hegel l'insère dans un parcours beaucoup plus vaste, celui de l'esprit tout entier. Rien n'obligeait à en faire le centre du livre.\n\n## Deuxième temps : Kojève\n\nKojève, justement, en fait le centre. Il se concentre sur cette dialectique et y voit « l'acte anthropogène à l'origine de l'histoire », c'est-à-dire l'acte par lequel l'animal devient homme, sous la forme d'une « lutte de pur prestige pour la reconnaissance »[^2]. Sa lecture est une anthropologie : elle décrit le passage du désir animal au désir humain[^3].\n\nLe désir animal porte sur des choses : manger, boire, posséder. Le désir humain, lui, porte sur un autre désir. Kojève le formule ainsi : le désir humain est un « désir d'un autre désir »[^3]. Ce qu'on veut, au fond, c'est être désiré, reconnu par un autre qui désire lui aussi.\n\nCe n'est pas la seule manière de lire Hegel en France : Jean Hyppolite, son traducteur, puis Bernard Bourgeois ont emprunté d'autres voies[^2]. Mais c'est la lecture de Kojève qui atteint les auditeurs de 1933.\n\n> **Illustration (pas un exemple de Kojève).** Deux collègues se disputent un bureau près de la fenêtre. Aucun des deux ne tenait vraiment à la vue ; mais une fois l'autre intéressé, céder devient impossible. L'objet compte moins que ce qu'il signifie : avoir été préféré, l'avoir emporté devant l'autre. C'est le désir d'un autre désir, à l'échelle d'un bureau.\n\n## Troisième temps : Lacan reprend\n\nLacan retient la leçon. Il en tire un slogan qu'on a pu dire « hégélo-kojévien » : « le désir de l'homme est le désir de l'Autre »[^1]. On y entend encore Kojève : désirer, c'est désirer le désir d'un autre, être reconnu par lui.\n\nLes premiers textes de Lacan portent cette marque. Le moi, chez lui, « cristallise » le désir de l'Autre, et se forme dans un rapport à des alter ego, partenaires imaginaires dont il est inséparable[^1]. On comprend qu'il ait consacré un texte, en 1948, à l'agressivité en psychanalyse[^1] : quand chacun veut être reconnu par l'autre, la rivalité n'est jamais loin.\n\n## Quatrième temps : Lacan transforme\n\nMais Lacan ne s'arrête pas à Kojève. Deux déplacements séparent sa formule de celle de son maître.\n\n**L'Autre devient un lieu.** La majuscule n'est pas décorative. Le « grand Autre », chez Lacan, désigne l'ordre symbolique, le langage et ses lois, qu'on a rapproché de ce que Hegel appelait l'« esprit objectif »[^1]. Désirer depuis l'Autre, ce n'est plus seulement vouloir être reconnu par une personne ; c'est désirer dans une langue et à partir de significations qu'on n'a pas inventées (voir la fiche sur le désir de l'Autre).\n\n**Le désir se loge dans la demande.** Lacan distingue le besoin, la demande et le désir. La demande s'adresse à quelqu'un ; elle est, écrit-il, « intransitive, elle n'emporte aucun objet » (*Écrits*, p. 617)[^3]. Et le désir est « ce qui se manifeste dans l'intervalle que creuse la demande en-deçà d'elle-même » (*Écrits*, p. 627)[^3]. La reconnaissance de Kojève devient une demande d'amour qu'aucun objet ne comble.\n\nLe mouvement de ce désir, sans fin, a même été comparé au « mauvais infini » de Hegel[^1] : une poursuite qui recommence toujours, sans jamais se clore.\n\n> **Illustration (un parallèle clinique).** Une patiente obtient enfin le compliment qu'elle attendait de son père, et s'étonne de n'en éprouver aucun soulagement durable. Kojève dirait : elle voulait être reconnue. Lacan ajouterait : ce qu'elle demandait débordait tout ce qu'une phrase pouvait donner. La reconnaissance obtenue laisse intact l'écart où se loge le désir.\n\n## Ce que la filiation éclaire\n\nLire Lacan à partir de Hegel et de Kojève a deux intérêts. D'abord, cela rend moins mystérieuses des formules qui semblent sorties de nulle part : elles prolongent une discussion philosophique précise. Ensuite, cela montre ce que la psychanalyse ajoute à la philosophie : un désir qui ne cherche pas seulement la reconnaissance d'un autre, mais qui se constitue dans le langage, et qui ne trouve jamais l'objet qui le comblerait.","quiz":[{"question":"Comment Kojève lit-il la dialectique du maître et de l'esclave ?","choix":["Comme une anthropologie : le désir humain est désir d'un autre désir","Comme une description de l'esclavage dans l'Antiquité grecque","Comme une théorie économique du travail salarié moderne","Comme une allégorie religieuse de la chute et du salut"],"bonne":0,"explication":"Kojève en fait l'acte anthropogène qui fait de l'animal un homme : le désir humain porte sur le désir d'un autre, sur la reconnaissance. Ce n'est ni une histoire de l'esclavage, ni une économie, ni une allégorie religieuse."},{"question":"Que devient l'« Autre » quand Lacan reprend la formule de Kojève ?","choix":["Une personne précise, le plus souvent la mère","Un adversaire dans une lutte à mort pour le prestige","Un lieu : l'ordre symbolique, le langage et ses lois","Une illusion qu'il faut dissiper par l'analyse"],"bonne":2,"explication":"Le « grand Autre » désigne l'ordre symbolique, rapproché de l'esprit objectif hégélien. Des personnes peuvent l'incarner, mais il n'est pas une personne."},{"question":"Un adolescent ne veut une marque de baskets que depuis qu'un camarade admiré la porte. Laquelle de ces lectures est la plus kojévienne ?","choix":["Il a besoin de chaussures, et celles-ci sont les plus confortables","Il désire le désir de l'autre : être reconnu par celui qu'il admire","Il exprime une demande d'amour adressée à ses parents","Il obéit à une simple mode commerciale, sans enjeu psychique"],"bonne":1,"explication":"Chez Kojève, le désir humain porte sur un autre désir : l'objet vaut par la reconnaissance qu'il promet. La « demande d'amour » relève, elle, de la reprise lacanienne."},{"question":"Pourquoi Lacan dit-il que la demande est « intransitive » ?","choix":["Parce qu'elle ne s'adresse à personne","Parce qu'au-delà de l'objet demandé, elle n'en vise aucun en particulier","Parce qu'elle porte toujours sur un besoin biologique précis","Parce qu'elle se confond avec le désir lui-même"],"bonne":1,"explication":"La demande s'adresse à quelqu'un mais « n'emporte aucun objet » : ce qu'elle vise, au fond, c'est la présence et la réponse de l'autre. Le désir naît de l'écart qu'elle creuse."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (Kojève, slogan hégélo-kojévien, grand Autre et esprit objectif, mauvais infini)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"Wilma Pilati, « Kojève, Hyppolite et Bourgeois. Trois voies de l'hégélianisme », Les Études philosophiques, 2022/1, p. 89-104","url":"https://shs.cairn.info/article/LEPH_221_0089/pdf?lang=fr"},{"texte":"Christophe Laudou, « La demande de reconnaissance de Lacan à Hegel », colloque d'Évian, 2004 (Kojève ; Écrits, p. 617 et 627), L'Harmattan","url":"https://www.editions-harmattan.fr/media/107060/download/La%20demande%20de%20reconnaissance%20de%20Lacan%20%C3%A0%20Hegel.pdf"},{"texte":"Wikipédia, « Alexandre Kojève » (séminaire de 1933 à 1939, auditeurs)","url":"https://fr.wikipedia.org/wiki/Alexandre_Koj%C3%A8ve"}]},{"id":"beauvoir-deuxieme-sexe","discipline":"philosophie","titre":"On ne naît pas femme","figure":"Simone de Beauvoir","branche":"politique","fiabilite":"secondaire","fiabilite_note":"Le Deuxième Sexe est présenté d'après l'Encyclopédie de Stanford, qui le cite avec la pagination des éditions française et anglaises, et d'après Wikipédia pour la réception ; le livre n'a pas été consulté directement.","reference":"Le Deuxième Sexe (Gallimard, 1949), t. I « Les faits et les mythes », t. II « L'expérience vécue »","accroche":"La phrase la plus célèbre du Deuxième Sexe ne dit pas que le corps n'existe pas. Elle dit qu'une femme est une histoire, pas une essence.","punch":"On ne naît pas femme : on le devient.","idee":"Beauvoir montre que l'homme s'est posé comme le sujet et la norme, et la femme comme l'Autre. Ce qu'on appelle féminité n'est pas une essence mais une situation, entretenue par le mythe de l'éternel féminin, qui enferme les femmes dans l'immanence et leur refuse la transcendance.","citation":"On ne naît pas femme : on le devient.","citation_source":"Simone de Beauvoir, Le Deuxième Sexe (1949), t. II, p. 13 de l'édition originale, cité par l'Encyclopédie de Stanford","citation_url":"https://plato.stanford.edu/entries/beauvoir/","liens":["sartre-mauvaise-foi","hegel-maitre-esclave","rousseau-forcer-a-etre-libre"],"texte":"*Le Deuxième Sexe* paraît chez Gallimard en 1949, en deux volumes : *Les faits et les mythes* et *L'expérience vécue*. Beauvoir l'a écrit en quatorze mois environ[^2]. La première édition se vend à quelque 22 000 exemplaires en une semaine ; le livre sera traduit en quarante langues[^2].\n\n## La femme comme l'Autre\n\nLa thèse de départ tient en une phrase : la femme est l'Autre, l'homme est l'être essentiel[^1]. L'humanité s'est pensée au masculin : l'homme définit la femme non en elle-même, mais par rapport à lui[^2].\n\nLe vocabulaire vient de la philosophie de l'époque. Dans la tradition hégélienne, une conscience se pose comme sujet en posant l'autre comme objet (voir la fiche sur Hegel). Beauvoir constate que cette relation, qui devrait être réciproque, s'est figée : l'homme est sujet, la femme est l'Autre, et elle ne revendique pas le statut de sujet parce qu'elle manque des moyens concrets de le faire[^1].\n\n## On le devient\n\nD'où la phrase la plus célèbre du livre : « On ne naît pas femme : on le devient »[^1]. Elle ne nie pas le corps : chez Beauvoir, le corps est une situation, et il ne s'agit pas simplement d'un sujet qui « a » un corps[^1]. Elle dit que ce que la société appelle « femme » se construit : par l'éducation, les attentes, les rôles, les récits.\n\nLa phrase a été lue de bien des manières. Judith Butler y a vu une distinction entre le sexe et le genre ; Toril Moi et Nancy Bauer contestent cette lecture[^2].\n\n> **Illustration (pas un exemple de Beauvoir).** Deux enfants de quatre ans grimpent aux arbres. À la fille, on dit : « Attention, tu vas te faire mal. » Au garçon : « Bravo, tu es courageux. » Rien de grave, chaque fois. Mais répétées des milliers de fois, ces phrases enseignent à l'une la prudence et à l'autre l'audace. Personne n'est « né » ainsi : chacun l'est devenu.\n\n## Immanence et transcendance\n\nBeauvoir emprunte à l'existentialisme un autre couple de notions. La *transcendance* est le mouvement par lequel un sujet se projette, invente, agit sur le monde. L'*immanence* est le fait d'être maintenu dans la répétition, l'entretien de ce qui est. Les femmes, écrit-elle, sont ancrées dans le domaine de l'immanence et contraintes de renoncer à leur prétention à la transcendance[^1].\n\nLe mécanisme qui les y maintient est un mythe : celui de l'« éternel féminin », un mythe maître qui piège les femmes dans un idéal inaccessible. La conclusion du livre demande qu'il soit démantelé : les conquêtes économiques et politiques ne suffiront pas tant que ce mythe tiendra[^1]. L'égalité des droits est nécessaire, mais une femme qui a le droit de vote et un salaire peut encore se juger, et être jugée, à l'aune d'un idéal qui lui demande d'être tout pour les autres et rien pour elle-même.\n\n## Liberté et mauvaise foi\n\nL'éthique de Beauvoir, exposée en 1947 dans *Pour une morale de l'ambiguïté*, éclaire cette analyse : choisir de rester un enfant est un acte de mauvaise foi[^1]. Mais *Le Deuxième Sexe* ne fait pas porter toute la faute sur les individus. Il décrit une situation : des femmes qui ne revendiquent pas leur liberté parce que les moyens concrets leur manquent. Beauvoir jugera d'ailleurs plus tard que son essai de 1947 avait eu tort de penser la morale indépendamment du contexte social[^1].\n\n> **Illustration (un parallèle avec la clinique).** Une patiente dit qu'elle « n'est pas faite » pour les postes à responsabilité. On peut entendre la phrase comme un trait de caractère. On peut aussi demander d'où elle vient : qui l'a dite le premier, à quel âge, à propos de quoi. La démarche de Beauvoir invite à chercher l'histoire derrière ce qui se présente comme une nature.\n\n## Réception\n\nLe livre fait scandale. Il est d'abord reçu comme un affront à la décence sexuelle plutôt que comme une critique politique du patriarcat[^1]. Le Vatican le met à l'Index, où il reste jusqu'à la suppression de l'Index en 1966 ; l'Espagne franquiste l'interdit en 1955[^2]. Que le livre ait choqué par ce qu'il disait du corps et de la sexualité plutôt que par sa critique politique dit assez à quel point cette critique semblait alors impensable.\n\nIl devient ensuite un texte fondateur de la philosophie féministe et une inspiration pour la deuxième vague du féminisme ; Betty Friedan s'en inspire pour *La Femme mystifiée* (1963)[^2]. La première traduction anglaise, par H. M. Parshley en 1953, omettait environ quinze pour cent du texte[^1] ; une traduction complète paraît en 2009[^2]. Beauvoir elle-même n'était pas considérée comme une philosophe à sa mort, en 1986 ; les études qui lui sont consacrées se sont depuis multipliées[^1].","quiz":[{"question":"Que signifie « on ne naît pas femme : on le devient » ?","choix":["Que le corps féminin n'a aucune réalité biologique","Que la « femme » au sens social se construit par l'histoire et la situation","Que les femmes deviennent adultes plus tard que les hommes","Qu'une femme peut choisir librement, chaque jour, de l'être ou non"],"bonne":1,"explication":"Beauvoir ne nie pas le corps, qui est une situation ; elle montre que ce qu'on appelle « femme » se construit par l'éducation, les rôles et les mythes."},{"question":"Quelle place la femme occupe-t-elle, selon Beauvoir ?","choix":["Celle de l'Autre, quand l'homme se pose en sujet et en norme","Celle du sujet universel, dont l'homme dépend","Celle d'un égal parfait dans toutes les sociétés","Celle d'un être sans rapport avec l'homme"],"bonne":0,"explication":"« La femme est l'Autre, l'homme est l'être essentiel » : l'homme se définit comme la norme et définit la femme par rapport à lui."},{"question":"Une collègue répète qu'elle « n'est pas faite » pour diriger, sans jamais l'avoir essayé. Quelle lecture beauvoirienne est la plus juste ?","choix":["C'est un trait de nature qu'il faut respecter","C'est peut-être une situation intériorisée, qui se présente comme une nature","C'est forcément de la mauvaise foi, dont elle est seule responsable","C'est un choix libre, sans rapport avec son histoire"],"bonne":1,"explication":"Beauvoir invite à chercher la situation derrière ce qui se donne pour une essence. Elle ne réduit pas pour autant tout à la faute individuelle : les moyens concrets de la liberté peuvent manquer."},{"question":"Qu'est-ce que le mythe de l'« éternel féminin » ?","choix":["Une légende antique sur la création de la femme","Un idéal inaccessible qui enferme les femmes","La reconnaissance d'une supériorité naturelle des femmes","Un concept que Beauvoir défend contre ses critiques"],"bonne":1,"explication":"C'est un « mythe maître » qui piège les femmes dans un idéal inaccessible et les maintient dans l'immanence ; Beauvoir demande qu'il soit démantelé."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Simone de Beauvoir » (§ 5, 7 et 14 : l'Autre, situation, immanence, éternel féminin, réception)","url":"https://plato.stanford.edu/entries/beauvoir/"},{"texte":"Wikipédia (anglais), « The Second Sex » (publication, ventes, lectures de la formule, Index, traductions, influence)","url":"https://en.wikipedia.org/wiki/The_Second_Sex"}]},{"id":"merleau-ponty-corps-propre","discipline":"philosophie","titre":"Le corps propre","figure":"Maurice Merleau-Ponty","branche":"epistemologie","fiabilite":"secondaire","fiabilite_note":"La Phénoménologie de la perception est présentée d'après l'Encyclopédie de Stanford, qui la cite en anglais avec la pagination française, et d'après Wikipédia ; le livre n'a pas été consulté directement. Les exemples célèbres de l'organiste ou de l'aveugle et sa canne ne sont pas repris, faute de les avoir vérifiés.","reference":"Phénoménologie de la perception (Gallimard, 1945), Ire partie « Le corps »","accroche":"On dit « j'ai un corps », comme on dirait « j'ai une voiture ». Merleau-Ponty montre qu'on ne l'a pas : on l'est, et c'est par lui qu'il y a un monde.","punch":"Le corps n'est pas une chose que j'ai. C'est ma manière d'être au monde.","idee":"Contre le dualisme du corps et de l'esprit, Merleau-Ponty décrit le corps vécu comme un « être-au-monde », ni pur objet ni pur sujet. Son rapport à l'espace est un « je peux » plutôt qu'un « je pense », et les cas pathologiques, comme celui du patient Schneider, en révèlent la structure.","repere":"La Phénoménologie de la perception paraît chez Gallimard en 1945. Elle soutient la « primauté de la perception » et a fait de Merleau-Ponty le philosophe du corps par excellence.","liens":["husserl-epoche","descartes-malin-genie","lacan-stade-du-miroir"],"texte":"La *Phénoménologie de la perception* paraît en 1945. Merleau-Ponty y défend la primauté de la perception : notre capacité de réfléchir repose sur un fond qui n'est pas lui-même réflexif, et le corps tient une place centrale dans ce fond[^2]. Le livre remet en cause le dualisme cartésien de l'âme et du corps[^2], et il a fait de son auteur le philosophe du corps par excellence[^2].\n\n## Ni chose ni esprit\n\nDescartes distinguait deux substances : la pensée, qui se connaît elle-même, et l'étendue, dont fait partie le corps. Le corps était une machine que l'esprit habitait. Merleau-Ponty conteste ce partage. Le corps n'est pas un objet parmi d'autres, qu'on observerait du dehors ; il n'est pas non plus une conscience pure. Il occupe une position intermédiaire, un « troisième genre d'être entre le pur sujet et l'objet »[^1].\n\nD'où une formule frappante : notre propre corps est dans le monde comme le cœur est dans l'organisme[^1]. Il n'est pas posé dans le monde comme un meuble dans une pièce ; il le fait vivre, et en vit.\n\n> **Illustration (pas un exemple de Merleau-Ponty).** Vous cherchez à tâtons l'interrupteur dans votre propre chambre, dans le noir. Vous ne calculez pas sa position dans l'espace, vous ne consultez aucune carte mentale. Votre main « sait » où aller. Ce savoir n'est ni une pensée ni un réflexe mécanique : c'est le corps qui habite un lieu. Dans une chambre d'hôtel, le même geste échoue.\n\n## Être au monde\n\nLe corps a une manière d'exister propre : un « être-au-monde », une orientation préobjective vers une situation vitale[^1]. Avant de penser le monde, on y est engagé par le corps : on s'oriente, on saisit, on se déplace.\n\nMerleau-Ponty reprend la notion de *schéma corporel* : un système préconscient de mouvements et d'équivalences spatiales, qui est à l'origine du sentiment kinesthésique de notre corps[^1]. Il distingue aussi une spatialité de *situation*, propre au corps, de la spatialité de *position* des choses[^1]. Mon bras n'est pas « à côté » de mon épaule comme une tasse est à côté d'une assiette : il est situé par rapport à ce que je fais.\n\nLe rapport du corps à l'espace est intentionnel, mais sur le mode d'un « je peux » plutôt que d'un « je pense »[^1]. Le monde se présente d'abord comme un ensemble de prises possibles.\n\n## L'habitude\n\nLe corps garde la trace de ce qu'il a fait. Merleau-Ponty parle d'un corps habituel : les sédimentations d'activités passées, qui ont un caractère général, anonyme et autonome[^1]. Une habitude n'est ni un souvenir qu'on rappellerait ni un automatisme sans sens : c'est un savoir qui est dans les mains, dans la posture, dans le pas.\n\n> **Illustration.** Une pianiste qui n'a pas joué depuis dix ans pose les mains sur le clavier et retrouve un morceau qu'elle serait incapable de réciter note par note. La mémoire n'est pas dans sa tête comme une liste ; elle est dans ses doigts, comme une manière d'aller vers le clavier.\n\n## Ce que révèle la pathologie\n\nPour décrire le corps normal, Merleau-Ponty s'appuie sur des cas où il se dérègle. Le membre fantôme, ce bras amputé que le patient continue de sentir, lui sert de contraste[^1]. Mais le cas le plus étudié est celui de Schneider, un patient atteint d'une lésion cérébrale, examiné par les psychologues Adhémar Gelb et Kurt Goldstein[^1].\n\nSchneider peut accomplir des gestes concrets, ceux qu'exige une situation réelle. Mais il ne parvient pas à se « projeter » dans un espace virtuel, à faire un geste « pour rien », sur demande ; ce qui est atteint chez lui, c'est l'« arc intentionnel » qui relie le corps à ses possibles[^1]. Le cas montre que la motricité normale n'est pas une simple mécanique : elle suppose une ouverture du corps vers ce qui n'est pas encore donné.\n\n> **Illustration (un parallèle avec la clinique).** Certains patients, après un choc, disent qu'ils « ne se sentent plus dans leur corps » : les gestes se font, mais comme de loin. Ce n'est pas un trouble moteur, et ce n'est pas seulement une idée. C'est l'être-au-monde du corps qui s'est défait. La description de Merleau-Ponty donne des mots pour entendre ce genre de plainte.\n\n## Ni idéalisme ni mécanisme\n\nLa position de Merleau-Ponty refuse deux facilités. Elle refuse le mécanisme, qui ferait du corps une machine causale. Elle refuse aussi l'idéalisme, qui ferait du monde une construction de l'esprit. Le corps est le lieu où les deux se nouent : un sujet incarné, toujours déjà engagé dans un monde qu'il n'a pas constitué. On comprend que l'ouvrage, grand texte de l'existentialisme français, ait aussi trouvé un public chez des philosophes de tradition analytique[^2].","quiz":[{"question":"Comment Merleau-Ponty décrit-il le corps ?","choix":["Comme une machine que l'esprit pilote de l'extérieur","Comme un « troisième genre d'être » entre le pur sujet et l'objet","Comme une illusion produite par la conscience","Comme un simple objet parmi les autres choses du monde"],"bonne":1,"explication":"Le corps n'est ni une chose ni une conscience pure : il est un « être-au-monde », un troisième genre d'être entre sujet et objet, contre le dualisme cartésien."},{"question":"Quel est, pour Merleau-Ponty, le rapport premier du corps à l'espace ?","choix":["Un « je pense » qui calcule les positions","Un « je peux » : le monde s'offre comme des prises possibles","Une simple réaction mécanique aux stimulations","Une représentation géométrique abstraite"],"bonne":1,"explication":"Le rapport du corps à l'espace est intentionnel sur le mode du « je peux », plutôt que du « je pense ». La spatialité du corps est de situation, non de position."},{"question":"Un homme sait taper un code à la porte de son immeuble sans pouvoir le réciter. Quelle notion de Merleau-Ponty éclaire cela ?","choix":["Le membre fantôme","La primauté de la réflexion sur la perception","Le corps habituel, où le savoir est sédimenté dans le geste","Le dualisme de l'âme et du corps"],"bonne":2,"explication":"Le corps habituel garde les sédimentations d'activités passées : un savoir général et anonyme, logé dans le geste plutôt que dans une représentation."},{"question":"Que montre le cas de Schneider ?","choix":["Qu'une lésion peut défaire l'arc qui ouvre le corps au possible","Que la motricité n'est qu'une affaire de muscles","Que le corps fonctionne sans aucun rapport au monde extérieur","Que les patients cérébrolésés n'ont aucune motricité"],"bonne":0,"explication":"Schneider accomplit les gestes concrets mais ne peut se projeter dans un espace virtuel : son « arc intentionnel » est atteint. La motricité normale suppose cette ouverture."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Maurice Merleau-Ponty », § 3 (être-au-monde, schéma corporel, « je peux », corps habituel, Schneider)","url":"https://plato.stanford.edu/entries/merleau-ponty/"},{"texte":"Wikipédia (anglais), « Phenomenology of Perception » (1945, primauté de la perception, critique du dualisme, réception)","url":"https://en.wikipedia.org/wiki/Phenomenology_of_Perception"}]},{"id":"banquet-freud-lacan","discipline":"croisement","titre":"Le Banquet sur le divan","figure":"Platon, Freud, Lacan","branche":"dialogues","fiabilite":"mixte","fiabilite_note":"Le Banquet est cité dans la traduction anglaise de Benjamin Jowett et le passage de Freud dans celle de C. J. M. Hubback (1922), toutes deux dans le domaine public ; la lecture de Lacan, d'après une encyclopédie lacanienne en ligne qui cite le Séminaire VIII.","reference":"Platon, Le Banquet (vers 385 av. J.-C.) ; Freud, Au-delà du principe de plaisir, chap. VI (1920) ; Lacan, Le Séminaire, livre VIII, Le transfert (1960-1961)","accroche":"Un dialogue de Platon sur l'amour revient deux fois dans l'histoire de la psychanalyse : chez Freud, qui y cherche l'origine des pulsions, et chez Lacan, qui y lit le transfert.","punch":"Aimer, c'est donner ce qu'on n'a pas.","idee":"Freud reprend le mythe d'Aristophane, des êtres coupés en deux qui veulent se réunir, pour imaginer des pulsions qui cherchent à rétablir un état antérieur. Lacan lit la fin du dialogue, où Alcibiade prête à Socrate un trésor caché, comme le modèle de l'amour de transfert.","repere":"Dans le Banquet, plusieurs convives font tour à tour l'éloge de l'Amour. Aristophane raconte le mythe des êtres doubles ; Socrate rapporte l'enseignement de Diotime, pour qui l'Amour est fils de Poros (l'Expédient, l'Abondance) et de Pénia (la Pauvreté) ; Alcibiade, ivre, arrive à la fin et fait l'éloge de Socrate.","liens":["platon-reminiscence","freud-transfert","lacan-desir-de-l-autre"],"texte":"Le *Banquet* est un dialogue sur l'amour. Autour d'une table, plusieurs convives prononcent tour à tour un éloge d'Éros. Peu de textes philosophiques ont autant intéressé la psychanalyse : Freud y revient en 1920, Lacan lui consacre une grande partie d'une année de séminaire, en 1960-1961. Chacun y prend un passage différent.\n\n## Le mythe d'Aristophane\n\nLe poète comique Aristophane raconte une fable. Autrefois, la nature humaine était tout autre qu'aujourd'hui. Il y avait trois sexes, et non deux ; les êtres humains étaient doubles. Zeus, pour les affaiblir, les coupa en deux. Depuis, chaque moitié cherche l'autre, et voudrait de nouveau ne faire qu'un[^2][^1]. Aristophane en tire une définition : le désir du tout, la poursuite du tout, voilà ce qu'on appelle l'amour[^1].\n\n## Freud : une pulsion qui veut revenir en arrière\n\nEn 1920, dans *Au-delà du principe de plaisir*, Freud cherche l'origine des pulsions. Il a posé l'hypothèse qu'une pulsion tend à rétablir un état antérieur. Il lui manque une explication de la pulsion sexuelle qui aille dans ce sens. Il la trouve chez Platon.\n\nAu chapitre VI, Freud cite longuement le mythe d'Aristophane : des êtres doubles, coupés en deux par Zeus, et chez chacun le désir de sa moitié, le désir de se réunir de nouveau[^2]. Ce mythe, note-t-il, fait dériver une pulsion de la nécessité de rétablir une situation antérieure[^2]. Freud prend soin de dire qu'il s'agit d'un mythe et non d'une explication scientifique ; mais il remplit la condition qu'il cherchait.\n\n> **Illustration (pas un exemple de Freud).** On dit de deux personnes qui se rencontrent qu'elles ont l'impression de « s'être toujours connues ». Le mythe d'Aristophane donne à ce sentiment une forme saisissante : l'amour comme retrouvailles avec ce qu'on aurait perdu. Freud en retient une structure : un désir tourné vers un état antérieur, plutôt que vers la nouveauté.\n\n## Diotime : l'amour comme manque\n\nSocrate, lui, rapporte l'enseignement d'une étrangère, Diotime. L'Amour n'est pas un dieu comblé : il est fils de l'Abondance et de la Pauvreté[^1]. Il manque toujours de ce qu'il désire, car nul ne désire ce qu'il est ou ce qu'il a déjà[^1].\n\nLacan retiendra cette idée de l'amour comme manque, et la formule qu'il en tire est devenue célèbre : en amour, on donne ce qu'on n'a pas[^3].\n\n## Lacan : Alcibiade et le trésor caché\n\nLe passage que Lacan lit de plus près est la fin du dialogue. Alcibiade, ivre, arrive au banquet et fait l'éloge de Socrate. Il le compare à ces statuettes de silènes, laides au-dehors, qui renferment des images de dieux[^1]. Socrate cache, croit-il, un trésor, un *agalma*, admirable et divin[^3].\n\nDans le Séminaire VIII, tenu de novembre 1960 à juillet 1961 à l'hôpital Sainte-Anne, Lacan lit cette scène comme un modèle de la relation analytique : l'analysant est à la place d'Alcibiade, l'analyste à celle de Socrate[^3]. L'*agalma* désigne l'objet caché et fascinant qu'on prête à l'autre, et dont Lacan juge le rôle dans l'apparition du transfert au moins aussi important que celui du savoir supposé[^4].\n\n> **Illustration (une scène de cure, pas un cas de Lacan).** Un patient finit par dire à son analyste : « Vous, au moins, vous savez ce qui est bon pour moi. » Il prête à l'analyste un trésor de savoir, comme Alcibiade à Socrate. Ce qui fait avancer la cure n'est pas que l'analyste confirme posséder ce trésor ; c'est qu'il ne réponde pas à cette place, pour que la question revienne au patient.\n\n## Deux lectures, deux usages\n\nFreud et Lacan ne cherchent pas la même chose dans le dialogue. Freud y prend un mythe pour soutenir une hypothèse sur la nature des pulsions : il lit le *Banquet* en théoricien. Lacan y lit une scène, celle de l'amour adressé à quelqu'un qui est supposé détenir ce qu'on désire : il le lit en clinicien du transfert, et décrit le dialogue lui-même comme un texte « clinique »[^3].\n\nPour l'amour de transfert, Lacan rappelle deux choses à la fois : qu'il aide la cure, en faisant apparaître les signifiants de l'histoire du sujet, et qu'il peut, sous son aspect imaginaire, faire résistance[^3]. Le *Banquet* tient ensemble ces deux faces : l'éloge passionné d'Alcibiade est à la fois un aveu et un obstacle.\n\n## Ce que Platon apporte à la clinique\n\nPlaton ne pensait évidemment ni aux pulsions ni au transfert. Mais son dialogue fournit à la psychanalyse deux images durables : celle d'un désir qui cherche ce qu'il a perdu, et celle d'un amour qui prête à l'autre ce qui lui manque à lui-même. L'une et l'autre se retrouvent, sous d'autres noms, dans le cabinet de l'analyste.","quiz":[{"question":"Que retient Freud du mythe d'Aristophane ?","choix":["Que l'amour est une illusion qu'il faut dissiper par la raison","Qu'il fait dériver une pulsion de la nécessité de rétablir un état antérieur","Que les êtres humains ont réellement eu quatre bras et quatre jambes","Que la sexualité est d'origine divine et donc sacrée"],"bonne":1,"explication":"Freud y trouve une image de la pulsion comme tendance à rétablir une situation antérieure, tout en précisant qu'il s'agit d'un mythe et non d'une explication scientifique."},{"question":"Que désigne l'agalma dans la lecture de Lacan ?","choix":["Le banquet lui-même, comme lieu de la parole","Le vin que boit Alcibiade avant son éloge","L'objet caché et précieux qu'Alcibiade prête à Socrate","La beauté physique de Socrate, que tous admirent"],"bonne":2,"explication":"Alcibiade compare Socrate aux silènes laids au-dehors qui renferment des images de dieux : l'agalma est ce trésor caché qu'on prête à l'autre, et qui soutient le transfert."},{"question":"Un patient, au bout de quelques mois, idéalise son analyste et lui attribue une sagesse hors du commun. Que suggère la lecture lacanienne du Banquet ?","choix":["Que l'analyste doit confirmer cette sagesse pour renforcer l'alliance","Que le patient occupe la place d'Alcibiade : il prête à l'analyste un trésor","Que la cure a échoué et doit être interrompue","Que le patient reproduit exactement le mythe d'Aristophane"],"bonne":1,"explication":"C'est la scène d'Alcibiade et de Socrate : l'analysant prête à l'analyste un agalma. L'analyste n'a pas à le confirmer ; ce trésor supposé est le moteur et l'enjeu du transfert."},{"question":"Quelle formule Lacan tire-t-il de l'enseignement de Diotime ?","choix":["En amour, on donne ce qu'on n'a pas","En amour, on reçoit ce qu'on mérite","En amour, on retrouve sa moitié perdue","En amour, on possède enfin ce qu'on désire"],"bonne":0,"explication":"Pour Diotime, l'Amour est manque : nul ne désire ce qu'il a déjà. Lacan en tire la formule « donner ce qu'on n'a pas ». La moitié perdue est l'image d'Aristophane."}],"sources":[{"texte":"Platon, Symposium, trad. Benjamin Jowett, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/1600"},{"texte":"Freud, Beyond the Pleasure Principle (1920), trad. C. J. M. Hubback (1922), chap. VI, Project Gutenberg","url":"https://gutenberg.org/ebooks/76031"},{"texte":"nosubject.com, « Le transfert » (Séminaire VIII : dates, Banquet, Socrate et Alcibiade, Diotime)","url":"https://nosubject.com/Le_transfert"},{"texte":"nosubject.com, « Agalma » (Séminaire VIII, éd. Seuil 1991, p. 163-178)","url":"https://nosubject.com/Agalma"}]},{"id":"levinas-visage","discipline":"philosophie","titre":"Le visage d'autrui","figure":"Emmanuel Levinas","branche":"morale","fiabilite":"secondaire","fiabilite_note":"Levinas est présenté d'après l'Encyclopédie de Stanford et Wikipédia ; Totalité et infini n'a pas été consulté directement. La formule « Tu ne tueras point » est rapportée par l'Encyclopédie à travers un commentateur.","reference":"Totalité et infini. Essai sur l'extériorité (1961) ; Autrement qu'être ou au-delà de l'essence (1974)","accroche":"Avant toute théorie morale, il y a un visage qui vous regarde. Levinas fait de cette rencontre le point de départ de toute éthique, et même de la philosophie.","punch":"Le visage de l'autre dit, sans un mot : ne me tue pas.","idee":"Pour Levinas, l'éthique ne commence pas par des règles mais par la rencontre d'autrui. Le visage interrompt ma liberté et m'appelle à répondre de l'autre. Ce rapport, irréductible au savoir, fait de l'éthique la « philosophie première ».","repere":"Né en 1905 à Kaunas, en Lituanie, Levinas étudie à Strasbourg, puis auprès de Husserl et de Heidegger à Fribourg. Naturalisé français, prisonnier de guerre à partir de 1940, il perd pendant la guerre sa famille restée en Lituanie. Totalité et infini, sa thèse d'État, paraît en 1961.","liens":["kant-lumieres","winnicott-mere-suffisamment-bonne","husserl-epoche"],"texte":"Emmanuel Levinas naît en 1905 à Kaunas, en Lituanie. Il étudie la philosophie à Strasbourg à partir de 1923, où il se lie d'amitié avec Maurice Blanchot, puis travaille auprès de Husserl à Fribourg et suit le séminaire de Heidegger, en 1928-1929[^1]. Naturalisé français en 1939, il est fait prisonnier en 1940 et détenu en Allemagne ; sa famille restée en Lituanie est assassinée pendant la guerre[^1].\n\nIl reprend la méthode phénoménologique de Husserl, mais se méfie de son intellectualisme, et se tourne vers l'existence concrète, à la manière de Heidegger tout en s'en démarquant[^1]. Dès *De l'évasion*, en 1935, la transcendance prend chez lui la forme d'un besoin de sortir de sa propre existence[^1] : l'idée que le sujet ne se suffit pas à lui-même est déjà là. Sa thèse d'État, *Totalité et infini*, paraît en 1961[^1].\n\n## L'éthique comme philosophie première\n\nLa philosophie, depuis les Grecs, a souvent commencé par la question de l'être : qu'est-ce qui existe, et comment le connaître ? Levinas renverse l'ordre. Ce n'est pas l'ontologie, mais l'éthique, qu'il faut concevoir comme philosophie première[^1]. Il ne propose pas pour autant une théorie morale, avec des règles et des devoirs : il décrit la rencontre avec autrui, qui précède toute réflexion[^1].\n\nToute éthique, selon lui, naît de la confrontation avec un autre[^2].\n\nLe livre suit un parcours. Il décrit d'abord la vie du sujet dans le monde, la jouissance et le travail ; puis la rencontre avec autrui dans le dialogue ; et il s'achève sur la famille, pensée comme une « micro-société »[^1]. L'éthique ne flotte pas au-dessus de l'existence ordinaire : elle la traverse.\n\n## Le visage\n\nLe cœur de cette rencontre est le *visage*. Le mot ne désigne pas seulement des traits physiques : c'est la manière dont autrui se présente à moi, irréductible à ce que j'en sais. L'appel de l'autre interrompt ma liberté ; le visage signifie, sans mots : « Ne me tue pas »[^1]. Un commentateur formule la même injonction sous la forme biblique : « tu ne tueras point »[^1].\n\nCet appel ne passe pas d'abord par le discours. Seule la rencontre face à face permet, pour Levinas, une vraie relation à l'infini ; l'écrit et le discours différé relèvent déjà de la « totalité »[^2].\n\n> **Illustration (pas un exemple de Levinas).** Dans le métro, quelqu'un tend la main en demandant de l'aide. Tant qu'on regarde son téléphone, on peut raisonner : ce n'est pas de mon ressort, il y a des services pour cela. Puis le regard croise le sien, et quelque chose a changé avant même qu'on ait décidé quoi que ce soit. On peut encore refuser. Mais on ne peut plus faire comme si personne n'était là.\n\n## Totalité et infini\n\nLe titre du livre oppose deux régimes. La *totalité* est le monde où l'autre est un corps parmi d'autres, une pièce d'un ensemble qu'on pourrait comprendre et maîtriser. L'*infini* est ce qui excède ce monde : accueillir autrui, c'est recevoir de lui au-delà de la capacité du moi, c'est avoir l'idée de l'infini[^2]. L'infini ne peut être circonscrit : il renvoie à l'imprévisibilité du visage[^1].\n\nLe désir qui s'ouvre ainsi n'est pas un besoin qu'un objet comblerait : c'est un désir « au-delà de tout ce qui peut simplement le combler »[^1].\n\n## La responsabilité\n\nLe visage me place dans une position singulière : autrui est traité comme s'il était plus haut que moi[^1]. La relation n'est pas symétrique, comme dans un contrat où chacun doit à l'autre ce que l'autre lui doit. Je suis responsable de l'autre avant d'avoir rien décidé, et cette responsabilité précède la réflexion et les théories morales[^1].\n\nDans *Autrement qu'être* (1974), Levinas pousse plus loin : la responsabilité devient « l'un-pour-l'autre », une *substitution* qui peut aller jusqu'au sacrifice de soi[^1]. Il y distingue aussi le *Dire*, la vulnérabilité exposée qui précède les mots, et le *Dit*, le contenu des énoncés[^1].\n\n> **Illustration (un parallèle avec la clinique).** Un thérapeute reçoit un patient qu'il trouve d'abord antipathique, et dont le dossier semble tout dire. Il pourrait l'écouter à travers ce qu'il sait déjà de lui. La pensée de Levinas rappelle autre chose : que l'autre excède toujours ce qu'on en connaît, et que l'écoute commence par cette reconnaissance.\n\n## Une pensée discutée\n\n*Totalité et infini* compte parmi les œuvres majeures de la philosophie continentale ; on peut le lire comme une réponse à Husserl et à Heidegger, ses maîtres[^2]. Jacques Derrida en a proposé une lecture critique dans « Violence et métaphysique »[^2], qui interroge la possibilité de dire, dans le langage de la philosophie, ce qui prétend lui échapper.","quiz":[{"question":"Que place Levinas comme « philosophie première » ?","choix":["L'ontologie, la science de l'être en tant qu'être","La logique, qui fonde toute pensée valide","L'éthique, entendue comme la rencontre d'autrui","La théologie, qui part de l'existence de Dieu"],"bonne":2,"explication":"Levinas renverse l'ordre traditionnel : l'éthique, et non l'ontologie, est philosophie première. Il ne propose pas une théorie morale, mais une description de la rencontre avec autrui."},{"question":"Que signifie le visage, selon Levinas ?","choix":["Sans mots, il dit « Ne me tue pas » et interrompt ma liberté","Il exprime les émotions que l'on peut lire sur des traits","Il révèle l'identité sociale et le statut d'une personne","Il est un objet que la perception analyse comme les autres"],"bonne":0,"explication":"Le visage n'est pas d'abord un ensemble de traits : c'est l'appel d'autrui, qui interrompt ma liberté et m'oblige avant toute décision."},{"question":"Une infirmière dit d'un patient difficile : « Je sais exactement qui il est, j'ai lu son dossier. » Que lui rappellerait la pensée de Levinas ?","choix":["Que le dossier suffit à connaître un patient","Qu'il faut éviter de regarder les patients en face","Qu'autrui excède toujours ce qu'on sait de lui","Que la responsabilité dépend d'un contrat entre les deux"],"bonne":2,"explication":"L'autre n'est pas réductible à ce qu'on en connaît : c'est la différence entre la « totalité » et l'« infini ». La responsabilité, chez Levinas, précède tout contrat."},{"question":"Comment Levinas décrit-il la relation éthique ?","choix":["Comme un échange égal, chacun devant à l'autre la même chose","Comme asymétrique : autrui est traité comme plus haut que moi","Comme un rapport de force entre deux libertés","Comme une relation qui ne concerne que les proches"],"bonne":1,"explication":"Le visage place autrui au-dessus du moi : la responsabilité n'est pas réciproque comme un contrat, elle précède toute réflexion."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Emmanuel Levinas » (biographie, visage, infini, éthique comme philosophie première, Autrement qu'être)","url":"https://plato.stanford.edu/entries/levinas/"},{"texte":"Wikipédia (anglais), « Totality and Infinity » (thèse, face-à-face, infini, réception, Derrida)","url":"https://en.wikipedia.org/wiki/Totality_and_Infinity"}]},{"id":"murdoch-attention","discipline":"philosophie","titre":"Un regard juste et aimant","figure":"Iris Murdoch","branche":"morale","fiabilite":"secondaire","fiabilite_note":"The Sovereignty of Good est présenté d'après l'Encyclopédie de Stanford, qui le cite en anglais avec ses pages ; les citations sont traduites ici. Le livre n'a pas été consulté directement. L'exemple souvent cité du faucon crécerelle n'est pas repris, faute de l'avoir vérifié.","reference":"The Sovereignty of Good (1970), trois essais : « The Idea of Perfection » (1964), « The Sovereignty of Good Over Other Concepts » (1967), « On \"God\" and \"Good\" » (1969)","accroche":"Une belle-mère n'a rien dit, rien fait, rien décidé. Elle a seulement appris à voir sa belle-fille autrement. Pour Iris Murdoch, c'est là que se joue la morale.","punch":"On ne peut choisir que dans le monde qu'on est capable de voir.","idee":"Contre les philosophies qui réduisent la morale au choix, Murdoch la situe dans la vision. Reprenant le mot de Simone Weil, elle appelle attention un « regard juste et aimant » posé sur une réalité singulière. Il exige de se défaire du « gros moi impitoyable » qui déforme ce que l'on voit.","citation":"I have used the word 'attention', which I borrow from Simone Weil, to express the idea of a just and loving gaze directed upon an individual reality.","citation_source":"Iris Murdoch, « The Idea of Perfection » (1964), dans The Sovereignty of Good, p. 34, cité par l'Encyclopédie de Stanford — « J'ai employé le mot \"attention\", que j'emprunte à Simone Weil, pour exprimer l'idée d'un regard juste et aimant posé sur une réalité individuelle »","citation_url":"https://plato.stanford.edu/entries/murdoch/","liens":["weil-attention","sartre-mauvaise-foi","freud-transfert"],"texte":"Iris Murdoch (1919-1999) est surtout connue comme romancière : à partir de 1954, elle publie vingt-six romans[^1]. Mais elle est aussi philosophe. Elle étudie à Oxford de 1938 à 1942, y enseigne de 1948 à 1963, et son premier livre, en 1953, est consacré à Sartre[^1]. Sa philosophie morale tient pour l'essentiel dans un petit livre de 1970, *The Sovereignty of Good* (« la souveraineté du bien »), qui réunit trois essais écrits dans les années 1960[^1].\n\n## Contre la morale du choix\n\nMurdoch s'en prend à une image de l'être humain qu'elle trouve dominante, et qu'elle appelle « existentialiste-behavioriste ». Dans cette image, la morale se réduit à des choix : un sujet libre, sans épaisseur, se tient devant des options et tranche. Entre deux décisions, il ne se passe rien de moral[^1].\n\nMurdoch objecte que la liberté de choisir est, d'ordinaire, bien moins grande qu'on ne le dit[^1]. Nous ne choisissons pas dans le vide : nous choisissons à l'intérieur du monde que nous sommes capables de voir[^1]. Si la vision est faussée, le choix le sera aussi, quelle que soit la volonté qu'on y mette. La morale, dès lors, ne s'interrompt pas entre les choix : elle se poursuit continuellement[^1].\n\nElle substitue ainsi à l'image du *faire* celle du *voir*[^1].\n\n## M et D\n\nPour le montrer, Murdoch invente un exemple devenu célèbre. Une femme, M, éprouve de l'hostilité envers sa belle-fille, D. Elle la trouve effrontée et familière, pas assez cérémonieuse, brusque, parfois franchement grossière, toujours d'une puérilité fatigante. Elle pense que son fils a fait une mésalliance[^1].\n\nM se comporte pourtant de façon irréprochable avec D : rien, dans ses actes, ne trahit ce qu'elle pense[^2]. Mais elle se reprend. Elle reconnaît sa jalousie envers D, et son propre snobisme[^1], et se force à regarder à nouveau. Et peu à peu, elle voit D autrement : non pas vulgaire, mais d'une simplicité rafraîchissante ; non pas indigne, mais spontanée ; non pas d'une puérilité fatigante, mais délicieusement jeune[^1].\n\nRien n'a changé dans les actes. Pour une morale du choix, il ne s'est rien passé. Pour Murdoch, il s'est passé l'essentiel : un travail intérieur, une vision corrigée, que Murdoch imagine plus juste que la première[^1].\n\n> **Illustration (pas un exemple de Murdoch).** Un enseignant trouve qu'un élève « fait exprès » de ne pas suivre. Il le traite correctement, sans jamais le punir à tort. Puis il apprend que l'élève dort mal, que la maison est bruyante. Il ne change aucune règle ; il ne voit plus le même enfant. Et dans les semaines qui suivent, mille petits gestes, un ton, un délai, une question, changent d'eux-mêmes. Le choix a suivi la vision.\n\n## L'attention\n\nMurdoch emprunte à Simone Weil le mot *attention*, pour désigner un regard juste et aimant posé sur une réalité individuelle. C'est, pour elle, la marque propre de l'agent moral[^1]. Les deux adjectifs comptent : *juste*, parce qu'il s'agit de voir ce qui est ; *aimant*, parce que l'amour, chez elle, est cette capacité de reconnaître que quelque chose d'autre que soi est réel.\n\nL'obstacle a un nom. Murdoch parle du « gros moi impitoyable », qui nous empêche de voir clairement les autres[^1]. Nous ne voyons pas les gens tels qu'ils sont, mais à travers nos peurs, nos jalousies, nos besoins. Et l'introspection ne suffit pas à nous en guérir : elle ne révèle que le tissu profond de motifs ambivalents, et le fantasme est une force plus grande que la raison[^1].\n\n> **Illustration (un parallèle avec la clinique).** Un patient décrit sa sœur comme « égoïste », exemples à l'appui, séance après séance. Un jour, il raconte un souvenir où elle l'a protégé, et s'arrête, surpris. Le portrait ne tient plus tout à fait. La psychanalyse appellerait cela un remaniement ; Murdoch y verrait le travail lent de l'attention contre le moi, et c'est aussi ce que la cure de parole rend possible.\n\n## Se défaire de soi\n\nLe remède que propose Murdoch porte un nom inventé : *unselfing*, qu'on pourrait traduire par « dé-centrement de soi ». Elle le tire de la *décréation* de Weil[^1]. La formule qui le résume : nous cessons d'être pour prêter attention à l'existence de quelque chose d'autre[^1].\n\nCe mouvement n'est pas une perte. Il ne s'agit pas de se mépriser, mais de sortir un moment du film intérieur pour voir ce qui est là. Les « réalités individuelles » auxquelles l'attention s'adresse ne sont d'ailleurs pas seulement des personnes : un arbre, un animal en font partie[^1].\n\nLe chemin le plus accessible, selon elle, passe par la beauté, celle de la nature comme celle de l'art ; les disciplines intellectuelles, comme l'apprentissage d'une langue étrangère, en sont une étape plus difficile[^2]. Dans les deux cas, quelque chose d'extérieur, qui ne se plie pas à nos désirs, nous oblige à le regarder pour ce qu'il est.\n\n## Héritage\n\nSon influence sur la philosophie universitaire commence à la fin des années 1970 avec John McDowell ; Cora Diamond, Hilary Putnam, Charles Taylor ou Bernard Williams s'y réfèrent[^2]. On l'a parfois rangée parmi les pionniers de l'éthique des vertus, qu'elle a sans doute contribué à relancer sans en être une théoricienne, et ses idées sur l'attention ont nourri l'éthique du *care*[^1]. La philosophe Mary Midgley y voyait l'un des très rares livres de philosophie moderne que des lecteurs extérieurs à l'université trouvent réellement utiles[^2]. Murdoch publiera un seul autre livre de philosophie, *Metaphysics as a Guide to Morals*, en 1992[^1]. Elle a placé au cœur de la morale une question que l'on se pose rarement : est-ce que je vois vraiment la personne qui est en face de moi ?","quiz":[{"question":"Que reproche Murdoch à la conception « existentialiste-behavioriste » de la morale ?","choix":["De donner trop d'importance à la vie intérieure des personnes","De réduire la morale à des choix, sans rien entre deux décisions","De négliger la question de la liberté de la volonté humaine","De fonder la morale sur la religion plutôt que sur la raison"],"bonne":1,"explication":"Pour Murdoch, la morale ne s'interrompt pas entre les choix : elle se poursuit dans la manière de voir. Et « on ne peut choisir que dans le monde qu'on peut voir »."},{"question":"Que montre l'exemple de M et D ?","choix":["Que M doit avouer franchement à D ce qu'elle pense d'elle","Qu'un changement moral peut avoir lieu sans aucun acte visible","Que les belles-mères ont toujours tort de juger leur belle-fille","Que seules les actions extérieures ont une valeur morale réelle"],"bonne":1,"explication":"M ne change rien à sa conduite, mais elle apprend à voir D autrement. Pour une morale du choix, rien ne s'est passé ; pour Murdoch, l'essentiel a eu lieu."},{"question":"Un manager juge depuis des mois une collaboratrice « froide ». Il décide de l'observer de nouveau, en se demandant ce que ce jugement doit à sa propre gêne. Qu'est-il en train de faire, dans le vocabulaire de Murdoch ?","choix":["Un choix existentiel radical et sans motif","Un travail d'attention contre le « gros moi »","Une introspection qui suffit à révéler la vérité","Un renoncement à tout jugement moral sur autrui"],"bonne":1,"explication":"Il tente de poser un « regard juste et aimant » en corrigeant ce que son moi déforme. Murdoch précise que l'introspection seule ne suffit pas : c'est le regard tourné vers l'autre qui corrige."},{"question":"D'où Murdoch tire-t-elle la notion d'« attention » ?","choix":["D'Aristote, qui en fait la vertu de prudence","De Sartre, à qui elle consacre son premier livre","De Freud, qui en fait une règle de la cure","De Simone Weil, dont elle reprend aussi la décréation"],"bonne":3,"explication":"Murdoch dit emprunter le mot à Simone Weil, et elle tire l'« unselfing » de la « décréation » weilienne."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Iris Murdoch » (biographie, critique de la morale du choix, M et D, attention, gros moi, unselfing)","url":"https://plato.stanford.edu/entries/murdoch/"},{"texte":"Wikipédia (anglais), « The Sovereignty of Good » (les trois essais, attention, beauté et dé-centrement de soi)","url":"https://en.wikipedia.org/wiki/The_Sovereignty_of_Good"}]},{"id":"foucault-histoire-de-la-folie","discipline":"philosophie","titre":"Histoire de la folie","figure":"Michel Foucault","branche":"histoire","fiabilite":"secondaire","fiabilite_note":"Le livre est présenté d'après Wikipédia et l'Encyclopédie de Stanford, qui en résument la thèse et la réception ; il n'a pas été consulté directement. La date de création de l'Hôpital général et l'ampleur de l'enfermement ne figurent pas dans ces sources et ne sont pas données ici.","reference":"Folie et Déraison. Histoire de la folie à l'âge classique (Plon, 1961) ; rééd. Gallimard, 1972","accroche":"On raconte souvent que les médecins ont un jour libéré les fous de leurs chaînes. Foucault raconte une autre histoire : celle d'une raison qui a fait taire la folie avant de la soigner.","punch":"La folie n'a pas toujours été une maladie. Elle l'est devenue.","idee":"Foucault suit le sens de la folie de la Renaissance à la fin du XVIIIe siècle. Errante et symbolique à la Renaissance, elle est enfermée à l'âge classique avec les vagabonds et les débauchés, puis devient « maladie mentale ». La libération par Pinel et Tuke n'est pas pour lui un simple progrès.","repere":"Le livre paraît en 1961 chez Plon sous le titre Folie et Déraison, puis en 1972 chez Gallimard, révisé, sous le titre Histoire de la folie à l'âge classique. C'est la thèse de doctorat d'État de Foucault, parrainée par Georges Canguilhem.","liens":["canguilhem-normal-pathologique","descartes-malin-genie","nietzsche-ressentiment"],"texte":"*Histoire de la folie* est la thèse de doctorat de Michel Foucault, soutenue sous le parrainage de Georges Canguilhem[^2]. Le livre paraît en 1961 chez Plon, sous le titre *Folie et Déraison*, puis en 1972 chez Gallimard, révisé et augmenté[^1]. Il examine l'évolution du sens de la folie en Europe, de la fin du Moyen Âge à la fin du XVIIIe siècle[^1]. Il a aussi pour cible une certaine manière d'écrire l'histoire, celle qui raconte les savoirs comme une suite de découvertes. Le travail de Canguilhem sur l'histoire de la biologie lui a d'ailleurs servi de modèle pour une grande partie de ses recherches sur l'histoire des sciences humaines[^2].\n\n## Trois figures de la folie\n\nFoucault distingue trois moments[^1].\n\n**La Renaissance.** Les fous ne sont pas enfermés : ils circulent. Sur les routes, sur les fleuves, la « nef des fous » emporte des passagers qui sont eux-mêmes des êtres de passage. Le fou devient un symbole de la condition humaine : « la folie est l'anticipation de la mort »[^1]. Elle parle, et elle dit quelque chose du monde.\n\n**L'âge classique.** Au XVIIe siècle, au début de ce que Foucault appelle l'âge de la raison, les insensés sont enfermés en Europe avec d'autres figures jugées antisociales : prostituées, vagabonds, blasphémateurs. Des institutions comme l'Hôpital général de Paris reposent sur des régimes de punitions et de récompenses destinés à leur faire changer de vie, et l'enfermement répond aussi à des besoins juridiques et économiques, comme le contrôle des salaires dans les maisons de travail[^1]. Ce qu'on enferme, ce sont des manières de vivre autant que des esprits égarés. La folie y est pensée comme un renoncement à la raison[^2].\n\n**L'époque moderne.** À la fin du XVIIIe siècle, la folie devient « maladie mentale ». Pour Foucault, ce moment marque la rupture d'un dialogue : l'homme moderne ne communique plus avec le fou[^1].\n\n> **Illustration (pas un exemple de Foucault).** Dans une ville, une même personne, au fil des siècles, aurait pu être tour à tour un « innocent » qu'on laisse errer en lui prêtant une sagesse étrange, un oisif qu'on enferme avec les mendiants parce qu'il ne travaille pas, puis un « malade » qu'on observe et qu'on classe. Son comportement aurait pu rester le même. C'est le regard posé sur lui qui aurait changé. Foucault fait l'histoire de ce regard.\n\n## La libération, autrement racontée\n\nL'histoire classique de la psychiatrie célèbre un geste fondateur : Philippe Pinel en France, William Tuke en Angleterre, auraient libéré les fous de l'ignorance et de la brutalité des siècles précédents[^2]. Foucault conteste ce récit. La nouvelle conception n'est pas, pour lui, une nette amélioration sur les anciennes ; la neutralité scientifique du traitement médical sert aussi à contrôler ce qui menace la morale bourgeoise[^2].\n\nLa thèse générale du livre tient en une phrase : ce qui se présentait comme une découverte scientifique objective était en réalité le produit d'engagements sociaux et moraux discutables[^2].\n\n> **Illustration (une question pour aujourd'hui).** Un service de soins remplace la contention physique par un règlement minutieux : horaires, récompenses, privilèges retirés en cas d'écart. Le progrès est réel. Foucault invite pourtant à se demander ce que ce règlement exige du patient : guérir, ou se conformer ? La question ne disqualifie pas le soin ; elle demande de ne pas confondre l'un et l'autre.\n\n## Une réception partagée\n\nLe livre a été reçu de manière contrastée. Les réactions des historiens ont été, selon Gary Gutting, « ambivalentes, pour ne pas dire polarisées » : Robert Mandrou y voit un « beau livre », Michael MacDonald juge que tout travail sur l'histoire de la folie doit désormais s'inscrire dans son sillage[^1]. D'autres, comme José Guilherme Merquior, lui reprochent des erreurs de fait et d'interprétation, et une sélection des données qui ignore les preuves contraires[^1].\n\nLe livre a aussi été rangé parmi les grandes critiques des institutions psychiatriques des années 1960, aux côtés de Thomas Szasz[^1]. Mais Foucault n'écrit pas un pamphlet contre la psychiatrie : il écrit l'histoire des conditions dans lesquelles la folie est devenue un objet de savoir médical.\n\n## Éditions\n\nUne version abrégée est traduite en anglais en 1964 par Richard Howard ; une traduction intégrale, par Jonathan Murphy et Jean Khalfa, paraît bien plus tard chez Routledge[^1].\n\n## Ce que le livre apprend au clinicien\n\nLe livre ne dit pas que la souffrance psychique n'existe pas, ni qu'il ne faut pas la soigner. Il rappelle que les catégories avec lesquelles on la pense ont une histoire, et que cette histoire est mêlée de morale, d'économie et de pouvoir. Pour qui reçoit des patients, c'est une invitation à regarder aussi ses propres évidences.","quiz":[{"question":"Comment la folie est-elle traitée à la Renaissance, selon Foucault ?","choix":["Elle circule librement, et le fou devient un symbole de la condition humaine","Elle est enfermée dans des asiles médicaux spécialisés","Elle est soignée par des médecins selon des protocoles scientifiques","Elle est punie de mort par les tribunaux religieux"],"bonne":0,"explication":"La « nef des fous » emporte des êtres de passage ; la folie, non enfermée, parle encore de la condition humaine. L'enfermement viendra à l'âge classique, la médicalisation à la fin du XVIIIe siècle."},{"question":"Qui l'âge classique enferme-t-il avec les insensés ?","choix":["Uniquement les criminels condamnés à mort","Les malades contagieux en période d'épidémie","Des « antisociaux » : vagabonds, prostituées, blasphémateurs","Les enfants abandonnés et les orphelins des villes, seulement"],"bonne":2,"explication":"À l'âge classique, les fous sont enfermés avec d'autres « antisociaux », dans des institutions comme l'Hôpital général, qui visent à corriger leur manière de vivre."},{"question":"Un manuel affirme : « Pinel a libéré les fous, et la psychiatrie est née de ce geste humaniste. » Que lui objecterait Foucault ?","choix":["Que Pinel n'a jamais existé","Que les fous n'ont jamais été enchaînés","Que cette libération est aussi une nouvelle forme de contrôle moral","Que la psychiatrie est née bien avant, au Moyen Âge"],"bonne":2,"explication":"Foucault ne nie pas le geste, mais il refuse d'y voir un simple progrès : la neutralité scientifique du soin sert aussi à contrôler ce qui menace la morale établie."},{"question":"Comment les historiens ont-ils reçu le livre ?","choix":["Unanimement, comme une erreur sans aucune valeur","Unanimement, comme une vérité définitive","De façon partagée : saluée par les uns, critiquée par d'autres","Ils l'ont ignoré, faute de traduction disponible"],"bonne":2,"explication":"Les réactions ont été « ambivalentes, pour ne pas dire polarisées » : Mandrou et MacDonald le saluent, Merquior lui reproche des erreurs de fait et une sélection des données."}],"sources":[{"texte":"Wikipédia (anglais), « Madness and Civilization » (thèse, trois périodes, grand renfermement, réception, éditions)","url":"https://en.wikipedia.org/wiki/Madness_and_Civilization"},{"texte":"Stanford Encyclopedia of Philosophy, « Michel Foucault », § 3.1 (thèse, Pinel et Tuke, Canguilhem)","url":"https://plato.stanford.edu/entries/foucault/"}]},{"id":"nietzsche-eternel-retour","discipline":"philosophie","titre":"L'éternel retour","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"secondaire","fiabilite_note":"Le § 341 est cité d'après la traduction anglaise que reproduit Wikipédia ; les interprétations, d'après Wikipédia (qui renvoie à Heidegger, Kaufmann, Oger, Sinhababu et Kuong) et l'Encyclopédie de Stanford. Le texte allemand n'a pas été consulté.","reference":"Le Gai Savoir (1882), § 341 « Le poids le plus lourd » ; Ainsi parlait Zarathoustra (1883-1885) ; Ecce Homo (1888)","accroche":"Un démon vous murmure que vous revivrez cette vie à l'infini, à l'identique. Vous maudissez-le, ou vous lui dites merci ? Nietzsche fait de la réponse une épreuve.","punch":"Vivrais-tu encore cette vie, une infinité de fois, sans rien y changer ?","idee":"Au § 341 du Gai Savoir, un démon annonce que cette vie reviendra, à l'identique, une infinité de fois. Nietzsche présente l'idée comme une hypothèse, non comme un fait : elle donne à chaque instant « le poids le plus lourd », et mesure si l'on peut affirmer sa vie telle qu'elle est.","repere":"Le § 341 est l'avant-dernière section des quatre premiers livres du Gai Savoir (1882) ; la dernière cite le début d'Ainsi parlait Zarathoustra. Nietzsche dira de l'éternel retour qu'il est « l'idée fondamentale » d'Ainsi parlait Zarathoustra.","liens":["nietzsche-mort-de-dieu","schopenhauer-pendule","freud-fort-da"],"texte":"Le *Gai Savoir*, dans sa première édition de 1882, s'achève sur deux sections qui changent le ton du livre. La dernière cite le début de *Zarathoustra*[^2]. L'avant-dernière, le § 341, présente pour la première fois la pensée de l'éternel retour, et lui donne pour titre « le poids le plus lourd » (*the greatest weight*)[^2].\n\n## Le démon\n\nLe texte est une mise en scène : un démon vient annoncer : « Cette vie, telle que tu la vis maintenant et telle que tu l'as vécue, il te faudra la vivre encore une fois et d'innombrables fois » (*This life as you now live it and have lived it, you will have to live once more and innumerable times more*)[^1]. Il ne s'agit pas d'une autre vie, ni d'une vie meilleure, mais de celle-ci, telle qu'elle a été, avec ce qu'on regrette comme avec ce qu'on aime.\n\nNietzsche ne demande pas si c'est vrai. Il demande comment on recevrait cette annonce : comme une malédiction, ou comme une parole qu'on pourrait accueillir avec joie ?\n\nHeidegger a souligné ce point : Nietzsche présente l'idée comme une question hypothétique, non comme un fait[^1].\n\n> **Illustration (pas un exemple de Nietzsche).** On propose à quelqu'un, pour jeu, de choisir : revivre exactement sa dernière année, sans rien pouvoir y changer, ou l'effacer. La question l'oblige à regarder cette année autrement. Ce n'est plus « qu'est-ce qui s'est passé ? », mais « est-ce que je peux dire oui à ce qui s'est passé ? ». Certains répondent tout de suite ; d'autres découvrent, en hésitant, ce qu'ils n'ont jamais vraiment accepté. Le démon de Nietzsche pose cette question à l'échelle d'une vie entière.\n\n## Le poids le plus lourd\n\nPourquoi « le poids le plus lourd » ? Parce que l'hypothèse change la valeur de chaque instant. Si tout revient, rien n'est indifférent : chaque geste se répétera à l'infini. La pensée est censée donner à chaque événement un poids maximal[^2].\n\nElle sert alors d'épreuve. Une vie n'est bonne, dans cette lecture, que si, en imaginant son retour dans chaque détail, on peut l'affirmer telle qu'elle est[^2]. Le démon ne promet pas une autre vie, meilleure ou plus juste : il demande si l'on veut celle-ci.\n\n## Une doctrine ou une épreuve ?\n\nLes interprètes se partagent. Certains ont pris l'idée à la lettre, comme une thèse sur le cosmos : les carnets posthumes de Nietzsche contiennent une tentative de preuve, fondée sur un temps infini et une quantité finie d'énergie, qui aboutirait à un mouvement circulaire de séries identiques[^1]. Mais Nietzsche lui-même n'en était peut-être pas convaincu, et Georg Simmel a réfuté l'argument par une analogie avec des roues en rotation[^1].\n\nD'autres y lisent une épreuve éthique. Une note inédite propose une question à se poser avant chaque acte : est-ce un acte que je suis prêt à accomplir un nombre incalculable de fois ? On l'a comparée à l'impératif catégorique de Kant ; mais la plupart des spécialistes modernes rejettent cette lecture, faute d'un tel impératif dans les œuvres publiées[^1].\n\n## Zarathoustra et l'amor fati\n\nDans *Ainsi parlait Zarathoustra*, l'idée revient. Zarathoustra en est d'abord saisi d'horreur, puis il l'accepte comme son désir le plus ardent ; le « Chant de l'ivresse » dit que « toute joie veut l'éternité »[^1]. Nietzsche appellera l'éternel retour « l'idée fondamentale de l'œuvre »[^1].\n\nL'idée rejoint une formule d'*Ecce Homo* : sa formule de la grandeur, écrit Nietzsche, est *amor fati*, ne rien vouloir d'autre que ce qui est, ni dans l'avenir, ni dans le passé, ni pour l'éternité, mais l'aimer[^1]. Le mot apparaissait déjà au début du livre IV du *Gai Savoir* (§ 276)[^2].\n\n> **Illustration (un parallèle avec la clinique).** Une patiente répète qu'elle voudrait « effacer » une période de sa vie. Le travail de la cure ne consiste pas à effacer, et pas davantage à la forcer à aimer ce qu'elle a vécu. Il consiste parfois à lui permettre de reprendre cette période comme la sienne. L'éternel retour pose la question à l'extrême : peut-on vouloir son histoire plutôt que seulement la subir ?\n\n## Pourquoi c'est difficile\n\nL'idée est d'une simplicité vertigineuse et d'une exigence presque insupportable. Elle ne console pas : elle retire l'espoir d'un ailleurs, d'un rachat ou d'une compensation future. Elle n'accuse pas non plus : elle ne demande pas de juger sa vie, mais de savoir si l'on pourrait la vouloir. C'est en cela qu'elle prolonge la mort de Dieu : sans garantie extérieure, c'est à la vie elle-même de porter son poids.","quiz":[{"question":"Que propose le démon du § 341 ?","choix":["Une vie nouvelle, plus heureuse, après la mort","Le retour de cette vie, à l'identique, une infinité de fois","La réincarnation dans un autre corps, selon ses mérites","L'oubli complet de tout ce qui a été vécu"],"bonne":1,"explication":"Le démon annonce que cette vie reviendra telle quelle, dans le même ordre, une infinité de fois. Il ne promet ni récompense, ni réincarnation, ni oubli."},{"question":"Pourquoi Nietzsche parle-t-il du « poids le plus lourd » ?","choix":["Parce que la vie humaine est faite surtout de souffrance","Parce que si tout revient, chaque instant prend un poids maximal","Parce que le démon est une figure du péché","Parce que la pensée est difficile à comprendre"],"bonne":1,"explication":"Si chaque instant se répète à l'infini, rien n'est indifférent : la pensée donne à chaque événement le plus grand poids possible."},{"question":"Une femme se demande si elle accepterait de revivre exactement les dix dernières années, échecs compris. Dans quel esprit nietzschéen pose-t-elle la question ?","choix":["Elle cherche à prouver que le temps est circulaire","Elle prépare la liste de ce qu'elle changerait","Elle se demande si elle peut affirmer sa vie telle qu'elle a été","Elle obéit à un impératif moral que Nietzsche aurait formulé"],"bonne":2,"explication":"C'est l'usage de l'éternel retour comme épreuve d'affirmation : vouloir sa vie telle qu'elle est. Ce n'est ni une preuve cosmologique, ni un impératif, que la plupart des spécialistes ne trouvent pas dans les œuvres publiées."},{"question":"Que désigne l'amor fati dans Ecce Homo ?","choix":["Ne rien vouloir d'autre que ce qui est, et l'aimer","Accepter son sort avec tristesse, faute de mieux","Aimer le destin des autres plutôt que le sien","Croire qu'un dieu a fixé d'avance chaque événement"],"bonne":0,"explication":"C'est la formule de la grandeur selon Nietzsche : ne rien vouloir de différent, ni dans l'avenir ni dans le passé, mais l'aimer. Ce n'est ni de la résignation, ni une croyance en un destin divin."}],"sources":[{"texte":"Wikipédia (anglais), « Eternal return » (§ 341, Heidegger, preuve cosmologique, Simmel, épreuve éthique, Zarathoustra, amor fati)","url":"https://en.wikipedia.org/wiki/Eternal_return"},{"texte":"Stanford Encyclopedia of Philosophy, « Friedrich Nietzsche », § 3.2.2 « Affirmation » (le poids le plus lourd, GS 276 et 341)","url":"https://plato.stanford.edu/entries/nietzsche/"}]},{"id":"aulagnier-violence-interpretation","discipline":"psychanalyse","titre":"L'ombre parlée","figure":"Piera Aulagnier","branche":"france","fiabilite":"mixte","fiabilite_note":"Deux séminaires d'Aulagnier (1964 et 1967), publiés par la revue Topique en 2025, ont été lus intégralement. La Violence de l'interprétation (1975) est présentée à travers la lecture de son chapitre IV par Jacques Sédat, dans le même numéro ; le livre lui-même n'a pas été consulté.","reference":"Séminaires de Sainte-Anne (1964, 1967), Topique n° 163, 2025 ; La Violence de l'interprétation. Du pictogramme à l'énoncé (PUF, 1975)","accroche":"Avant de savoir parler, l'enfant est déjà parlé : sa mère lui prête des pensées, des désirs, un caractère. Piera Aulagnier montre ce que cette parole construit, et ce qu'elle peut écraser.","punch":"On imite le masque de l'autre. On s'identifie à ce qu'il désire, sans le savoir.","idee":"Pour Aulagnier, l'identification n'est pas une imitation : elle est inconsciente et nouée au désir de l'Autre. L'enfant se construit dans les mots que la mère pose sur lui, une « ombre parlée ». Si cette interprétation ne lui laisse aucune place, le Je ne peut advenir.","citation":"Ce qu'on imite c'est le masque dont l'autre se revêt pour devenir emblème pour les autres.","citation_source":"Piera Aulagnier, Séminaire de Sainte-Anne du 3 mars 1964, Topique, n° 163, 2025, p. 115","citation_url":"https://doi.org/10.3917/top.163.0115","liens":["freud-inquietante-etrangete","freud-apres-coup","laplanche-seduction-generalisee"],"texte":"Piera Aulagnier, née Spairani, naît à Milan le 19 novembre 1923 et meurt à Paris le 31 mars 1990[^5]. Elle passe son adolescence en Égypte, fait ses études de médecine à Rome et s'installe en France en 1950[^4]. Formée à la psychiatrie à Sainte-Anne, elle fait une analyse didactique avec Lacan de 1955 à 1961 et devient responsable de la formation à l'École freudienne de Paris, qu'elle quitte en 1967 en désaccord avec la procédure de la « passe »[^4]. Elle fonde en 1969, avec Jean-Paul Valabrega et François Perrier, le Quatrième Groupe, et la revue *Topique*[^5]. Son grand livre, *La Violence de l'interprétation*, paraît en 1975, sous-titré « du pictogramme à l'énoncé »[^4]. Son œuvre est d'abord une pensée de la psychose : comment un Je naît, et à quelles conditions il ne le peut pas[^3].\n\n## Identifier n'est pas imiter\n\nEn 1964, dans un séminaire à Sainte-Anne, Aulagnier part de deux traits de l'identification : c'est un processus inconscient, et il a les rapports les plus étroits avec le désir[^1]. Le premier trait est plus exigeant qu'il n'y paraît. Un processus inconscient n'est pas seulement ignoré du sujet : il est tout autant méconnu par l'observateur[^1].\n\nC'est ce qui sépare l'identification de l'imitation. L'imitation peut échapper à celui qui imite, mais elle saute aux yeux des témoins ; elle joue sur les « emblèmes » de l'autre, ce qu'il a de plus typique et de plus visible. Ce qu'on imite, dit-elle, c'est le masque dont l'autre se revêt pour devenir emblème pour les autres[^1]. Son exemple est celui de l'acteur : il imite une forme commune de féminité ou de virilité, et cette imitation ne touche en rien le champ de ses identifications ; souvent, elle est là pour mieux le masquer[^1]. Entre les deux, conclut-elle, il y a le plus souvent une sorte d'antinomie fondamentale[^1].\n\nReste une question : pourquoi le sujet ne peut-il jamais connaître l'objet auquel il s'identifie ? Pourquoi est-il condamné à ne se saisir que dans l'image que le regard de l'autre lui renvoie, et à sombrer dans l'angoisse dès que ses repères identificatoires viennent à manquer[^1] ?\n\n> **Illustration (pas un exemple d'Aulagnier).** Un adolescent copie la démarche, la coupe de cheveux, les expressions de son grand frère : tout le monde le voit, et lui-même le sait à moitié. C'est de l'imitation. Vingt ans plus tard, devenu père, il s'aperçoit qu'il exige de son fils, au mot près, une réussite scolaire que son propre père attendait de lui, et qu'il croyait avoir rejetée. Personne ne l'avait remarqué, pas même lui. C'est là que commence l'identification.\n\n## « Il doit être propre »\n\nPour montrer comment l'identification se noue au désir, Aulagnier prend un moment banal de la relation mère-enfant : l'apprentissage de la propreté, que toute mère, interrogée, met en avant comme un témoin de sa relation à l'enfant[^1].\n\nLa mère formule une demande réelle : il doi
