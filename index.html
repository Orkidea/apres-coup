druple remède."},{"question":"Que reproche Épicure à celui qui souffre d'attendre la mort ?","choix":["De s'affliger sans fondement d'une chose qui ne le gênera pas quand elle sera là","De ne pas assez préparer ses funérailles et sa sépulture","De manquer de foi dans les dieux qui protègent les mortels","De ne pas profiter du temps qui lui reste pour s'enrichir"],"bonne":0,"explication":"Ce dont la présence ne gêne pas ne suscite qu'une douleur sans fondement quand on l'attend. L'épicurisme se désintéresse des rites, ne demande aucune foi en des dieux qui ne s'occupent pas de nous, et tient la richesse pour un désir non nécessaire."},{"question":"Que signifie la comparaison avec la nourriture dans la Lettre ?","choix":["Qu'il faut manger peu et simplement pour vivre longtemps","Que le sage ne cherche pas la vie la plus longue mais la plus agréable","Que les plaisirs du corps sont méprisables pour le sage","Que la mort est comparable à la faim qu'on ne peut apaiser"],"bonne":1,"explication":"Comme on choisit la nourriture la plus agréable plutôt que la plus abondante, le sage ne cherche pas le temps le plus long mais le plus doux. Il ne s'agit pas d'un conseil diététique, et Épicure ne méprise pas les plaisirs du corps."},{"question":"Une femme meurt à trente ans. Un proche dit : « Elle n'a rien perdu, puisqu'elle ne sent plus rien. » Que lui répondrait Thomas Nagel ?","choix":["Qu'elle souffre encore, d'une manière que nous ignorons","Que l'âme survit et regrette la vie perdue","Que la mort lui a fait tort en la privant des biens qu'elle aurait eus","Que la mort est un bien, puisqu'elle met fin aux douleurs"],"bonne":2,"explication":"Pour Nagel, on peut subir un tort sans l'éprouver, comme le mourant à qui l'on rompt une promesse : la mort est un mal par ce qu'elle retire. Il ne suppose ni souffrance ni survie de l'âme."}],"sources":[{"texte":"Épicure, Lettre à Ménécée, texte et traduction (mediterranees.net)","url":"https://mediterranees.net/litterature/cours_antique/docs_grec/Au-dela/Epicure_Menecee.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Death » : Épicure, Lucrèce et Nagel","url":"https://plato.stanford.edu/entries/death/"},{"texte":"Wikipédia (anglais), « Tetrapharmakos » (formule de Philodème)","url":"https://en.wikipedia.org/wiki/Tetrapharmakos"}]},{"id":"freud-inquietante-etrangete","discipline":"psychanalyse","titre":"L'inquiétante étrangeté","figure":"Sigmund Freud","branche":"freud","fiabilite":"primaire","fiabilite_note":"Le texte est cité dans la traduction de Marie Bonaparte et E. Marty (1933).","reference":"Das Unheimliche, Imago, t. V (1919) ; trad. M. Bonaparte et E. Marty (1933)","accroche":"Ce qui nous glace n'est pas l'inconnu. C'est le familier qui revient là où on ne l'attendait pas. Freud mène l'enquête dans un dictionnaire.","punch":"L'étrangement inquiétant, c'est le familier qui revient d'ailleurs.","idee":"Le mot allemand unheimlich (non familier) finit, dans certains emplois, par rejoindre son contraire heimlich (familier, puis secret). Freud en tire sa thèse : l'inquiétante étrangeté naît du retour d'un familier ancien que le refoulement avait rendu étranger.","citation":"Le préfixe « un » placé devant ce mot est la marque du refoulement.","citation_source":"Freud, L'inquiétante étrangeté (1919), section II, p. 26 de l'édition PDF — trad. Marie Bonaparte et E. Marty (1933)","citation_url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/l-inquietante-etrangete-1919.pdf","liens":["kierkegaard-angoisse","husserl-epoche","lacan-stade-du-miroir"],"texte":"*Das Unheimliche* paraît en 1919 dans la revue *Imago*. Marie Bonaparte et E. Marty le traduisent en français en 1933 sous le titre « L'inquiétante étrangeté », et elles emploient aussi, dans le corps du texte, la formule « l'étrangement inquiétant »[^1]. Les deux désignent le même sentiment : ce frisson particulier, cousin de la peur, que ni le danger ni la simple nouveauté n'expliquent bien.\n\nLa méthode de Freud est inhabituelle pour un médecin. Il commence par ouvrir les dictionnaires, puis il lit un conte, puis il fait l'inventaire de ses propres impressions. L'enquête est littéraire et linguistique avant d'être clinique, et c'est ce qui fait sa force.\n\n## Une enquête dans les dictionnaires\n\nEn allemand, *heimlich* vient de *Heim*, la maison : c'est ce qui est familier, intime, domestique. *Unheimlich* en serait le contraire, le « non familier ». On croirait donc que l'inquiétant est ce qui est neuf et inconnu.\n\nFreud consulte les dictionnaires, notamment celui de Sanders, et y trouve une surprise : *heimlich* possède deux groupes de sens. D'un côté ce qui est familier et agréable ; de l'autre ce qui est caché, tenu à l'écart des regards. Il cite alors Schelling, qui fournit la définition cherchée : on appelle *unheimlich* « tout ce qui devrait rester secret, caché, et qui se manifeste »[^1].\n\nAutrement dit, dans l'un de ses emplois, le mot *heimlich* rejoint son contraire. L'inquiétant n'est pas l'étranger absolu. C'est ce qui appartenait à la maison, qui devait y rester caché, et qui en est sorti.\n\n> **Illustration (pas un cas de Freud).** Des années plus tard, vous retraversez les couloirs de votre ancienne école. Rien n'est inconnu : les odeurs, la disposition des portes, le bruit des pas. Et pourtant, pendant une seconde, ce n'est pas de la nostalgie. C'est un malaise, comme si quelque chose que vous croyiez disparu se tenait là, intact. Le lieu est familier, et c'est justement ce qui le rend étrange.\n\n## L'Homme au sable\n\nPour mettre sa thèse à l'épreuve, Freud choisit un conte de E. T. A. Hoffmann, *L'Homme au sable*. Il y est question de « l'homme au sable qui arrache les yeux aux enfants », et d'un jeune héros, Nathanaël. Le récit met aussi en scène une poupée, Olympia.\n\nUn auteur avait écrit avant lui sur l'inquiétant : Jentsch, en 1906[^2]. Freud résume sa thèse ainsi : il trouve « la condition essentielle à la genèse du sentiment de l'inquiétante étrangeté dans l'incertitude intellectuelle ». Je ne sais pas si cette chose est vivante ou non, et c'est cela qui me trouble. Une poupée dont on se demande si elle est animée en serait l'exemple, et Olympia semblait l'illustrer à merveille.\n\nFreud refuse de s'en contenter : « Une incertitude intellectuelle ne nous aidera en rien à comprendre cette impression-là », écrit-il à propos du conte. Ce qui terrifie dans l'histoire, c'est la menace sur les yeux. Il en tire une interprétation qui est restée célèbre : « la crainte pour les yeux, la peur de devenir aveugle, est un substitut fréquent de la peur de la castration ». Et, dans une note, il lit Olympia comme « en quelque sorte un complexe détaché de Nathanaël qui se présente à lui », c'est-à-dire un élément de lui-même qui lui revient du dehors[^1].\n\n> **Illustration.** Un mannequin de vitrine dont on se demande, une demi-seconde, s'il a bougé. Jentsch aurait reconnu là son incertitude sur le vivant. Freud ne nie pas que ce doute existe, il dit qu'il n'est pas l'essentiel. La robotique a retrouvé le sujet : l'essai de Masahiro Mori sur la « vallée de l'étrange » a été rapproché de l'inquiétant par Reichardt en 1978[^2]. Freud, lui, cherche de l'autre côté : dans ce que la figure réveille en nous.\n\n## Le double\n\nLe thème du double occupe une place importante dans le texte. Freud s'appuie sur Otto Rank, pour qui le double a d'abord été une protection : un « énergique démenti à la puissance de la mort ». Se doubler, c'est assurer sa survie[^1].\n\nMais ce qui rassurait finit par épouvanter. Freud écrit que le double s'est transformé en image d'épouvante « à la façon dont les dieux, après la chute de la religion », changent de signe. Un ancien allié du moi, devenu étranger au moi, revient sous l'aspect d'un intrus qui lui ressemble.\n\n## La répétition\n\nFreud donne un exemple tiré de sa propre expérience. Un brûlant après-midi d'été, il parcourt les rues vides et inconnues d'une petite ville italienne, et il se retrouve plusieurs fois au même endroit sans l'avoir voulu. L'effet est un malaise, que rien dans le lieu ne justifiait. Il en tire une règle : c'est « la répétition involontaire qui nous fait paraître étrangement inquiétant ce qui par ailleurs serait innocent »[^1].\n\nIl cite aussi le cas du nombre : on rencontre « le chiffre 62 plusieurs fois le même jour », et l'on se prend à penser qu'il y a là un dessein. Le même nombre, rencontré une fois, n'aurait rien dit.\n\n> **Illustration.** Vous apprenez le prénom d'une personne inconnue, et dans l'heure suivante vous le lisez sur une affiche, l'entendez dans une conversation voisine, le retrouvez sur un ticket. Chaque occurrence est banale. C'est leur retour, sans que vous l'ayez cherché, qui donne l'impression d'un message.\n\n## Deux origines\n\nFreud ramène les situations inquiétantes à deux sources, qu'il distingue.\n\nLa première est le retour de **complexes infantiles refoulés**. Ici entrent la peur de la castration, déjà vue à propos des yeux, mais aussi des fantasmes plus archaïques : Freud va jusqu'à rattacher l'effroi d'être enterré vivant, que « bien des gens » décerneraient comme « la couronne » de l'inquiétante étrangeté, à un fantasme de vie dans le corps maternel[^1].\n\nLa seconde est la réapparition de **convictions primitives surmontées**. Elle se produit quand ces croyances, que nous avons laissées derrière nous, « semblent de nouveau être confirmées » par un événement. Freud remarque que tout ce qui nous semble aujourd'hui étrangement inquiétant se rattache à ces restes[^1].\n\nDans les deux cas, ce qui inquiète n'est pas nouveau. C'est ancien, connu, familier, et c'est le refoulement qui l'a rendu étranger. D'où la phrase qui résume le texte : « Le préfixe « un » placé devant ce mot est la marque du refoulement. » Le préfixe négatif ne supprime pas le familier, il atteste qu'il a été écarté, et qu'il revient.\n\n## La fiction et la vie\n\nFreud consacre la dernière partie du texte à la littérature. L'inquiétante étrangeté dans la fiction est, écrit-il, « beaucoup plus pleine et riche » que dans la vie réelle, et bien des choses ne sont pas inquiétantes dans un récit qui le seraient si elles se produisaient dans la vie.\n\nÀ l'inverse, il remarque qu'il ne saurait citer « un seul vrai conte de fées où se fasse quelque chose d'étrangement inquiétant »[^1]. Le même fait n'a donc pas le même effet selon le monde où le récit nous place.\n\nCe qui reste de ce texte, au-delà de la formule, c'est sa démarche : prendre un mot de tous les jours, voir ce qu'il cache, puis chercher dans l'expérience ce que ce double sens désigne.","quiz":[{"question":"Que découvre Freud en examinant le mot heimlich dans les dictionnaires ?","choix":["Qu'il n'a qu'un seul sens, celui de familier, sans ambiguïté","Qu'il vient du latin et désignait le foyer des Romains","Qu'il ne s'emploie que pour parler des fantômes et des morts","Qu'il désigne aussi ce qui est caché, et rejoint ainsi son contraire"],"bonne":3,"explication":"Heimlich signifie à la fois familier et caché, secret. Dans ce second emploi, il coïncide avec unheimlich, ce que montre la définition de Schelling. Le mot vient de Heim, la maison, et ne se limite pas à un domaine précis."},{"question":"Selon Freud, qu'est-ce qui rend L'Homme au sable inquiétant ?","choix":["La menace de perdre les yeux, substitut de la peur de la castration","L'incertitude sur la poupée Olympia, vivante ou automate","Le fait que l'histoire se passe à l'étranger","Le style de l'auteur, volontairement obscur"],"bonne":0,"explication":"Freud écarte l'explication de Jentsch (l'incertitude sur le vivant) et la déclare insuffisante. Pour lui, la crainte pour les yeux est un substitut fréquent de la peur de la castration. Le lieu et le style ne sont pas en cause."},{"question":"Que marque le préfixe « un » dans unheimlich ?","choix":["Une simple négation qui fait disparaître le familier","Le caractère entièrement nouveau de ce qui inquiète","La marque du refoulement : le familier revient sous un jour étranger","Une nuance de politesse propre à la langue allemande"],"bonne":2,"explication":"Le préfixe ne supprime pas le familier, il atteste son refoulement et son retour. L'inquiétant n'est pas le nouveau, c'est l'ancien devenu étranger. Il ne s'agit ni d'une nuance de politesse, ni d'une nouveauté absolue."},{"question":"Un patient raconte son malaise en revoyant, adulte, la chambre de son enfance chez ses parents : « Tout était pareil, et ça m'a glacé. » Quelle lecture freudienne s'impose ?","choix":["Le lieu lui est devenu inconnu, et l'inconnu l'inquiète","Il doute de la réalité de la chambre, comme devant un automate","Un familier ancien, écarté, lui revient : c'est le propre de l'unheimlich","Il a simplement oublié à quoi ressemblait sa chambre"],"bonne":2,"explication":"L'inquiétant n'est pas le nouveau, mais l'ancien et familier que le refoulement a rendu étranger et qui revient. L'incertitude sur le vivant (la thèse de Jentsch) n'est pas en cause."}],"sources":[{"texte":"Freud, L'inquiétante étrangeté (1919), trad. Marie Bonaparte et E. Marty (1933), dans Essais de psychanalyse appliquée (PDF)","url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/l-inquietante-etrangete-1919.pdf"},{"texte":"Wikipédia (anglais), « Uncanny » : Jentsch (1906), Freud (1919), le double, heimlich/unheimlich, « vallée de l'étrange »","url":"https://en.wikipedia.org/wiki/Uncanny"}]},{"id":"kierkegaard-angoisse","discipline":"philosophie","titre":"L'angoisse, vertige de la liberté","figure":"Søren Kierkegaard","branche":"fondamentaux","fiabilite":"secondaire","fiabilite_note":"Les passages de Kierkegaard sont cités en anglais, dans la traduction de Reidar Thomte (Princeton, 1980), tels que les reproduisent l'Encyclopédie de Stanford et d'autres commentaires ; la traduction française de 1935 n'a pas été consultée.","reference":"Le Concept d'angoisse (17 juin 1844), sous le pseudonyme de Vigilius Haufniensis","accroche":"La peur a un objet. L'angoisse n'en a pas, ou plutôt son objet est un rien. Kierkegaard y voit la marque même de la liberté.","punch":"L'angoisse n'a pas d'objet. Elle a un possible.","idee":"L'angoisse se distingue de la peur : elle ne porte sur rien de déterminé, mais sur le possible. Devant l'abîme, ce qui donne le vertige n'est pas seulement le vide, c'est la possibilité de s'y jeter. L'angoisse est le vertige de la liberté.","citation":"anxiety is the dizziness of freedom, which emerges when the spirit wants to posit the synthesis","citation_source":"Kierkegaard, Le Concept d'angoisse (1844), trad. anglaise R. Thomte, p. 61, cité par l'Encyclopédie de Stanford — « l'angoisse est le vertige de la liberté, qui surgit quand l'esprit veut poser la synthèse »","citation_url":"https://plato.stanford.edu/entries/kierkegaard/","liens":["freud-inquietante-etrangete","pascal-divertissement","freud-moi-pas-maitre"],"texte":"*Le Concept d'angoisse* paraît à Copenhague le 17 juin 1844, sous un pseudonyme, comme une grande partie de l'œuvre de Kierkegaard[^2]. L'auteur fictif s'appelle Vigilius Haufniensis, forme latinisée du « veilleur de Copenhague »[^1]. Le sous-titre annonce une « simple réflexion d'orientation psychologique sur la question dogmatique du péché héréditaire »[^2].\n\nDerrière la question théologique, Kierkegaard élabore une des descriptions les plus précises qu'on ait de l'angoisse, et il en fait autre chose qu'un trouble : elle n'est pas seulement un état pathologique, elle est « une conscience de la liberté »[^1].\n\n## Peur et angoisse\n\nLa première distinction est devenue classique. La peur se rapporte à quelque chose de déterminé : un danger, une menace identifiable, un chien qui grogne, une falaise qui s'effrite. L'angoisse, elle, est une inquiétude sans objet[^3]. Son seul « objet » est un rien.\n\nCe rien n'est pas un néant pur. Le *Dictionnaire de la philosophie* de Larousse le résume ainsi : l'angoisse caractérise la réalité de la liberté « comme ce possible qui est un rien »[^3]. C'est ce qui n'est pas encore, ce qu'on pourrait faire ou devenir. L'angoisse surgit quand la liberté se découvre comme pouvoir, avant même de savoir ce qu'elle peut.\n\n> **Illustration (pas un exemple de Kierkegaard).** La veille d'un examen, vous avez peur de la question sur Hegel : c'est une peur, elle a un objet, et vous pouvez y répondre en révisant Hegel. Mais le soir où vous recevez une offre pour partir vivre à l'étranger, rien ne vous menace, et pourtant vous ne dormez pas. Ce n'est pas un danger qui vous tient éveillé. C'est le fait que tout est possible, et que c'est à vous de choisir. Kierkegaard réserve le mot « angoisse » à ce second état.\n\n## L'innocence et l'interdit\n\nKierkegaard relit la scène de la Genèse. Adam, dans l'innocence, ne sait pas ce que sont le bien et le mal. L'angoisse est d'abord ce « rien effrayant d'une ignorance innocente » ; elle procède ensuite de l'interdit, « qui éveille la possibilité de la liberté »[^3]. L'interdit ne peut pas être compris comme une menace précise, puisqu'Adam ne sait pas ce que serait le mal. Mais il éveille en lui le possible : il ne sait pas ce qu'il peut, mais il sent qu'il peut.\n\nL'angoisse est donc profondément ambiguë. Kierkegaard la décrit comme une « antipathie sympathique » et une sympathie antipathique[^1] : elle attire ce qu'elle redoute et redoute ce qui l'attire.\n\n> **Illustration.** Un enfant à qui l'on dit de ne pas ouvrir une certaine porte n'en avait jamais remarqué l'existence. Désormais, il y pense sans cesse. Il en a peur et il en a envie, sans savoir ce qu'il y a derrière. Ce n'est pas la pièce qui l'occupe : c'est la possibilité, ouverte par l'interdit, de faire quelque chose qu'il ne pouvait pas imaginer avant.\n\n## Le vertige\n\nD'où l'image la plus célèbre du livre. L'angoisse peut être comparée au vertige : celui dont l'œil plonge dans l'abîme béant est pris de vertige. Mais quelle en est la cause ? Elle tient, écrit Kierkegaard, « tout autant à son œil qu'à l'abîme », car il aurait pu ne pas regarder en bas[^4].\n\nAinsi l'angoisse est le vertige de la liberté : il surgit quand la liberté « plonge le regard dans sa propre possibilité » et se saisit du fini pour s'y retenir[^1][^4].\n\n> **Illustration.** Beaucoup de personnes connaissent ce trouble au bord d'un quai de métro ou d'un balcon : non pas la peur de tomber, mais l'idée soudaine qu'on *pourrait* sauter. On recule, troublé d'avoir pensé cela. Ce n'est pas un désir de mourir : c'est la conscience brutale qu'on est libre d'un geste que rien n'empêche. Le vide n'effraie pas seul ; c'est le pouvoir qu'on a devant lui.\n\n## Une éducation par l'angoisse\n\nLe dernier chapitre surprend. L'angoisse n'y est pas un mal à supprimer, mais une formatrice : celui qui a appris à s'angoisser comme il faut, dit Kierkegaard, a appris ce qu'il y a de plus important[^2].\n\nPourquoi ? Parce que l'angoisse défait les sécurités illusoires. Elle montre que rien de fini ne protège absolument : ni la fortune, ni la réputation, ni les habitudes. Pour Kierkegaard, croyant, elle conduit à la foi, seule capable de la traverser sans la fuir.\n\n> **Illustration.** Une personne qui a toujours tout prévu traverse une période où les choses lui échappent : une séparation, une maladie, un licenciement. Elle découvre que ses assurances ne la protégeaient pas de l'essentiel. Si elle ne se réfugie pas immédiatement dans de nouvelles certitudes, elle peut en sortir moins rigide, plus capable de vivre avec l'incertain. C'est, en termes laïques, ce que veut dire apprendre à s'angoisser comme il faut.\n\n## Ce qui reste, sans la foi\n\nOn peut ne pas suivre Kierkegaard jusqu'à la foi et retenir la structure. L'angoisse n'est pas un simple dysfonctionnement : elle signale le rapport d'un sujet à son propre possible, à ce qu'il pourrait faire et à ce qu'il pourrait perdre.\n\nLa philosophie du XXe siècle a repris cette distinction. Chez Heidegger, l'angoisse, à la différence de la peur, ne porte sur aucun étant particulier ; et Sartre, empruntant à Kierkegaard et à Heidegger, la conçoit comme une détermination de la conscience de liberté[^3]. La clinique distingue elle aussi, avec ses propres outils, la peur d'un danger identifiable et l'angoisse sans objet assignable.","quiz":[{"question":"Qu'est-ce qui distingue l'angoisse de la peur chez Kierkegaard ?","choix":["La peur a un objet déterminé, l'angoisse a pour objet un rien, le possible","La peur est mentale, alors que l'angoisse est corporelle","L'angoisse est simplement une peur plus intense que les autres","La peur est réservée aux enfants, l'angoisse aux adultes"],"bonne":0,"explication":"L'angoisse est une inquiétude sans objet : son « objet » est le possible, la liberté elle-même. Ce n'est ni une affaire de corps, ni un degré de la peur, et elle est déjà présente dans l'innocence."},{"question":"Que montre l'image du vertige devant l'abîme ?","choix":["Que la hauteur est objectivement dangereuse pour tous","Que l'homme a naturellement peur du vide par instinct","Que le vertige vient autant du regard que de l'abîme","Qu'il faut éviter de s'approcher des précipices"],"bonne":2,"explication":"Le vertige tient « tout autant à son œil qu'à l'abîme » : c'est la liberté plongeant dans sa propre possibilité qui donne le vertige."},{"question":"Quelqu'un accepte une promotion qu'il désirait depuis des années, et la nuit suivante il ne dort pas, sans savoir de quoi il a peur. Comment Kierkegaard nommerait-il cet état ?","choix":["Une peur, puisqu'un nouveau poste comporte toujours des dangers précis","Une angoisse : rien ne le menace, mais un possible s'est ouvert devant lui","Un remords, puisqu'il regrette déjà d'avoir accepté le poste","Une mélancolie, puisqu'il pleure sa vie d'avant"],"bonne":1,"explication":"Aucun danger identifiable, mais un champ de possibles qui dépend de lui : c'est l'angoisse au sens de Kierkegaard, distincte de la peur, qui a un objet."},{"question":"Quel rôle le dernier chapitre attribue-t-il à l'angoisse ?","choix":["Un symptôme qu'il faut éliminer par la raison et la volonté","Une éducatrice : bien s'angoisser, c'est apprendre l'essentiel","Une punition divine infligée à l'homme pour le péché","Un état réservé aux esprits faibles et mélancoliques"],"bonne":1,"explication":"Celui qui a appris à s'angoisser comme il faut a appris ce qu'il y a de plus important : l'angoisse éduque. Kierkegaard ne veut ni l'éliminer, ni en faire une punition, ni la réserver aux faibles."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Søren Kierkegaard », section 2 (vertige de la liberté, antipathie sympathique, Vigilius Haufniensis)","url":"https://plato.stanford.edu/entries/kierkegaard/"},{"texte":"Wikipédia (anglais), « The Concept of Anxiety » (date, sous-titre, apprendre à s'angoisser)","url":"https://en.wikipedia.org/wiki/The_Concept_of_Anxiety"},{"texte":"Jean-Marie Vaysse, « Angoisse », Dictionnaire de la philosophie, Larousse (Kierkegaard, Heidegger, Sartre)","url":"https://www.larousse.fr/encyclopedie/philosophie/angoisse/191216"},{"texte":"Maria Popova, « Kierkegaard on Anxiety and Creativity », The Marginalian, 2013 (passage du vertige, trad. Princeton)","url":"https://www.themarginalian.org/2013/06/19/kierkegaard-on-anxiety-and-creativity/"}]},{"id":"klein-positions","discipline":"psychanalyse","titre":"Les deux positions","figure":"Melanie Klein","branche":"objet","fiabilite":"primaire","fiabilite_note":"L'article de 1946 est cité dans sa version anglaise originale ; les citations sont traduites ici.","reference":"Notes sur quelques mécanismes schizoïdes (1946)","accroche":"Pour Melanie Klein, le nourrisson ne vit pas dans un monde paisible. Il aime et hait avec une violence extrême, et la santé psychique commence quand il découvre que c'est la même personne.","punch":"Grandir, c'est découvrir qu'on a haï ce qu'on aime.","idee":"Dans la position paranoïde-schizoïde, le bébé clive le sein en « bon » et « mauvais » et vit une angoisse de persécution. Dans la position dépressive, il saisit l'objet comme un tout : naissent alors l'ambivalence, la culpabilité et le désir de réparer.","repere":"Le nom « position paranoïde-schizoïde » combine deux termes : « position paranoïde », qu'employait Klein elle-même, et « position schizoïde », de Fairbairn. Klein l'explique dans une note de l'article de 1946, publié en mai de cette année-là.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","freud-deuil-melancolie"],"texte":"« Notes on Some Schizoid Mechanisms » paraît en mai 1946. L'article introduit les idées de position paranoïde-schizoïde et de clivage[^2]. Il propose aussi un terme appelé à faire carrière, l'*identification projective*. Klein y décrit la vie psychique des tout premiers mois, à partir de ce que l'analyse d'enfants et d'adultes lui a appris.\n\n## Le sein clivé\n\nLe point de départ est l'expérience de la frustration et de la satisfaction. Le sein de la mère devient, pour l'enfant, « clivé en un sein bon (gratifiant) et un sein mauvais (frustrant) ». Ce clivage, précise Klein, « aboutit à une séparation de l'amour et de la haine »[^1].\n\nL'enfant ne connaît pas encore une mère entière qui tantôt nourrit et tantôt fait attendre. Il a affaire à deux objets distincts : l'un tout bon, l'autre tout mauvais. Klein décrit même un contraste dans la façon dont ils sont éprouvés : le sein frustrant est vécu « en fragments », tandis que le sein gratifiant, incorporé, est vécu comme complet[^1].\n\n> **Illustration (pas une observation de Klein).** À l'âge adulte, on voit parfois ce mouvement à l'œuvre : un collègue nouvellement arrivé est « formidable » pendant trois semaines, puis, après une remarque maladroite, « nul » du jour au lendemain. La personne est la même ; c'est l'image qui s'est coupée en deux. Klein décrit le clivage chez le nourrisson, et l'exemple ne prétend pas que l'adulte se comporte comme lui : il montre seulement de quel genre de mécanisme il s'agit.\n\n## Persécution et idéalisation\n\nLe clivage a deux conséquences. D'une part, « la haine et l'angoisse de persécution s'attachent au sein frustrant ». Le mauvais objet est vécu comme une menace : c'est la raison pour laquelle Klein parle de position *paranoïde*. D'autre part, « l'idéalisation est liée au clivage de l'objet » : le bon objet est idéalisé pendant que la haine va au mauvais[^1].\n\nElle ajoute un point sur les ressources de l'enfant : le déni de la réalité psychique ne devient possible, écrit-elle, que grâce à de forts sentiments de toute-puissance[^1].\n\n## L'identification projective\n\nDans cet article, Klein donne un nom à un processus qu'elle décrit : « Je propose pour ces processus le terme d'*identification projective* ». Elle y voit le prototype d'une relation d'objet agressive[^1].\n\nLe terme aura une longue postérité. Bion, notamment, développera la notion à partir de Klein (voir la fiche sur la rêverie).\n\n## La position dépressive\n\nL'autre pôle apparaît plus tard dans la première année. L'enfant introjecte l'objet comme un tout : l'objet aimé et l'objet haï ne font plus qu'un. Klein écrit alors que « la position dépressive est passée au premier plan ». L'expérience même des sentiments dépressifs contribue à intégrer davantage le moi[^1].\n\nCette intégration a un coût : l'enfant sent désormais que ses impulsions agressives visent la personne qu'il aime. Apparaissent un sentiment de culpabilité, l'ambivalence (la présence conjointe de l'amour et de la haine envers le même objet), et un mouvement nouveau : « le désir de réparer, qui passe au premier plan à ce stade ». L'agressivité ne disparaît pas, elle est désormais tenue ensemble avec l'amour[^3].\n\n> **Illustration (pas un cas de Klein).** Un enfant qui a rageusement jeté son nounours, puis qui se précipite pour le ramasser et le serrer en sanglotant a quelque chose de ce mouvement : la même peluche qu'il a malmenée est celle qu'il veut maintenant consoler. La scène fait voir ce que « réparer » veut dire.\n\n## Pourquoi « position » ?\n\nLe mot est un choix de Klein, et l'article de 1946 en dit l'origine. Dans une note, elle explique que son expression habituelle était « position paranoïde » et qu'elle l'avait employée comme équivalent de la « position schizoïde » de Fairbairn. Après réflexion, écrit-elle, elle a décidé de combiner le terme de Fairbairn avec le sien[^1]. D'où la « position paranoïde-schizoïde », qui précède la position dépressive.\n\nElle discute d'ailleurs Fairbairn : elle juge que son terme conviendrait s'il couvrait à la fois la crainte de persécution et les mécanismes schizoïdes, et elle conteste que seul le mauvais objet soit d'abord intériorisé[^1].\n\nLe choix de « position » plutôt que de « stade » est souvent commenté : on parle chez Klein d'une théorie des positions plutôt que d'une théorie des stades[^3]. Une position n'est pas une étape qu'on franchit une fois pour toutes ; l'article de 1946, cependant, parle surtout des premiers mois.\n\n## Ce qu'il faut garder\n\nLa force de cette théorie tient à ce qu'elle replace la haine et l'amour dès l'origine, et qu'elle décrit la maturité comme la capacité de tenir ensemble ce que l'enfant sépare d'abord. Cette idée a été reprise, discutée et critiquée par d'autres psychanalystes, de Winnicott à Bion. Elle repose sur une description très audacieuse de l'expérience du nourrisson, que l'on ne peut pas observer directement. Elle se lit comme un modèle théorique, formé à partir de l'analyse, plutôt que comme un constat.","quiz":[{"question":"Que produit le clivage de l'objet dans la position paranoïde-schizoïde ?","choix":["Un sein unique, qui est tantôt bon, tantôt mauvais","Une réparation immédiate de l'objet détruit en fantasme","Un sein bon et un sein mauvais, avec séparation de l'amour et de la haine","Un refoulement du désir œdipien du bébé"],"bonne":2,"explication":"Klein décrit un sein « clivé en un sein bon et un sein mauvais », d'où une séparation de l'amour et de la haine. La réparation relève de la position dépressive, et le refoulement œdipien n'est pas le sujet de cet article."},{"question":"Quel terme Klein propose-t-elle dans l'article de 1946 pour désigner le fait de projeter des parties de soi dans l'objet ?","choix":["La sublimation","La formation réactionnelle","Le transfert","L'identification projective"],"bonne":3,"explication":"C'est l'article de 1946 qui introduit « identification projective » (« I suggest for these processes the term 'projective identification' »). Les trois autres termes existent en psychanalyse mais désignent d'autres notions."},{"question":"Que se passe-t-il dans la position dépressive ?","choix":["L'objet aimé et l'objet haï ne font qu'un : culpabilité et réparation apparaissent","L'enfant se persuade que sa mère le déteste réellement","L'enfant n'a plus besoin de sa mère pour être nourri","L'enfant nie complètement toute agressivité envers ses parents"],"bonne":0,"explication":"L'introjection de l'objet comme un tout fait passer la position dépressive au premier plan : ambivalence, culpabilité et désir de réparer. L'enfant ne découvre ni une haine réelle de la mère, ni une autonomie, et l'agressivité n'est pas niée mais tenue avec l'amour."},{"question":"Une patiente décrit sa nouvelle thérapeute comme « parfaite », puis, après une séance annulée, comme « nulle et indifférente ». Quel mécanisme kleinien reconnaît-on ?","choix":["La réparation, qui suit la culpabilité de la position dépressive","Le clivage de l'objet en tout bon et tout mauvais, avec idéalisation","La sublimation, qui détourne la pulsion vers un but social","Le refoulement d'un souvenir d'enfance précis"],"bonne":1,"explication":"L'objet est coupé en deux images opposées, l'une idéalisée, l'autre persécutrice : c'est le clivage de la position paranoïde-schizoïde. La position dépressive, à l'inverse, tient ensemble le bon et le mauvais."}],"sources":[{"texte":"Klein, M., « Notes on Some Schizoid Mechanisms » (1946), Int. J. Psycho-Anal. (PDF)","url":"https://psptraining.com/wp-content/uploads/Klein-M.-1946.-Notes-on-some-schizoid-mechanisms.pdf"},{"texte":"British Psychoanalytical Society, « Melanie Klein's paper, 'Notes on Some Schizoid Mechanisms' is published » (4 mai 1946)","url":"https://psychoanalysis.org.uk/who-we-are/100-years-of-history/melanie-kleins-paper-notes-some-schizoid-mechanisms-published"},{"texte":"Wikipédia (anglais), « Depressive position »","url":"https://en.wikipedia.org/wiki/Depressive_position"}]},{"id":"aristote-akrasia","discipline":"philosophie","titre":"L'akrasia","figure":"Aristote","branche":"fondamentaux","fiabilite":"primaire","fiabilite_note":"Le livre VII est cité d'après la traduction anglaise de W. D. Ross, dans le domaine public ; les passages traduits en français le sont ici.","reference":"Éthique à Nicomaque, livre VII, chap. 1–10 (IVe s. av. J.-C.)","accroche":"Vous savez que c'est une mauvaise idée. Vous le faites quand même. Socrate disait que c'était impossible. Aristote prend le parti des faits.","punch":"Savoir ce qui est bien et faire le contraire : Socrate le jugeait impossible.","idee":"Pour Socrate, nul ne fait le mal volontairement : agir mal, c'est ignorer. Aristote objecte que l'incontinent sait, mais d'un savoir qu'il « a » sans l'exercer, comme l'homme ivre qui récite des vers d'Empédocle sans les comprendre.","repere":"Akrasia (ἀκρασία) : littéralement « absence de maîtrise ». On traduit par incontinence ou faiblesse de la volonté. Son contraire est l'enkrateia, la maîtrise de soi ; il ne faut pas la confondre avec l'intempérance (akolasia), qui est un vice.","liens":["freud-moi-pas-maitre","spinoza-desir","pascal-divertissement"],"texte":"Socrate soutenait une thèse qui semble contredire l'expérience la plus banale : personne n'agit contre ce qu'il juge le meilleur. Si quelqu'un agit mal, c'est qu'il se trompe sur ce qui est bon pour lui. La faute vient de l'ignorance.\n\nAristote ouvre la discussion du livre VII de l'*Éthique à Nicomaque* en constatant que cette thèse contredit manifestement les faits observés[^1]. Il y a bien des gens qui savent qu'une chose est mauvaise et qui la font, entraînés par le désir. Mais il ne se contente pas de donner tort à Socrate : il cherche en quel sens on peut savoir et agir contre son savoir.\n\n> **Illustration.** Il est 23 heures. Vous avez décidé, pour de bonnes raisons, d'éteindre l'écran et de dormir : demain commence tôt. Vous le savez, vous pourriez l'expliquer à quelqu'un. Une heure plus tard, vous regardez encore des vidéos. Le lendemain, vous vous le reprochez. Ce n'est pas que vous ignoriez les raisons de dormir. C'est que, sur le moment, elles n'agissaient pas. C'est exactement ce cas que le livre VII veut comprendre.\n\n## Avoir un savoir sans s'en servir\n\nLa distinction centrale est entre *posséder* un savoir et *l'exercer*. On dit de deux personnes qu'elles savent : celle qui a un savoir mais ne s'en sert pas, et celle qui s'en sert[^1]. Ce n'est pas la même chose d'agir mal en ayant à l'esprit, au moment même, ce qu'il faudrait faire, et d'agir mal en le sachant seulement d'une manière dormante.\n\nAristote donne des images frappantes. Les incontinents sont dans un état semblable à celui des gens endormis, fous ou ivres : les passions, comme la colère ou les désirs sexuels, altèrent même le corps. Le fait qu'ils prononcent les bonnes maximes ne prouve rien. Les gens ivres récitent bien des vers d'Empédocle. Et les débutants enchaînent les phrases d'une science sans encore la connaître : il faut que le savoir fasse corps avec eux, et cela demande du temps[^1].\n\n> **Illustration.** Un étudiant récite parfaitement la définition de l'impératif catégorique la veille de l'examen. Il la « possède ». Mais il ne saurait pas reconnaître, dans une situation concrète, ce qu'elle exige. Aristote dirait qu'il a les mots sans le savoir. L'incontinent est dans une position comparable vis-à-vis de ses propres principes : il peut les dire, il ne les a pas en acte.\n\n## Le syllogisme pratique\n\nAristote décrit l'action comme la conclusion d'un raisonnement. Une prémisse générale, une prémisse particulière, et l'action suit, comme une conclusion. Dans la traduction anglaise de W. D. Ross : « tout ce qui est sucré doit être goûté », « ceci est sucré » ; celui qui peut agir et n'en est pas empêché goûte aussitôt[^1].\n\nChez l'incontinent, deux prémisses générales sont présentes à la fois. L'une lui interdit de goûter. L'autre dit que tout ce qui est sucré est agréable. Et la prémisse particulière, « ceci est sucré », est active. Si l'appétit est là, c'est lui qui s'empare de la conclusion : le désir pousse le corps, et l'action suit. L'incontinent agit ainsi, en un sens, sous l'effet d'un raisonnement et d'une opinion[^1].\n\nD'où une conclusion nuancée : en un sens, ce que Socrate voulait établir semble se vérifier. Ce n'est pas la connaissance au sens propre qui est vaincue par la passion. C'est une connaissance qui porte sur le particulier, sur la perception de la situation, et qui n'était pas pleinement exercée.\n\n## Incontinent et intempérant\n\nAristote distingue soigneusement deux figures qui se ressemblent de loin.\n\nL'**intempérant** poursuit les plaisirs excessifs par choix, persuadé que c'est ainsi qu'il faut vivre. Il ne se repent pas, puisqu'il s'en tient à son choix. C'est pourquoi Aristote le juge incurable.\n\nL'**incontinent**, lui, agit contre son propre choix. Il sait que ce qu'il fait est mauvais, et il le regrette ensuite. Son principe, sa conviction de fond, reste bon. C'est pourquoi il est plus facile à persuader, et curable[^1].\n\n> **Illustration.** Deux personnes boivent trop chaque soir. La première trouve que c'est très bien ainsi et ne voit aucune raison de changer : elle est, au sens d'Aristote, intempérante. La seconde se promet chaque matin d'arrêter et cède chaque soir : elle est incontinente. De l'extérieur, les deux conduites sont identiques. De l'intérieur, tout les sépare, et c'est sur la seconde que la parole d'un autre a prise.\n\n## Ce que le texte laisse ouvert\n\nCette division intérieure, vouloir et ne pas vouloir, savoir et ne pas savoir, est l'un des plus anciens points d'appui de la réflexion sur le sujet. Aristote la pense encore dans les termes d'une âme où la raison devrait commander et où l'appétit, parfois, la court-circuite.\n\nLa philosophie contemporaine a repris la question sous le nom de « faiblesse de la volonté », et elle reste disputée : est-il seulement possible d'agir librement contre son meilleur jugement présent[^2] ? L'interprétation du texte d'Aristote lui-même fait débat, notamment sur ce que l'incontinent « sait » au moment d'agir[^3]. On peut aussi se demander, avec d'autres outils, si ce qui « l'emporte » n'a pas lui aussi ses raisons propres, qui ne sont pas celles que le sujet se donne.","quiz":[{"question":"Quelle thèse socratique l'analyse de l'akrasia met-elle en difficulté ?","choix":["Nul n'agit contre ce qu'il juge le meilleur, la faute vient de l'ignorance","La vertu ne peut pas s'enseigner, puisque les sages n'ont pas de disciples","Le plaisir est le seul bien véritable pour l'être humain","La cité juste exige que les philosophes gouvernent la cité"],"bonne":0,"explication":"Socrate tient que la faute vient de l'ignorance : l'akrasia, où l'on agit contre ce qu'on sait, semble le contredire. La question de l'enseignement de la vertu est discutée ailleurs, l'hédonisme n'est pas la position socratique, et le philosophe-roi relève de la République."},{"question":"Une infirmière qui connaît parfaitement les risques du tabac fume une cigarette après une garde difficile, en se disant « je sais ». Quelle distinction d'Aristote éclaire son cas ?","choix":["Entre le savoir divin et le savoir humain","Entre ce que l'on désire et ce que l'on mérite","Entre posséder un savoir et l'exercer au moment d'agir","Entre la mémoire et l'imagination"],"bonne":2,"explication":"Elle possède le savoir, elle pourrait l'énoncer, mais il n'est pas actif dans la situation, comme chez l'homme endormi ou ivre. C'est le cœur de l'analyse du livre VII."},{"question":"Que montre l'exemple de l'homme ivre qui récite des vers d'Empédocle ?","choix":["Que la poésie rend les hommes incontinents et faibles","Que l'ivresse améliore la mémoire des textes appris","Que prononcer les bonnes maximes ne prouve pas qu'on les a à l'esprit en agissant","Qu'Empédocle était lui-même un incontinent notoire à Athènes"],"bonne":2,"explication":"On peut dire les mots justes sans que le savoir soit actif, comme l'homme ivre récite des vers ou le débutant enchaîne des phrases qu'il ne comprend pas encore. Aristote ne juge ni la poésie, ni la mémoire, ni Empédocle."},{"question":"En quoi l'incontinent diffère-t-il de l'intempérant ?","choix":["L'incontinent recherche les plaisirs avec plus de mesure","L'intempérant ignore ce qu'est le plaisir","Aristote emploie les deux mots indifféremment","L'incontinent agit contre son choix et le regrette ; l'intempérant, par choix"],"bonne":3,"explication":"L'intempérant s'en tient à son choix et ne se repent pas, ce qui le rend incurable. L'incontinent agit contre ce qu'il a choisi et se repent, ce qui le rend curable. La distinction ne porte ni sur la mesure ni sur la connaissance du plaisir."}],"sources":[{"texte":"Aristote, Éthique à Nicomaque, livre VII, trad. anglaise de W. D. Ross (MIT Internet Classics Archive)","url":"http://classics.mit.edu/Aristotle/nicomachaen.7.vii.html"},{"texte":"Stanford Encyclopedia of Philosophy, « Weakness of Will »","url":"https://plato.stanford.edu/entries/weakness-will/"},{"texte":"Stanford Encyclopedia of Philosophy, « Aristotle's Ethics »","url":"https://plato.stanford.edu/entries/aristotle-ethics/"}]},{"id":"winnicott-mere-suffisamment-bonne","discipline":"psychanalyse","titre":"La mère suffisamment bonne","figure":"Donald W. Winnicott","branche":"objet","fiabilite":"primaire","fiabilite_note":"L'article de 1953 est cité dans sa réimpression anglaise, les citations étant traduites ici ; Winnicott a développé ces thèmes dans d'autres écrits que la fiche ne couvre pas.","reference":"Objets transitionnels et phénomènes transitionnels (lu en 1951, publié en 1953) ; repris dans Jeu et réalité (1971)","accroche":"Winnicott n'a jamais demandé aux mères d'être parfaites. Il a décrit une mère qui échoue, juste ce qu'il faut, et au bon moment.","punch":"Après avoir donné l'illusion, la mère a pour tâche la désillusion.","idee":"Au début, la mère s'adapte presque complètement aux besoins du nourrisson, qui vit l'illusion de créer ce qu'il trouve. Puis elle s'adapte de moins en moins complètement : c'est la désillusion. Dans l'entre-deux apparaît l'objet transitionnel, à mi-chemin du dedans et du dehors.","citation":"The good-enough mother, as I have stated, starts off with an almost complete adaptation to her infant's needs","citation_source":"Winnicott, « Transitional Objects and Transitional Phenomena » (lu à la Société britannique de psychanalyse le 30 mai 1951, publié en 1953), p. 238 de la réimpression — « La mère suffisamment bonne, comme je l'ai dit, commence par une adaptation presque complète aux besoins de son nourrisson »","citation_url":"https://hegel1313.law.columbia.edu/files/2026/05/winnicott_transitional_objects_and_transitional_phenomena.pdf","liens":["lacan-stade-du-miroir","klein-positions","bion-reverie"],"texte":"Le texte où apparaît la « mère suffisamment bonne » (*good-enough mother*) porte un titre qui ne la nomme pas : « Objets transitionnels et phénomènes transitionnels », sous-titré « une étude de la première possession non-moi ». Winnicott l'a lu devant la Société britannique de psychanalyse le 30 mai 1951 et publié dans l'*International Journal of Psycho-Analysis* en 1953. Il sera repris dans *Through Paediatrics to Psycho-Analysis* (1958), puis dans *Jeu et réalité* (1971)[^1][^3].\n\n## Pas de nourrisson sans soins\n\nPour comprendre ce que Winnicott fait de la mère, il faut partir d'une phrase plus ancienne. Dans l'introduction que Masud Khan donne en 1958 à l'ouvrage de Winnicott, il cite une discussion de 1940 : « Il n'existe pas de nourrisson, ce qui veut dire, bien sûr, que chaque fois qu'on trouve un nourrisson, on trouve des soins maternels »[^2]. La formule, que l'on traduit souvent par « un bébé, ça n'existe pas », ne nie rien du bébé. Elle dit qu'on ne peut pas le décrire seul : l'unité de départ est le couple formé par l'enfant et ceux qui s'en occupent.\n\n## L'adaptation, puis l'échec\n\nC'est dans ce cadre que s'inscrit le passage célèbre : « La mère suffisamment bonne, comme je l'ai dit, commence par une adaptation presque complète aux besoins de son nourrisson. » Au fil du temps, poursuit Winnicott, elle s'adapte de moins en moins complètement[^1].\n\nAu début, cette adaptation presque totale donne au bébé quelque chose d'essentiel : l'occasion d'une illusion. Winnicott écrit que le sein est « créé par le nourrisson, encore et encore, à partir de sa capacité d'aimer », et que la mère fournit « l'occasion de l'illusion que son sein fait partie du nourrisson »[^1]. L'enfant éprouve que le monde répond à ce qu'il attend.\n\nMais cette illusion n'est pas faite pour durer. Winnicott le dit sans détour : la tâche principale de la mère, à côté de l'occasion de l'illusion, est la désillusion[^1]. La mère « suffisamment bonne » est donc aussi celle qui, peu à peu, cesse d'être exactement ajustée.\n\n> **Illustration (pas un cas de Winnicott).** Un nourrisson pleure ; presque aussitôt, la tétée arrive. Quelques mois plus tard, le même enfant doit attendre, en protestant, que le biberon soit prêt. Ce petit délai, répété, lui apprend que ce qui vient ne sort pas de son seul désir. C'est ce que l'on peut entendre par « désillusion » : une découverte progressive, et non un choc.\n\nAilleurs, Winnicott décrit des parents qui n'ont pas besoin d'être parfaitement accordés, mais « ordinairement dévoués » (*ordinarily devoted*) ou « suffisamment bons »[^4]. Il écrit aussi que les fondations de la santé sont posées par la mère ordinaire dans ses soins ordinaires et affectueux à son propre bébé (*The Child, the Family, and the Outside World*)[^4].\n\n## L'objet transitionnel\n\nWinnicott observe que beaucoup de nourrissons s'attachent à un objet précis, un ours en peluche par exemple. Il introduit les termes d'« objet transitionnel » et de « phénomènes transitionnels » pour désigner cette zone d'expérience, qu'il situe dans l'*aire intermédiaire d'expérience*, « entre le pouce et l'ours en peluche »[^1].\n\nIl y voit une réponse à une tâche humaine que l'on n'achève jamais, celle de « maintenir la réalité intérieure et la réalité extérieure séparées mais reliées entre elles »[^1]. L'objet n'est ni tout à fait dans la tête de l'enfant, ni tout à fait dans le monde : il appartient aux deux.\n\nWinnicott décrit le comportement des parents avec une précision presque comique. Ils en viennent à connaître sa valeur et l'emportent avec eux en voyage. La mère le laisse devenir sale, voire malodorant. Il ne doit pas changer, sauf si c'est l'enfant qui le change. Et à la fin, écrit-il : « Il n'est pas oublié et il n'est pas pleuré »[^1].\n\n> **Illustration.** Un enfant de trois ans refuse qu'on lave son lapin en tissu, devenu gris et usé. Ce n'est pas un défaut d'hygiène qu'il défend : c'est l'objet tel qu'il est. Chez Winnicott, l'objet « ne doit jamais changer, sauf si c'est l'enfant qui le change » : le scénario n'est pas de lui, mais la règle qu'il énonce s'y reconnaît.\n\n## La question qu'on ne pose pas\n\nLe passage le plus fin de l'article porte sur le statut de cet objet. Est-il trouvé, ou créé ? Winnicott cite la question qu'on serait tenté de poser : « L'as-tu conçu, ou t'a-t-il été présenté du dehors ? » Et il ajoute deux phrases : « Le point important est qu'aucune décision n'est attendue sur ce point. La question ne doit pas être formulée »[^1].\n\nLe paradoxe d'un objet à la fois trouvé et créé n'est donc pas à trancher : on ne demande pas à l'enfant de décider.\n\n## Au-delà du berceau\n\nL'objet transitionnel n'est pas voué à rester. Mais ce qu'il a ouvert reste. Winnicott écrit que les phénomènes transitionnels se diffusent « sur tout le champ culturel », et il parle de « l'expérience intense qui appartient aux arts et à la religion »[^1]. L'objet passe, mais l'aire intermédiaire qu'il a ouverte se prolonge dans la vie culturelle de l'adulte.","quiz":[{"question":"Que veut dire, chez Winnicott, la formule « il n'existe pas de nourrisson » ?","choix":["Que partout où l'on trouve un nourrisson, on trouve des soins maternels","Que les nourrissons n'ont pas encore de vie psychique propre","Que la naissance est un événement sans importance psychique","Que les bébés sont des constructions de l'imagination adulte"],"bonne":0,"explication":"La phrase, rapportée par Khan à propos d'une discussion de 1940, dit que le nourrisson ne se décrit pas sans les soins qu'il reçoit. Winnicott ne nie pas la vie psychique du bébé : il dit qu'on ne peut le séparer de ceux qui s'en occupent."},{"question":"Comment l'adaptation de la mère évolue-t-elle ?","choix":["Elle reste complète tant que l'enfant n'est pas scolarisé","Elle est faible au début, puis augmente avec l'âge","Elle est presque complète au début, puis diminue graduellement","Elle est la même pendant toute l'enfance, sans changement"],"bonne":2,"explication":"Winnicott écrit que la mère suffisamment bonne commence par une adaptation presque complète aux besoins du nourrisson, puis s'adapte de moins en moins complètement. Les autres évolutions ne sont pas celles qu'il décrit."},{"question":"Une jeune mère culpabilise de ne pas toujours répondre à la seconde aux pleurs de son bébé de huit mois. Que lui dirait la notion de mère suffisamment bonne ?","choix":["Qu'elle doit s'efforcer d'atteindre une adaptation parfaite à chaque instant","Qu'une adaptation de moins en moins complète fait partie de sa tâche : la désillusion","Que le bébé n'a besoin d'aucune adaptation à cet âge","Qu'elle devrait confier l'enfant à quelqu'un de plus disponible"],"bonne":1,"explication":"Après une adaptation presque complète au début, la mère s'adapte de moins en moins complètement : c'est la désillusion, tâche principale à côté de l'illusion. Les petits délais, supportables, font partie de ce que Winnicott décrit."},{"question":"Quelle question Winnicott juge-t-il qu'on ne doit pas poser à propos de l'objet transitionnel ?","choix":["« Où as-tu trouvé cet objet que tu emmènes partout ? »","« Pourquoi y tiens-tu autant, alors qu'il est si sale ? »","« Peut-on le laver, maintenant, avant ton départ ? »","« L'as-tu conçu, ou t'a-t-il été présenté du dehors ? »"],"bonne":3,"explication":"Winnicott précise qu'aucune décision n'est attendue sur ce point : la question ne doit pas être formulée. Le paradoxe de l'objet à la fois créé et trouvé n'est pas à résoudre, mais à respecter."}],"sources":[{"texte":"Winnicott, « Transitional Objects and Transitional Phenomena » (1953), texte complet (PDF, réimpression)","url":"https://hegel1313.law.columbia.edu/files/2026/05/winnicott_transitional_objects_and_transitional_phenomena.pdf"},{"texte":"Winnicott, Through Paediatrics to Psycho-Analysis (1958), introduction de Masud Khan (formule de 1940)","url":"https://psptraining.com/wp-content/uploads/Winnicott-D.W.-1958.-Through-paediatrics-to-psycho-analysis.pdf"},{"texte":"V. Lebeau, « D.W. Winnicott : \"Transitional Objects and Transitional Phenomena\" », Palgrave Handbook of Psychosocial Studies (2022)","url":"https://link.springer.com/referenceworkentry/10.1007/978-3-030-61510-9_40-1"},{"texte":"Wikipédia (anglais), « Donald Winnicott » (« ordinarily devoted », « holding »)","url":"https://en.wikipedia.org/wiki/Donald_Winnicott"}]},{"id":"husserl-epoche","discipline":"philosophie","titre":"L'épochè","figure":"Edmund Husserl","branche":"epistemologie","fiabilite":"secondaire","fiabilite_note":"Husserl est présenté ici à travers l'Encyclopédie de philosophie de Stanford, qui cite ses textes ; les Idées directrices elles-mêmes n'ont pas été consultées.","reference":"Idées directrices pour une phénoménologie, I (1913) ; trad. Paul Ricœur (1950)","accroche":"Husserl ne doute pas que le monde existe. Il décide simplement de ne plus s'en servir, et c'est ainsi qu'il le voit vraiment.","punch":"Ne pas nier le monde. Le mettre entre parenthèses.","idee":"Dans l'attitude naturelle, nous croyons au monde sans même y penser. L'épochè suspend cette croyance sans la nier, pour regarder comment le monde se donne à la conscience. Ce qui était évident devient un phénomène à décrire.","repere":"Épochè (ἐποχή) : mot des sceptiques grecs, « suspension du jugement ». Husserl en fait une opération de méthode, la « mise entre parenthèses » de la croyance en l'existence du monde, qui ouvre la description des phénomènes.","liens":["descartes-malin-genie","freud-inquietante-etrangete","wittgenstein-taire"],"texte":"Les *Recherches logiques* (1900–1901) avaient lancé un mot d'ordre : revenir « aux choses mêmes »[^1]. Les *Idées directrices* de 1913 donnent la méthode pour y parvenir, et elle passe par un geste paradoxal : pour revenir aux choses, il faut d'abord cesser de croire naïvement en elles. C'est aussi le livre où Husserl adopte explicitement une philosophie transcendantale[^1].\n\nPaul Ricœur en publie la traduction française en 1950, sous le titre *Idées directrices pour une phénoménologie*[^3].\n\n## L'attitude naturelle\n\nHusserl commence par décrire notre manière ordinaire d'être au monde. On trouve devant soi des choses, des personnes, des valeurs, des outils. Le monde est « là », toujours déjà, et on le tient pour existant sans jamais le formuler. Cette manière de prendre la réalité du monde pour acquise est si profonde, si enracinée, que Husserl l'appelle l'*attitude naturelle*[^1].\n\nCette croyance n'est pas une opinion parmi d'autres. Elle est le sol sur lequel reposent toutes nos opinions, si évidente qu'on ne la remarque jamais.\n\n> **Illustration (pas un exemple de Husserl).** Vous entrez dans votre cuisine le matin. Vous ne vous dites pas « il existe une cuisine, elle a une table, la table continue d'exister quand je ne la regarde pas ». Vous attrapez une tasse. Toute cette croyance au monde fonctionne en silence, dans le geste. C'est ce silence que Husserl veut rendre visible.\n\n## Suspendre sans nier\n\nL'épochè consiste à mettre cette croyance « entre parenthèses ». Le mot, et la méthode, sont empruntés aux sceptiques grecs[^2]. Mais le but n'est ni de douter de la réalité, ni de la négliger, ni de l'exclure de la recherche : on garde la croyance pour l'examiner, et l'on met seulement sa validité entre parenthèses[^1]. On ne s'appuie plus sur elle pour juger.\n\nLa différence avec le doute cartésien est capitale. Descartes doute pour trouver une certitude sur laquelle reconstruire la science : il veut savoir *si* le monde existe. Husserl suspend pour *voir* : ce qui l'intéresse n'est plus que le monde existe, c'est la manière dont il apparaît.\n\n> **Illustration.** Un peintre regarde une route qui s'éloigne. Il « sait » que ses bords sont parallèles. Mais pour la peindre, il doit suspendre ce savoir et regarder comment elle se donne : les bords se rejoignent à l'horizon. Il ne nie pas que la route soit droite ; il cesse un moment de s'en servir. L'épochè généralise ce geste à toute l'expérience.\n\n## Ce qui reste\n\nQue reste-t-il une fois la croyance au monde suspendue ? Tout, mais autrement. L'arbre perçu n'a pas disparu : il est devenu un phénomène, « l'arbre-tel-que-perçu », que Husserl appelle le *noème*, le sens noématique de l'expérience[^2]. Il se donne par une face, puis par une autre à mesure qu'on tourne autour, avec ce qu'on ne voit pas encore.\n\nEt la conscience qui le perçoit se révèle *intentionnelle* : chaque acte de conscience est « conscience de quelque chose », dirigé vers un objet[^2]. Le processus par lequel la conscience vise s'appelle la *noèse* ; le noème est l'objet tel qu'il est visé[^2]. Les interprètes ne s'accordent d'ailleurs pas sur le statut exact du noème : un sens abstrait qui servirait d'intermédiaire, ou l'objet lui-même, tel qu'on le vise[^1].\n\n> **Illustration.** Le même immeuble peut être vu, rêvé, regretté, désiré, ou simplement mentionné dans une conversation. Dans chaque cas, c'est bien « cet immeuble » qui est visé, mais de façons différentes : perçu, imaginé, chargé de souvenirs, objet d'envie. La phénoménologie décrit ces différentes manières de viser, au lieu de se demander seulement si l'immeuble existe.\n\n## Une attitude, plus qu'une technique\n\nOn a reproché à Husserl le versant idéaliste de sa démarche : la tentation de faire de la conscience pure le fondement de tout. Merleau-Ponty, dans la préface de la *Phénoménologie de la perception* (1945), en tire une leçon devenue célèbre : le plus grand enseignement de la réduction est l'impossibilité d'une réduction complète[^4]. Celui qui réfléchit appartient au monde sur lequel il réfléchit, si bien que toute réflexion reste incomplète[^4]. Chez lui, la phénoménologie insiste sur le rôle du corps dans l'expérience[^2].\n\nMais le geste demeure fécond, bien au-delà de la philosophie. Suspendre ce qu'on tient pour évident pour regarder comment cela se présente : c'est une discipline de l'attention.\n\n> **Illustration (un parallèle avec la clinique, pas une thèse de Husserl).** Un patient dit : « Ma mère était froide. » Il est tentant de comprendre aussitôt, de compléter avec ce qu'on sait des mères froides. Une écoute qui pratique une sorte d'épochè suspend ce savoir : comment ce mot, « froide », arrive-t-il dans son récit ? À quel moment, avec quel ton, à propos de quelle scène ? Ce n'est pas nier ce qu'il dit, c'est s'interdire de comprendre trop vite pour entendre ce qui se présente.\n\nL'écoute qui s'interdit de comprendre trop vite n'est pas très éloignée du geste husserlien, même si la psychanalyse n'en tire pas les mêmes conséquences.","quiz":[{"question":"Que fait exactement l'épochè husserlienne avec la croyance au monde ?","choix":["Elle la nie, en affirmant que le monde extérieur n'existe pas","Elle la met en doute, pour pouvoir la réfuter ensuite","Elle la met entre parenthèses, sans la nier, en cessant d'en faire usage","Elle la remplace par une croyance en Dieu, garant du monde"],"bonne":2,"explication":"On garde la croyance pour l'examiner et l'on suspend sa validité. Ce n'est ni la négation, ni le doute qui cherche à réfuter, ni une substitution théologique."},{"question":"En quoi l'épochè se distingue-t-elle du doute cartésien ?","choix":["Descartes doute pour fonder la science ; Husserl suspend pour décrire l'apparaître","Descartes croit au monde extérieur, alors que Husserl n'y croit pas","Husserl reprend exactement la méthode de Descartes, sans rien y changer","Descartes s'intéresse à la perception, Husserl seulement à la logique"],"bonne":0,"explication":"Le doute cartésien vise une certitude fondatrice ; l'épochè vise la description des phénomènes. Husserl ne nie pas le monde, et il fait de la perception un objet central."},{"question":"Une même personne se souvient de la maison de son enfance, puis la revoit vingt ans après, puis en parle à un ami. Qu'est-ce qui, chez Husserl, reste identique d'une expérience à l'autre ?","choix":["L'acte de conscience lui-même, qui est chaque fois le même","Rien : chaque expérience porte sur un objet différent","L'objet visé, cette maison, visé chaque fois d'une autre manière","Le souvenir, qui déforme toujours la perception"],"bonne":2,"explication":"Les actes (se souvenir, percevoir, mentionner) diffèrent, mais ils visent le même objet : c'est l'intentionnalité, toute conscience étant conscience de quelque chose. La noèse change, l'objet visé demeure."},{"question":"Quelle leçon Merleau-Ponty tire-t-il de la réduction ?","choix":["Qu'elle permet d'atteindre une conscience pure séparée du monde","Qu'elle est inutile et doit être abandonnée","Qu'elle prouve l'existence d'un monde extérieur","Que son plus grand enseignement est l'impossibilité d'une réduction complète"],"bonne":3,"explication":"Celui qui réfléchit appartient au monde sur lequel il réfléchit : on n'en sort jamais tout à fait. Merleau-Ponty ne l'abandonne pas, et il n'y voit ni un accès à une conscience pure ni une preuve."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Edmund Husserl » (Recherches logiques, attitude naturelle, épochè, noème, idéalisme transcendantal)","url":"https://plato.stanford.edu/entries/husserl/"},{"texte":"Stanford Encyclopedia of Philosophy, « Phenomenology » (épochè, noèse et noème, intentionnalité, Merleau-Ponty et le corps)","url":"https://plato.stanford.edu/entries/phenomenology/"},{"texte":"Marquette University Press, présentation de la traduction d'Ideen I par Paul Ricœur (1950)","url":"https://www.marquette.edu/mupress/Ricoeur.shtml"},{"texte":"Stanford Encyclopedia of Philosophy, « Maurice Merleau-Ponty » (préface de la Phénoménologie de la perception, 1945, p. 14 de l'édition française)","url":"https://plato.stanford.edu/entries/merleau-ponty/"}]},{"id":"bion-reverie","discipline":"psychanalyse","titre":"La capacité de rêverie","figure":"Wilfred R. Bion","branche":"objet","fiabilite":"secondaire","fiabilite_note":"Bion est cité à travers des études qui reproduisent ses textes avec leurs pages (Ogden surtout), et non d'après les textes de 1962 eux-mêmes ; les citations sont traduites ici depuis l'anglais.","reference":"Learning from Experience (1962) ; A Theory of Thinking, Int. J. Psycho-Anal. 43 (1962), repris dans Second Thoughts (1967)","accroche":"Avant de pouvoir penser, le bébé a besoin que quelqu'un accueille ce qu'il ne peut pas supporter. Bion appelle cet accueil la rêverie.","punch":"La pensée ne vient pas d'abord de la pensée. Elle vient d'être accueilli.","idee":"Le nourrisson projette dans sa mère des éprouvés bruts, impensables (éléments bêta). Par sa rêverie, elle les reçoit et la fonction alpha les transforme en éléments qui peuvent être rêvés et pensés. Le bébé reçoit en retour ses peurs sous une forme supportable.","citation":"Thinking is a development forced on the psyche by the pressure of thoughts and not the other way round","citation_source":"Bion, Second Thoughts (1967), p. 111 — cité par Th. Ogden, « Bion's Four Principles of Mental Functioning », Fort Da, 2008 — « La pensée est un développement imposé au psychisme par la pression des pensées, et non l'inverse »","citation_url":"https://web.english.upenn.edu/~cavitch/pdf-library/Ogden_Bion_s_Four_Principles.pdf","liens":["winnicott-mere-suffisamment-bonne","klein-positions","freud-reve"],"texte":"Quand Bion publie *Learning from Experience* en 1962, il s'intéresse à une question qui paraît paradoxale : comment devient-on capable de penser ? Sa réponse renverse l'ordre habituel. Ce n'est pas la pensée qui produit des pensées ; ce sont les pensées, dit-il, qui forcent le psychisme à se développer. Une phrase de *Second Thoughts* (1967) le dit sans détour : « La pensée est un développement imposé au psychisme par la pression des pensées, et non l'inverse »[^1].\n\n## Éléments bêta et fonction alpha\n\nBion appelle *éléments bêta* des impressions sensorielles liées à une expérience émotionnelle, en l'état brut où elles se présentent (1962, p. 17)[^1]. Ils ne se prêtent pas à la formation de pensées de rêve : ils sont « impropres à être utilisés dans les pensées de rêve, mais adaptés à l'identification projective » (1962, p. 6)[^2]. Émile Jalley le dit autrement : les mauvais objets sont « expulsés sous forme d'éléments bêta » par identification projective[^4].\n\nCe qui les transforme est la *fonction alpha*, qui produit des *éléments alpha*, utilisables pour rêver et penser. Bion la laisse volontairement ouverte : il parle d'un « ensemble d'opérations mentales encore inconnu, et probablement inconnaissable » (1962, p. 6)[^1]. On sait ce qu'elle fait, non comment elle le fait. Les protopensées admises « à titre de problèmes à résoudre » se développent en éléments alpha[^4].\n\n## La rêverie maternelle\n\nLe nourrisson ne dispose pas encore de cette fonction. Dans « A Theory of Thinking », Bion décrit le rôle de la personne qui s'occupe de lui : elle s'engage dans ce qu'il appelle la « rêverie maternelle » (*maternal reverie*, 1962, p. 309)[^1]. Hanna Segal la définit comme « l'état d'esprit réceptif de la mère »[^3].\n\nBion en donne un exemple (1962/1967, p. 114-115). Quand le nourrisson « sent qu'il est en train de mourir », il peut projeter cette peur dans la mère. Si celle-ci est suffisamment équilibrée, elle peut l'accepter et y répondre « de façon thérapeutique ». Le nourrisson reçoit alors en retour sa personnalité effrayée sous une forme qui lui est supportable : « les peurs sont gérables par la personnalité du nourrisson »[^1].\n\n> **Illustration (pas un cas de Bion).** Un nourrisson hurle, rouge, tendu. Un parent le prend, lui parle d'une voix égale, le berce. Le bébé ne comprend aucune de ses paroles, mais quelque chose passe : l'adulte n'a pas paniqué en recevant ce cri, et au bout de quelques minutes le corps du bébé se détend. Ce qui fait la rêverie, dans l'esprit de Bion, c'est cette capacité d'être traversé par la peur de l'autre sans en être submergé.\n\nAu fil de ces expériences, le bébé n'acquiert pas seulement un apaisement : il acquiert, peu à peu, la capacité de faire lui-même ce travail. Certains commentateurs disent qu'il introjecte la fonction alpha de son contenant ; la formule est la leur, non celle de Bion[^2].\n\n## Contenant et contenu\n\nBion a un modèle pour cet échange, qu'il nomme *container-contained*, « contenant-contenu », développé pour la première fois dans *Learning from Experience* en 1962[^3]. Le contenant « n'est pas une chose mais un processus » (1962/1975, p. 90)[^1]. Le contenu, lui, désigne les pensées et les sentiments en train de se former à partir de l'expérience émotionnelle vécue.\n\nBion note la relation par des symboles, ♀ pour le contenant et ♂ pour le contenu (*Attention and Interpretation*). Le contenant reçoit et traite les sentiments et les expériences insupportables d'un autre, et le modèle se rattache à la relation mère-nourrisson[^3].\n\n> **Illustration (un parallèle avec la séance).** Une patiente arrive en séance submergée, parle vite, sans pouvoir dire ce qui l'agite. L'analyste ne répond pas tout de suite ; il laisse l'agitation l'atteindre, puis dit simplement : « On dirait que quelque chose vous a fait très peur cette semaine. » Elle se met à pleurer, puis à raconter. Une émotion brute a trouvé quelqu'un pour la recevoir et une forme pour être pensée.\n\n## Quand l'accueil échoue\n\nQue se passe-t-il si la projection n'est pas accueillie ? Bion parle d'une « terreur sans nom » (*nameless dread*) : des angoisses primitives qui ne peuvent être ni traitées ni pensées[^3]. On décrit, dans le même esprit, un reste intérieur de projections qui n'ont pas été « contenues »[^5].\n\n## Un modèle de la pensée\n\nCe que Bion décrit est un modèle de la pensée : un mécanisme par lequel ce que le psychisme ne peut pas supporter devient, d'abord grâce à un autre, pensable. Les passages cités n'en tirent pas de jugement sur la responsabilité des parents : ils décrivent une fonction.","quiz":[{"question":"Que sont les éléments bêta chez Bion ?","choix":["Des pensées déjà élaborées, prêtes à être communiquées","Des souvenirs d'enfance refoulés que l'analyse fait revenir","Les éléments du rêve manifeste, tels que le rêveur les raconte","Des impressions sensorielles liées à une émotion, non transformées"],"bonne":3,"explication":"Les éléments bêta sont des impressions sensorielles liées à une expérience émotionnelle. Ils sont impropres au rêve et se prêtent à l'identification projective ; il ne s'agit ni de pensées élaborées, ni de souvenirs, ni de rêves."},{"question":"Que désigne la « rêverie maternelle » ?","choix":["L'état d'esprit réceptif de la mère, qui accueille ce que l'enfant projette","L'habitude de raconter une histoire au bébé avant le sommeil","Le fait que la mère rêve la nuit à son enfant","La capacité de la mère à satisfaire tous ses besoins physiques"],"bonne":0,"explication":"Hanna Segal définit la rêverie comme l'état d'esprit réceptif de la mère. Il ne s'agit ni d'une histoire du soir, ni de ses propres rêves, ni de la seule satisfaction des besoins du corps."},{"question":"Quel est le rôle de la fonction alpha ?","choix":["Éliminer les émotions pour ne garder que les faits observables","Transformer les éléments bêta en éléments alpha, utilisables pour rêver et penser","Refouler hors de la conscience tous les souvenirs trop pénibles","Mesurer l'intelligence du nourrisson dès les premiers jours"],"bonne":1,"explication":"La fonction alpha opère sur les impressions brutes pour produire des éléments alpha. Bion ne la décrit pas comme une élimination des émotions, ni comme un refoulement, ni comme une mesure d'intelligence."},{"question":"Un adolescent explose de colère au dîner ; son père, au lieu de crier à son tour, dit : « Tu as l'air à bout, il s'est passé quelque chose ? » Quel concept de Bion cette scène illustre-t-elle ?","choix":["La terreur sans nom, qui naît quand rien n'est accueilli","Le modèle contenant-contenu : une émotion brute est reçue et rendue pensable","La fonction alpha, que le père perdrait en se retenant","Les éléments bêta, que le père projette sur son fils"],"bonne":1,"explication":"Le père reçoit ce qui déborde l'adolescent sans le lui renvoyer tel quel, et le lui rend sous une forme qu'il peut penser : c'est la fonction contenante. La terreur sans nom serait au contraire l'effet d'une projection non accueillie."}],"sources":[{"texte":"Ogden, T. H., « Bion's Four Principles of Mental Functioning », Fort Da (2008) (citations de Bion 1962, 1967, 1975)","url":"https://web.english.upenn.edu/~cavitch/pdf-library/Ogden_Bion_s_Four_Principles.pdf"},{"texte":"Article de Frontiers in Psychology (2018) sur la barrière de contact, citant Bion (1962a, 1962b)","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2018.01674/pdf"},{"texte":"Wikipédia (anglais), « Wilfred Bion » (container-contained, alpha function, beta elements, reverie, nameless dread)","url":"https://en.wikipedia.org/wiki/Wilfred_Bion"},{"texte":"Émile Jalley, « Bion, la pensée », Encyclopædia Universalis","url":"https://www.universalis.fr/encyclopedie/wilfred-r-bion/3-la-pensee/"},{"texte":"D. Cârstea, « Death-equivalents and low-level trauma: Literary representations of dread », Agathos 16 (2), 2025 (mention de la « nameless dread » de Bion, 1984)","url":"https://www.agathos-international-review.com/issues/2025/31/Carstea.pdf"}]},{"id":"kant-lumieres","discipline":"philosophie","titre":"Sapere aude","figure":"Emmanuel Kant","branche":"histoire","fiabilite":"primaire","fiabilite_note":"Le texte de Kant est cité dans une traduction française reproduite par un lycée ; le traducteur n'y est pas indiqué.","reference":"Réponse à la question : qu'est-ce que les Lumières ? (Berlinische Monatsschrift, décembre 1784)","accroche":"Kant ne dit pas que les hommes sont ignorants. Il dit qu'ils sont paresseux et lâches, et qu'ils ont de bonnes raisons de l'être.","punch":"Il est si commode d'être mineur.","idee":"Les Lumières, c'est la sortie de l'homme d'un état de tutelle dont il est lui-même responsable : l'incapacité de se servir de son entendement sans la direction d'autrui. Ce n'est pas l'intelligence qui manque, c'est le courage.","citation":"Sapere aude ! Aie le courage de te servir de ton propre entendement !","citation_source":"Kant, Qu'est-ce que les Lumières ? (1784) — traduction reproduite par le lycée Descartes de Rabat","citation_url":"https://lycee-descartes.ac.ma/medias/rentree2021/Kant_Quest-ce-que-les-Lumieres-1784.pdf","liens":["platon-reminiscence","freud-moi-pas-maitre","nietzsche-ressentiment"],"texte":"En 1784, la *Berlinische Monatsschrift*, revue des Lumières berlinoises, publie la réponse de Kant à une question qu'un pasteur avait posée en note dans la même revue : qu'est-ce, au juste, que les Lumières ? Kant répond par une phrase qui a la netteté d'une définition : la sortie de l'homme hors de l'état de tutelle dont il est lui-même responsable[^1].\n\nLe texte fait une dizaine de pages. Il est devenu l'un des manifestes les plus cités de la modernité.\n\n## Une tutelle dont on est responsable\n\nL'état de tutelle, ou de minorité, est une notion juridique : l'état de celui qui ne peut agir sans tuteur. Ce n'est pas une affaire d'âge. Kant parle d'adultes que la nature a depuis longtemps affranchis de toute direction étrangère et qui restent pourtant mineurs leur vie durant.\n\nEt il précise : cette minorité est fautive lorsque sa cause n'est pas un manque d'entendement, mais un manque de décision et de courage pour s'en servir sans la direction d'un autre[^1]. D'où la devise reprise au poète latin Horace : *Sapere aude*, ose savoir, ose te servir de ton propre entendement.\n\n## Pourquoi on reste mineur\n\nKant donne deux causes, sans complaisance : la paresse et la lâcheté. Et il ajoute une phrase d'une ironie cinglante : il est si commode d'être mineur. Si j'ai un livre qui me tient lieu d'entendement, un directeur qui me tient lieu de conscience, un médecin qui juge de mon régime à ma place, je n'ai pas besoin de me fatiguer moi-même. Je n'ai pas besoin de penser, pourvu que je puisse payer[^1].\n\n> **Illustration, version contemporaine.** J'ai une application qui me dit quoi manger et combien de pas faire, un fil d'actualité qui choisit ce que je dois lire, un comparateur qui décide de mes achats, un influenceur dont je reprends les opinions. Rien de tout cela n'est mauvais en soi : on ne peut pas tout vérifier soi-même. Mais si je ne sais plus former un jugement sans eux, je suis exactement dans la situation que Kant décrit, et je l'ai choisie parce qu'elle est confortable.\n\nLes tuteurs, de leur côté, ont tout intérêt à entretenir cette situation. L'image de Kant est brutale : après avoir abêti leur bétail domestique et soigneusement empêché ces créatures paisibles d'oser faire un pas hors du parc où ils les ont enfermées, ils leur montrent le danger qui les menace si elles essaient de marcher seules. Le danger n'est pas si grand, remarque Kant : après quelques chutes, on finit par apprendre à marcher. Mais l'exemple d'une chute suffit à intimider[^1].\n\n> **Illustration.** Un enfant qu'on a toujours accompagné partout, et à qui l'on répète que la rue est dangereuse, aura peur de prendre seul le bus à quatorze ans. Ce n'est pas qu'il en soit incapable. C'est qu'on lui a appris à craindre l'essai plus que l'échec. Kant applique ce schéma à des peuples entiers.\n\n## Le public plutôt que l'individu\n\nKant est pessimiste sur l'émancipation solitaire. Il est difficile pour chaque individu de se dégager de la minorité devenue presque une seconde nature ; il a fini par l'aimer. Il est plus probable, en revanche, qu'un public s'éclaire lui-même, pourvu qu'on lui laisse la liberté[^1].\n\nMais quelle liberté ? La plus inoffensive de toutes : celle de faire un usage *public* de sa raison en toutes choses.\n\nKant distingue alors deux usages de la raison, avec un vocabulaire qui surprend.\n\n- L'**usage public** est celui que l'on fait comme savant, devant le public qui lit. Il doit être entièrement libre.\n- L'**usage privé** est celui qu'on fait dans une fonction civile ou un poste qui nous est confié. Il peut être restreint[^1].\n\n> **Illustration, celui de Kant.** Un officier qui reçoit un ordre ne doit pas se mettre à raisonner sur son bien-fondé en service : il doit obéir. Mais on ne peut pas lui interdire, comme savant, de publier ses remarques sur les fautes du service militaire. De même, le citoyen doit payer l'impôt ; il peut ensuite écrire publiquement que cet impôt est injuste. Et le pasteur doit enseigner le symbole de son Église à ses fidèles ; comme savant, il a pleine liberté d'en discuter les défauts devant le public.\n\n> **Illustration, transposé.** Une infirmière applique le protocole de son service pendant sa garde. Elle n'a pas à le réinventer au chevet du patient. Mais elle a le droit, et pour Kant le devoir, de publier dans une revue professionnelle une critique argumentée de ce protocole. C'est par ces critiques publiques que les protocoles s'améliorent.\n\n## Ce que le texte laisse ouvert\n\nLe texte rend hommage au roi de Prusse, Frédéric II, et lui attribue une formule : raisonnez autant que vous voudrez et sur tout ce que vous voudrez, mais obéissez[^1]. Les lecteurs n'ont cessé de s'y heurter. Est-ce un compromis tactique, sous un régime de censure ? Ou une conviction réelle que la liberté de critiquer suffit, à terme, à transformer les institutions ?\n\nMichel Foucault a publié en mai 1984, sous le même titre, un texte consacré à cet opuscule, qu'il tenait pour « capital » dans l'histoire de la pensée critique : Kant y fait du présent lui-même un objet de réflexion philosophique[^4].\n\nUne autre question reste en suspens. Que le courage soit requis suppose qu'il y ait, en nous, quelque chose qui préfère la tutelle. Kant le nomme paresse ou lâcheté, et le traite comme un défaut de caractère. On pourrait se demander si le désir d'être dirigé n'a pas des racines plus profondes, et plus tenaces, qu'une simple mollesse.","quiz":[{"question":"Qu'est-ce qui rend la minorité « fautive » selon Kant ?","choix":["Un défaut naturel d'intelligence chez la plupart des hommes","Un manque de décision et de courage, et non d'entendement","L'absence d'écoles publiques dans le royaume de Prusse","Le refus d'obéir aux autorités légitimes de l'État"],"bonne":1,"explication":"La minorité est imputable quand sa cause n'est pas un manque d'entendement mais de courage. Kant écarte expressément le manque d'intelligence ; il ne parle pas ici d'institutions scolaires, et l'obéissance n'est pas le problème : il la maintient même dans l'usage privé."},{"question":"Comment Kant distingue-t-il usage public et usage privé de la raison ?","choix":["Public : en famille ; privé : dans le secret de la conscience","Public : réservé aux princes ; privé : accessible à tous","Public : comme savant devant le public qui lit ; privé : dans une fonction","Public : dans les assemblées ; privé : dans les affaires commerciales"],"bonne":2,"explication":"Le paradoxe est voulu : l'usage « privé » est celui qu'on fait dans un poste confié, où l'on peut devoir obéir ; l'usage « public » est celui du savant qui s'adresse à tous, et il doit être libre. Les autres répartitions ne correspondent pas au texte."},{"question":"Quelqu'un consulte chaque matin des avis en ligne pour décider quoi penser de l'actualité, alors qu'il serait capable de juger seul. Comment Kant décrirait-il sa situation ?","choix":["Une minorité dont il est responsable : par commodité, il laisse juger à sa place","Une ignorance excusable, puisque personne ne peut tout savoir","Un usage public de la raison, puisqu'il lit ce que d'autres publient","Une forme d'obéissance légitime aux autorités de son temps"],"bonne":0,"explication":"Ce n'est pas l'entendement qui manque, c'est la décision de s'en servir : « il est si commode d'être mineur ». Lire les autres n'est pas un défaut ; leur abandonner son jugement, si."},{"question":"Que peut faire l'officier de l'exemple de Kant ?","choix":["Refuser un ordre qu'il juge mauvais, au nom de sa raison","Rien : il doit se taire en toutes circonstances","Obéir en service, puis critiquer publiquement le service comme savant","Demander au roi de changer l'ordre avant de l'exécuter"],"bonne":2,"explication":"En service, il obéit : c'est l'usage privé. Comme savant, il peut publier ses remarques sur les fautes du service militaire : c'est l'usage public. Kant n'autorise pas le refus d'obéir, mais il n'impose pas non plus le silence."}],"sources":[{"texte":"Kant, Qu'es
