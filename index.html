t être propre. L'enfant y répond en donnant, ou en refusant, un objet réel. Mais ce que la mère demande est tout autre chose : obéissance, soumission, amour, révolte, tout sauf les excréments. Sa demande vise l'enfant lui-même[^1]. D'où un décalage : l'enfant prend l'objet partiel pour l'objet de la demande, tandis que la mère le prend, lui, pour l'objet de son désir[^1].\n\nL'enfant se heurte alors à une question qu'il ne peut pas encore résoudre : que veut-elle[^1] ? Pour échapper à l'angoisse de ne pas le savoir, il peut se rassurer en plaçant ce qu'elle désire dans une chose qu'il possède et qu'il peut voir, toucher. Aulagnier appelle ce montage une « préfiguration fétichiste »[^1]. Selon la manière dont le sujet sortira de cette position, elle distingue trois structures : psychotique, quand il ne peut dépasser le stade de la demande ; névrotique, quand la question du désir reste toujours en suspens ; perverse, quand demande et désir restent confondus[^1].\n\nLe sevrage se lit de la même façon. Donner le sein est pour une mère autre chose qu'un acte de simple nourrissage, et le premier objet que l'enfant rencontre en ce monde, écrit-elle, n'est pas la mère mais le sein[^1]. Le sevrage psychologique n'a pas lieu quand l'enfant cesse de téter ; il a lieu quand il doit reconnaître l'existence de la mère comme séparée de lui[^1].\n\n## Une dent arrachée\n\nEn 1967, Aulagnier reprend la question à partir d'une séance. Une patiente d'une trentaine d'années, « Mme J. », parle de petits faits quotidiens. Elle s'arrête ; au même moment, le bruit de la télévision du voisin envahit le bureau. Le silence se prolonge ; l'analyste demande : « Qu'est-ce qui vous arrête ? »[^2]\n\nLui revient alors un souvenir d'enfance, jamais tout à fait oublié. Petite, en vacances, elle ouvre un matin la porte de la chambre de ses parents et voit sa mère allongée, la bouche ouverte, qui pleure, et son père penché sur elle qui lui arrache une dent avec une grosse tenaille[^2]. À la séance suivante, elle s'étonne d'avoir cru pendant des années à une scène aussi absurde, et conclut d'elle-même qu'elle a dû assister à une scène sexuelle entre ses parents[^2].\n\nPourquoi l'enfant n'a-t-elle pas pu dire ce qu'elle avait vu ? Parce qu'il n'existe pas, dans le langage d'un enfant, de mot pour ce qui relève de la jouissance[^2]. Devant une scène qui risquait de dévoiler l'impossible, elle a pris des notions familières, les dents qui tombent, le mal aux dents, la tenaille, la douleur, et en a fait une légende sensée qui désamorce l'inquiétante étrangeté de la scène[^2]. Aulagnier reprend ici la définition de l'*Unheimliche* que Freud empruntait à Schelling : ce qui aurait dû rester secret et caché, et qui est soudain dévoilé[^2].\n\nLe bruit de la télévision n'est pas indifférent. Une voix étrangère, plus sonorité que langage, surgit au moment où la patiente attend une parole censée faire sens ; elle réveille une scène où elle avait entendu sans comprendre[^2]. C'est l'*après-coup* freudien : une expérience ne prend son sens, et parfois sa force traumatique, que dans un second temps[^2].\n\n## L'ombre parlée\n\n*La Violence de l'interprétation* (1975) porte ces questions à l'origine. Son chapitre IV, consacré à la naissance du Je, décrit l'*infans*, celui qui n'a pas encore accès à la parole, comme un être parlé par l'autre : par les interprétations que la mère fait de lui[^3]. Dans ce livre, le Je équivaut au sujet[^3].\n\nLa mère est d'abord le seul acteur d'un « micro-milieu » où il n'y a pas encore de tiers ; elle en est la porte-parole[^3]. Son discours projette sur l'enfant une « ombre parlée ». Aulagnier la définit comme une série d'énoncés témoignant du souhait inconscient de la mère concernant l'enfant[^3]. Ce que l'enfant pense doit d'abord passer par ce discours : c'est la « violence de l'anticipation »[^3].\n\nElle devient excessive quand la pensée de l'enfant doit se conformer à un monde préétabli et imposé par la mère ; cet abus de pouvoir est pour Aulagnier le premier responsable de la constitution du délire[^3]. D'où une formule : le social est la garantie du non-délire[^3]. Le tiers, la sortie de l'espace maternel, ne vient pas du seul travail psychique de l'enfant, mais de l'expérience de l'extériorité ; et elle suppose l'accès à un temps orienté vers le futur, hors du temps immobile du souhait maternel[^3].\n\n> **Illustration (un parallèle avec la clinique).** Une mère répète depuis la naissance de sa fille : « Elle est comme moi, elle a peur de tout. » L'enfant n'a pas choisi cette phrase ; elle l'a reçue comme une description d'elle-même. Tant que d'autres voix, un père, une école, des amis, lui renvoient d'autres images, la phrase reste une phrase parmi d'autres. Si elle est la seule, l'enfant n'a plus d'espace pour penser autrement ce qu'elle ressent.","quiz":[{"question":"Qu'est-ce qui distingue l'identification de l'imitation chez Aulagnier ?","choix":["L'imitation est inconsciente, l'identification est volontaire","L'identification est inconsciente, même pour un observateur extérieur","L'imitation concerne les adultes, l'identification seulement les enfants","Il n'y a aucune différence réelle entre les deux processus"],"bonne":1,"explication":"L'imitation joue sur les « emblèmes » visibles de l'autre et frappe les témoins ; l'identification, liée au désir, est méconnue du sujet comme de l'observateur."},{"question":"Dans l'apprentissage de la propreté, que demande réellement la mère, selon Aulagnier ?","choix":["Uniquement que l'enfant soit propre, sans autre enjeu","Quelque chose de l'ordre du désir : obéissance, amour, soumission","Que l'enfant devienne autonome le plus tôt possible","Que l'enfant imite les gestes de ses frères et sœurs"],"bonne":1,"explication":"La demande de la mère vise l'enfant lui-même : obéissance, soumission, amour, révolte, « tout sauf les excréments ». L'enfant, lui, prend l'objet réel pour l'objet de la demande."},{"question":"Un père dit sans cesse de son fils : « Il est paresseux, comme son oncle. » Que permet de penser la notion d'« ombre parlée » ?","choix":["Que l'enfant hérite génétiquement du caractère de son oncle","Que la phrase n'a aucun effet tant qu'elle reste affectueuse","Que ces énoncés, chargés du souhait inconscient du parent, façonnent l'enfant","Que l'enfant doit être protégé de toute parole sur lui-même"],"bonne":2,"explication":"L'ombre parlée est une série d'énoncés témoignant du souhait inconscient du parent sur l'enfant. Elle devient violence excessive quand elle impose à l'enfant un monde préétabli, sans autre place."},{"question":"Pourquoi Mme J. a-t-elle transformé ce qu'elle a vu enfant en « arrachement de dent » ?","choix":["Parce que son père était réellement dentiste et soignait sa mère","Parce que l'enfant n'avait pas de mots pour la jouissance et a forgé une légende","Parce qu'elle avait volontairement menti pour protéger ses parents","Parce que l'analyste lui avait suggéré cette interprétation en séance"],"bonne":1,"explication":"Aucun mot du langage enfantin ne pouvait dire la scène ; elle l'a recouverte de notions familières (dents, tenaille, douleur) pour en désamorcer l'inquiétante étrangeté."}],"sources":[{"texte":"Piera Aulagnier, « Séminaire de Sainte-Anne du 3 mars 1964. Sur le concept d'identification », Topique, n° 163, 2025, p. 115-124","url":"https://doi.org/10.3917/top.163.0115"},{"texte":"Piera Aulagnier, « Séminaire de Sainte-Anne 1967-1968 : séance du 13 février 1967. Le concept d'identification », Topique, n° 163, 2025, p. 125-138","url":"https://doi.org/10.3917/top.163.0125"},{"texte":"Jacques Sédat, « Piera Aulagnier, la naissance du Je », Topique, n° 163, 2025, p. 69-74 (lecture du chapitre IV de La Violence de l'interprétation)","url":"https://doi.org/10.3917/top.163.0069"},{"texte":"Wikipédia (français), « Piera Aulagnier » (formation, Lacan, École freudienne, sous-titre du livre de 1975)","url":"https://fr.wikipedia.org/wiki/Piera_Aulagnier"},{"texte":"Wikipédia (anglais), « Piera Aulagnier » (dates, Quatrième Groupe, Topique)","url":"https://en.wikipedia.org/wiki/Piera_Aulagnier"}]},{"id":"spinoza-ecriture","discipline":"philosophie","titre":"Le sens n'est pas la vérité","figure":"Baruch Spinoza","branche":"langage","fiabilite":"mixte","fiabilite_note":"Le chapitre VII du Traité théologico-politique a été lu dans la traduction anglaise de R. H. M. Elwes (Project Gutenberg) ; deux phrases sont citées dans la traduction française de J. Lagrée et P.-F. Moreau (PUF, 1999), reproduite dans un dossier de textes de l'université Paris 1. Le passage a été repéré grâce au cours de Céline Denat (master, URCA). Le contexte historique vient de Wikipédia.","reference":"Traité théologico-politique (1670), chapitre VII, « De l'interprétation de l'Écriture »","accroche":"Pour savoir ce que dit un texte, il ne faut pas d'abord se demander s'il a raison. Spinoza en fait la règle d'or de toute lecture, et l'applique au livre le plus sacré de son temps.","punch":"On peut comprendre parfaitement une phrase qu'on juge fausse.","idee":"Spinoza demande d'interpréter l'Écriture comme on étudie la nature : par une enquête sur le texte lui-même, sa langue, son histoire, sans y projeter nos croyances ni notre raison. Il faut chercher le sens des phrases, non leur vérité. La question de la vérité vient après.","citation":"Car nous nous occupons seulement du sens des phrases et non pas de leur vérité.","citation_source":"Spinoza, Traité théologico-politique, chap. VII, trad. J. Lagrée et P.-F. Moreau (PUF, 1999), dans un dossier de textes de l'université Paris 1 Panthéon-Sorbonne","citation_url":"https://philosophie.pantheonsorbonne.fr/sites/default/files/2025-03/texte_chantal_j_critique_religion_spinoza_textes.pdf","liens":["augustin-interpreter","spinoza-desir","nietzsche-perspectivisme"],"texte":"Le *Traité théologico-politique* paraît en 1670 à Amsterdam, en latin et sans nom d'auteur. Pour protéger l'auteur et l'imprimeur, la page de titre porte une fausse adresse : Hambourg, et le nom d'un éditeur mort depuis 1605[^3]. La précaution n'est pas inutile. Un critique anonyme parle d'un livre « forgé en enfer » ; le synode de Dordrecht le condamne en 1673, et il est interdit l'année suivante[^3].\n\nSpinoza avait interrompu la rédaction de l'*Éthique* pour l'écrire. Il voulait défendre la liberté de philosopher contre l'autorité religieuse, et se défendre lui-même contre l'accusation d'athéisme[^3]. Le cœur de sa démonstration est une méthode de lecture.\n\n## Lire l'Écriture comme on étudie la nature\n\nLa thèse du chapitre VII est nette : la méthode pour interpréter l'Écriture ne diffère guère de celle qui sert à interpréter la nature ; c'est presque la même[^1].\n\nQue fait le savant devant la nature ? Il observe, rassemble des données sûres, et n'en tire des conclusions qu'ensuite. L'interprète de la Bible doit faire de même : établir une histoire du texte. Connaître la langue dans laquelle il a été écrit, l'hébreu, avec ses tournures et ses images ; repérer ce qui est affirmé clairement et partout, et ce qui est obscur ou contradictoire ; savoir qui a écrit chaque livre, à quelle époque, pour qui[^1].\n\nD'où une règle simple et radicale : la connaissance de l'Écriture doit être cherchée dans l'Écriture seule[^1]. On ne lui attribuera aucun enseignement qu'on n'ait très clairement reconnu à partir de son histoire[^2].\n\n## Le sens et la vérité\n\nLe point le plus fin est ailleurs. Spinoza distingue deux questions que l'on confond sans cesse : que veut dire ce texte ? et ce qu'il dit est-il vrai ? Quand on cherche le sens, on s'occupe seulement du sens des phrases, non de leur vérité[^2].\n\nSon exemple est célèbre. Moïse dit que « Dieu est un feu ». La phrase est claire, mais elle heurte la raison, pour qui Dieu ne peut être une chose matérielle. Faut-il donc la lire comme une allégorie, parce qu'elle est absurde ? Non. Ce qui autorise à ne pas la lire littéralement, c'est que d'autres passages de l'Écriture refusent que Dieu ait un corps. Et c'est encore l'usage de la langue qui donne la clé : dans le livre de Job, le feu désigne la colère et la jalousie. Les deux propositions « Dieu est un feu » et « Dieu est jaloux » ont donc le même sens[^1]. Le texte est éclairé par le texte, non par la philosophie du lecteur. C'est là toute la différence entre interpréter et accommoder : l'interprète se laisse guider par la lettre, même quand elle le dérange ; celui qui accommode décide d'avance de ce que le texte a le droit de dire.\n\nOn mesure la conséquence : le sens trouvé, « Dieu est jaloux », reste lui aussi contraire à la raison. Spinoza ne le corrige pas. Il a établi ce que Moïse voulait dire ; il n'a pas prétendu que Moïse avait raison.\n\n> **Illustration (pas un exemple de Spinoza).** Un élève lit Aristote affirmant que les corps lourds tombent plus vite que les légers. Il est tenté de « sauver » le texte en supposant qu'Aristote parlait de la résistance de l'air. Le geste de Spinoza serait inverse : comprendre d'abord exactement ce qu'Aristote soutenait, dans sa langue et son monde, même si c'est faux. Corriger un texte avant de l'avoir compris, c'est ne plus le lire.\n\n## Deux domaines\n\nLa règle a une portée qui dépasse la lecture. Si l'on n'exige plus du texte qu'il soit vrai pour le comprendre, on n'a plus besoin de le tordre en allégorie chaque fois qu'il heurte une philosophie, ni de soumettre la raison à tout ce qu'il affirme. Les deux domaines se séparent : la théologie vise l'obéissance, la philosophie la vérité rationnelle, et la raison n'a pas à être subordonnée à l'Écriture[^3].\n\n## Une naissance de la critique\n\nLu ainsi, le texte biblique devient un document historique. Spinoza conteste que Moïse ait écrit le Pentateuque et voit dans la Bible hébraïque un ensemble composé de nombreuses mains[^3]. Il est considéré comme l'un des fondateurs de la critique biblique moderne[^3].\n\n> **Illustration (un parallèle avec la clinique).** Un patient dit : « Ma mère ne m'a jamais aimé. » Le clinicien n'a pas d'abord à décider si c'est vrai. Il cherche ce que la phrase veut dire pour celui qui la prononce, dans sa langue à lui, avec ses autres phrases et son histoire. La distinction de Spinoza entre le sens et la vérité est une règle d'écoute autant qu'une règle de lecture.","quiz":[{"question":"Quelle est, selon Spinoza, la méthode pour interpréter l'Écriture ?","choix":["La même que pour un poème : y chercher d'abord une émotion","Presque la même que pour étudier la nature : une enquête sur le texte","Celle des philosophes grecs, qui trouvent partout des allégories","Celle de l'autorité religieuse, seule habilitée à dire le sens"],"bonne":1,"explication":"Le chapitre VII affirme que la méthode d'interprétation de l'Écriture ne diffère guère de celle de la nature : une « histoire » du texte, sa langue, son contexte, ses passages clairs et obscurs."},{"question":"Pourquoi « Dieu est un feu » ne doit-il pas être lu littéralement ?","choix":["Parce que la phrase contredit la raison, qui sait que Dieu est immatériel","Parce que d'autres passages de l'Écriture refusent que Dieu ait un corps","Parce que Moïse n'a jamais écrit cette phrase dans le texte hébreu","Parce que toute phrase sur Dieu doit être lue comme une allégorie"],"bonne":1,"explication":"Ce n'est pas la raison du lecteur qui décide, mais le texte lui-même ; et l'usage de l'hébreu (le feu pour la jalousie, dans Job) en donne le sens : « Dieu est jaloux »."},{"question":"Une historienne étudie un traité médical du Moyen Âge plein d'erreurs. Quelle attitude Spinoza recommanderait-il ?","choix":["Établir d'abord ce que le texte affirme, avant de juger s'il est vrai","Corriger les erreurs pour rendre le texte acceptable aujourd'hui","Ignorer le texte, puisque ce qu'il dit est faux","Chercher un sens caché qui rendrait le texte conforme à la science"],"bonne":0,"explication":"« Nous nous occupons seulement du sens des phrases et non pas de leur vérité » : le sens d'abord, la question de la vérité ensuite, et séparément."},{"question":"Quel rapport Spinoza établit-il entre la théologie et la philosophie ?","choix":["La philosophie doit se soumettre aux enseignements de l'Écriture","La théologie est une philosophie imparfaite, à corriger par la raison","Elles ont des fins distinctes : l'obéissance pour l'une, la vérité pour l'autre","Elles se confondent, car l'Écriture contient toute la vérité"],"bonne":2,"explication":"La théologie vise l'obéissance, la philosophie la vérité rationnelle ; la raison n'a pas à être subordonnée à l'Écriture, ni l'Écriture pliée à la raison."}],"sources":[{"texte":"Spinoza, A Theologico-Political Treatise, chap. VII, trad. R. H. M. Elwes, Project Gutenberg","url":"https://www.gutenberg.org/cache/epub/990/pg990-images.html"},{"texte":"Spinoza, Traité théologico-politique, extraits (chap. VII et XIV), trad. J. Lagrée et P.-F. Moreau, dossier de textes, université Paris 1 Panthéon-Sorbonne","url":"https://philosophie.pantheonsorbonne.fr/sites/default/files/2025-03/texte_chantal_j_critique_religion_spinoza_textes.pdf"},{"texte":"Wikipédia (anglais), « Theologico-Political Treatise » (publication, condamnation, buts, critique biblique)","url":"https://en.wikipedia.org/wiki/Theologico-Political_Treatise"}]},{"id":"nietzsche-medecin-de-soi","discipline":"philosophie","titre":"Le médecin philosophe","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"mixte","fiabilite_note":"Le thème et les passages ont été repérés grâce au cours de Céline Denat (master, URCA). Les citations ont été vérifiées dans des traductions anglaises en ligne (Ecce Homo, trad. Ludovici ; Le Gai Savoir, préface, Theanarchistlibrary ; § 120, trad. Kaufmann, cité par Luis de Miranda) et sont retraduites ici. La République de Platon est citée dans la traduction de Jowett. La biographie vient de l'Encyclopédie de Stanford.","reference":"Le Gai Savoir, préface de 1886 et § 120 ; Ecce Homo (1888), « Pourquoi je suis si sage », §§ 1-2 ; Platon, République, III, 408d-e","accroche":"Nietzsche a été malade presque toute sa vie adulte. Il en a tiré une idée exigeante : on ne peut soigner les autres qu'après avoir appris à se soigner soi-même, et il n'existe pas une santé, mais des santés.","punch":"Il n'y a pas une santé. Il y a d'innombrables santés.","idee":"Nietzsche reprend la vieille image du philosophe médecin, mais à la lettre : le philosophe doit diagnostiquer la santé d'une époque. Pour en avoir le droit, il doit avoir traversé la maladie et s'en être guéri lui-même. Et il refuse toute norme unique de la santé : chacun a la sienne.","citation":"Thus there are innumerable healths of the body.","citation_source":"Nietzsche, Le Gai Savoir, § 120, trad. anglaise W. Kaufmann (1974), cité par Luis de Miranda — « Il y a donc d'innombrables santés du corps »","citation_url":"https://crealectics.com/2021/09/22/nietzsches-approach-to-philosophical-health/","liens":["canguilhem-normal-pathologique","nietzsche-ressentiment","epicure-mort"],"texte":"La santé de Nietzsche a toujours été fragile. Elle l'oblige à prendre un congé de l'université de Bâle en 1876-1877, puis, en 1879, à démissionner de son poste de professeur[^1]. Pendant dix ans, il mène une vie errante à la recherche d'un climat supportable, l'hiver en Italie, l'été à Sils Maria, en Suisse, jusqu'à son effondrement dans une rue de Turin, en janvier 1889[^1].\n\nCette maladie n'est pas un simple décor biographique. Elle devient chez lui un instrument de pensée.\n\n## Un vieux thème, pris à la lettre\n\nL'image du philosophe médecin est ancienne. Platon, dans la *République*, en donne déjà une version étonnante. Les médecins les plus habiles, dit Socrate, sont ceux qui, dès leur jeunesse, ont joint à la connaissance de leur art l'expérience la plus large de la maladie ; mieux vaut même qu'ils ne soient pas d'une santé robuste, et qu'ils aient eux-mêmes souffert de toutes sortes de maladies[^2]. La raison : ils ne soignent pas le corps avec le corps, mais avec l'esprit, et un esprit malade ne peut rien guérir[^2].\n\nNietzsche reprend l'idée, mais il en change le sens. Pour lui, le philosophe n'est pas médecin de l'âme par analogie : il l'est à la lettre, d'un corps qui est aussi une âme, et d'une culture entière. Dans la préface ajoutée en 1886 au *Gai Savoir*, il dit attendre encore un « médecin philosophe », au sens exceptionnel du mot, qui aurait à étudier le problème de la santé d'un peuple, d'une époque, de l'humanité[^3].\n\n## La maladie qui pense\n\nCe médecin-là commence par un diagnostic des philosophies elles-mêmes. Toute philosophie qui place la paix plus haut que la guerre, toute éthique qui conçoit le bonheur de façon négative, comme absence de trouble, autorise à se demander si ce n'est pas la maladie qui a inspiré le philosophe[^3]. Une pensée est aussi un symptôme : elle dit quelque chose de l'état de celui qui la produit.\n\nMais la maladie n'est pas seulement une faiblesse. Elle peut être un moyen de connaissance. C'est la grande douleur seule, écrit Nietzsche dans la même préface, qui est l'ultime libératrice de l'esprit[^3]. Celui qui a traversé de longues souffrances a appris à se méfier des évidences, à regarder la vie autrement.\n\n> **Illustration (pas un exemple de Nietzsche).** Une personne qui a connu une longue dépression ne voit plus de la même façon les conseils « positifs » qu'on lui donnait : « il suffit de vouloir », « pense à autre chose ». Elle sait, de l'intérieur, ce que ces formules ignorent. Son expérience de la maladie est devenue une forme de savoir, et parfois une sévérité envers les remèdes trop simples.\n\n## D'innombrables santés\n\nAu § 120 du *Gai Savoir*, Nietzsche conteste l'idée même d'une santé normale. Il existe d'innombrables santés du corps ; ce qu'est la santé dépend du but de chacun, de ses forces, de ses pulsions, de ses idéaux[^4]. Il demande que les médecins abandonnent le concept d'une santé normale, d'un régime normal et d'un cours normal de la maladie[^4]. Alors seulement, ajoute-t-il, on pourra réfléchir à la santé et à la maladie de l'âme[^4].\n\nOn reconnaît là une intuition que Georges Canguilhem développera plus tard en médecine : la santé n'est pas la conformité à une moyenne, mais la capacité d'un vivant à instituer ses propres normes (voir la fiche sur Canguilhem).\n\n## Se rendre à soi-même la santé\n\nSi chacun a sa santé propre, aucun médecin ne peut la connaître mieux que celui qui la vit, à condition qu'il apprenne à s'observer. Nietzsche fait de cette exigence l'un des thèmes d'*Ecce Homo*, l'autobiographie philosophique qu'il écrit en 1888.\n\nIl s'y décrit comme un décadent, mais aussi comme le contraire d'un décadent[^5]. Aux premiers signes d'une vie qui monte ou qui décline, dit-il, son flair est d'une sensibilité particulière[^5]. Et il raconte sa guérison : il s'est pris lui-même en main, il s'est rendu à lui-même la santé. La condition de cette réussite, précise-t-il, est d'être au fond sain[^5]. Car pour qui est fondamentalement sain, la maladie peut même devenir un puissant stimulant de la vie, un surcroît de vie[^5].\n\n> **Illustration (un parallèle avec la clinique).** Un patient arrive avec un diagnostic, un traitement, et l'habitude de déléguer entièrement aux soignants la question de ce qui lui fait du bien. Le travail consiste parfois à lui rendre cette question : qu'est-ce qui, pour vous, va mieux ou moins bien ? Nietzsche ne dit pas qu'il faut se passer de médecins, mais qu'on ne guérit pas sans devenir l'observateur attentif de sa propre vie.\n\n## Ce que l'idée exige\n\nLa formule de Nietzsche peut sembler orgueilleuse. Elle est d'abord une exigence de cohérence : celui qui prétend soigner les autres doit avoir fait la preuve qu'il sait reconnaître sa propre maladie, au lieu de recommander à tous le remède qui lui convient à lui seul. Elle rejoint une tradition antique, celle de la philosophie comme soin de soi, et elle annonce une question moderne : qui décide de ce qu'est, pour moi, être en bonne santé ?","quiz":[{"question":"Que demande Platon aux meilleurs médecins, dans la République ?","choix":["D'avoir toujours été d'une santé parfaite et robuste","D'avoir eux-mêmes connu toutes sortes de maladies","De ne soigner que les patients de leur propre famille","De laisser les malades guérir sans aucune intervention"],"bonne":1,"explication":"Les plus habiles sont ceux qui ont l'expérience de la maladie, et mieux vaut qu'ils aient souffert eux-mêmes de toutes sortes de maux : ils soignent le corps avec l'esprit."},{"question":"Que soutient Nietzsche au § 120 du Gai Savoir ?","choix":["Qu'une seule norme de santé vaut pour tous les êtres humains","Qu'il existe d'innombrables santés, selon les buts et les forces de chacun","Que la santé de l'âme ne dépend absolument pas de celle du corps","Que la médecine doit se fonder sur des moyennes statistiques"],"bonne":1,"explication":"Il demande aux médecins d'abandonner le concept de santé normale, de régime normal et de cours normal de la maladie : chacun a sa santé."},{"question":"Un ami vous recommande avec insistance le régime qui l'a guéri, en affirmant qu'il conviendra à tout le monde. Que lui objecterait Nietzsche ?","choix":["Qu'il a raison, puisque la santé est la même pour tous","Qu'il ne faut jamais suivre aucun régime ni aucun conseil","Que ce qui l'a guéri lui ne vaut pas forcément pour un autre","Que seul un médecin diplômé peut donner un conseil de santé"],"bonne":2,"explication":"Pour Nietzsche, il n'y a pas de santé en soi ; recommander à tous son propre remède, c'est ignorer qu'il existe d'innombrables santés."},{"question":"Comment Nietzsche, dans la préface du Gai Savoir, juge-t-il les philosophies qui placent la paix au-dessus de tout ?","choix":["Comme les plus saines et les plus sages de toutes","Comme pouvant être inspirées par la maladie de leur auteur","Comme indifférentes, car une philosophie ne dit rien de son auteur","Comme réservées à ceux qui ont échappé à toute souffrance"],"bonne":1,"explication":"Une philosophie qui place la paix plus haut que la guerre autorise à demander si la maladie n'a pas inspiré le philosophe : une pensée est aussi un symptôme."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Friedrich Nietzsche » (santé, départ de Bâle, vie errante, effondrement de 1889)","url":"https://plato.stanford.edu/entries/nietzsche/"},{"texte":"Platon, République, III, 408d-e, trad. Benjamin Jowett, Elpenor","url":"https://www.ellopos.net/elpenor/greek-texts/ancient-greece/plato/plato-politeia-2.asp?pg=38"},{"texte":"Nietzsche, The Joyful Wisdom (Le Gai Savoir), préface de 1886, §§ 2-3, The Anarchist Library","url":"https://theanarchistlibrary.org/library/friedrich-nietzsche-the-gay-science.html"},{"texte":"Luis de Miranda, « Nietzsche's Approach to Philosophical Health », Crealectics, 2021 (cite Le Gai Savoir, § 120, trad. Kaufmann)","url":"https://crealectics.com/2021/09/22/nietzsches-approach-to-philosophical-health/"},{"texte":"Nietzsche, Ecce Homo, « Why I am so wise », §§ 1-2, trad. A. M. Ludovici, Project Gutenberg","url":"https://gutenberg.org/cache/epub/52190/pg52190-images.html"}]},{"id":"augustin-interpreter","discipline":"philosophie","titre":"Le texte obscur","figure":"Augustin d'Hippone","branche":"langage","fiabilite":"primaire","fiabilite_note":"Les passages ont été repérés grâce au cours de Céline Denat (master de philosophie, URCA) et vérifiés dans des traductions françaises du XIXe siècle en ligne : les Confessions dans la traduction de Moreau, De la doctrine chrétienne dans celle de l'abbé Hussenot (1866), dont la numérotation des chapitres diffère parfois des éditions modernes. Le Maître (De magistro) est présenté d'après l'Encyclopédie de Stanford.","reference":"Le Maître (De magistro) ; Confessions, XI, 3 et XII, 25 ; De la doctrine chrétienne, I-II","accroche":"Augustin voudrait interroger Moïse sur la première phrase de la Bible. Mais même si Moïse était là, dit-il, cela ne suffirait pas. Le sens d'un texte ne se reçoit pas : il se reconnaît.","punch":"Un mot ne t'apprend rien que tu ne saches déjà. Il t'avertit de chercher.","idee":"Pour Augustin, les signes n'enseignent pas par eux-mêmes : comprendre, c'est reconnaître en soi ce qu'ils désignent. L'interprétation commence là où cette reconnaissance échoue, devant un passage obscur. Plusieurs lectures vraies sont possibles, mais aucune n'est juste si elle trahit la charité.","citation":"Mais d'où saurais-je qu'il me dirait la vérité ?","citation_source":"Augustin, Confessions, livre XI, chap. 3, § 5, trad. Moreau","citation_url":"https://bkv.unifr.ch/works/cpl-251/versions/aug-conf-moreau/divisions/192","liens":["spinoza-ecriture","ricoeur-soupcon","freud-reve"],"texte":"Augustin naît le 13 novembre 354 à Thagaste, en Afrique romaine, et meurt le 28 août 430 à Hippone, pendant le siège de la ville par les Vandales[^4]. Il se convertit à l'été 386 ; il devient prêtre, puis évêque d'Hippone vers 396[^4]. Toute son œuvre est traversée par une question de lecteur : comment comprendre un texte, et d'abord le plus difficile de tous à ses yeux, la Bible ?\n\n## Les signes n'enseignent rien\n\nDans un dialogue, *Le Maître*, Augustin défend une thèse déroutante : nous n'apprenons rien des signes eux-mêmes. Pour comprendre un mot, il faut déjà connaître la chose qu'il désigne[^4]. Si un mot m'est inconnu, l'entendre ne me l'apprend pas ; si je le connais, l'entendre ne m'apprend rien de nouveau.\n\nLes mots n'en sont pas inutiles pour autant. Ils nous renseignent sur ce que nous ne pouvons pas voir nous-mêmes, et nous font croire ce que d'autres ont vu[^4]. Mais pour ce qui se comprend vraiment, l'enseignement se fait au-dedans : Augustin parle d'un maître intérieur, le Christ présent dans l'âme, et d'une illumination[^4]. Le professeur parle ; l'élève, s'il comprend, reconnaît en lui-même que c'est vrai.\n\nLe signe, dans *De la doctrine chrétienne*, est défini ainsi : ce qui, outre l'objet qu'il offre à nos sens, fait naître dans notre esprit l'idée d'une autre chose[^3]. La fumée renvoie au feu, le mot renvoie à ce qu'il nomme. Tout signe est une chose, mais toute chose n'est pas un signe.\n\n> **Illustration (pas un exemple d'Augustin).** Un ami vous explique une démonstration mathématique. Pendant dix minutes, vous suivez les mots sans rien voir. Puis, d'un coup, « ça y est ». Rien de nouveau n'a été dit à cet instant ; c'est vous qui avez vu. Augustin dirait que les paroles de votre ami vous ont seulement averti de regarder au bon endroit.\n\n## Si Moïse était là\n\nAu livre XI des *Confessions*, Augustin bute sur la première phrase de la Genèse : « Dans le principe, Dieu créa le ciel et la terre. » Que veut dire « dans le principe » ? Un commencement dans le temps ? Un fondement éternel ?\n\nIl imagine alors interroger l'auteur. Moïse l'a écrit ; il l'a écrit et s'en est allé[^1]. S'il était là, Augustin le supplierait de lui en dévoiler le sens[^1]. Mais la difficulté rebondit aussitôt : s'il parlait hébreu, ses mots frapperaient en vain les oreilles d'Augustin ; s'il parlait latin, Augustin comprendrait les mots, mais d'où saurait-il que Moïse lui dit la vérité[^1] ? La réponse ne viendrait pas de Moïse : elle viendrait de la vérité elle-même, qui n'est ni hébraïque, ni grecque, ni latine, ni barbare, et qui parle au-dedans sans voix ni organe[^1].\n\nInterroger l'auteur ne suffirait donc pas. Ce qui reste, c'est le texte, et le travail de celui qui le lit.\n\n## Des règles pour les passages obscurs\n\nL'interprétation commence là où la compréhension immédiate échoue. Or l'Écriture mêle, selon Augustin, des passages clairs et d'autres obscurs, et cela n'est pas un défaut : les uns nourrissent le besoin pressant de connaître, les autres servent de remède contre le dégoût et l'ennui[^3]. Le texte difficile oblige à chercher.\n\n*De la doctrine chrétienne* donne donc des règles. On éclaire un passage obscur par un passage clair. On apprend les langues dans lesquelles le texte a été écrit, pour ne pas être arrêté par une ambiguïté de traduction. On distingue le sens propre et le sens figuré des mots. Et l'on dispose d'un critère ultime : la charité.\n\n## Le critère de la charité\n\nAugustin pose une règle d'une grande portée. Celui qui croit avoir compris les Écritures, en tout ou en partie, sans que cette connaissance serve à établir le double amour de Dieu et du prochain, n'en a pas encore la moindre intelligence[^3]. Comprendre n'est pas seulement savoir ce que dit un texte : c'est en être transformé.\n\nCe critère vaut aussi pour la manière de débattre des interprétations. Au livre XII des *Confessions*, Augustin admet que plusieurs lectures vraies d'un même verset sont possibles. Ce qu'il condamne, c'est la prétention d'un seul à détenir le vrai sens de Moïse : ce serait une folie[^2]. Ceux qui tiennent à leur lecture parce qu'elle est la leur, et non parce qu'elle est vraie, n'aiment pas la vérité, mais eux-mêmes ; car la vérité n'est ni à moi, ni à lui, ni à tel autre : elle est à nous tous[^2]. Et c'est à ces deux commandements de l'amour que Moïse a rapporté les pensées de ses Écritures[^2].\n\n> **Illustration (un parallèle avec la clinique).** Deux soignants discutent d'un patient et s'opposent sur l'interprétation d'un rêve qu'il a raconté. Chacun a de bons arguments. La règle d'Augustin, transposée, invite à deux choses : admettre que plusieurs lectures peuvent être vraies à la fois, et se méfier de celle qu'on défend surtout parce qu'elle est la sienne. Le critère n'est pas qui a gagné, mais ce qui aide le patient.\n\n## Comprendre et se comprendre\n\nLes *Confessions* sont elles-mêmes une interprétation : Augustin y relit sa propre vie à la lumière des textes qu'il a appris à lire. Le lecteur qui comprend un texte se trouve renvoyé à lui-même. C'est l'une des lignes que suivront, bien plus tard, l'herméneutique et la psychanalyse : un sens ne se transmet pas comme un objet, il se reconnaît, et cette reconnaissance change celui qui la fait.","quiz":[{"question":"Que soutient Augustin dans Le Maître à propos des signes ?","choix":["Qu'ils transmettent directement la connaissance des choses","Que pour comprendre un mot, il faut déjà connaître ce qu'il désigne","Que seuls les signes écrits ont une valeur d'enseignement","Que les mots sont inutiles et qu'il faut s'en passer"],"bonne":1,"explication":"Les signes n'enseignent pas par eux-mêmes : ils renvoient à des choses qu'il faut déjà connaître. Ils avertissent de chercher ; l'enseignement réel se fait au-dedans."},{"question":"Pourquoi interroger Moïse ne suffirait-il pas, selon Augustin ?","choix":["Parce que Moïse a sans doute écrit dans une langue aujourd'hui perdue","Parce que Moïse aurait refusé de répondre à un lecteur chrétien","Parce qu'il faudrait encore reconnaître en soi qu'il dit vrai","Parce que l'hébreu ne peut pas être traduit fidèlement en latin"],"bonne":2,"explication":"Même en comprenant ses mots, Augustin devrait reconnaître en lui-même qu'ils sont vrais. La vérité, « ni hébraïque, ni grecque, ni latine », parle au-dedans."},{"question":"Deux lecteurs défendent chacun leur interprétation d'un même poème, avec acharnement. Que leur dirait Augustin ?","choix":["Que seule compte l'intention de l'auteur, qu'il faut retrouver à tout prix","Que plusieurs lectures peuvent être vraies, et qu'il faut se méfier de son attachement à la sienne","Que toute interprétation se vaut et qu'il est donc inutile d'en débattre","Qu'il faut s'en remettre sans discuter à l'autorité la plus ancienne"],"bonne":1,"explication":"Augustin admet plusieurs interprétations vraies, mais juge folle la prétention d'en détenir seul le vrai sens : la vérité « est à nous tous »."},{"question":"Quel critère ultime Augustin donne-t-il pour juger qu'on a compris l'Écriture ?","choix":["La connaissance parfaite de l'hébreu et du grec dans lesquels il fut écrit","Que cette compréhension serve au double amour de Dieu et du prochain","L'accord exact avec l'interprétation des évêques de son temps","La capacité à réciter de mémoire le texte entier de la Bible"],"bonne":1,"explication":"Qui croit comprendre les Écritures sans que cela serve au double amour de Dieu et du prochain « n'en a pas encore la moindre intelligence »."}],"sources":[{"texte":"Augustin, Confessions, livre XI, chap. 3, § 5, trad. Moreau, Bibliothek der Kirchenväter (université de Fribourg)","url":"https://bkv.unifr.ch/works/cpl-251/versions/aug-conf-moreau/divisions/192"},{"texte":"Augustin, Confessions, livre XII, chap. 25, §§ 34-35, trad. Moreau, Bibliothek der Kirchenväter","url":"https://bkv.unifr.ch/works/cpl-251/compare/aug-conf-moreau/246/aug-conf-bkv"},{"texte":"Augustin, De la doctrine chrétienne, livres I-II, trad. Hussenot (1866), Bibliothek der Kirchenväter (PDF)","url":"https://bkv.unifr.ch/files/de-la-doctrine-chretienne/related_files/De%20la%20doctrine%20chr%C3%A9tienne_franz%C3%B6sisch_525.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Saint Augustine » (dates, De magistro, maître intérieur, signes)","url":"https://plato.stanford.edu/entries/augustine/"}]},{"id":"nietzsche-homo-natura","discipline":"philosophie","titre":"Retraduire l'homme en nature","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"mixte","fiabilite_note":"Le § 230 de Par-delà bien et mal est cité dans la traduction anglaise que Christopher Janaway en donne (d'après l'édition de Cambridge, modifiée), dans un article en accès libre de 2024 ; les citations sont retraduites ici. Le passage a été repéré grâce au cours de Céline Denat (master, URCA). Le § 22 est cité d'après la traduction d'Helen Zimmern.","reference":"Par-delà bien et mal (1886), §§ 22, 229-230","accroche":"Nous aimons nous voir comme des esprits qui cherchent la vérité. Nietzsche propose un exercice plus rude : gratter les belles couleurs dont nous nous sommes peints, et relire le texte qui est dessous.","punch":"L'esprit ressemble moins à un œil qu'à un estomac.","idee":"Au § 230 de Par-delà bien et mal, l'esprit est décrit comme une volonté de maîtrise qui simplifie et digère. Contre elle, le chercheur a un penchant à voir profond, qui est une cruauté envers soi. Il doit gratter les interprétations flatteuses peintes sur le « texte fondamental » de l'homme naturel.","citation":"Really, \"Geist\" resembles a stomach more than anything.","citation_source":"Nietzsche, Par-delà bien et mal, § 230, trad. anglaise C. Janaway (2024) — « En vérité, c'est à un estomac que l'esprit ressemble le plus »","citation_url":"https://doi.org/10.1093/monist/onae016","liens":["nietzsche-perspectivisme","freud-moi-pas-maitre","nietzsche-ressentiment"],"texte":"*Par-delà bien et mal* paraît en 1886. Son § 230 est l'un des plus commentés de Nietzsche, parce qu'il contient une formule souvent lue comme un programme : il faut « retraduire l'homme en nature »[^1]. Le passage est plus étrange et plus inquiet qu'un simple manifeste. Il décrit l'esprit humain comme un champ de forces, et le chercheur comme quelqu'un qui se fait violence.\n\n## Une volonté qui digère\n\nNietzsche part de ce qu'il appelle la volonté fondamentale de l'esprit. Elle veut être maître en elle-même et autour d'elle, et se sentir maître[^1]. Pour cela, elle incorpore, simplifie, assimile le nouveau à l'ancien ; elle tend constamment vers les apparences et les surfaces[^1]. D'où la comparaison : l'esprit ressemble avant tout à un estomac[^1]. Il ne reflète pas le monde comme un miroir : il le digère, en prend ce qui le nourrit, rejette ou ignore le reste.\n\nL'image est provocante pour qui se représente la connaissance comme un regard désintéressé. Elle dit que penser, c'est d'abord s'approprier, et que nos idées portent la marque de nos besoins.\n\n> **Illustration (pas un exemple de Nietzsche).** Quelqu'un apprend une mauvaise nouvelle sur un ami qu'il admire. Très vite, il « range » l'information : un malentendu, une période difficile, rien qui change l'essentiel. Le détail dérangeant a été digéré, ramené à ce qu'on savait déjà. C'est la pente ordinaire de l'esprit : simplifier pour rester maître de son monde.\n\n## La cruauté de celui qui cherche\n\nMais il existe chez le chercheur un penchant contraire. Nietzsche le dit « sublime » : il veut prendre les choses en profondeur, de manière multiple, radicale[^1]. Ce penchant contrarie la pente de l'esprit vers les surfaces ; il l'oblige à voir ce qu'il préférerait digérer. C'est pourquoi Nietzsche y reconnaît une forme de cruauté envers soi, et il le dit dans le paragraphe précédent : il y a une goutte de cruauté dans tout vouloir-savoir[^1].\n\nLe mot ne condamne pas. Le § 229 demande justement de revoir notre idée de la cruauté[^1]. La probité intellectuelle fait mal, parce qu'elle va contre le confort de l'esprit ; et c'est pour cela qu'elle est rare.\n\nLe chercheur est ainsi divisé contre lui-même. Une part de lui veut un monde simple, rassurant, déjà connu ; une autre veut voir ce qui dérange. Ces deux volontés ne s'annulent pas : elles cohabitent dans le même esprit, et la connaissance naît de leur tension, non d'un regard neutre qui n'aurait aucun intérêt à ce qu'il découvre.\n\n## Le texte sous la peinture\n\nVient alors l'image centrale. Sur le « texte fondamental » de l'*homo natura*, l'homme naturel, la vanité humaine a peint et griffonné des interprétations flatteuses, des sens accessoires et fantaisistes[^1]. Il faut que ce terrible texte fondamental soit de nouveau reconnu[^1]. Retraduire l'homme en nature, c'est se tenir devant l'homme comme on se tient déjà, endurci par la discipline, devant le reste de la nature[^1].\n\nNietzsche était philologue de formation, et l'image vient de ce métier : un texte recouvert de commentaires, qu'il faut restituer sous ce qu'on y a ajouté. Il l'emploie aussi au § 22 contre les physiciens qui parlent de la « conformité de la nature à des lois » : c'est là, dit-il, de l'interprétation, et non du texte[^2].\n\nLe texte fondamental n'est pourtant pas une vérité dernière. C'est encore un texte, c'est-à-dire quelque chose qui se lit et s'interprète. Ce que Nietzsche refuse, c'est que l'homme se croie d'une autre origine que la nature, ou plus haut qu'elle[^1].\n\n> **Illustration (un parallèle avec la clinique).** Un patient explique ses choix par de nobles motifs : le devoir, le dévouement, la fidélité. Au fil des séances, d'autres raisons apparaissent, moins glorieuses : la peur d'être abandonné, le besoin d'être indispensable. Elles n'annulent pas les premières, mais elles étaient dessous. Le geste que décrit Nietzsche, gratter la peinture pour retrouver le texte, ressemble à ce travail, avec la même résistance et le même coût.\n\n## Pourquoi la connaissance ?\n\nLe paragraphe se termine sur une question. Pourquoi la connaissance, en somme ? Pourquoi choisir cette tâche folle ? Nietzsche avoue qu'on n'a pas trouvé, et qu'on ne trouve pas, de meilleure réponse[^1].\n\nPour Christopher Janaway, la seule réponse disponible supposerait que la vérité a une valeur supérieure et presque morale, ce que ce naturalisme doit justement refuser. Le texte est ainsi moins un programme qu'une impasse assumée : un naturalisme surtout négatif, qui dit ce que l'homme n'est pas, et qui laisse ouverte la question de sa propre valeur[^1]. C'est peut-être ce qui le rend si actuel : il demande du courage pour voir, sans promettre que voir rende heureux.","quiz":[{"question":"À quoi Nietzsche compare-t-il l'esprit, au § 230 ?","choix":["À un miroir qui reflète fidèlement le monde","À un estomac qui digère et s'approprie","À une lampe qui éclaire les choses de l'extérieur","À une page blanche que l'expérience remplit"],"bonne":1,"explication":"La volonté fondamentale de l'esprit veut être maître : elle incorpore, simplifie, assimile le nouveau à l'ancien. L'esprit ressemble avant tout à un estomac."},{"question":"Pourquoi Nietzsche parle-t-il de « cruauté » à propos de celui qui cherche la vérité ?","choix":["Parce que les savants sont souvent durs avec leurs collègues","Parce que vouloir voir en profondeur fait violence à la pente de l'esprit","Parce que la connaissance sert surtout à dominer les autres","Parce que la science impose des expériences sur les animaux"],"bonne":1,"explication":"Le penchant à prendre les choses « en profondeur, multiples, radicales » contrarie la pente de l'esprit vers les surfaces : il y a une goutte de cruauté dans tout vouloir-savoir."},{"question":"Une femme découvre que son engagement associatif, qu'elle croyait purement altruiste, sert aussi à fuir sa solitude. Que dirait Nietzsche de cette découverte ?","choix":["Qu'elle doit abandonner son engagement, devenu sans valeur","Qu'elle gratte une interprétation flatteuse peinte sur le « texte » de sa nature","Qu'elle se trompe, car les motifs altruistes sont toujours purs","Qu'aucune explication de ses actes n'est préférable à une autre"],"bonne":1,"explication":"Nietzsche demande de reconnaître le « texte fondamental » de l'homme sous les interprétations flatteuses de la vanité. Cela n'exige pas de renoncer à l'action, mais de voir ce qu'il y a dessous."},{"question":"Que signifie « retraduire l'homme en nature » ?","choix":["Revenir à un état sauvage, sans culture ni morale","Réduire l'être humain à sa seule biologie mesurable","Se tenir devant l'homme comme devant le reste de la nature, sans flatterie","Prouver scientifiquement que l'homme est supérieur aux animaux"],"bonne":2,"explication":"Il s'agit de cesser de croire l'homme d'une autre origine que la nature, ou plus haut qu'elle, et de l'examiner avec la même discipline que le reste de la nature."}],"sources":[{"texte":"Christopher Janaway, « Why Naturalism? Translating Homo Natura Back into Nietzsche's Text », The Monist, 107, 2024, p. 307-321 (traduction et lecture du § 230)","url":"https://doi.org/10.1093/monist/onae016"},{"texte":"Nietzsche, Beyond Good and Evil, § 22, trad. Helen Zimmern, Project Gutenberg","url":"https://gutenberg.org/cache/epub/4363/pg4363-images.html"}]},{"id":"foucault-aveu","discipline":"croisement","titre":"La bête d'aveu","figure":"Michel Foucault","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"Les textes de Foucault n'ont pas été consultés directement : ils sont cités à travers deux articles en accès libre (Stuart Elden, 2005 ; Andrea Teti, 2018), qui les donnent en traduction anglaise avec leurs pages, retraduites ici, et à travers Wikipédia et une note critique d'Acta fabula pour Les Aveux de la chair. Le thème a été repéré grâce au cours de Saverio Ansaldi (master, URCA).","reference":"Histoire de la sexualité, I, La Volonté de savoir (1976) ; IV, Les Aveux de la chair (posthume, 2018)","accroche":"On croit que parler de son sexe, c'est se libérer d'un interdit. Foucault retourne l'idée : l'Occident n'a jamais cessé de faire parler du sexe, et le divan est l'héritier du confessionnal.","punch":"Nous croyons nous libérer en avouant. Et si l'aveu était lui-même une forme de pouvoir ?","idee":"Pour Foucault, l'Occident n'a pas réprimé la sexualité : il l'a fait parler, par la confession, puis la médecine et la psychanalyse. L'aveu lie le sujet à la vérité qu'il dit de lui-même, devant une instance qui l'écoute et le juge. D'où une question adressée à la cure.","citation":"Western man has become a confessing animal (bête d'aveu).","citation_source":"Foucault, La Volonté de savoir (1976), trad. anglaise R. Hurley, p. 59, cité par Andrea Teti (2018) — « L'homme, en Occident, est devenu une bête d'aveu »","citation_url":"https://abdn.pure.elsevier.com/files/152550979/Teti_MateriFou_Confesssion_VOR.pdf","liens":["freud-transfert","foucault-histoire-de-la-folie","augustin-interpreter"],"texte":"En 1976, Michel Foucault publie le premier volume d'une *Histoire de la sexualité*, *La Volonté de savoir*. Il annonce une série qu'il ne réalisera pas comme prévu. Huit ans plus tard, en 1984, paraissent deux autres volumes consacrés à l'Antiquité grecque et romaine, *L'Usage des plaisirs* et *Le Souci de soi*[^3]. Le quatrième, *Les Aveux de la chair*, consacré aux premiers siècles chrétiens, ne paraîtra qu'en 2018, plus de trente ans après sa mort[^3].\n\nLe fil qui relie ces livres, et qui a fini par en bouleverser le plan, est une pratique : l'aveu.\n\n## L'hypothèse répressive\n\nLe point de départ est une idée que Foucault conteste. On raconte d'ordinaire que la sexualité aurait été réprimée du XVIIe au début du XXe siècle, et que nous serions en train de nous en libérer en en parlant enfin. Foucault appelle ce récit l'« hypothèse répressive »[^3].\n\nIl soutient le contraire : depuis le XVIIe siècle, on assiste à une véritable explosion discursive autour du sexe, dans un vocabulaire autorisé[^3]. On n'a pas fait taire le sexe ; on l'a mis en discours, on l'a fait avouer. La Contre-Réforme demande aux fidèles de confesser non seulement leurs actes, mais leurs désirs ; la pratique s'étend ensuite aux relations entre parents et enfants, entre patients et psychiatres, entre élèves et éducateurs[^3].\n\n## Ars erotica, scientia sexualis\n\nFoucault oppose deux manières de lier le sexe et la vérité. Certaines sociétés, anciennes ou orientales, ont développé un *ars erotica*, un art érotique où la vérité vient du plaisir lui-même. L'Occident a développé une *scientia sexualis* : il cherche la « vérité » du sexe par l'étude et le savoir[^3].\n\nEt cette science passe par l'aveu. D'où la formule qui a fait le tour du monde : l'homme, en Occident, est devenu une bête d'aveu[^2]. Ailleurs, Foucault la reformule ainsi : en Occident, la sexualité n'a pas été quelque chose qu'on cache, mais quelque chose qu'on avoue[^1].\n\n> **Illustration (pas un exemple de Foucault).** Sur les réseaux sociaux, quelqu'un publie un long texte où il « révèle enfin » une part intime de sa vie. Les réponses affluent, elles approuvent, jugent, classent. Il se sent libéré, et c'est peut-être vrai. Mais la scène a aussi la structure que Foucault décrit : un récit de soi adressé à une instance qui écoute, apprécie, et lui rend une identité.\n\n## Ce qu'est un aveu\n\nAvouer n'est pas seulement informer. Dans des leçons données à Louvain en 1981, Foucault définit l'aveu comme un acte verbal par lequel le sujet affirme ce qu'il est et se lie à cette vérité[^2]. Celui qui avoue ne se contente pas de dire un fait : il se constitue lui-même dans ce qu'il dit, et il le fait devant un autre, qui reçoit sa parole, l'apprécie et peut en tirer des conséquences.\n\nC'est ce qui rend l'aveu si puissant. Le pouvoir ne s'y exerce pas en interdisant de parler, mais en faisant parler.\n\n## Le divan et le confessionnal\n\nFoucault en tire une thèse qui touche directement la psychanalyse. Dans la psychiatrie du XIXe siècle, l'aveu sexuel devient l'une des pierres angulaires de l'opération « curative » ; et c'est cette même pratique de la confession, dit-il, que Freud a reprise dans la technique psychanalytique[^1]. *La Volonté de savoir* ironise sur une civilisation où des préposés reçoivent rétribution pour écouter chacun faire confidence de son sexe[^5].\n\nLa critique est sévère. On peut la lire moins comme une condamnation que comme une question : elle demande d'où vient le dispositif de la cure, et quelles évidences il hérite : qu'il y aurait une vérité cachée du sujet, logée dans son sexe, et qu'il suffirait de la dire à quelqu'un pour en être délivré.\n\n> **Illustration (un parallèle avec la clinique).** Un patient commence chaque séance par : « Il faut que je vous avoue quelque chose. » Le mot n'est pas anodin. Il place l'analyste en confesseur, et lui-même en pénitent qui attend un verdict. La lecture de Foucault invite à entendre cette demande comme telle, plutôt qu'à y répondre ; la règle de l'association libre, qui demande de tout dire sans trier, n'est pas la même chose qu'un aveu de fautes.\n\n## Un détour par les premiers chrétiens\n\nCette question de l'aveu a fini par déplacer tout le projet. Le deuxième volume, d'abord annoncé sous le titre *La Chair et le Corps*, devient en 1977 *Les Aveux de la chair*[^4]. Pour comprendre l'aveu moderne, Foucault remonte de plus en plus loin, jusqu'à l'Antiquité tardive et aux premiers siècles chrétiens[^1]. Lui-même reconnaît qu'il se heurte constamment à l'aveu et se demande s'il faut en écrire l'histoire comme celle d'une technique[^1].\n\nLe livre, issu de ses cours de 1979-1980, étudie l'examen de conscience et la confession dans la littérature chrétienne ancienne, et notamment chez Augustin[^3]. Foucault en avait remis le manuscrit à Gallimard en 1982 ; sa mort, en 1984, l'a empêché d'en achever la correction[^4]. Il est publié en 2018, édité par Frédéric Gros, alors que Foucault avait demandé qu'il n'y ait pas d'édition posthume[^4].\n\nStuart Elden voit dans cette histoire un « échec productif » : le plan initial a échoué à cause de l'aveu, mais cet échec a ouvert les recherches des dernières années, sur l'Antiquité et sur le rapport à soi[^1].\n\n## Ce qui reste discuté\n\nL'importance que Foucault donne à la confession à partir du XIIIe siècle a été contestée par l'historien Payer, en 1985[^1]. Andrea Teti montre de son côté que, dans les premiers travaux de Foucault, les mots « aveu » et « confession » ne sont pas clairement distingués, et qu'il faut se méfier des usages trop larges de la formule de la « bête d'aveu »[^2]. La question demeure pourtant, pour qui écoute : qu'est-ce qui, dans une parole sur soi, libère, et qu'est-ce qui assigne ?","quiz":[{"question":"Que conteste Foucault sous le nom d'« hypothèse répressive » ?","choix":["L'idée que le pouvoir politique est toujours violent","L'idée que la sexualité aurait été réduite au silence","L'idée que la psychanalyse soigne réellement les névroses","L'idée que les Grecs ignoraient tout de la sexualité"],"bonne":1,"explication":"On raconte que le sexe aurait été réprimé puis libéré. Foucault montre au contraire une « explosion discursive » : on n'a cessé de faire parler du sexe."},{"question":"Qu'oppose Foucault à l'ars erotica ?","choix":["Une morale chrétienne fondée sur la seule abstinence","Une scientia sexualis, qui cherche la vérité du sexe par l'aveu","Une pornographie moderne diffusée par les médias","Une poésie amoureuse héritée du Moyen Âge courtois"],"bonne":1,"explication":"L'ars erotica tire la vérité du plaisir lui-même ; la scientia sexualis occidentale cherche la « vérité » du sexe par le savoir, et passe par l'aveu."},{"question":"Une patiente commence ses séances en disant : « Je dois vous avouer quelque chose. » Que suggère la lecture de Foucault ?","choix":["Qu'il faut l'encourager à tout avouer pour se libérer","Que la psychanalyse n'a rien à voir avec l'histoire de la confession","Qu'elle place peut-être l'analyste en confesseur dont elle attend un verdict","Qu'elle ment, puisque tout aveu est une construction"],"bonne":2,"explication":"Foucault voit dans la cure l'héritière de la confession. Entendre la demande d'aveu comme telle, sans y répondre en juge, est une manière de ne pas reproduire ce dispositif."},{"question":"Comment Foucault définit-il l'aveu dans ses leçons de Louvain (1981) ?","choix":["Un acte par lequel le sujet dit ce qu'il est et s'y lie","Une simple information donnée sur un fait passé, sans enjeu","Un mensonge destiné à obtenir le pardon d'une faute","Une technique réservée aux seuls tribunaux ecclésiastiques"],"bonne":0,"explication":"Avouer, c'est se constituer dans ce qu'on dit de soi, devant un autre qui reçoit, apprécie et juge cette parole."}],"sources":[{"texte":"Stuart Elden, « The Problem of Confession: The Productive Failure of Foucault's History of Sexuality », Journal for Cultural Research, 9, 1, 2005, p. 23-41","url":"https://progressivegeographies.com/wp-content/uploads/2012/06/the-problem-of-confession.pdf"},{"texte":"Andrea Teti, « Confession and Avowal in Foucault's early work, 1954-1972 », Materiali foucaultiani, VII, 13-14, 2018, p. 232-252","url":"https://abdn.pure.elsevier.com/files/152550979/Teti_MateriFou_Confesssion_VOR.pdf"},{"texte":"Wikipédia (anglais), « The History of Sexuality » (hypothèse répressive, ars erotica, volumes, publication de 2018)","url":"https://en.wikipedia.org/wiki/The_History_of_Sexuality"},{"texte":"Philippe Chevallier, « Le dernier livre de Foucault : l'ombre d'un doute ? », Acta fabula, 24, 10, 2023 (histoire du manuscrit des Aveux de la chair)","url":"https://www.fabula.org/pdf/acta-17418.pdf"},{"texte":"SchoolMouv, « La Volonté de savoir, Michel Foucault », fiche d'œuvre (citation sur les « préposés »)","url":"https://www.schoolmouv.fr/fiches-de-lecture/la-volonte-de-savoir-michel-foucault/fiche-oeuvre"}]},{"id":"bruno-fureurs-heroiques","discipline":"philosophie","titre":"Le chasseur devenu proie","figure":"Giordano Bruno","branche":"fondamentaux","fiabilite":"mixte","fiabilite_note":"Des fureurs héroïques est cité dans deux traductions anglaises en ligne, celle de L. Williams (1887) et celle de P. E. Memmo (1964), retraduites ici ; le texte italien n'a pas été consulté. La biographie et la cosmologie viennent de l'Encyclopédie de Stanford, le mythe d'Actéon d'une traduction française d'Ovide. Le thème a été repéré grâce au cours de Saverio Ansaldi (master, URCA).","reference":"Des fureurs héroïques (De gli eroici furori, 1585), Ire partie, dialogues 3 et 4","accroche":"Actéon surprend Diane au bain, devient cerf et meurt dévoré par ses propres chiens. Giordano Bruno fait de ce mythe cruel l'image la plus haute de la connaissance.","punch":"À force de chercher le divin, on finit par devenir ce qu'on cherche.","idee":"Dans les Fureurs héroïques, Bruno décrit un amour qui ne vise pas une femme mais l'infini. Le mythe d'Actéon en donne la figure : le chasseur, lancé avec ses chiens, ses pensées, à la poursuite de la beauté divine, est transformé par ce qu'il contemple et devient lui-même la proie.","citation":"He sees: and the great hunter straight becomes that which he hunts.","citation_source":"Bruno, Des fureurs héroïques, Ire partie, 4e dialogue, sonnet d'Actéon, trad. anglaise L. Williams (1887) — « Il voit, et le grand chasseur devient aussitôt ce qu'il chasse »","citation_url":"https://neonvagabond.xyz/mirrors/sacred-texts/aor/bruno/the/the107.htm","liens":["spinoza-desir","banquet-freud-lacan","platon-reminiscence"],"texte":"Giordano Bruno naît au début de 1548 à Nola, près de Naples. À dix-sept ans, il entre chez les dominicains de San Domenico Maggiore et prend le nom de Giordano[^1]. En 1576, il fuit le couvent, et pendant quatorze ans il erre à travers l'Italie, la France, la Suisse, l'Angleterre, l'Allemagne et la Bohême[^1]. Revenu à Venise en 1591, il est dénoncé à l'Inquisition le 22 mai 1592 ; livré à Rome, il refuse de se rétracter au terme d'un long procès, et il est brûlé vif au Campo de' Fiori le 17 février 1600[^1].\n\n## Un univers infini\n\nBruno est d'abord connu pour sa cosmologie. Il rejette l'image d'un monde clos, fait de sphères emboîtées comme les couches d'un oignon, et décrit l'univers comme une étendue infinie et homogène, peuplée d'une infinité de systèmes solaires semblables au nôtre[^1]. Cet univers sans bord est, pour lui, l'expression de la puissance infinie de Dieu, et comme son miroir[^1].\n\nUne question surgit aussitôt : si l'univers est infini, comment un être fini peut-il s'y rapporter ? Comment aimer, comment connaître ce qui n'a pas de mesure ? C'est la question des *Fureurs héroïques*.\n\n## Contre Pétrarque\n\nLe livre paraît en 1585, sous une fausse adresse parisienne, pendant le séjour de Bruno en Angleterre[^2][^5]. Il est dédié au poète Philip Sidney[^2]. Il se compose de deux parties de cinq dialogues chacune[^5], où des poèmes sont suivis de leur commentaire.\n\nLa dédicace commence par une attaque. Bruno s'en prend au poète toscan qui s'est montré si éperdu sur les bords de la Sorgue, où l'on reconnaît Pétrarque, et à tous ceux qui dépensent leur génie pour l'amour d'une femme : il y voit la gloire la plus vaine, la plus vile et la plus infâme[^2]. Son dessein premier, dit-il, est de signifier la contemplation divine et de présenter aux yeux et aux oreilles d'autres fureurs[^2].\n\nLe vocabulaire de l'amour courtois est donc conservé, mais détourné. L'objet aimé n'est plus une dame : c'est le beau et le bon, que l'amant cherche à atteindre en se rendant semblable à lui[^2].\n\n## Deux fureurs\n\nLe mot « fureur » désigne un emportement, presque un délire. Bruno distingue soigneusement. La fureur héroïque n'est pas une fureur de bile noire, qui jetterait l'homme hors du jugement ; celui qu'elle saisit est embrasé par le soleil intellectuel dans l'âme[^5]. Elle est un ravissement divin qui élève certains au-dessus des hommes ordinaires[^2]. Ce n'est pas une folie qui aveugle, mais une passion qui fait penser.\n\n> **Illustration (pas un exemple de Bruno).** Une mathématicienne travaille des années sur un problème. Elle y pense en marchant, en mangeant, la nuit. Ses proches parlent d'obsession. Elle, parle de joie. Le mot de Bruno désignerait cette forme d'emportement : non pas la perte de la raison, mais une raison qui brûle.\n\n## Actéon\n\nLe mythe vient des *Métamorphoses* d'Ovide. Le jeune chasseur Actéon surprend la déesse Diane qui se baigne dans une source. Furieuse, elle lui jette de l'eau au visage : « Maintenant raconte que tu m'as vue, sans un voile, si tu peux »[^4]. Il devient cerf, et ses propres chiens le déchirent[^4].\n\nBruno en fait un sonnet. Le jeune Actéon mène aux forêts ses mâtins et ses lévriers ; il voit dans les eaux une beauté ; il voit, et le grand chasseur devient aussitôt ce qu'il chasse ; ses grands chiens le dévorent[^3].\n\nPuis il commente. Actéon signifie l'intellect, tendu vers la poursuite de la sagesse divine et la compréhension de la beauté divine[^3]. Les chiens sont ses pensées : les lévriers, plus rapides, figurent l'intellect ; les mâtins, plus forts, la volonté, car l'opération de l'intellect précède celle de la volonté[^3]. Les eaux sont le miroir de la ressemblance, les œuvres où brille l'éclat de la bonté divine[^3] : c'est dans la nature que l'infini se laisse voir.\n\nEt le chasseur devient la proie par l'opération même de l'intellect, qui convertit en lui-même les choses connues[^3]. Il est poursuivi par ses propres pensées. Celui qui cherchait au-dehors le bien, la sagesse et la beauté les trouve en lui ; il cesse de vivre comme un homme ordinaire et vit la vie des dieux[^3].\n\n## Une mort qui est une naissance\n\nLa cruauté du mythe se renverse. Chez Ovide, Actéon meurt d'avoir vu ce qu'il ne devait pas voir. Chez Bruno, être dévoré par ses pensées n'est pas un châtiment : c'est le signe que la connaissance a réussi. On ne connaît vraiment qu'en étant transformé par ce qu'on connaît. Le sujet qui partait à la chasse ne revient pas le même ; il ne revient pas du tout, car il est devenu ce qu'il cherchait.\n\n> **Illustration (un parallèle avec la clinique).** Un patient veut « comprendre » son histoire et lit tout ce qui s'écrit sur son trouble. Il traque les causes comme un chasseur. Un jour, il dit : « Plus je cherche, plus c'est moi qui suis cherché. » La formule rejoint étrangement Actéon : la connaissance de soi n'est pas une prise qu'on rapporte, c'est une transformation qu'on subit.\n\nLe livre se lit ainsi à la fois comme un traité d'amour et comme une théorie de la connaissance : une méditation sur la démesure entre un être fini et l'univers infini qu'il voudrait embrasser.","quiz":[{"question":"Que reproche Bruno à Pétrarque dans la dédicace des Fureurs héroïques ?","choix":["D'avoir écrit en latin plutôt qu'en langue toscane","D'avoir consacré son génie à l'amour d'une femme","D'avoir refusé de croire à l'infinité de l'univers","D'avoir trahi l'Église en critiquant le pape"],"bonne":1,"explication":"Bruno juge « vaine, vile et infâme » la gloire du poète toscan éperdu sur les bords de la Sorgue : son propre dessein est de « signifier la contemplation divine »."},{"question":"Comment Bruno distingue-t-il la fureur héroïque d'une simple folie ?","choix":["Elle est plus violente et plus dangereuse que la folie","Elle ne concerne que les guerriers et les héros antiques","Elle n'est pas de bile noire : un soleil intellectuel l'embrase","Elle naît uniquement de l'amour sensuel pour une personne"],"bonne":2,"explication":"La fureur héroïque n'est pas une fureur qui jette hors du jugement : celui qu'elle saisit est embrasé par le « soleil intellectuel dans l'âme »."},{"question":"Un chercheur, au terme d'années de travail sur la nature, dit qu'il ne la regarde plus de l'extérieur : il a l'impression d'en faire partie. Quelle image de Bruno cela évoque-t-il ?","choix":["Actéon, le chasseur qui devient ce qu'il chasse","Pétrarque, l'amant éperdu sur les bords de la Sorgue","Les sphères emboîtées d'un monde clos et fini","La fureur de bile noire qui fait perdre le jugement"],"bonne":0,"explication":"Le chasseur devient la proie par l'opération de l'intellect, qui convertit en lui-même ce qu'il connaît : connaître, c'est être transformé par l'objet."},{"question":"Que représentent les chiens d'Actéon dans le commentaire de Bruno ?","choix":["Les ennemis du philosophe, qui le persécutent","Ses pensées : les lévriers l'intellect, les mâtins la volonté","Les passions sensuelles qu'il faut dompter par l'ascèse","Les inquisiteurs qui le poursuivront jusqu'à Rome"],"bonne":1,"explication":"Les lévriers, plus rapides, figurent l'intellect ; les mâtins, plus forts, la volonté. Actéon est poursuivi par ses propres pensées."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Giordano Bruno » (§ 1 vie, §§ 3, 5, 6 univers infini)","url":"https://plato.stanford.edu/entries/bruno/"},{"texte":"Bruno, The Heroic Frenzies, trad. P. E. Memmo (1964), Esoteric Archives (dédicace à Sidney, critique de Pétrarque, fausse adresse de 1585)","url":"https://esotericarchives.com/bruno/furori.htm"},{"texte":"Bruno, The Heroic Enthusiasts, Ire partie, trad. L. Williams (1887), Sacred Texts, 4e dialogue (Actéon)","url":"https://neonvagabond.xyz/mirrors/sacred-texts/aor/bruno/the/the107.htm"},{"texte":"Ovide, Métamorphoses, III, 138-252, épisode d'Actéon, traduction française (Le Web pédagogique)","url":"https://lewebpedagogique.com/asphodele/files/2019/01/FR_METAMORPHOSES_ACTEON.pdf"},{"texte":"Bruno, The Heroic Enthusiasts, Ire partie, trad. L. Williams, Project Gutenberg (introduction, structure, 3e dialogue)","url":"https://gutenberg.org/files/19817/19817-h/19817-h.htm"}]},{"id":"diderot-encyclopedie","discipline":"philosophie","titre":"L'homme, terme unique","figure":"Denis Diderot","branche":"epistemologie","fiabilite":"mixte","fiabilite_note":"L'article ENCYCLOPÉDIE de Diderot (1755) a été lu en partie dans sa transcription de Wikisource ; le passage sur les quatre sortes de renvois n'a pas pu y être retrouvé et n'est pas cité. L'histoire de l'ouvrage vient de Wikipédia, l'exemple des Cordeliers d'une ressource pédagogique de l'académie de Versailles. Le thème a été repéré grâce au cours de Véronique Le Ru (master, URCA).","reference":"Encyclopédie, ou Dictionnaire raisonné des sciences, des arts et des métiers (1751-1772), article ENCYCLOPÉDIE (t. V, 1755) ; d'Alembert, Discours préliminaire (1751)","accroche":"Comment rassembler tout ce que savent les hommes sans s'y perdre, ni se faire interdire ? Diderot part d'une idée simple : tout part de l'homme et tout y revient.","punch":"Un bon dictionnaire ne se contente pas d'informer. Il change la façon commune de penser.","idee":"L'Encyclopédie veut rassembler les connaissances éparses et les transmettre aux générations futures. Diderot la fonde sur un principe : l'homme est le terme d'où il faut partir et auquel il faut tout ramener. Ses renvois relient les articles entre eux, et parfois les font se contredire.","citation":"L'homme est le terme unique d'où il faut partir, & auquel il faut tout ramener.","citation_source":"Diderot, article ENCYCLOPÉDIE, Encyclopédie, t. V (1755), transcription Wikisource","citation_url":"https://fr.wikisource.org/wiki/L%E2%80%99Encyclop%C3%A9die/1re_%C3%A9dition/ENCYCLOP%C3%89DIE","liens":["canguilhem-normal-pathologique","kant-lumieres","descartes-malin-genie"],"texte":"L'*Encyclopédie, ou Dictionnaire raisonné des sciences, des arts et des métiers* paraît en France de 1751 à 1772. Elle compte vingt-huit volumes : dix-sept de texte, publiés jusqu'en 1765, et onze de planches gravées, achevés en 1772[^2]. On y dénombre environ 71 818 articles et 2 784 planches[^2]. Plus de cent quarante auteurs y ont écrit au moins un article ; le plus prolifique, Louis de Jaucourt, en a rédigé plus de 17 000, environ le quart de l'ensemble[^2].\n\nDenis Diderot la dirige de bout en bout. Jean le Rond d'Alembert, qui en signe le *Discours préliminaire*, quitte la codirection en 1758[^2].\n\n## Une entreprise surveillée\n\nL'ouvrage avance sous la menace. Après le septième volume, en 1759, le Parlement de Paris obtient du gouvernement la suspension du privilège d'imprimer ; le travail continue en secret, protégé par de hauts personnages[^2]. En 1764, Diderot découvre que l'imprimeur, Le Breton, a lui-même censuré en cachette certains de ses articles, et menace de démissionner[^2].\n\nCette histoire éclaire la forme du livre. Une encyclopédie qui veut éclairer ses lecteurs, sous un régime où l'on peut être interdit, doit apprendre à dire les choses autrement.\n\n## Rassembler et transmettre\n\nDans l'article qu'il consacre au mot ENCYCLOPÉDIE lui-même, au tome V, Diderot commence par l'étymologie : le mot signifie « enchaînement de connaissances »[^1]. Le but de l'ouvrage est de rassembler les connaissances éparses sur la surface de la terre, et de les transmettre à ceux qui viendront après nous[^1], afin que nos descendants, devenant plus instruits, deviennent en même temps plus vertueux et plus heureux[^1].\n\nUne telle œuvre ne peut pas être le travail d'un seul homme : il y faut une société de gens de lettres et d'artistes[^1]. Et Diderot imagine son moment le plus glorieux : celui qui suivrait une grande révolution qui aurait suspendu le progrès des sciences. L'ouvrage servirait alors à mettre à l'abri les connaissances des siècles passés[^1].\n\n> **Illustration (pas un exemple de Diderot).** Une bibliothèque brûle. Ce qui survit n'est pas forcément le plus précieux, mais ce qui avait été recopié ailleurs, relié à d'autres textes, cité, résumé. Diderot pense l'Encyclopédie comme cette copie de sauvegarde du savoir humain : un savoir qui tient parce qu'il est distribué et relié, non parce qu'il est enfermé dans un seul lieu.\n\n## Tout partir de l'homme\n\nComment ordonner une telle masse ? Diderot pose un principe : l'homme est le terme unique d'où il faut partir, et auquel il faut tout ramener[^1]. Si l'on bannit l'homme, la nature devient une scène triste et muette[^1]. Et il ajoute, plus brutalement : abstraction faite de mon existence et du bonheur de mes semblables, que m'importe le reste de la nature ?[^1]\n\nLe *Discours préliminaire* de d'Alembert donne à ce principe une forme : un « système figuré des connaissances », un arbre qui répartit le savoir selon trois facultés humaines, la mémoire (l'histoire), la raison (la philosophie) et l'imagination (la poésie), à la suite de Francis Bacon[^2]. Ce n'est plus l'autorité religieuse, mais la raison humaine qui devient la mesure du savoir[^2]. Le lien entre cet arbre et les articles réels s'est pourtant vite défait[^2] : l'ordre alphabétique impose sa propre logique.\n\n## Les renvois\n\nC'est là qu'interviennent les *renvois*, ces « voyez » qui envoient d'un article à un autre. Ils ont d'abord une fonction pratique : plutôt que de répéter une définition à chaque mot de la même famille, *précipiter*, *précipitation*, *précipice*, Diderot propose d'écrire un article principal auquel il renverrait de tous les autres[^1]. Il s'impose aussi une règle : tout définir, tout, sans aucune exception[^1].\n\nMais les renvois peuvent faire plus. Diderot reconnaît que des renvois satiriques pourraient miner l'autorité[^2]. Un exemple souvent cité : l'article CORDELIERS, d'un ton neutre, renvoie à l'article CAPUCHON, et la critique religieuse se déplace d'un article à l'autre[^3]. Le lecteur attentif reconstitue lui-même le sens, en suivant le fil.\n\nLe projet porte une ambition plus large : changer la façon commune de penser[^2].\n\n> **Illustration (un parallèle avec la clinique).** Un patient raconte une scène d'enfance « sans importance », puis, trois séances plus tard, un rêve qui la rappelle, puis une remarque de son père. Pris un par un, ces récits sont anodins. Mis en relation, ils disent autre chose. L'écoute analytique fonctionne un peu comme un lecteur de l'Encyclopédie : c'est en suivant les renvois que le sens apparaît.\n\n## Ce qui reste discuté\n\nL'image d'une Encyclopédie entièrement codée, où des renvois subversifs déjoueraient systématiquement la censure, a été nuancée. L'exemple le plus fameux, l'article ANTHROPOPHAGES qui renverrait aux articles sur l'Eucharistie, a été étudié par Marie Leca-Tsiomis : l'article est traduit de la *Cyclopaedia* anglaise de Chambers, il est signé d'un ecclésiastique orthodoxe, et rien ne prouve l'existence d'un plan systématique de renvois subversifs[^2]. Les renvois eux-mêmes sont en grande partie hérités de la *Cyclopaedia*, et l'on y voit volontiers un ancêtre des liens hypertextes[^2].\n\nReste l'essentiel : une conception du savoir comme réseau, ordonnée autour de l'homme et adressée à un lecteur qu'on suppose capable de juger.","quiz":[{"question":"Quel est, selon l'article ENCYCLOPÉDIE, le but de l'ouvrage ?","choix":["Imposer une doctrine officielle unique aux savants du royaume","Rassembler les connaissances éparses et les transmettre aux générations futures","Remplacer les livres anciens, devenus inutiles, par un résumé moderne","Réserver le savoir aux membres des académies scientifiques"],"bonne":1,"explication":"Diderot veut rassembler « les connoissances éparses sur la surface de la terre » et les transmettre à ceux qui viendront après nous, pour qu'ils soient plus instruits, plus vertueux et plus heureux."},{"question":"Quel principe Diderot donne-t-il pour ordonner les connaissances ?","choix":["Dieu est le point de départ de tout savoir véritable","La nature doit être décrite indépendamment de l'homme","L'homme est le terme d'où il faut partir et auquel tout ramener","L'ordre alphabétique suffit à organiser le savoir humain"],"bonne":2,"explication":"Sans l'homme, la nature devient « une scène triste & muette » : l'homme est le terme unique d'où il faut partir et auquel il faut tout ramener."},{"question":"Une journaliste, sous un régime qui la surveille, publie un article neutre qui renvoie à un autre texte où apparaît la critique. Quelle pratique de l'Encyclopédie cela rappelle-t-il ?","choix":["Le système figuré des connaissances fondé sur la mémoire","Le renvoi, qui déplace le sens d'un article à un autre","L'ordre alphabétique imposé par l'éditeur Le Breton","Le privilège royal accordé aux libraires parisiens"],"bonne":1,"explication":"Diderot reconnaît que des renvois satiriques peuvent miner l'autorité : l'article CORDELIERS renvoie à CAPUCHON, où la critique apparaît."},{"question":"Que montre l'étude de Marie Leca-Tsiomis sur l'article ANTHROPOPHAGES ?","choix":["Que Diderot en est l'auteur et l'a écrit pour attaquer l'Église","Qu'il vient de Chambers et ne prouve aucun plan de renvois subversifs","Qu'il a été ajouté après la mort de Diderot par ses ennemis","Qu'il a été censuré par Le Breton avant sa publication"],"bonne":1,"explication":"L'article est traduit de la Cyclopaedia et signé par un ecclésiastique orthodoxe ; rien ne prouve un système concerté de renvois subversifs."}],"sources":[{"texte":"Diderot, article ENCYCLOPÉDIE, Encyclopédie, t. V, 1755, transcription Wikisource","url":"https://fr.wikisource.org/wiki/L%E2%80%99Encyclop%C3%A9die/1re_%C3%A9dition/ENCYCLOP%C3%89DIE"},{"texte":"Wikipédia (anglais), « Encyclopédie » (publication, volumes, censure, Le Breton, système figuré, renvois, Leca-Tsiomis)","url":"https://en.wikipedia.org/wiki/Encyclop%C3%A9die"},{"texte":"Académie de Versailles, « L'Encyclopédie, une œuvre idéologique », ressource pédagogique (renvoi de CORDELIERS à CAPUCHON)","url":"https://lettres.ac-versailles.fr/IMG/pdf/TICE_enc5-2.pdf"}]},{"id":"galilee-livre-de-la-nature","discipline":"philosophie","titre":"Le grand livre de la nature","figure":"Galilée","branche":"epistemologie","fiabilite":"mixte","fiabilite_note":"Le passage de L'Essayeur est cité d'après un extrait en français diffusé par Eduscol et d'après l'original italien et la traduction de Stillman Drake reproduits par Michael Molinsky (MAA). La biographie, la distinction des qualités et le rapport à l'Écriture viennent de l'Encyclopédie de Stanford ; la Lettre à Christine de Lorraine et le contexte du livre, de Wikipédia. Le thème a été repéré grâce au cours de Véronique Le Ru (master, URCA).","reference":"Il Saggiatore (L'Essayeur, Rome, 1623) ; Lettre à Christine de Lorraine (1615)","accroche":"On lisait la nature comme un livre de symboles, où chaque chose renvoyait à Dieu. Galilée garde l'image du livre, mais change de langue : la nature est écrite en triangles et en cercles.","punch":"La nature est un livre ouvert. Encore faut-il savoir dans quelle langue il est écrit.","idee":"Dans L'Essayeur (1623), Galilée affirme que la philosophie est écrite dans le grand livre de l'univers, en langue mathématique. Sans cette langue, on erre dans un labyrinthe obscur. Il en tire une distinction entre les propriétés des corps et les sensations qu'ils provoquent en nous.","citation":"Il est écrit dans une langue mathématique, et les caractères en sont les triangles, les cercles.","citation_source":"Galilée, L'Essayeur (Il Saggiatore, 1623), pp. 24-25 de l'édition originale, extrait en français reproduit par Eduscol","citation_url":"https://eduscol.education.fr/document/18616/download","liens":["spinoza-ecriture","descartes-malin-genie","augustin-interpreter"],"texte":"Galilée naît à Pise le 15 février 1564[^1]. En 1609, il entend parler de la longue-vue qu'on vient d'inventer et en construit une version perfectionnée ; en mars 1610, il publie le *Messager céleste*, où il décrit ce qu'il a vu dans le ciel[^1]. En 1616, le cardinal Bellarmin l'avertit de ne plus enseigner ni défendre la théorie de Copernic[^1]. Après la publication du *Dialogue* en 1632, il est condamné en juin 1633 pour « véhément soupçon d'hérésie » et assigné à résidence à vie dans sa villa d'Arcetri, près de Florence, où il meurt au début de 1642[^1].\n\n## Une querelle sur les comètes\n\n*L'Essayeur* (*Il Saggiatore*) paraît à Rome en octobre 1623. Il est dédié au nouveau pape Urbain VIII, Maffeo Barberini, et publié par les membres de l'Académie des Lynx[^4]. C'est un livre de polémique. En 1619, le jésuite Orazio Grassi avait publié un écrit sur les trois comètes de 1618 ; l'entourage de Galilée lui avait répondu, et Grassi avait répliqué sous le pseudonyme de Lothario Sarsi[^4]. *L'Essayeur* est la dernière réponse de Galilée.\n\nSur le fond, Galilée avait tort : il tenait les comètes pour des phénomènes optiques[^4]. Mais c'est dans ce livre de dispute qu'il écrit l'une des pages les plus célèbres de l'histoire des sciences.\n\n## Le livre et sa langue\n\nLa philosophie, écrit-il, est écrite dans ce très grand livre qui se tient continuellement ouvert devant nos yeux, l'univers[^2]. Encore faut-il en connaître la langue. Il est écrit dans une langue mathématique, et ses caractères sont les triangles, les cercles et d'autres figures géométriques[^3]. Sans cette langue, on erre dans un labyrinthe obscur[^1].\n\nL'image du livre de la nature n'est pas neuve. Les Pères de l'Église disaient déjà que ce livre pouvait être lu par tous, même par ceux qui ne savent pas lire[^5]. Galilée garde la métaphore, mais il en renverse le sens : le livre n'est plus ouvert
