ure, avait anticipé un renfort à l'argument, au livre III de *De la nature* : regardez le temps infini qui a précédé votre naissance. Il ne vous a pas fait souffrir. La nature vous le tend comme un miroir du temps qui suivra votre mort. Pourquoi redouter l'un quand l'autre vous laisse indifférent ?\n\nNagel répond que les deux néants ne sont pas symétriques. Je n'aurais pas pu naître beaucoup plus tôt sans être quelqu'un d'autre ; j'aurais pu, en revanche, vivre plus longtemps. Le temps après la mort est donc un temps dont je suis privé, alors que le temps avant ma naissance n'en est pas un.\n\n## Ce que l'argument laisse de côté\n\nL'argument parle de *ma* mort. Il ne dit à peu près rien de la mort des autres, qui, elle, est une expérience, celle de la perte. Je ne serai pas là pour ma mort ; je serai là pour celle des personnes que j'aime.\n\n> **Exemple.** On peut accepter entièrement l'argument d'Épicure et pleurer la mort d'un proche. Il n'y a là aucune contradiction : ce qui fait mal n'est pas l'état du mort, qui ne sent rien, mais le monde du vivant, où quelqu'un manque. C'est une autre question, que la philosophie d'Épicure n'aborde que de biais, et que la psychanalyse prendra de front.\n\nL'épicurisme ne laisse pas cette question sans réponse : il recommande l'amitié et le souvenir reconnaissant de ceux qui ne sont plus. Mais il laisse ouverte la question de ce que l'on fait, au juste, de ceux qu'on a perdus.","quiz":[{"question":"Sur quelle prémisse repose l'argument d'Épicure contre la crainte de la mort ?","choix":["L'âme survit au corps et rejoint les dieux","Tout bien et tout mal sont contenus dans la sensation","La vie humaine n'a pas de valeur en elle-même","La douleur de l'agonie est toujours brève"],"bonne":1,"explication":"Si bien et mal résident dans la sensation et que la mort en est la privation, elle ne peut être un mal pour nous. Épicure nie la survie de l'âme ; il ne dévalue pas la vie, il en veut la meilleure qualité ; la brièveté de la douleur est une autre partie du quadruple remède."},{"question":"Que reproche Épicure à celui qui souffre d'attendre la mort ?","choix":["De s'affliger sans fondement d'une chose qui ne le gênera pas quand elle sera là","De ne pas assez préparer ses funérailles et sa sépulture","De manquer de foi dans les dieux qui protègent les mortels","De ne pas profiter du temps qui lui reste pour s'enrichir"],"bonne":0,"explication":"Ce dont la présence ne gêne pas ne suscite qu'une douleur sans fondement quand on l'attend. L'épicurisme se désintéresse des rites, ne demande aucune foi en des dieux qui ne s'occupent pas de nous, et tient la richesse pour un désir non nécessaire."},{"question":"Que signifie la comparaison avec la nourriture dans la Lettre ?","choix":["Qu'il faut manger peu et simplement pour vivre longtemps","Que le sage ne cherche pas la vie la plus longue mais la plus agréable","Que les plaisirs du corps sont méprisables pour le sage","Que la mort est comparable à la faim qu'on ne peut apaiser"],"bonne":1,"explication":"Comme on choisit la nourriture la plus agréable plutôt que la plus abondante, le sage ne cherche pas le temps le plus long mais le plus doux. Il ne s'agit pas d'un conseil diététique, et Épicure ne méprise pas les plaisirs du corps."},{"question":"Quelle objection Thomas Nagel adresse-t-il à l'argument ?","choix":["La mort fait souffrir physiquement, donc elle est un mal","Les atomes de l'âme ne se dispersent pas à la mort","La mort est un bien puisqu'elle libère l'âme du corps","On peut subir un tort sans l'éprouver : la mort prive de biens futurs"],"bonne":3,"explication":"Pour Nagel, comme une promesse rompue à un mort, la mort peut être un tort par ce qu'elle nous retire. Il ne parle pas de la douleur physique, ne discute pas la physique atomiste et ne défend pas l'idée platonicienne d'une libération par la mort."}],"sources":[{"texte":"Épicure, Lettre à Ménécée, texte et traduction (mediterranees.net)","url":"https://mediterranees.net/litterature/cours_antique/docs_grec/Au-dela/Epicure_Menecee.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Death » : Épicure, Lucrèce et Nagel","url":"https://plato.stanford.edu/entries/death/"}]},{"id":"freud-inquietante-etrangete","discipline":"psychanalyse","titre":"L'inquiétante étrangeté","figure":"Sigmund Freud","reference":"Das Unheimliche, Imago, t. V (1919) ; trad. M. Bonaparte et E. Marty (1933)","accroche":"Ce qui nous glace n'est pas l'inconnu. C'est le familier qui revient là où on ne l'attendait pas. Freud mène l'enquête dans un dictionnaire.","punch":"L'étrangement inquiétant, c'est le familier qui revient d'ailleurs.","idee":"Le mot allemand unheimlich (non familier) finit, dans certains emplois, par rejoindre son contraire heimlich (familier, puis secret). Freud en tire sa thèse : l'inquiétante étrangeté naît du retour d'un familier ancien que le refoulement avait rendu étranger.","citation":"Le préfixe « un » placé devant ce mot est la marque du refoulement.","citation_source":"Freud, L'inquiétante étrangeté (1919), section II, p. 26 de l'édition PDF — trad. Marie Bonaparte et E. Marty (1933)","citation_url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/l-inquietante-etrangete-1919.pdf","liens":["kierkegaard-angoisse","husserl-epoche","lacan-stade-du-miroir"],"texte":"*Das Unheimliche* paraît en 1919 dans la revue *Imago*. Marie Bonaparte et E. Marty le traduisent en français en 1933 sous le titre « L'inquiétante étrangeté », et elles emploient aussi, dans le corps du texte, la formule « l'étrangement inquiétant ». Les deux désignent le même sentiment : ce frisson particulier, cousin de la peur, que ni le danger ni la simple nouveauté n'expliquent bien.\n\nLa méthode de Freud est inhabituelle pour un médecin. Il commence par ouvrir les dictionnaires, puis il lit un conte, puis il fait l'inventaire de ses propres impressions. L'enquête est littéraire et linguistique avant d'être clinique, et c'est ce qui fait sa force.\n\n## Une enquête dans les dictionnaires\n\nEn allemand, *heimlich* vient de *Heim*, la maison : c'est ce qui est familier, intime, domestique. *Unheimlich* en serait le contraire, le « non familier ». On croirait donc que l'inquiétant est ce qui est neuf et inconnu.\n\nFreud consulte les dictionnaires, notamment celui de Sanders, et y trouve une surprise : *heimlich* possède deux groupes de sens. D'un côté ce qui est familier et agréable ; de l'autre ce qui est caché, tenu à l'écart des regards. Il cite alors Schelling, qui fournit la définition cherchée : on appelle *unheimlich* « tout ce qui devrait rester secret, caché, et qui se manifeste ».\n\nAutrement dit, dans l'un de ses emplois, le mot *heimlich* rejoint son contraire. L'inquiétant n'est pas l'étranger absolu. C'est ce qui appartenait à la maison, qui devait y rester caché, et qui en est sorti.\n\n> **Exemple (une illustration, pas un cas de Freud).** Des années plus tard, vous retraversez les couloirs de votre ancienne école. Rien n'est inconnu : les odeurs, la disposition des portes, le bruit des pas. Et pourtant, pendant une seconde, ce n'est pas de la nostalgie. C'est un malaise, comme si quelque chose que vous croyiez disparu se tenait là, intact. Le lieu est familier, et c'est justement ce qui le rend étrange.\n\n## L'Homme au sable\n\nPour mettre sa thèse à l'épreuve, Freud choisit un conte de E. T. A. Hoffmann, *L'Homme au sable*. Il y est question de « l'homme au sable qui arrache les yeux aux enfants », et d'un jeune héros, Nathanaël. Le récit met aussi en scène une poupée, Olympia.\n\nUn auteur avait écrit avant lui sur l'inquiétant : Jentsch, en 1906. Freud résume sa thèse ainsi : il trouve « la condition essentielle à la genèse du sentiment de l'inquiétante étrangeté dans l'incertitude intellectuelle ». Je ne sais pas si cette chose est vivante ou non, et c'est cela qui me trouble. Une poupée dont on se demande si elle est animée en serait l'exemple, et Olympia semblait l'illustrer à merveille.\n\nFreud refuse de s'en contenter : « Une incertitude intellectuelle ne nous aidera en rien à comprendre cette impression-là », écrit-il à propos du conte. Ce qui terrifie dans l'histoire, c'est la menace sur les yeux. Il en tire une interprétation qui est restée célèbre : « la crainte pour les yeux, la peur de devenir aveugle, est un substitut fréquent de la peur de la castration ». Et, dans une note, il lit Olympia comme « en quelque sorte un complexe détaché de Nathanaël qui se présente à lui », c'est-à-dire un élément de lui-même qui lui revient du dehors.\n\n> **Exemple (une illustration).** Un mannequin de vitrine dont on se demande, une demi-seconde, s'il a bougé. Jentsch aurait reconnu là son incertitude sur le vivant. Freud ne nie pas que ce doute existe, il dit qu'il n'est pas l'essentiel. La robotique a retrouvé le sujet : l'essai de Masahiro Mori sur la « vallée de l'étrange » a été rapproché de l'inquiétant par Reichardt en 1978. Freud, lui, cherche de l'autre côté : dans ce que la figure réveille en nous.\n\n## Le double\n\nLe thème du double occupe une place importante dans le texte. Freud s'appuie sur Otto Rank, pour qui le double a d'abord été une protection : un « énergique démenti à la puissance de la mort ». Se doubler, c'est assurer sa survie.\n\nMais ce qui rassurait finit par épouvanter. Freud écrit que le double s'est transformé en image d'épouvante « à la façon dont les dieux, après la chute de la religion », changent de signe. Un ancien allié du moi, devenu étranger au moi, revient sous l'aspect d'un intrus qui lui ressemble.\n\n## La répétition\n\nFreud donne un exemple tiré de sa propre expérience. Un brûlant après-midi d'été, il parcourt les rues vides et inconnues d'une petite ville italienne, et il se retrouve plusieurs fois au même endroit sans l'avoir voulu. L'effet est un malaise, que rien dans le lieu ne justifiait. Il en tire une règle : c'est « la répétition involontaire qui nous fait paraître étrangement inquiétant ce qui par ailleurs serait innocent ».\n\nIl cite aussi le cas du nombre : on rencontre « le chiffre 62 plusieurs fois le même jour », et l'on se prend à penser qu'il y a là un dessein. Le même nombre, rencontré une fois, n'aurait rien dit.\n\n> **Exemple (une illustration).** Vous apprenez le prénom d'une personne inconnue, et dans l'heure suivante vous le lisez sur une affiche, l'entendez dans une conversation voisine, le retrouvez sur un ticket. Chaque occurrence est banale. C'est leur retour, sans que vous l'ayez cherché, qui donne l'impression d'un message.\n\n## Deux origines\n\nFreud ramène les situations inquiétantes à deux sources, qu'il distingue.\n\nLa première est le retour de **complexes infantiles refoulés**. Ici entrent la peur de la castration, déjà vue à propos des yeux, mais aussi des fantasmes plus archaïques : Freud va jusqu'à rattacher l'effroi d'être enterré vivant, que « bien des gens » décerneraient comme « la couronne » de l'inquiétante étrangeté, à un fantasme de vie dans le corps maternel.\n\nLa seconde est la réapparition de **convictions primitives surmontées**. Elle se produit quand ces croyances, que nous avons laissées derrière nous, « semblent de nouveau être confirmées » par un événement. Freud remarque que tout ce qui nous semble aujourd'hui étrangement inquiétant se rattache à ces restes.\n\nDans les deux cas, ce qui inquiète n'est pas nouveau. C'est ancien, connu, familier, et c'est le refoulement qui l'a rendu étranger. D'où la phrase qui résume le texte : « Le préfixe « un » placé devant ce mot est la marque du refoulement. » Le préfixe négatif ne supprime pas le familier, il atteste qu'il a été écarté, et qu'il revient.\n\n## La fiction et la vie\n\nFreud consacre la dernière partie du texte à la littérature. L'inquiétante étrangeté dans la fiction est, écrit-il, « beaucoup plus pleine et riche » que dans la vie réelle, et bien des choses ne sont pas inquiétantes dans un récit qui le seraient si elles se produisaient dans la vie.\n\nÀ l'inverse, il remarque qu'il ne saurait citer « un seul vrai conte de fées où se fasse quelque chose d'étrangement inquiétant ». Le même fait n'a donc pas le même effet selon le monde où le récit nous place.\n\nCe qui reste de ce texte, au-delà de la formule, c'est sa démarche : prendre un mot de tous les jours, voir ce qu'il cache, puis chercher dans l'expérience ce que ce double sens désigne.","quiz":[{"question":"Que découvre Freud en examinant le mot heimlich dans les dictionnaires ?","choix":["Qu'il n'a qu'un seul sens, celui de familier, sans ambiguïté","Qu'il vient du latin et désignait le foyer des Romains","Qu'il ne s'emploie que pour parler des fantômes et des morts","Qu'il désigne aussi ce qui est caché, et rejoint ainsi son contraire"],"bonne":3,"explication":"Heimlich signifie à la fois familier et caché, secret. Dans ce second emploi, il coïncide avec unheimlich, ce que montre la définition de Schelling. Le mot vient de Heim, la maison, et ne se limite pas à un domaine précis."},{"question":"Selon Freud, qu'est-ce qui rend L'Homme au sable inquiétant ?","choix":["La menace de perdre les yeux, substitut de la peur de la castration","L'incertitude sur la poupée Olympia, vivante ou automate","Le fait que l'histoire se passe à l'étranger","Le style de l'auteur, volontairement obscur"],"bonne":0,"explication":"Freud écarte l'explication de Jentsch (l'incertitude sur le vivant) et la déclare insuffisante. Pour lui, la crainte pour les yeux est un substitut fréquent de la peur de la castration. Le lieu et le style ne sont pas en cause."},{"question":"Que marque le préfixe « un » dans unheimlich ?","choix":["Une simple négation qui fait disparaître le familier","Le caractère entièrement nouveau de ce qui inquiète","La marque du refoulement : le familier revient sous un jour étranger","Une nuance de politesse propre à la langue allemande"],"bonne":2,"explication":"Le préfixe ne supprime pas le familier, il atteste son refoulement et son retour. L'inquiétant n'est pas le nouveau, c'est l'ancien devenu étranger. Il ne s'agit ni d'une nuance de politesse, ni d'une nouveauté absolue."},{"question":"Pourquoi le chiffre 62 rencontré plusieurs fois dans la journée peut-il inquiéter ?","choix":["Parce que ce chiffre est considéré comme maléfique en Allemagne","Parce qu'on l'a déjà vu dans un rêve récent","Parce qu'il évoque forcément une date de naissance","Parce que la répétition involontaire rend inquiétant ce qui serait innocent"],"bonne":3,"explication":"Pour Freud, c'est la répétition involontaire qui fait paraître étrangement inquiétant ce qui, pris une seule fois, serait anodin. Il ne dit rien de la mauvaise réputation d'un chiffre, ni de rêves ou de dates de naissance."}],"sources":[{"texte":"Freud, L'inquiétante étrangeté (1919), trad. Marie Bonaparte et E. Marty (1933), dans Essais de psychanalyse appliquée (PDF)","url":"https://ferbos-jeanfrancois.legtux.org/wp-content/uploads/2022/02/l-inquietante-etrangete-1919.pdf"},{"texte":"Wikipédia (anglais), « Uncanny » : Jentsch (1906), Freud (1919), le double, heimlich/unheimlich, « vallée de l'étrange »","url":"https://en.wikipedia.org/wiki/Uncanny"}]},{"id":"kierkegaard-angoisse","discipline":"philosophie","titre":"L'angoisse, vertige de la liberté","figure":"Søren Kierkegaard","reference":"Le Concept d'angoisse (1844), sous le pseudonyme de Vigilius Haufniensis","accroche":"La peur a un objet. L'angoisse n'en a pas, ou plutôt son objet est un rien. Kierkegaard y voit la marque même de la liberté.","punch":"L'angoisse n'a pas d'objet. Elle a un possible.","idee":"L'angoisse se distingue de la peur : elle ne porte sur rien de déterminé, mais sur le possible. Devant l'abîme, ce qui donne le vertige n'est pas seulement le vide, c'est la possibilité de s'y jeter. L'angoisse est le vertige de la liberté.","citation":"L'angoisse est le vertige de la liberté.","citation_source":"Kierkegaard, Le Concept d'angoisse, chap. II (1844) — traduit du danois","citation_url":"https://plato.stanford.edu/entries/kierkegaard/","liens":["freud-inquietante-etrangete","pascal-divertissement","freud-moi-pas-maitre"],"texte":"*Le Concept d'angoisse* paraît à Copenhague en 1844, sous un pseudonyme, comme une grande partie de l'œuvre de Kierkegaard. L'auteur fictif s'appelle Vigilius Haufniensis, « le veilleur de Copenhague ». Le sous-titre annonce une simple réflexion psychologique sur le problème du péché originel.\n\nDerrière la question théologique, Kierkegaard élabore une des descriptions les plus précises qu'on ait de l'angoisse, et il en fait autre chose qu'un trouble : une donnée fondamentale de l'existence humaine.\n\n## Peur et angoisse\n\nLa première distinction est devenue classique. La peur se rapporte à quelque chose de déterminé : un danger, une menace identifiable, un chien qui grogne, une falaise qui s'effrite. L'angoisse, elle, n'a pas d'objet assignable. Kierkegaard dit que son objet est un *rien*.\n\nCe rien n'est pas un néant pur. C'est le possible : ce qui n'est pas encore, ce que je pourrais faire ou devenir. L'angoisse surgit quand la liberté se découvre comme pouvoir, avant même de savoir ce qu'elle peut.\n\n> **Exemple.** La veille d'un examen, vous avez peur de la question sur Hegel : c'est une peur, elle a un objet, et vous pouvez y répondre en révisant Hegel. Mais le soir où vous recevez une offre pour partir vivre à l'étranger, rien ne vous menace, et pourtant vous ne dormez pas. Ce n'est pas un danger qui vous tient éveillé. C'est le fait que tout est possible, et que c'est à vous de choisir. Kierkegaard réserve le mot « angoisse » à ce second état.\n\n## L'innocence et l'interdit\n\nKierkegaard relit la scène de la Genèse. Adam, dans l'innocence, ne sait pas ce que sont le bien et le mal. L'interdit, « tu ne mangeras pas de l'arbre de la connaissance », ne peut pas être compris comme une menace précise, puisqu'Adam ne sait pas ce que serait le mal. Mais l'interdit éveille en lui la possibilité : il ne sait pas ce qu'il peut, mais il sent qu'il peut.\n\nL'angoisse est donc profondément ambiguë. Kierkegaard la décrit comme une antipathie sympathique et une sympathie antipathique : elle attire ce qu'elle redoute et redoute ce qui l'attire.\n\n> **Exemple.** Un enfant à qui l'on dit de ne pas ouvrir une certaine porte n'en avait jamais remarqué l'existence. Désormais, il y pense sans cesse. Il en a peur et il en a envie, sans savoir ce qu'il y a derrière. Ce n'est pas la pièce qui l'occupe : c'est la possibilité, ouverte par l'interdit, de faire quelque chose qu'il ne pouvait pas imaginer avant.\n\n## Le vertige\n\nD'où l'image la plus célèbre du livre. L'angoisse peut être comparée au vertige. Celui dont l'œil plonge dans un abîme béant est pris de vertige. Mais quelle en est la cause ? Autant son œil que l'abîme : s'il n'avait pas regardé en bas…\n\nAinsi, écrit Kierkegaard, l'angoisse est le vertige de la liberté. Il naît lorsque l'esprit, plongeant dans sa propre possibilité, se saisit du fini pour s'y retenir.\n\n> **Exemple.** Beaucoup de personnes connaissent ce trouble au bord d'un quai de métro ou d'un balcon : non pas la peur de tomber, mais l'idée soudaine qu'on *pourrait* sauter. On recule, troublé d'avoir pensé cela. Ce n'est pas un désir de mourir : c'est la conscience brutale qu'on est libre d'un geste que rien n'empêche. Kierkegaard y aurait reconnu son vertige : le vide n'effraie pas seul, c'est le pouvoir qu'on a devant lui.\n\n## Une éducation par l'angoisse\n\nLe dernier chapitre surprend. L'angoisse n'y est pas un mal à supprimer, mais une formatrice. Celui qui a appris à s'angoisser comme il faut, dit Kierkegaard, a appris le plus haut.\n\nPourquoi ? Parce que l'angoisse défait toutes les sécurités illusoires. Elle montre que rien de fini ne protège absolument : ni la fortune, ni la réputation, ni les habitudes. Pour Kierkegaard, croyant, elle conduit à la foi, seule capable de la traverser sans la fuir.\n\n> **Exemple.** Une personne qui a toujours tout prévu traverse une période où les choses lui échappent : une séparation, une maladie, un licenciement. Elle découvre que ses assurances ne la protégeaient pas de l'essentiel. Si elle ne se réfugie pas immédiatement dans de nouvelles certitudes, elle peut en sortir moins rigide, plus capable de vivre avec l'incertain. C'est, en termes laïques, ce que Kierkegaard appelle apprendre à s'angoisser comme il faut.\n\n## Ce qui reste, sans la foi\n\nOn peut ne pas suivre Kierkegaard jusqu'à la foi et retenir la structure. L'angoisse n'est pas un simple dysfonctionnement : elle signale le rapport d'un sujet à son propre possible, à ce qu'il pourrait faire et à ce qu'il pourrait perdre.\n\nLa philosophie existentielle du XXe siècle a beaucoup puisé dans ce livre, de Heidegger à Sartre. Et la clinique distingue elle aussi, avec ses propres outils, la peur d'un danger identifiable et l'angoisse sans objet assignable.","quiz":[{"question":"Qu'est-ce qui distingue l'angoisse de la peur selon Kierkegaard ?","choix":["La peur a un objet déterminé, l'angoisse a pour objet un rien, le possible","La peur est mentale, alors que l'angoisse est corporelle","L'angoisse est simplement une peur plus intense que les autres","La peur est réservée aux enfants, l'angoisse aux adultes"],"bonne":0,"explication":"L'angoisse ne porte sur rien de déterminé : son « objet » est le possible, la liberté elle-même. Kierkegaard ne la définit pas par le corps, ni comme un degré de la peur, et il décrit au contraire une angoisse déjà présente dans l'innocence."},{"question":"Que montre l'image du vertige devant l'abîme ?","choix":["Que la hauteur est objectivement dangereuse pour tous","Que l'homme a naturellement peur du vide par instinct","Que le vertige vient autant du regard que de l'abîme","Qu'il faut éviter de s'approcher des précipices"],"bonne":2,"explication":"Le vertige tient au rapport entre l'œil et l'abîme : c'est la liberté plongeant dans sa propre possibilité qui donne le vertige. Le danger objectif, la peur instinctive du vide ou un conseil de prudence manquent ce point."},{"question":"Comment Kierkegaard qualifie-t-il l'ambiguïté de l'angoisse ?","choix":["Une peur raisonnable et une crainte déraisonnable","Une antipathie sympathique et une sympathie antipathique","Une joie triste et une tristesse joyeuse","Une haine aimante et un amour haineux"],"bonne":1,"explication":"L'angoisse attire ce qu'elle redoute et redoute ce qui l'attire : Kierkegaard parle d'antipathie sympathique et de sympathie antipathique. Les autres formules ne sont pas les siennes."},{"question":"Quel rôle le dernier chapitre attribue-t-il à l'angoisse ?","choix":["Un symptôme qu'il faut éliminer par la raison et la volonté","Une éducatrice : bien s'angoisser, c'est avoir appris le plus haut","Une punition divine infligée à l'homme pour le péché","Un état réservé aux esprits faibles et mélancoliques"],"bonne":1,"explication":"Celui qui a appris à s'angoisser comme il faut a appris le plus haut : l'angoisse éduque. Kierkegaard ne veut ni l'éliminer, ni en faire une punition, ni la réserver aux faibles."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Søren Kierkegaard », section sur Le Concept d'angoisse","url":"https://plato.stanford.edu/entries/kierkegaard/"},{"texte":"Kierkegaard, The Concept of Anxiety, passage sur le vertige (cité par The Dish)","url":"https://dish.andrewsullivan.com/2013/06/22/quote-for-the-day-226"},{"texte":"Stanford Encyclopedia of Philosophy, « Existentialism »","url":"https://plato.stanford.edu/entries/existentialism/"}]},{"id":"klein-positions","discipline":"psychanalyse","titre":"Les deux positions","figure":"Melanie Klein","reference":"Notes sur quelques mécanismes schizoïdes (1946)","accroche":"Pour Melanie Klein, le nourrisson ne vit pas dans un monde paisible. Il aime et hait avec une violence extrême, et la santé psychique commence quand il découvre que c'est la même personne.","punch":"Grandir, c'est découvrir qu'on a haï ce qu'on aime.","idee":"Dans la position paranoïde-schizoïde, le bébé clive le sein en « bon » et « mauvais » et vit une angoisse de persécution. Dans la position dépressive, il saisit l'objet comme un tout : naissent alors l'ambivalence, la culpabilité et le désir de réparer.","repere":"Le nom « position paranoïde-schizoïde » combine deux termes : « position paranoïde », qu'employait Klein elle-même, et « position schizoïde », de Fairbairn. Klein l'explique dans une note de l'article de 1946, publié en mai de cette année-là.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","freud-deuil-melancolie"],"texte":"« Notes on Some Schizoid Mechanisms » paraît en mai 1946. L'article, ainsi que le résume la Société britannique de psychanalyse, introduit les idées de position paranoïde-schizoïde et de clivage. Il propose aussi un terme appelé à faire carrière, l'*identification projective*. Klein y décrit la vie psychique des tout premiers mois, à partir de ce que l'analyse d'enfants et d'adultes lui a appris.\n\nLes citations qui suivent viennent de la version anglaise de cet article (le lien est en fin de fiche). Je les traduis.\n\n## Le sein clivé\n\nLe point de départ est l'expérience de la frustration et de la satisfaction. Le sein de la mère devient, pour l'enfant, « clivé en un sein bon (gratifiant) et un sein mauvais (frustrant) ». Ce clivage, précise Klein, « aboutit à une séparation de l'amour et de la haine ».\n\nL'enfant ne connaît pas encore une mère entière qui tantôt nourrit et tantôt fait attendre. Il a affaire à deux objets distincts : l'un tout bon, l'autre tout mauvais. Klein décrit même un contraste dans la façon dont ils sont éprouvés : le sein frustrant est vécu « en fragments », tandis que le sein gratifiant, incorporé, est vécu comme complet.\n\n> **Exemple (une illustration, pas une observation de Klein).** À l'âge adulte, on voit parfois ce mouvement à l'œuvre : un collègue nouvellement arrivé est « formidable » pendant trois semaines, puis, après une remarque maladroite, « nul » du jour au lendemain. La personne est la même ; c'est l'image qui s'est coupée en deux. Klein décrit le clivage chez le nourrisson, et l'exemple ne prétend pas que l'adulte se comporte comme lui : il montre seulement de quel genre de mécanisme il s'agit.\n\n## Persécution et idéalisation\n\nLe clivage a deux conséquences. D'une part, « la haine et l'angoisse de persécution s'attachent au sein frustrant ». Le mauvais objet est vécu comme une menace : c'est la raison pour laquelle Klein parle de position *paranoïde*. D'autre part, « l'idéalisation est liée au clivage de l'objet » : le bon objet est idéalisé pendant que la haine va au mauvais.\n\nElle ajoute un point sur les ressources de l'enfant : le déni de la réalité psychique ne devient possible, écrit-elle, que grâce à de forts sentiments de toute-puissance.\n\n## L'identification projective\n\nDans cet article, Klein donne un nom à un processus qu'elle décrit : « Je propose pour ces processus le terme d'*identification projective* ». Elle y voit le prototype d'une relation d'objet agressive.\n\nLe terme aura une longue postérité. Bion, notamment, développera la notion à partir de Klein (voir la fiche sur la rêverie).\n\n## La position dépressive\n\nL'autre pôle apparaît plus tard dans la première année. L'enfant introjecte l'objet comme un tout : l'objet aimé et l'objet haï ne font plus qu'un. Klein écrit alors que « la position dépressive est passée au premier plan ». L'expérience même des sentiments dépressifs contribue à intégrer davantage le moi.\n\nCette intégration a un coût : l'enfant sent désormais que ses impulsions agressives visent la personne qu'il aime. Apparaissent un sentiment de culpabilité, l'ambivalence (la présence conjointe de l'amour et de la haine envers le même objet), et un mouvement nouveau : « le désir de réparer, qui passe au premier plan à ce stade ». L'agressivité ne disparaît pas, elle est désormais tenue ensemble avec l'amour.\n\n> **Exemple (une illustration).** Un enfant qui a rageusement jeté son nounours, puis qui se précipite pour le ramasser et le serrer en sanglotant a quelque chose de ce mouvement : la même peluche qu'il a malmenée est celle qu'il veut maintenant consoler. Ce n'est pas un cas de Klein, mais une scène qui fait voir ce que « réparer » veut dire.\n\n## Pourquoi « position » ?\n\nLe mot est un choix de Klein, et l'article de 1946 en dit l'origine. Dans une note, elle explique que son expression habituelle était « position paranoïde » et qu'elle l'avait employée comme équivalent de la « position schizoïde » de Fairbairn. Après réflexion, écrit-elle, elle a décidé de combiner le terme de Fairbairn avec le sien. D'où la « position paranoïde-schizoïde », qui précède la position dépressive.\n\nElle discute d'ailleurs Fairbairn : elle juge que son terme conviendrait s'il couvrait à la fois la crainte de persécution et les mécanismes schizoïdes, et elle conteste que seul le mauvais objet soit d'abord intériorisé.\n\nLe choix de « position » plutôt que de « stade » est souvent commenté : Wikipédia rapporte, d'après Steven Ellman, que Klein parle d'une théorie des positions plutôt que d'une théorie des stades. L'idée qu'on oscille ensuite entre les deux positions tout au long de la vie est courante chez les commentateurs, mais la page qui la formule ne cite pas de source, et l'article de 1946 ne l'énonce pas dans ces termes : Klein y parle surtout des premiers mois.\n\n## Ce qu'il faut garder\n\nLa force de cette théorie tient à ce qu'elle replace la haine et l'amour dès l'origine, et qu'elle décrit la maturité comme la capacité de tenir ensemble ce que l'enfant sépare d'abord. Cette idée a été reprise, discutée et critiquée par d'autres psychanalystes, de Winnicott à Bion. Elle repose sur une description très audacieuse de l'expérience du nourrisson, que l'on ne peut pas observer directement. Il convient de la lire comme un modèle théorique, formé à partir de l'analyse, plutôt que comme un constat.","quiz":[{"question":"Que produit le clivage de l'objet dans la position paranoïde-schizoïde ?","choix":["Un sein unique, qui est tantôt bon, tantôt mauvais","Une réparation immédiate de l'objet détruit en fantasme","Un sein bon et un sein mauvais, avec séparation de l'amour et de la haine","Un refoulement du désir œdipien du bébé"],"bonne":2,"explication":"Klein décrit un sein « clivé en un sein bon et un sein mauvais », d'où une séparation de l'amour et de la haine. La réparation relève de la position dépressive, et le refoulement œdipien n'est pas le sujet de cet article."},{"question":"Quel terme Klein propose-t-elle dans l'article de 1946 pour désigner le fait de projeter des parties de soi dans l'objet ?","choix":["La sublimation","La formation réactionnelle","Le transfert","L'identification projective"],"bonne":3,"explication":"C'est l'article de 1946 qui introduit « identification projective » (« I suggest for these processes the term 'projective identification' »). Les trois autres termes existent en psychanalyse mais désignent d'autres notions."},{"question":"Que se passe-t-il dans la position dépressive ?","choix":["L'objet aimé et l'objet haï ne font qu'un : culpabilité et réparation apparaissent","L'enfant se persuade que sa mère le déteste réellement","L'enfant n'a plus besoin de sa mère pour être nourri","L'enfant nie complètement toute agressivité envers ses parents"],"bonne":0,"explication":"L'introjection de l'objet comme un tout fait passer la position dépressive au premier plan : ambivalence, culpabilité et désir de réparer. L'enfant ne découvre ni une haine réelle de la mère, ni une autonomie, et l'agressivité n'est pas niée mais tenue avec l'amour."},{"question":"D'où vient l'expression « position paranoïde-schizoïde » ?","choix":["Elle est reprise telle quelle des écrits de Freud sur la paranoïa","Elle désigne un trouble propre à l'adolescence","Elle a été inventée par Winnicott en réponse à Klein","Klein joint son « position paranoïde » à la « position schizoïde » de Fairbairn"],"bonne":3,"explication":"Une note de l'article de 1946 explique que Klein décide de combiner le terme de Fairbairn avec le sien. Elle n'est ni de Freud ni de Winnicott, et ne désigne pas un trouble de l'adolescence."}],"sources":[{"texte":"Klein, M., « Notes on Some Schizoid Mechanisms » (1946), Int. J. Psycho-Anal. (PDF)","url":"https://psptraining.com/wp-content/uploads/Klein-M.-1946.-Notes-on-some-schizoid-mechanisms.pdf"},{"texte":"British Psychoanalytical Society, « Melanie Klein's paper, 'Notes on Some Schizoid Mechanisms' is published » (4 mai 1946)","url":"https://psychoanalysis.org.uk/who-we-are/100-years-of-history/melanie-kleins-paper-notes-some-schizoid-mechanisms-published"},{"texte":"Wikipédia (anglais), « Depressive position »","url":"https://en.wikipedia.org/wiki/Depressive_position"}]},{"id":"aristote-akrasia","discipline":"philosophie","titre":"L'akrasia","figure":"Aristote","reference":"Éthique à Nicomaque, livre VII, chap. 1–10 (IVe s. av. J.-C.)","accroche":"Vous savez que c'est une mauvaise idée. Vous le faites quand même. Socrate disait que c'était impossible. Aristote prend le parti des faits.","punch":"Savoir ce qui est bien et faire le contraire : Socrate le jugeait impossible.","idee":"Pour Socrate, nul ne fait le mal volontairement : agir mal, c'est ignorer. Aristote objecte que l'incontinent sait, mais d'un savoir qu'il « a » sans l'exercer, comme l'homme ivre qui récite des vers d'Empédocle sans les comprendre.","repere":"Akrasia (ἀκρασία) : littéralement « absence de maîtrise ». On traduit par incontinence ou faiblesse de la volonté. Son contraire est l'enkrateia, la maîtrise de soi ; il ne faut pas la confondre avec l'intempérance (akolasia), qui est un vice.","liens":["freud-moi-pas-maitre","spinoza-desir","pascal-divertissement"],"texte":"Socrate soutenait une thèse qui semble contredire l'expérience la plus banale : personne n'agit contre ce qu'il juge le meilleur. Si quelqu'un agit mal, c'est qu'il se trompe sur ce qui est bon pour lui. La faute vient de l'ignorance.\n\nAristote ouvre la discussion du livre VII de l'*Éthique à Nicomaque* en constatant que cette thèse contredit manifestement les faits observés. Il y a bien des gens qui savent qu'une chose est mauvaise et qui la font, entraînés par le désir. Mais il ne se contente pas de donner tort à Socrate : il cherche en quel sens on peut savoir et agir contre son savoir.\n\n> **Exemple.** Il est 23 heures. Vous avez décidé, pour de bonnes raisons, d'éteindre l'écran et de dormir : demain commence tôt. Vous le savez, vous pourriez l'expliquer à quelqu'un. Une heure plus tard, vous regardez encore des vidéos. Le lendemain, vous vous le reprochez. Ce n'est pas que vous ignoriez les raisons de dormir. C'est que, sur le moment, elles n'agissaient pas. C'est exactement ce cas que le livre VII veut comprendre.\n\n## Avoir un savoir sans s'en servir\n\nLa distinction centrale est entre *posséder* un savoir et *l'exercer*. On dit de deux personnes qu'elles savent : celle qui a un savoir mais ne s'en sert pas, et celle qui s'en sert. Ce n'est pas la même chose d'agir mal en ayant à l'esprit, au moment même, ce qu'il faudrait faire, et d'agir mal en le sachant seulement d'une manière dormante.\n\nAristote donne des images frappantes. Les incontinents sont dans un état semblable à celui des gens endormis, fous ou ivres : les passions, comme la colère ou les désirs sexuels, altèrent même le corps. Le fait qu'ils prononcent les bonnes maximes ne prouve rien. Les gens ivres récitent bien des vers d'Empédocle. Et les débutants enchaînent les phrases d'une science sans encore la connaître : il faut que le savoir fasse corps avec eux, et cela demande du temps.\n\n> **Exemple.** Un étudiant récite parfaitement la définition de l'impératif catégorique la veille de l'examen. Il la « possède ». Mais il ne saurait pas reconnaître, dans une situation concrète, ce qu'elle exige. Aristote dirait qu'il a les mots sans le savoir. L'incontinent est dans une position comparable vis-à-vis de ses propres principes : il peut les dire, il ne les a pas en acte.\n\n## Le syllogisme pratique\n\nAristote décrit l'action comme la conclusion d'un raisonnement. Une prémisse générale, une prémisse particulière, et l'action suit, comme une conclusion. Dans la traduction anglaise de W. D. Ross : « tout ce qui est sucré doit être goûté », « ceci est sucré » ; celui qui peut agir et n'en est pas empêché goûte aussitôt.\n\nChez l'incontinent, deux prémisses générales sont présentes à la fois. L'une lui interdit de goûter. L'autre dit que tout ce qui est sucré est agréable. Et la prémisse particulière, « ceci est sucré », est active. Si l'appétit est là, c'est lui qui s'empare de la conclusion : le désir pousse le corps, et l'action suit. L'incontinent agit ainsi, en un sens, sous l'effet d'un raisonnement et d'une opinion.\n\nD'où une conclusion nuancée : en un sens, ce que Socrate voulait établir semble se vérifier. Ce n'est pas la connaissance au sens propre qui est vaincue par la passion. C'est une connaissance qui porte sur le particulier, sur la perception de la situation, et qui n'était pas pleinement exercée.\n\n## Incontinent et intempérant\n\nAristote distingue soigneusement deux figures qui se ressemblent de loin.\n\nL'**intempérant** poursuit les plaisirs excessifs par choix, persuadé que c'est ainsi qu'il faut vivre. Il ne se repent pas, puisqu'il s'en tient à son choix. C'est pourquoi Aristote le juge incurable.\n\nL'**incontinent**, lui, agit contre son propre choix. Il sait que ce qu'il fait est mauvais, et il le regrette ensuite. Son principe, sa conviction de fond, reste bon. C'est pourquoi il est plus facile à persuader, et curable.\n\n> **Exemple.** Deux personnes boivent trop chaque soir. La première trouve que c'est très bien ainsi et ne voit aucune raison de changer : elle est, au sens d'Aristote, intempérante. La seconde se promet chaque matin d'arrêter et cède chaque soir : elle est incontinente. De l'extérieur, les deux conduites sont identiques. De l'intérieur, tout les sépare, et c'est sur la seconde que la parole d'un autre a prise.\n\n## Ce que le texte laisse ouvert\n\nCette division intérieure, vouloir et ne pas vouloir, savoir et ne pas savoir, est l'un des plus anciens points d'appui de la réflexion sur le sujet. Aristote la pense encore dans les termes d'une âme où la raison devrait commander et où l'appétit, parfois, la court-circuite.\n\nLa philosophie contemporaine a repris la question sous le nom de « faiblesse de la volonté », et elle reste disputée : est-il seulement possible d'agir librement contre son meilleur jugement présent ? On peut aussi se demander, avec d'autres outils, si ce qui « l'emporte » n'a pas lui aussi ses raisons propres, qui ne sont pas celles que le sujet se donne.","quiz":[{"question":"Quelle thèse socratique l'analyse de l'akrasia met-elle en difficulté ?","choix":["Nul n'agit contre ce qu'il juge le meilleur, la faute vient de l'ignorance","La vertu ne peut pas s'enseigner, puisque les sages n'ont pas de disciples","Le plaisir est le seul bien véritable pour l'être humain","La cité juste exige que les philosophes gouvernent la cité"],"bonne":0,"explication":"Socrate tient que la faute vient de l'ignorance : l'akrasia, où l'on agit contre ce qu'on sait, semble le contredire. La question de l'enseignement de la vertu est discutée ailleurs, l'hédonisme n'est pas la position socratique, et le philosophe-roi relève de la République."},{"question":"Quelle distinction permet à Aristote d'expliquer qu'on agisse contre son savoir ?","choix":["Entre savoir divin et savoir humain","Entre ce que l'on désire et ce que l'on mérite","Entre posséder un savoir et l'exercer effectivement","Entre la mémoire et l'imagination"],"bonne":2,"explication":"Comme l'homme endormi ou ivre, l'incontinent possède un savoir qu'il n'exerce pas au moment d'agir. Les autres distinctions ne jouent aucun rôle dans l'argument du livre VII."},{"question":"Que montre l'exemple de l'homme ivre qui récite des vers d'Empédocle ?","choix":["Que la poésie rend les hommes incontinents et faibles","Que l'ivresse améliore la mémoire des textes appris","Que prononcer les bonnes maximes ne prouve pas qu'on les a à l'esprit en agissant","Qu'Empédocle était lui-même un incontinent notoire à Athènes"],"bonne":2,"explication":"On peut dire les mots justes sans que le savoir soit actif, comme l'homme ivre récite des vers ou le débutant enchaîne des phrases qu'il ne comprend pas encore. Aristote ne juge ni la poésie, ni la mémoire, ni Empédocle."},{"question":"En quoi l'incontinent diffère-t-il de l'intempérant ?","choix":["L'incontinent recherche les plaisirs avec plus de mesure","L'intempérant ignore ce qu'est le plaisir","Aristote emploie les deux mots indifféremment","L'incontinent agit contre son choix et le regrette ; l'intempérant, par choix"],"bonne":3,"explication":"L'intempérant s'en tient à son choix et ne se repent pas, ce qui le rend incurable. L'incontinent agit contre ce qu'il a choisi et se repent, ce qui le rend curable. La distinction ne porte ni sur la mesure ni sur la connaissance du plaisir."}],"sources":[{"texte":"Aristote, Éthique à Nicomaque, livre VII, trad. anglaise de W. D. Ross (MIT Internet Classics Archive)","url":"http://classics.mit.edu/Aristotle/nicomachaen.7.vii.html"},{"texte":"Stanford Encyclopedia of Philosophy, « Weakness of Will »","url":"https://plato.stanford.edu/entries/weakness-will/"},{"texte":"Stanford Encyclopedia of Philosophy, « Aristotle's Ethics »","url":"https://plato.stanford.edu/entries/aristotle-ethics/"}]},{"id":"winnicott-mere-suffisamment-bonne","discipline":"psychanalyse","titre":"La mère suffisamment bonne","figure":"Donald W. Winnicott","reference":"Objets transitionnels et phénomènes transitionnels (lu en 1951, publié en 1953) ; repris dans Jeu et réalité (1971)","accroche":"Winnicott n'a jamais demandé aux mères d'être parfaites. Il a décrit une mère qui échoue, juste ce qu'il faut, et au bon moment.","punch":"Après avoir donné l'illusion, la mère a pour tâche la désillusion.","idee":"Au début, la mère s'adapte presque complètement aux besoins du nourrisson, qui vit l'illusion de créer ce qu'il trouve. Puis elle s'adapte de moins en moins complètement : c'est la désillusion. Dans l'entre-deux apparaît l'objet transitionnel, à mi-chemin du dedans et du dehors.","citation":"The good-enough mother, as I have stated, starts off with an almost complete adaptation to her infant's needs","citation_source":"Winnicott, « Transitional Objects and Transitional Phenomena » (lu à la Société britannique de psychanalyse le 30 mai 1951, publié en 1953), p. 238 de la réimpression — « La mère suffisamment bonne, comme je l'ai dit, commence par une adaptation presque complète aux besoins de son nourrisson » (ma traduction)","citation_url":"https://hegel1313.law.columbia.edu/files/2026/05/winnicott_transitional_objects_and_transitional_phenomena.pdf","liens":["lacan-stade-du-miroir","klein-positions","bion-reverie"],"texte":"Le texte où apparaît la « mère suffisamment bonne » (*good-enough mother*) porte un titre qui ne la nomme pas : « Objets transitionnels et phénomènes transitionnels », sous-titré « une étude de la première possession non-moi ». Winnicott l'a lu devant la Société britannique de psychanalyse le 30 mai 1951 et publié dans l'*International Journal of Psycho-Analysis* en 1953. Il sera repris dans *Through Paediatrics to Psycho-Analysis* (1958), puis dans *Jeu et réalité* (1971). Les citations qui suivent viennent de la réimpression, et je les traduis.\n\n## Pas de nourrisson sans soins\n\nPour comprendre ce que Winnicott fait de la mère, il faut partir d'une phrase plus ancienne. Dans l'introduction que Masud Khan donne en 1958 à l'ouvrage de Winnicott, il cite une discussion de 1940 : « Il n'existe pas de nourrisson, ce qui veut dire, bien sûr, que chaque fois qu'on trouve un nourrisson, on trouve des soins maternels. » La formule, que l'on traduit souvent par « un bébé, ça n'existe pas », ne nie rien du bébé. Elle dit qu'on ne peut pas le décrire seul : l'unité de départ est le couple formé par l'enfant et ceux qui s'en occupent.\n\n## L'adaptation, puis l'échec\n\nC'est dans ce cadre que s'inscrit le passage célèbre : « La mère suffisamment bonne, comme je l'ai dit, commence par une adaptation presque complète aux besoins de son nourrisson. » Au fil du temps, poursuit Winnicott, elle s'adapte de moins en moins complètement.\n\nAu début, cette adaptation presque totale donne au bébé quelque chose d'essentiel : l'occasion d'une illusion. Winnicott écrit que le sein est « créé par le nourrisson, encore et encore, à partir de sa capacité d'aimer », et que la mère fournit « l'occasion de l'illusion que son sein fait partie du nourrisson ». L'enfant éprouve que le monde répond à ce qu'il attend.\n\nMais cette illusion n'est pas faite pour durer. Winnicott le dit sans détour : la tâche principale de la mère, à côté de l'occasion de l'illusion, est la désillusion. La mère « suffisamment bonne » est donc aussi celle qui, peu à peu, cesse d'être exactement ajustée.\n\n> **Exemple (une illustration, pas un cas de Winnicott).** Un nourrisson pleure ; presque aussitôt, la tétée arrive. Quelques mois plus tard, le même enfant doit attendre, en protestant, que le biberon soit prêt. Ce petit délai, répété, lui apprend que ce qui vient ne sort pas de son seul désir. C'est ce que l'on peut entendre par « désillusion » : une découverte progressive, et non un choc.\n\nAilleurs, selon Wikipédia, Winnicott décrit des parents qui n'ont pas besoin d'être parfaitement accordés, mais « ordinairement dévoués » (*ordinarily devoted*) ou « suffisamment bons ». Il écrit aussi que les fondations de la santé sont posées par la mère ordinaire dans ses soins ordinaires et affectueux à son propre bébé (*The Child, the Family, and the Outside World*, cité par la même page).\n\n## L'objet transitionnel\n\nWinnicott observe que beaucoup de nourrissons s'attachent à un objet précis, un ours en peluche par exemple. Il introduit les termes d'« objet transitionnel » et de « phénomènes transitionnels » pour désigner cette zone d'expérience, qu'il situe dans l'*aire intermédiaire d'expérience*, « entre le pouce et l'ours en peluche ».\n\nIl y voit une réponse à une tâche humaine que l'on n'achève jamais, celle de « maintenir la réalité intérieure et la réalité extérieure séparées mais reliées entre elles ». L'objet n'est ni tout à fait dans la tête de l'enfant, ni tout à fait dans le monde : il appartient aux deux.\n\nWinnicott décrit le comportement des parents avec une précision presque comique. Ils en viennent à connaître sa valeur et l'emportent avec eux en voyage. La mère le laisse devenir sale, voire malodorant. Il ne doit pas changer, sauf si c'est l'enfant qui le change. Et à la fin, écrit-il : « Il n'est pas oublié et il n'est pas pleuré. »\n\n> **Exemple (une illustration).** Un enfant de trois ans refuse qu'on lave son lapin en tissu, devenu gris et usé. Ce n'est pas un défaut d'hygiène qu'il défend : c'est l'objet tel qu'il est. Chez Winnicott, l'objet « ne doit jamais changer, sauf si c'est l'enfant qui le change » : le scénario n'est pas de lui, mais la règle qu'il énonce s'y reconnaît.\n\n## La question qu'on ne pose pas\n\nLe passage le plus fin de l'article porte sur le statut de cet objet. Est-il trouvé, ou créé ? Winnicott cite la question qu'on serait tenté de poser : « L'as-tu conçu, ou t'a-t-il été présenté du dehors ? » Et il ajoute deux phrases : « Le point important est qu'aucune décision n'est attendue sur ce point. La question ne doit pas être formulée. »\n\nLe paradoxe d'un objet à la fois trouvé et créé n'est donc pas à trancher : on ne demande pas à l'enfant de décider.\n\n## Au-delà du berceau\n\nL'objet transitionnel n'est pas voué à rester. Mais ce qu'il a ouvert reste. Winnicott écrit que les phénomènes transitionnels se diffusent « sur tout le champ culturel », et il parle de « l'expérience intense qui appartient aux arts et à la religion ». L'objet passe, mais l'aire intermédiaire qu'il a ouverte se prolonge dans la vie culturelle de l'adulte.\n\nIl faut garder à l'esprit les limites de ce qu'on a ici. Les passages traduits viennent d'un seul texte de 1953, que je cite dans sa réimpression. Winnicott a développé ces thèmes dans d'autres écrits, que cette fiche ne couvre pas.","quiz":[{"question":"Que veut dire, chez Winnicott, la formule « il n'existe pas de nourrisson » ?","choix":["Que partout où l'on trouve un nourrisson, on trouve des soins maternels","Que les nourrissons n'ont pas encore de vie psychique propre","Que la naissance est un événement sans importance psychique","Que les bébés sont des constructions de l'imagination adulte"],"bonne":0,"explication":"La phrase, rapportée par Khan à propos d'une discussion de 1940, dit que le nourrisson ne se décrit pas sans les soins qu'il reçoit. Winnicott ne nie pas la vie psychique du bébé : il dit qu'on ne peut le séparer de ceux qui s'en occupent."},{"question":"Comment l'adaptation de la mère évolue-t-elle ?","choix":["Elle reste complète tant que l'enfant n'est pas scolarisé","Elle est faible au début, puis augmente avec l'âge","Elle est presque complète au début, puis diminue graduellement","Elle est la même pendant toute l'enfance, sans changement"],"bonne":2,"explication":"Winnicott écrit que la mère suffisamment bonne commence par une adaptation presque complète aux besoins du nourrisson, puis s'adapte de moins en moins complètement. Les autres évolutions ne sont pas celles qu'il décrit."},{"question":"Quelle tâche Winnicott attribue-t-il à la mère, à côté de l'occasion de l'illusion ?","choix":["L'apprentissage de la propreté","La transmission des interdits familiaux","La préparation à l'école","La désillusion"],"bonne":3,"explication":"« La tâche principale de la mère, à côté de l'occasion de l'illusion, est la désillusion. » Elle est progressive, ajustée à ce que l'enfant supporte."},{"question":"Quelle question Winnicott juge-t-il qu'on ne doit pas poser à propos de l'objet transitionnel ?","choix":["« Où as-tu trouvé cet objet que tu emmènes partout ? »","« Pourquoi y tiens-tu autant, alors qu'il est si sale ? »","« Peut-on le laver, maintenant, avant ton départ ? »","« L'as-tu conçu, ou t'a-t-il été présenté du dehors ? »"],"bonne":3,"explication":"Winnicott précise qu'aucune décision n'est attendue sur ce point : la question ne doit pas être formulée. Le paradoxe de l'objet à la fois créé et trouvé n'est pas à résoudre, mais à respecter."}],"sources":[{"texte":"Winnicott, « Transitional Objects and Transitional Phenomena » (1953), texte complet (PDF, réimpression)","url":"https://hegel1313.law.columbia.edu/files/2026/05/winnicott_transitional_objects_and_transitional_phenomena.pdf"},{"texte":"Winnicott, Through Paediatrics to Psycho-Analysis (1958), introduction de Masud Khan (formule de 1940)","url":"https://psptraining.com/wp-content/uploads/Winnicott-D.W.-1958.-Through-paediatrics-to-psycho-analysis.pdf"},{"texte":"V. Lebeau, « D.W. Winnicott : \"Transitional Objects and Transitional Phenomena\" », Palgrave Handbook of Psychosocial Studies (2022)","url":"https://link.springer.com/referenceworkentry/10.1007/978-3-030-61510-9_40-1"},{"texte":"Wikipédia (anglais), « Donald Winnicott » (« ordinarily devoted », « holding »)","url":"https://en.wikipedia.org/wiki/Donald_Winnicott"}]},{"id":"husserl-epoche","discipline":"philosophie","titre":"L'épochè","figure":"Edmund Husserl","reference":"Idées directrices pour une phénoménologie, I, § 27–32 (1913)","accroche":"Husserl ne doute pas que le monde existe. Il décide simplement de ne plus s'en servir, et c'est ainsi qu'il le voit vraiment.","punch":"Ne pas nier le monde. Le mettre entre parenthèses.","idee":"Dans l'attitude naturelle, nous croyons au monde sans même y penser. L'épochè suspend cette croyance sans la nier, pour regarder comment le monde se donne à la conscience. Ce qui était évident devient un phénomène à décrire.","repere":"Épochè (ἐποχή) : mot des sceptiques grecs, « suspension du jugement ». Husserl en fait une opération de méthode, la « mise entre parenthèses » ou « mise hors circuit » de la croyance en l'existence du monde, qui ouvre la réduction phénoménologique.","liens":["descartes-malin-genie","freud-inquietante-etrangete","wittgenstein-taire"],"texte":"Les *Recherches logiques* (1900–1901) avaient lancé un mot d'ordre : revenir « aux choses mêmes ». Les *Idées directrices* de 1913 donnent la méthode pour y parvenir, et elle passe par un geste paradoxal : pour revenir aux choses, il faut d'abord cesser de croire naïvement en elles.\n\nLe livre a été traduit en français par Paul Ricœur, qui en a commencé la traduction pendant sa captivité en Allemagne ; elle paraît chez Gallimard en 1950.\n\n## L'attitude naturelle\n\nHusserl commence par décrire notre manière ordinaire d'être au monde. Je trouve devant moi des choses, des personnes, des valeurs, des outils. Le monde est « là », toujours déjà, et je le pose comme existant sans jamais formuler cette position. Husserl appelle cela la *thèse générale* de l'attitude naturelle.\n\nCette croyance n'est pas une opinion parmi d'autres. Elle est le sol sur lequel reposent toutes nos opinions, si évidente qu'on ne la remarque jamais. Même les sciences, si critiques par ailleurs, travaillent sur ce sol sans l'interroger.\n\n> **Exemple.** Vous entrez dans votre cuisine le matin. Vous ne vous dites pas « il existe une cuisine, elle a une table, la table continue d'exister quand je ne la regarde pas ». Vous attrapez une tasse. Toute cette croyance au monde fonctionne en silence, dans le geste. C'est ce silence que Husserl veut rendre visible.\n\n## Suspendre sans nier\n\nL'épochè consiste à mettre cette thèse « hors circuit », « entre parenthèses ». L'Encyclopédie de Stanford le souligne : le but de l'épochè n'est pas de douter de la réalité, ni de la négliger ou de l'exclure de la recherche. La thèse reste ce qu'elle est ; simplement, je n'en fais plus usage. Je ne m'appuie plus sur elle pour juger.\n\nLa différence avec le doute cartésien est capitale. Descartes doute pour trouver une certitude sur laquelle reconstruire la science : il veut savoir *si* le monde existe. Husserl suspend pour *voir* : ce qui l'intéresse, ce n'est plus que le monde existe, c'est la manière dont il apparaît.\n\n> **Exemple.** Un peintre regarde une route qui s'éloigne. Il « sait » que ses bords sont parallèles. Mais pour la peindre, il doit suspendre ce savoir et regarder comment elle se donne : les bords se rejoignent à l'horizon. Il ne nie pas que la route soit droite ; il cesse un moment de s'en servir. L'épochè généralise ce geste à toute l'expérience.\n\n## Ce qui reste\n\nQue reste-t-il une fois la croyance au monde suspendue ? Tout, mais autrement. L'arbre que je perçois n'a pas disparu ; il est devenu un *phénomène*, un arbre-tel-que-perçu, avec ses faces visibles et cachées, ses horizons, sa manière de se donner par esquisses successives à mesure que je tourne autour.\n\nEt la conscience qui le perçoit se révèle *intentionnelle* : toute conscience est conscience *de* quelque chose. Elle vise. Husserl distingue l'acte de viser, la *noèse*, et le visé tel qu'il est visé, le *noème*. L'épochè ouvre le champ de leur description.\n\n> **Exemple.** Le même immeuble peut être vu, rêvé, regretté, désiré, ou simplement mentionné dans une conversation. Dans chaque cas, c'est bien « cet immeuble » qui est visé, mais de façons différentes : perçu, imaginé, chargé de souvenirs, objet d'envie. La phénoménologie décrit ces différentes manières de viser, au lieu de se demander seulement si l'immeuble existe.\n\n## Une attitude, plus qu'une technique\n\nOn a beaucoup reproché à Husserl le versant idéaliste de sa démarche : la tentation de faire de la conscience pure le fondement de tout. Merleau-Ponty, dans l'avant-propos de la *Phénoménologie de la perception* (1945), en tire une leçon devenue célèbre : le plus grand enseignement de la réduction est l'impossibilité d'une réduction complète. On ne sort jamais tout à fait du monde, parce qu'on y est par son corps.\n\nMais le geste demeure fécond, bien au-delà de la philosophie. Suspendre ce qu'on tient pour évident pour regarder comment cela se présente : c'est une discipline de l'attention.\n\n> **Exemple, clinique.** Un patient dit : « Ma mère était froide. » Il est tentant de comprendre aussitôt, de compléter avec ce qu'on sait des mères froides. Une écoute qui pratique une sorte d'épochè suspend ce savoir : comment ce mot, « froide », arrive-t-il dans son récit ? À quel moment, avec quel ton, à propos de quelle scène ? Ce n'est pas nier ce qu'il dit, c'est s'interdire de comprendre trop vite pour entendre ce qui se présente.\n\nL'écoute qui s'interdit de comprendre trop vite n'est pas très éloignée du geste husserlien, même si la psychanalyse n'en tire pas les mêmes conséquences.","quiz":[{"question":"Que fait exactement l'épochè husserlienne avec la croyance au monde ?","choix":["Elle la nie, en affirmant que le monde extérieur n'existe pas","Elle la met en doute, pour pouvoir la réfuter ensuite","Elle la met entre parenthèses, sans la nier, en cessant d'en faire usage","Elle la remplace par une croyance en Dieu, garant du monde"],"bonne":2,"explication":"La thèse reste ce qu'elle est, on n'en fait simplement plus usage. Ce n'est ni la négation, ni le doute qui cherche à réfuter, ni une substitution théologique."},{"question":"En quoi l'épochè se distingue-t-elle du doute cartésien ?","choix":["Descartes doute pour fonder la science ; Husserl suspend pour décrire l'apparaître","Descartes croit au monde extérieur, alors que Husserl n'y croit pas","Husserl reprend exactement la méthode de Descartes, sans rien y changer","Descartes s'intéresse à la perception, Husserl seulement à la logique"],"bonne":0,"explication":"Le doute cartésien vise une certitude fondatrice ; l'épochè vise la description des phénomènes. Husserl ne nie pas le monde, il ne se contente pas de reprendre Descartes, et c'est bien lui qui fait de la perception un objet central."},{"question":"Que signifie l'intentionnalité de la conscience ?","choix":["Que la conscience agit toujours avec de bonnes intentions","Que la conscience est capable de vouloir librement","Que toute conscience est conscience de quelque chose","Que la conscience peut se passer de tout objet"],"bonne":2,"explication":"L'intentionnalité désigne le fait que la conscience vise toujours un objet, perçu, imaginé, désiré. Le mot n'a pas ici de sens moral, ni de rapport direct avec la volonté, et il exclut une conscience sans objet."},{"question":"Quelle leçon Merleau-Ponty tire-t-il de la réduction ?","choix":["Qu'elle permet d'atteindre une conscience pure séparée du monde","Qu'elle est inutile et doit être abandonnée","Qu'elle prouve l'existence d'un monde extérieur","Que son plus grand enseignement est l'impossibilité d'une réduction complète"],"bonne":3,"explication":"Pour Merleau-Ponty, on ne sort jamais tout à fait du monde : c'est l'enseignement de la réduction. Il ne l'abandonne pas, il ne la tient pas pour un accès à une conscience pure, et elle n'est pas une preuve d'existence."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Edmund Husserl »","url":"https://plato.stanford.edu/entries/husserl/"},{"texte":"Stanford Encyclopedia of Philosophy, « Phenomenology »","url":"https://plato.stanford.edu/entries/phenomenology/"},{"texte":"Merleau-Ponty, la critique de la réduction (avant-propos de la Phénoménologie de la perception), Nomad Éducation","url":"https://www.nomadeducation.fr/revisions/licence-philosophie-3e-annee-lb527c62/la-critique-de-merleau-ponty-cy61fa14"}]},{"id":"bion-reverie","discipline":"psychanalyse","titre":"La capacité de rêverie","figure":"Wilfred R. Bion","reference":"Learning from Experience (1962) ; A Theory of Thinking, Int. J. Psycho-Anal. 43 (1962), repris dans Second Thoughts (1967)","accroche":"Avant de pouvoir penser, le bébé a besoin que quelqu'un accueille ce qu'il ne peut pas supporter. Bion appelle cet accueil la rêverie.","punch":"La pensée ne vient pas d'abord de la pensée. Elle vient d'être accueilli.","idee":"Le nourrisson projette dans sa mère des éprouvés bruts, impensables (éléments bêta). Par sa rêverie, elle les reçoit et la fonction alpha les transforme en éléments qui peuvent être rêvés et pensés. Le bébé reçoit en retour ses peurs sous une forme supportable.","citation":"Thinking is a development forced on the psyche by the pressure of thoughts and not the other way round","citation_source":"Bion, Second Thoughts (1967), p. 111 — cité par Th. Ogden, « Bion's Four Principles of Mental Functioning », Fort Da, 2008 (« La pensée est un développement imposé au psychisme par la pression des pensées, et non l'inverse », ma traduction)","citation_url":"https://web.english.upenn.edu/~cavitch/pdf-library/Ogden_Bion_s_Four_Principles.pdf","liens":["winnicott-mere-suffisamment-bonne","klein-positions","freud-reve"],"texte":"Quand Bion publie *Learning from Experience* en 1962, il s'intéresse à une question qui paraît paradoxale : comment devient-on capable de penser ? Sa réponse renverse l'ordre habituel. Ce n'est pas la pensée qui produit des pensées ; ce sont les pensées, dit-il, qui forcent le psychisme à se développer. Une phrase de *Second Thoughts* (1967) le dit sans détour : « La pensée est un développement imposé au psychisme par la pression des pensées, et non l'inverse. »\n\nLes citations qui suivent viennent d'études qui citent Bion avec ses références de page. Je les traduis, et je précise à chaque fois qui parle.\n\n## Éléments bêta et fonction alpha\n\nBion appelle *éléments bêta* des impressions sensorielles liées à une expérience émotionnelle, en l'état brut où elles se présentent (Ogden, citant Bion 1962, p. 17). Ils ne se prêtent pas à la formation de pensées de rêve : ils sont, écrit Bion, « impropres à être utilisés dans les pensées de rêve, mais adaptés à l'identification projective » (1962, p. 6, cité dans un article publié dans *Frontiers in Psychology*). Un résumé en français de l'œuvre de Bion, par Émile Jalley, dit la même chose autrement : les mauvais objets sont « expulsés sous forme d'éléments bêta » par identification projective.\n\nCe qui les transforme est la *fonction alpha*, qui produit des *éléments alpha*, utilisables pour rêver et penser. Bion la laisse volontairement ouverte : selon Ogden, il parle d'un « ensemble d'opérations mentales encore inconnu, et probablement inconnaissable » (1962, p. 6). On sait ce qu'elle fait, non comment elle le fait. Dans le résumé de Jalley, les protopensées admises « à titre de problèmes à résoudre » se développent en éléments alpha.\n\n## La rêverie maternelle\n\nLe nourrisson ne dispose pas encore de cette fonction. Dans « A Theory of Thinking », Bion décrit le rôle de la personne qui s'occupe de lui : elle s'engage dans ce qu'il appelle la « rêverie maternelle » (*maternal reverie*, 1962, p. 309). Hanna Segal, citée par Wikipédia, la définit comme « l'état d'esprit réceptif de la mère ».\n\nOgden rapporte un exemple de Bion (1962/1967, pp. 114-115). Quand le nourrisson « sent qu'il est en train de mourir », il peut projeter cette peur dans la mère. Si celle-ci est suffisamment équilibrée, elle peut l'accepter et y répondre « de façon thérapeutique ». Le nourrisson reçoit alors en retour sa personnalité effrayée sous une forme qui lui est supportable : « les peurs sont gérables par la personnalité du nourrisson ».\n\n> **Exemple (une illustration, pas un cas de Bion).** Un nourrisson hurle, rouge, tendu. Un parent le prend, lui parle d'une voix égale, le berce. Le bébé ne comprend aucune de ses paroles, mais quelque chose passe : l'adulte n'a pas paniqué en recevant ce cri, et au bout de quelques minutes le corps du bébé se détend. Ce qui fait la rêverie, dans l'esprit de Bion, c'est cette capacité d'être traversé par la peur de l'autre sans en être submergé.\n\nAu fil de ces expériences, le bébé n'acquiert pas seulement un apaisement : il acquiert la capacité de faire lui-même ce travail. Un article de *Frontiers* résume qu'il introjecte la fonction alpha de son contenant, mais cette formulation est celle de l'auteur, non de Bion.\n\n## Contenant et contenu\n\nBion a un modèle pour cet échange, qu'il nomme *container-contained*, « contenant-contenu ». Wikipédia rapporte qu'il le développe pour la première fois dans *Learning from Experience* en 1962. Ogden y insiste : le contenant « n'est pas une chose mais un processus » (Bion 1962/1975, p. 90). Le contenu, lui, désigne les pensées et les sentiments en train de se former à partir de l'expérience émotionnelle vécue.\n\nBion note la relation par des symboles, ♀ pour le contenant et ♂ pour le contenu (*Attention and Interpretation*). Wikipédia, qui s'appuie sur Symington, décrit le contenant comme ce qui reçoit et traite les sentiments et les expériences insupportables d'un autre, et rattache le modèle à la relation mère-nourrisson.\n\n## Quand l'accueil échoue\n\nQue se passe-t-il si la projection n'est pas accueillie ? Bion parle d'une « terreur sans nom » (*nameless dread*). Wikipédia la définit, en renvoyant à *Second Thoughts*, comme des angoisses primitives qui ne peuvent pas être traitées ni pensées. Une autre étude (Cârstea, 2025) décrit, dans le même esprit, un reste intérieur de projections qui n'ont pas été « contenues ».\n\n## Les limites de cette fiche\n\nCe que Bion décrit est un modèle de la pensée : un mécanisme par lequel ce que le psychisme ne peut pas supporter devient, d'abord grâce à un autre, pensable. Les passages cités ne permettent pas de dire ce qu'il en tirait pour la responsabilité des parents, et je ne l'affirme donc pas ici. Les sources de cette fiche sont des études qui citent Bion avec ses pages, et non les textes de 1962 eux-mêmes : les citations passent par ceux qui les rapportent.","quiz":[{"question":"Que sont les éléments bêta chez Bion ?","choix":["Des pensées déjà élaborées, prêtes à être communiquées","Des souvenirs d'enfance refoulés que l'analyse fait revenir","Les éléments du rêve manifeste, tels que le rêveur les raconte","Des impressions sensorielles liées à une émotion, non transformées"],"bonne":3,"explication":"Selon Ogden citant Bion, les éléments bêta sont des impressions sensorielles liées à une expérience émotionnelle. Ils sont impropres au rêve et se prêtent à l'identification projective ; il ne s'agit ni de pensées élaborées, ni de souvenirs, ni de rêves."},{"question":"Que désigne la « rêverie maternelle » ?","choix":["L'état d'esprit réceptif de la mère, qui accueille ce que l'enfant projette","L'habitude de raconter une histoire au bébé avant le sommeil","Le fait que la mère rêve la nuit à son enfant","La capacité de la mère à satisfaire tous ses besoins physiques"],"bonne":0,"explication":"Hanna Segal, citée par Wikipédia, définit la rêverie comme l'état d'esprit réceptif de la mère. Il ne s'agit ni d'une histoire du soir, ni de ses propres rêves, ni de la seule satisfaction des besoins du corps."},{"question":"Quel est le rôle de la fonction alpha ?","choix":["Éliminer les émotions pour ne garder que les faits observables","Transformer les éléments bêta en éléments alpha, utilisables pour rêver et penser","Refouler hors de la conscience tous les souvenirs trop pénibles","Mesurer l'intelligence du nourrisson dès les premiers jours"],"bonne":1,"explication":"La fonction alpha opère sur les impressions brutes pour produire des éléments alpha. Bion ne la décrit pas comme une élimination des émotions, ni comme un refoulement, ni comme une mesure d'intelligence."},{"question":"Que désigne la « terreur sans nom » (nameless dread) ?","choix":["La peur ordinaire du noir chez l'enfant de deux ans","Une angoisse que l'on peut nommer mais qu'on préfère cacher","Des angoisses primitives qui ne peuvent être ni traitées ni pensées","Le sentiment de culpabilité après une faute grave"],"bonne":2,"explication":"Wikipédia, renvoyant à Second Thoughts, la définit comme des angoisses primitives qui ne peuvent être traitées ni pensées. Elle ne se confond ni avec une peur d'enfant, ni avec une angoisse cachée, ni avec la culpabilité."}],"sources":[{"texte":"Ogden, T. H., « Bion's Four Principles of Mental Functioning », Fort Da (2008) (citations de Bion 1962, 1967, 1975)","url":"https://web.english.upenn.edu/~cavitch/pdf-library/Ogden_Bion_s_Four_Principles.pdf"},{"texte":"Article de Frontiers in Psychology (2018) sur la barrière de contact, citant Bion (1962a, 1962b)","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2018.01674/pdf"},{"texte":"Wikipédia (anglais), « Wilfred Bion » (container-contained, alpha function, beta elements, reverie, nameless dread)","url":"https://en.wikipedia.org/wiki/Wilfred_Bion"},{"texte":"Émile Jalley, « Bion, la pensée », Encyclopædia Universalis","url":"https://www.universalis.fr/encyclopedie/wilfred-r-bion/3-la-pensee/"},{"texte":"D. Cârstea, « Death-equivalents and low-level trauma: Literary representations of dread », Agathos 16 (2), 2025 (mention de la « nameless dread » de Bion, 1984)","url":"https://www.agathos-international-review.com/issues/2025/31/Carstea.pdf"}]},{"id":"kant-lumieres","discipline":"philosophie","titre":"Sapere aude","figure":"Emmanuel Kant","reference":"Réponse à la question : qu'est-ce que les Lumières ? (Berlinische Monatsschrift, décembre 1784)","accroche":"Kant ne dit pas que les hommes sont ignorants. Il dit qu'ils sont paresseux et lâches, et qu'ils ont de bonnes raisons de l'être.","punch":"Il est si commode d'être mineur.","idee":"Les Lumières, c'est la sortie de l'homme d'un état de tutelle dont il est lui-même responsable : l'incapacité de se servir de son entendement sans la direction d'autrui. Ce n'est pas l'intelligence qui manque, c'est le courage.","citation":"Sapere aude ! Aie le courage de te servir de ton propre entendement !","citation_source":"Kant, Qu'est-ce que les Lumières ? (1784) — traduction reproduite par le lycée Descartes de Rabat","citation_url":"https://lycee-descartes.ac.ma/medias/rentree2021/Kant_Quest-ce-que-les-Lumieres-1784.pdf","liens":["platon-reminiscence","freud-moi-pas-maitre","nietzsche-ressentiment"],"texte":"En 1784, la *Berlinische Monatsschrift*, revue des Lumières berlinoises, publie la réponse de Kant à une question qu'un pasteur avait posée en note dans la même revue : qu'est-ce, au juste, que les Lumières ? Kant répond par une phrase qui a la netteté d'une définition : la sortie de l'homme hors de l'état de tutelle dont il est lui-même responsable.\n\nLe texte fait une dizaine de pages. Il est devenu l'un des manifestes les plus cités de la modernité.\n\n## Une tutelle dont on est responsable\n\nL'état de tutelle, ou de minorité, est une notion juridique : l'état de celui qui ne peut agir sans tuteur. Ce n'est pas une affaire d'âge. Kant parle d'adultes que la nature a depuis longtemps affranchis de toute direction étrangère et qui restent pourtant mineurs leur vie durant.\n\nEt il précise : cette minorité est fautive lorsque sa cause n'est pas un manque d'entendement, mais un manque de décision et de courage pour s'en servir sans la direction d'un autre. D'où la devise reprise au poète latin Horace : *Sapere aude*, ose savoir, ose te servir de ton propre entendement.\n\n## Pourquoi on reste mineur\n\nKant donne deux causes, sans complaisance : la paresse et la lâcheté. Et il ajoute une phrase d'une ironie cinglante : il est si commode d'être mineur. Si j'ai un livre qui me tient lieu d'entendement, un directeur qui me tient lieu de conscience, un médecin qui juge de mon régime à ma place, je n'ai pas besoin de me fatiguer moi-même. Je n'ai pas besoin de penser, pourvu que je puisse payer.\n\n> **Exemple, version contemporaine.** J'ai une application qui me dit quoi manger et combien de pas faire, un fil d'actualité qui choisit ce que je dois lire, un comparateur qui décide de mes achats, un influenceur dont je reprends les opinions. Rien de tout cela n'est mauvais en soi : on ne peut pas tout vérifier soi-même. Mais si je ne sais plus former un jugement sans eux, je suis exactement dans la situation que Kant décrit, et je l'ai choisie parce qu'elle est confortable.\n\nLes tuteurs, de leur côté, ont tout intérêt à entretenir cette situation. L'image de Kant est brutale : après avoir abêti leur bétail domestique et soigneusement empêché ces créatures paisibles d'oser faire un pas hors du parc où ils les ont enfermées, ils leur montrent le danger qui les menace si elles essaient de marcher seules. Le danger n'est pas si grand, remarque Kant : après quelques chutes, on finit par apprendre à marcher. Mais l'exemple d'une chute suffit à intimider.\n\n> **Exemple.** Un enfant qu'on a toujours accompagné partout, et à qui l'on répète que la rue est dangereuse, aura peur de prendre seul le bus à quatorze ans. Ce n'est pas qu'il en soit incapable. C'est qu'on lui a appris à craindre l'essai plus que l'échec. Kant applique ce schéma à des peuples entiers.\n\n## Le public plutôt que l'individu\n\nKant est pessimiste sur l'émancipation solitaire. Il est difficile pour chaque individu de se dégager de la minorité devenue presque une seconde nature ; il a fini par l'aimer. Il est plus probable, en revanche, qu'un public s'éclaire lui-même, pourvu qu'on lui laisse la liberté.\n\nMais quelle liberté ? La plus inoffensive de toutes : celle de faire un usage *public* de sa raison en toutes choses.\n\nKant distingue alors deux usages de la raison, avec un vocabulaire qui surprend.\n\n- L'**usage public** est celui que l'on fait comme savant, devant le public qui lit. Il doit être entièrement libre.\n- L'**usage privé** est celui qu'on fait dans une fonction civile ou un poste qui nous est confié. Il peut être restreint.\n\n> **Exemple, celui de Kant.** Un officier qui reçoit un ordre ne doit pas se mettre à raisonner sur son bien-fondé en service : il doit obéir. Mais on ne peut pas lui interdire, comme savant, de publier ses remarques sur les fautes du service militaire. De même, le citoyen doit payer l'impôt ; il peut ensuite écrire publiquement que cet impôt est injuste. Et le pasteur doit enseigner le symbole de son Église à ses fidèles ; comme savant, il a pleine liberté d'en discuter les défauts devant le public.\n\n> **Exemple, transposé.** Une infirmière applique le protocole de son service pendant sa garde. Elle n'a pas à le réinventer au chevet du patient. Mais elle a le droit, et pour Kant le devoir, de publier dans une revue professionnelle une critique argumentée de ce protocole. C'est par ces critiques publiques que les protocoles s'améliorent.\n\n## Ce que le texte laisse ouvert\n\nLe texte rend hommage au roi de Prusse, Frédéric II, et lui attribue une formule : raisonnez autant que vous voudrez et sur tout ce que vous voudrez, mais obéissez. Les lecteurs n'ont cessé de s'y heurter. Est-ce un compromis tactique, sous un régime de censure ? Ou une conviction réelle que la liberté de critiquer suffit, à terme, à transformer les institutions ?\n\nMichel Foucault a consacré en 1984 un texte à cet opuscule, sous le même titre, pour y lire l'invention d'un rapport critique au présent.\n\nUne autre question reste en suspens. Que le courage soit requis suppose qu'il y ait, en nous, quelque chose qui préfère la tutelle. Kant le nomme paresse ou lâcheté, et le traite comme un défaut de caractère. On pourrait se demander si le désir d'être dirigé n'a pas des racines plus profondes, et plus tenaces, qu'une simple mollesse.","quiz":[{"question":"Qu'est-ce qui rend la minorité « fautive » selon Kant ?","choix":["Un défaut naturel d'intelligence chez la plupart des hommes","Un manque de décision et de courage, et non d'entendement","L'absence d'écoles publiques dans le royaume de Prusse","Le refus d'obéir aux autorités légitimes de l'État"],"bonne":1,"explication":"La minorité est imputable quand sa cause n'est pas un manque d'entendement mais de courage. Kant écarte expressément le manque d'intelligence ; il ne parle pas ici d'institutions scolaires, et l'obéissance n'est pas le problème : il la maintient même dans l'usage privé."},{"question":"Comment Kant distingue-t-il usage public et usage privé de la raison ?","choix":["Public : en famille ; privé : dans le secret de la conscience","Public : réservé aux princes ; privé : accessible à tous","Public : comme savant devant le public qui lit ; privé : dans une fonction","Public : dans les assemblées ; privé : dans les affaires commerciales"],"bonne":2,"explication":"Le paradoxe est voulu : l'usage « privé » est celui qu'on fait dans un poste confié, où l'on peut devoir obéir ; l'usage « public » est celui du savant qui s'adresse à tous, et il doit être libre. Les autres répartitions ne correspondent pas au texte."},{"question":"Quelles causes Kant donne-t-il au maintien dans la minorité ?","choix":["La paresse et la lâcheté","L'ignorance et la pauvreté","La religion et la superstition","L'éducation et la tradition"],"bonne":0,"explication":"Kant nomme sans détour la paresse et la lâcheté, entretenues par des tuteurs qui ont intérêt à la tutelle. Il ne réduit pas le problème à l'ignorance ou à la pauvreté, et la religion n'est qu'un des domaines où s'exerce la tutelle."},{"question":"Que peut faire l'officier de l'exemple de Kant ?","choix":["Refuser un ordre qu'il juge mauvais, au nom de sa raison","Rien : il doit se taire en toutes circonstances","Obéir en service, puis critiquer publiquement le service comme savant","Demander au roi de changer l'ordre avant de l'exécuter"],"bonne":2,"explication":"En service, il obéit : c'est l'usage privé. Comme savant, il peut publier ses remarques sur les fautes du service militaire : c'est l'usage public. Kant n'autorise pas le refus d'obéir, mais il n'impose pas non plus le silence."}],"sources":[{"texte":"Kant, Qu'est-ce que les Lumières ? (1784), traduction française (PDF, lycée Descartes de Rabat)","url":"https://lycee-descartes.ac.ma/medias/rentree2021/Kant_Quest-ce-que-les-Lumieres-1784.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Enlightenment »","url":"https://plato.stanford.edu/entries/enlightenment/"},{"texte":"Stanford Encyclopedia of Philosophy, « Kant's Social and Political Philosophy »","url":"https://plato.stanford.edu/entries/kant-social-political/"}]},{"id":"ferenczi-confusion","discipline":"psychanalyse","titre":"La confusion de langue","figure":"Sándor Ferenczi","reference":"Confusion de langue entre les adultes et l'enfant (congrès de Wiesbaden, septembre 1932 ; publié en 1933)","accroche":"En 1932, Ferenczi lit à Wiesbaden un texte que Freud lui avait demandé de ne pas présenter. Il y soutient que l'enfant et l'adulte qui abuse de lui ne parlent pas la même langue.","punch":"L'enfant demande de la tendresse. L'adulte répond dans la langue de la passion.","idee":"L'enfant vit dans le registre de la tendresse ; l'adulte qui abuse de lui répond sur celui de la passion. Pour survivre, l'enfant se soumet et s'identifie à l'agresseur, et il peut prendre sur lui la culpabilité de l'adulte. Le silence ou le déni des adultes aggrave le trauma.","repere":"Le titre complet est « Confusion de langue entre les adultes et l'enfant — le langage de la tendresse et de la passion ». La communication portait à l'origine un autre titre : « Les passions des adultes et leur influence sur le développement du caractère et de la sexualité de l'enfant ». Le titre anglais « Confusion of Tongues » a été choisi par Michael Balint pour la traduction de 1949.","liens":["freud-apres-coup","wittgenstein-taire","freud-transfert"],"texte":"Sándor Ferenczi présente sa communication au douzième Congrès international de psychanalyse, à Wiesbaden, en septembre 1932 (Wikipédia donne la date du 4 septembre). L'épisode est resté fameux. Selon un article de Evzonas, Freud, perturbé par la conception du trauma de Ferenczi, lui avait demandé de
