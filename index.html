 à tous. Seul celui qui sait la géométrie peut le lire[^5].\n\n> **Illustration (pas un exemple de Galilée).** Deux personnes regardent une balle lancée en l'air. L'une voit un mouvement qui monte puis redescend. L'autre voit une parabole, et peut prédire où la balle tombera. Le spectacle est le même. Ce qui diffère, c'est la langue dans laquelle on le lit. Galilée soutient que seule la seconde lecture atteint la nature elle-même.\n\nUn mot sur une citation qui circule partout : « Les mathématiques sont la langue dans laquelle Dieu a écrit l'univers. » Elle n'est pas de Galilée sous cette forme. C'est une paraphrase tardive de ce passage, dont la plus ancienne version retrouvée par Michael Molinsky figure dans un court métrage de Disney de 1959, *Donald au pays des mathémagiques*[^2].\n\n## Ce qui est dans les choses, et ce qui est en nous\n\nLa même page a une conséquence que Galilée tire un peu plus loin dans le livre. Si la nature est écrite en figures, alors certaines propriétés appartiennent vraiment aux corps, et d'autres non. La figure, la position, le mouvement, le nombre sont inséparables de l'idée même d'un corps. Les couleurs, les saveurs et les odeurs, au contraire, relèvent de nos sens[^1]. Elles ne sont, dit-il, que de simples noms par rapport aux objets où nous les plaçons, et elles résident seulement dans la conscience[^4]. La chaleur elle-même n'est pas une qualité réelle de la matière qui nous chauffe[^1].\n\nOn tient ce passage pour le premier argument clair en faveur de la distinction entre qualités « premières » et « secondes »[^1].\n\n> **Illustration (un parallèle avec la clinique).** Deux patients décrivent le même bureau : l'un le trouve chaleureux, l'autre étouffant. La pièce n'a pas changé. Galilée dirait que la « chaleur » de la pièce n'est pas dans les murs mais dans celui qui la sent. L'écoute part de là : ce qu'un patient dit d'un lieu ou d'une personne renseigne souvent davantage sur lui que sur l'objet.\n\n## Deux livres, deux lectures\n\nGalilée ne renonce pas pour autant à l'autre livre, l'Écriture. Dans ses lettres de 1615, à Castelli et à Christine de Lorraine, il soutient qu'il existe deux vérités, l'une tirée de l'Écriture, l'autre du monde créé ; toutes deux viennent de Dieu, elles ne peuvent se contredire, mais toutes deux doivent être interprétées[^1]. L'Écriture, écrit-il, s'adapte à ses lecteurs ; la nature, elle, ne s'adapte à personne[^6]. Et il reprend une formule qu'il attribue au cardinal Baronius : l'intention de l'Esprit saint est de nous enseigner comment on va au ciel, et non comment va le ciel[^6].\n\nBellarmin, au contraire, exige qu'on garde le sens littéral de l'Écriture tant que la théorie de Copernic n'a pas été démontrée[^1]. Le conflit qui suit n'oppose pas la foi et la raison en bloc : il porte sur qui a le droit d'interpréter, et quel livre.","quiz":[{"question":"Dans quelle langue, selon Galilée, le livre de la nature est-il écrit ?","choix":["En latin, la langue savante de l'Église et des universités","En langue mathématique, dont les caractères sont des figures géométriques","En symboles religieux, que seuls les théologiens savent déchiffrer","Dans la langue des sens, que chacun comprend sans apprentissage"],"bonne":1,"explication":"« Il est écrit dans une langue mathématique, et les caractères en sont les triangles, les cercles », et d'autres figures géométriques. Sans elle, on erre dans un labyrinthe obscur."},{"question":"Que dit Galilée des couleurs, des saveurs et des odeurs ?","choix":["Qu'elles sont les propriétés les plus réelles des corps","Qu'elles se mesurent aussi précisément que le mouvement","Qu'elles résident dans la conscience et non dans les objets","Qu'elles sont des illusions envoyées par le démon"],"bonne":2,"explication":"Figure, position, mouvement et nombre appartiennent aux corps ; couleurs, saveurs et odeurs ne sont que « de simples noms » et résident dans la conscience."},{"question":"Un élève lit dans un manuel : « Galilée a dit que les mathématiques sont la langue de Dieu. » Que faut-il lui répondre ?","choix":["Que la phrase est exacte et figure telle quelle dans L'Essayeur","Que c'est une paraphrase tardive d'un passage de L'Essayeur","Que Galilée n'a jamais parlé des mathématiques dans ses livres","Que la phrase vient de Copernic et non de Galilée"],"bonne":1,"explication":"Le passage authentique parle du « grand livre » de l'univers écrit en langue mathématique ; la formule sur Dieu est une paraphrase, dont la plus ancienne version connue date de 1959."},{"question":"Quelle position Galilée défend-il dans la Lettre à Christine de Lorraine ?","choix":["Que la science doit se soumettre au sens littéral de la Bible","Que la Bible est fausse et doit être abandonnée par les savants","Que l'Écriture enseigne comment aller au ciel, non comment va le ciel","Que seul le pape peut décider des questions d'astronomie"],"bonne":2,"explication":"Les deux livres viennent de Dieu et ne peuvent se contredire, mais l'Écriture s'adapte à ses lecteurs : elle enseigne le salut, non l'astronomie."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Galileo Galilei » (§ 2 biographie, § 4.1 livre de la nature, § 4.4 qualités, § 5 science et religion)","url":"https://plato.stanford.edu/entries/galileo/"},{"texte":"Michael Molinsky, « Quotations in Context: Galileo », Convergence, Mathematical Association of America, 2014 (original italien, traduction de Drake, citation apocryphe)","url":"https://old.maa.org/press/periodicals/convergence/quotations-in-context-galileo-2"},{"texte":"Eduscol, document de ressources (extrait de L'Essayeur en italien et en français)","url":"https://eduscol.education.fr/document/18616/download"},{"texte":"Wikipédia (anglais), « The Assayer » (publication, dédicace, querelle avec Grassi, comètes, qualités)","url":"https://en.wikipedia.org/wiki/The_Assayer"},{"texte":"Inters.org, « The Metaphor of the Book of Nature » (Pères de l'Église, lecture réservée aux géomètres)","url":"https://inters.org/node/1664"},{"texte":"Wikipédia (anglais), « Letter to the Grand Duchess Christina » (1615, accommodation, Baronius)","url":"https://en.wikipedia.org/wiki/Letter_to_the_Grand_Duchess_Christina"}]},{"id":"hegel-le-vrai-est-le-tout","discipline":"philosophie","titre":"Le vrai est le tout","figure":"Hegel","branche":"fondamentaux","fiabilite":"mixte","fiabilite_note":"La préface de la Phénoménologie de l'esprit a été lue dans la traduction anglaise de J. B. Baillie (1910), en ligne ; les citations sont retraduites ici depuis l'anglais. Le contexte vient de Wikipédia. Le thème a été repéré grâce au cours de Patrick Wotling (master, URCA).","reference":"Phénoménologie de l'esprit (1807), Préface, §§ 1-2, 16-20, 32, 42-45","accroche":"Le bouton disparaît quand la fleur éclôt, et la fleur quand vient le fruit. Faut-il dire que chacun réfute le précédent ? Hegel répond que non, et en tire une nouvelle idée de la vérité.","punch":"La fleur ne réfute pas le bouton. Elle le continue.","idee":"Dans la préface de la Phénoménologie de l'esprit, Hegel refuse de juger les philosophies comme vraies ou fausses une à une. La vérité n'est pas une proposition isolée mais un tout qui se développe, un résultat. Elle exige de séjourner auprès du négatif plutôt que de le fuir.","citation":"The truth is the whole.","citation_source":"Hegel, Phénoménologie de l'esprit (1807), Préface, § 20, trad. anglaise J. B. Baillie (1910) — « Le vrai est le tout »","citation_url":"https://marxists.architexturez.net/reference/archive/hegel/works/ph/phprefac.htm","liens":["hegel-maitre-esclave","hegel-kojeve-lacan","freud-deuil-melancolie"],"texte":"La *Phénoménologie de l'esprit* paraît en 1807, à Bamberg et à Wurtzbourg[^2]. Hegel l'a écrite à Iéna, où il enseignait depuis six ans ; il en achève le corps la nuit qui précède la bataille d'Iéna, en octobre 1806, et le manuscrit est envoyé à l'éditeur à travers les lignes françaises[^2].\n\nLe livre s'ouvre sur une longue préface, devenue l'un des textes les plus commentés de la philosophie. Elle commence par un paradoxe : une préface, où l'auteur expose son but et sa position par rapport aux autres, semble non seulement superflue, mais même inappropriée à la nature de la philosophie[^1]. Car la vérité philosophique ne se résume pas en quelques thèses qu'on pourrait annoncer d'avance.\n\n## Le bouton, la fleur, le fruit\n\nOn a l'habitude, dit Hegel, de juger les systèmes philosophiques comme on juge des propositions : l'un est vrai, l'autre est faux, et chaque nouveau système contredit le précédent. Il propose une autre image.\n\nLe bouton disparaît quand la fleur éclôt, et l'on pourrait dire que la fleur le réfute. De même, le fruit fait apparaître la fleur comme une fausse forme d'existence de la plante[^1]. Ces formes se chassent l'une l'autre. Et pourtant, elles sont les moments d'une unité organique où elles ne se contredisent pas : l'une est aussi nécessaire que l'autre, et cette égale nécessité de tous les moments constitue seule la vie du tout[^1].\n\n> **Illustration (pas un exemple de Hegel).** Un adolescent rejette tout ce que ses parents lui ont appris ; jeune adulte, il rejette ses révoltes d'adolescent ; plus tard, il reconnaît dans sa manière d'élever ses enfants quelque chose de ses parents et quelque chose de sa révolte. Aucune étape n'était simplement fausse. Chacune a rendu la suivante possible, et l'homme qu'il est devenu les contient toutes.\n\n## Le vrai est le tout\n\nD'où la formule la plus célèbre de la préface : le vrai est le tout[^1]. Le tout n'est pas une somme qu'on aurait sous les yeux d'un coup. C'est l'essence qui s'achève à travers le processus de son propre développement[^1]. De l'absolu, il faut dire qu'il est essentiellement un *résultat*[^1].\n\nUne proposition isolée, même exacte, n'est donc pas encore la vérité. Elle en est un moment. La vérité est le chemin entier, avec ses étapes, ses erreurs et ses dépassements.\n\nHegel ajoute une exigence qui donnera son orientation à tout le livre : tout dépend du fait de saisir et d'exprimer le vrai non seulement comme *substance*, mais aussi comme *sujet*[^1]. Le vrai n'est pas une chose immobile qu'on contemplerait ; il est mouvement, activité, retour à soi à travers l'autre.\n\n## La nuit où toutes les vaches sont noires\n\nLa préface est aussi une polémique. Hegel vise une philosophie de l'absolu qui pose une identité abstraite, A = A, où tout est un, et qui donne son absolu pour la nuit où, comme on dit, toutes les vaches sont noires[^1]. On y reconnaît Schelling, dont Hegel traite la philosophie de formalisme monochrome[^2].\n\nLe reproche est clair : un absolu où toutes les différences s'effacent n'explique rien. Penser, ce n'est pas tout dissoudre dans l'unité, c'est montrer comment l'unité se fait à travers les différences.\n\n## Séjourner auprès du négatif\n\nCe chemin a un prix. Hegel parle du sérieux, de la souffrance, de la patience et du travail du négatif[^1] : la vérité ne se gagne pas sans eux.\n\nHegel va plus loin. La mort, si l'on appelle ainsi cette négativité, est la chose la plus terrible. Mais la vie de l'esprit n'est pas celle qui fuit la mort[^1]. L'esprit n'a cette puissance qu'en regardant le négatif en face et en séjournant auprès de lui[^1].\n\n> **Illustration (un parallèle avec la clinique).** Après une perte, une patiente voudrait « tourner la page » au plus vite : elle se remet au travail, évite d'en parler. Des mois plus tard, la tristesse revient de partout. Le travail du deuil, au sens de Freud, ressemble à ce que Hegel appelle séjourner auprès du négatif : non pas s'y complaire, mais ne pas fuir, pour que la perte devienne une partie de l'histoire au lieu d'une plaie qui la coupe.\n\n## Contre la méthode mathématique\n\nLa préface critique enfin le modèle mathématique de la vérité, que la philosophie classique avait admiré. Dans une démonstration de géométrie, la nécessité ne vient pas de la nature du théorème : elle lui est imposée du dehors[^1]. La construction semble arbitraire jusqu'à ce que la preuve soit trouvée, et la figure étudiée est découpée puis recomposée. Surtout, le principe de la mathématique est la quantité[^1] : elle ne saisit qu'un espace sans vie, et ne peut rendre compte d'une chose qui se meut elle-même.\n\nLa philosophie, pour Hegel, doit donc inventer une autre forme de preuve, où le contenu se développe de lui-même au lieu d'être conduit par un raisonnement extérieur.\n\n## Une postérité française\n\nLa *Phénoménologie* est traduite en français par Jean Hyppolite en 1939-1941[^2]. Dans les années 1930, les cours d'Alexandre Kojève à Paris, suivis par Sartre, Merleau-Ponty, Bataille et Lacan, en ont fait une référence majeure de la pensée française du XXe siècle, jusque dans la psychanalyse[^2].","quiz":[{"question":"Que montre l'image du bouton, de la fleur et du fruit ?","choix":["Que chaque étape réfute définitivement la précédente","Que les moments successifs sont tous nécessaires à la vie du tout","Que seule la dernière étape possède une véritable valeur","Que la nature ne connaît ni développement ni changement"],"bonne":1,"explication":"Les formes se chassent l'une l'autre, mais elles sont les moments d'une unité organique : « cette égale nécessité de tous les moments constitue la vie du tout »."},{"question":"Que signifie « le vrai est le tout » ?","choix":["Que toutes les opinions se valent et sont également vraies","Que la vérité tient en une seule proposition définitive","Que la vérité est un résultat, qui s'achève par son développement","Que seule une encyclopédie complète peut contenir la vérité"],"bonne":2,"explication":"Le tout est l'essence qui s'achève à travers son propre développement ; de l'absolu, il faut dire qu'il est essentiellement un résultat."},{"question":"Un ami se reproche d'avoir « perdu dix ans » dans une voie professionnelle qu'il a fini par quitter. Quelle lecture hégélienne pourrait-on lui proposer ?","choix":["Ces années étaient une simple erreur, qu'il vaut mieux oublier","Il aurait dû savoir dès le départ quelle était la bonne voie","Cette étape a pu être un moment nécessaire de ce qu'il est devenu","Seul compte le moment présent, sans rapport avec le passé"],"bonne":2,"explication":"Comme la fleur pour le fruit, une étape dépassée n'est pas simplement fausse : elle est un moment du tout, et le résultat la contient."},{"question":"Que reproche Hegel à l'absolu conçu comme « la nuit où toutes les vaches sont noires » ?","choix":["D'être trop compliqué pour être compris par le public","D'effacer toutes les différences dans une identité abstraite","De reposer entièrement sur l'expérience des sens","De nier l'existence de Dieu et de l'esprit"],"bonne":1,"explication":"Une identité abstraite, A = A, où « tout est un », n'explique rien. Hegel y voit un formalisme monochrome, visant Schelling."}],"sources":[{"texte":"Hegel, The Phenomenology of Mind, Préface, trad. J. B. Baillie (1910), Hegel-by-HyperText","url":"https://marxists.architexturez.net/reference/archive/hegel/works/ph/phprefac.htm"},{"texte":"Wikipédia (anglais), « The Phenomenology of Spirit » (publication, Iéna, Schelling, traduction de Hyppolite, Kojève)","url":"https://en.wikipedia.org/wiki/The_Phenomenology_of_Spirit"}]},{"id":"austin-quand-dire-c-est-faire","discipline":"philosophie","titre":"Dire, c'est faire","figure":"John L. Austin","branche":"langage","fiabilite":"secondaire","fiabilite_note":"Austin est présenté à travers l'Encyclopédie de Stanford et Wikipédia, qui citent How to Do Things with Words avec ses pages ; le livre lui-même n'a pas été consulté. Les exemples « I bet » et « I promise » ne sont pas attribués à Austin sous une forme précise, faute de l'avoir vérifiée.","reference":"How to Do Things with Words (1962) — Quand dire, c'est faire ; conférences William James, Harvard, 1955","accroche":"Dire « oui » devant un maire ne décrit rien : cela marie. Austin part de ces phrases qui font quelque chose pour rebâtir la théorie du sens.","punch":"Certaines phrases ne décrivent pas le monde. Elles y changent quelque chose.","idee":"Austin remarque que certains énoncés (« je le jure », « oui », « je baptise ce navire ») accomplissent un acte au lieu de décrire. On les juge non pas vrais ou faux, mais réussis ou ratés. Il en tire une théorie : tout énoncé est à la fois dit, fait et produit des effets.","repere":"Le livre reprend les conférences William James données par Austin à Harvard en 1955. Austin meurt en 1960 ; l'ouvrage est publié en 1962 par J. O. Urmson d'après ses notes, et réédité en 1975 par Urmson et Marina Sbisà. Son titre français est Quand dire, c'est faire.","liens":["wittgenstein-taire","ricoeur-soupcon","hegel-maitre-esclave"],"texte":"En 1955, à Harvard, John Langshaw Austin donne les conférences William James. Il meurt en 1960, avant d'avoir publié le livre qu'il en aurait tiré. *How to Do Things with Words* paraît en 1962, édité par J. O. Urmson d'après ses notes, chez Clarendon Press et Harvard University Press ; une seconde édition, revue par Urmson et Marina Sbisà, date de 1975[^2]. On le tient pour le texte fondateur de la théorie des actes de langage[^2]. En français, il s'intitule *Quand dire, c'est faire*[^3].\n\n## Des phrases qui ne décrivent pas\n\nL'idée de départ est simple. On croit souvent qu'une phrase sert à décrire un état de choses, et qu'elle est alors vraie ou fausse. Austin remarque que ce n'est pas le cas de toutes. Certains énoncés ne sont pas des descriptions : ils n'ont pas de valeur de vérité, ou leur énonciation n'est pas une assertion (1962, p. 6)[^1].\n\nLes exemples de référence sont « I name this ship the Queen Elizabeth », prononcé lors d'un baptême, et « I do », le « oui » d'un mariage[^2]. Dans ces cas, dire la formule constitue l'acte lui-même. Austin appelle ces énoncés des *performatifs*, par opposition aux *constatifs*, qui décrivent un fait. Leur forme type est une phrase à la première personne, au présent, à l'indicatif, à la voix active, qui présente son locuteur comme accomplissant un acte, comme « je promets… »[^1].\n\n> **Illustration (pas un exemple d'Austin).** Quelqu'un dit à un ami : « Je te promets de venir samedi. » On ne peut pas répondre « c'est faux » comme on répondrait à « il pleut ». On peut répondre « tu me le promets vraiment ? » ou, plus tard, « tu n'as pas tenu ta promesse ». Dire la phrase, c'est déjà s'engager.\n\n## Réussir ou rater plutôt que vrai ou faux\n\nUn performatif ne se juge donc pas comme vrai ou faux, mais comme réussi ou raté. Austin parle de conditions de félicité : il doit exister, écrit-il, « une procédure conventionnelle acceptée » (*an accepted conventional procedure*, 1962, p. 14), qui implique que certaines personnes disent certains mots dans certaines circonstances[^1].\n\nLes échecs sont de deux sortes. Dans les ratés (*misfires*), l'acte ne se réalise pas : un passant qui baptise un navire devant la reine, en disant « je baptise ce navire *Noam Chomsky* », n'a pas l'autorité nécessaire, et aucun acte n'est accompli. Dans les abus, l'acte est accompli mais sans la sincérité requise : une promesse de déjeuner faite sans aucune intention de la tenir est bien une promesse, mais elle est insincère[^1]. Ces deux exemples sont ceux d'un commentateur, non d'Austin. Il faut enfin que l'acte soit reçu (*uptake*) : on ne peut pas parier avec quelqu'un qui n'accepte pas le pari[^1].\n\n## Trois niveaux dans chaque énoncé\n\nAustin va plus loin. Il abandonne l'opposition simple entre constatifs et performatifs : même les assertions ordinaires partagent des traits des performatifs, comme les conditions de félicité et les engagements, si bien qu'une frontière nette devient difficile à tenir[^2]. Il propose un nouveau départ : s'intéresser à ce qu'on fait en prononçant n'importe quelle phrase.\n\nIl distingue alors trois niveaux. L'acte *locutoire* est la production d'une expression qui a un sens. L'acte *illocutoire* est ce qu'on fait en parlant : avertir, promettre, ordonner, prédire. L'acte *perlocutoire* est l'effet obtenu sur l'auditeur : persuader, effrayer, amuser[^2].\n\nLa phrase « Tu seras plus ponctuel à l'avenir » peut, selon le contexte, être une prédiction, un ordre ou une menace : le même contenu, des forces différentes[^1]. De même, exhorter quelqu'un est une illocution, alors que le persuader est une perlocution, car persuader dépend de l'effet produit[^1].\n\n> **Illustration.** Une enseignante dit à sa classe : « La porte est ouverte. » Le contenu est le même, mais l'acte change selon la situation : un simple constat si un élève demande pourquoi il fait froid, un ordre de la fermer si elle regarde un élève près de la porte. Si l'élève se lève et ferme la porte, l'effet obtenu est l'acte perlocutoire.\n\n## Une première classification\n\nAustin propose aussi une première classification des verbes illocutoires en cinq familles : les verdictifs, les exercitifs, les promissifs, les comportatifs et les expositifs[^1][^2]. John Searle a critiqué cette classification, qu'il juge trop fondée sur le vocabulaire et mal délimitée[^1].\n\n## Pourquoi c'est important\n\nCette approche déplace la question du sens. Plutôt que de demander seulement ce qu'une phrase décrit, on demande ce qu'on fait en la disant, dans quelle situation, et avec quelle autorité. Elle ouvre aux actes de langage une étude qui ne dépend pas de la vérité : on peut promettre, ordonner ou baptiser, et l'on peut échouer sans dire faux.\n\n> **Illustration (un parallèle avec la clinique).** Un patient dit en fin de séance : « De toute façon, je ne reviendrai pas. » On peut se demander si c'est vrai. On peut aussi se demander ce que la phrase fait : une menace, une demande d'être retenu, un test. La question d'Austin, « que fait-on en disant cela ? », est aussi une question d'écoute.","quiz":[{"question":"Que dit Austin des énoncés performatifs ?","choix":["Ils accomplissent un acte et se jugent comme réussis ou ratés, non comme vrais ou faux","Ils décrivent un fait et sont toujours vrais lorsqu'ils sont sincères","Ils sont toujours faux, parce qu'ils n'ont aucun rapport avec le réel","Ils sont réservés aux juges, aux maires et aux autres autorités publiques"],"bonne":0,"explication":"Austin nie que les performatifs soient des descriptions : ils n'ont pas de valeur de vérité ou ne sont pas des assertions. On les évalue selon des conditions de félicité."},{"question":"Un étudiant déclare en plein amphithéâtre : « Je déclare la séance levée. » Personne ne bouge. Pourquoi l'acte échoue-t-il ?","choix":["Parce que la phrase est fausse : la séance n'est pas levée","Parce que l'étudiant était insincère en la prononçant","Parce qu'il n'a pas l'autorité requise par la procédure : c'est un raté","Parce que la phrase n'est pas à la première personne du présent"],"bonne":2,"explication":"Comme le passant qui baptise un navire sans autorité, l'étudiant ne remplit pas une condition de la procédure conventionnelle : l'acte ne se réalise pas. Il ne s'agit ni de fausseté ni d'insincérité, et la forme est bien celle d'un performatif."},{"question":"Quelle est la différence entre acte illocutoire et acte perlocutoire ?","choix":["L'illocutoire est écrit, et le perlocutoire est seulement oral","L'illocutoire est toujours sincère, et le perlocutoire toujours mensonger","L'illocutoire désigne le contenu, et le perlocutoire le volume de la voix","L'illocutoire est ce qu'on fait en parlant ; le perlocutoire, l'effet obtenu"],"bonne":3,"explication":"Promettre, ordonner ou avertir sont des illocutions ; persuader, effrayer ou amuser sont des perlocutions, qui dépendent de l'effet sur l'auditeur."},{"question":"Pourquoi Austin finit-il par abandonner l'opposition simple entre constatifs et performatifs ?","choix":["Parce que les performatifs se révèlent tous faux à l'examen","Parce que même les assertions ordinaires ont des conditions de félicité","Parce que Searle lui a démontré qu'elle était contradictoire","Parce que les constatifs n'existent que dans les langues mortes"],"bonne":1,"explication":"Même une affirmation engage et peut réussir ou rater : la frontière devient difficile à tenir, d'où la théorie générale des actes de langage."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Speech Acts » (performatifs, ratés et abus, locutoire, illocutoire, perlocutoire, pages citées d'Austin)","url":"https://plato.stanford.edu/entries/speech-acts/"},{"texte":"Wikipédia (anglais), « How to Do Things with Words » (conférences de 1955, publication de 1962, exemples d'Austin, abandon de la distinction simple)","url":"https://en.wikipedia.org/wiki/How_to_Do_Things_with_Words"},{"texte":"Notice de catalogue de l'édition française, « Quand dire, c'est faire » (titre français)","url":"https://theses.univ-nantes.fr/vufind/Record/PPN002168065"}]},{"id":"benjamin-ange-de-l-histoire","discipline":"philosophie","titre":"L'ange de l'histoire","figure":"Walter Benjamin","branche":"histoire","fiabilite":"secondaire","fiabilite_note":"Les citations françaises viennent de la version de Benjamin lui-même, telle que la cite un article de Fabula ; les citations anglaises, d'une page qui n'indique pas son traducteur. Le texte intégral n'a pas été consulté, et l'histoire du tableau (sa possession par Benjamin) n'est pas reprise faute de source.","reference":"« Sur le concept d'histoire » (Über den Begriff der Geschichte, 1940), thèse IX","accroche":"Une tempête pousse un ange vers l'avenir pendant qu'il regarde les ruines derrière lui. Benjamin dit que cette tempête s'appelle le progrès.","punch":"Là où nous voyons une chaîne d'événements, l'ange voit une seule catastrophe.","idee":"Dans sa thèse IX, Benjamin lit un tableau de Klee comme une image de l'histoire : un ange, le visage tourné vers le passé, voit s'accumuler des ruines, tandis qu'une tempête qu'il appelle « Progrès » l'emporte vers l'avenir sans qu'il puisse s'arrêter.","citation":"Nous donnons nom de Progrès à cette tempête","citation_source":"Benjamin, thèse IX, dans sa propre version française (Écrits français, Gallimard, 1991, p. 343-344), citée par Muriel Pic, Fabula, 2017","citation_url":"https://www.fabula.org/colloques/document4666.php","liens":["kant-lumieres","hegel-maitre-esclave","freud-apres-coup"],"texte":"Walter Benjamin écrit « Sur le concept d'histoire » au début de 1940 : c'est son dernier grand texte achevé avant sa tentative de fuite hors de la France de Vichy. Il meurt le 26 septembre 1940, en Espagne[^3]. Le texte est composé de vingt paragraphes numérotés, les « thèses ». Il n'a pas été publié de son vivant : sa première diffusion date du printemps 1942, dans une brochure ronéotypée, *Walter Benjamin zum Gedächtnis*. La traduction française de Pierre Missac paraît dans *Les Temps Modernes* en 1947, et la traduction anglaise de Harry Zohn dans *Illuminations*, en 1968[^3].\n\nLa thèse IX est la plus célèbre. Elle tient en un paragraphe, et c'est une image.\n\n## Le tableau\n\nElle commence par un tableau : « Il y a un tableau de Klee dénommé *Angelus Novus*. » L'œuvre de Paul Klee, une monotypie, est datée de 1920[^3].\n\nBenjamin y voit l'ange de l'histoire. Les citations qui suivent sont celles de sa propre version française, publiée dans ses *Écrits français*[^1] : « Son visage est tourné vers le passé. » Là où nous apparaît une chaîne d'événements, l'ange voit « une catastrophe sans modulation ni trêve, amoncelant les décombres ». La version anglaise dit : « Where we see the appearance of a chain of events, he sees one single catastrophe »[^2].\n\nMais, écrit Benjamin, « une tempête s'est levée, venant du Paradis », et « cette tempête l'emporte vers l'avenir ». Puis vient la phrase qui nomme la tempête : « Nous donnons nom de Progrès à cette tempête »[^1].\n\nCes phrases françaises ne sont pas une traduction après coup : Benjamin avait lui-même rédigé une version française de ses thèses, publiée dans ses *Écrits français* (Gallimard, 1991). La version allemande est traduite dans le troisième volume de ses *Œuvres* (Gallimard, 2000), par Maurice de Gandillac, Pierre Rusch et Rainer Rochlitz[^1]. La thèse IX existe donc en deux langues de la main de son auteur.\n\n## Ce que l'image dit\n\nL'image oppose deux regards sur le temps. Pour le regard ordinaire, l'histoire est une suite d'événements qui s'enchaînent, et le présent est ce qui vient après et améliore. Pour l'ange, le même temps est une accumulation de ruines. L'ange regarde en arrière, et c'est ce qu'il voit qui le définit. Mais il est entraîné en sens inverse, le dos tourné à l'avenir[^3].\n\nOn peut en tirer une lecture, qui est une lecture et non une preuve : le progrès, tel qu'on le vit, avance en laissant derrière lui ce qu'il a détruit. L'image ne dit pas que rien n'a jamais avancé. Elle dit que le récit du progrès oublie ce qu'il laisse sur le bas-côté.\n\n> **Illustration (pas un exemple de Benjamin).** Un guide présente une ville comme une réussite : nouvelles usines, nouveaux quartiers, population doublée. Il montre la hauteur des bâtiments, la rapidité des chantiers. L'ange de Benjamin regarderait la même ville et verrait ce qui a été rasé, déplacé, perdu pour y arriver. Aucun des deux regards n'est faux, mais le premier n'en montre qu'un côté.\n\n## La thèse V, en regard\n\nLa thèse V parle du passé comme d'une image qui ne se laisse saisir qu'au moment où elle apparaît : « The true picture of the past whizzes by »[^2], la vraie image du passé passe en un éclair. Le passé n'est pas un stock disponible. Il est fragile, et il peut disparaître avec chaque présent qui ne s'y reconnaît pas. Les deux thèses se répondent : l'ange voit un passé en ruines, et la thèse V dit que ce passé risque, à chaque instant, de disparaître pour de bon.\n\n> **Illustration (un parallèle avec l'après-coup).** Un souvenir d'enfance, banal pendant des années, revient soudain avec une force nouvelle le jour où une situation présente lui fait écho. Il n'était pas « là » à attendre : c'est le présent qui l'a rendu lisible. La thèse V dit quelque chose d'analogue de l'histoire collective (voir la fiche sur l'après-coup chez Freud).\n\n## Le contexte\n\nBenjamin rédige ce texte à l'hiver 1939-1940, après son internement au camp de Nevers en 1939[^3]. Le contexte est celui de la guerre, de la fuite des réfugiés juifs hors de la France de Vichy et de la menace de la Gestapo. On lit souvent la thèse IX à la lumière de cette situation ; mais l'image vaut d'abord par ce qu'elle dit de l'histoire, et non comme un document biographique.\n\n## Un repère : Kant\n\nLa thèse IX se place en face d'une autre manière de penser l'histoire. Chez Kant, les Lumières désignent la sortie d'un état de tutelle, un geste de progrès. Benjamin n'écrit pas contre Kant dans ce passage, et le rapprochement ne sert ici que de repère. Ce que la thèse IX met en cause, c'est une certaine idée du progrès comme mouvement irrésistible.","quiz":[{"question":"Quel tableau Benjamin met-il au centre de la thèse IX ?","choix":["L'Angelus Novus, de Paul Klee","Les Ménines, de Diego Vélasquez","La Liberté guidant le peuple, de Delacroix","Le Cri, d'Edvard Munch"],"bonne":0,"explication":"La thèse IX commence par « Il y a un tableau de Klee dénommé Angelus Novus ». Les autres œuvres n'apparaissent pas dans ce passage."},{"question":"Que voit l'ange là où nous voyons une chaîne d'événements ?","choix":["Une suite de progrès qui annonce un avenir meilleur","Une succession de batailles gagnées par les puissants","Un récit cohérent, entièrement fixé par les historiens","Une seule catastrophe qui amoncelle des décombres"],"bonne":3,"explication":"Dans la version anglaise, « he sees one single catastrophe » ; dans la version française de Benjamin : « une catastrophe sans modulation ni trêve, amoncelant les décombres »."},{"question":"Que nomme Benjamin « Progrès » dans cette thèse ?","choix":["La capacité de l'ange à réparer les ruines du passé","La tempête qui l'emporte vers l'avenir","Le tableau de Klee lui-même","La chaîne d'événements que l'on apprend à l'école"],"bonne":1,"explication":"La tempête vient du Paradis et emporte l'ange vers l'avenir : « Nous donnons nom de Progrès à cette tempête »."},{"question":"Un manuel présente l'histoire d'une région comme une marche continue vers le confort et la croissance. Que lui opposerait l'ange de la thèse IX ?","choix":["Une autre chaîne d'événements, plus exacte et mieux datée","Le constat que rien n'a jamais changé dans cette région","Une seule catastrophe : les ruines que le récit du progrès laisse derrière lui","Un avenir meilleur, qu'il voit clairement devant lui"],"bonne":2,"explication":"Là où le récit voit une chaîne d'événements, l'ange voit une catastrophe qui amoncelle les décombres ; et il tourne le dos à l'avenir. Il ne nie pas le changement, il en montre l'envers."}],"sources":[{"texte":"Muriel Pic, « Histoire, lecture, divination : Michel de Certeau et l'ange de l'histoire », Fabula (2017), qui cite la thèse IX dans la version française de Benjamin","url":"https://www.fabula.org/colloques/document4666.php"},{"texte":"« Theses On the Concept of History: Theses V and IX », blog de cours, Wellesley College (texte anglais des thèses V et IX)","url":"https://blogs.wellesley.edu/eng35501sp15/?p=209"},{"texte":"Wikipédia (anglais), « Theses on the Philosophy of History » (date, circonstances, publication)","url":"https://en.wikipedia.org/wiki/Theses_on_the_Philosophy_of_History"}]},{"id":"hart-regle-de-reconnaissance","discipline":"philosophie","titre":"La règle de reconnaissance","figure":"H. L. A. Hart","branche":"droit","fiabilite":"secondaire","fiabilite_note":"Hart est présenté à travers l'Encyclopédie de Stanford et Wikipédia, qui citent The Concept of Law ; le livre n'a pas été consulté. Le débat Hart–Fuller de 1958 et la formule de Radbruch ne sont pas traités, faute de source consultée. La fiche présente une théorie du droit, pas l'état du droit d'un pays.","reference":"The Concept of Law (Oxford, Clarendon Press, 1961)","accroche":"Qu'est-ce qui fait qu'une règle est du droit ? Hart répond sans parler de morale ni de menace : une pratique, celle des officiels qui reconnaissent ce qui compte comme règle.","punch":"Une règle est du droit parce que ceux qui l'appliquent la reconnaissent comme telle.","idee":"Pour Hart, le droit n'est pas l'ordre d'un souverain armé. Il unit des règles de conduite et des règles sur les règles. La plus importante, la règle de reconnaissance, existe parce que les officiels la pratiquent : elle dit ce qui compte comme droit dans un système.","citation":"must be effectively accepted as common public standards of official behavior","citation_source":"H. L. A. Hart, The Concept of Law (1961), cité d'après Stanford Encyclopedia of Philosophy, « Legal Positivism » (pagination de l'éd. 2012 : p. 116) — « doivent être effectivement acceptées comme normes publiques communes de la conduite des officiels » (ma traduction)","citation_url":"https://plato.stanford.edu/entries/legal-positivism/","liens":["montesquieu-le-pouvoir-arrete-le-pouvoir","rousseau-forcer-a-etre-libre","wittgenstein-taire"],"texte":"*The Concept of Law* paraît en 1961 à Oxford, dans la Clarendon Law Series ; une seconde édition, de 1994, comporte un postscriptum[^2]. On le décrit comme l'ouvrage de théorie analytique du droit le plus influent du monde de la *common law*[^2]. Hart y défend le positivisme juridique : les lois sont des règles créées par des humains, sans lien nécessaire avec la morale.\n\nIl décrit ce qu'est un système juridique en général, quel que soit le pays.\n\n## Contre l'ordre du souverain armé\n\nPour comprendre la thèse de Hart, il faut partir de ce qu'il rejette. John Austin, juriste du XIXe siècle (à ne pas confondre avec le philosophe du langage), définit le droit comme des commandements d'un souverain, assortis de sanctions. Hart compare cette conception à l'ordre d'un braqueur armé, et fait valoir que le droit ne se réduit pas à des ordres : les lois peuvent être habilitantes, avoir plusieurs sources, et lier aussi les législateurs[^2].\n\nIl distingue aussi une habitude d'une règle. Briser une habitude n'entraîne aucune désapprobation, alors que briser une règle est perçu comme une faute[^2]. Le droit relève de la règle, pas de la simple régularité.\n\n## Règles primaires et règles secondaires\n\nHart distingue deux sortes de règles. Les règles *primaires* régissent la conduite, comme l'interdiction du meurtre. Les règles *secondaires* portent sur les règles elles-mêmes, et elles sont de trois sortes : la règle de *reconnaissance*, qui fixe les critères de validité des normes ; les règles de *changement*, qui permettent de créer, modifier ou abroger des règles ; les règles d'*adjudication*, qui permettent de constater officiellement qu'une règle primaire a été violée[^2].\n\nÀ chacune correspond un défaut d'une société qui n'aurait que des règles primaires : l'incertitude du droit, son caractère statique et son inefficacité. La règle de reconnaissance répond à l'incertitude, les règles de changement au caractère statique, et celles d'adjudication à l'inefficacité d'une pression sociale diffuse[^2].\n\n> **Illustration (pas un exemple de Hart).** Dans une association, personne ne sait au juste quelles décisions « comptent » comme règles : un message du président ? une remarque lors d'un dîner ? Les membres décident un jour que seules comptent les décisions votées en assemblée et consignées dans un registre. Cette convention, que tous les responsables appliquent, joue le rôle d'une règle de reconnaissance : elle permet d'identifier ce qui est une règle de l'association.\n\n## Une règle qui existe par une pratique\n\nLa règle de reconnaissance a un statut particulier. C'est la plus importante des règles secondaires : elle fixe les critères ultimes de validité du système, existe parce que les officiels la pratiquent, et c'est à elle qu'ils recourent dans leur argumentation. C'est une norme sociale, qui peut ne pas être écrite dans un texte fondateur[^1].\n\nHart fixe ainsi une condition pour qu'un système juridique existe : les règles de conduite valides selon ces critères doivent être généralement obéies, et la règle de reconnaissance doit être « effectivement acceptée comme norme publique commune de la conduite des officiels »[^1]. Le droit n'existe pas parce qu'un texte le dit, mais parce que des officiels agissent ainsi.\n\n## Le point de vue interne\n\nHart distingue le point de vue *externe*, celui de qui observe seulement des régularités de comportement, et le point de vue *interne*, celui de qui accepte la règle comme standard pour guider et évaluer sa conduite et celle des autres. C'est cette « attitude critique réfléchie » qui donne au droit sa dimension normative[^2]. Elle se manifeste dans les pressions sociales et dans l'emploi de mots comme « devoir » ou « obligation »[^1]. Elle est essentielle chez les officiels ; les citoyens ordinaires peuvent se contenter d'une obéissance passive, selon une division du travail[^1].\n\n> **Illustration.** Un touriste observe qu'à un carrefour, les voitures s'arrêtent presque toutes au feu rouge : c'est le point de vue externe, une régularité. Le conducteur local, lui, klaxonne celui qui passe au rouge et dit « il n'a pas le droit » : il traite la règle comme une raison. C'est le point de vue interne.\n\n## La séparation du droit et de la morale\n\nPour les positivistes, la validité juridique d'une norme ne dépend pas *nécessairement* de ses mérites moraux, même si droit et morale se recoupent souvent[^3]. On distingue un positivisme *inclusif*, où la morale peut compter si une règle de reconnaissance le prévoit, et un positivisme *exclusif*, où elle ne peut jamais déterminer la légalité[^3].\n\n## Les objections\n\nRonald Dworkin rejette la théorie à tous les niveaux : il nie qu'une théorie générale du droit soit possible et insiste sur le rôle de l'argumentation morale et politique pour identifier le droit. Il s'appuie sur la controverse entre juristes et sur la diversité des raisons jugées pertinentes. Les positivistes répondent que ces désaccords sont des cas limites, et que seuls les motifs fondés sur des sources sont du droit[^1]. Hart lui répond dans le postscriptum de 1994[^2].\n\nLeslie Green juge difficile de concilier le caractère conventionnel de la règle de reconnaissance avec une véritable obligation juridique[^3]. Quant à Lon Fuller, il soutient qu'un système juridique suppose une « moralité interne du droit » : généralité, publicité, non-rétroactivité, cohérence[^3].","quiz":[{"question":"À quoi Hart compare-t-il la conception du droit comme commandement du souverain ?","choix":["À l'ordre d'un braqueur armé","Au règlement d'un jeu de société","Au sermon d'un prédicateur","À la promesse d'un ami fidèle"],"bonne":0,"explication":"Hart rapproche la théorie d'Austin de la situation d'un braqueur qui donne un ordre, pour montrer que le droit ne se réduit pas à des commandements assortis de menaces."},{"question":"Qu'est-ce que la règle de reconnaissance ?","choix":["Une règle morale que chaque citoyen découvre en lui-même","Une règle qui interdit aux juges d'appliquer d'autres règles","Une règle qui fixe les critères de validité des autres normes","Une règle qui sanctionne les infractions les plus graves"],"bonne":2,"explication":"C'est la règle secondaire qui fixe les critères ultimes de validité du système, et qui existe parce que les officiels la pratiquent."},{"question":"Un sociologue note que 95 % des automobilistes s'arrêtent au feu rouge ; un automobiliste reproche à un autre d'avoir « grillé » le feu. Lequel adopte le point de vue interne ?","choix":["Le sociologue, parce qu'il décrit la règle avec précision","L'automobiliste, parce qu'il traite la règle comme une raison de juger","Les deux, puisqu'ils parlent de la même règle","Aucun, car seul un juge peut avoir ce point de vue"],"bonne":1,"explication":"Le sociologue constate une régularité, c'est le point de vue externe. L'automobiliste use de la règle pour évaluer une conduite : c'est l'« attitude critique réfléchie » du point de vue interne."},{"question":"Que soutiennent les positivistes sur le droit et la morale ?","choix":["Que la validité juridique ne dépend pas nécessairement des mérites moraux","Que le droit et la morale n'ont jamais aucun point commun","Que toute loi injuste est automatiquement sans valeur","Que seul un juge peut décider ce qui est moralement bon"],"bonne":0,"explication":"Le lien n'est pas nécessaire, ce qui n'empêche pas que droit et morale se recoupent souvent."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Legal Positivism » (règle de reconnaissance, condition d'existence d'un système, point de vue interne, positivisme inclusif et exclusif, Dworkin)","url":"https://plato.stanford.edu/entries/legal-positivism/"},{"texte":"Wikipédia (anglais), « The Concept of Law » (publication, règles primaires et secondaires, trois défauts, braqueur armé)","url":"https://en.wikipedia.org/wiki/The_Concept_of_Law"},{"texte":"Stanford Encyclopedia of Philosophy, « The Nature of Law » (thèse de séparation, Fuller, objections)","url":"https://plato.stanford.edu/entries/lawphil-nature/"}]},{"id":"montesquieu-le-pouvoir-arrete-le-pouvoir","discipline":"philosophie","titre":"Que le pouvoir arrête le pouvoir","figure":"Montesquieu","branche":"droit","fiabilite":"mixte","fiabilite_note":"Le chapitre VI du livre XI est cité d'après Wikisource, dans l'orthographe de l'édition de 1777 ; la formule du chapitre IV est donnée d'après la traduction anglaise que cite l'Encyclopédie de Stanford. La fiche présente une idée et son histoire, non l'état du droit d'un pays.","reference":"De l'esprit des lois (1748), livre XI, chapitres IV et VI","accroche":"La liberté politique, pour Montesquieu, n'est pas de faire ce qu'on veut. C'est de n'avoir pas à craindre l'abus du pouvoir, et cela suppose que le pouvoir ne soit pas tout entier au même endroit.","punch":"Là où un seul homme fait la loi, l'applique et juge, il n'y a point de liberté.","idee":"Montesquieu définit la liberté politique comme la tranquillité d'esprit née de l'opinion que chacun a de sa sûreté. Pour qu'on ne puisse abuser du pouvoir, il faut que le pouvoir arrête le pouvoir : séparer le législatif, l'exécutif et le judiciaire.","citation":"Lorsque dans la même personne ou dans le même corps de magistrature, la puissance législative est réunie à la puissance exécutrice, il n'y a point de liberté","citation_source":"Montesquieu, De l'esprit des lois (1748), livre XI, chapitre VI « De la constitution d'Angleterre » — édition de 1777, Wikisource","citation_url":"https://fr.wikisource.org/wiki/Esprit_des_lois_(1777)/L11/C6","liens":["rousseau-forcer-a-etre-libre","kant-lumieres","hart-regle-de-reconnaissance"],"texte":"*De l'esprit des lois* paraît en 1748. Montesquieu y a intégré des passages de ses *Considérations* de 1734, et il a passé deux ans en Angleterre, dont le système politique l'a fortement impressionné[^1]. L'ouvrage suscite des critiques : Montesquieu publie une *Défense de l'Esprit des lois* en 1750, et le livre est mis à l'Index en 1751[^1].\n\nLa séparation des pouvoirs prend aujourd'hui des formes différentes selon les constitutions : on suit ici l'idée, telle que Montesquieu la formule.\n\n## Une liberté qui tient à la sûreté\n\nAu livre XI, Montesquieu parle de la liberté politique. Elle n'est pas la liberté de faire tout ce qu'on veut. Le chapitre VI la définit ainsi : « La liberté politique dans un citoyen est cette tranquillité d'esprit qui provient de l'opinion que chacun a de sa sureté »[^2].\n\nCe qui compte, c'est donc le sentiment de ne pas pouvoir être visé par l'arbitraire d'un pouvoir. Les lois protègent les citoyens et leur donnent la confiance que la puissance de l'État ne se tournera pas contre eux tant qu'ils obéissent. On a rapproché cette idée de la formule de Judith Shklar, un « libéralisme de la peur »[^1].\n\n## Que le pouvoir arrête le pouvoir\n\nPour qu'une telle sûreté existe, il faut un remède à la tendance du pouvoir à abuser. Le chapitre IV le formule : il faut, par la nature même des choses, que le pouvoir arrête le pouvoir (*power should be a check to power*, dans la traduction que cite Stanford)[^1].\n\nLa solution est de ne pas réunir les pouvoirs. Au chapitre VI, intitulé « De la constitution d'Angleterre », Montesquieu écrit : « Il y a dans chaque état trois sortes de pouvoirs, la puissance législative, la puissance exécutrice des choses qui dépendent du droit des gens & la puissance exécutrice de celles qui dépendent du droit civil »[^2]. On les appelle aujourd'hui législatif, exécutif et judiciaire, mais la formule de Montesquieu est plus longue.\n\n## Quand ils sont réunis\n\nIl tire ensuite la conséquence : quand la puissance législative est réunie à la puissance exécutrice, « il n'y a point de liberté ». Et il va jusqu'au bout : « Tout seroit perdu, si le même homme, ou le même corps des principaux, ou des nobles, ou du peuple, exerçoient ces trois pouvoirs »[^2]. La liste est précise : peu importe que ce soit un seul homme, un groupe de grands, de nobles ou le peuple entier. Le problème vient de la concentration, non de l'identité de celui qui la détient.\n\nLe judiciaire n'échappe pas à la règle : « Il n'y a point encore de liberté, si la puissance de juger n'est pas séparée de la puissance législative & de l'exécutrice. » Jointe à l'exécutrice, elle ferait que « le juge pourroit avoir la force d'un oppresseur »[^2].\n\n> **Illustration (pas un exemple de Montesquieu).** Dans un petit club sportif, la même personne écrit le règlement, décide des sanctions et joue le rôle d'arbitre dans les litiges entre adhérents. Même si elle est honnête, les membres n'ont aucun moyen de contester une décision. Si une autre personne applique le règlement et une troisième juge les conflits, chacune peut limiter les deux autres. C'est le principe que Montesquieu applique à l'État.\n\n## Un pouvoir de juger invisible\n\nLe chapitre VI réserve au pouvoir de juger un traitement singulier. Bien organisé, il devient presque imperceptible : « la puissance de juger si terrible parmi les hommes, n'étant attachée ni à un certain état ni à une certaine profession, devient pour ainsi dire invisible & nulle »[^2]. On craint alors la magistrature, et non les magistrats[^1].\n\nLe même chapitre décrit les juges de la nation comme « la bouche qui prononce les paroles de la loi »[^2] : ils disent la loi, ils ne la font pas.\n\nPlusieurs dispositifs découlent de cette idée[^1] : seul le pouvoir législatif lève l'impôt, l'exécutif peut opposer son veto, le législatif est composé de deux chambres, et le judiciaire doit être indépendant et appliquer les lois de manière fixe et constante.\n\n> **Illustration.** Un salarié conteste une sanction devant le conseil de discipline de son entreprise, composé de la direction qui l'a sanctionné. Il a beau avoir raison, il ne s'attend à rien. Ce qui lui manque n'est pas une loi plus juste, c'est la « tranquillité d'esprit » que donne un juge distinct de celui qui punit.\n\n## Ce qui reste discuté\n\nMontesquieu décrit-il réellement l'Angleterre de son temps, ou construit-il un modèle à partir d'elle ? Il s'appuie sur ses observations du système anglais[^1], mais le titre même du chapitre VI parle d'une constitution plutôt que d'une pratique, et la question de l'écart entre les deux reste ouverte.","quiz":[{"question":"Comment Montesquieu définit-il la liberté politique au chapitre VI ?","choix":["Comme le droit de faire tout ce que l'on désire sans contrainte","Comme le pouvoir donné au peuple de gouverner en toutes circonstances","Comme l'absence de toute loi dans un État bien gouverné","Comme la tranquillité d'esprit née de l'opinion qu'on a de sa sûreté"],"bonne":3,"explication":"« La liberté politique dans un citoyen est cette tranquillité d'esprit qui provient de l'opinion que chacun a de sa sureté. » Elle repose sur la confiance de n'être pas visé par l'abus du pouvoir."},{"question":"Que dit Montesquieu quand législatif et exécutif sont réunis ?","choix":["Que l'État gagne en efficacité, puisque les décisions sont plus rapides","Que cela convient aux petits États, mais pas aux grands","Qu'il n'y a point de liberté","Que seul le peuple doit alors choisir ceux qui exercent le pouvoir"],"bonne":2,"explication":"« Lorsque dans la même personne ou dans le même corps de magistrature, la puissance législative est réunie à la puissance exécutrice, il n'y a point de liberté. »"},{"question":"Une assemblée élue vote une loi, puis désigne parmi ses membres ceux qui jugeront les citoyens accusés de l'avoir enfreinte. Qu'objecterait Montesquieu ?","choix":["Que juger n'est pas séparé de légiférer : il n'y a point de liberté","Rien, puisque l'assemblée a été élue par le peuple tout entier","Que les juges devraient être nommés à vie pour être compétents","Que la loi doit d'abord être approuvée par le roi"],"bonne":0,"explication":"Peu importe que le pouvoir soit tenu par le peuple ou ses élus : « tout seroit perdu » si le même corps exerçait les trois pouvoirs. La puissance de juger doit être séparée de la législative et de l'exécutrice."},{"question":"Que veut dire que la puissance de juger devient « invisible & nulle » ?","choix":["Que les juges n'ont aucun pouvoir réel et ne servent à rien","Que les procès doivent se tenir à huis clos, loin du public","Que, n'étant attachée à aucune profession, elle ne pèse sur personne","Que les juges doivent cacher leur identité aux accusés qu'ils jugent"],"bonne":2,"explication":"N'étant attachée « ni à un certain état ni à une certaine profession », la puissance de juger, si terrible, cesse d'être une menace permanente : on craint la magistrature, et non les magistrats."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Montesquieu » (séparation des pouvoirs, liberté politique, mécanismes, date de 1748, voyage en Angleterre)","url":"https://plato.stanford.edu/entries/montesquieu/"},{"texte":"Montesquieu, De l'esprit des lois, livre XI, chapitre VI « De la constitution d'Angleterre » (Wikisource, édition de 1777)","url":"https://fr.wikisource.org/wiki/Esprit_des_lois_(1777)/L11/C6"}]},{"id":"rousseau-forcer-a-etre-libre","discipline":"philosophie","titre":"Forcé d'être libre ?","figure":"Jean-Jacques Rousseau","branche":"politique","fiabilite":"mixte","fiabilite_note":"Le Contrat social est cité d'après une édition de diffusion libre (MetaLibri, d'après l'édition de 1782), qui donne « à être libre » ; les lectures de la volonté générale, d'après l'Encyclopédie de Stanford.","reference":"Du contrat social (1762), livre I, chapitres VI et VII","accroche":"La formule a servi à accuser Rousseau de justifier la contrainte. Elle est pourtant le centre de son argument sur la liberté : celle qui ne dépend de personne.","punch":"Obéir à la loi que l'on s'est donnée, c'est ne dépendre de personne.","idee":"Pour Rousseau, celui qui refuse d'obéir à la volonté générale sera « contraint par tout le corps », ce qui veut dire qu'on le forcera à être libre. La liberté visée n'est pas l'absence de toute contrainte : c'est l'absence de dépendance personnelle.","citation":"quiconque refusera d'obéir à la volonté générale, y sera contraint par tout le corps ; ce qui ne signifie autre chose sinon qu'on le forcera à être libre","citation_source":"Rousseau, Du contrat social (1762), livre I, chapitre VII, édition MetaLibri (2008) du texte de 1782","citation_url":"https://lapasserelle.com/divers/RousseauJJ_ContratSocial_p.pdf","liens":["kant-lumieres","hegel-maitre-esclave","spinoza-desir"],"texte":"*Du contrat social* paraît en 1762, la même année qu'*Émile*. Les deux livres sont condamnés à Genève, *Émile* l'est aussi à Paris, et Rousseau renonce en mai 1763 à sa citoyenneté genevoise[^2]. Dans ce livre, une phrase est devenue célèbre et scandaleuse : celle qui dit qu'on peut « forcer à être libre ». Pour la comprendre, il faut remonter au problème que Rousseau cherche à résoudre.\n\n## Un problème à résoudre\n\nLe livre s'ouvre sur une enquête, et non sur un constat : « Je veux chercher si, dans l'ordre civil, il peut y avoir quelque règle d'administration légitime et sûre. » Le premier chapitre pose la difficulté avec une phrase fameuse : « L'homme est né libre, et partout il est dans les fers »[^1]. Comment un pouvoir peut-il être légitime, et pas seulement fort ?\n\nAu chapitre VI, Rousseau énonce le problème précis que le contrat doit résoudre : « Trouver une forme d'association qui défende et protège de toute la force commune la personne et les biens de chaque associé, et par laquelle chacun, s'unissant à tous, n'obéisse pourtant qu'à lui-même, et reste aussi libre qu'auparavant »[^1].\n\nTout est là. Il ne s'agit pas de choisir entre l'ordre et la liberté. Il s'agit de trouver une règle commune telle que, en lui obéissant, chacun n'obéisse qu'à lui-même.\n\n## La phrase du chapitre VII\n\nAu chapitre VII, Rousseau doit rendre cet engagement effectif. Un pacte qui n'engagerait personne ne vaudrait rien. Il écrit donc : « Afin donc que ce pacte social ne soit pas un vain formulaire, il renferme tacitement cet engagement, qui seul peut donner de la force aux autres, que quiconque refusera d'obéir à la volonté générale, y sera contraint par tout le corps ; ce qui ne signifie autre chose sinon qu'on le forcera à être libre »[^1].\n\nLa fin de la phrase est celle qu'on retient, mais Rousseau la prolonge aussitôt : « car telle est la condition qui, donnant chaque citoyen à la patrie, le garantit de toute dépendance personnelle, condition qui fait l'artifice et le Jeu de la machine politique, et qui seule rend légitimes les engagements civils, lesquels, sans cela, seraient absurdes, tyranniques, et sujets aux plus énormes abus »[^1].\n\n## La clé : la dépendance personnelle\n\nLe mot décisif est « dépendance personnelle ». Pour Rousseau, être libre n'est pas faire tout ce qu'on veut. C'est ne pas dépendre de la volonté d'un autre. Dans ce passage, la contrainte procure une garantie contre toute dépendance personnelle : la liberté visée est une protection contre la dépendance, non une absence de toute contrainte[^2].\n\n> **Illustration (pas un exemple de Rousseau).** Une salariée dépend entièrement de l'humeur de son patron : il peut la renvoyer ou l'augmenter selon son bon plaisir. Elle est soumise à sa volonté particulière. Une autre salariée est tenue par un règlement que tout le monde connaît, patron compris, et qui s'applique de la même manière à chacun. Elle est contrainte, elle aussi : elle doit respecter les horaires. Mais elle ne dépend d'aucune personne. C'est cette différence que Rousseau cherche à penser.\n\nCe qui rend la loi acceptable, c'est qu'elle émane de la volonté générale, et que le souverain, « n'étant formé que des particuliers qui le composent, n'a ni ne peut avoir d'intérêt contraire au leur »[^1]. La contrainte ne vient donc pas d'un maître extérieur : elle revient du corps dont chacun fait partie.\n\n## Que veut dire « volonté générale » ?\n\nLa question est restée ouverte. On a lu cette notion de deux façons principales : une conception démocratique, où la volonté générale est ce que les citoyens ont décidé en assemblée souveraine, et une conception « transcendante », où elle est l'incarnation de l'intérêt commun des citoyens, indépendamment de ce que chacun veut. D'autres lectures la décrivent comme une volonté individuelle tournée vers le bien commun, ou comme une manière délibérative de découvrir l'intérêt public[^2].\n\nSelon qu'on choisit l'une ou l'autre, la phrase sur la contrainte ne sonne pas de la même façon. Dans la lecture démocratique, elle dit qu'un citoyen doit respecter ce que l'assemblée a décidé. Dans la lecture transcendante, elle peut paraître dire qu'on peut imposer à quelqu'un ce qu'il « devrait » vouloir, et c'est là que le soupçon d'autoritarisme apparaît.\n\n## Les objections\n\nLe passage est réputé (*notorious*), et il renforce le soupçon que l'engagement de Rousseau envers la liberté est moins simple qu'il n'y paraît. Des auteurs hostiles ont vu dans Rousseau une source de certains aspects autoritaires de la Révolution française, puis, plus tard, du fascisme et du communisme. D'autres, comme Neuhouser (1993), le lisent comme défendant une liberté morale : obéir à une loi qu'on s'est prescrite à soi-même[^2].\n\nSur le sort de la minorité battue (livre IV, chapitre 3), beaucoup de commentateurs jugent l'argument de Rousseau peu convaincant[^2]. La formule est donc plus précise, et plus discutable, qu'une simple apologie de la contrainte.","quiz":[{"question":"Quel est, selon Rousseau, le problème que le pacte social doit résoudre ?","choix":["Trouver une association où chacun, uni à tous, n'obéisse qu'à lui-même et reste libre","Trouver comment un roi peut gouverner sans jamais rencontrer de résistance du peuple","Trouver comment les plus riches peuvent protéger leurs biens contre les pauvres","Trouver comment chaque citoyen peut vivre à l'écart de toute loi et de tout autre citoyen"],"bonne":0,"explication":"Au chapitre VI du livre I, Rousseau cherche une association qui protège chaque associé tout en laissant chacun « aussi libre qu'auparavant », en n'obéissant qu'à lui-même."},{"question":"Que garantit la contrainte, d'après la suite de la phrase du chapitre VII ?","choix":["Une liberté de faire tout ce que chacun désire, sans loi","La disparition de toute forme de contrainte dans la société","La protection contre toute dépendance personnelle","Le droit pour le plus fort de commander les autres"],"bonne":2,"explication":"Rousseau écrit que cette condition « garantit de toute dépendance personnelle » le citoyen. La liberté en jeu est l'absence de dépendance envers une personne, et non l'absence de contrainte."},{"question":"Comment a-t-on lu la volonté générale de Rousseau ?","choix":["Comme une simple moyenne arithmétique des préférences privées de chacun","Comme la // ---------- Dates locales (chaînes AAAA-MM-JJ) ----------
const pad = n => String(n).padStart(2, '0');
const jourDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ecart = (a, b) => {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5);

const decaler = (j, n) => { const [y, m, d] = j.split('-').map(Number); return jourDe(new Date(y, m - 1, d + n)); };

// ---------- Paramètres ----------
// Rotation des disciplines, jour après jour. Un croisement tous les cinq jours.
const MOTIF = {
  alterne: ['psychanalyse', 'philosophie', 'psychanalyse', 'philosophie', 'croisement'],
  philosophie: ['philosophie', 'philosophie', 'philosophie', 'philosophie', 'croisement'],
  psychanalyse: ['psychanalyse', 'psychanalyse', 'psychanalyse', 'psychanalyse', 'croisement'],
};
// Rappel espacé : après une erreur, la question revient le lendemain ; une bonne
// réponse la fait passer à la boîte suivante (7 jours, puis 30). Après la boîte 2,
// une bonne réponse la retire du rappel.
const INTERVALLES = [1, 7, 30];

// ---------- État ----------
function etatVide(auj) {
  return {
    version: 2, debut: auj, lues: {}, relues: {}, quiz: {}, notes: {}, revisions: {}, servies: [], jour: null, tour: 0,
    reglages: { rythme: 'alterne', acces: 'jour', theme: 'auto', voix: '', vitesse: 1, exclues: [] },
    reglagesLe: 0, dernierExport: null,
  };
}

const objet = v => v && typeof v === 'object' && !Array.isArray(v);

/** Complète un état lu (localStorage, import, synchronisation) et migre l'ancien format. */
function normaliser(brut, auj, fiches = []) {
  const src = objet(brut) ? brut : {};
  const e = Object.assign(etatVide(auj), src);
  e.reglages = Object.assign(etatVide(auj).reglages, objet(src.reglages) ? src.reglages : {});
  if (!Array.isArray(e.reglages.exclues)) e.reglages.exclues = [];
  for (const k of ['lues', 'relues', 'quiz', 'notes', 'revisions']) if (!objet(e[k])) e[k] = {};
  if (!Array.isArray(e.servies)) e.servies = [];
  if (!objet(e.jour) || typeof e.jour.date !== 'string') e.jour = null;
  if (!Number.isFinite(e.tour)) e.tour = 0;
  if (src.version !== 2) {
    // Version 1 : pas de file des séances servies, pas de rappel espacé.
    for (const id of Object.keys(e.lues)) if (!e.servies.includes(id)) e.servies.push(id);
    const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
    for (const [id, reps] of Object.entries(e.quiz)) {
      const f = parId[id]; if (!f || !Array.isArray(reps)) continue;
      reps.forEach((r, qi) => {
        if (r == null || !f.quiz[qi]) return;
        const cle = cleQ(id, qi);
        if (e.revisions[cle]) return;
        e.revisions[cle] = r === f.quiz[qi].bonne
          ? { boite: 1, echeance: decaler(auj, INTERVALLES[1]), ratees: 0, vue: auj }
          : { boite: 0, echeance: auj, ratees: 1, vue: auj };
      });
    }
    e.tour = Object.keys(e.lues).length;
    e.jour = null;
    e.version = 2;
  }
  return e;
}

/** Fusionne deux états (synchronisation, import) sans rien perdre. */
function fusionner(a, b, auj) {
  const r = etatVide(auj);
  r.debut = [a.debut, b.debut].filter(Boolean).sort()[0] || auj;
  r.lues = { ...(b.lues || {}) };
  for (const [id, j] of Object.entries(a.lues || {})) if (!r.lues[id] || j < r.lues[id]) r.lues[id] = j;
  r.relues = { ...(b.relues || {}) };
  for (const [id, j] of Object.entries(a.relues || {})) if (!r.relues[id] || j > r.relues[id]) r.relues[id] = j;
  r.quiz = { ...(b.quiz || {}) };
  for (const [id, rep] of Object.entries(a.quiz || {})) {
    const autre = r.quiz[id] || [];
    r.quiz[id] = (rep || []).map((v, i) => v ?? autre[i] ?? null);
    for (let i = (rep || []).length; i < autre.length; i++) r.quiz[id][i] = autre[i];
  }
  r.notes = { ...(b.notes || {}) };
  for (const [id, n] of Object.entries(a.notes || {})) if (!r.notes[id] || (n.le || 0) > (r.notes[id].le || 0)) r.notes[id] = n;
  r.revisions = { ...(b.revisions || {}) };
  for (const [c, v] of Object.entries(a.revisions || {})) if (!r.revisions[c] || (v.vue || '') >= (r.revisions[c].vue || '')) r.revisions[c] = v;
  r.servies = [...new Set([...(b.servies || []), ...(a.servies || [])])];
  const ja = a.jour, jb = b.jour;
  r.jour = ja && (!jb || ja.date >= jb.date) ? ja : (jb || null);
  r.tour = Math.max(a.tour || 0, b.tour || 0);
  r.dernierExport = [a.dernierExport, b.dernierExport].filter(Boolean).sort().pop() || null;
  const plusRecent = (a.reglagesLe || 0) >= (b.reglagesLe || 0) ? a : b;
  r.reglages = Object.assign(etatVide(auj).reglages, plusRecent.reglages || {});
  r.reglagesLe = plusRecent.reglagesLe || 0;
  return r;
}

// ---------- Sélection et ordre des séances ----------
/** Les fiches retenues par les réglages (rythme et branches). Les croisements sont de tous les rythmes. */
function selection(fiches, reglages) {
  const ex = new Set(reglages.exclues || []), r = reglages.rythme || 'alterne';
  const garde = f => r === 'alterne' || f.discipline === r || f.discipline === 'croisement';
  const s = fiches.filter(f => garde(f) && !ex.has(f.branche));
  return s.some(f => f.discipline !== 'croisement') ? s : fiches.filter(garde);
}
const parDiscipline = sel => ({
  psychanalyse: sel.filter(f => f.discipline === 'psychanalyse'),
  philosophie: sel.filter(f => f.discipline === 'philosophie'),
  croisement: sel.filter(f => f.discipline === 'croisement'),
});
const motifDe = reglages => MOTIF[reglages.rythme] || MOTIF.alterne;

/** L'ordre de lecture prévu pour une première lecture, qui sert aussi à numéroter les séances. */
function suiteOrdonnee(fiches, reglages) {
  const sel = selection(fiches, reglages), L = parDiscipline(sel), motif = motifDe(reglages);
  const pos = { psychanalyse: 0, philosophie: 0, croisement: 0 }, out = [];
  for (let i = 0; out.length < sel.length && i < sel.length * motif.length + motif.length; i++) {
    const d = motif[i % motif.length];
    if (pos[d] < L[d].length) out.push(L[d][pos[d]++]);
  }
  return out;
}

/**
 * La prochaine séance à servir : dans la discipline du tour, la première fiche non lue.
 * Une fiche servie mais pas lue revient donc à son prochain tour : aucune n'est sautée.
 * Si tout est lu, le cycle recommence par la fiche lue il y a le plus longtemps.
 */
function prochaine(fiches, etat) {
  const sel = selection(fiches, etat.reglages), L = parDiscipline(sel), motif = motifDe(etat.reglages);
  for (let k = 0; k < motif.length; k++) {
    const d = motif[(etat.tour + k) % motif.length];
    const f = L[d].find(f => !etat.lues[f.id]);
    if (f) return { id: f.id, relecture: false };
  }
  const ordre = suiteOrdonnee(fiches, etat.reglages);
  if (!ordre.length) return null;
  const rang = id => ordre.findIndex(f => f.id === id);
  const derniere = id => [etat.lues[id] || '', (etat.relues || {})[id] || ''].sort().pop();
  const plusAncienne = [...ordre].sort((a, b) => derniere(a.id).localeCompare(derniere(b.id)) || rang(a.id) - rang(b.id))[0];
  return { id: plusAncienne.id, relecture: true };
}

/**
 * La séance du jour. Une fois choisie, elle ne change plus de la journée, même si
 * les réglages changent. Renvoie { id, relecture, nouvelle } ; si nouvelle est vrai,
 * l'appelant applique servir().
 */
function seanceDuJour(fiches, etat, auj) {
  const existe = id => fiches.some(f => f.id === id);
  if (etat.jour && etat.jour.date === auj && existe(etat.jour.id)) return { ...etat.jour, nouvelle: false };
  const p = prochaine(fiches, etat);
  return p && { date: auj, ...p, nouvelle: true };
}
function servir(etat, choix) {
  etat.jour = { date: choix.date, id: choix.id, relecture: !!choix.relecture };
  etat.tour = (etat.tour || 0) + 1;
  if (!etat.servies.includes(choix.id)) etat.servies.push(choix.id);
}
/** La séance de demain, si celle d'aujourd'hui est lue. */
function seanceDeDemain(fiches, etat, auj) {
  const copie = { ...etat, lues: { ...etat.lues }, relues: { ...(etat.relues || {}) }, tour: etat.tour };
  if (etat.jour && etat.jour.date === auj) { if (copie.lues[etat.jour.id]) copie.relues[etat.jour.id] = auj; else copie.lues[etat.jour.id] = auj; }
  return prochaine(fiches, copie);
}
/** Les fiches accessibles dans la bibliothèque. */
function ouvertes(fiches, etat) {
  if (etat.reglages.acces === 'tout') return new Set(fiches.map(f => f.id));
  const ids = new Set([...etat.servies, ...Object.keys(etat.lues)]);
  if (etat.jour) ids.add(etat.jour.id);
  return ids;
}
/** Vrai si toute la sélection a été lue au moins une fois. */
function cycleAcheve(fiches, etat) {
  const sel = selection(fiches, etat.reglages);
  return sel.length > 0 && sel.every(f => etat.lues[f.id]);
}

// ---------- Rappel espacé ----------
const cleQ = (id, qi) => `${id}#${qi}`;
function enregistrerReponse(etat, id, qi, juste, auj) {
  const c = cleQ(id, qi), r = { boite: 0, ratees: 0, ...(etat.revisions[c] || {}) };
  if (juste) {
    r.boite = Math.min(r.boite + 1, INTERVALLES.length);
    r.echeance = r.boite >= INTERVALLES.length ? null : decaler(auj, INTERVALLES[r.boite]);
  } else {
    r.boite = 0; r.ratees += 1; r.echeance = decaler(auj, INTERVALLES[0]);
  }
  r.vue = auj;
  etat.revisions[c] = r;
  return r;
}
/** Les questions à revoir aujourd'hui : d'abord les plus souvent ratées, puis les plus anciennes. */
function aRevoir(fiches, etat, auj, max = Infinity) {
  const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
  return Object.entries(etat.revisions)
    .map(([c, r]) => { const i = c.lastIndexOf('#'); return { id: c.slice(0, i), qi: Number(c.slice(i + 1)), ...r }; })
    .filter(r => r.echeance && r.echeance <= auj && parId[r.id] && parId[r.id].quiz[r.qi])
    .sort((a, b) => b.ratees - a.ratees || a.echeance.localeCompare(b.echeance) || a.id.localeCompare(b.id) || a.qi - b.qi)
    .slice(0, max);
}

// ---------- Texte ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enLigne = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\*(.+?)\*/g, '<em>$1</em>')
  .replace(/\[\^(\d+)\]/g, '<sup class="appel"><a href="#source-$1" aria-label="source $1">$1</a></sup>');

/** Sépare l'en-tête « **Exemple (…).** » ou « **Illustration (…).** » d'un encadré. */
function enteteIllustration(t) {
  const m = t.match(/^\*\*(?:Exemple|Illustration)\b([^*]*)\*\*\s*/);
  if (!m) return null;
  let note = m[1].trim().replace(/^[,:;]\s*/, '').replace(/\.$/, '').trim();
  if (/^\(.*\)$/.test(note)) note = note.slice(1, -1).trim();
  note = note.replace(/^une illustration\b[,;]?\s*/i, '').replace(/\.$/, '').trim();
  return { note, reste: t.slice(m[0].length) };
}

function markdown(txt) {
  return txt.split(/\n{2,}/).map(bloc => {
    if (bloc.startsWith('## ')) return `<h2>${enLigne(bloc.slice(3))}</h2>`;
    const lignes = bloc.split('\n');
    if (lignes.every(l => l.startsWith('>'))) {
      const paras = lignes.map(l => l.replace(/^> ?/, '')).join('\n').split(/\n(?=\S)/).filter(t => t.trim());
      const h = paras.length ? enteteIllustration(paras[0]) : null;
      if (h) paras[0] = h.reste;
      const tete = h ? `<p class="ill-tete"><span class="ill-label">Illustration</span>${h.note ? `<span class="ill-note">${enLigne(h.note)}</span>` : ''}</p>` : '';
      return `<aside class="exemple">${tete}${paras.filter(t => t.trim()).map(t => `<p>${enLigne(t)}</p>`).join('')}</aside>`;
    }
    if (lignes.every(l => l.startsWith('- '))) return `<ul>${lignes.map(l => `<li>${enLigne(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p>${enLigne(lignes.join(' '))}</p>`;
  }).join('');
}
/** Texte à lire à voix haute : sans balisage ni appels de note. */
const texteBrut = s => s.replace(/\[\^\d+\]/g, '').replace(/^## /gm, '').replace(/\*\*?/g, '').replace(/^- /gm, '').replace(/^> ?/gm, '');

function hache(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function melange(n, graine) {
  const ordre = [...Array(n).keys()]; let x = graine || 1;
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
  return ordre;
}
const NOMBRES = ['Aucune question', 'Une question', 'Deux questions', 'Trois questions', 'Quatre questions', 'Cinq questions', 'Six questions'];
const titreQuiz = n => NOMBRES[n] || `${n} questions`;

/** Toutes les notes, en Markdown, pour les garder hors de l'app. */
function notesEnMarkdown(fiches, etat, maintenant = new Date()) {
  const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
  const notes = Object.entries(etat.notes).filter(([id, n]) => parId[id] && n && n.texte && n.texte.trim())
    .sort((a, b) => (a[1].le || 0) - (b[1].le || 0));
  const date = maintenant.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  let md = `# Après-coup — mes notes\n\nExport du ${date}. ${notes.length} note${notes.length > 1 ? 's' : ''}.\n`;
  for (const [id, n] of notes) {
    const f = parId[id];
    md += `\n## ${f.titre} — ${f.figure}\n\n*${f.reference}*`;
    if (etat.lues[id]) md += ` · séance lue le ${etat.lues[id]}`;
    md += `\n\n${n.texte.trim()}\n`;
  }
  return md;

    const l = document.getElementById('v-lire'), p = document.getElementById('v-pause'), s = document.getElementById('v-stop');
