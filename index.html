jeu, la chasse, la conversation, les charges. Il cherche la raison commune de tant de mouvements, et la trouve dans une phrase devenue célèbre : le malheur des hommes vient de ce qu'ils ne savent pas rester en repos dans une chambre.\n\n## Le lièvre et la chasse\n\nL'exemple le plus parlant est celui du chasseur. Offrez-lui le lièvre qu'il poursuit toute la journée : il n'en voudra pas. Ce n'est pas le lièvre qu'il cherche, c'est la chasse. Le joueur de même : donnez-lui chaque matin l'argent qu'il pourrait gagner, à condition qu'il ne joue pas, et vous le rendrez malheureux.\n\nIl faut donc distinguer deux choses que nous confondons sans cesse : l'objet que nous visons et la fonction de la poursuite. L'objet est un prétexte. La poursuite a pour vraie fonction de nous détourner.\n\n## Détourner de quoi ?\n\nDe nous-mêmes, plus exactement de notre condition. Pascal parle du « malheur naturel de notre condition faible et mortelle, et si misérable que rien ne peut nous consoler lorsque nous y pensons de près ».\n\nD'où le paradoxe du roi. Il est entouré de tout ce qu'on peut désirer. Mais laissez-le sans divertissement, considérant ce qu'il est, et le voilà malheureux — plus qu'un de ses sujets qui joue et se divertit. C'est pourquoi on a tant de gens autour des rois : leur métier est d'empêcher le roi de penser à lui.\n\n## L'agitation nous trompe sur elle-même\n\nLe plus fin, chez Pascal, est la description de la méconnaissance. Ceux qui se divertissent ne savent pas qu'ils fuient. Ils croient sincèrement que l'objet les rendra heureux, et qu'ils goûteront le repos une fois obtenu ce qu'ils poursuivent. Mais à peine l'obtiennent-ils que l'ennui sort « du fond du cœur » et les pousse à chercher autre chose.\n\nPascal note deux instincts contraires : l'un nous porte à chercher l'agitation au-dehors, sentiment de notre misère ; l'autre, reste de notre grandeur première, nous fait sentir que le bonheur serait dans le repos. De ces deux pentes naît un projet confus qui nous fait tendre au repos par l'agitation.\n\n## Une lecture sans Dieu ?\n\nPascal écrit en apologiste : le divertissement prouve la misère de l'homme sans Dieu. On peut lire la liasse sans adhérer à la conclusion, et garder une observation d'une précision redoutable. Nous ne voulons pas ce que nous croyons vouloir ; notre activité tient d'abord à ce qu'elle nous épargne ; et cette fonction nous reste dissimulée. Il y a là, deux siècles avant Freud, une théorie de la répétition qui ne dit pas son nom.","quiz":[{"question":"Que montre l'exemple du chasseur à qui l'on offre le lièvre ?","choix":["Que l'objet poursuivi n'est qu'un prétexte : c'est la poursuite elle-même qui importe","Que les chasseurs sont des gens cupides, qui ne pensent qu'au profit du gibier","Que la chasse est une activité aristocratique que la morale chrétienne condamne","Que le gibier a plus de valeur une fois capturé qu'une fois offert"],"bonne":0,"explication":"Le chasseur refuserait le lièvre offert : ce qu'il veut, c'est la chasse, qui le détourne de lui-même. Pascal ne fait ici ni morale de la cupidité, ni critique sociale de la noblesse, et l'exemple suggère précisément l'inverse d'une valeur accrue du gibier capturé."},{"question":"Pourquoi le roi a-t-il besoin de gens autour de lui ?","choix":["Pour l'aider à gouverner son royaume au quotidien","Pour le protéger de ses ennemis, au-dedans et au-dehors","Pour l'empêcher de penser à lui-même et à sa condition","Pour lui enseigner la vertu et la sagesse des anciens"],"bonne":2,"explication":"Le roi sans divertissement, considérant ce qu'il est, devient malheureux. Les courtisans ont pour fonction de l'en détourner. Les fonctions politiques, militaires ou morales ne sont pas ce que Pascal souligne."},{"question":"Pourquoi le divertissement est-il « la plus grande de nos misères » ?","choix":["Parce qu'il coûte trop d'argent et ruine les familles qui s'y adonnent","Parce qu'il est interdit par l'Église pendant les jours de fête","Parce qu'il rend les hommes violents et querelleurs entre eux","Parce qu'il nous empêche de penser à nous et nous fait perdre insensiblement"],"bonne":3,"explication":"Le divertissement console, mais il détourne de la seule réflexion qui pourrait conduire au vrai bien : il nous fait « arriver insensiblement à la mort ». Pascal ne raisonne ni en termes de coût, ni d'interdit ecclésiastique, ni de violence."}],"sources":["Blaise Pascal, *Pensées*, éd. Philippe Sellier, Le Livre de Poche / Classiques Garnier.","Blaise Pascal, *Pensées*, éd. Louis Lafuma, Seuil, 1962."]},{"id":"freud-fort-da","discipline":"psychanalyse","titre":"Fort-Da","figure":"Sigmund Freud","reference":"Au-delà du principe de plaisir, chap. II (1920)","accroche":"Un enfant d'un an et demi jette une bobine, la fait revenir, recommence. Freud y voit l'énigme qui va bouleverser toute sa théorie : pourquoi répéter ce qui fait mal ?","punch":"L'enfant jette la bobine pour ne pas subir le départ de sa mère.","idee":"L'enfant met en scène la disparition et le retour d'un objet, en prononçant « o-o-o » (fort, parti) puis « da » (voilà). Il transforme une absence subie en jeu dont il est l'auteur. Mais c'est la disparition qu'il rejoue le plus souvent : un indice qu'il existe un au-delà du principe de plaisir.","repere":"Fort : « parti, loin ». Da : « voilà, là ». L'enfant observé est le petit-fils de Freud, Ernst, fils de sa fille Sophie, morte en janvier 1920 pendant la rédaction du livre.","liens":["pascal-divertissement","freud-transfert","freud-deuil-melancolie"],"texte":"*Au-delà du principe de plaisir* est un livre étrange, spéculatif, que Freud lui-même présente avec précaution. Il part d'un constat clinique : certains phénomènes ne s'expliquent pas par la recherche du plaisir. Les rêves des névroses traumatiques ramènent sans cesse le rêveur à l'accident. Les patients répètent en séance ce qui les a fait souffrir. Et un enfant joue.\n\n## La scène\n\nLe petit garçon a un an et demi. Il est sage, ne pleure pas quand sa mère s'absente. Mais il a une habitude : il jette les petits objets loin de lui, dans un coin, sous le lit, en émettant un long « o-o-o-o » que la mère et l'observateur interprètent comme *fort*.\n\nUn jour, Freud observe la version complète du jeu. L'enfant tient une bobine attachée à une ficelle. Il la jette par-dessus le bord de son lit à rideaux, où elle disparaît, en disant « o-o-o-o ». Puis il la ramène en tirant sur la ficelle et salue sa réapparition d'un joyeux *da*. Disparition, retour.\n\n## Ce que le jeu accomplit\n\nFreud relie le jeu au départ de la mère. L'enfant ne peut empêcher ses absences ; il les met en scène avec des objets à sa portée. Ce faisant, il passe de la passivité à l'activité : il n'est plus celui que l'on quitte, il est celui qui fait partir.\n\nFreud évoque aussi une satisfaction de vengeance : « eh bien, va-t'en, je n'ai pas besoin de toi, c'est moi qui t'envoie promener ». Et il remarque qu'un autre jour, l'enfant se fait disparaître lui-même dans un miroir.\n\n## Le problème\n\nMais une difficulté persiste. Le premier acte, la disparition, était joué bien plus souvent que le jeu complet. Pourquoi l'enfant répète-t-il ce qui, en lui-même, est pénible ?\n\nOn peut répondre par la maîtrise : rejouer activement ce qu'on a subi passivement. Freud retient cette réponse, mais ne s'en contente pas. Avec les névroses traumatiques et la répétition dans le transfert, ce cas le conduit à une hypothèse : il existe une *compulsion de répétition*, plus originaire que le principe de plaisir. Elle le mènera, au chapitre V, à la pulsion de mort.\n\n## La relecture lacanienne\n\nLacan reviendra à plusieurs reprises sur cette scène. Il y lit l'entrée de l'enfant dans le langage : l'opposition phonématique *o / a* fait exister l'absence comme telle. La bobine n'est pas la mère ; c'est un petit morceau du sujet qui se détache. Le symbole commence par le meurtre de la chose.\n\nLes deux lectures ne s'excluent pas. Toutes deux font de ce jeu minuscule le premier acte d'un sujet qui, faute de pouvoir retenir ce qu'il aime, apprend à le perdre lui-même.","quiz":[{"question":"Que met en scène le jeu de la bobine, selon Freud ?","choix":["La disparition et le retour de la mère, que l'enfant ne peut empêcher","Le désir de l'enfant d'obtenir de nouveaux jouets de ses parents","Une imitation des gestes que le père accomplit à son travail","Un simple exercice de coordination motrice, sans valeur psychique"],"bonne":0,"explication":"Freud rapporte le jeu aux absences de la mère : l'enfant rejoue avec un objet ce qu'il subit. Il ne s'agit ni de l'envie de jouets, ni d'imitation du père, ni d'un exercice moteur."},{"question":"Quel déplacement le jeu permet-il à l'enfant d'opérer ?","choix":["De l'activité à la passivité : il se laisse enfin consoler","De la tristesse à l'indifférence complète envers sa mère","De la passivité à l'activité : il n'est plus quitté, il fait partir","De la parole au silence : il cesse de réclamer sa mère"],"bonne":2,"explication":"L'enfant transforme une situation subie en situation agie. L'inverse ne correspond pas au texte ; Freud ne parle pas d'indifférence, et c'est au contraire l'émergence de la parole (fort / da) qui accompagne le jeu."},{"question":"Pourquoi ce jeu pose-t-il problème au principe de plaisir ?","choix":["Parce que l'enfant semble s'ennuyer en jouant, au lieu d'y prendre plaisir","Parce que la mère désapprouve ce jeu et tente de l'en empêcher","Parce que l'enfant ne parle pas encore et ne peut donc rien exprimer","Parce que l'enfant rejoue le plus souvent la disparition, c'est-à-dire ce qui est pénible"],"bonne":3,"explication":"La répétition privilégiée de la disparition, en elle-même déplaisante, est l'énigme qui conduit Freud vers la compulsion de répétition. L'ennui et la désapprobation maternelle ne sont pas en jeu, et l'enfant prononce déjà des proto-mots."}],"sources":["Sigmund Freud, *Au-delà du principe de plaisir* (1920), dans *Essais de psychanalyse*, Payot, coll. « Petite Bibliothèque Payot ».","Jacques Lacan, « Fonction et champ de la parole et du langage en psychanalyse » (1953), dans *Écrits*, Seuil, 1966."]},{"id":"schopenhauer-pendule","discipline":"philosophie","titre":"Le pendule de la souffrance et de l'ennui","figure":"Arthur Schopenhauer","reference":"Le Monde comme volonté et comme représentation, livre IV, § 57 (1819)","accroche":"Désirer fait souffrir. Obtenir ennuie. Schopenhauer en tire une conclusion que Freud jugera difficile à écarter.","punch":"Le désir manque, l'ennui comble. La vie oscille entre les deux.","idee":"Le fond de toute chose est une volonté aveugle, sans but ni repos. Chez l'homme, elle prend la forme du désir, qui est manque, donc souffrance. Satisfait, le désir s'éteint et laisse place à l'ennui. La vie va de l'un à l'autre, comme un pendule.","citation":"La vie oscille donc comme un pendule, de droite à gauche, de la souffrance à l'ennui.","citation_source":"Schopenhauer, Le Monde comme volonté et comme représentation, § 57 — traduit de l'allemand","liens":["pascal-divertissement","freud-moi-pas-maitre","freud-fort-da"],"texte":"Le grand livre de Schopenhauer paraît en 1819 et passe presque inaperçu. Il faudra attendre les années 1850 pour qu'on le lise vraiment. Son idée directrice : derrière le monde tel qu'il nous apparaît, il y a la *volonté* — non pas une faculté consciente, mais une poussée aveugle, sans fin, qui s'exprime aussi bien dans la pesanteur que dans l'instinct.\n\n## Le désir comme manque\n\nChez l'être humain, la volonté se manifeste comme désir. Or tout désir naît d'un manque, d'un état qui ne nous satisfait pas. Tant qu'il n'est pas satisfait, il est donc souffrance.\n\nEt la satisfaction ? Elle ne dure pas. Elle n'est que la cessation d'une douleur, un état négatif. Un désir comblé fait aussitôt place à un autre ; pour un désir satisfait, dix restent insatisfaits.\n\n## L'ennui\n\nSupposons pourtant que tout soit obtenu, que rien ne manque. Le désir n'ayant plus d'objet, il reste l'existence nue, et elle se révèle dans toute sa vacuité : c'est l'ennui. L'ennui n'est pas un mal mineur ; Schopenhauer y voit un tourment aussi réel que le besoin, dont la société tout entière s'emploie à se défendre.\n\nD'où l'image du § 57 : la vie oscille comme un pendule entre la souffrance et l'ennui. Le besoin est le fléau du peuple, l'ennui celui des gens du monde.\n\n## Les issues\n\nSchopenhauer ne se contente pas de ce constat. Il indique des voies, toutes temporaires sauf la dernière.\n\n**L'art**, d'abord, et surtout la musique, qui suspend un moment la volonté : dans la contemplation esthétique, nous cessons d'être un individu qui veut pour devenir un pur sujet qui connaît.\n\n**La compassion**, ensuite, qui reconnaît dans la souffrance de l'autre la même volonté qui souffre en moi.\n\n**La négation du vouloir-vivre**, enfin, chez l'ascète ou le saint, qui éteint le désir à sa source.\n\n## Ce que Freud y a reconnu\n\nFreud a souvent déclaré n'avoir lu Schopenhauer que tard. Il reconnaît pourtant, dans *Une difficulté de la psychanalyse* (1917), que des philosophes ont précédé la psychanalyse dans l'idée d'une vie psychique dominée par des forces inconscientes, et cite le nom de Schopenhauer, dont la « volonté » inconsciente équivaut aux pulsions. Dans *Au-delà du principe de plaisir* (1920), il note qu'il est entré, sans le vouloir, dans le « port de la philosophie de Schopenhauer ».\n\nLa parenté est réelle et ses limites aussi : Schopenhauer construit une métaphysique, Freud une théorie issue de la clinique. Mais tous deux ont refusé de faire de la conscience la maîtresse du jeu.","quiz":[{"question":"Pourquoi le désir est-il souffrance selon Schopenhauer ?","choix":["Parce qu'il est condamné par la morale religieuse","Parce que tout désir naît d'un manque, d'un état non satisfaisant","Parce qu'il conduit nécessairement à la violence","Parce que la société interdit la plupart des désirs"],"bonne":1,"explication":"Le désir est par essence manque, donc souffrance tant qu'il n'est pas satisfait. Schopenhauer ne raisonne pas en moraliste, ne lie pas le désir à la violence, et l'interdit social n'est pas la cause qu'il invoque."},{"question":"Que se passe-t-il lorsqu'un désir est enfin satisfait ?","choix":["On atteint un bonheur durable et positif, qui ne demande plus rien","La volonté disparaît définitivement, comme chez le saint","La satisfaction s'éteint vite et laisse place à un autre désir ou à l'ennui","On devient incapable de désirer à nouveau quoi que ce soit"],"bonne":2,"explication":"La satisfaction n'est que la cessation d'une douleur ; elle est brève, puis vient un autre désir ou l'ennui. Elle n'a rien de durable ni de positif, et la volonté ne s'abolit que dans la négation du vouloir-vivre, non par la satisfaction."},{"question":"Quelle voie permet une extinction durable de la volonté ?","choix":["L'art, et surtout la musique","La réussite sociale et l'accumulation des richesses","Le progrès scientifique et la maîtrise de la nature","La négation du vouloir-vivre, chez l'ascète ou le saint"],"bonne":3,"explication":"L'art n'apporte qu'une suspension momentanée ; la richesse et le progrès relèvent encore de la volonté qui désire. Seule la négation du vouloir-vivre éteint le désir à sa source."}],"sources":["Arthur Schopenhauer, *Le Monde comme volonté et comme représentation*, trad. Auguste Burdeau, PUF, coll. « Quadrige ».","Sigmund Freud, *Une difficulté de la psychanalyse* (1917) ; *Au-delà du principe de plaisir* (1920), chap. VI."]},{"id":"freud-deuil-melancolie","discipline":"psychanalyse","titre":"Deuil et mélancolie","figure":"Sigmund Freud","reference":"Deuil et mélancolie (rédigé en 1915, publié en 1917)","accroche":"Dans le deuil, c'est le monde qui est devenu pauvre et vide. Dans la mélancolie, c'est le moi. Freud cherche ce qui fait basculer de l'un à l'autre.","punch":"Dans le deuil, le monde s'est vidé. Dans la mélancolie, c'est le moi.","idee":"Le deuil est un travail : retirer, souvenir après souvenir, la libido investie dans l'objet perdu. La mélancolie présente les mêmes traits, plus un : l'effondrement de l'estime de soi. Les autoreproches du mélancolique visent en réalité l'objet perdu, identifié au moi.","citation":"L'ombre de l'objet tomba ainsi sur le moi.","citation_source":"Freud, Deuil et mélancolie (1917) — traduit de l'allemand","liens":["epicure-mort","freud-fort-da","green-mere-morte"],"texte":"Freud écrit ce texte en 1915, en pleine guerre, dans un moment de grande élaboration théorique. Il le publie en 1917. C'est l'un de ses écrits les plus denses, et l'un des plus cliniques.\n\n## Le travail du deuil\n\nFreud commence par le deuil normal, qu'il ne considère pas comme pathologique. Il y décrit une humeur douloureuse, la perte d'intérêt pour le monde extérieur, la perte de la capacité à choisir un nouvel objet d'amour, le détournement de toute activité.\n\nCe qui se passe est un *travail*. L'épreuve de réalité a montré que l'objet aimé n'existe plus, et elle exige que toute la libido soit retirée des liens qui la retenaient à cet objet. Cette exigence suscite une révolte compréhensible. Le travail s'effectue donc en détail, pièce par pièce : chaque souvenir, chaque attente est surinvesti, puis le détachement s'opère. Au terme, le moi redevient libre.\n\n## Ce qui distingue la mélancolie\n\nLa mélancolie présente les mêmes traits, avec un de plus : une diminution extraordinaire du sentiment d'estime de soi, un immense appauvrissement du moi. Le mélancolique se décrit comme indigne, incapable, moralement condamnable ; il s'injurie et attend d'être puni.\n\nFreud propose une formule devenue célèbre : dans le deuil, le monde est devenu pauvre et vide ; dans la mélancolie, c'est le moi lui-même.\n\nAutre différence : le mélancolique sait souvent *qui* il a perdu, mais pas *ce qu'il* a perdu en lui. La perte est en partie soustraite à la conscience.\n\n## La clé des autoreproches\n\nLe pas décisif vient d'une observation clinique. Quand on écoute patiemment les autoaccusations du mélancolique, on remarque qu'elles s'appliquent mal à lui et beaucoup mieux à une autre personne — celle qu'il a aimée, ou aurait dû aimer. Les plaintes sont des *accusations portées contre*.\n\nLe mécanisme : l'objet a été perdu, mais au lieu de se détacher, la libido s'est retirée dans le moi, où elle a servi à établir une identification du moi avec l'objet abandonné. L'ombre de l'objet est tombée sur le moi. Une partie du moi s'oppose désormais à l'autre et la juge, comme elle jugerait l'objet.\n\n## L'ambivalence\n\nPour que ce mouvement se produise, il faut un choix d'objet de type narcissique, et une forte ambivalence : l'amour et la haine pour l'objet coexistent. Si l'amour se réfugie dans l'identification, la haine s'exerce sur cet objet substitutif qu'est devenu le moi.\n\nLe texte prépare des développements majeurs : l'instance critique qui juge le moi deviendra le surmoi (1923), et l'identification aux objets perdus sera pensée comme constitutive du moi lui-même — le moi comme précipité d'investissements d'objet abandonnés.","quiz":[{"question":"Comment Freud décrit-il le travail du deuil ?","choix":["Comme un oubli rapide et volontaire de l'objet perdu","Comme un détachement progressif de la libido, souvenir par souvenir","Comme une maladie qu'il faut traiter au plus vite par des médicaments","Comme le remplacement immédiat de l'objet par un autre"],"bonne":1,"explication":"Le deuil s'effectue en détail : chaque souvenir est surinvesti puis détaché. Il n'est ni rapide ni volontaire, Freud ne le tient pas pour pathologique, et la difficulté à investir un nouvel objet fait précisément partie de ses signes."},{"question":"Quel trait distingue la mélancolie du deuil ?","choix":["La perte d'intérêt pour tout ce qui concerne le monde extérieur","L'humeur profondément douloureuse","L'effondrement de l'estime de soi et l'appauvrissement du moi","L'inhibition de toute activité"],"bonne":2,"explication":"Les trois autres traits sont communs au deuil et à la mélancolie. Ce qui s'ajoute dans la mélancolie, c'est l'abaissement de l'estime de soi : dans le deuil, le monde se vide ; dans la mélancolie, c'est le moi."},{"question":"Que révèlent les autoreproches du mélancolique ?","choix":["Une lucidité exceptionnelle sur ses propres défauts, enfin aperçus","Une simple exagération, sans signification pour l'analyse","Des reproches adressés à l'objet perdu, retournés sur le moi par identification","Un désir conscient d'attirer la compassion de l'entourage"],"bonne":2,"explication":"Ces accusations s'appliquent mieux à une autre personne aimée : l'objet perdu, avec lequel le moi s'est identifié. Freud prend au sérieux leur contenu sans y voir une lucidité supérieure, refuse de les réduire à une exagération, et le mécanisme n'est pas conscient."}],"sources":["Sigmund Freud, « Deuil et mélancolie » (1917), dans *Métapsychologie*, Gallimard, coll. « Folio Essais ».","Sigmund Freud, *Le Moi et le Ça* (1923), chap. III."]},{"id":"epicure-mort","discipline":"philosophie","titre":"La mort n'est rien pour nous","figure":"Épicure","reference":"Lettre à Ménécée, 124–127 (IIIe s. av. J.-C.)","accroche":"Épicure propose un argument de six lignes contre la peur de mourir. Vingt-trois siècles plus tard, personne ne l'a réfuté proprement. Presque personne n'en est consolé.","punch":"Quand nous sommes, la mort n'est pas là. Quand elle est là, nous ne sommes plus.","idee":"Tout bien et tout mal résident dans la sensation ; la mort est privation de sensation. Elle ne peut donc nous atteindre ni vivants ni morts. Ce qui fait souffrir, c'est l'attente — et l'attente d'un rien est vaine.","citation":"La mort n'est rien pour nous.","citation_source":"Épicure, Lettre à Ménécée, 124 — traduit du grec","liens":["freud-deuil-melancolie","schopenhauer-pendule","pascal-divertissement"],"texte":"La *Lettre à Ménécée* est un abrégé. Épicure y condense pour un disciple ce qu'il faut tenir pour vivre heureux. La tradition en a tiré le « quadruple remède » : les dieux ne sont pas à craindre, la mort n'est pas à redouter, le bien est facile à obtenir, le mal facile à supporter.\n\nLe deuxième point tient en un argument d'une sécheresse admirable.\n\n## L'argument\n\nPremier temps : tout bien et tout mal résident dans la sensation. C'est la thèse générale de l'éthique épicurienne — le plaisir et la douleur sont les critères de ce qui nous importe.\n\nDeuxième temps : la mort est privation de sensation. Pour un atomiste, mourir, c'est la dispersion des atomes qui composent l'âme. Il n'y a personne pour faire l'expérience d'être mort.\n\nConclusion : la mort n'est rien pour nous. Tant que nous sommes, elle n'est pas là ; quand elle est là, nous ne sommes plus. Elle ne concerne donc ni les vivants, puisqu'elle n'est pas pour eux, ni les morts, puisqu'ils ne sont plus.\n\n## L'attente\n\nÉpicure ajoute une remarque psychologique fine : est sot celui qui dit craindre la mort non parce qu'elle le fera souffrir quand elle sera là, mais parce qu'il souffre de l'attendre. Ce qui ne nous trouble pas quand il est présent ne peut nous affliger que vainement quand on l'attend.\n\nLe but n'est pas de rendre la vie plus longue, mais de supprimer le désir d'immortalité. La vie n'est pas meilleure parce qu'elle dure ; comme d'un repas, on ne choisit pas le plus abondant mais le plus agréable.\n\n## Les objections qui résistent\n\nL'argument a suscité deux grandes familles d'objections.\n\n**La privation.** Thomas Nagel (« Death », 1970) soutient qu'on peut être lésé sans en faire l'expérience : être trahi à son insu reste un tort. La mort serait un mal par ce qu'elle nous ôte — les biens que nous aurions eus.\n\n**L'asymétrie.** Lucrèce avait anticipé une réplique : nous ne nous affligeons pas du temps infini qui a précédé notre naissance ; pourquoi s'affliger de celui qui suivra notre mort ? Mais nous ne vivons pas ces deux néants de la même manière, et c'est justement ce qu'il faudrait expliquer.\n\n## Ce que l'argument laisse de côté\n\nL'argument parle de *ma* mort. Il ne dit à peu près rien de la mort des autres, qui, elle, est une expérience — celle de la perte. Les épicuriens recommandaient le souvenir reconnaissant des amis disparus. C'est une indication précieuse, mais elle laisse ouverte la question de ce que l'on fait, au juste, de ceux qui ne sont plus.","quiz":[{"question":"Sur quelle prémisse repose l'argument d'Épicure contre la crainte de la mort ?","choix":["L'âme survit au corps et rejoint les dieux","Tout bien et tout mal résident dans la sensation","La vie humaine n'a pas de valeur en elle-même","La douleur de l'agonie est toujours brève"],"bonne":1,"explication":"Si bien et mal résident dans la sensation et que la mort en est la privation, elle ne peut être un mal pour nous. Épicure nie au contraire la survie de l'âme ; il ne dévalue pas la vie, il en veut la meilleure qualité ; la brièveté de la douleur est une autre thèse du quadruple remède."},{"question":"Que reproche Épicure à celui qui souffre d'attendre la mort ?","choix":["De s'affliger vainement d'une chose qui ne le troublera pas quand elle sera là","De ne pas assez préparer ses funérailles et sa sépulture","De manquer de foi dans les dieux qui protègent les mortels","De ne pas profiter du temps qui lui reste pour s'enrichir"],"bonne":0,"explication":"Ce qui ne trouble pas quand il est présent ne peut affliger que vainement quand on l'attend. L'épicurisme se désintéresse des rites, ne demande aucune foi en des dieux qui ne s'occupent pas de nous, et tient la richesse pour un désir non nécessaire."},{"question":"Quelle objection Thomas Nagel adresse-t-il à l'argument ?","choix":["La mort fait souffrir physiquement, donc elle est un mal","Les atomes de l'âme ne se dispersent pas","La mort est un bien puisqu'elle libère du corps","On peut être lésé sans en faire l'expérience : la mort prive de biens futurs"],"bonne":3,"explication":"Pour Nagel, comme une trahison qu'on ignore, la mort peut être un tort par ce qu'elle nous retire. Il ne parle pas de la douleur physique, ne discute pas la physique atomiste et ne défend pas l'idée platonicienne d'une libération par la mort."}],"sources":["Épicure, *Lettre à Ménécée*, dans *Lettres et maximes*, trad. Marcel Conche, PUF, 1987.","Lucrèce, *De la nature*, livre III, v. 830–977.","Thomas Nagel, « Death », *Noûs*, 4 (1), 1970."]},{"id":"freud-inquietante-etrangete","discipline":"psychanalyse","titre":"L'inquiétante étrangeté","figure":"Sigmund Freud","reference":"Das Unheimliche (1919)","accroche":"Ce qui nous glace n'est pas l'inconnu. C'est le familier qui revient là où on ne l'attendait pas. Freud mène l'enquête dans un dictionnaire.","punch":"L'étrangement inquiétant, c'est le familier qui revient d'ailleurs.","idee":"Le mot allemand unheimlich (non familier) finit, dans certains usages, par coïncider avec son contraire heimlich (familier, puis secret). Freud en tire sa thèse : l'inquiétante étrangeté naît du retour de quelque chose de connu depuis longtemps, que le refoulement avait rendu étranger.","citation":"Est unheimlich tout ce qui devait rester un secret, dans l'ombre, et qui en est sorti.","citation_source":"Schelling, cité par Freud dans Das Unheimliche (1919) — traduit de l'allemand","liens":["kierkegaard-angoisse","husserl-epoche","lacan-stade-du-miroir"],"texte":"Freud s'excuse presque d'écrire ce texte : l'esthétique n'est pas son domaine. Mais il a remarqué un sentiment particulier, cousin de l'angoisse, que les traités d'esthétique négligent. Le mot allemand est *unheimlich*. Les traductions françaises hésitent : « inquiétante étrangeté », « l'étrangement inquiétant », « l'inquiétant ».\n\n## L'enquête lexicale\n\nFreud ouvre les dictionnaires. *Heimlich* vient de *Heim*, la maison : c'est ce qui est familier, intime, domestique. *Unheimlich* serait donc le non familier, et l'on pourrait croire que ce qui effraie est simplement le nouveau.\n\nMais Freud remarque que *heimlich* a aussi un second sens : ce qui est caché, dissimulé, tenu secret — ce qu'on garde à la maison, à l'abri des regards. Et dans ce second sens, il rejoint son contraire. C'est chez Schelling qu'il trouve la définition qui l'éclaire : est *unheimlich* tout ce qui devait rester secret, caché, et qui s'est manifesté.\n\n## L'Homme au sable\n\nFreud analyse ensuite un conte de E. T. A. Hoffmann, *L'Homme au sable* (1816). Le jeune Nathanaël est poursuivi par la figure de Coppelius, l'homme qui, dans les récits de sa nourrice, arrache les yeux des enfants. Contre l'interprétation de Jentsch, qui voyait la source de l'inquiétant dans l'incertitude sur la poupée Olympia (vivante ou automate ?), Freud déplace l'accent : l'effet tient à la menace de perdre les yeux, substitut de l'angoisse de castration.\n\n## Les sources de l'inquiétant\n\nFreud dresse une liste : le double, la répétition involontaire du même (revenir sans le vouloir dans la même rue), la toute-puissance des pensées, l'animisme, les morts qui reviennent. Il les ramène à deux origines.\n\nSoit le retour de complexes infantiles refoulés — l'angoisse de castration, le fantasme du sein maternel.\n\nSoit la réapparition de convictions primitives dépassées — la toute-puissance de la pensée, le retour des morts — qui semblent soudain confirmées par l'événement.\n\nDans les deux cas, ce qui inquiète n'est pas nouveau. C'est quelque chose de familier, d'anciennement connu, que le refoulement a rendu étranger.\n\n## Le préfixe\n\nD'où une remarque d'une grande portée : le préfixe *un-* de *unheimlich* est la marque du refoulement. Le négatif ne supprime pas le familier ; il en signe le retour déguisé.\n\nFreud termine sur une distinction utile : la fiction peut produire de l'inquiétant que la vie ne produirait pas, et neutraliser celui de la vie quand l'auteur nous installe dans un monde ouvertement merveilleux. Le conte de fées n'inquiète pas. L'inquiétant suppose un monde qu'on croyait réel.","quiz":[{"question":"Que découvre Freud en examinant le mot heimlich ?","choix":["Qu'il n'a qu'un seul sens, celui de familier, sans aucune ambiguïté","Qu'il possède aussi le sens de caché, secret, et rejoint ainsi son contraire unheimlich","Qu'il est d'origine latine et désignait autrefois le foyer romain","Qu'il désigne exclusivement les fantômes et les morts qui reviennent"],"bonne":1,"explication":"Heimlich signifie à la fois familier et secret ; dans ce second sens, il coïncide avec unheimlich. L'enquête montre justement l'ambivalence du mot, qui vient de Heim, la maison, et non du latin."},{"question":"Comment Freud interprète-t-il L'Homme au sable de Hoffmann ?","choix":["L'inquiétant tient à l'incertitude sur la poupée Olympia, vivante ou automate","Le conte n'a rien d'inquiétant selon lui","L'effet tient à la menace de perdre les yeux, substitut de l'angoisse de castration","Le conte est une simple critique des automates de l'époque"],"bonne":2,"explication":"Freud s'oppose à Jentsch, qui plaçait l'inquiétant dans l'incertitude sur Olympia, et recentre l'analyse sur l'Homme au sable qui arrache les yeux. Il juge au contraire le conte exemplaire de l'inquiétant."},{"question":"Que signifie le préfixe un- dans unheimlich selon Freud ?","choix":["Une simple négation qui fait disparaître le familier","Une marque de politesse dans la langue allemande","L'indication que l'objet est totalement nouveau","La marque du refoulement : le familier revient, déguisé en étranger"],"bonne":3,"explication":"Le préfixe ne supprime pas le familier, il signe son retour après refoulement. L'inquiétant n'est pas le nouveau, c'est l'anciennement connu devenu étranger."}],"sources":["Sigmund Freud, « L'inquiétante étrangeté » (1919), dans *L'Inquiétante Étrangeté et autres essais*, Gallimard, coll. « Folio Essais ».","E. T. A. Hoffmann, *L'Homme au sable* (1816)."]},{"id":"kierkegaard-angoisse","discipline":"philosophie","titre":"L'angoisse, vertige de la liberté","figure":"Søren Kierkegaard","reference":"Le Concept d'angoisse (1844), sous le pseudonyme de Vigilius Haufniensis","accroche":"La peur a un objet. L'angoisse n'en a pas — ou plutôt, son objet est un rien. Kierkegaard y voit la marque même de la liberté.","punch":"L'angoisse n'a pas d'objet. Elle a un possible.","idee":"L'angoisse se distingue de la peur : elle ne porte sur rien de déterminé, mais sur le possible. Devant l'abîme, ce qui donne le vertige n'est pas le vide, c'est la possibilité de s'y jeter. L'angoisse est le vertige de la liberté.","citation":"L'angoisse est le vertige de la liberté.","citation_source":"Kierkegaard, Le Concept d'angoisse, chap. II (1844) — traduit du danois","liens":["freud-inquietante-etrangete","pascal-divertissement","freud-moi-pas-maitre"],"texte":"*Le Concept d'angoisse* paraît en 1844 sous un pseudonyme, comme presque toute l'œuvre de Kierkegaard. Le sous-titre annonce une « simple méditation psychologique » sur le péché originel. Derrière la question théologique, Kierkegaard élabore une des descriptions les plus précises qu'on ait de l'angoisse.\n\n## Peur et angoisse\n\nLa première distinction est devenue classique. La peur se rapporte à quelque chose de déterminé : un danger, une menace identifiable. L'angoisse, elle, n'a pas d'objet assignable. Son objet est un *rien*.\n\nCe rien n'est pas un néant pur. C'est le possible : ce qui n'est pas encore, ce que je pourrais faire ou devenir. L'angoisse est la réalité de la liberté comme possibilité avant la possibilité.\n\n## L'innocence et l'interdit\n\nKierkegaard relit la scène de la Genèse. Adam, dans l'innocence, ne sait pas ce que sont le bien et le mal. L'interdit — « tu ne mangeras pas » — l'angoisse, parce qu'il éveille en lui la possibilité de la liberté. Il ne sait pas ce qu'il peut, mais il sent qu'il peut.\n\nL'angoisse est donc ambiguë : une « antipathie sympathique et une sympathie antipathique ». Elle attire ce qu'elle redoute et redoute ce qui l'attire. On la compare à ce que l'enfant éprouve devant l'aventureux, l'énigmatique : un mélange de crainte et de désir.\n\n## Le vertige\n\nD'où l'image célèbre. Celui dont l'œil plonge dans un abîme béant est pris de vertige. Mais la cause en est autant son œil que l'abîme : s'il n'avait pas regardé en bas… Ainsi l'angoisse est le vertige de la liberté, qui naît lorsque l'esprit veut poser la synthèse et que la liberté, plongeant dans sa propre possibilité, saisit la finitude pour s'y retenir.\n\nCe n'est pas le vide qui fait peur. C'est la possibilité de s'y jeter.\n\n## Une éducation par l'angoisse\n\nLe dernier chapitre surprend : l'angoisse y est présentée comme une formatrice. Celui qui a appris à s'angoisser comme il faut a appris le plus haut. L'angoisse dévore tout le fini et découvre ses illusions ; elle forme l'individu à la foi, qui seule lui permet de la traverser sans la fuir.\n\nOn peut ne pas suivre Kierkegaard jusqu'à la foi et retenir la structure. L'angoisse n'est pas un dysfonctionnement à supprimer : elle signale le rapport d'un sujet à son propre possible. Heidegger la reprendra en en faisant une tonalité fondamentale ; Freud, d'une autre manière, comme un signal adressé au moi.","quiz":[{"question":"Qu'est-ce qui distingue l'angoisse de la peur selon Kierkegaard ?","choix":["La peur a un objet déterminé, l'angoisse a pour objet un rien, le possible","La peur est mentale, l'angoisse est corporelle","L'angoisse est simplement une peur plus intense","La peur est réservée aux enfants, l'angoisse aux adultes"],"bonne":0,"explication":"L'angoisse ne porte sur rien de déterminé : son « objet » est le possible, la liberté elle-même. Kierkegaard ne la définit pas par le corps, ni comme un degré de la peur, et il décrit au contraire une angoisse déjà présente dans l'innocence enfantine."},{"question":"Que montre l'image du vertige devant l'abîme ?","choix":["Que la hauteur est objectivement dangereuse pour quiconque s'en approche","Que l'homme a naturellement peur du vide, par un instinct de survie","Que le vertige vient autant du regard, donc de la possibilité de se jeter, que de l'abîme","Qu'il faut éviter de s'approcher des précipices et rester sur la terre ferme"],"bonne":2,"explication":"Le vertige tient au rapport entre l'œil et l'abîme : c'est la possibilité de se jeter qui donne le vertige, comme la liberté face à son propre possible. Le danger objectif, la peur innée du vide ou un conseil de prudence manquent ce point."},{"question":"Quel rôle le dernier chapitre attribue-t-il à l'angoisse ?","choix":["Un symptôme qu'il faut éliminer par la raison et la volonté","Une éducatrice qui découvre les illusions du fini et forme l'individu","Une punition divine infligée à l'homme pour le péché","Un état réservé aux esprits faibles et mélancoliques"],"bonne":1,"explication":"Celui qui a appris à s'angoisser comme il faut « a appris le plus haut » : l'angoisse éduque. Kierkegaard ne veut ni l'éliminer, ni en faire une punition, ni la réserver aux faibles."}],"sources":["Søren Kierkegaard, *Le Concept d'angoisse*, trad. Knud Ferlov et Jean-J. Gateau, Gallimard, coll. « Tel ».","Søren Kierkegaard, *La Maladie à la mort* (1849)."]},{"id":"klein-positions","discipline":"psychanalyse","titre":"Les deux positions","figure":"Melanie Klein","reference":"Contribution à l'étude de la psychogenèse des états maniaco-dépressifs (1935) ; Notes sur quelques mécanismes schizoïdes (1946)","accroche":"Pour Melanie Klein, le nourrisson ne vit pas dans un monde paisible. Il aime et hait avec une violence extrême — et la santé psychique commence le jour où il découvre que c'est la même personne.","punch":"Grandir, c'est découvrir qu'on a haï ce qu'on aime.","idee":"Dans la position schizo-paranoïde, le bébé clive l'objet en « bon » et « mauvais » sein et projette sa haine au dehors. Dans la position dépressive, il découvre que l'objet aimé et l'objet haï sont un seul et même objet : naissent alors la culpabilité, le souci et le désir de réparer.","repere":"Position, et non stade : Klein choisit ce mot pour désigner une configuration d'angoisses, de défenses et de relations d'objet qui n'est jamais dépassée une fois pour toutes. On oscille entre les deux toute sa vie.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","freud-deuil-melancolie"],"texte":"Melanie Klein est une des figures les plus controversées de l'histoire de la psychanalyse. Installée à Londres en 1926, elle développe une technique d'analyse des enfants par le jeu et une théorie des premiers mois de la vie qui va diviser la Société britannique dans les « Controverses » de 1941–1945, face à Anna Freud.\n\n## Des objets internes\n\nKlein part d'une intuition : le nourrisson a, dès le départ, une vie fantasmatique intense. Il n'a pas affaire à sa mère comme personne totale, mais à des *objets partiels* — d'abord le sein. Et ces objets, il les introjecte : ils deviennent des objets internes qui peuplent son monde psychique.\n\nElle donne un poids considérable à la pulsion de mort, qui se manifeste dès l'origine sous forme d'angoisse et d'agressivité.\n\n## La position schizo-paranoïde\n\nDans les premiers mois, le nourrisson fait face à une angoisse d'anéantissement. Pour s'en défendre, il *clive* : le bon sein, qui nourrit et apaise, est maintenu séparé du mauvais sein, qui frustre et persécute. Il *projette* ses propres pulsions destructrices sur l'objet, qui devient persécuteur.\n\nL'angoisse dominante est *persécutive* : la crainte d'être attaqué, détruit. Klein décrit aussi l'*identification projective* (1946) : des parties du soi sont expulsées dans l'objet pour le contrôler ou s'en débarrasser.\n\nCe n'est pas une pathologie : c'est une organisation nécessaire, qui protège le bon objet et permet de commencer à intégrer l'expérience.\n\n## La position dépressive\n\nVers le quatrième mois environ, à mesure que la perception s'unifie, l'enfant découvre que le bon sein et le mauvais sein appartiennent à une seule personne — la mère, perçue comme objet total. Celle qu'il a attaquée en fantasme est celle qu'il aime.\n\nL'angoisse change de nature : elle devient *dépressive*. L'enfant craint d'avoir détruit, ou de détruire, l'objet aimé. Apparaissent la culpabilité, le souci pour l'autre, la tristesse — et le désir de *réparation*.\n\nKlein y voit le cœur du développement psychique. La capacité à supporter l'ambivalence, à tenir ensemble amour et haine pour la même personne, conditionne la capacité à faire le deuil, à créer, à aimer.\n\n## Une oscillation permanente\n\nL'apport le plus durable tient peut-être au mot « position ». On ne « passe » pas d'une position à l'autre. Sous l'effet de l'angoisse, chacun régresse vers le clivage et la persécution ; on reconquiert la position dépressive à chaque deuil. Bion notera ce va-et-vient d'une flèche double : PS ↔ D.","quiz":[{"question":"Quel mécanisme caractérise la position schizo-paranoïde ?","choix":["Le clivage de l'objet en bon et mauvais sein, avec projection de la haine au dehors","La réparation de l'objet aimé que l'on croit avoir détruit en fantasme","Le refoulement des désirs œdipiens","La sublimation des pulsions dans l'art"],"bonne":0,"explication":"Le clivage maintient séparés le bon et le mauvais objet, et la projection fait de l'objet un persécuteur. La réparation appartient à la position dépressive ; le refoulement et la sublimation relèvent d'une organisation psychique plus tardive."},{"question":"Que découvre l'enfant dans la position dépressive ?","choix":["Que sa mère le déteste réellement et souhaite s'en séparer","Qu'il n'a plus besoin de sa mère pour être nourri","Que l'objet aimé et l'objet haï sont une seule et même personne","Que le monde extérieur n'existe pas en dehors de lui"],"bonne":2,"explication":"L'unification de l'objet confronte l'enfant à son ambivalence : celle qu'il a attaquée est celle qu'il aime. Il ne découvre ni une haine réelle de la mère, ni une indépendance, et c'est au contraire la perception de la réalité extérieure qui s'affermit."},{"question":"Pourquoi Klein parle-t-elle de « position » plutôt que de « stade » ?","choix":["Parce qu'elle refuse toute idée de développement psychique de l'enfant","Parce que ces positions ne concernent que les adultes en analyse","Parce que le mot avait été imposé par Freud à ses élèves","Parce que ces configurations ne sont jamais dépassées : on oscille entre elles"],"bonne":3,"explication":"Une position est une organisation d'angoisses et de défenses qui reste disponible toute la vie. Klein ne nie pas le développement, elle situe ces positions dès la première année, et ce terme est le sien, non celui de Freud."}],"sources":["Melanie Klein, *Essais de psychanalyse (1921–1945)*, Payot, 1967.","Melanie Klein, « Notes sur quelques mécanismes schizoïdes » (1946), dans Klein, Heimann, Isaacs, Riviere, *Développements de la psychanalyse*, PUF, 1966.","Hanna Segal, *Introduction à l'œuvre de Melanie Klein*, PUF, 1969."]},{"id":"aristote-akrasia","discipline":"philosophie","titre":"L'akrasia","figure":"Aristote","reference":"Éthique à Nicomaque, livre VII, chap. 1–10 (IVe s. av. J.-C.)","accroche":"Vous savez que c'est une mauvaise idée. Vous le faites quand même. Socrate disait que c'était impossible. Aristote prend le parti des faits.","punch":"Savoir ce qui est bien et faire le contraire : Socrate le jugeait impossible.","idee":"Pour Socrate, nul ne fait le mal volontairement : agir mal, c'est ignorer. Aristote objecte que l'incontinent sait, mais d'un savoir qu'il « a » sans l'exercer, comme l'homme ivre récite des vers qu'il ne comprend pas.","repere":"Akrasia (ἀκρασία) : littéralement « absence de maîtrise ». On traduit par incontinence ou faiblesse de la volonté. Son contraire est l'enkrateia, la maîtrise de soi.","liens":["freud-moi-pas-maitre","spinoza-desir","pascal-divertissement"],"texte":"Socrate soutenait une thèse qui semble contredire l'expérience la plus banale : personne ne commet le mal en sachant que c'est le mal. Si quelqu'un agit mal, c'est qu'il se trompe sur ce qui est bon pour lui. La vertu est un savoir, le vice une ignorance.\n\nAristote ouvre le livre VII de l'*Éthique à Nicomaque* en constatant que cette thèse heurte « ce qui paraît manifestement ». Il y a bien des gens qui savent qu'une chose est mauvaise et la font, entraînés par le désir. Mais il ne se contente pas de donner tort à Socrate : il cherche en quel sens on peut savoir et agir contre son savoir.\n\n## Avoir un savoir sans s'en servir\n\nLa distinction centrale est entre posséder un savoir et l'exercer. Le géomètre endormi sait la géométrie, mais ne s'en sert pas à cet instant. L'incontinent est dans une situation voisine : son savoir est comme suspendu par la passion.\n\nAristote donne des images frappantes : l'homme ivre, le dormeur, le fou, ou encore l'élève qui récite des enchaînements de mots sans les avoir assimilés. Les incontinents peuvent prononcer les bonnes maximes ; cela ne prouve pas qu'ils les aient à l'esprit au moment d'agir.\n\n## Le syllogisme pratique\n\nAristote décrit l'action comme la conclusion d'un raisonnement. Une prémisse générale (« il ne faut pas goûter ce qui est sucré »), une prémisse particulière (« ceci est sucré »), et l'action suit. Chez l'incontinent, une autre prémisse générale est présente (« le sucré est agréable »), et c'est l'appétit qui s'empare de la prémisse particulière. Il agit « en quelque sorte sous l'effet d'une raison et d'une opinion », mais d'une opinion qui n'est contraire à la droite règle que par accident.\n\nD'où une conclusion nuancée : en un sens, Socrate avait raison. Ce n'est pas la science au sens plein qui est vaincue par la passion, c'est une connaissance qui porte sur le particulier et qui n'était pas pleinement actualisée.\n\n## Incontinent et intempérant\n\nAristote distingue soigneusement l'incontinent (*akratês*) de l'intempérant (*akolastos*). L'intempérant poursuit le plaisir par choix délibéré, persuadé que c'est bien ; il ne regrette rien, et c'est pourquoi il est difficilement guérissable. L'incontinent, lui, agit contre son propre choix et le regrette. Il est divisé.\n\nCette division intérieure — vouloir et ne pas vouloir, savoir et ne pas savoir — est l'un des plus anciens points d'appui de la réflexion sur le sujet. Aristote la pense encore dans les termes d'une âme où la raison devrait commander. Il faudra attendre longtemps pour qu'on se demande si ce qui « l'emporte » ne parle pas lui aussi une langue, avec ses raisons propres.","quiz":[{"question":"Quelle thèse socratique l'analyse de l'akrasia met-elle en difficulté ?","choix":["Nul ne fait le mal volontairement, car agir mal revient à ignorer le bien","La vertu ne peut pas s'enseigner, puisque les sages n'ont pas de disciples","Le plaisir est le seul bien véritable pour l'être humain","La cité juste exige que les philosophes gouvernent"],"bonne":0,"explication":"Socrate assimile la vertu à un savoir et la faute à une ignorance : l'akrasia, où l'on agit contre ce qu'on sait, semble le contredire. La thèse sur l'enseignement de la vertu est discutée ailleurs (dans le Ménon notamment), l'hédonisme n'est pas la position socratique, et le philosophe-roi relève de la République."},{"question":"Quelle distinction permet à Aristote d'expliquer qu'on agisse contre son savoir ?","choix":["Entre savoir divin et savoir humain","Entre ce que l'on désire et ce que l'on mérite","Entre posséder un savoir et l'exercer effectivement","Entre la mémoire et l'imagination"],"bonne":2,"explication":"Comme le géomètre endormi, l'incontinent possède un savoir qu'il n'actualise pas au moment d'agir. Les autres distinctions ne jouent aucun rôle dans l'argument du livre VII."},{"question":"En quoi l'incontinent diffère-t-il de l'intempérant ?","choix":["L'incontinent recherche les plaisirs avec plus de mesure","L'intempérant ignore ce qu'est le plaisir","Il n'y a aucune différence, Aristote emploie les deux mots indifféremment","L'incontinent agit contre son choix et le regrette ; l'intempérant, par choix"],"bonne":3,"explication":"L'intempérant poursuit le plaisir par choix délibéré, convaincu que c'est bien : il n'est pas divisé. L'incontinent agit contre ce qu'il a choisi et se repent. Aristote tient fermement à la distinction ; elle ne porte ni sur la mesure ni sur la connaissance du plaisir."}],"sources":["Aristote, *Éthique à Nicomaque*, livre VII, trad. Richard Bodéüs, GF-Flammarion, 2004.","Platon, *Protagoras*, 352b–358d : la thèse socratique discutée par Aristote."]},{"id":"winnicott-mere-suffisamment-bonne","discipline":"psychanalyse","titre":"La mère suffisamment bonne","figure":"Donald W. Winnicott","reference":"Objets transitionnels et phénomènes transitionnels (1951–1953) ; Jeu et réalité (1971)","accroche":"Winnicott n'a jamais demandé aux mères d'être parfaites. Il leur a demandé d'échouer — juste ce qu'il faut, et au bon moment.","punch":"Une mère parfaite empêcherait l'enfant de naître à lui-même.","idee":"Au début, la mère s'adapte presque totalement aux besoins du bébé, qui peut ainsi éprouver l'illusion de créer ce qu'il trouve. Puis elle échoue progressivement, à la mesure de ce qu'il peut tolérer. Entre l'illusion et la désillusion s'ouvre l'aire transitionnelle, celle du jeu et de la culture.","citation":"Un bébé, ça n'existe pas.","citation_source":"Winnicott, propos tenu vers 1940 devant la Société britannique de psychanalyse, repris dans « L'angoisse associée à l'insécurité » (1952) — traduit de l'anglais","liens":["lacan-stade-du-miroir","klein-positions","bion-reverie"],"texte":"Pédiatre avant d'être psychanalyste, Winnicott a vu, dit-on, plus de soixante mille couples mère-enfant en consultation. Il a été formé dans l'orbite de Melanie Klein, puis s'en est éloigné en accordant à l'environnement réel un poids que Klein lui refusait.\n\n## Un bébé, ça n'existe pas\n\nLa phrase lui échappe un jour lors d'une réunion de la Société britannique : *there is no such thing as a baby*. Il veut dire que si l'on cherche à décrire un bébé, on décrit toujours un bébé *et quelqu'un*. Au début, il n'y a pas d'individu isolé : il y a une unité formée par le nourrisson et les soins maternels.\n\n## L'adaptation, puis l'échec\n\nDans les premières semaines, la mère se trouve dans un état particulier, la *préoccupation maternelle primaire*, qui lui permet de s'identifier au bébé et de s'adapter presque parfaitement à ses besoins. Quand le bébé a faim et qu'il imagine quelque chose, le sein est là. Il peut ainsi avoir l'*illusion* d'avoir créé ce qu'il trouve.\n\nCette illusion n'est pas une erreur à corriger : elle est le fondement de la créativité, du sentiment que le monde peut répondre.\n\nMais la mère « suffisamment bonne » (*good enough*) est celle qui, ensuite, s'adapte de moins en moins, en fonction de la capacité croissante de l'enfant à tolérer la frustration. Elle échoue, mais progressivement. Une adaptation parfaite qui se prolongerait serait magique, et priverait l'enfant de la découverte de la réalité.\n\n## L'objet transitionnel\n\nEntre l'illusion et la désillusion apparaît le *premier objet possession non-moi* : le bout de couverture, la peluche, le coin de drap que l'enfant suce en s'endormant. Cet objet n'est ni tout à fait intérieur (une hallucination) ni tout à fait extérieur (un objet comme un autre). Il appartient à une *aire intermédiaire*.\n\nWinnicott insiste sur un point : on ne doit pas demander à l'enfant si cet objet, il l'a créé ou trouvé. La question ne doit pas être posée. C'est ce paradoxe accepté qui rend l'aire transitionnelle vivable.\n\n## Le jeu et la culture\n\nL'objet transitionnel finit par perdre son sens, sans être oublié ni pleuré. Mais l'aire qu'il a ouverte demeure. Elle s'étend au jeu, à l'art, à la religion, à la vie imaginative, au travail scientifique créatif.\n\nD'où la conception winnicottienne de la cure : la psychanalyse se situe là où deux aires de jeu se chevauchent, celle du patient et celle du thérapeute. Si le patient ne peut pas jouer, le premier travail consiste à le rendre capable de jouer.","quiz":[{"question":"Que signifie la formule « un bébé, ça n'existe pas » ?","choix":["Que les bébés n'ont pas encore de véritable vie psychique propre","Que la naissance est, pour la psyché, un événement sans importance","Qu'on ne peut décrire un bébé sans décrire aussi celui ou celle qui prend soin de lui","Que les bébés sont des fictions inventées par les adultes qui les observent"],"bonne":2,"explication":"Au début, il n'y a pas d'individu isolé mais une unité nourrisson-soins maternels. Winnicott ne nie évidemment pas la vie psychique du bébé, il lui donne au contraire une grande richesse."},{"question":"Pourquoi la mère doit-elle « échouer » progressivement ?","choix":["Pour punir l'enfant de ses exigences","Parce qu'aucune mère n'a le temps de bien s'occuper de son bébé","Pour permettre à l'enfant de découvrir la réalité, à la mesure de ce qu'il peut tolérer","Pour que l'enfant s'attache davantage à son père"],"bonne":2,"explication":"Une adaptation parfaite prolongée serait magique et empêcherait la découverte de la réalité. L'échec doit être progressif et ajusté. Il n'a rien de punitif, ne relève pas d'une fatalité, et ne vise pas à déplacer l'attachement."},{"question":"Quelle question ne faut-il pas poser à propos de l'objet transitionnel ?","choix":["« L'as-tu créé ou l'as-tu trouvé ? »","« Pourquoi y tiens-tu autant ? »","« Où l'as-tu laissé ? »","« Peut-on le laver ? »"],"bonne":0,"explication":"Le paradoxe d'un objet à la fois créé et trouvé doit être accepté, non résolu : c'est ce qui rend l'aire transitionnelle possible. Les autres questions sont anecdotiques ; Winnicott remarque d'ailleurs que les parents évitent souvent de laver l'objet."}],"sources":["D. W. Winnicott, *Jeu et réalité. L'espace potentiel*, Gallimard, 1975.","D. W. Winnicott, *De la pédiatrie à la psychanalyse*, Payot, 1969."]},{"id":"husserl-epoche","discipline":"philosophie","titre":"L'épochè","figure":"Edmund Husserl","reference":"Idées directrices pour une phénoménologie, I, § 27–32 (1913)","accroche":"Husserl ne doute pas que le monde existe. Il décide simplement de ne plus s'en servir — et c'est ainsi qu'il le voit vraiment.","punch":"Ne pas nier le monde. Le mettre entre parenthèses.","idee":"Dans l'attitude naturelle, nous croyons au monde sans même y penser. L'épochè suspend cette croyance sans la nier, pour regarder comment le monde se donne à la conscience. Ce qui était évident devient un phénomène à décrire.","repere":"Épochè (ἐποχή) : mot des sceptiques grecs, « suspension du jugement ». Husserl en fait une opération méthodique, la « mise entre parenthèses » de la thèse d'existence du monde, qui ouvre la réduction phénoménologique.","liens":["descartes-malin-genie","freud-inquietante-etrangete","wittgenstein-taire"],"texte":"Les *Recherches logiques* (1900–1901) lançaient un mot d'ordre : revenir aux choses mêmes. Les *Idées directrices* de 1913 donnent la méthode pour y parvenir, et elle passe par un geste paradoxal : pour revenir aux choses, il faut d'abord cesser de croire naïvement en elles.\n\n## L'attitude naturelle\n\nHusserl commence par décrire notre manière ordinaire d'être au monde. Je trouve devant moi des choses, des personnes, des valeurs. Le monde est « là », toujours déjà, et je le pose comme existant sans jamais formuler cette position. C'est la *thèse générale* de l'attitude naturelle.\n\nCette croyance n'est pas une opinion parmi d'autres. Elle est le sol sur lequel toutes nos opinions reposent, si évidente qu'on ne la remarque pas.\n\n## Suspendre sans nier\n\nL'épochè consiste à mettre cette thèse « hors circuit », entre parenthèses. Husserl insiste : il ne s'agit pas de nier le monde, comme le sophiste, ni d'en douter, comme Descartes. La thèse reste ce qu'elle est ; simplement, je n'en fais plus usage.\n\nLa différence avec le doute cartésien est capitale. Descartes doute pour trouver une certitude sur laquelle reconstruire la science. Husserl suspend pour *voir* : ce qui l'intéresse, ce n'est pas que le monde existe, c'est la manière dont il apparaît.\n\n## Ce qui reste\n\nQue reste-t-il une fois la thèse du monde suspendue ? Tout, mais autrement. L'arbre que je perçois n'a pas disparu ; il est devenu un *phénomène* — un arbre perçu, avec ses faces visibles et cachées, ses horizons, sa manière de se donner en esquisses.\n\nEt la conscience qui le perçoit se révèle intentionnelle : toute conscience est conscience *de* quelque chose. Il y a la visée (*noèse*) et le visé tel qu'il est visé (*noème*). L'épochè ouvre le champ de leur description.\n\n## Une attitude, plus qu'une technique\n\nOn a beaucoup reproché à Husserl le versant idéaliste de sa démarche. Merleau-Ponty, dans l'avant-propos de la *Phénoménologie de la perception* (1945), en tire une leçon devenue célèbre : le plus grand enseignement de la réduction est l'impossibilité d'une réduction complète. On ne sort jamais tout à fait du monde.\n\nMais le geste demeure fécond. Suspendre ce qu'on tient pour évident pour regarder comment cela se présente : c'est une discipline de l'attention que bien des praticiens reconnaîtront. L'écoute qui s'interdit de comprendre trop vite n'en est pas très éloignée.","quiz":[{"question":"Que fait exactement l'épochè husserlienne avec la croyance au monde ?","choix":["Elle la nie, en affirmant que le monde extérieur n'existe pas","Elle la met en doute, pour pouvoir la réfuter ensuite","Elle la met entre parenthèses, sans la nier, en cessant d'en faire usage","Elle la remplace par une croyance en Dieu, garant du monde"],"bonne":2,"explication":"Husserl insiste : la thèse reste ce qu'elle est, on n'en fait simplement plus usage. Ce n'est ni la négation sophistique, ni le doute cartésien qui cherche une certitude, ni une substitution théologique."},{"question":"En quoi l'épochè se distingue-t-elle du doute cartésien ?","choix":["Descartes doute pour fonder la science ; Husserl suspend pour décrire l'apparaître","Descartes croit au monde extérieur, alors que Husserl n'y croit pas","Husserl reprend exactement la méthode de Descartes, sans rien y changer","Descartes s'intéresse à la perception, Husserl seulement à la logique"],"bonne":0,"explication":"Le doute cartésien vise une certitude fondatrice ; l'épochè vise la description des phénomènes. Husserl ne nie pas le monde, il ne se contente pas de reprendre Descartes, et c'est bien lui qui fait de la perception un objet central."},{"question":"Quelle leçon Merleau-Ponty tire-t-il de la réduction ?","choix":["Qu'elle permet d'atteindre une conscience pure séparée du monde","Qu'elle est inutile et doit être abandonnée","Que son plus grand enseignement est l'impossibilité d'une réduction complète","Qu'elle prouve l'existence d'un monde extérieur"],"bonne":2,"explication":"Pour Merleau-Ponty, on ne sort jamais tout à fait du monde : c'est l'enseignement de la réduction. Il ne l'abandonne pas, il ne la tient pas pour un accès à une conscience pure, et elle n'est pas une preuve d'existence."}],"sources":["Edmund Husserl, *Idées directrices pour une phénoménologie*, trad. Paul Ricœur, Gallimard, coll. « Tel », 1950.","Maurice Merleau-Ponty, *Phénoménologie de la perception*, avant-propos, Gallimard, 1945."]},{"id":"bion-reverie","discipline":"psychanalyse","titre":"La capacité de rêverie","figure":"Wilfred R. Bion","reference":"Aux sources de l'expérience (1962) ; Une théorie de l'activité de pensée (1962)","accroche":"Avant de pouvoir penser, le bébé a besoin que quelqu'un pense pour lui ce qu'il ne peut pas supporter. Bion appelle ce don silencieux la rêverie.","punch":"Pour penser ses pensées, il a fallu que quelqu'un les rêve d'abord pour nous.","idee":"Le nourrisson projette dans sa mère des éprouvés bruts, impensables (éléments bêta). Par sa capacité de rêverie, elle les accueille et les transforme (fonction alpha) en éléments qui peuvent être pensés, puis les lui restitue. Le bébé introjecte peu à peu cet appareil à penser.","repere":"Contenant ♀ et contenu ♂ : Bion note par ces symboles la relation entre ce qui accueille et ce qui est accueilli. Il les utilise pour la mère et le bébé, l'analyste et le patient, le groupe et l'individu, la pensée et les pensées.","liens":["winnicott-mere-suffisamment-bonne","klein-positions","freud-reve"],"texte":"Wilfred Bion, analysé par Melanie Klein, a d'abord travaillé avec des patients psychotiques. C'est leur incapacité à penser certaines expériences qui l'a conduit à une question vertigineuse : comment devient-on capable de penser ? Sa réponse renverse l'ordre attendu. Ce ne sont pas les pensées qui naissent de la pensée ; c'est la pensée qui doit se développer pour traiter des pensées qui la précèdent.\n\n## Éléments bêta et fonction alpha\n\nBion appelle *éléments bêta* les impressions sensorielles et émotionnelles brutes, non digérées. Elles ne peuvent être pensées ni rêvées ; elles ne peuvent qu'être évacuées — par l'acte, la projection, le symptôme somatique.\n\nLa *fonction alpha* les transforme en *éléments alpha* : des éléments utilisables pour rêver, se souvenir, penser. Bion choisit à dessein des lettres grecques vides : il veut un terme sans contenu préalable, à remplir par l'observation.\n\n## La rêverie maternelle\n\nAu départ, le nourrisson n'a pas de fonction alpha suffisante. Il vit une détresse — la faim, la peur de mourir — qu'il ne peut contenir. Il la projette dans la mère, au sens de l'identification projective kleinienne, mais Bion lui donne une valeur nouvelle : ce n'est pas seulement une défense, c'est une *communication*.\n\nSi la mère est disponible, elle accueille cette projection. Sa *capacité de rêverie* lui permet de recevoir l'angoisse sans être submergée, de la penser, de la transformer. Le bébé reçoit alors en retour quelque chose de supportable : sa peur, mais pensée, apaisée par une présence.\n\nAu fil de ces expériences répétées, l'enfant introjecte non seulement le contenu transformé, mais la fonction elle-même. Il acquiert un appareil à penser les pensées.\n\n## Quand le contenant fait défaut\n\nSi la mère ne peut accueillir la projection, celle-ci revient à l'enfant sous une forme aggravée : une *terreur sans nom*. L'angoisse n'a pas été transformée ; elle a perdu même le sens qu'elle avait. Bion décrit dans « Attaques contre la liaison » (1959) les effets de cet échec sur la vie psychique des patients psychotiques.\n\n## L'analyste comme contenant\n\nLe modèle s'applique directement à la cure. L'analyste reçoit ce que le patient ne peut penser, le laisse résonner en lui, et lui restitue sous une forme élaborée. Il lui faut pour cela une disposition que Bion formulera plus tard sans détour : aborder chaque séance sans mémoire et sans désir, pour pouvoir accueillir ce qui se présente — et le rêver, en quelque sorte, avec le patient.","quiz":[{"question":"Que sont les éléments bêta chez Bion ?","choix":["Des pensées déjà élaborées, prêtes à être communiquées à autrui","Des impressions sensorielles et émotionnelles brutes, qui ne peuvent qu'être évacuées","Les souvenirs d'enfance refoulés que l'analyse fait resurgir","Les éléments du rêve manifeste, tels que le rêveur les raconte"],"bonne":1,"explication":"Les éléments bêta sont des éprouvés bruts, impensables, que seule la fonction alpha peut transformer. Ils ne sont ni des pensées élaborées, ni des souvenirs refoulés, ni du matériel onirique, qui suppose déjà la fonction alpha."},{"question":"Quelle est la fonction de la rêverie maternelle ?","choix":["Laisser l'enfant seul pour qu'il apprenne à se calmer par lui-même","Accueillir les projections du bébé et les lui rendre sous une forme pensable","Interpréter à voix haute les rêves que l'enfant fait la nuit","Satisfaire immédiatement tous les besoins physiques du nourrisson"],"bonne":1,"explication":"La mère reçoit l'angoisse sans être submergée, la pense et la restitue apaisée. Il ne s'agit ni de laisser l'enfant seul, ni d'interpréter ses rêves, ni seulement de satisfaire des besoins physiques : c'est une fonction psychique."},{"question":"Que se passe-t-il lorsque le contenant fait défaut ?","choix":["L'enfant devient plus autonome, et plus tôt que les autres","Rien : l'enfant trouve seul d'autres moyens de se contenir","L'angoisse finit par disparaître d'elle-même avec le temps","La projection revient sous la forme aggravée d'une « terreur sans nom »"],"bonne":3,"explication":"L'angoisse non transformée revient dépouillée de son sens : c'est la terreur sans nom. Bion n'y voit ni gain d'autonomie, ni résolution spontanée."}],"sources":["Wilfred R. Bion, *Aux sources de l'expérience*, PUF, 1979.","Wilfred R. Bion, *Réflexion faite*, PUF, 1983 (contient « Attaques contre la liaison » et « Une théorie de l'activité de pensée »)."]},{"id":"kant-lumieres","discipline":"philosophie","titre":"Sapere aude","figure":"Emmanuel Kant","reference":"Réponse à la question : qu'est-ce que les Lumières ? (1784)","accroche":"Kant ne dit pas que les hommes sont ignorants. Il dit qu'ils sont paresseux et lâches — et qu'ils ont de bonnes raisons de l'être.","punch":"Il est si commode d'être mineur.","idee":"Les Lumières, c'est la sortie de l'homme d'un état de minorité dont il est lui-même responsable : l'incapacité de se servir de son entendement sans la direction d'autrui. Ce n'est pas l'intelligence qui manque, c'est le courage.","citation":"Aie le courage de te servir de ton propre entendement !","citation_source":"Kant, Qu'est-ce que les Lumières ?, 1784 — traduit de l'allemand","liens":["platon-reminiscence","freud-moi-pas-maitre","nietzsche-ressentiment"],"texte":"En 1784, la *Berlinische Monatsschrift* publie la réponse de Kant à une question posée par un pasteur : qu'est-ce, au juste, que les Lumières ? Kant répond en une phrase qui a la netteté d'une définition : la sortie de l'homme hors de l'état de minorité où il se maintient par sa propre faute.\n\n## Une minorité dont on est responsable\n\nMinorité, au sens juridique : l'état de celui qui ne peut agir sans tuteur. Ce n'est pas une affaire d'âge. Kant parle d'adultes qui ont depuis longtemps été affranchis par la nature d'une direction étrangère et qui restent pourtant mineurs leur vie durant.\n\nEt il précise : cette minorité est fautive lorsque sa cause n'est pas un manque d'entendement, mais un manque de décision et de courage. D'où la devise reprise à Horace : *Sapere aude*, ose savoir.\n\n## Pourquoi on reste mineur\n\nKant donne deux causes, sans complaisance : la paresse et la lâcheté. Il est si commode d'être mineur. J'ai un livre qui a de l'entendement pour moi, un directeur de conscience qui a de la conscience pour moi, un médecin qui juge de mon régime à ma place : je n'ai pas besoin de penser, pourvu que je puisse payer.\n\nLes tuteurs, de leur côté, ont tout intérêt à entretenir cette situation. Après avoir abêti leur bétail, ils lui montrent le danger qui le menace s'il tente de marcher seul. La minorité devient une seconde nature ; on finit par l'aimer.\n\n## Le public plutôt que l'individu\n\nKant est pessimiste sur l'émancipation solitaire : peu de gens réussissent à se dégager de la minorité par le travail de leur propre esprit. Il est plus optimiste sur l'émancipation d'un public, pourvu qu'on lui laisse la liberté.\n\nMais quelle liberté ? La plus inoffensive : faire un usage *public* de sa raison en toutes choses. Kant distingue l'usage public — celui du savant qui s'adresse au public des lecteurs — et l'usage privé — celui qu'on fait de sa raison dans un poste ou une fonction. L'officier doit obéir ; mais comme savant, il peut critiquer les erreurs du service militaire. Le pasteur doit enseigner le symbole de son Église ; comme savant, il a pleine liberté d'en discuter.\n\n## Ce que le texte laisse ouvert\n\nLe texte se termine sur une formule restée célèbre, attribuée au roi de Prusse : raisonnez autant que vous voudrez, mais obéissez. Les lecteurs n'ont cessé de s'y heurter.\n\nEt une autre question reste en suspens : que le courage soit requis suppose qu'il y ait, en nous, quelque chose qui préfère la tutelle. Kant le nomme paresse ou lâcheté. On pourrait se demander si le désir d'être dirigé n'a pas des racines plus profondes qu'un simple défaut de caractère.","quiz":[{"question":"Qu'est-ce qui rend la minorité « fautive » selon Kant ?","choix":["Un défaut naturel d'intelligence chez la plupart des hommes","Un manque de décision et de courage, et non d'entendement","L'absence d'écoles publiques dans le royaume de Prusse","Le refus d'obéir aux autorités légitimes"],"bonne":1,"explication":"La minorité est imputable quand sa cause n'est pas un manque d'entendement mais de courage. Kant écarte expressément le manque d'intelligence ; il ne parle pas ici d'institutions scolaires, et l'obéissance n'est pas le problème — il la maintient même dans l'usage privé."},{"question":"Comment Kant distingue-t-il usage public et usage privé de la raison ?","choix":["Public : en famille ; privé : dans le secret de la conscience","Public : réservé aux princes ; privé : accessible à tous","Public : comme savant devant le public des lecteurs ; privé : dans l'exercice d'une fonction","Public : dans les assemblées politiques ; privé : dans les affaires commerciales"],"bonne":2,"explication":"Le paradoxe est voulu : l'usage « privé » est celui qu'on fait dans un poste confié, où l'on doit obéir ; l'usage « public » est celui du savant qui s'adresse à tous, et il doit être libre. Les autres répartitions ne correspondent pas au texte."},{"question":"Quelles causes Kant donne-t-il au maintien dans la minorité ?","choix":["La paresse et la lâcheté","L'ignorance et la pauvreté","La religion et la superstition","L'éducation et la tradition"],"bonne":0,"explication":"Kant nomme sans détour la paresse et la lâcheté, entretenues par des tuteurs qui ont intérêt à la tutelle. Il ne réduit pas le problème à l'ignorance ou à la pauvreté, et la religion n'est qu'un des domaines où s'exerce la tutelle."}],"sources":["Emmanuel Kant, *Qu'est-ce que les Lumières ?*, trad. Jean-François Poirier et Françoise Proust, GF-Flammarion, 1991.","Michel Foucault, « Qu'est-ce que les Lumières ? » (1984), dans *Dits et écrits*, IV, Gallimard."]},{"id":"ferenczi-confusion","discipline":"psychanalyse","titre":"La confusion de langue","figure":"Sándor Ferenczi","reference":"Confusion de langue entre les adultes et l'enfant (congrès de Wiesbaden, 1932 ; publié en 1933)","accroche":"En 1932, Ferenczi lit à Wiesbaden un texte que Freud lui avait demandé de ne pas présenter. Il y soutient que l'enfant ne parle pas la même langue que l'adulte qui abuse de lui.","punch":"L'enfant demande de la tendresse. L'adulte répond dans la langue de la passion.","idee":"L'enfant vit dans le langage de la tendresse ; l'adulte qui abuse lui répond dans celui de la passion. Le traumatisme tient aussi au désaveu qui suit, quand personne ne reconnaît ce qui s'est passé. Pour survivre, l'enfant s'identifie à l'agresseur et introjecte sa culpabilité.","repere":"Le texte a pour sous-titre « Le langage de la tendresse et de la passion ». Freud, inquiet de voir Ferenczi revenir à une théorie de la séduction réelle, lui avait demandé de ne pas le lire. L'article ne paraîtra en anglais qu'en 1949.","liens":["freud-apres-coup","wittgenstein-taire","freud-transfert"],"texte":"Sándor Ferenczi fut l'un des plus proches de Freud, son « paladin », son compagnon de voyage. Il est aussi celui qui, dans ses dernières années, a pris les risques techniques et théoriques les plus grands. Son dernier grand texte en est l'aboutissement.\n\n## Le point de départ : la cure\n\nFerenczi part d'une observation clinique. Ses patients, dans le transfert, se montrent souvent dociles, attentifs à ses humeurs, prompts à se soumettre. Derrière cette docilité, il perçoit une critique réprimée, une méfiance qu'ils ne s'autorisent pas. Il en conclut que l'hypocrisie professionnelle de l'analyste — cacher son irritation, sa fatigue — reproduit quelque chose du traumatisme infantile.\n\nD'où une proposition technique audacieuse : reconnaître ses propres erreurs devant le patient peut avoir un effet libérateur.\n\n## Deux langues\n\nLe cœur du texte est une distinction. L'enfant vit dans le registre de la *tendresse* : il joue, il désire être aimé, il peut fantasmer de prendre la place d'un parent, mais sur le mode du jeu. L'adulte qui abuse de lui, avec ses prédispositions pathologiques, confond ce jeu avec le désir d'une personne sexuellement mûre. Il répond dans le registre de la *passion*.\n\nLes deux ne parlent pas la même langue. L'enfant reçoit une réponse qui ne correspond à rien de ce qu'il demandait.\n\n## L'identification à l'agresseur\n\nComment l'enfant réagit-il ? Ferenczi s'attendrait à du refus, de la haine. Il observe autre chose. Paralysé par la peur, l'enfant se soumet, devine les désirs de l'agresseur, s'y conforme, et s'identifie à lui. L'agresseur disparaît comme réalité extérieure ; il devient intrapsychique.\n\nPlus grave encore : l'enfant introjecte le sentiment de culpabilité de l'adulte. Le jeu jusqu'alors innocent lui apparaît comme une faute. Il sort de l'épreuve divisé, à la fois innocent et coupable.\n\n## Le désaveu\n\nLe traumatisme ne s'arrête pas à l'acte. L'enfant se tourne souvent vers un autre adulte pour comprendre ce qui lui est arrivé. S'il rencontre l'incrédulité, le silence ou le déni — ce n'est rien, tu as rêvé —, c'est ce *désaveu* qui achève de rendre l'expérience traumatique.\n\nFerenczi décrit les conséquences : fragmentation de la personnalité, maturité précoce, ce qu'il nomme un « nourrisson savant », un enfant qui prend soin de l'adulte.\n\n## Une postérité tardive\n\nLe texte a longtemps été mis de côté, jugé comme le symptôme d'un analyste en conflit avec Freud. Il a été relu à partir des années 1980 et a nourri les travaux sur le trauma, la dissociation, et l'attention à ce que l'analyste fait — ou ne fait pas — de ce qui lui est dit.","quiz":[{"question":"Quelles sont les deux « langues » que distingue Ferenczi ?","choix":["Le hongrois de Ferenczi et l'allemand de Freud","La tendresse, langue de l'enfant, et la passion, langue de l'adulte","Le langage de la conscience et celui de l'inconscient","La langue du patient et celle de la théorie analytique"],"bonne":1,"explication":"L'enfant joue sur le registre de la tendresse ; l'adulte qui abuse répond sur celui de la passion. Les autres oppositions ne sont pas celles du texte, même si Ferenczi critique ailleurs l'attitude de l'analyste."},{"question":"Pourquoi l'enfant s'identifie-t-il à l'agresseur ?","choix":["Parce qu'il admire sincèrement l'adulte et veut lui ressembler plus tard","Parce qu'il a lui-même provoqué la situation par ses jeux","Parce que, paralysé par la peur, il se soumet et intériorise l'agresseur pour survivre","Parce qu'il veut pouvoir se venger plus tard de l'agresseur"],"bonne":2,"explication":"La peur conduit l'enfant à se conformer aux désirs de l'agresseur, qui devient intrapsychique. Ferenczi ne parle ni d'admiration, ni de provocation de l'enfant — c'est justement la culpabilité de l'adulte qui lui est transmise — ni de projet de vengeance."},{"question":"Quel rôle joue le désaveu dans le traumatisme ?","choix":["Aucun : seul l'acte compte dans la genèse du trauma","Il permet à l'enfant d'oublier rapidement ce qui s'est passé","Il protège l'enfant d'une souffrance supplémentaire et inutile","Il achève le trauma, quand l'adulte sollicité nie ce qui s'est passé"],"bonne":3,"explication":"L'incrédulité ou le déni de l'adulte auquel l'enfant s'adresse redouble le traumatisme. Le désaveu ne protège pas et ne fait pas oublier : il empêche que l'expérience soit reconnue et pensée."}],"sources":["Sándor Ferenczi, « Confusion de langue entre les adultes et l'enfant » (1933), dans *Psychanalyse IV. Œuvres complètes 1927–1933*, Payot, 1982.","Sándor Ferenczi, *Journal clinique (janvier–octobre 1932)*, Payot, 1985."]},{"id":"wittgenstein-taire","discipline":"philosophie","titre":"Ce dont on ne peut parler","figure":"Ludwig Wittgenstein","reference":"Tractatus logico-philosophicus, 5.6, 6.522, 7 (1921)","accroche":"La dernière phrase du Tractatus est souvent lue comme un rappel à l'ordre. Wittgenstein y voyait plutôt l'essentiel : ce qui compte vraiment ne se dit pas.","punch":"Les limites de mon langage sont les limites de mon monde.","idee":"Le langage peut dire les faits du monde, et seulement eux. L'éthique, le sens de la vie, le mystique ne se disent pas : ils se montrent. Se taire n'est pas les nier, c'est refuser de les rabattre sur ce qui se dit.","citation":"Sur ce dont on ne peut parler, il faut garder le silence.","citation_source":"Wittgenstein, Tractatus logico-philosophicus, 7 (1921) — traduit de l'allemand","liens":["husserl-epoche","ferenczi-confusion","lacan-desir-de-l-autre"],"texte":"Le *Tractatus* est un livre de soixante-dix pages, écrit en grande partie dans les tranchées de la Première Guerre mondiale, composé de propositions numérotées. Wittgenstein pensait y avoir résolu, pour l'essentiel, les problèmes de la philosophie. La dernière proposition, la septième, tient en une ligne.\n\n## Ce que le langage peut dire\n\nLe livre propose une théorie de la proposition comme *image* : une proposition a un sens si elle figure un état de choses possible. « Le chat est sur le tapis » est vraie ou fausse selon que le monde est ou non ainsi. Le langage sensé, c'est l'ensemble des propositions qui peuvent figurer des faits.\n\nD'où la proposition 5.6 : les limites de mon langage signifient les limites de mon monde. Ce qui ne peut être figuré n'est pas un fait du monde.\n\n## Ce qui se montre\n\nMais que faire de la logique elle-même, de l'éthique, de l'esthétique, du sens de la vie ? Ces choses ne sont pas des faits. Une proposition comme « la vie a un sens » ne figure aucun état de choses.\n\nWittgenstein ne conclut pas qu'elles n'existent pas. Il distingue *dire* et *montrer*. Il y a assurément de l'inexprimable ; il se montre, c'est le mystique (6.522). L'éthique ne se laisse pas énoncer ; elle est, dit-il, transcendantale.\n\n## L'échelle\n\nLe livre se retourne alors contre lui-même. Ses propres propositions ne figurent aucun fait : elles sont, à la lettre, dépourvues de sens. Celui qui le comprend, dit Wittgenstein, doit les reconnaître comme telles, s'en servir comme d'une échelle et la rejeter après y être monté (6.54).\n\nLa septième proposition prend alors son poids. Il ne s'agit pas d'interdire de parler de l'important. Il s'agit de ne pas le dégrader en le traitant comme une thèse.\n\nWittgenstein l'écrivait à l'éditeur Ludwig von Ficker : son livre se compose de deux parties, celle qui est écrite et celle qu'il n'a pas écrite, et c'est la seconde qui est importante.\n\n## Après le Tractatus\n\nLe second Wittgenstein, celui des *Recherches philosophiques* (publiées en 1953), abandonnera la théorie de l'image au profit des *jeux de langage* : le sens d'un mot est son usage dans une forme de vie. L'idée qu'un langage privé, accessible à moi seul, puisse avoir un sens sera critiquée.\n\nEntre les deux périodes, une constante : la philosophie n'est pas une doctrine mais une activité de clarification. Elle n'ajoute rien au monde ; elle aide à ne plus se laisser ensorceler par le langage.","quiz":[{"question":"Selon la théorie du Tractatus, quand une proposition a-t-elle un sens ?","choix":["Quand elle exprime un sentiment sincère","Quand elle est logiquement nécessaire","Quand elle figure un état de choses possible, vrai ou faux selon le monde","Quand elle est acceptée par une communauté de locuteurs"],"bonne":2,"explication":"La proposition est une image d'un état de choses possible. La sincérité n'y joue aucun rôle ; les tautologies logiques sont dites « vides de sens » (sinnlos) ; l'usage communautaire relève du second Wittgenstein."},{"question":"Que fait Wittgenstein de l'éthique et du sens de la vie ?","choix":["Ils ne peuvent se dire, mais ils se montrent","Il les déclare illusoires et sa
