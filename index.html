dit quelque chose d'analogue de l'histoire collective (voir la fiche sur l'après-coup chez Freud).\n\n## Le contexte\n\nBenjamin rédige ce texte à l'hiver 1939-1940, après son internement au camp de Nevers en 1939[^3]. Le contexte est celui de la guerre, de la fuite des réfugiés juifs hors de la France de Vichy et de la menace de la Gestapo. On lit souvent la thèse IX à la lumière de cette situation ; mais l'image vaut d'abord par ce qu'elle dit de l'histoire, et non comme un document biographique.\n\n## Un repère : Kant\n\nLa thèse IX se place en face d'une autre manière de penser l'histoire. Chez Kant, les Lumières désignent la sortie d'un état de tutelle, un geste de progrès. Benjamin n'écrit pas contre Kant dans ce passage, et le rapprochement ne sert ici que de repère. Ce que la thèse IX met en cause, c'est une certaine idée du progrès comme mouvement irrésistible.","quiz":[{"question":"Quel tableau Benjamin met-il au centre de la thèse IX ?","choix":["L'Angelus Novus, de Paul Klee","Les Ménines, de Diego Vélasquez","La Liberté guidant le peuple, de Delacroix","Le Cri, d'Edvard Munch"],"bonne":0,"explication":"La thèse IX commence par « Il y a un tableau de Klee dénommé Angelus Novus ». Les autres œuvres n'apparaissent pas dans ce passage."},{"question":"Que voit l'ange là où nous voyons une chaîne d'événements ?","choix":["Une suite de progrès qui annonce un avenir meilleur","Une succession de batailles gagnées par les puissants","Un récit cohérent, entièrement fixé par les historiens","Une seule catastrophe qui amoncelle des décombres"],"bonne":3,"explication":"Dans la version anglaise, « he sees one single catastrophe » ; dans la version française de Benjamin : « une catastrophe sans modulation ni trêve, amoncelant les décombres »."},{"question":"Que nomme Benjamin « Progrès » dans cette thèse ?","choix":["La capacité de l'ange à réparer les ruines du passé","La tempête qui l'emporte vers l'avenir","Le tableau de Klee lui-même","La chaîne d'événements que l'on apprend à l'école"],"bonne":1,"explication":"La tempête vient du Paradis et emporte l'ange vers l'avenir : « Nous donnons nom de Progrès à cette tempête »."},{"question":"Un manuel présente l'histoire d'une région comme une marche continue vers le confort et la croissance. Que lui opposerait l'ange de la thèse IX ?","choix":["Une autre chaîne d'événements, plus exacte et mieux datée","Le constat que rien n'a jamais changé dans cette région","Une seule catastrophe : les ruines que le récit du progrès laisse derrière lui","Un avenir meilleur, qu'il voit clairement devant lui"],"bonne":2,"explication":"Là où le récit voit une chaîne d'événements, l'ange voit une catastrophe qui amoncelle les décombres ; et il tourne le dos à l'avenir. Il ne nie pas le changement, il en montre l'envers."}],"sources":[{"texte":"Muriel Pic, « Histoire, lecture, divination : Michel de Certeau et l'ange de l'histoire », Fabula (2017), qui cite la thèse IX dans la version française de Benjamin","url":"https://www.fabula.org/colloques/document4666.php"},{"texte":"« Theses On the Concept of History: Theses V and IX », blog de cours, Wellesley College (texte anglais des thèses V et IX)","url":"https://blogs.wellesley.edu/eng35501sp15/?p=209"},{"texte":"Wikipédia (anglais), « Theses on the Philosophy of History » (date, circonstances, publication)","url":"https://en.wikipedia.org/wiki/Theses_on_the_Philosophy_of_History"}]},{"id":"bergson-duree","discipline":"philosophie","titre":"La durée","figure":"Henri Bergson","branche":"fondamentaux","fiabilite":"secondaire","fiabilite_note":"Bergson est présenté d'après l'Encyclopédie de Stanford, Wikipédia et l'article « Henri Bergson » du Larousse ; l'Essai lui-même n'a pas été consulté. Les exemples célèbres du sucre qui fond et de la mélodie, souvent cités, n'ont pas été retrouvés dans ces sources et ne sont pas attribués à Bergson ici.","reference":"Essai sur les données immédiates de la conscience (1889) ; Matière et mémoire (1896) ; L'Évolution créatrice (1907)","accroche":"L'horloge découpe le temps en instants identiques. Le temps que nous vivons, lui, ne se laisse pas découper. Bergson en tire une idée de la conscience, et de la liberté.","punch":"Le temps vécu n'est pas une ligne de points. Ses moments se fondent les uns dans les autres.","idee":"Bergson oppose le temps de l'horloge, homogène et fait d'instants juxtaposés, à la durée vécue, où les états de conscience se fondent les uns dans les autres. Confondre les deux, c'est traduire l'inétendu en étendu, et c'est de cette confusion que naissent les faux problèmes de la liberté.","repere":"L'Essai sur les données immédiates de la conscience est la thèse de doctorat de Bergson, publiée en 1889. Bergson entre au Collège de France en 1900. Le prix Nobel de littérature de 1927 lui est décerné en 1928.","liens":["freud-apres-coup","schopenhauer-pendule","husserl-epoche"],"texte":"En 1889, Henri Bergson publie sa thèse de doctorat, l'*Essai sur les données immédiates de la conscience*. La traduction anglaise lui donnera un titre plus explicite : *Time and Free Will*, le temps et le libre arbitre[^2]. Le livre part d'une intuition simple : nous parlons du temps comme s'il s'agissait d'espace, et cette habitude nous trompe sur nous-mêmes.\n\n## Deux temps\n\nIl y a d'abord le temps des horloges et des calendriers : une forme homogène, faite d'instants tous semblables, que l'on peut compter, additionner, découper[^1]. C'est le temps dont la science a besoin, et il ressemble à une ligne : chaque moment est à côté de l'autre, extérieur à l'autre.\n\nEt il y a la durée, le temps tel que nous le vivons. Le *Larousse* la définit, d'après Bergson, comme « la forme que prend la succession de nos états de conscience quand notre moi se laisse vivre »[^3]. Dans la durée, il n'y a pas de juxtaposition d'événements, et donc pas de causalité mécanique[^1]. Les états de conscience ne s'alignent pas comme des perles sur un fil : ils se pénètrent, s'organisent en un tout, et s'enrichissent les uns des autres[^1].\n\n## Deux multiplicités\n\nBergson formule cette différence avec un couple de notions. Une multiplicité *quantitative* est faite d'éléments distincts que l'on peut compter. Pour compter des moutons dans un troupeau, il faut ignorer ce qui les différencie et les placer, en pensée, côte à côte dans l'espace[^1].\n\nUne multiplicité *qualitative*, au contraire, est faite d'états qui ne sont pas extérieurs les uns aux autres : plusieurs états de conscience s'organisent en un tout, se pénètrent, et gagnent peu à peu un contenu plus riche[^1]. La durée exclut toute idée de juxtaposition, d'extériorité réciproque et d'étendue[^1].\n\n> **Illustration (pas un exemple de Bergson).** Une heure d'attente dans un couloir d'hôpital et une heure de conversation avec un ami ont la même mesure sur l'horloge. Vécues, elles n'ont rien de commun : l'une s'étire, chaque minute pèse sur la suivante ; l'autre passe sans qu'on ait rien compté. L'horloge dit « soixante minutes » dans les deux cas. La durée, elle, est chaque fois une autre.\n\n## La liberté\n\nPourquoi ce détour par le temps ? Parce qu'il commande, pour Bergson, la question de la liberté. Le débat entre partisans et adversaires du libre arbitre repose, selon lui, sur une confusion : une traduction illégitime de l'inétendu en étendu[^2]. On se représente la décision comme un point sur une ligne, d'où partiraient deux chemins possibles, et l'on se demande si l'un était déterminé d'avance. Mais la décision vécue n'est pas un carrefour dans l'espace : c'est un moment de la durée, où tout le passé du moi se ramasse.\n\nLa liberté, chez Bergson, est d'abord mobilité[^1] : non pas le choix entre deux options figées, mais l'acte qui sort de la personne tout entière. L'Essai répond aussi, à sa manière, à Kant, qui plaçait la liberté hors de l'espace et du temps[^1].\n\n> **Illustration.** Quelqu'un hésite longtemps à quitter son métier. On peut dresser la liste des raisons pour et contre, comme sur une balance. Mais le jour où il décide, ce n'est pas qu'une colonne l'a emporté : c'est que, mûrie par des mois, une décision est venue de lui. Bergson dirait que la liste était une image spatiale de ce qui se jouait dans la durée.\n\n## La suite de l'œuvre\n\n*Matière et mémoire* (1896) prolonge la réflexion sur le temps du côté du souvenir. Le livre est franchement dualiste, tout en cherchant à surmonter les difficultés qui ont toujours accompagné le dualisme[^1] ; le *Larousse* en résume la thèse par l'image du cône : le corps agit sur le plan présent grâce aux souvenirs accumulés[^3]. Avec *L'Évolution créatrice* (1907), la vie elle-même est entraînée par un « élan vital » dans des séries divergentes de transformations[^3].\n\nBergson entre au Collège de France, comme suppléant en 1896 puis comme titulaire en 1900[^3]. Le prix Nobel de littérature de 1927 lui est remis en 1928[^1][^3]. La théorie de la durée a profondément marqué la philosophie continentale du XXe siècle[^2].\n\n## Pourquoi cela compte encore\n\nLa distinction de Bergson ne retire rien à la science : elle lui rend son domaine, l'espace et le mesurable. Mais elle rappelle qu'une vie ne se laisse pas réduire à son emploi du temps. Pour qui écoute quelqu'un parler de son histoire, la remarque est précieuse : ce qui compte n'est pas toujours ce qui a duré le plus longtemps sur le calendrier, mais ce qui a pesé dans la durée.","quiz":[{"question":"Qu'oppose Bergson à la durée vécue ?","choix":["Le temps homogène des horloges, fait d'instants juxtaposés","L'éternité divine, hors de tout changement","Le temps biologique des cellules du corps","Le temps historique des nations et des peuples"],"bonne":0,"explication":"La durée s'oppose au temps spatialisé, homogène et mesurable, que figurent l'horloge et le calendrier. Dans la durée, les états de conscience se pénètrent au lieu de se juxtaposer."},{"question":"Qu'est-ce qu'une multiplicité qualitative ?","choix":["Un ensemble d'objets que l'on peut compter un à un","Des états qui se pénètrent et s'organisent en un tout, sans juxtaposition","Une suite d'instants identiques et mesurables","Un groupe de personnes qui partagent les mêmes qualités"],"bonne":1,"explication":"Les moutons d'un troupeau forment une multiplicité quantitative : on les compte en les plaçant côte à côte. Les états de conscience forment une multiplicité qualitative : ils se fondent et s'enrichissent."},{"question":"Une patiente dit : « Ces trois mois de chômage ont duré une éternité, mes dix ans de mariage sont passés en un éclair. » Que relèverait Bergson ?","choix":["Qu'elle se trompe sur les durées réelles, mesurées par le calendrier","Que la durée vécue ne coïncide pas avec le temps mesuré de l'horloge","Qu'elle confond deux souvenirs distincts","Qu'il faut corriger sa perception par des repères précis"],"bonne":1,"explication":"Le temps de l'horloge est homogène ; la durée vécue, qualitative, ne se laisse pas réduire à la mesure. Sa phrase n'est pas une erreur : elle décrit la durée."},{"question":"D'où viennent, selon Bergson, les faux problèmes de la liberté ?","choix":["D'une ignorance des lois de la physique","D'une croyance religieuse dans le destin","D'une traduction illégitime de l'inétendu en étendu","D'un manque de volonté chez les individus"],"bonne":2,"explication":"On se représente la décision comme un point dans l'espace d'où partiraient deux chemins. Pour Bergson, c'est traduire la durée en espace : la liberté est mobilité, acte de la personne tout entière."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Henri Bergson » (§ 1-4 : durée, multiplicités, liberté, Matière et mémoire, Nobel)","url":"https://plato.stanford.edu/entries/bergson/"},{"texte":"Wikipédia (anglais), « Time and Free Will » (thèse de 1889, confusion de l'inétendu et de l'étendu)","url":"https://en.wikipedia.org/wiki/Time_and_Free_Will"},{"texte":"Larousse, « Henri Bergson » (définition de la durée, Matière et mémoire, élan vital, Collège de France, Nobel)","url":"https://www.larousse.fr/encyclopedie/personnage/Henri_Bergson/108486"}]},{"id":"canguilhem-normal-pathologique","discipline":"philosophie","titre":"Le normal et le pathologique","figure":"Georges Canguilhem","branche":"epistemologie","fiabilite":"mixte","fiabilite_note":"Les citations viennent d'extraits du Normal et le pathologique (PUF, coll. Quadrige) reproduits en ligne, sans numéros de page sûrs ; la biographie et la réception, de Wikipédia et d'un article de la revue Contrastes. La formule de Leriche sur le « silence des organes » n'a pas été retrouvée dans les extraits consultés et n'est pas citée.","reference":"Essai sur quelques problèmes concernant le normal et le pathologique (thèse de médecine, 1943) ; Le normal et le pathologique (1966)","accroche":"La maladie n'est-elle qu'un excès ou un défaut par rapport à la santé ? Canguilhem, philosophe devenu médecin, répond non : être malade, c'est vivre autrement, dans un monde rétréci.","punch":"Être sain, ce n'est pas seulement être normal. C'est pouvoir changer de normes.","idee":"Contre l'idée que le pathologique ne diffère du normal que par le degré, Canguilhem soutient que la maladie est une autre manière de vivre, réduite. La santé n'est pas la conformité à une moyenne : c'est la capacité de tolérer les infidélités du milieu et d'instituer des normes nouvelles.","citation":"La maladie n'est pas une variation sur la dimension de la santé ; elle est une nouvelle dimension de la vie.","citation_source":"Canguilhem, Le normal et le pathologique (1966), PUF, coll. Quadrige — extrait reproduit en ligne","citation_url":"https://www.normalesup.org/~sage/Reflexions/Sciences/GCnormalPatho.pdf","liens":["freud-moi-pas-maitre","husserl-epoche","foucault-histoire-de-la-folie"],"texte":"Georges Canguilhem est un philosophe qui a voulu savoir de quoi il parlait. Agrégé de philosophie, il entreprend des études de médecine et soutient sa thèse de médecine en 1943, en pleine guerre ; sous le pseudonyme de « Lafont », il exerce alors comme médecin dans la Résistance, en Auvergne, tout en enseignant depuis 1941 à l'université de Strasbourg, repliée à Clermont-Ferrand[^2]. Sa thèse s'intitule *Essai sur quelques problèmes concernant le normal et le pathologique*. Augmentée, elle devient en 1966 *Le normal et le pathologique*, un texte fondateur pour la philosophie de la médecine[^2].\n\n## La question\n\nQu'est-ce qui distingue un état malade d'un état sain ? La réponse qui dominait au XIXe siècle tenait en une idée simple : le pathologique ne serait qu'une variation quantitative du normal. Trop de sucre dans le sang, ou pas assez ; une fièvre, c'est une température trop haute. La maladie serait la santé, déplacée sur une échelle.\n\nCanguilhem prend position contre cette idée, qu'il rattache à Auguste Comte et à Claude Bernard. Il écrit, de sa propre conception : « On voit combien avec une telle vision de la maladie on se trouve loin de la conception de Comte ou de Cl. Bernard »[^1].\n\n## Une autre manière de vivre\n\nPour lui, la maladie n'est pas un écart sur une ligne, c'est un changement de plan. « La maladie n'est pas une variation sur la dimension de la santé ; elle est une nouvelle dimension de la vie »[^1].\n\nLe malade ne vit pas « moins bien » sur la même échelle : il vit selon d'autres règles. La maladie reste d'ailleurs, écrit Canguilhem, « une sorte de norme biologique »[^1]. Mais c'est une norme plus étroite. « L'état pathologique traduit la réduction des normes de vie tolérées par le vivant »[^1].\n\n> **Illustration (pas un cas de Canguilhem).** Après un infarctus, un homme reprend une vie presque ordinaire. Ses analyses sont « dans les normes ». Mais il ne peut plus monter un étage en courant, ni supporter un été caniculaire, ni enchaîner deux nuits blanches. Ce qui a changé n'est pas d'abord un chiffre : c'est l'éventail des situations qu'il peut affronter. Son monde s'est rétréci. C'est cela, au sens de Canguilhem, être malade.\n\n## La santé comme marge\n\nSi la maladie est un rétrécissement, la santé n'est pas une simple conformité à la moyenne. Elle est une marge. « La santé c'est une marge de tolérance des infidélités du milieu »[^1]. Le milieu change, il est infidèle : il fait froid, on manque de sommeil, on attrape un virus. L'être en bonne santé encaisse ces variations, et il fait plus : il s'y adapte en créant d'autres manières de vivre.\n\nD'où la formule centrale : « Ce qui caractérise la santé c'est la possibilité de tolérer des infractions à la norme habituelle et d'instituer des normes nouvelles dans des situations nouvelles »[^1]. Être sain, ajoute-t-il, « c'est non seulement être normal dans une situation donnée, mais être aussi normatif »[^1]. À l'inverse, « le malade est malade pour ne pouvoir admettre qu'une norme »[^1].\n\n## Normal et normatif\n\nLe mot *normatif* est la clé. Le vivant n'est pas seulement soumis à des normes : il en produit. Cette « normativité vitale », attachée au vécu et à la souffrance humaine, fonde chez Canguilhem la distinction entre santé et maladie[^3]. Elle déplace le regard : le critère de la santé n'est pas d'abord le chiffre que lit le médecin, c'est la capacité du vivant à faire face, à sa manière, à ce qui lui arrive.\n\n> **Illustration (un parallèle avec la clinique psychique).** Une patiente dit : « Je vais bien tant que rien ne change. » Ses journées sont réglées à l'identique, et le moindre imprévu la jette dans l'angoisse. Elle n'a aucun symptôme spectaculaire. Dans les termes de Canguilhem, on dirait pourtant que sa marge est mince : elle ne supporte qu'une norme. La question clinique n'est pas de la ramener à une moyenne, mais d'élargir ce qu'elle peut affronter.\n\n## Une postérité\n\nCanguilhem succède à Gaston Bachelard à la tête de l'Institut d'histoire des sciences, qu'il dirige jusqu'en 1971[^2]. Il est le parrain de la thèse de Michel Foucault sur l'histoire de la folie, et Foucault écrira l'introduction de la traduction anglaise du *Normal et le pathologique*[^2]. Les deux hommes ne pensent pourtant pas la norme de la même manière : là où Canguilhem fonde la normalité sur le vécu et le biologique, Foucault accorde plus de poids aux dispositifs politiques de normalisation sociale[^3].","quiz":[{"question":"Quelle conception Canguilhem critique-t-il ?","choix":["L'idée que le pathologique n'est qu'une variation quantitative du normal","L'idée que la maladie a toujours une cause psychique","L'idée que la médecine doit s'appuyer sur la physiologie","L'idée que le malade souffre réellement"],"bonne":0,"explication":"Il s'oppose à la conception, rattachée à Comte et à Claude Bernard, d'une maladie qui ne serait que la santé déplacée sur une échelle. Pour lui, elle est « une nouvelle dimension de la vie »."},{"question":"Comment Canguilhem définit-il la santé ?","choix":["Comme la conformité exacte à la moyenne statistique","Comme l'absence totale de douleur et de symptôme","Comme le pouvoir d'instituer des normes nouvelles face au milieu","Comme un état que seul le médecin peut constater et mesurer"],"bonne":2,"explication":"La santé est « une marge de tolérance des infidélités du milieu » : être sain, c'est être « normatif », capable de créer d'autres normes dans des situations nouvelles."},{"question":"Un homme, après une maladie, a des analyses « normales » mais ne supporte plus le moindre effort imprévu. Que dirait Canguilhem ?","choix":["Qu'il est en parfaite santé, puisque ses chiffres sont normaux","Que ses normes de vie se sont réduites : sa marge a rétréci","Qu'il simule, puisque rien ne se voit aux examens","Que sa maladie est uniquement psychique"],"bonne":1,"explication":"« L'état pathologique traduit la réduction des normes de vie tolérées par le vivant. » Le critère n'est pas seulement le chiffre, mais l'éventail des situations que le vivant peut affronter."},{"question":"Que veut dire « normatif » chez Canguilhem ?","choix":["Conforme à la loi et aux règlements en vigueur","Soumis aux normes fixées par la société","Capable de produire ses propres normes de vie","Mesurable par des instruments médicaux précis"],"bonne":2,"explication":"Le vivant n'est pas seulement soumis à des normes, il en institue : être sain, c'est « être aussi normatif ». La maladie, elle, réduit cette capacité à une seule norme."}],"sources":[{"texte":"Canguilhem, Le normal et le pathologique (1966), extraits (PUF, coll. Quadrige)","url":"https://www.normalesup.org/~sage/Reflexions/Sciences/GCnormalPatho.pdf"},{"texte":"Wikipédia (anglais), « Georges Canguilhem » (thèse de 1943, Résistance, Institut d'histoire des sciences, Foucault)","url":"https://en.wikipedia.org/wiki/Georges_Canguilhem"},{"texte":"« The silence of organs. Disagreements between health and normality according to G. Canguilhem and M. Foucault », Contrastes, vol. 19, n° 1","url":"https://revistas.uma.es/index.php/contrastes/en/article/view/1072"}]},{"id":"foucault-histoire-de-la-folie","discipline":"philosophie","titre":"Histoire de la folie","figure":"Michel Foucault","branche":"histoire","fiabilite":"secondaire","fiabilite_note":"Le livre est présenté d'après Wikipédia et l'Encyclopédie de Stanford, qui en résument la thèse et la réception ; il n'a pas été consulté directement. La date de création de l'Hôpital général et l'ampleur de l'enfermement ne figurent pas dans ces sources et ne sont pas données ici.","reference":"Folie et Déraison. Histoire de la folie à l'âge classique (Plon, 1961) ; rééd. Gallimard, 1972","accroche":"On raconte souvent que les médecins ont un jour libéré les fous de leurs chaînes. Foucault raconte une autre histoire : celle d'une raison qui a fait taire la folie avant de la soigner.","punch":"La folie n'a pas toujours été une maladie. Elle l'est devenue.","idee":"Foucault suit le sens de la folie de la Renaissance à la fin du XVIIIe siècle. Errante et symbolique à la Renaissance, elle est enfermée à l'âge classique avec les vagabonds et les débauchés, puis devient « maladie mentale ». La libération par Pinel et Tuke n'est pas pour lui un simple progrès.","repere":"Le livre paraît en 1961 chez Plon sous le titre Folie et Déraison, puis en 1972 chez Gallimard, révisé, sous le titre Histoire de la folie à l'âge classique. C'est la thèse de doctorat d'État de Foucault, parrainée par Georges Canguilhem.","liens":["canguilhem-normal-pathologique","descartes-malin-genie","nietzsche-ressentiment"],"texte":"*Histoire de la folie* est la thèse de doctorat de Michel Foucault, soutenue sous le parrainage de Georges Canguilhem[^2]. Le livre paraît en 1961 chez Plon, sous le titre *Folie et Déraison*, puis en 1972 chez Gallimard, révisé et augmenté[^1]. Il examine l'évolution du sens de la folie en Europe, de la fin du Moyen Âge à la fin du XVIIIe siècle[^1]. Il a aussi pour cible une certaine manière d'écrire l'histoire, celle qui raconte les savoirs comme une suite de découvertes. Le travail de Canguilhem sur l'histoire de la biologie lui a d'ailleurs servi de modèle pour une grande partie de ses recherches sur l'histoire des sciences humaines[^2].\n\n## Trois figures de la folie\n\nFoucault distingue trois moments[^1].\n\n**La Renaissance.** Les fous ne sont pas enfermés : ils circulent. Sur les routes, sur les fleuves, la « nef des fous » emporte des passagers qui sont eux-mêmes des êtres de passage. Le fou devient un symbole de la condition humaine : « la folie est l'anticipation de la mort »[^1]. Elle parle, et elle dit quelque chose du monde.\n\n**L'âge classique.** Au XVIIe siècle, au début de ce que Foucault appelle l'âge de la raison, les insensés sont enfermés en Europe avec d'autres figures jugées antisociales : prostituées, vagabonds, blasphémateurs. Des institutions comme l'Hôpital général de Paris reposent sur des régimes de punitions et de récompenses destinés à leur faire changer de vie, et l'enfermement répond aussi à des besoins juridiques et économiques, comme le contrôle des salaires dans les maisons de travail[^1]. Ce qu'on enferme, ce sont des manières de vivre autant que des esprits égarés. La folie y est pensée comme un renoncement à la raison[^2].\n\n**L'époque moderne.** À la fin du XVIIIe siècle, la folie devient « maladie mentale ». Pour Foucault, ce moment marque la rupture d'un dialogue : l'homme moderne ne communique plus avec le fou[^1].\n\n> **Illustration (pas un exemple de Foucault).** Dans une ville, une même personne, au fil des siècles, aurait pu être tour à tour un « innocent » qu'on laisse errer en lui prêtant une sagesse étrange, un oisif qu'on enferme avec les mendiants parce qu'il ne travaille pas, puis un « malade » qu'on observe et qu'on classe. Son comportement aurait pu rester le même. C'est le regard posé sur lui qui aurait changé. Foucault fait l'histoire de ce regard.\n\n## La libération, autrement racontée\n\nL'histoire classique de la psychiatrie célèbre un geste fondateur : Philippe Pinel en France, William Tuke en Angleterre, auraient libéré les fous de l'ignorance et de la brutalité des siècles précédents[^2]. Foucault conteste ce récit. La nouvelle conception n'est pas, pour lui, une nette amélioration sur les anciennes ; la neutralité scientifique du traitement médical sert aussi à contrôler ce qui menace la morale bourgeoise[^2].\n\nLa thèse générale du livre tient en une phrase : ce qui se présentait comme une découverte scientifique objective était en réalité le produit d'engagements sociaux et moraux discutables[^2].\n\n> **Illustration (une question pour aujourd'hui).** Un service de soins remplace la contention physique par un règlement minutieux : horaires, récompenses, privilèges retirés en cas d'écart. Le progrès est réel. Foucault invite pourtant à se demander ce que ce règlement exige du patient : guérir, ou se conformer ? La question ne disqualifie pas le soin ; elle demande de ne pas confondre l'un et l'autre.\n\n## Une réception partagée\n\nLe livre a été reçu de manière contrastée. Les réactions des historiens ont été, selon Gary Gutting, « ambivalentes, pour ne pas dire polarisées » : Robert Mandrou y voit un « beau livre », Michael MacDonald juge que tout travail sur l'histoire de la folie doit désormais s'inscrire dans son sillage[^1]. D'autres, comme José Guilherme Merquior, lui reprochent des erreurs de fait et d'interprétation, et une sélection des données qui ignore les preuves contraires[^1].\n\nLe livre a aussi été rangé parmi les grandes critiques des institutions psychiatriques des années 1960, aux côtés de Thomas Szasz[^1]. Mais Foucault n'écrit pas un pamphlet contre la psychiatrie : il écrit l'histoire des conditions dans lesquelles la folie est devenue un objet de savoir médical.\n\n## Éditions\n\nUne version abrégée est traduite en anglais en 1964 par Richard Howard ; une traduction intégrale, par Jonathan Murphy et Jean Khalfa, paraît bien plus tard chez Routledge[^1].\n\n## Ce que le livre apprend au clinicien\n\nLe livre ne dit pas que la souffrance psychique n'existe pas, ni qu'il ne faut pas la soigner. Il rappelle que les catégories avec lesquelles on la pense ont une histoire, et que cette histoire est mêlée de morale, d'économie et de pouvoir. Pour qui reçoit des patients, c'est une invitation à regarder aussi ses propres évidences.","quiz":[{"question":"Comment la folie est-elle traitée à la Renaissance, selon Foucault ?","choix":["Elle circule librement, et le fou devient un symbole de la condition humaine","Elle est enfermée dans des asiles médicaux spécialisés","Elle est soignée par des médecins selon des protocoles scientifiques","Elle est punie de mort par les tribunaux religieux"],"bonne":0,"explication":"La « nef des fous » emporte des êtres de passage ; la folie, non enfermée, parle encore de la condition humaine. L'enfermement viendra à l'âge classique, la médicalisation à la fin du XVIIIe siècle."},{"question":"Qui l'âge classique enferme-t-il avec les insensés ?","choix":["Uniquement les criminels condamnés à mort","Les malades contagieux en période d'épidémie","Des « antisociaux » : vagabonds, prostituées, blasphémateurs","Les enfants abandonnés et les orphelins des villes, seulement"],"bonne":2,"explication":"À l'âge classique, les fous sont enfermés avec d'autres « antisociaux », dans des institutions comme l'Hôpital général, qui visent à corriger leur manière de vivre."},{"question":"Un manuel affirme : « Pinel a libéré les fous, et la psychiatrie est née de ce geste humaniste. » Que lui objecterait Foucault ?","choix":["Que Pinel n'a jamais existé","Que les fous n'ont jamais été enchaînés","Que cette libération est aussi une nouvelle forme de contrôle moral","Que la psychiatrie est née bien avant, au Moyen Âge"],"bonne":2,"explication":"Foucault ne nie pas le geste, mais il refuse d'y voir un simple progrès : la neutralité scientifique du soin sert aussi à contrôler ce qui menace la morale établie."},{"question":"Comment les historiens ont-ils reçu le livre ?","choix":["Unanimement, comme une erreur sans aucune valeur","Unanimement, comme une vérité définitive","De façon partagée : saluée par les uns, critiquée par d'autres","Ils l'ont ignoré, faute de traduction disponible"],"bonne":2,"explication":"Les réactions ont été « ambivalentes, pour ne pas dire polarisées » : Mandrou et MacDonald le saluent, Merquior lui reproche des erreurs de fait et une sélection des données."}],"sources":[{"texte":"Wikipédia (anglais), « Madness and Civilization » (thèse, trois périodes, grand renfermement, réception, éditions)","url":"https://en.wikipedia.org/wiki/Madness_and_Civilization"},{"texte":"Stanford Encyclopedia of Philosophy, « Michel Foucault », § 3.1 (thèse, Pinel et Tuke, Canguilhem)","url":"https://plato.stanford.edu/entries/foucault/"}]},{"id":"hart-regle-de-reconnaissance","discipline":"philosophie","titre":"La règle de reconnaissance","figure":"H. L. A. Hart","branche":"droit","fiabilite":"secondaire","fiabilite_note":"Hart est présenté à travers l'Encyclopédie de Stanford et Wikipédia, qui citent The Concept of Law ; le livre n'a pas été consulté. Le débat Hart–Fuller de 1958 et la formule de Radbruch ne sont pas traités, faute de source consultée. La fiche présente une théorie du droit, pas l'état du droit d'un pays.","reference":"The Concept of Law (Oxford, Clarendon Press, 1961)","accroche":"Qu'est-ce qui fait qu'une règle est du droit ? Hart répond sans parler de morale ni de menace : une pratique, celle des officiels qui reconnaissent ce qui compte comme règle.","punch":"Une règle est du droit parce que ceux qui l'appliquent la reconnaissent comme telle.","idee":"Pour Hart, le droit n'est pas l'ordre d'un souverain armé. Il unit des règles de conduite et des règles sur les règles. La plus importante, la règle de reconnaissance, existe parce que les officiels la pratiquent : elle dit ce qui compte comme droit dans un système.","citation":"must be effectively accepted as common public standards of official behavior","citation_source":"H. L. A. Hart, The Concept of Law (1961), cité d'après Stanford Encyclopedia of Philosophy, « Legal Positivism » (pagination de l'éd. 2012 : p. 116) — « doivent être effectivement acceptées comme normes publiques communes de la conduite des officiels » (ma traduction)","citation_url":"https://plato.stanford.edu/entries/legal-positivism/","liens":["montesquieu-le-pouvoir-arrete-le-pouvoir","rousseau-forcer-a-etre-libre","wittgenstein-taire"],"texte":"*The Concept of Law* paraît en 1961 à Oxford, dans la Clarendon Law Series ; une seconde édition, de 1994, comporte un postscriptum[^2]. On le décrit comme l'ouvrage de théorie analytique du droit le plus influent du monde de la *common law*[^2]. Hart y défend le positivisme juridique : les lois sont des règles créées par des humains, sans lien nécessaire avec la morale.\n\nIl décrit ce qu'est un système juridique en général, quel que soit le pays.\n\n## Contre l'ordre du souverain armé\n\nPour comprendre la thèse de Hart, il faut partir de ce qu'il rejette. John Austin, juriste du XIXe siècle (à ne pas confondre avec le philosophe du langage), définit le droit comme des commandements d'un souverain, assortis de sanctions. Hart compare cette conception à l'ordre d'un braqueur armé, et fait valoir que le droit ne se réduit pas à des ordres : les lois peuvent être habilitantes, avoir plusieurs sources, et lier aussi les législateurs[^2].\n\nIl distingue aussi une habitude d'une règle. Briser une habitude n'entraîne aucune désapprobation, alors que briser une règle est perçu comme une faute[^2]. Le droit relève de la règle, pas de la simple régularité.\n\n## Règles primaires et règles secondaires\n\nHart distingue deux sortes de règles. Les règles *primaires* régissent la conduite, comme l'interdiction du meurtre. Les règles *secondaires* portent sur les règles elles-mêmes, et elles sont de trois sortes : la règle de *reconnaissance*, qui fixe les critères de validité des normes ; les règles de *changement*, qui permettent de créer, modifier ou abroger des règles ; les règles d'*adjudication*, qui permettent de constater officiellement qu'une règle primaire a été violée[^2].\n\nÀ chacune correspond un défaut d'une société qui n'aurait que des règles primaires : l'incertitude du droit, son caractère statique et son inefficacité. La règle de reconnaissance répond à l'incertitude, les règles de changement au caractère statique, et celles d'adjudication à l'inefficacité d'une pression sociale diffuse[^2].\n\n> **Illustration (pas un exemple de Hart).** Dans une association, personne ne sait au juste quelles décisions « comptent » comme règles : un message du président ? une remarque lors d'un dîner ? Les membres décident un jour que seules comptent les décisions votées en assemblée et consignées dans un registre. Cette convention, que tous les responsables appliquent, joue le rôle d'une règle de reconnaissance : elle permet d'identifier ce qui est une règle de l'association.\n\n## Une règle qui existe par une pratique\n\nLa règle de reconnaissance a un statut particulier. C'est la plus importante des règles secondaires : elle fixe les critères ultimes de validité du système, existe parce que les officiels la pratiquent, et c'est à elle qu'ils recourent dans leur argumentation. C'est une norme sociale, qui peut ne pas être écrite dans un texte fondateur[^1].\n\nHart fixe ainsi une condition pour qu'un système juridique existe : les règles de conduite valides selon ces critères doivent être généralement obéies, et la règle de reconnaissance doit être « effectivement acceptée comme norme publique commune de la conduite des officiels »[^1]. Le droit n'existe pas parce qu'un texte le dit, mais parce que des officiels agissent ainsi.\n\n## Le point de vue interne\n\nHart distingue le point de vue *externe*, celui de qui observe seulement des régularités de comportement, et le point de vue *interne*, celui de qui accepte la règle comme standard pour guider et évaluer sa conduite et celle des autres. C'est cette « attitude critique réfléchie » qui donne au droit sa dimension normative[^2]. Elle se manifeste dans les pressions sociales et dans l'emploi de mots comme « devoir » ou « obligation »[^1]. Elle est essentielle chez les officiels ; les citoyens ordinaires peuvent se contenter d'une obéissance passive, selon une division du travail[^1].\n\n> **Illustration.** Un touriste observe qu'à un carrefour, les voitures s'arrêtent presque toutes au feu rouge : c'est le point de vue externe, une régularité. Le conducteur local, lui, klaxonne celui qui passe au rouge et dit « il n'a pas le droit » : il traite la règle comme une raison. C'est le point de vue interne.\n\n## La séparation du droit et de la morale\n\nPour les positivistes, la validité juridique d'une norme ne dépend pas *nécessairement* de ses mérites moraux, même si droit et morale se recoupent souvent[^3]. On distingue un positivisme *inclusif*, où la morale peut compter si une règle de reconnaissance le prévoit, et un positivisme *exclusif*, où elle ne peut jamais déterminer la légalité[^3].\n\n## Les objections\n\nRonald Dworkin rejette la théorie à tous les niveaux : il nie qu'une théorie générale du droit soit possible et insiste sur le rôle de l'argumentation morale et politique pour identifier le droit. Il s'appuie sur la controverse entre juristes et sur la diversité des raisons jugées pertinentes. Les positivistes répondent que ces désaccords sont des cas limites, et que seuls les motifs fondés sur des sources sont du droit[^1]. Hart lui répond dans le postscriptum de 1994[^2].\n\nLeslie Green juge difficile de concilier le caractère conventionnel de la règle de reconnaissance avec une véritable obligation juridique[^3]. Quant à Lon Fuller, il soutient qu'un système juridique suppose une « moralité interne du droit » : généralité, publicité, non-rétroactivité, cohérence[^3].","quiz":[{"question":"À quoi Hart compare-t-il la conception du droit comme commandement du souverain ?","choix":["À l'ordre d'un braqueur armé","Au règlement d'un jeu de société","Au sermon d'un prédicateur","À la promesse d'un ami fidèle"],"bonne":0,"explication":"Hart rapproche la théorie d'Austin de la situation d'un braqueur qui donne un ordre, pour montrer que le droit ne se réduit pas à des commandements assortis de menaces."},{"question":"Qu'est-ce que la règle de reconnaissance ?","choix":["Une règle morale que chaque citoyen découvre en lui-même","Une règle qui interdit aux juges d'appliquer d'autres règles","Une règle qui fixe les critères de validité des autres normes","Une règle qui sanctionne les infractions les plus graves"],"bonne":2,"explication":"C'est la règle secondaire qui fixe les critères ultimes de validité du système, et qui existe parce que les officiels la pratiquent."},{"question":"Un sociologue note que 95 % des automobilistes s'arrêtent au feu rouge ; un automobiliste reproche à un autre d'avoir « grillé » le feu. Lequel adopte le point de vue interne ?","choix":["Le sociologue, parce qu'il décrit la règle avec précision","L'automobiliste, parce qu'il traite la règle comme une raison de juger","Les deux, puisqu'ils parlent de la même règle","Aucun, car seul un juge peut avoir ce point de vue"],"bonne":1,"explication":"Le sociologue constate une régularité, c'est le point de vue externe. L'automobiliste use de la règle pour évaluer une conduite : c'est l'« attitude critique réfléchie » du point de vue interne."},{"question":"Que soutiennent les positivistes sur le droit et la morale ?","choix":["Que la validité juridique ne dépend pas nécessairement des mérites moraux","Que le droit et la morale n'ont jamais aucun point commun","Que toute loi injuste est automatiquement sans valeur","Que seul un juge peut décider ce qui est moralement bon"],"bonne":0,"explication":"Le lien n'est pas nécessaire, ce qui n'empêche pas que droit et morale se recoupent souvent."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Legal Positivism » (règle de reconnaissance, condition d'existence d'un système, point de vue interne, positivisme inclusif et exclusif, Dworkin)","url":"https://plato.stanford.edu/entries/legal-positivism/"},{"texte":"Wikipédia (anglais), « The Concept of Law » (publication, règles primaires et secondaires, trois défauts, braqueur armé)","url":"https://en.wikipedia.org/wiki/The_Concept_of_Law"},{"texte":"Stanford Encyclopedia of Philosophy, « The Nature of Law » (thèse de séparation, Fuller, objections)","url":"https://plato.stanford.edu/entries/lawphil-nature/"}]},{"id":"hegel-kojeve-lacan","discipline":"croisement","titre":"De Hegel à Lacan, le désir de reconnaissance","figure":"Hegel, Kojève, Lacan","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"La filiation est reconstituée à partir de l'Encyclopédie de Stanford, d'un article des Études philosophiques et d'une communication de colloque qui citent Kojève et les Écrits ; les séminaires de Kojève et les textes de Lacan n'ont pas été consultés directement.","reference":"Hegel, Phénoménologie de l'esprit (1807) ; Kojève, Introduction à la lecture de Hegel (1947) ; Lacan, Écrits (1966)","accroche":"Une page de Hegel, lue dans un séminaire parisien des années 1930, finit par donner sa formule centrale à la psychanalyse lacanienne. Histoire d'une transmission.","punch":"Désirer, c'est d'abord vouloir être reconnu par un autre qui désire.","idee":"Kojève lit le maître et l'esclave comme une anthropologie : le désir humain est désir d'un autre désir. Lacan, son auditeur, en tire « le désir de l'homme est le désir de l'Autre », puis transforme la formule : l'Autre devient le lieu du langage, et le désir l'écart que creuse la demande.","repere":"Le séminaire d'Alexandre Kojève sur la Phénoménologie de l'esprit se tient à l'École pratique des hautes études de 1933 à 1939. Raymond Queneau en publie les notes en 1947 sous le titre Introduction à la lecture de Hegel. Lacan fait partie des auditeurs.","liens":["hegel-maitre-esclave","lacan-desir-de-l-autre","lacan-stade-du-miroir"],"texte":"Certaines idées voyagent par les livres. Celle-ci a d'abord voyagé par une salle de cours. De 1933 à 1939, à l'École pratique des hautes études, Alexandre Kojève commente la *Phénoménologie de l'esprit* de Hegel devant un auditoire qui deviendra célèbre : Raymond Queneau, Georges Bataille, Raymond Aron, Maurice Merleau-Ponty, Jacques Lacan[^4]. Comme Kojève, Lacan exercera d'ailleurs son influence d'abord par un enseignement oral[^1].\n\nCette fiche suit une seule ligne dans cette histoire : comment une page de Hegel sur la reconnaissance devient, chez Lacan, une théorie du désir.\n\n## Premier temps : Hegel\n\nLa section de la *Phénoménologie* sur le maître et l'esclave part d'une thèse : la conscience de soi n'existe qu'en étant reconnue par une autre. Deux consciences qui veulent chacune être reconnues s'affrontent ; l'une recule devant la mort et devient l'esclave ; mais la reconnaissance que le maître obtient est « unilatérale et inégale », et c'est l'esclave, par la peur et le travail, qui se forme (voir la fiche sur Hegel).\n\nLe texte est dense, et Hegel l'insère dans un parcours beaucoup plus vaste, celui de l'esprit tout entier. Rien n'obligeait à en faire le centre du livre.\n\n## Deuxième temps : Kojève\n\nKojève, justement, en fait le centre. Il se concentre sur cette dialectique et y voit « l'acte anthropogène à l'origine de l'histoire », c'est-à-dire l'acte par lequel l'animal devient homme, sous la forme d'une « lutte de pur prestige pour la reconnaissance »[^2]. Sa lecture est une anthropologie : elle décrit le passage du désir animal au désir humain[^3].\n\nLe désir animal porte sur des choses : manger, boire, posséder. Le désir humain, lui, porte sur un autre désir. Kojève le formule ainsi : le désir humain est un « désir d'un autre désir »[^3]. Ce qu'on veut, au fond, c'est être désiré, reconnu par un autre qui désire lui aussi.\n\nCe n'est pas la seule manière de lire Hegel en France : Jean Hyppolite, son traducteur, puis Bernard Bourgeois ont emprunté d'autres voies[^2]. Mais c'est la lecture de Kojève qui atteint les auditeurs de 1933.\n\n> **Illustration (pas un exemple de Kojève).** Deux collègues se disputent un bureau près de la fenêtre. Aucun des deux ne tenait vraiment à la vue ; mais une fois l'autre intéressé, céder devient impossible. L'objet compte moins que ce qu'il signifie : avoir été préféré, l'avoir emporté devant l'autre. C'est le désir d'un autre désir, à l'échelle d'un bureau.\n\n## Troisième temps : Lacan reprend\n\nLacan retient la leçon. Il en tire un slogan qu'on a pu dire « hégélo-kojévien » : « le désir de l'homme est le désir de l'Autre »[^1]. On y entend encore Kojève : désirer, c'est désirer le désir d'un autre, être reconnu par lui.\n\nLes premiers textes de Lacan portent cette marque. Le moi, chez lui, « cristallise » le désir de l'Autre, et se forme dans un rapport à des alter ego, partenaires imaginaires dont il est inséparable[^1]. On comprend qu'il ait consacré un texte, en 1948, à l'agressivité en psychanalyse[^1] : quand chacun veut être reconnu par l'autre, la rivalité n'est jamais loin.\n\n## Quatrième temps : Lacan transforme\n\nMais Lacan ne s'arrête pas à Kojève. Deux déplacements séparent sa formule de celle de son maître.\n\n**L'Autre devient un lieu.** La majuscule n'est pas décorative. Le « grand Autre », chez Lacan, désigne l'ordre symbolique, le langage et ses lois, qu'on a rapproché de ce que Hegel appelait l'« esprit objectif »[^1]. Désirer depuis l'Autre, ce n'est plus seulement vouloir être reconnu par une personne ; c'est désirer dans une langue et à partir de significations qu'on n'a pas inventées (voir la fiche sur le désir de l'Autre).\n\n**Le désir se loge dans la demande.** Lacan distingue le besoin, la demande et le désir. La demande s'adresse à quelqu'un ; elle est, écrit-il, « intransitive, elle n'emporte aucun objet » (*Écrits*, p. 617)[^3]. Et le désir est « ce qui se manifeste dans l'intervalle que creuse la demande en-deçà d'elle-même » (*Écrits*, p. 627)[^3]. La reconnaissance de Kojève devient une demande d'amour qu'aucun objet ne comble.\n\nLe mouvement de ce désir, sans fin, a même été comparé au « mauvais infini » de Hegel[^1] : une poursuite qui recommence toujours, sans jamais se clore.\n\n> **Illustration (un parallèle clinique).** Une patiente obtient enfin le compliment qu'elle attendait de son père, et s'étonne de n'en éprouver aucun soulagement durable. Kojève dirait : elle voulait être reconnue. Lacan ajouterait : ce qu'elle demandait débordait tout ce qu'une phrase pouvait donner. La reconnaissance obtenue laisse intact l'écart où se loge le désir.\n\n## Ce que la filiation éclaire\n\nLire Lacan à partir de Hegel et de Kojève a deux intérêts. D'abord, cela rend moins mystérieuses des formules qui semblent sorties de nulle part : elles prolongent une discussion philosophique précise. Ensuite, cela montre ce que la psychanalyse ajoute à la philosophie : un désir qui ne cherche pas seulement la reconnaissance d'un autre, mais qui se constitue dans le langage, et qui ne trouve jamais l'objet qui le comblerait.","quiz":[{"question":"Comment Kojève lit-il la dialectique du maître et de l'esclave ?","choix":["Comme une anthropologie : le désir humain est désir d'un autre désir","Comme une description de l'esclavage dans l'Antiquité grecque","Comme une théorie économique du travail salarié moderne","Comme une allégorie religieuse de la chute et du salut"],"bonne":0,"explication":"Kojève en fait l'acte anthropogène qui fait de l'animal un homme : le désir humain porte sur le désir d'un autre, sur la reconnaissance. Ce n'est ni une histoire de l'esclavage, ni une économie, ni une allégorie religieuse."},{"question":"Que devient l'« Autre » quand Lacan reprend la formule de Kojève ?","choix":["Une personne précise, le plus souvent la mère","Un adversaire dans une lutte à mort pour le prestige","Un lieu : l'ordre symbolique, le langage et ses lois","Une illusion qu'il faut dissiper par l'analyse"],"bonne":2,"explication":"Le « grand Autre » désigne l'ordre symbolique, rapproché de l'esprit objectif hégélien. Des personnes peuvent l'incarner, mais il n'est pas une personne."},{"question":"Un adolescent ne veut une marque de baskets que depuis qu'un camarade admiré la porte. Laquelle de ces lectures est la plus kojévienne ?","choix":["Il a besoin de chaussures, et celles-ci sont les plus confortables","Il désire le désir de l'autre : être reconnu par celui qu'il admire","Il exprime une demande d'amour adressée à ses parents","Il obéit à une simple mode commerciale, sans enjeu psychique"],"bonne":1,"explication":"Chez Kojève, le désir humain porte sur un autre désir : l'objet vaut par la reconnaissance qu'il promet. La « demande d'amour » relève, elle, de la reprise lacanienne."},{"question":"Pourquoi Lacan dit-il que la demande est « intransitive » ?","choix":["Parce qu'elle ne s'adresse à personne","Parce qu'au-delà de l'objet demandé, elle n'en vise aucun en particulier","Parce qu'elle porte toujours sur un besoin biologique précis","Parce qu'elle se confond avec le désir lui-même"],"bonne":1,"explication":"La demande s'adresse à quelqu'un mais « n'emporte aucun objet » : ce qu'elle vise, au fond, c'est la présence et la réponse de l'autre. Le désir naît de l'écart qu'elle creuse."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (Kojève, slogan hégélo-kojévien, grand Autre et esprit objectif, mauvais infini)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"Wilma Pilati, « Kojève, Hyppolite et Bourgeois. Trois voies de l'hégélianisme », Les Études philosophiques, 2022/1, p. 89-104","url":"https://shs.cairn.info/article/LEPH_221_0089/pdf?lang=fr"},{"texte":"Christophe Laudou, « La demande de reconnaissance de Lacan à Hegel », colloque d'Évian, 2004 (Kojève ; Écrits, p. 617 et 627), L'Harmattan","url":"https://www.editions-harmattan.fr/media/107060/download/La%20demande%20de%20reconnaissance%20de%20Lacan%20%C3%A0%20Hegel.pdf"},{"texte":"Wikipédia, « Alexandre Kojève » (séminaire de 1933 à 1939, auditeurs)","url":"https://fr.wikipedia.org/wiki/Alexandre_Koj%C3%A8ve"}]},{"id":"montesquieu-le-pouvoir-arrete-le-pouvoir","discipline":"philosophie","titre":"Que le pouvoir arrête le pouvoir","figure":"Montesquieu","branche":"droit","fiabilite":"mixte","fiabilite_note":"Le chapitre VI du livre XI est cité d'après Wikisource, dans l'orthographe de l'édition de 1777 ; la formule du chapitre IV est donnée d'après la traduction anglaise que cite l'Encyclopédie de Stanford. La fiche présente une idée et son histoire, non l'état du droit d'un pays.","reference":"De l'esprit des lois (1748), livre XI, chapitres IV et VI","accroche":"La liberté politique, pour Montesquieu, n'est pas de faire ce qu'on veut. C'est de n'avoir pas à craindre l'abus du pouvoir, et cela suppose que le pouvoir ne soit pas tout entier au même endroit.","punch":"Là où un seul homme fait la loi, l'applique et juge, il n'y a point de liberté.","idee":"Montesquieu définit la liberté politique comme la tranquillité d'esprit née de l'opinion que chacun a de sa sûreté. Pour qu'on ne puisse abuser du pouvoir, il faut que le pouvoir arrête le pouvoir : séparer le législatif, l'exécutif et le judiciaire.","citation":"Lorsque dans la même personne ou dans le même corps de magistrature, la puissance législative est réunie à la puissance exécutrice, il n'y a point de liberté","citation_source":"Montesquieu, De l'esprit des lois (1748), livre XI, chapitre VI « De la constitution d'Angleterre » — édition de 1777, Wikisource","citation_url":"https://fr.wikisource.org/wiki/Esprit_des_lois_(1777)/L11/C6","liens":["rousseau-forcer-a-etre-libre","kant-lumieres","hart-regle-de-reconnaissance"],"texte":"*De l'esprit des lois* paraît en 1748. Montesquieu y a intégré des passages de ses *Considérations* de 1734, et il a passé deux ans en Angleterre, dont le système politique l'a fortement impressionné[^1]. L'ouvrage suscite des critiques : Montesquieu publie une *Défense de l'Esprit des lois* en 1750, et le livre est mis à l'Index en 1751[^1].\n\nLa séparation des pouvoirs prend aujourd'hui des formes différentes selon les constitutions : on suit ici l'idée, telle que Montesquieu la formule.\n\n## Une liberté qui tient à la sûreté\n\nAu livre XI, Montesquieu parle de la liberté politique. Elle n'est pas la liberté de faire tout ce qu'on veut. Le chapitre VI la définit ainsi : « La liberté politique dans un citoyen est cette tranquillité d'esprit qui provient de l'opinion que chacun a de sa sureté »[^2].\n\nCe qui compte, c'est donc le sentiment de ne pas pouvoir être visé par l'arbitraire d'un pouvoir. Les lois protègent les citoyens et leur donnent la confiance que la puissance de l'État ne se tournera pas contre eux tant qu'ils obéissent. On a rapproché cette idée de la formule de Judith Shklar, un « libéralisme de la peur »[^1].\n\n## Que le pouvoir arrête le pouvoir\n\nPour qu'une telle sûreté existe, il faut un remède à la tendance du pouvoir à abuser. Le chapitre IV le formule : il faut, par la nature même des choses, que le pouvoir arrête le pouvoir (*power should be a check to power*, dans la traduction que cite Stanford)[^1].\n\nLa solution est de ne pas réunir les pouvoirs. Au chapitre VI, intitulé « De la constitution d'Angleterre », Montesquieu écrit : « Il y a dans chaque état trois sortes de pouvoirs, la puissance législative, la puissance exécutrice des choses qui dépendent du droit des gens & la puissance exécutrice de celles qui dépendent du droit civil »[^2]. On les appelle aujourd'hui législatif, exécutif et judiciaire, mais la formule de Montesquieu est plus longue.\n\n## Quand ils sont réunis\n\nIl tire ensuite la conséquence : quand la puissance législative est réunie à la puissance exécutrice, « il n'y a point de liberté ». Et il va jusqu'au bout : « Tout seroit perdu, si le même homme, ou le même corps des principaux, ou des nobles, ou du peuple, exerçoient ces trois pouvoirs »[^2]. La liste est précise : peu importe que ce soit un seul homme, un groupe de grands, de nobles ou le peuple entier. Le problème vient de la concentration, non de l'identité de celui qui la détient.\n\nLe judiciaire n'échappe pas à la règle : « Il n'y a point encore de liberté, si la puissance de juger n'est pas séparée de la puissance législative & de l'exécutrice. » Jointe à l'exécutrice, elle ferait que « le juge pourroit avoir la force d'un oppresseur »[^2].\n\n> **Illustration (pas un exemple de Montesquieu).** Dans un petit club sportif, la même personne écrit le règlement, décide des sanctions et joue le rôle d'arbitre dans les litiges entre adhérents. Même si elle est honnête, les membres n'ont aucun moyen de contester une décision. Si une autre personne applique le règlement et une troisième juge les conflits, chacune peut limiter les deux autres. C'est le principe que Montesquieu applique à l'État.\n\n## Un pouvoir de juger invisible\n\nLe chapitre VI réserve au pouvoir de juger un traitement singulier. Bien organisé, il devient presque imperceptible : « la puissance de juger si terrible parmi les hommes, n'étant attachée ni à un certain état ni à une certaine profession, devient pour ainsi dire invisible & nulle »[^2]. On craint alors la magistrature, et non les magistrats[^1].\n\nLe même chapitre décrit les juges de la nation comme « la bouche qui prononce les paroles de la loi »[^2] : ils disent la loi, ils ne la font pas.\n\nPlusieurs dispositifs découlent de cette idée[^1] : seul le pouvoir législatif lève l'impôt, l'exécutif peut opposer son veto, le législatif est composé de deux chambres, et le judiciaire doit être indépendant et appliquer les lois de manière fixe et constante.\n\n> **Illustration.** Un salarié conteste une sanction devant le conseil de discipline de son entreprise, composé de la direction qui l'a sanctionné. Il a beau avoir raison, il ne s'attend à rien. Ce qui lui manque n'est pas une loi plus juste, c'est la « tranquillité d'esprit » que donne un juge distinct de celui qui punit.\n\n## Ce qui reste discuté\n\nMontesquieu décrit-il réellement l'Angleterre de son temps, ou construit-il un modèle à partir d'elle ? Il s'appuie sur ses observations du système anglais[^1], mais le titre même du chapitre VI parle d'une constitution plutôt que d'une pratique, et la question de l'écart entre les deux reste ouverte.","quiz":[{"question":"Comment Montesquieu définit-il la liberté politique au chapitre VI ?","choix":["Comme le droit de faire tout ce que l'on désire sans contrainte","Comme le pouvoir donné au peuple de gouverner en toutes circonstances","Comme l'absence de toute loi dans un État bien gouverné","Comme la tranquillité d'esprit née de l'opinion qu'on a de sa sûreté"],"bonne":3,"explication":"« La liberté politique dans un citoyen est cette tranquillité d'esprit qui provient de l'opinion que chacun a de sa sureté. » Elle repose sur la confiance de n'être pas visé par l'abus du pouvoir."},{"question":"Que dit Montesquieu quand législatif et exécutif sont réunis ?","choix":["Que l'État gagne en efficacité, puisque les décisions sont plus rapides","Que cela convient aux petits États, mais pas aux grands","Qu'il n'y a point de liberté","Que seul le peuple doit alors choisir ceux qui exercent le pouvoir"],"bonne":2,"explication":"« Lorsque dans la même personne ou dans le même corps de magistrature, la puissance législative est réunie à la puissance exécutrice, il n'y a point de liberté. »"},{"question":"Une assemblée élue vote une loi, puis désigne parmi ses membres ceux qui jugeront les citoyens accusés de l'avoir enfreinte. Qu'objecterait Montesquieu ?","choix":["Que juger n'est pas séparé de légiférer : il n'y a point de liberté","Rien, puisque l'assemblée a été élue par le peuple tout entier","Que les juges devraient être nommés à vie pour être compétents","Que la loi doit d'abord être approuvée par le roi"],"bonne":0,"explication":"Peu importe que le pouvoir soit tenu par le peuple ou ses élus : « tout seroit perdu » si le même corps exerçait les trois pouvoirs. La puissance de juger doit être séparée de la législative et de l'exécutrice."},{"question":"Que veut dire que la puissance de juger devient « invisible & nulle » ?","choix":["Que les juges n'ont aucun pouvoir réel et ne servent à rien","Que les procès doivent se tenir à huis clos, loin du public","Que, n'étant attachée à aucune profession, elle ne pèse sur personne","Que les juges doivent cacher leur identité aux accusés qu'ils jugent"],"bonne":2,"explication":"N'étant attachée « ni à un certain état ni à une certaine profession », la puissance de juger, si terrible, cesse d'être une menace permanente : on craint la magistrature, et non les magistrats."}],"sources":[{"texte":"Stanford Encyclopedia of Philosophy, « Montesquieu » (séparation des pouvoirs, liberté politique, mécanismes, date de 1748, voyage en Angleterre)","url":"https://plato.stanford.edu/entries/montesquieu/"},{"texte":"Montesquieu, De l'esprit des lois, livre XI, chapitre VI « De la constitution d'Angleterre » (Wikisource, édition de 1777)","url":"https://fr.wikisource.org/wiki/Esprit_des_lois_(1777)/L11/C6"}]},{"id":"nietzsche-eternel-retour","discipline":"philosophie","titre":"L'éternel retour","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"secondaire","fiabilite_note":"Le § 341 est cité d'après la traduction anglaise que reproduit Wikipédia ; les interprétations, d'après Wikipédia (qui renvoie à Heidegger, Kaufmann, Oger, Sinhababu et Kuong) et l'Encyclopédie de Stanford. Le texte allemand n'a pas été consulté.","reference":"Le Gai Savoir (1882), § 341 « Le poids le plus lourd » ; Ainsi parlait Zarathoustra (1883-1885) ; Ecce Homo (1888)","accroche":"Un démon vous murmure que vous revivrez cette vie à l'infini, à l'identique. Vous maudissez-le, ou vous lui dites merci ? Nietzsche fait de la réponse une épreuve.","punch":"Vivrais-tu encore cette vie, une infinité de fois, sans rien y changer ?","idee":"Au § 341 du Gai Savoir, un démon annonce que cette vie reviendra, à l'identique, une infinité de fois. Nietzsche présente l'idée comme une hypothèse, non comme un fait : elle donne à chaque instant « le poids le plus lourd », et mesure si l'on peut affirmer sa vie telle qu'elle est.","repere":"Le § 341 est l'avant-dernière section des quatre premiers livres du Gai Savoir (1882) ; la dernière cite le début d'Ainsi parlait Zarathoustra. Nietzsche dira de l'éternel retour qu'il est « l'idée fondamentale » d'Ainsi parlait Zarathoustra.","liens":["nietzsche-mort-de-dieu","schopenhauer-pendule","freud-fort-da"],"texte":"Le *Gai Savoir*, dans sa première édition de 1882, s'achève sur deux sections qui changent le ton du livre. La dernière cite le début de *Zarathoustra*[^2]. L'avant-dernière, le § 341, présente pour la première fois la pensée de l'éternel retour, et lui donne pour titre « le poids le plus lourd » (*the greatest weight*)[^2].\n\n## Le démon\n\nLe texte est une mise en scène : un démon vient annoncer : « Cette vie, telle que tu la vis maintenant et telle que tu l'as vécue, il te faudra la vivre encore une fois et d'innombrables fois » (*This life as you now live it and have lived it, you will have to live once more and innumerable times more*)[^1]. Il ne s'agit pas d'une autre vie, ni d'une vie meilleure, mais de celle-ci, telle qu'elle a été, avec ce qu'on regrette comme avec ce qu'on aime.\n\nNietzsche ne demande pas si c'est vrai. Il demande comment on recevrait cette annonce : comme une malédiction, ou comme une parole qu'on pourrait accueillir avec joie ?\n\nHeidegger a souligné ce point : Nietzsche présente l'idée comme une question hypothétique, non comme un fait[^1].\n\n> **Illustration (pas un exemple de Nietzsche).** On propose à quelqu'un, pour jeu, de choisir : revivre exactement sa dernière année, sans rien pouvoir y changer, ou l'effacer. La question l'oblige à regarder cette année autrement. Ce n'est plus « qu'est-ce qui s'est passé ? », mais « est-ce que je peux dire oui à ce qui s'est passé ? ». Certains répondent tout de suite ; d'autres découvrent, en hésitant, ce qu'ils n'ont jamais vraiment accepté. Le démon de Nietzsche pose cette question à l'échelle d'une vie entière.\n\n## Le poids le plus lourd\n\nPourquoi « le poids le plus lourd » ? Parce que l'hypothèse change la valeur de chaque instant. Si tout revient, rien n'est indifférent : chaque geste se répétera à l'infini. La pensée est censée donner à chaque événement un poids maximal[^2].\n\nElle sert alors d'épreuve. Une vie n'est bonne, dans cette lecture, que si, en imaginant son retour dans chaque détail, on peut l'affirmer telle qu'elle est[^2]. Le démon ne promet pas une autre vie, meilleure ou plus juste : il demande si l'on veut celle-ci.\n\n## Une doctrine ou une épreuve ?\n\nLes interprètes se partagent. Certains ont pris l'idée à la lettre, comme une thèse sur le cosmos : les carnets posthumes de Nietzsche contiennent une tentative de preuve, fondée sur un temps infini et une quantité finie d'énergie, qui aboutirait à un mouvement circulaire de séries identiques[^1]. Mais Nietzsche lui-même n'en était peut-être pas convaincu, et Georg Simmel a réfuté l'argument par une analogie avec des roues en rotation[^1].\n\nD'autres y lisent une épreuve éthique. Une note inédite propose une question à se poser avant chaque acte : est-ce un acte que je suis prêt à accomplir un nombre incalculable de fois ? On l'a comparée à l'impératif catégorique de Kant ; mais la plupart des spécialistes modernes rejettent cette lecture, faute d'un tel impératif dans les œuvres publiées[^1].\n\n## Zarathoustra et l'amor fati\n\nDans *Ainsi parlait Zarathoustra*, l'idée revient. Zarathoustra en est d'abord saisi d'horreur, puis il l'accepte comme son désir le plus ardent ; le « Chant de l'ivresse » dit que « toute joie veut l'éternité »[^1]. Nietzsche appellera l'éternel retour « l'idée fondamentale de l'œuvre »[^1].\n\nL'idée rejoint une formule d'*Ecce Homo* : sa formule de la grandeur, écrit Nietzsche, est *amor fati*, ne rien vouloir d'autre que ce qui est, ni dans l'avenir, ni dans le passé, ni pour l'éternité, mais l'aimer[^1]. Le mot apparaissait déjà au début du livre IV du *Gai Savoir* (§ 276)[^2].\n\n> **Illustration (un parallèle avec la clinique).** Une patiente répète qu'elle voudrait « effacer » une période de sa vie. Le travail de la cure ne consiste pas à effacer, et pas davantage à la forcer à aimer ce qu'elle a vécu. Il consiste parfois à lui permettre de reprendre cette période comme la sienne. L'éternel retour pose la question à l'extrême : peut-on vouloir son histoire plutôt que seulement la subir ?\n\n## Pourquoi c'est difficile\n\nL'idée est d'une simplicité vertigineuse et d'une exigence presque insupportable. Elle ne console pas : elle retire l'espoir d'un ailleurs, d'un rachat ou d'une compensation future. Elle n'accuse pas non plus : elle ne demande pas de juger sa vie, mais de savoir si l'on pourrait la vouloir. C'est en cela qu'elle prolonge la mort de Dieu : sans garantie extérieure, c'est à la vie elle-même de porter son poids.","quiz":[{"question":"Que propose le démon du § 341 ?","choix":["Une vie nouvelle, plus heureuse, après la mort","Le retour de cette vie, à l'identique, une infinité de fois","La réincarnation dans un autre corps, selon ses mérites","L'oubli complet de tout ce qui a été vécu"],"bonne":1,"explication":"Le démon annonce que cette vie reviendra telle quelle, dans le même ordre, une infinité de fois. Il ne promet ni récompense, ni réincarnation, ni oubli."},{"question":"Pourquoi Nietzsche parle-t-il du « poids le plus lourd » ?","choix":["Parce que la vie humaine est faite surtout de souffrance","Parce que si tout revient, chaque instant prend un poids maximal","Parce que le démon est une figure du péché","Parce que la pensée est difficile à comprendre"],"bonne":1,"explication":"Si chaque instant se répète à l'infini, rien n'est indifférent : la pensée donne à chaque événement le plus grand poids possible."},{"question":"Une femme se demande si elle accepterait de revivre exactement les dix dernières années, échecs compris. Dans quel esprit nietzschéen pose-t-elle la question ?","choix":["Elle cherche à prouver que le temps est circulaire","Elle prépare la liste de ce qu'elle changerait","Elle se demande si elle peut affirmer sa vie telle qu'elle a été","Elle obéit à un impératif moral que Nietzsche aurait formulé"],"bonne":2,"explication":"C'est l'usage de l'éternel retour comme épreuve d'affirmation : vouloir sa vie telle qu'elle est. Ce n'est ni une preuve cosmologique, ni un impératif, que la plupart des spécialistes ne trouvent pas dans les œuvres publiées."},{"question":"Que désigne l'amor fati dans Ecce Homo ?","choix":["Ne rien vouloir d'autre que ce qui est, et l'aimer","Accepter son sort avec tristesse, faute de mieux","Aimer le destin des autres plutôt que le sien","Croire qu'un dieu a fixé d'avance chaque événement"],"bonne":0,"explication":"C'est la formule de la grandeur selon Nietzsche : ne rien vouloir de différent, ni dans l'avenir ni dans le passé, mais l'aimer. Ce n'est ni de la résignation, ni une croyance en un destin divin."}],"sources":[{"texte":"Wikipédia (anglais), « Eternal return » (§ 341, Heidegger, preuve cosmologique, Simmel, épreuve éthique, Zarathoustra, amor fati)","url":"https://en.wikipedia.org/wiki/Eternal_return"},{"texte":"Stanford Encyclopedia of Philosophy, « Friedrich Nietzsche », § 3.2.2 « Affirmation » (le poids le plus lourd, GS 276 et 341)","url":"https://plato.stanford.edu/entries/nietzsche/"}]},{"id":"nietzsche-freud","discipline":"croisement","titre":"Le livre que Freud n'ouvrait pas","figure":"Nietzsche, Freud","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"La relation entre les deux auteurs est reconstituée d'après Wikipédia (qui renvoie à Peter Gay, Paul Roazen et Peter Rudnytsky), un article du British Journal of Psychiatry et l'Encyclopédie de Stanford ; la correspondance de Freud n'a pas été consultée directement.","reference":"Nietzsche, Le Gai Savoir (1882), Généalogie de la morale (1887) ; Freud, déclarations de 1908, Le Moi et le Ça (1923)","accroche":"Freud a acheté les œuvres complètes de Nietzsche, puis a dit ne pas les avoir ouvertes. Une résistance qui en dit long sur une parenté troublante.","punch":"Freud n'a pas lu Nietzsche, dit-il. Il le tenait à distance.","idee":"Freud dit ne pas avoir étudié Nietzsche, dont les intuitions ressemblaient trop aux siennes. Inconscient, refoulement, retournement des sentiments hostiles : les analogies sont réelles. La question n'est pas qui a copié qui, mais pourquoi deux pensées si proches se sont tenues à distance.","repere":"En 1900, Freud achète les œuvres complètes de Nietzsche ; il écrit alors espérer y trouver les mots de beaucoup de choses qui restent muettes en lui. Il dira plus tard ne pas les avoir encore ouvertes. Nietzsche, lui, ne pouvait pas lire Freud : il a cessé d'écrire en 1889.","liens":["nietzsche-ressentiment","nietzsche-perspectivisme","freud-moi-pas-maitre"],"texte":"Les historiens de la psychanalyse aiment cette scène, parce qu'elle a quelque chose d'un symptôme. En 1900, l'année de *L'Interprétation du rêve*, Freud achète les œuvres complètes de Nietzsche. Il écrit à son ami Fliess qu'il espère y trouver « les mots de beaucoup de choses qui restent muettes en moi ». Plus tard, il dira ne pas les avoir encore ouvertes[^1].\n\n## Ce que Freud a dit\n\nFreud a répété qu'il n'avait jamais lu Nietzsche[^2]. Ses déclarations sont pourtant plus nuancées qu'un simple refus. En 1908, il dit lire Nietzsche de temps à autre, et en être fortement fasciné, mais sans l'étudier : ses intuitions ressemblaient trop à ses propres travaux du moment, et il se sentait submergé par sa richesse d'idées[^1].\n\nLes biographes ont relevé d'autres traces. Selon Paul Roazen, qui cite Peter Rudnytsky, Freud aurait lu *La Naissance de la tragédie*, et probablement les deux premières *Considérations inactuelles*, à dix-sept ans[^1]. Et son biographe Peter Gay résume l'attitude de Freud d'une formule : il traitait les écrits de Nietzsche « comme des textes à combattre bien plus qu'à étudier »[^1].\n\nFreud se disait d'ailleurs peu enclin, de manière générale, à rattacher ses idées à des théories philosophiques antérieures[^1].\n\n> **Illustration (pas une thèse des auteurs).** Un chercheur apprend qu'un collègue étranger travaille exactement sur sa question. Il pourrait lire ses articles. Il ne le fait pas : il craint d'y trouver ses propres idées déjà formulées, et de ne plus savoir ce qui lui appartient. Ce n'est pas de l'ignorance, c'est une manière de protéger un travail en cours. Le cas de Freud a quelque chose de cette prudence.\n\n## Ce que les lecteurs ont trouvé\n\nLes analogies sont nombreuses. Un article du *British Journal of Psychiatry* en relève plusieurs : l'inconscient, le refoulement, la formation de substituts, comme des sentiments hostiles qui s'expriment sous la forme de l'altruisme, ou encore la projection de sentiments hostiles à l'origine de la pensée paranoïaque. Certains termes de base de Freud, notent les auteurs, sont identiques à ceux de Nietzsche[^2].\n\nDu côté de Nietzsche, l'idée qu'une grande part de notre vie psychique échappe à la conscience est explicite. Dans *Le Gai Savoir*, il écrit que « de loin la plus grande part de l'activité de notre esprit » reste inconsciente et non ressentie (§ 333) ; dans *Aurore*, que nous avons l'habitude d'exclure de nos comptes tous les processus inconscients (§ 129)[^3]. Et dans la *Généalogie de la morale*, il cherche aux valeurs morales une cause physiologique : le ressentiment a une « cause » réelle, dans le corps[^3].\n\n## Un mot venu d'ailleurs\n\nUn détail de vocabulaire montre à quel point les chemins se croisent. En 1923, dans *Le Moi et le Ça*, Freud nomme *das Es*, « le ça », la part impersonnelle du psychisme. Le terme vient du médecin Georg Groddeck, dont *Le Livre du ça* paraît la même année[^4]. Freud reconnaît lui-même cet emprunt[^1] : pour nommer ce qui, en nous, n'est pas « moi », il prend le mot d'un autre.\n\n## Deux manières de démasquer\n\nPaul Ricœur rangera les deux hommes, avec Marx, parmi les « maîtres du soupçon » : des penseurs qui tiennent le sens qui se présente à la conscience pour un effet, produit par autre chose (voir la fiche sur Ricœur). Mais la manière diffère.\n\nNietzsche interprète en philologue et en généalogiste. Il lit les valeurs comme des symptômes d'un type de vie, et sa question est : quel type d'homme a besoin de croire cela ? Freud travaille en clinicien. Il part de symptômes singuliers, de rêves et de lapsus, et construit une théorie révisable à partir de ce que la cure lui montre.\n\n> **Illustration (un rapprochement, à prendre comme tel).** Le mélancolique de Freud s'accuse de défauts qui conviennent mieux à l'objet perdu : ses plaintes sont des accusations retournées contre lui-même (voir la fiche sur le deuil). L'homme du ressentiment de Nietzsche, privé d'action, invente des valeurs qui accusent l'autre. Dans les deux cas, une hostilité qui ne peut pas s'exprimer directement change de forme et de cible. Les deux auteurs n'en tirent pas les mêmes conclusions ; mais la structure est voisine.\n\n## Ce que la proximité enseigne\n\nOn pourrait chercher qui a anticipé qui. La question est sans grand intérêt : Nietzsche ne pouvait pas lire Freud, et Freud a choisi de ne pas lire Nietzsche de près. Ce qui est plus instructif, c'est la distance elle-même. Une pensée qui s'élabore a parfois besoin de ne pas savoir qu'elle a été devancée. Freud, qui a tant écrit sur la résistance, en offre ici un exemple discret, à propos de ses propres lectures.","quiz":[{"question":"Que dit Freud en 1908 de sa lecture de Nietzsche ?","choix":["Qu'il l'a étudié de près dès ses années de lycée","Qu'il le lit parfois, fasciné, sans l'étudier, tant il lui ressemble","Qu'il n'en a jamais entendu parler avant les années 1920","Qu'il le juge sans intérêt pour la psychanalyse"],"bonne":1,"explication":"Freud se dit fortement fasciné, mais il évite d'étudier Nietzsche : ses intuitions ressemblaient trop à ses propres travaux. Il ne le juge pas sans intérêt, au contraire."},{"question":"D'où vient le terme das Es, « le ça », chez Freud ?","choix":["D'un néologisme forgé par Freud dans L'Interprétation du rêve","Du médecin Georg Groddeck, à qui Freud l'emprunte","D'une traduction de l'anglais « id » par Marie Bonaparte","D'un terme de la philosophie de Kant"],"bonne":1,"explication":"Freud reconnaît emprunter das Es à Georg Groddeck ; « id » est au contraire la traduction latine choisie en anglais."},{"question":"Un collègue soutient : « Freud a tout pris à Nietzsche. » Quelle réponse est la plus juste ?","choix":["Il a raison : Freud reconnaît l'avoir étudié et copié","Il a tort : il n'existe aucune ressemblance entre leurs idées","Les analogies sont réelles, mais Freud l'a tenu à distance et part de la clinique","La question est absurde, puisque Nietzsche est venu après Freud"],"bonne":2,"explication":"Les ressemblances sont relevées par les commentateurs, et Freud lui-même les reconnaît en 1908 ; mais il dit avoir évité d'étudier Nietzsche, et sa méthode est clinique. Nietzsche a cessé d'écrire en 1889."},{"question":"Qu'ont en commun le ressentiment nietzschéen et la mélancolie freudienne, dans le rapprochement proposé ?","choix":["Les deux sont des maladies du corps, sans dimension psychique","Une hostilité empêchée change de forme et de cible","Les deux reposent sur une confiance totale dans la conscience","Les deux décrivent une joie excessive"],"bonne":1,"explication":"Chez Nietzsche, l'impuissance à agir crée des valeurs qui accusent l'autre ; chez Freud, les reproches à l'objet perdu se retournent contre le moi. La structure est voisine, les conclusions diffèrent."}],"sources":[{"texte":"Wikipédia (anglais), « Sigmund Freud » (Nietzsche : déclaration de 1908, achat des œuvres en 1900, Gay, Roazen, Rudnytsky)","url":"https://en.wikipedia.org/wiki/Sigmund_Freud"},{"texte":"A. H. Chapman et M. Chapman-Santana, « The Influence of Nietzsche on Freud's Ideas », British Journal of Psychiatry, 166 (2), 1995, p. 251-253","url":"https://www.cambridge.org/core/journals/the-british-journal-of-psychiatry/article/influence-of-nietzsche-on-freuds-ideas/8557C7EE2793827FB7AD66FE61F3ACFE"},{"texte":"Stanford Encyclopedia of Philosophy, « Nietzsche's Moral and Political Philosophy » (inconscient, cause physiologique du ressentiment)","url":"https://plato.stanford.edu/entries/nietzsche-moral-political/"},{"texte":"Wikipédia (anglais), « Id, ego and superego » (Groddeck et das Es)","url":"https://en.wikipedia.org/wiki/Id,_ego_and_superego"}]},{"id":"nietzsche-mort-de-dieu","discipline":"philosophie","titre":"Dieu est mort","figure":"Friedrich Nietzsche","branche":"nietzsche","fiabilite":"mixte","fiabilite_note":"Le § 125 est cité d'après la traduction anglaise de Walter Kaufmann (1974) reproduite sur une page universitaire, et d'après une traduction française citée dans une conférence de classes préparatoires ; le sens de la formule, d'après Wikipédia, qui renvoie notamment à Heidegger.","reference":"Le Gai Savoir (1882), § 125 « L'insensé » ; § 343 (livre V, 1887) ; Ainsi parlait Zarathoustra (1883-1885)","accroche":"La phrase est souvent lue comme un slogan athée. Chez Nietzsche, elle est prononcée par un fou, sur une place, devant des gens qui ne croient déjà plus. Et il se dit venu trop tôt.","punch":"Dieu est mort, et personne n'a encore compris ce que cela change.","idee":"Dans le Gai Savoir, un insensé annonce sur la place du marché que Dieu est mort et que nous l'avons tué. Ce n'est pas une preuve d'athéisme : c'est le diagnostic d'une culture qui a perdu le fondement de ses valeurs sans en avoir mesuré les conséquences.","repere":"L'expression apparaît une première fois dans le Gai Savoir (1882), dans une section intitulée « Nouveaux combats », à propos de l'ombre de Bouddha qu'on montra des siècles durant dans une caverne. Le § 125 la met dans la bouche d'un insensé ; le § 343, ajouté en 1887, en donne l'explication.","liens":["nietzsche-perspectivisme","nietzsche-ressentiment","kierkegaard-angoisse"],"texte":"La phrase est l'une des plus connues de la philosophie, et l'une des plus mal lues. On l'entend comme une thèse : Dieu n'existe pas. Chez Nietzsche, c'est d'abord une scène, et il faut la lire comme une scène.\n\n## L'insensé sur la place\n\nLe § 125 du *Gai Savoir* s'intitule « L'insensé ». Un homme, une lanterne à la main, court sur la place du marché et crie : « Je cherche Dieu ! Je cherche Dieu ! » (*I seek God!*)[^1]. Autour de lui se tiennent beaucoup de gens qui ne croient pas en Dieu, et ils se moquent : Dieu s'est-il perdu ? s'est-il caché ?\n\nL'insensé les fixe et leur répond que Dieu est mort, et que nous l'avons tué, eux et lui[^2]. « Dieu est mort ! Dieu reste mort ! Et c'est nous qui l'avons tué ! » (*God is dead! God remains dead! And we have killed him!*)[^1]. Et il pose une question vertigineuse : « Comment avons-nous fait cela ? »[^3]\n\nPuis il se tait, regarde ses auditeurs, qui se taisent aussi, et jette sa lanterne à terre : « Elle se brisa et s'éteignit ». Et il dit : « je viens trop tôt, ce n'est pas encore mon heure »[^3].\n\n> **Illustration (pas un exemple de Nietzsche).** Imaginez quelqu'un qui annonce à une assemblée de comptables que la monnaie a perdu toute valeur. Ils sourient : chacun sait que les billets ne sont que du papier. Mais ils continuent à compter, à épargner, à se faire confiance comme si de rien n'était. L'annonce n'apprend rien à leur raison ; elle annonce un effondrement dont ils n'ont pas encore éprouvé les effets. C'est la situation de l'insensé.\n\n## À qui il parle\n\nLe détail décisif est le public. L'insensé ne s'adresse pas à des croyants qu'il faudrait convertir à l'athéisme. Il parle à des gens qui ne croient déjà plus. Ce qu'il leur reproche n'est pas de croire, c'est de ne pas mesurer ce que signifie la fin de la croyance.\n\nLe sens de la formule, rappelle-t-on souvent, n'est ni de constater la disparition d'un être surnaturel, ni d'avancer un argument athée. C'est un diagnostic sur l'état de la civilisation occidentale : « Dieu » y est le symbole de la morale chrétienne et de la vision métaphysique qui, pendant des siècles, ont fondé les valeurs, le sens et la morale en Europe[^2].\n\n## Ce que la mort de Dieu emporte\n\nLe § 343, ajouté en 1887 en ouverture du cinquième livre, donne la clé : que Dieu soit mort signifie que la croyance au Dieu chrétien est devenue indigne de foi[^2]. Et Nietzsche annonce ce qui en découle : une « longue profusion et succession de démolitions, de destructions, de déclins, de bouleversements » qui attend l'Europe[^3].\n\nSi la croyance tombe, tout ce qui s'appuyait sur elle vacille : l'idée d'un sens donné d'avance, d'une morale fondée hors du monde, d'une vérité garantie. L'événement est immense, et c'e
