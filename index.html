st pourquoi l'insensé vient « trop tôt » : la nouvelle n'est pas encore arrivée jusqu'à ceux qui en vivent pourtant déjà.\n\n> **Illustration.** Une personne a perdu la foi de son enfance depuis des années. Elle n'y pense plus. Mais le jour où elle doit prendre seule une décision grave, sans règle reçue qui tranche pour elle, elle découvre un vide qu'elle n'avait pas mesuré. La croyance était partie ; ce qu'elle soutenait, lui, n'avait pas encore été remplacé.\n\n## Zarathoustra\n\nDans *Ainsi parlait Zarathoustra*, Zarathoustra rencontre dans la forêt un vieux saint et s'étonne, une fois seul, qu'il n'ait pas encore entendu dire que Dieu est mort[^2]. Plus loin, la première partie se termine sur une formule : « Morts sont tous les dieux : maintenant nous voulons que vive le surhomme »[^2]. La mort de Dieu n'est pas un point d'arrivée. Elle ouvre une tâche : créer des valeurs, là où il n'y en a plus de garanties.\n\n## Une postérité\n\nHeidegger consacre en 1943 une étude à « La parole de Nietzsche \"Dieu est mort\" »[^2]. L'expression a depuis nourri bien d'autres lectures, philosophiques et théologiques. Ce que la scène du § 125 garde de singulier, c'est son ton : ni triomphe ni soulagement, mais l'effroi de quelqu'un qui voit ce que les autres ne voient pas encore.\n\nOn peut y entendre une question qui ne regarde pas seulement la religion : que devient un sujet, ou une culture, quand ce qui garantissait le sens se retire, et qu'il faut continuer à vivre sans cette garantie ?","quiz":[{"question":"À qui l'insensé du § 125 annonce-t-il la mort de Dieu ?","choix":["À des prêtres réunis dans leur église","À des incroyants, qui se moquent de lui","À des enfants qu'il veut instruire","Au roi, pour qu'il change les lois"],"bonne":1,"explication":"Il s'adresse à des incroyants. Ce qu'il leur reproche n'est pas leur foi, mais de ne pas mesurer ce que la fin de la croyance emporte."},{"question":"Pourquoi l'insensé dit-il qu'il « vient trop tôt » ?","choix":["Parce que Dieu n'est pas encore mort à ce moment-là","Parce que la place du marché n'est pas encore ouverte à cette heure","L'événement a eu lieu, mais personne n'en mesure la portée","Parce qu'il doit d'abord convaincre les savants"],"bonne":2,"explication":"L'événement a eu lieu, « nous l'avons tué », mais la nouvelle n'est pas encore arrivée jusqu'à ceux qui en vivent. Le décalage entre l'événement et sa prise de conscience fait le sens de la scène."},{"question":"Un étudiant affirme : « Nietzsche démontre que Dieu n'existe pas. » Quelle correction s'impose ?","choix":["Aucune : c'est exactement la thèse du § 125","C'est un diagnostic : la croyance qui fondait les valeurs s'est effondrée","Nietzsche démontre au contraire que Dieu existe","La formule est une plaisanterie, sans portée philosophique réelle"],"bonne":1,"explication":"La formule ne prétend pas démontrer l'inexistence de Dieu : « Dieu » y symbolise la morale et la métaphysique qui fondaient les valeurs européennes. C'est leur effondrement qui est diagnostiqué."},{"question":"Que signifie la mort de Dieu selon le § 343 ?","choix":["Que la croyance au Dieu chrétien est devenue indigne de foi","Que l'Église a été abolie par une révolution","Que la science a prouvé la fausseté de la Bible","Que les hommes ont cessé de chercher le bonheur"],"bonne":0,"explication":"Le § 343 explique la formule : la croyance au Dieu chrétien est devenue indigne de foi, avec les « démolitions » et « bouleversements » qui en découlent."}],"sources":[{"texte":"Nietzsche, The Gay Science, § 125 « The Madman », trad. Walter Kaufmann (1974), page de cours, université de Hong Kong","url":"https://philosophy.hku.hk/courses/200506/yphi0002/files/28-sept.htm"},{"texte":"Wikipédia (anglais), « God is dead » (première apparition, § 343, Zarathoustra, sens, Heidegger)","url":"https://en.wikipedia.org/wiki/God_is_dead"},{"texte":"Conférence « Nietzsche, la mort de Dieu », lycée Bellevue, décembre 2020 (extraits français des § 125 et 343)","url":"https://site.ac-martinique.fr/philosophie/wp-content/uploads/sites/20/2023/11/NIETZSCHE_mort-de-dieu_decembre2020.pdf"}]},{"id":"rousseau-forcer-a-etre-libre","discipline":"philosophie","titre":"Forcé d'être libre ?","figure":"Jean-Jacques Rousseau","branche":"politique","fiabilite":"mixte","fiabilite_note":"Le Contrat social est cité d'après une édition de diffusion libre (MetaLibri, d'après l'édition de 1782), qui donne « à être libre » ; les lectures de la volonté générale, d'après l'Encyclopédie de Stanford.","reference":"Du contrat social (1762), livre I, chapitres VI et VII","accroche":"La formule a servi à accuser Rousseau de justifier la contrainte. Elle est pourtant le centre de son argument sur la liberté : celle qui ne dépend de personne.","punch":"Obéir à la loi que l'on s'est donnée, c'est ne dépendre de personne.","idee":"Pour Rousseau, celui qui refuse d'obéir à la volonté générale sera « contraint par tout le corps », ce qui veut dire qu'on le forcera à être libre. La liberté visée n'est pas l'absence de toute contrainte : c'est l'absence de dépendance personnelle.","citation":"quiconque refusera d'obéir à la volonté générale, y sera contraint par tout le corps ; ce qui ne signifie autre chose sinon qu'on le forcera à être libre","citation_source":"Rousseau, Du contrat social (1762), livre I, chapitre VII, édition MetaLibri (2008) du texte de 1782","citation_url":"https://lapasserelle.com/divers/RousseauJJ_ContratSocial_p.pdf","liens":["kant-lumieres","hegel-maitre-esclave","spinoza-desir"],"texte":"*Du contrat social* paraît en 1762, la même année qu'*Émile*. Les deux livres sont condamnés à Genève, *Émile* l'est aussi à Paris, et Rousseau renonce en mai 1763 à sa citoyenneté genevoise[^2]. Dans ce livre, une phrase est devenue célèbre et scandaleuse : celle qui dit qu'on peut « forcer à être libre ». Pour la comprendre, il faut remonter au problème que Rousseau cherche à résoudre.\n\n## Un problème à résoudre\n\nLe livre s'ouvre sur une enquête, et non sur un constat : « Je veux chercher si, dans l'ordre civil, il peut y avoir quelque règle d'administration légitime et sûre. » Le premier chapitre pose la difficulté avec une phrase fameuse : « L'homme est né libre, et partout il est dans les fers »[^1]. Comment un pouvoir peut-il être légitime, et pas seulement fort ?\n\nAu chapitre VI, Rousseau énonce le problème précis que le contrat doit résoudre : « Trouver une forme d'association qui défende et protège de toute la force commune la personne et les biens de chaque associé, et par laquelle chacun, s'unissant à tous, n'obéisse pourtant qu'à lui-même, et reste aussi libre qu'auparavant »[^1].\n\nTout est là. Il ne s'agit pas de choisir entre l'ordre et la liberté. Il s'agit de trouver une règle commune telle que, en lui obéissant, chacun n'obéisse qu'à lui-même.\n\n## La phrase du chapitre VII\n\nAu chapitre VII, Rousseau doit rendre cet engagement effectif. Un pacte qui n'engagerait personne ne vaudrait rien. Il écrit donc : « Afin donc que ce pacte social ne soit pas un vain formulaire, il renferme tacitement cet engagement, qui seul peut donner de la force aux autres, que quiconque refusera d'obéir à la volonté générale, y sera contraint par tout le corps ; ce qui ne signifie autre chose sinon qu'on le forcera à être libre »[^1].\n\nLa fin de la phrase est celle qu'on retient, mais Rousseau la prolonge aussitôt : « car telle est la condition qui, donnant chaque citoyen à la patrie, le garantit de toute dépendance personnelle, condition qui fait l'artifice et le Jeu de la machine politique, et qui seule rend légitimes les engagements civils, lesquels, sans cela, seraient absurdes, tyranniques, et sujets aux plus énormes abus »[^1].\n\n## La clé : la dépendance personnelle\n\nLe mot décisif est « dépendance personnelle ». Pour Rousseau, être libre n'est pas faire tout ce qu'on veut. C'est ne pas dépendre de la volonté d'un autre. Dans ce passage, la contrainte procure une garantie contre toute dépendance personnelle : la liberté visée est une protection contre la dépendance, non une absence de toute contrainte[^2].\n\n> **Illustration (pas un exemple de Rousseau).** Une salariée dépend entièrement de l'humeur de son patron : il peut la renvoyer ou l'augmenter selon son bon plaisir. Elle est soumise à sa volonté particulière. Une autre salariée est tenue par un règlement que tout le monde connaît, patron compris, et qui s'applique de la même manière à chacun. Elle est contrainte, elle aussi : elle doit respecter les horaires. Mais elle ne dépend d'aucune personne. C'est cette différence que Rousseau cherche à penser.\n\nCe qui rend la loi acceptable, c'est qu'elle émane de la volonté générale, et que le souverain, « n'étant formé que des particuliers qui le composent, n'a ni ne peut avoir d'intérêt contraire au leur »[^1]. La contrainte ne vient donc pas d'un maître extérieur : elle revient du corps dont chacun fait partie.\n\n## Que veut dire « volonté générale » ?\n\nLa question est restée ouverte. On a lu cette notion de deux façons principales : une conception démocratique, où la volonté générale est ce que les citoyens ont décidé en assemblée souveraine, et une conception « transcendante », où elle est l'incarnation de l'intérêt commun des citoyens, indépendamment de ce que chacun veut. D'autres lectures la décrivent comme une volonté individuelle tournée vers le bien commun, ou comme une manière délibérative de découvrir l'intérêt public[^2].\n\nSelon qu'on choisit l'une ou l'autre, la phrase sur la contrainte ne sonne pas de la même façon. Dans la lecture démocratique, elle dit qu'un citoyen doit respecter ce que l'assemblée a décidé. Dans la lecture transcendante, elle peut paraître dire qu'on peut imposer à quelqu'un ce qu'il « devrait » vouloir, et c'est là que le soupçon d'autoritarisme apparaît.\n\n## Les objections\n\nLe passage est réputé (*notorious*), et il renforce le soupçon que l'engagement de Rousseau envers la liberté est moins simple qu'il n'y paraît. Des auteurs hostiles ont vu dans Rousseau une source de certains aspects autoritaires de la Révolution française, puis, plus tard, du fascisme et du communisme. D'autres, comme Neuhouser (1993), le lisent comme défendant une liberté morale : obéir à une loi qu'on s'est prescrite à soi-même[^2].\n\nSur le sort de la minorité battue (livre IV, chapitre 3), beaucoup de commentateurs jugent l'argument de Rousseau peu convaincant[^2]. La formule est donc plus précise, et plus discutable, qu'une simple apologie de la contrainte.","quiz":[{"question":"Quel est, selon Rousseau, le problème que le pacte social doit résoudre ?","choix":["Trouver une association où chacun, uni à tous, n'obéisse qu'à lui-même et reste libre","Trouver comment un roi peut gouverner sans jamais rencontrer de résistance du peuple","Trouver comment les plus riches peuvent protéger leurs biens contre les pauvres","Trouver comment chaque citoyen peut vivre à l'écart de toute loi et de tout autre citoyen"],"bonne":0,"explication":"Au chapitre VI du livre I, Rousseau cherche une association qui protège chaque associé tout en laissant chacun « aussi libre qu'auparavant », en n'obéissant qu'à lui-même."},{"question":"Que garantit la contrainte, d'après la suite de la phrase du chapitre VII ?","choix":["Une liberté de faire tout ce que chacun désire, sans loi","La disparition de toute forme de contrainte dans la société","La protection contre toute dépendance personnelle","Le droit pour le plus fort de commander les autres"],"bonne":2,"explication":"Rousseau écrit que cette condition « garantit de toute dépendance personnelle » le citoyen. La liberté en jeu est l'absence de dépendance envers une personne, et non l'absence de contrainte."},{"question":"Comment a-t-on lu la volonté générale de Rousseau ?","choix":["Comme une simple moyenne arithmétique des préférences privées de chacun","Comme la volonté du gouvernement quand il est élu par la majorité","Comme la volonté d'un sous-groupe qui représente les intérêts du peuple","Comme une décision démocratique, ou comme l'intérêt commun lui-même"],"bonne":3,"explication":"Stanford distingue une lecture démocratique (ce que les citoyens ont décidé en assemblée) et une lecture transcendante (l'incarnation de l'intérêt commun), et en mentionne d'autres. Elle ne la réduit pas à une moyenne."},{"question":"Un club de quartier adopte en assemblée une règle sur les nuisances sonores ; un membre qui l'a votée la refuse ensuite quand elle le gêne. Que dirait Rousseau de la contrainte qu'on lui impose ?","choix":["Qu'elle le soumet à la loi commune, et non à la volonté d'un autre","Qu'elle est illégitime, puisqu'il a changé d'avis depuis le vote","Qu'elle est justifiée par la seule force du plus grand nombre","Qu'elle le prive de toute liberté, définitivement"],"bonne":0,"explication":"Pour Rousseau, la contrainte exercée par « tout le corps » garantit contre la dépendance personnelle : obéir à la loi qu'on s'est donnée, ce n'est dépendre de personne. C'est le sens de « forcer à être libre »."}],"sources":[{"texte":"Rousseau, Du contrat social, texte complet (édition MetaLibri, 2008, d'après l'édition de 1782)","url":"https://lapasserelle.com/divers/RousseauJJ_ContratSocial_p.pdf"},{"texte":"Stanford Encyclopedia of Philosophy, « Jean-Jacques Rousseau » (§1 publication, §3 volonté générale et liberté, §6 réception)","url":"https://plato.stanford.edu/entries/rousseau/"},{"texte":"Extraits commentés du Contrat social, livre I, ch. VII (éd. Garnier-Flammarion, 1966, p. 55-56), académie de Grenoble","url":"https://philosophie-pedagogie.web.ac-grenoble.fr/sites/default/files/media-fichiers/2021-07/liberte_clement.pdf"}]},{"id":"sartre-mauvaise-foi","discipline":"croisement","titre":"Sartre contre l'inconscient","figure":"Jean-Paul Sartre, Freud","branche":"dialogues","fiabilite":"secondaire","fiabilite_note":"L'Être et le néant est présenté d'après l'Encyclopédie de Stanford, qui le cite dans les traductions anglaises de Barnes (1956) et de Richmond (2018), et d'après Wikipédia pour les exemples ; le livre n'a pas été consulté directement.","reference":"Sartre, L'Être et le néant (1943), Ire partie, chap. II « La mauvaise foi » et IVe partie « La psychanalyse existentielle »","accroche":"Pour Sartre, on ne se ment pas sans le savoir. Là où Freud voit un inconscient qui refoule, il voit une conscience qui se dérobe à elle-même : la mauvaise foi.","punch":"On ne peut pas se mentir sans savoir, d'une certaine façon, qu'on se ment.","idee":"Sartre refuse l'inconscient freudien : la censure devrait savoir ce qu'elle refoule. Il propose la mauvaise foi, fuite de la conscience devant sa propre liberté, et une « psychanalyse existentielle » qui cherche un projet originel, vécu sans être connu.","repere":"L'Être et le néant paraît en 1943. Sartre y décrit la mauvaise foi à travers des scènes devenues célèbres, le garçon de café et la jeune femme au rendez-vous, et y esquisse une « psychanalyse existentielle » qu'il appliquera ensuite à Baudelaire (1947).","liens":["freud-moi-pas-maitre","kierkegaard-angoisse","descartes-malin-genie"],"texte":"En 1943, Jean-Paul Sartre publie *L'Être et le néant*. L'un de ses chapitres s'attaque à une question que la psychanalyse croyait avoir réglée : comment peut-on se mentir à soi-même ? Freud répondait par l'inconscient. Sartre trouve cette réponse incohérente, et il en propose une autre.\n\n## Le problème du mensonge à soi\n\nMentir à quelqu'un suppose deux personnes : un menteur, qui sait la vérité, et une dupe, qui l'ignore. Se mentir à soi-même semble demander l'impossible : être à la fois celui qui sait et celui qui ne sait pas.\n\nFreud résout la difficulté en divisant le psychisme. Une partie refoule, une autre est refoulée, et la conscience ignore ce qui se passe. Sartre décrit cette solution comme l'installation d'une dualité de « menteur » et de « trompé » à l'intérieur d'une seule conscience[^1].\n\n## L'objection de la censure\n\nSon objection porte sur la censure, l'instance qui, chez Freud, décide de ce qui peut accéder à la conscience. Pour refouler efficacement, elle doit savoir ce qu'elle refoule ; mais si elle le sait, elle ne peut pas l'ignorer. Elle doit savoir assez pour refouler, sans savoir trop[^1]. Autrement dit, on retrouve, au niveau de la censure, exactement le problème qu'on voulait résoudre : une conscience qui sait et ne sait pas à la fois.\n\nPour Sartre, l'hypothèse de l'inconscient ne supprime donc pas le mensonge à soi ; elle le déplace. Mieux vaut l'affronter directement.\n\n## La mauvaise foi\n\nSa réponse s'appelle la mauvaise foi. Ce n'est pas un mensonge ordinaire, ni un mécanisme inconscient. C'est une manière qu'a la conscience de fuir sa propre liberté, tout en s'appuyant sur elle pour accomplir cette fuite[^2]. Pour Sartre, l'être humain est « condamné » à la liberté, avec l'angoisse et la responsabilité qui en découlent[^1].\n\nDeux scènes illustrent cette fuite. Le garçon de café joue à être garçon de café : son mouvement est vif, tourné vers l'avant, un peu trop précis, un peu trop rapide[^2]. Il se fait chose, rôle, fonction, comme s'il n'était que cela ; il l'est, écrit Sartre, « sur le mode d'être ce que je ne suis pas »[^1]. Une jeune femme, à un premier rendez-vous, laisse sa main dans celle de l'homme, ni consentante ni résistante, comme une chose : elle traite sa main comme si elle ne la concernait pas, ce qui retarde le moment de choisir[^2].\n\nDans les deux cas, personne ne cache rien à personne. La conscience se dérobe, et elle sait, d'une certaine manière, qu'elle se dérobe.\n\n> **Illustration (pas un exemple de Sartre).** Quelqu'un dit : « Je suis comme ça, je ne peux pas m'empêcher de m'emporter. » La phrase présente un comportement comme une nature, une chose. Sartre y verrait de la mauvaise foi : se décrire comme une chose pour ne pas avoir à répondre de ce qu'on fait. Un psychanalyste chercherait plutôt ce qui, dans l'histoire de cette personne, insiste à travers la colère. Les deux lectures ne demandent pas la même chose au sujet.\n\n## Une psychanalyse existentielle\n\nSartre ne rejette pas l'idée qu'il faille interpréter une vie. Il propose une « psychanalyse existentielle », qui cherche le *projet fondamental* d'une personne : un choix originel de soi, entièrement vécu par le sujet, et en ce sens conscient, sans être pour autant connu[^1]. Il redécrit d'ailleurs ce que Freud appelle l'inconscient comme l'association d'une absence totale de connaissance et d'une vraie compréhension de soi[^1].\n\nIl l'applique à Baudelaire, en 1947 : le libre choix qu'un homme fait de lui-même, écrit-il, s'identifie complètement à ce qu'on appelle son destin[^1].\n\n## Ce qui sépare, ce qui rapproche\n\nLa différence est nette. Chez Freud, le sujet ignore réellement ce qui le détermine, et l'analyse le lui fait découvrir. Chez Sartre, le sujet vit son choix sans le connaître ; il n'y a pas, derrière la conscience, un autre lieu qui agirait à sa place.\n\nMais les deux démarches se rejoignent sur un point. Ni l'une ni l'autre ne prend au mot ce qu'une personne dit d'elle-même. Les deux supposent qu'une vie a un sens qu'on ne voit pas d'emblée, et qu'il faut un travail pour le dégager. Elles divergent sur la question de savoir si ce sens se cache dans un inconscient ou dans une liberté qui se fuit.\n\n> **Illustration (une question clinique).** Une patiente répète qu'elle « n'a pas le choix » de rester dans un emploi qui l'épuise. Lire cela comme mauvaise foi, c'est lui rappeler sa liberté, au risque de la culpabiliser. Le lire avec Freud, c'est chercher ce que ce « pas le choix » protège. Le débat entre Sartre et la psychanalyse se rejoue, en petit, dans la manière d'écouter cette phrase.\n\n## Une critique discutée\n\nL'objection de la censure a été beaucoup commentée, et l'interprétation des exemples de Sartre elle-même fait débat : Leslie Stevenson, par exemple, juge que présenter le garçon de café comme un cas de mauvaise foi trahit les intentions de Sartre[^2]. La question de savoir si l'objection touche vraiment Freud, ou seulement une version simplifiée de sa théorie, reste ouverte.","quiz":[{"question":"Quelle objection Sartre adresse-t-il à la censure freudienne ?","choix":["Elle ne repose sur aucune observation clinique sérieuse","Pour refouler, elle doit savoir ce qu'elle refoule : on retrouve le mensonge à soi","Elle accorde trop de place à la sexualité dans la vie psychique","Elle oublie le rôle de la société dans la formation du moi"],"bonne":1,"explication":"La censure doit en savoir assez pour refouler, sans en savoir trop : le problème d'une conscience qui sait et ne sait pas revient au niveau de la censure. Sartre ne conteste pas ici la sexualité ni le rôle social."},{"question":"Qu'est-ce que la mauvaise foi pour Sartre ?","choix":["Un mensonge délibéré adressé à autrui pour en tirer profit","Un processus inconscient, au sens de Freud","Une fuite de la conscience devant sa propre liberté, qui s'appuie sur elle","Une maladie mentale qui relève de la psychiatrie"],"bonne":2,"explication":"La mauvaise foi nie la liberté tout en s'appuyant sur elle : la conscience se dérobe à elle-même. Ce n'est ni un mensonge à autrui, ni un mécanisme inconscient, ni une pathologie."},{"question":"Un collègue dit : « Je suis fonctionnaire, je ne fais qu'appliquer le règlement », pour ne pas répondre d'une décision qui lui revient. Quelle lecture sartrienne s'impose ?","choix":["Une lecture freudienne : il refoule un conflit avec son père","La mauvaise foi : il se fait chose, rôle, pour échapper à sa liberté","L'authenticité : il assume pleinement ce qu'il est","L'angoisse : il prend conscience de sa liberté"],"bonne":1,"explication":"Comme le garçon de café qui joue à n'être que garçon de café, il se réduit à une fonction pour fuir la décision. L'angoisse serait au contraire la conscience de cette liberté."},{"question":"Que cherche la « psychanalyse existentielle » de Sartre ?","choix":["Les souvenirs r // ---------- Dates locales (chaînes AAAA-MM-JJ) ----------
const pad = n => String(n).padStart(2, '0');
const jourDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ecart = (a, b) => {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5);

const decaler = (j, n) => { const [y, m, d] = j.split('-').map(Number); return jourDe(new Date(y, m - 1, d + n)); };

// ---------- Paramètres ----------
// Rotation des disciplines, jour après jour. Un croisement tous les cinq jours.
const MOTIF = {
  alterne: ['psychanalyse', 'philosophie', 'psychanalyse', 'philosophie', 'croisement'],
  philosophie: ['philosophie', 'philosophie', 'philosophie', 'philosophie', 'croisement'],
  psychanalyse: ['psychanalyse', 'psychanalyse', 'psychanalyse', 'psychanalyse', 'croisement'],
};
// Rappel espacé : après une erreur, la question revient le lendemain ; une bonne
// réponse la fait passer à la boîte suivante (7 jours, puis 30). Après la boîte 2,
// une bonne réponse la retire du rappel.
const INTERVALLES = [1, 7, 30];

// ---------- État ----------
function etatVide(auj) {
  return {
    version: 2, debut: auj, lues: {}, relues: {}, quiz: {}, notes: {}, revisions: {}, servies: [], jour: null, tour: 0,
    reglages: { rythme: 'alterne', acces: 'jour', theme: 'auto', voix: '', vitesse: 1, exclues: [] },
    reglagesLe: 0, dernierExport: null,
  };
}

const objet = v => v && typeof v === 'object' && !Array.isArray(v);

/** Complète un état lu (localStorage, import, synchronisation) et migre l'ancien format. */
function normaliser(brut, auj, fiches = []) {
  const src = objet(brut) ? brut : {};
  const e = Object.assign(etatVide(auj), src);
  e.reglages = Object.assign(etatVide(auj).reglages, objet(src.reglages) ? src.reglages : {});
  if (!Array.isArray(e.reglages.exclues)) e.reglages.exclues = [];
  for (const k of ['lues', 'relues', 'quiz', 'notes', 'revisions']) if (!objet(e[k])) e[k] = {};
  if (!Array.isArray(e.servies)) e.servies = [];
  if (!objet(e.jour) || typeof e.jour.date !== 'string') e.jour = null;
  if (!Number.isFinite(e.tour)) e.tour = 0;
  if (src.version !== 2) {
    // Version 1 : pas de file des séances servies, pas de rappel espacé.
    for (const id of Object.keys(e.lues)) if (!e.servies.includes(id)) e.servies.push(id);
    const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
    for (const [id, reps] of Object.entries(e.quiz)) {
      const f = parId[id]; if (!f || !Array.isArray(reps)) continue;
      reps.forEach((r, qi) => {
        if (r == null || !f.quiz[qi]) return;
        const cle = cleQ(id, qi);
        if (e.revisions[cle]) return;
        e.revisions[cle] = r === f.quiz[qi].bonne
          ? { boite: 1, echeance: decaler(auj, INTERVALLES[1]), ratees: 0, vue: auj }
          : { boite: 0, echeance: auj, ratees: 1, vue: auj };
      });
    }
    e.tour = Object.keys(e.lues).length;
    e.jour = null;
    e.version = 2;
  }
  return e;
}

/** Fusionne deux états (synchronisation, import) sans rien perdre. */
function fusionner(a, b, auj) {
  const r = etatVide(auj);
  r.debut = [a.debut, b.debut].filter(Boolean).sort()[0] || auj;
  r.lues = { ...(b.lues || {}) };
  for (const [id, j] of Object.entries(a.lues || {})) if (!r.lues[id] || j < r.lues[id]) r.lues[id] = j;
  r.relues = { ...(b.relues || {}) };
  for (const [id, j] of Object.entries(a.relues || {})) if (!r.relues[id] || j > r.relues[id]) r.relues[id] = j;
  r.quiz = { ...(b.quiz || {}) };
  for (const [id, rep] of Object.entries(a.quiz || {})) {
    const autre = r.quiz[id] || [];
    r.quiz[id] = (rep || []).map((v, i) => v ?? autre[i] ?? null);
    for (let i = (rep || []).length; i < autre.length; i++) r.quiz[id][i] = autre[i];
  }
  r.notes = { ...(b.notes || {}) };
  for (const [id, n] of Object.entries(a.notes || {})) if (!r.notes[id] || (n.le || 0) > (r.notes[id].le || 0)) r.notes[id] = n;
  r.revisions = { ...(b.revisions || {}) };
  for (const [c, v] of Object.entries(a.revisions || {})) if (!r.revisions[c] || (v.vue || '') >= (r.revisions[c].vue || '')) r.revisions[c] = v;
  r.servies = [...new Set([...(b.servies || []), ...(a.servies || [])])];
  const ja = a.jour, jb = b.jour;
  r.jour = ja && (!jb || ja.date >= jb.date) ? ja : (jb || null);
  r.tour = Math.max(a.tour || 0, b.tour || 0);
  r.dernierExport = [a.dernierExport, b.dernierExport].filter(Boolean).sort().pop() || null;
  const plusRecent = (a.reglagesLe || 0) >= (b.reglagesLe || 0) ? a : b;
  r.reglages = Object.assign(etatVide(auj).reglages, plusRecent.reglages || {});
  r.reglagesLe = plusRecent.reglagesLe || 0;
  return r;
}

// ---------- Sélection et ordre des séances ----------
/** Les fiches retenues par les réglages (rythme et branches). Les croisements sont de tous les rythmes. */
function selection(fiches, reglages) {
  const ex = new Set(reglages.exclues || []), r = reglages.rythme || 'alterne';
  const garde = f => r === 'alterne' || f.discipline === r || f.discipline === 'croisement';
  const s = fiches.filter(f => garde(f) && !ex.has(f.branche));
  return s.some(f => f.discipline !== 'croisement') ? s : fiches.filter(garde);
}
const parDiscipline = sel => ({
  psychanalyse: sel.filter(f => f.discipline === 'psychanalyse'),
  philosophie: sel.filter(f => f.discipline === 'philosophie'),
  croisement: sel.filter(f => f.discipline === 'croisement'),
});
const motifDe = reglages => MOTIF[reglages.rythme] || MOTIF.alterne;

/** L'ordre de lecture prévu pour une première lecture, qui sert aussi à numéroter les séances. */
function suiteOrdonnee(fiches, reglages) {
  const sel = selection(fiches, reglages), L = parDiscipline(sel), motif = motifDe(reglages);
  const pos = { psychanalyse: 0, philosophie: 0, croisement: 0 }, out = [];
  for (let i = 0; out.length < sel.length && i < sel.length * motif.length + motif.length; i++) {
    const d = motif[i % motif.length];
    if (pos[d] < L[d].length) out.push(L[d][pos[d]++]);
  }
  return out;
}

/**
 * La prochaine séance à servir : dans la discipline du tour, la première fiche non lue.
 * Une fiche servie mais pas lue revient donc à son prochain tour : aucune n'est sautée.
 * Si tout est lu, le cycle recommence par la fiche lue il y a le plus longtemps.
 */
function prochaine(fiches, etat) {
  const sel = selection(fiches, etat.reglages), L = parDiscipline(sel), motif = motifDe(etat.reglages);
  for (let k = 0; k < motif.length; k++) {
    const d = motif[(etat.tour + k) % motif.length];
    const f = L[d].find(f => !etat.lues[f.id]);
    if (f) return { id: f.id, relecture: false };
  }
  const ordre = suiteOrdonnee(fiches, etat.reglages);
  if (!ordre.length) return null;
  const rang = id => ordre.findIndex(f => f.id === id);
  const derniere = id => [etat.lues[id] || '', (etat.relues || {})[id] || ''].sort().pop();
  const plusAncienne = [...ordre].sort((a, b) => derniere(a.id).localeCompare(derniere(b.id)) || rang(a.id) - rang(b.id))[0];
  return { id: plusAncienne.id, relecture: true };
}

/**
 * La séance du jour. Une fois choisie, elle ne change plus de la journée, même si
 * les réglages changent. Renvoie { id, relecture, nouvelle } ; si nouvelle est vrai,
 * l'appelant applique servir().
 */
function seanceDuJour(fiches, etat, auj) {
  const existe = id => fiches.some(f => f.id === id);
  if (etat.jour && etat.jour.date === auj && existe(etat.jour.id)) return { ...etat.jour, nouvelle: false };
  const p = prochaine(fiches, etat);
  return p && { date: auj, ...p, nouvelle: true };
}
function servir(etat, choix) {
  etat.jour = { date: choix.date, id: choix.id, relecture: !!choix.relecture };
  etat.tour = (etat.tour || 0) + 1;
  if (!etat.servies.includes(choix.id)) etat.servies.push(choix.id);
}
/** La séance de demain, si celle d'aujourd'hui est lue. */
function seanceDeDemain(fiches, etat, auj) {
  const copie = { ...etat, lues: { ...etat.lues }, relues: { ...(etat.relues || {}) }, tour: etat.tour };
  if (etat.jour && etat.jour.date === auj) { if (copie.lues[etat.jour.id]) copie.relues[etat.jour.id] = auj; else copie.lues[etat.jour.id] = auj; }
  return prochaine(fiches, copie);
}
/** Les fiches accessibles dans la bibliothèque. */
function ouvertes(fiches, etat) {
  if (etat.reglages.acces === 'tout') return new Set(fiches.map(f => f.id));
  const ids = new Set([...etat.servies, ...Object.keys(etat.lues)]);
  if (etat.jour) ids.add(etat.jour.id);
  return ids;
}
/** Vrai si toute la sélection a été lue au moins une fois. */
function cycleAcheve(fiches, etat) {
  const sel = selection(fiches, etat.reglages);
  return sel.length > 0 && sel.every(f => etat.lues[f.id]);
}

// ---------- Rappel espacé ----------
const cleQ = (id, qi) => `${id}#${qi}`;
function enregistrerReponse(etat, id, qi, juste, auj) {
  const c = cleQ(id, qi), r = { boite: 0, ratees: 0, ...(etat.revisions[c] || {}) };
  if (juste) {
    r.boite = Math.min(r.boite + 1, INTERVALLES.length);
    r.echeance = r.boite >= INTERVALLES.length ? null : decaler(auj, INTERVALLES[r.boite]);
  } else {
    r.boite = 0; r.ratees += 1; r.echeance = decaler(auj, INTERVALLES[0]);

  r.vue = auj;
  etat.revisions[c] = r;
  return r;
}
/** Les questions à revoir aujourd'hui : d'abord les plus souvent ratées, puis les plus anciennes. */
function aRevoir(fiches, etat, auj, max = Infinity) {
  const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
  return Object.entries(etat.revisions)
    .map(([c, r]) => { const i = c.lastIndexOf('#'); return { id: c.slice(0, i), qi: Number(c.slice(i + 1)), ...r }; })
    .filter(r => r.echeance && r.echeance <= auj && parId[r.id] && parId[r.id].quiz[r.qi])
    .sort((a, b) => b.ratees - a.ratees || a.echeance.localeCompare(b.echeance) || a.id.localeCompare(b.id) || a.qi - b.qi)
    .slice(0, max);

// ---------- Texte ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enLigne = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\*(.+?)\*/g, '<em>$1</em>')
  .replace(/\[\^(\d+)\]/g, '<sup class="appel"><a href="#source-$1" aria-label="source $1">$1</a></sup>');

/** Sépare l'en-tête « **Exemple (…).** » ou « **Illustration (…).** » d'un encadré. */
function enteteIllustration(t) {
  const m = t.match(/^\*\*(?:Exemple|Illustration)\b([^*]*)\*\*\s*/);
  if (!m) return null;
  let note = m[1].trim().replace(/^[,:;]\s*/, '').replace(/\.$/, '').trim();
  if (/^\(.*\)$/.test(note)) note = note.slice(1, -1).trim();
  note = note.replace(/^une illustration\b[,;]?\s*/i, '').replace(/\.$/, '').trim();
  return { note, reste: t.slice(m[0].length) };
}

function markdown(txt) {
  return txt.split(/\n{2,}/).map(bloc => {
    if (bloc.startsWith('## ')) return `<h2>${enLigne(bloc.slice(3))}</h2>`;
    const lignes = bloc.split('\n');
    if (lignes.every(l => l.startsWith('>'))) {
      const paras = lignes.map(l => l.replace(/^> ?/, '')).join('\n').split(/\n(?=\S)/).filter(t => t.trim());
      const h = paras.length ? enteteIllustration(paras[0]) : null;
      if (h) paras[0] = h.reste;
      const tete = h ? `<p class="ill-tete"><span class="ill-label">Illustration</span>${h.note ? `<span class="ill-note">${enLigne(h.note)}</span>` : ''}</p>` : '';
      return `<aside class="exemple">${tete}${paras.filter(t => t.trim()).map(t => `<p>${enLigne(t)}</p>`).join('')}</aside>`;
    }
    if (lignes.every(l => l.startsWith('- '))) return `<ul>${lignes.map(l => `<li>${enLigne(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p>${enLigne(lignes.join(' '))}</p>`;
  }).join('');
}
/** Texte à lire à voix haute : sans balisage ni appels de note. */
const texteBrut = s => s.replace(/\[\^\d+\]/g, '').replace(/^## /gm, '').replace(/\*\*?/g, '').replace(/^- /gm, '').replace(/^> ?/gm, '');

function hache(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function melange(n, graine) {
  const ordre = [...Array(n).keys()]; let x = graine || 1;
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
  return ordre;
}
const NOMBRES = ['Aucune question', 'Une question', 'Deux questions', 'Trois questions', 'Quatre questions', 'Cinq questions', 'Six questions'];
const titreQuiz = n => NOMBRES[n] || `${n} questions`;

/** Toutes les notes, en Markdown, pour les garder hors de l'app. */
function notesEnMarkdown(fiches, etat, maintenant = new Date()) {
  const parId = Object.fromEntries(fiches.map(f => [f.id, f]));
  const notes = Object.entries(etat.notes).filter(([id, n]) => parId[id] && n && n.texte && n.texte.trim())
    .sort((a, b) => (a[1].le || 0) - (b[1].le || 0));
  const date = maintenant.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  let md = `# Après-coup — mes notes\n\nExport du ${date}. ${notes.length} note${notes.length > 1 ? 's' : ''}.\n`;
  for (const [id, n] of notes) {
    const f = parId[id];
    md += `\n## ${f.titre} — ${f.figure}\n\n*${f.reference}*`;
    if (etat.lues[id]) md += ` · séance lue le ${etat.lues[id]}`;
    md += `\n\n${n.texte.trim()}\n`;

      dessiner();
    };
    if (p) p.onclick = () => { synth.paused ? synth.resume() : synth.pause(); setTimeout(dessiner, 60); };
    if (s) s.onclick = () => { arreterVoix(); dessiner(); };
  };
  dessiner();
}

// ===== carte.js =====
// Après-coup — carte partageable 1080 × 1920, dessinée dans un canvas.
async function montrerCarte(f) {
  const calque = document.getElementById('calque');
  calque.innerHTML = `<div class="voile-carte" id="voile"><div class="panneau-carte" role="dialog" aria-label="Carte à partager"><p>Composition de la carte…</p></div></div>`;
  const fermer = () => { calque.innerHTML = ''; };
  document.getElementById('voile').onclick = e => { if (e.target.id === 'voile') fermer(); };
  try { await Promise.all(['96px Gloock', '44px Newsreader', '30px "Spline Sans Mono"'].map(p => document.fonts.load(p))); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const encre = { philosophie: '#1E5C57', psychanalyse: '#8C2F3E', croisement: '#5B3A57' }[f.discipline] || '#1B2024';
  x.fillStyle = '#ECEEE9'; x.fillRect(0, 0, W, H);
  // Deux disques en surimpression, rappel du sceau
  x.globalAlpha = .9; x.fillStyle = '#1E5C57'; x.beginPath(); x.arc(770, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'multiply'; x.fillStyle = '#8C2F3E'; x.beginPath(); x.arc(930, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  const M = 84, larg = W - 2 * M;
  const lignes = (txt, police, max) => { x.font = police; const mots = txt.split(' '), out = []; let l = ''; for (const m of mots) { const t = l ? l + ' ' + m : m; if (x.measureText(t).width > max && l) { out.push(l); l = m; } else l = t; } if (l) out.push(l); return out; };
  x.fillStyle = encre; x.font = '500 30px "Spline Sans Mono", monospace';
  x.fillText(NOM_DISC[f.discipline].toUpperCase(), M, 760);
  x.fillStyle = '#5A6468'; x.fillText(f.figure.toUpperCase(), M, 805);
  // Zone texte : de 880 jusqu'au cartouche de référence, qui monte selon sa hauteur
  x.font = '28px "Spline Sans Mono", monospace';
  const ref = lignes(f.reference, '28px "Spline Sans Mono", monospace', larg - 40);
  const hautRef = ref.length * 40 + 44, basTexte = 1680 - hautRef - 50;
  let tp = 88, ti = 42, pl, il, hauteur;
  for (;;) {
    pl = lignes(f.punch, `${tp}px Gloock, Georgia, serif`, larg);
    il = lignes(f.idee, `${ti}px Newsreader, Georgia, serif`, larg);
    hauteur = pl.length * tp * 1.08 + 110 + il.length * ti * 1.42;
    if (880 + hauteur <= basTexte || tp <= 56) break;
    tp -= 4; ti = Math.max(32, ti - 2);
  }
  let y = 880 + tp * .8;
  x.fillStyle = '#1B2024'; x.font = `${tp}px Gloock, Georgia, serif`;
  for (const l of pl) { x.fillText(l, M, y); y += tp * 1.08; }
  y += 10; x.fillStyle = encre; x.fillRect(M, y, 120, 6); y += 40 + ti;
  x.fillStyle = '#1B2024'; x.font = `${ti}px Newsreader, Georgia, serif`;
  for (const l of il) { x.fillText(l, M, y); y += ti * 1.42; }
  let yb = 1680 - hautRef + 52;
  x.fillStyle = encre; x.fillRect(M - 20, 1680 - hautRef, larg + 40, hautRef);
  x.fillStyle = '#F7F8F4'; x.font = '28px "Spline Sans Mono", monospace'; for (const l of ref) { x.fillText(l, M, yb); yb += 40; }
  x.fillStyle = '#1B2024'; x.fillRect(M, 1712, larg, 4);
  x.font = '44px Gloock, Georgia, serif'; x.fillText('Après-coup', M, 1782);
  x.font = '28px "Spline Sans Mono", monospace'; const n = 'Séance n° ' + (numeroDe(f.id) ?? ''); x.fillText(n, W - M - x.measureText(n).width, 1780);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  const panneau = calque.querySelector('.panneau-carte');
  panneau.innerHTML = `<img src="${url}" alt="Carte : ${esc(f.punch)}"><div class="rang" style="justify-content:center">
    <button class="bouton" id="enregistrer" hidden>Enregistrer l'image</button><button class="bouton secondaire" id="fermer">Fermer</button></div>
    <p id="carte-msg">Sur téléphone, un appui long sur l'image permet aussi de l'enregistrer.</p>`;
  document.getElementById('fermer').onclick = () => { URL.revokeObjectURL(url); fermer(); };
  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    const b = document.getElementById('enregistrer');
    if (dl && b) { b.hidden = false; b.onclick = async () => {
      try { await dl.save({ filename: `apres-coup-${f.id}.png`, data: blob }); document.getElementById('carte-msg').textContent = 'Image enregistrée.'; }
      catch (e) { if (e && e.code !== 'declined') document.getElementById('carte-msg').textContent = 'L\'enregistrement n\'est pas disponible ici : utilise l\'appui long sur l\'image.'; }
    }; }
  } catch (e) {}
}

// ===== app.js =====
// Après-coup — l'interface. Les fonctions de logique.js, voix.js et carte.js sont
// disponibles ici : build.js assemble les fichiers en un seul script.
// FICHES, BRANCHES, FIABILITE et VERSION sont injectés par build.js.

const PAR_ID = Object.fromEntries(FICHES.map(f => [f.id, f]));
const NOM_DISC = { philosophie: 'Philosophie', psychanalyse: 'Psychanalyse', croisement: 'Croisements' };
const ENCRE = { philosophie: 'philo', psychanalyse: 'psy', croisement: 'croise' };
const DISC_PRESENTES = Object.keys(NOM_DISC).filter(d => FICHES.some(f => f.discipline === d));
const CLE = 'apres-coup.etat.v1';
const CLE_VUE = 'apres-coup.vue.v1';
const OUVERTE_LE = Date.now();
const APERCU = !!(window.claude && window.claude.use); // version Claude (artifact)

const aujourdhui = () => jourDe(new Date());
const inkVars = d => `--ink: var(--${ENCRE[d]}); --voile: var(--${ENCRE[d]}-voile);`;
const dateLongue = j => { const [y, m, d] = j.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };
const dateHeure = ms => new Date(ms).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const pluriel = (n, mot, pl = mot + 's') => `${n} ${n > 1 ? pl : mot}`;

// ---------- État ----------
function chargerBrut() { try { const s = localStorage.getItem(CLE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
let etat = normaliser(chargerBrut(), aujourdhui(), FICHES);

let docDistant = null, minuterieSync = null, syncTexte = '';
function enregistrer() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
  if (!docDistant) return;
  clearTimeout(minuterieSync);
  minuterieSync = setTimeout(async () => {
    try { await docDistant.set(JSON.parse(JSON.stringify(etat))); syncTexte = 'Synchronisé entre tes sessions Claude.'; }
    catch (e) { syncTexte = 'Synchronisation momentanément indisponible.'; }
  }, 1200);
}
async function brancherSync() {
  try {
    if (!APERCU) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    docDistant = db.doc('data/users/' + uid + '/progression');
    const snap = await docDistant.get();
    if (snap.exists) etat = normaliser(fusionner(etat, normaliser(snap.data(), aujourdhui(), FICHES), aujourdhui()), aujourdhui(), FICHES);
    syncTexte = 'Synchronisé entre tes sessions Claude.';
    try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
    await docDistant.set(JSON.parse(JSON.stringify(etat)));
    appliquerTheme(); rendre();
  } catch (e) { docDistant = null; }
}

// Demande au navigateur de ne pas effacer les données de l'app quand l'espace manque.
let stockageProtege = null;
async function protegerStockage() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    stockageProtege = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } catch (e) {}
}

// ---------- Séances ----------
function seanceCourante() {
  const c = seanceDuJour(FICHES, etat, aujourdhui());
  if (c && c.nouvelle) { servir(etat, c); enregistrer(); }
  return c;
}
function numeroDe(id) { const i = suiteOrdonnee(FICHES, etat.reglages).findIndex(f => f.id === id); return i < 0 ? null : i + 1; }
function marquerLue(id) {
  const auj = aujourdhui();
  if (!etat.lues[id]) etat.lues[id] = auj;
  else if (etat.lues[id] !== auj) etat.relues[id] = auj;
  if (!etat.servies.includes(id)) etat.servies.push(id);
  enregistrer();
}
const lueAujourdhui = id => etat.lues[id] === aujourdhui() || etat.relues[id] === aujourdhui();

// ---------- Navigation ----------
let onglet = 'jour', lecture = null, filtre = 'tout', requete = '', confirmerRaz = false, messageDonnees = '';
try {
  const v = JSON.parse(localStorage.getItem(CLE_VUE) || 'null');
  if (v) { if (['jour', 'biblio', 'carnet', 'reglages'].includes(v.onglet)) onglet = v.onglet; if (v.lecture && PAR_ID[v.lecture]) lecture = v.lecture; }
} catch (e) {}
let derniereY = 0; try { derniereY = Number((JSON.parse(localStorage.getItem(CLE_VUE) || '{}')).y) || 0; } catch (e) {}
function sauverVue() { try { localStorage.setItem(CLE_VUE, JSON.stringify({ onglet, lecture, y: lecture ? Math.round(window.scrollY) : 0 })); } catch (e) {} }
let minuterieY = null;
window.addEventListener('scroll', () => { clearTimeout(minuterieY); minuterieY = setTimeout(sauverVue, 250); }, { passive: true });
const $vue = document.getElementById('vue');
document.getElementById('onglets').addEventListener('click', e => {
  const b = e.target.closest('[data-onglet]'); if (!b) return;
  arreterVoix(); lecture = null; onglet = b.dataset.onglet; messageDonnees = ''; rendre(); window.scrollTo(0, 0);
});
function ouvrir(id) { arreterVoix(); lecture = id; rendre(); window.scrollTo(0, 0); }

let observateurFin = null, minuterieCompte = null;
function rendre() {
  sauverVue();
  clearInterval(minuterieCompte);
  document.getElementById('date-du-jour').textContent = dateLongue(aujourdhui());
  for (const b of document.querySelectorAll('.onglet')) b.setAttribute('aria-current', b.dataset.onglet === onglet && !lecture ? 'page' : 'false');
  if (!FICHES.length) { $vue.innerHTML = '<section class="vue"><p class="vide" style="padding-top:24px">Aucune fiche : lance <code>node build.js</code>.</p></section>'; return; }
  if (lecture) return rendreLecture(PAR_ID[lecture]);
  window.onscroll = null; if (observateurFin) { observateurFin.disconnect(); observateurFin = null; }
  ({ jour: rendreJour, biblio: rendreBiblio, carnet: rendreCarnet, reglages: rendreReglages })[onglet]();
}

// ---------- Questions (séance, rappel) ----------
function marquerChoix(zone, bonne, choisi) {
  for (const b of zone.querySelectorAll('button')) {
    const i = Number(b.dataset.i); b.disabled = true;
    if (i === bonne) b.classList.add('juste'); else if (i === choisi) b.classList.add('faux'); else b.classList.add('estompe');
  }
}
function htmlRappel(r, n) {
  const f = PAR_ID[r.id], q = f.quiz[r.qi], ordre = melange(q.choix.length, hache(f.id + r.qi));
  const etiquette = r.ratees ? `ratée ${r.ratees === 1 ? 'une fois' : r.ratees + ' fois'}` : 'à consolider';
  return `<section class="rappel" style="${inkVars(f.discipline)}" data-cle="${esc(cleQ(r.id, r.qi))}">
    <span class="etiquette">${esc(f.titre)} · ${etiquette}</span>
    <h2>${esc(q.question)}</h2>
    <div class="choix">${ordre.map(i => `<button data-i="${i}">${esc(q.choix[i])}</button>`).join('')}</div>
    <p class="explication" hidden></p>
  </section>`;
}
function brancherRappels() {
  for (const zone of $vue.querySelectorAll('.rappel[data-cle]')) {
    const c = zone.dataset.cle, i = c.lastIndexOf('#'), id = c.slice(0, i), qi = Number(c.slice(i + 1));
    const q = PAR_ID[id].quiz[qi], choix = zone.querySelector('.choix');
    choix.onclick = e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      const ch = Number(b.dataset.i), juste = ch === q.bonne;
      marquerChoix(choix, q.bonne, ch);
      const r = enregistrerReponse(etat, id, qi, juste, aujourdhui()); enregistrer();
      const suite = juste ? (r.echeance ? `Elle reviendra le ${dateLongue(r.echeance)}.` : 'Elle sort du rappel.') : 'Elle reviendra demain.';
      const ex = zone.querySelector('.explication'); ex.hidden = false;
      ex.innerHTML = `<strong>${juste ? 'Retenu.' : 'Pas tout à fait.'}</strong> ${esc(q.explication)} <em>${suite}</em> <button class="bouton discret" data-ouvrir="${id}">Revoir la séance →</button>`;
      ex.querySelector('[data-ouvrir]').onclick = () => ouvrir(id);
    };
  }
}

// ---------- Aujourd'hui ----------
function rendreJour() {
  const auj = aujourdhui(), c = seanceCourante();
  if (!c) { $vue.innerHTML = '<section class="vue"><p class="vide">Aucune séance dans ta sélection : vérifie tes branches dans les réglages.</p></section>'; return; }
  const f = PAR_ID[c.id], lu = c.relecture ? lueAujourdhui(f.id) : !!etat.lues[f.id];
  const total = suiteOrdonnee(FICHES, etat.reglages).length;
  const demain = lu ? seanceDeDemain(FICHES, etat, auj) : null;
  const dus = aRevoir(FICHES, etat, auj, 3), tousDus = aRevoir(FICHES, etat, auj).length;
  const prolonger = f.liens.map(id => PAR_ID[id]).filter(l => l && !etat.lues[l.id])[0];
  const debutant = !Object.keys(etat.lues).length;
  $vue.innerHTML = `
  <section class="vue">
    ${c.relecture ? `<p class="fin-cycle" style="${inkVars(f.discipline)}">Tu as lu les ${total} séances de ta sélection. Le cycle reprend : chaque jour revient la séance lue il y a le plus longtemps. Les nouvelles fiches passeront devant dès leur parution.</p>` : ''}
    <article class="une" style="${inkVars(f.discipline)}">
      <div class="rang" style="justify-content:space-between">
        <span class="disc ${f.discipline}">${NOM_DISC[f.discipline]}</span>
        <span class="seance-num">${c.relecture ? 'Relecture' : `Séance n° ${numeroDe(f.id) ?? '—'} / ${total}`}</span>
      </div>
      <h1>${esc(f.titre)}</h1>
      <div class="figure">${esc(f.figure)}</div>
      <p class="accroche">${esc(f.accroche)}</p>

        <button class="bouton" id="lire">${lu ? 'Relire la séance' : c.relecture ? 'Relire la séance' : 'Commencer la séance'} →</button>
      </div>
      ${lu ? `<div class="verrou">
        <span class="etiquette">Séance suivante dans</span>
        <span class="compte" id="compte">--:--:--</span>
        ${demain ? `<p>Demain : <span class="disc ${PAR_ID[demain.id].discipline}">${NOM_DISC[PAR_ID[demain.id].discipline]}</span></p>` : ''}
      </div>` : ''}
    </article>
    ${dus.length ? `<div style="display:grid;gap:14px">
      <div class="section-titre"><span class="etiquette">À revoir aujourd'hui</span><span class="etiquette">${tousDus > dus.length ? `${dus.length} sur ${tousDus}` : pluriel(dus.length, 'question')}</span></div>
      ${dus.map(htmlRappel).join('')}
    </div>` : ''}
    ${prolonger ? `<div style="display:grid;gap:10px"><span class="etiquette">Pour prolonger</span>
      <button class="suggestion" data-id="${prolonger.id}" style="${inkVars(prolonger.discipline)}">
        <span class="disc ${prolonger.discipline}">${NOM_DISC[prolonger.discipline]} · ${esc(prolonger.figure)}</span>
        <span class="t">${esc(prolonger.titre)}</span>
        <span class="explication">${esc(prolonger.accroche)}</span>
      </button></div>` : ''}
    ${debutant ? `<p class="explication">Une séance par jour, en alternance entre philosophie et psychanalyse, avec un croisement des deux tous les cinq jours. Une séance non lue n'est pas perdue : elle revient à son prochain tour. Les questions ratées reviennent ici le lendemain, puis à une semaine, puis à un mois.</p>` : ''}
  </section>`;
  document.getElementById('lire').onclick = () => ouvrir(f.id);
  const sug = $vue.querySelector('.suggestion'); if (sug) sug.onclick = () => ouvrir(sug.dataset.id);
  brancherRappels();
  if (lu) {
    const maj = () => {
      const el = document.getElementById('compte'); if (!el) return clearInterval(minuterieCompte);
      const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const t = Math.max(0, Math.floor((m - n) / 1000));
      el.textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; if (t === 0) rendre();
    };
    maj(); minuterieCompte = setInterval(maj, 1000);
  }
}

// ---------- Bibliothèque ----------
function rendreBiblio() {
  const ouv = ouvertes(FICHES, etat), s = suiteOrdonnee(FICHES, etat.reglages);
  const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const q = norm(requete.trim());
  if (filtre !== 'tout' && !DISC_PRESENTES.includes(filtre)) filtre = 'tout';
  const visibles = s.filter(f => ouv.has(f.id)).filter(f => filtre === 'tout' || f.discipline === filtre)
    .filter(f => !q || norm(`${f.titre} ${f.figure} ${f.reference} ${f.texte}`).includes(q));
  const restantes = s.filter(f => !ouv.has(f.id)).length;
  const rangDans = f => filtre === 'tout' ? numeroDe(f.id) : s.filter(g => g.discipline === filtre).findIndex(g => g.id === f.id) + 1;
  $vue.innerHTML = `
  <section class="vue">
    <div class="outils">
      <div class="filtres" role="group" aria-label="Discipline">
        ${['tout', ...DISC_PRESENTES].map(d => `<button class="filtre" data-f="${d}" aria-pressed="${filtre === d}">${d === 'tout' ? 'Tout' : NOM_DISC[d]}</button>`).join('')}
      </div>
      <input class="recherche" id="recherche" type="search" placeholder="Chercher une notion, un auteur, une œuvre" value="${esc(requete)}" aria-label="Chercher">
    </div>
    <ul class="liste">${visibles.map(f => `<li><button class="item" data-id="${f.id}">
      <span class="n">${pad(rangDans(f))}</span>
      <span class="t">${esc(f.titre)}</span>
      <span class="etat ${etat.lues[f.id] ? 'lu ' + f.discipline : ''}" title="${etat.lues[f.id] ? 'Lue' : 'Non lue'}"></span>
      <span class="s">${esc(f.figure)} · ${NOM_DISC[f.discipline]}</span>
    </button></li>`).join('') || '<li><p class="vide" style="padding:16px 0">Aucune séance ne correspond.</p></li>'}</ul>
    ${restantes ? `<p class="a-venir">${pluriel(restantes, 'séance')} à paraître, une par jour. Les réglages permettent d'ouvrir tout le corpus.</p>` : ''}
  </section>`;
  $vue.querySelector('.filtres').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filtre = b.dataset.f; rendreBiblio(); } };
  $vue.querySelector('.liste').onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrir(b.dataset.id); };
  const r = document.getElementById('recherche');
  r.oninput = () => { requete = r.value; const pos = r.selectionStart; rendreBiblio(); const n = document.getElementById('recherche'); n.focus(); n.setSelectionRange(pos, pos); };
}

    <section class="bloc notes">
      <h2>Tes notes</h2>
      <textarea id="note-${f.id}" placeholder="Ce que la séance t'a fait penser, un lien avec un cas, un texte à relire…">${esc(note)}</textarea>
      <small id="note-etat">${note ? 'Enregistré.' : 'Enregistré automatiquement.'}</small>
    </section>
    ${f.liens.length ? `<section class="bloc"><h2>Résonances</h2><div class="resonances">${f.liens.map(id => {
      const l = PAR_ID[id]; if (!l) return '';
      return `<button class="resonance" data-id="${id}" style="${inkVars(l.discipline)}">
        <span class="disc ${l.discipline}">${NOM_DISC[l.discipline]}</span>
        <span class="t">${esc(l.titre)}</span>
        <span class="etiquette">${esc(l.figure)}${etat.lues[id] ? ' · lue' : ''}</span></button>`;
    }).join('')}</div></section>` : ''}
    <section class="bloc" id="sources"><h2>Sources</h2>
      ${f.fiabilite_note ? `<p class="a-propos">${enLigne(f.fiabilite_note)}</p>` : ''}
      <ol class="sources">${f.sources.map((s, i) => `<li id="source-${i + 1}">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${enLigne(s.texte)} ↗</a>` : enLigne(s.texte)}</li>`).join('')}</ol>
    </section>
    <div class="fin" id="fin">
      <span class="etiquette" id="fin-etat">${etat.lues[f.id] ? 'Séance lue le ' + dateLongue(etat.lues[f.id]) : 'Fin de la séance'}</span>
      <div class="rang">
        <button class="bouton" id="carte">Faire une carte à partager</button>
        <button class="bouton secondaire" id="retour-bas">Retour</button>
      </div>
    </div>
  </article>`;

  document.getElementById('retour').onclick = document.getElementById('retour-bas').onclick = () => { arreterVoix(); lecture = null; rendre(); window.scrollTo(0, 0); };
  document.getElementById('carte').onclick = () => montrerCarte(f);
  for (const b of $vue.querySelectorAll('.resonance[data-id]')) b.onclick = () => ouvrir(b.dataset.id);
  // Liens internes (appels de note, badge) : défilement sans changer l'adresse.
  for (const a of $vue.querySelectorAll('a[href^="#"]')) a.onclick = e => {
    const cible = document.getElementById(a.getAttribute('href').slice(1)); if (!cible) return;
    e.preventDefault(); cible.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (cible.tagName === 'LI') { cible.style.color = 'var(--encre)'; setTimeout(() => { cible.style.color = ''; }, 1600); }
  };

  // Quiz : la première réponse compte, et alimente le rappel espacé.
  for (const zone of $vue.querySelectorAll('.question')) {
    const qi = Number(zone.dataset.qi), q = f.quiz[qi], choix = zone.querySelector('.choix'), ex = zone.querySelector('.explication');
    const montrer = choisi => { marquerChoix(choix, q.bonne, choisi); ex.hidden = false; ex.innerHTML = `<strong>${choisi === q.bonne ? 'Juste.' : 'Pas tout à fait.'}</strong> ${esc(q.explication)}`; };
    if (rep[qi] != null) montrer(rep[qi]);
    choix.onclick = e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      const i = Number(b.dataset.i); montrer(i);
      const r = etat.quiz[f.id] || []; r[qi] = i; etat.quiz[f.id] = r;
      enregistrerReponse(etat, f.id, qi, i === q.bonne, aujourdhui());
      enregistrer();
    };
  }
  // Notes
  const ta = document.getElementById('note-' + f.id), ne = document.getElementById('note-etat'); let tn = null;
  ta.oninput = () => { ne.textContent = '…'; clearTimeout(tn); tn = setTimeout(() => {
    const t = ta.value.trim(); if (t) etat.notes[f.id] = { texte: ta.value, le: Date.now() }; else delete etat.notes[f.id];
    enregistrer(); ne.textContent = 'Enregistré.'; }, 600); };
  // Écoute
  brancherVoix(f);
  // Progression de lecture ; la séance est lue quand on atteint sa fin.
  const barre = document.getElementById('progression');
  const surDefil = () => { if (!barre.isConnected) return; const h = document.documentElement.scrollHeight - innerHeight; barre.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 100) + '%'; };
  window.onscroll = surDefil; surDefil();
  if (observateurFin) observateurFin.disconnect();
  observateurFin = new IntersectionObserver(es => {
    if (!es.some(e => e.isIntersecting) || lueAujourdhui(f.id)) return;
    marquerLue(f.id);
    const el = document.getElementById('fin-etat'); if (el) el.textContent = 'Séance lue le ' + dateLongue(etat.lues[f.id]);
  });
  observateurFin.observe(document.getElementById('fin'));
}

// ---------- Carnet ----------
function rendreCarnet() {
  const auj = aujourdhui(), sel = selection(FICHES, etat.reglages);
  const lues = sel.filter(f => etat.lues[f.id]).length;
  const parJour = {};
  for (const [id, j] of [...Object.entries(etat.lues), ...Object.entries(etat.relues)]) if (PAR_ID[id]) parJour[j] = PAR_ID[id].discipline;
  const lundi = decaler(auj, -((new Date().getDay() + 6) % 7) - 7);
  const cases = [...Array(14).keys()].map(i => decaler(lundi, i));
  const notes = Object.entries(etat.notes).filter(([id, v]) => PAR_ID[id] && v.texte.trim()).sort((a, b) => b[1].le - a[1].le);
  const dus = aRevoir(FICHES, etat, auj);
  const detail = DISC_PRESENTES.map(d => { const t = sel.filter(f => f.discipline === d); return t.length ? `${NOM_DISC[d]} ${t.filter(f => etat.lues[f.id]).length}/${t.length}` : ''; }).filter(Boolean).join(' · ');
  $vue.innerHTML = `
  <section class="vue">
    <div class="bilan">
      <p>${lues ? `${pluriel(lues, 'séance lue', 'séances lues')} sur ${sel.length}.` : `Aucune séance lue pour l'instant, sur ${sel.length}.`}</p>
      <span class="mineurs">${detail}</span>
    </div>
    <div style="display:grid;gap:4px">
      <div class="section-titre"><span class="etiquette">Tes notes</span>${notes.length ? `<button class="bouton discret" id="exp-notes">Exporter en Markdown</button>` : ''}</div>
      ${notes.length ? `<ul class="liste">${notes.map(([id, v]) => `<li><button class="note-item" data-id="${id}">
        <span class="t">${esc(PAR_ID[id].titre)}</span><span class="extrait">${esc(v.texte)}</span></button></li>`).join('')}</ul>`
        : '<p class="vide">Les notes que tu prends en fin de séance se retrouvent ici.</p>'}
      <span class="message" id="msg-notes"></span>
    </div>
    <div style="display:grid;gap:14px">
      <div class="section-titre"><span class="etiquette">À revoir aujourd'hui</span><span class="etiquette">${pluriel(dus.length, 'question')}</span></div>
      ${dus.length ? dus.map(htmlRappel).join('') : '<p class="vide">Rien à revoir aujourd\'hui. Une question ratée revient le lendemain, puis à une semaine, puis à un mois.</p>'}
    </div>
    <div style="display:grid;gap:10px">
      <span class="etiquette">Les deux dernières semaines</span>
      <div class="jours-sem">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(j => `<span>${j}</span>`).join('')}</div>
      <div class="releve">${cases.map(j => `<span class="${parJour[j] || ''} ${j === auj ? 'aujourdhui' : ''}" title="${dateLongue(j)}${parJour[j] ? ' · ' + NOM_DISC[parJour[j]] : ''}"></span>`).join('')}</div>
    </div>
  </section>`;
  const l = $vue.querySelector('.liste'); if (l) l.onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrir(b.dataset.id); };
  const en = document.getElementById('exp-notes'); if (en) en.onclick = () => exporterNotes(document.getElementById('msg-notes'));
  brancherRappels();
}

// ---------- Données : export, import ----------
async function telecharger(nom, texte, type) {
  const blob = new Blob([texte], { type });
  if (APERCU) {
    try { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: nom, data: blob }); return true; } } catch (e) { if (e && e.code === 'declined') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
const horodatage = () => { const d = new Date(); return `${jourDe(d)}-${pad(d.getHours())}${pad(d.getMinutes())}`; };
async function exporterNotes(msg) {
  const ok = await telecharger(`apres-coup-notes-${horodatage()}.md`, notesEnMarkdown(FICHES, etat), 'text/markdown');
  if (msg) msg.textContent = ok ? 'Notes exportées.' : '';
}
async function exporterTout() {
  const ok = await telecharger(`apres-coup-sauvegarde-${horodatage()}.json`, JSON.stringify({ app: 'apres-coup', exporte: new Date().toISOString(), etat }, null, 1), 'application/json');
  if (ok) { etat.dernierExport = new Date().toISOString(); enregistrer(); messageDonnees = 'Sauvegarde exportée.'; rendreReglages(); }
}
function importer(fichier) {
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const brut = JSON.parse(lecteur.result), recu = brut && brut.etat ? brut.etat : brut;
      if (!recu || typeof recu !== 'object' || !recu.lues) throw new Error('format');
      const avant = Object.keys(etat.lues).length, notesAvant = Object.keys(etat.notes).length;
      etat = normaliser(fusionner(etat, normaliser(recu, aujourdhui(), FICHES), aujourdhui()), aujourdhui(), FICHES);
      enregistrer(); appliquerTheme();
      messageDonnees = `Sauvegarde fusionnée : ${Object.keys(etat.lues).length - avant} séance(s) lue(s) et ${Object.keys(etat.notes).length - notesAvant} note(s) en plus.`;
    } catch (e) { messageDonnees = 'Ce fichier n\'est pas une sauvegarde d\'Après-coup.'; }
    rendreReglages();
  };
  lecteur.readAsText(fichier);
}

// ---------- Réglages ----------
function appliquerTheme() {
  const t = etat.reglages.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function rendreReglages() {
  const r = etat.reglages, voix = voixFr(), ex = new Set(r.exclues || []);
  const seg = (cle, opts) => `<div class="segments" data-cle="${cle}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(r[cle]) === String(v)}">${l}</button>`).join('')}</div>`;
  const nb = d => FICHES.filter(f => f.discipline === d).length;
  const exportTexte = etat.dernierExport ? `Dernière sauvegarde exportée le ${dateHeure(Date.parse(etat.dernierExport))}.` : 'Aucune sauvegarde exportée pour l\'instant.';
  $vue.innerHTML = `
  <section class="vue" style="gap:0">
    <div class="reglage" style="border-top:3px solid var(--encre)">
      <h2>Rythme</h2><p>Quelles séances composent ta suite. Les croisements reviennent tous les cinq jours, quel que soit le rythme.</p>
      ${seg('rythme', [['alterne', 'Les deux, en alternance'], ['philosophie', 'Philosophie seule'], ['psychanalyse', 'Psychanalyse seule']])}
    </div>
    <div class="reglage">
      <h2>Branches</h2><p>Les sujets retenus. La séance du jour ne change pas si tu modifies ce choix en cours de journée.</p>
      ${Object.keys(BRANCHES).filter(d => DISC_PRESENTES.includes(d)).map(d => `<span class="etiquette" style="margin-top:8px">${NOM_DISC[d]}</span>
        <div class="cases">${BRANCHES[d].map(([c, l]) => { const n = FICHES.filter(f => f.branche === c).length;
          return `<label class="case ${n ? '' : 'vide'}"><input type="checkbox" data-b="${c}" ${!ex.has(c) && n ? 'checked' : ''} ${n ? '' : 'disabled'}><span>${esc(l)}</span><span class="nb">${n || 'à venir'}</span></label>`; }).join('')}</div>`).join('')}
      <span class="message" id="msg-branches"></span>
    </div>
    <div class="reglage">
      <h2>Accès</h2><p>Une séance par jour, comme un rendez-vous ; ou tout le corpus ouvert pour réviser.</p>
      ${seg('acces', [['jour', 'Une séance par jour'], ['tout', 'Tout le corpus']])}
    </div>
    <div class="reglage">
      <h2>Lecture à voix haute</h2>
      ${voix.length ? `<p>Voix proposées par ton appareil.</p>
        <select class="champ" id="voix" aria-label="Voix">${voix.map(v => `<option value="${esc(v.name)}" ${v.name === r.voix ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : '<p>Aucune voix française détectée sur cet appareil pour l\'instant.</p>'}
      ${seg('vitesse', [['0.9', 'Posée'], ['1', 'Normale'], ['1.15', 'Vive']])}
    </div>
    <div class="reglage">
      <h2>Apparence</h2>
      ${seg('theme', [['auto', 'Comme l\'appareil'], ['light', 'Clair'], ['dark', 'Sombre']])}
    </div>
    <div class="reglage">
      <h2>Tes données</h2>
      ${APERCU ? `<p class="avertissement">Ceci est l'aperçu dans Claude. Ta progression de référence est celle de l'app installée sur ton téléphone ; les deux ne se synchronisent pas. Pour passer de l'une à l'autre, exporte une sauvegarde ici et importe-la là-bas.</p>` : ''}
      <p>Tes séances, réponses et notes ne sont enregistrées que sur cet appareil. Exporte une sauvegarde de temps en temps : elle se réimporte ici ou sur un autre téléphone, et se fusionne avec ce qui s'y trouve.</p>
      <div class="boutons">
        <button class="bouton secondaire" id="exp-tout">Exporter une sauvegarde</button>
        <button class="bouton secondaire" id="imp-tout">Importer une sauvegarde</button>
        <button class="bouton secondaire" id="exp-notes2">Exporter mes notes</button>
        <input type="file" id="fichier" accept="application/json,.json" hidden>
      </div>
      <span class="message">${esc(messageDonnees || exportTexte)}</span>
      ${!APERCU && stockageProtege !== null ? `<span class="message">${stockageProtege ? 'Stockage protégé : le navigateur ne l\'effacera pas pour faire de la place.' : 'Stockage non protégé : le navigateur peut l\'effacer s\'il manque de place. Exporte une sauvegarde.'}</span>` : ''}
      ${APERCU && syncTexte ? `<span class="message">${esc(syncTexte)}</span>` : ''}
    </div>
    <div class="reglage">
      <h2>Contenu</h2>
      <p>${pluriel(FICHES.length, 'séance')} : ${DISC_PRESENTES.map(d => `${nb(d)} ${d === 'croisement' ? (nb(d) > 1 ? 'croisements' : 'croisement') : 'en ' + NOM_DISC[d].toLowerCase()}`).join(', ')}.</p>
      <p>Version du contenu publiée le ${VERSION.date ? dateHeure(VERSION.date) : 'date inconnue'}.</p>
      <p>Page ouverte le ${new Date(OUVERTE_LE).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' })}.</p>
    </div>
    <div class="reglage">
      <h2>Progression</h2>
      <p>Commencée le ${dateLongue(etat.debut)}.</p>
      <div class="confirmation">${confirmerRaz
        ? `<span>Effacer séances lues, réponses, révisions et notes ?</span><button class="bouton" id="raz-oui">Tout effacer</button><button class="bouton discret" id="raz-non">Annuler</button>`
        : `<button class="bouton secondaire" id="raz">Repartir de zéro</button>`}</div>
    </div>
  </section>`;
  for (const cb of $vue.querySelectorAll('[data-b]')) cb.onchange = () => {
    const ex2 = new Set(r.exclues || []);
    cb.checked ? ex2.delete(cb.dataset.b) : ex2.add(cb.dataset.b);
    if (FICHES.every(f => ex2.has(f.branche))) { cb.checked = true; document.getElementById('msg-branches').textContent = 'Garde au moins une branche.'; return; }
    r.exclues = [...ex2]; etat.reglagesLe = Date.now(); enregistrer();
    document.getElementById('msg-branches').textContent = `${pluriel(selection(FICHES, r).length, 'séance')} dans ta sélection.`;
  };
  for (const g of $vue.querySelectorAll('.segments')) g.onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const cle = g.dataset.cle; r[cle] = cle === 'vitesse' ? Number(b.dataset.v) : b.dataset.v;
    etat.reglagesLe = Date.now(); enregistrer(); appliquerTheme(); rendreReglages();
  };
  const v = document.getElementById('voix'); if (v) v.onchange = () => { r.voix = v.value; etat.reglagesLe = Date.now(); enregistrer(); };
  document.getElementById('exp-tout').onclick = exporterTout;
  document.getElementById('exp-notes2').onclick = () => exporterNotes(null).then(() => { messageDonnees = 'Notes exportées.'; rendreReglages(); });
  const fichier = document.getElementById('fichier');
  document.getElementById('imp-tout').onclick = () => fichier.click();
  fichier.onchange = () => { if (fichier.files[0]) importer(fichier.files[0]); };
  const raz = document.getElementById('raz'); if (raz) raz.onclick = () => { confirmerRaz = true; rendreReglages(); };
  const non = document.getElementById('raz-non'); if (non) non.onclick = () => { confirmerRaz = false; rendreReglages(); };
  const oui = document.getElementById('raz-oui'); if (oui) oui.onclick = () => {
    const reg = etat.reglages; etat = etatVide(aujourdhui()); etat.reglages = reg; etat.reglagesLe = Date.now(); confirmerRaz = false; enregistrer(); rendreReglages();
  };
}

// ---------- Démarrage ----------
appliquerTheme();
enregistrer();
rendre();
if (lecture && derniereY) setTimeout(() => window.scrollTo(0, derniereY), 60);
if (synth) try { synth.onvoiceschanged = () => { if (onglet === 'reglages' && !lecture) rendreReglages(); }; } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !lecture) rendre(); });
protegerStockage().then(() => { if (onglet === 'reglages' && !lecture) rendreReglages(); });
brancherSync();

</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
