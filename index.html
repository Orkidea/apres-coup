</head><body><title>Après-coup</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Mise en page : une colonne de lecture (68ch max), barre d'onglets fixe en bas,
   la fiche s'ouvre dans la même colonne. Deux encres : philosophie (sarcelle),
   psychanalyse (sang-de-bœuf), sur un papier gris-vert froid. */
:root {
  --papier: #ECEEE9;
  --feuille: #F7F8F4;
  --encre: #1B2024;
  --gris: #5A6468;
  --filet: #CBD1CA;
  --philo: #1E5C57;
  --psy: #8C2F3E;
  --philo-voile: rgba(30, 92, 87, .10);
  --psy-voile: rgba(140, 47, 62, .10);
  --juste: #2D7A4C;
  --faux: #B3261E;
  --ombre: rgba(27, 32, 36, .08);
  --f-titre: "Gloock", "Bodoni 72", "Didot", Georgia, serif;
  --f-texte: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-repere: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-0: .78rem; --t-1: .9rem; --t-2: 1.05rem; --t-3: 1.2rem; --t-4: 1.55rem; --t-5: 2.2rem; --t-6: 3.1rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #121618; --feuille: #1A1F22; --encre: #E3E6E0; --gris: #9AA4A7; --filet: #2E363A;
    --philo: #6CC2B8; --psy: #E58A97; --philo-voile: rgba(108, 194, 184, .12); --psy-voile: rgba(229, 138, 151, .12);
    --juste: #6FCF97; --faux: #F28B82; --ombre: rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #121618; --feuille: #1A1F22; --encre: #E3E6E0; --gris: #9AA4A7; --filet: #2E363A;
  --philo: #6CC2B8; --psy: #E58A97; --philo-voile: rgba(108, 194, 184, .12); --psy-voile: rgba(229, 138, 151, .12);
  --juste: #6FCF97; --faux: #F28B82; --ombre: rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--papier); }
body {
  color: var(--encre); font-family: var(--f-texte); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papier); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 3px; border-radius: 2px; }
a { color: inherit; }

.coquille {
  max-width: 44rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}

/* En-tête */
.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.marque { display: flex; align-items: center; gap: 10px; font-family: var(--f-titre); font-size: var(--t-3); letter-spacing: .01em; }
.sceau { position: relative; width: 26px; height: 18px; flex: none; }
.sceau i { position: absolute; top: 0; width: 18px; height: 18px; border-radius: 50%; mix-blend-mode: multiply; }
.sceau i:first-child { left: 0; background: var(--philo); }
.sceau i:last-child { right: 0; background: var(--psy); opacity: .92; }
:root[data-theme="dark"] .sceau i { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sceau i { mix-blend-mode: screen; } }
.date-du-jour { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); text-transform: uppercase; letter-spacing: .08em; }

/* Étiquettes */
.etiquette { font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; color: var(--gris); }
.disc { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; }
.disc::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.disc.philosophie { color: var(--philo); }
.disc.psychanalyse { color: var(--psy); }

/* Vue Aujourd'hui */
.vue { display: grid; gap: 28px; padding-top: 8px; }
.seance-num { font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .09em; text-transform: uppercase; color: var(--gris); font-variant-numeric: tabular-nums; }
.une { display: grid; gap: 14px; padding-block: 22px 26px; border-top: 3px solid var(--encre); border-bottom: 1px solid var(--filet); }
.une h1 { font-family: var(--f-titre); font-weight: 400; font-size: clamp(2.3rem, 9vw, var(--t-6)); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.une .figure { font-style: italic; color: var(--gris); font-size: var(--t-2); }
.une .accroche { font-size: var(--t-3); line-height: 1.45; margin: 4px 0 0; max-width: 34em; }
.rang { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bouton {
  display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 3px;
  background: var(--encre); color: var(--papier); padding: 13px 20px;
  font-family: var(--f-repere); font-size: var(--t-1); letter-spacing: .04em;
}
.bouton.secondaire { background: transparent; color: var(--encre); box-shadow: inset 0 0 0 1.5px var(--encre); }
.bouton.discret { background: transparent; color: var(--gris); padding-inline: 4px; }
.bouton:disabled { opacity: .45; cursor: default; }

.verrou { display: grid; gap: 6px; padding: 18px 0 0; }
.compte { font-family: var(--f-titre); font-size: var(--t-5); font-variant-numeric: tabular-nums; line-height: 1; }
.verrou p { margin: 0; color: var(--gris); }

.rappel { background: var(--feuille); border-radius: 4px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 1px 0 var(--filet); }
.rappel h2 { margin: 0; font-weight: 500; font-size: var(--t-3); line-height: 1.35; }

/* Bibliothèque */
.outils { display: grid; gap: 12px; }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre { border: 1.5px solid var(--filet); background: transparent; border-radius: 99px; padding: 6px 14px; font-family: var(--f-repere); font-size: var(--t-0); letter-spacing: .06em; text-transform: uppercase; }
.filtre[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: var(--papier); }
.recherche { width: 100%; border: 0; border-bottom: 1.5px solid var(--filet); background: transparent; padding: 10px 2px; font-size: var(--t-2); }
.recherche:focus { outline: none; border-bottom-color: var(--encre); }
.liste { list-style: none; margin: 0; padding: 0; }
.liste li + li { border-top: 1px solid var(--filet); }
.item { width: 100%; text-align: left; background: none; border: 0; padding: 16px 0; display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 4px 14px; align-items: baseline; }
.item .n { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); font-variant-numeric: tabular-nums; grid-row: span 2; }
.item .t { font-family: var(--f-titre); font-size: var(--t-3); line-height: 1.15; min-width: 0; }
.item .s { grid-column: 2; color: var(--gris); font-size: var(--t-1); font-style: italic; min-width: 0; }
.item .etat { grid-row: 1 / span 2; grid-column: 3; align-self: center; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--filet); }
.item .etat.lu.philosophie { background: var(--philo); box-shadow: none; }
.item .etat.lu.psychanalyse { background: var(--psy); box-shadow: none; }
.item:disabled { cursor: default; }
.item:disabled .t { color: var(--gris); }
.a-venir { color: var(--gris); font-size: var(--t-1); padding-top: 6px; }

/* Lecture */
.barre-lecture {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--papier);
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding-block: 12px 10px;
  border-bottom: 1px solid var(--filet);
}
.barre-lecture .retour { border: 0; background: none; padding: 6px 8px 6px 0; font-family: var(--f-repere); font-size: var(--t-1); }
.barre-lecture .titre-court { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-titre); font-size: var(--t-2); }
.progression { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--encre); transition: width .1s linear; }
.fiche { display: grid; gap: 22px; padding-top: 26px; }
.fiche header { display: grid; gap: 12px; }
.fiche h1 { font-family: var(--f-titre); font-weight: 400; font-size: clamp(2.2rem, 8.5vw, var(--t-6)); line-height: 1.03; margin: 0; text-wrap: balance; }
.ref { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .02em; line-height: 1.6; }
.lead { font-size: var(--t-3); font-style: italic; line-height: 1.45; margin: 0; }
.citation { margin: 0; padding: 18px 0 18px 20px; border-left: 3px solid var(--ink, var(--encre)); background: var(--voile, transparent); }
.citation blockquote { margin: 0; font-size: var(--t-4); line-height: 1.3; font-family: var(--f-texte); font-weight: 500; text-wrap: pretty; }
.citation blockquote::before { content: "« "; } .citation blockquote::after { content: " »"; }
.citation figcaption { margin-top: 10px; font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); }
.repere { margin: 0; padding: 16px 18px; border: 1.5px solid var(--ink, var(--encre)); border-radius: 3px; display: grid; gap: 8px; }
.repere p { margin: 0; font-size: var(--t-1); line-height: 1.55; }
.corps { font-size: 1.15rem; line-height: 1.68; max-width: 36em; }
.corps p { margin: 0 0 1em; hyphens: auto; }
.corps h2 { font-family: var(--f-repere); font-weight: 500; font-size: var(--t-0); letter-spacing: .1em; text-transform: uppercase; margin: 2em 0 .9em; color: var(--ink, var(--encre)); display: flex; align-items: center; gap: 10px; }
.corps h2::after { content: ""; flex: 1; height: 1px; background: var(--filet); }
.corps ul { margin: 0 0 1em; padding-left: 1.1em; }
.corps li { margin-bottom: .5em; }
.ecoute { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ecoute .bouton { padding: 9px 14px; font-size: var(--t-0); }

.bloc { display: grid; gap: 14px; padding-top: 22px; border-top: 1px solid var(--filet); }
.bloc > h2 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: var(--t-4); }
.question { display: grid; gap: 10px; padding-bottom: 14px; }
.question p.q { margin: 0; font-weight: 500; font-size: var(--t-2); line-height: 1.4; }
.choix { display: grid; gap: 8px; }
.choix button { text-align: left; background: var(--feuille); border: 1.5px solid transparent; border-radius: 3px; padding: 11px 14px; line-height: 1.4; font-size: var(--t-1); }
.choix button:hover:not(:disabled) { border-color: var(--filet); }
.choix button:disabled { cursor: default; }
.choix button.juste { border-color: var(--juste); color: var(--juste); font-weight: 500; }
.choix button.faux { border-color: var(--faux); color: var(--faux); }
.choix button.barre { text-decoration: line-through; opacity: .55; }
.explication { margin: 0; font-size: var(--t-1); line-height: 1.55; color: var(--gris); }
.explication strong { color: var(--encre); font-weight: 600; }
.notes textarea { width: 100%; min-height: 7.5rem; resize: vertical; border: 1.5px solid var(--filet); border-radius: 3px; background: var(--feuille); padding: 12px 14px; font-size: var(--t-2); line-height: 1.5; }
.notes textarea:focus { outline: none; border-color: var(--encre); }
.notes small { color: var(--gris); font-family: var(--f-repere); font-size: var(--t-0); }
.resonances { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.resonance { text-align: left; background: none; border: 1.5px solid var(--filet); border-radius: 3px; padding: 14px; display: grid; gap: 6px; }
.resonance .t { font-family: var(--f-titre); font-size: var(--t-3); line-height: 1.15; }
.resonance:disabled { cursor: default; opacity: .6; }
.sources { margin: 0; padding-left: 1.1em; font-size: var(--t-1); color: var(--gris); line-height: 1.55; }
.sources li { margin-bottom: .35em; }
.fin { display: grid; gap: 12px; justify-items: start; padding-block: 26px 10px; border-top: 3px solid var(--encre); }

/* Carnet */
.serie { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: end; padding-block: 18px 22px; border-top: 3px solid var(--encre); border-bottom: 1px solid var(--filet); }
.serie .grand { font-family: var(--f-titre); font-size: 5.2rem; line-height: .85; font-variant-numeric: tabular-nums; grid-row: span 2; }
.serie .mineurs { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .06em; text-transform: uppercase; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.releve { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 22rem; }
.releve span { aspect-ratio: 1; max-width: 100%; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--filet); }
.releve span.philosophie { background: var(--philo); box-shadow: none; }
.releve span.psychanalyse { background: var(--psy); box-shadow: none; }
.releve span.aujourdhui { box-shadow: inset 0 0 0 2px var(--encre); }
.jours-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 22rem; font-family: var(--f-repere); font-size: .68rem; color: var(--gris); text-align: center; }
.repartition { display: grid; gap: 12px; }
.ligne-rep { display: grid; grid-template-columns: 8.5rem 1fr 2rem; gap: 12px; align-items: center; font-size: var(--t-1); }
.ligne-rep .piste { height: 8px; background: var(--feuille); border-radius: 99px; overflow: hidden; }
.ligne-rep .piste i { display: block; height: 100%; border-radius: 99px; }
.ligne-rep b { font-family: var(--f-repere); font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; }
.note-item { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; gap: 4px; }
.note-item .t { font-family: var(--f-titre); font-size: var(--t-3); }
.note-item .extrait { color: var(--gris); font-size: var(--t-1); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Réglages */
.reglage { display: grid; gap: 10px; padding-block: 18px; border-top: 1px solid var(--filet); }
.reglage h2 { margin: 0; font-size: var(--t-2); font-weight: 600; }
.reglage p { margin: 0; color: var(--gris); font-size: var(--t-1); }
.segments { display: flex; flex-wrap: wrap; gap: 8px; }
.segments button { border: 1.5px solid var(--filet); background: transparent; border-radius: 3px; padding: 9px 14px; font-size: var(--t-1); }
.segments button[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: var(--papier); }
select.champ { border: 1.5px solid var(--filet); background: var(--feuille); border-radius: 3px; padding: 9px 12px; max-width: 100%; }
.sync { font-family: var(--f-repere); font-size: var(--t-0); color: var(--gris); letter-spacing: .04em; }
.confirmation { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Onglets */
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--papier);
  border-top: 2px solid var(--encre);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.onglets nav { max-width: 44rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.onglet { border: 0; background: none; padding: 12px 2px 14px; display: grid; justify-items: center; gap: 6px; font-family: var(--f-repere); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--gris); }
.onglet i { width: 7px; height: 7px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.onglet[aria-current="page"] { color: var(--encre); font-weight: 500; }
.onglet[aria-current="page"] i { background: var(--encre); box-shadow: none; }

/* Carte partageable */
.voile-carte { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 14, .72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panneau-carte { background: var(--papier); border-radius: 6px; padding: 16px; display: grid; gap: 12px; justify-items: center; max-height: 100%; overflow: auto; width: min(26rem, 100%); }
.panneau-carte img { width: 100%; max-width: 100%; height: auto; max-height: 62vh; object-fit: contain; border-radius: 3px; box-shadow: 0 8px 30px var(--ombre); }
.panneau-carte p { margin: 0; color: var(--gris); font-size: var(--t-1); text-align: center; }

.vide { color: var(--gris); font-style: italic; margin: 0; }
@media (max-width: 420px) { .ligne-rep { grid-template-columns: 6.8rem 1fr 1.6rem; } .item { grid-template-columns: 2.6rem 1fr auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
const FICHES = [{"id":"freud-moi-pas-maitre","discipline":"psychanalyse","titre":"Les trois blessures narcissiques","figure":"Sigmund Freud","reference":"Une difficulté de la psychanalyse (1917) ; Leçons d'introduction à la psychanalyse, 18e leçon (1917)","accroche":"Copernic, Darwin, Freud. La liste a l'air d'un coup d'orgueil. Freud y décrit plutôt pourquoi on ne veut pas entendre la psychanalyse.","punch":"Après Copernic et Darwin, la troisième vexation : le moi n'est pas maître chez lui.","idee":"L'humanité a subi trois humiliations : la Terre n'est pas au centre de l'univers, l'homme n'est pas séparé de l'animal, et le moi n'est pas maître dans sa propre maison. La résistance à la psychanalyse est d'abord une résistance narcissique.","citation":"Le moi n'est pas maître dans sa propre maison.","citation_source":"Freud, Une difficulté de la psychanalyse (1917) — traduit de l'allemand","liens":["descartes-malin-genie","ricoeur-soupcon","schopenhauer-pendule"],"texte":"En 1917, une revue hongroise demande à Freud un texte de présentation. Il choisit un angle inattendu : non pas exposer la psychanalyse, mais expliquer pourquoi elle rencontre tant de résistance. La difficulté, dit-il, n'est pas intellectuelle. Elle est *affective*.\n\n## Le narcissisme de l'humanité\n\nFreud part de sa théorie du narcissisme (1914) : le moi est investi de libido, il s'aime. Ce narcissisme vaut aussi, toutes proportions gardées, pour l'humanité dans son ensemble. Elle a de bonnes raisons de se croire au centre, et la science lui a infligé trois blessures.\n\n**La blessure cosmologique.** Avec Copernic, la Terre cesse d'être le centre immobile de l'univers. Elle devient une petite planète parmi d'autres.\n\n**La blessure biologique.** Avec Darwin, l'homme cesse d'être une créature à part, séparée du règne animal par une âme. Il descend d'espèces animales et garde en lui des traces de cette parenté.\n\n**La blessure psychologique.** C'est celle que porte la psychanalyse : le moi n'est pas maître dans sa propre maison.\n\n## Ce que dit la troisième blessure\n\nFreud détaille. Le moi se croit informé de tout ce qui se passe dans le psychisme, et se croit en mesure de le diriger. Les névroses montrent le contraire. Des pensées surgissent sans qu'on sache d'où elles viennent ; des impulsions agissent qu'on ne reconnaît pas comme siennes. Le moi se comporte comme un monarque absolu qui se contenterait des informations de ses hauts fonctionnaires sans jamais descendre jusqu'au peuple.\n\nDeux thèses sont en jeu. La vie pulsionnelle de la sexualité ne peut être entièrement domptée. Et les processus psychiques sont en eux-mêmes inconscients : ils ne deviennent accessibles au moi que par une perception incomplète et peu fiable.\n\n## Une résistance qui n'est pas un argument\n\nD'où la portée du texte. Si la psychanalyse est rejetée, ce n'est pas seulement parce qu'elle serait mal fondée. C'est parce qu'elle touche à quelque chose que nous tenons à préserver : l'idée que nous savons ce que nous pensons et voulons ce que nous faisons.\n\nFreud n'est pas dupe de la grandeur de sa comparaison, et il le dit : des philosophes l'ont précédé, au premier rang Schopenhauer. Mais ce que la psychanalyse apporte, c'est la démonstration clinique, au cas par cas.\n\n## La blessure comme méthode\n\nOn peut lire la liste autrement que comme une revendication. Elle décrit ce que l'analyse demande au patient lui-même : renoncer, sur un point précis de son histoire, à la souveraineté du moi. Ce que chacun éprouve en cure à petite échelle, Freud l'a projeté sur l'histoire des idées.","quiz":[{"question":"Quelles sont, dans l'ordre, les trois blessures narcissiques selon Freud ?","choix":["Biologique, cosmologique, sociologique","Cosmologique (Copernic), biologique (Darwin), psychologique (la psychanalyse)","Théologique, politique, psychologique","Cosmologique (Galilée), biologique (Pasteur), psychologique (Charcot)"],"bonne":1,"explication":"Copernic décentre la Terre, Darwin réinscrit l'homme dans le règne animal, la psychanalyse montre que le moi n'est pas maître chez lui. Freud ne parle ni de blessure sociologique, ni théologique ou politique, et c'est Copernic et Darwin qu'il nomme."},{"question":"Quelles thèses fondent la blessure psychologique ?","choix":["Le moi est entièrement déterminé par l'hérédité, si bien qu'aucune cure ne peut le modifier","La vie pulsionnelle reste indomptable et les processus psychiques sont en eux-mêmes inconscients","La conscience n'existe pas : ce n'est qu'une illusion produite par le langage ordinaire","Le cerveau fonctionne comme une machine dont les rouages sont purement physiologiques"],"bonne":1,"explication":"Freud avance deux thèses : l'indomptabilité de la vie pulsionnelle et le caractère inconscient des processus psychiques, que le moi ne perçoit que partiellement. Il ne nie pas la conscience et ne réduit pas le psychisme à l'hérédité ou à une machine."},{"question":"Pourquoi, selon Freud, la psychanalyse suscite-t-elle tant de résistance ?","choix":["Parce que ses arguments scientifiques sont trop faibles","Parce qu'elle est trop coûteuse pour les patients","Parce qu'elle contredit la religion catholique","Parce qu'elle blesse le narcissisme : la résistance est d'abord affective"],"bonne":3,"explication":"La difficulté n'est pas intellectuelle mais affective : elle touche à l'idée que nous nous faisons de notre souveraineté. Freud ne concède pas la faiblesse de ses arguments et n'invoque ici ni le coût ni la religion."}],"sources":["Sigmund Freud, « Une difficulté de la psychanalyse » (1917), dans *L'Inquiétante Étrangeté et autres essais*, Gallimard, coll. « Folio Essais ».","Sigmund Freud, *Introduction à la psychanalyse*, 18e leçon."]},{"id":"descartes-malin-genie","discipline":"philosophie","titre":"Le malin génie","figure":"René Descartes","reference":"Méditations métaphysiques, I et II (1641)","accroche":"Descartes imagine un être tout-puissant occupé à le tromper sur tout. Il en sort la seule certitude qu'aucune tromperie ne peut atteindre.","punch":"Qu'il me trompe tant qu'il voudra : pour être trompé, il faut être.","idee":"Pour fonder la science, Descartes pousse le doute jusqu'à l'hyperbole : un malin génie me trompe peut-être en tout, même en mathématiques. Mais ce doute bute sur une limite : celui qui doute, pense, et celui qui pense, existe.","citation":"Je suis, j'existe : cela est certain.","citation_source":"Descartes, Méditations métaphysiques, II (1641), trad. du duc de Luynes (1647)","liens":["lacan-stade-du-miroir","freud-moi-pas-maitre","husserl-epoche"],"texte":"Descartes ne doute pas par tempérament sceptique. Il doute par méthode : il veut savoir si quelque chose résiste. Une fois dans sa vie, écrit-il au début de la *Première Méditation*, il faut défaire toutes ses opinions pour reconstruire à partir des fondements.\n\n## Trois paliers de doute\n\nIl ne passe pas les opinions en revue une à une — ce serait infini. Il s'attaque aux principes sur lesquels elles reposent.\n\n**Les sens.** Ils me trompent parfois sur ce qui est petit ou éloigné. Il est prudent de ne pas se fier entièrement à qui nous a trompés une fois.\n\n**Le rêve.** Mais que je sois assis près du feu, en robe de chambre ? Je me souviens d'avoir rêvé exactement cela. Il n'y a pas d'indice certain qui distingue la veille du sommeil. Restent toutefois les éléments simples — l'étendue, le nombre — et les vérités mathématiques : endormi ou éveillé, deux et trois font cinq.\n\n**Le Dieu trompeur, puis le malin génie.** Et si celui qui m'a fait voulait que je me trompe chaque fois que j'additionne ? Pour tenir ce doute dans la durée, contre la pente de l'habitude, Descartes forge une fiction : un génie « non moins rusé et trompeur que puissant » qui emploierait toute son industrie à le tromper.\n\n## Le point fixe\n\nLa *Seconde Méditation* s'ouvre sur un homme qui a perdu pied, comme tombé dans une eau profonde. Il cherche, à la manière d'Archimède, un seul point fixe.\n\nLe voici : s'il y a un trompeur qui me trompe, alors *je suis*, puisqu'il me trompe. Qu'il me trompe autant qu'il voudra, il ne fera jamais que je ne sois rien tant que je penserai être quelque chose. La proposition « je suis, j'existe » est nécessairement vraie chaque fois que je la prononce ou la conçois.\n\nNotez la temporalité : la certitude ne vaut que dans l'acte. *Combien de temps ?* demande Descartes. Autant de temps que je pense.\n\n## Ce que je suis\n\nReste à savoir *ce* que je suis. Pas un corps — je peux en douter. Une chose qui pense : qui doute, conçoit, affirme, nie, veut, ne veut pas, imagine et sent. Le sujet moderne naît là, défini par la transparence de sa pensée à elle-même.\n\nC'est précisément ce point que les « maîtres du soupçon » viendront ébranler. Le doute cartésien porte sur les choses ; il ne porte pas sur la conscience elle-même. Que la pensée puisse être opaque à celui qui pense, que le « je » soit une construction plutôt qu'un point fixe, voilà l'hypothèse que Descartes n'envisage pas — et qui deviendra l'objet d'un autre genre de méditation.","quiz":[{"question":"Pourquoi Descartes introduit-il la fiction du malin génie ?","choix":["Parce qu'il croit réellement à l'existence d'un démon trompeur","Pour démontrer que Dieu n'existe pas","Pour maintenir un doute radical contre la pente de ses anciennes habitudes","Pour prouver que les sens sont toujours trompeurs"],"bonne":2,"explication":"Le malin génie est un artifice méthodique : il sert à tenir le doute dans la durée, l'habitude ramenant sans cesse aux anciennes opinions. Descartes n'y croit pas, il démontrera au contraire l'existence d'un Dieu vérace dans la Troisième Méditation, et l'argument des sens avait déjà été traité avant."},{"question":"Qu'est-ce que l'argument du rêve laisse encore debout ?","choix":["La certitude d'être assis près du feu, en robe de chambre, ce soir-là","Les vérités mathématiques et les natures simples comme l'étendue et le nombre","La fiabilité de la perception des objets proches et bien éclairés","L'existence du corps propre, avec ses mains et sa tête"],"bonne":1,"explication":"Endormi ou éveillé, deux et trois font cinq : le rêve n'atteint pas les éléments les plus simples. C'est le Dieu trompeur puis le malin génie qui viendront les ébranler. La scène du feu, les objets proches et le corps tombent, eux, sous le doute du rêve."},{"question":"À quelle condition la certitude « je suis, j'existe » vaut-elle ?","choix":["Pour toujours, une fois qu'elle a été démontrée une seule fois","À condition qu'un Dieu vérace en garantisse la vérité","À condition d'avoir un corps qui perçoit le monde extérieur","Chaque fois que je la prononce ou la conçois, tant que je pense"],"bonne":3,"explication":"La certitude est liée à l'acte de penser : « autant de temps que je pense ». La garantie divine intervient plus tard pour les vérités qu'on ne considère plus actuellement, et le corps a justement été mis en doute."}],"sources":["René Descartes, *Méditations métaphysiques*, GF-Flammarion (texte latin et traduction du duc de Luynes).","René Descartes, *Discours de la méthode*, IVe partie (1637) : la première formulation du « je pense, donc je suis »."]},{"id":"freud-reve","discipline":"psychanalyse","titre":"Le travail du rêve","figure":"Sigmund Freud","reference":"L'Interprétation du rêve, chap. VI et VII (1900)","accroche":"Le rêve n'est pas absurde, il est déformé. Freud décrit la machinerie qui transforme un désir en images — et donne du même coup une grammaire de l'inconscient.","punch":"Le rêve ne dit pas autre chose. Il dit la même chose, autrement.","idee":"Le rêve est l'accomplissement déguisé d'un désir refoulé. Entre les pensées latentes et le contenu manifeste, un travail opère : condensation, déplacement, figuration, élaboration secondaire. Interpréter, c'est défaire ce travail, association par association.","citation":"L'interprétation du rêve est la voie royale qui mène à la connaissance de l'inconscient.","citation_source":"Freud, L'Interprétation du rêve, chap. VII (phrase ajoutée en 1909) — traduit de l'allemand","liens":["nietzsche-perspectivisme","lacan-desir-de-l-autre","bion-reverie"],"texte":"La *Traumdeutung* paraît en novembre 1899 avec la date de 1900 : Freud voulait qu'elle ouvre le siècle. Il la considérera toujours comme son livre le plus important. Sa thèse tient en une phrase : le rêve est l'accomplissement (déguisé) d'un désir (refoulé).\n\n## Deux contenus\n\nFreud distingue le *contenu manifeste* du rêve — ce dont le rêveur se souvient au réveil, souvent incohérent — et les *pensées latentes*, qui sont, elles, parfaitement cohérentes. Le rêve n'est pas un produit du hasard ni un simple effet de l'activité cérébrale nocturne. C'est une formation psychique qui a un sens.\n\nPourquoi alors le contenu manifeste est-il si étrange ? Parce qu'il a subi une *déformation*, exigée par la censure. Le désir ne peut se présenter tel quel.\n\n## Les opérations du travail du rêve\n\nLe chapitre VI décrit les opérations par lesquelles les pensées latentes deviennent contenu manifeste.\n\n**La condensation.** Le contenu manifeste est laconique, les pensées latentes sont abondantes. Un seul élément du rêve en représente plusieurs : une personne composite, un mot-valise. Un élément est « surdéterminé ».\n\n**Le déplacement.** L'intensité psychique passe d'un élément important à un élément accessoire. Ce qui est essentiel dans les pensées latentes peut n'apparaître qu'en marge du rêve, et inversement. C'est l'opération principale au service de la censure.\n\n**La prise en compte de la figurabilité.** Les pensées doivent être converties en images. Les relations logiques — si, parce que, bien que — n'ont pas de figuration directe ; le rêve les rend par juxtaposition, succession, transformation.\n\n**L'élaboration secondaire.** Une dernière retouche, proche de la pensée vigile, donne au rêve une façade d'intelligibilité. C'est souvent elle qu'il faut traverser en premier.\n\n## Une méthode\n\nL'interprétation ne consiste pas à appliquer une clé des songes. Freud rompt avec le symbolisme fixe : c'est le rêveur qui détient le sens, par ses associations libres sur chaque fragment. Le récit du rêve est découpé, et chaque morceau est suivi là où il mène.\n\n## La portée\n\nLa phrase ajoutée en 1909 au chapitre VII dit l'enjeu : le rêve est la voie royale vers la connaissance de l'inconscient dans la vie psychique. Car les mécanismes du rêve ne lui sont pas propres. On les retrouve dans le symptôme, le lapsus, le mot d'esprit.\n\nLacan relira la condensation et le déplacement à partir de la linguistique : métaphore et métonymie. Mais le point de départ est freudien : l'inconscient n'est pas un chaos, il a une logique, et cette logique se laisse lire.","quiz":[{"question":"Quelle est la thèse centrale de L'Interprétation du rêve ?","choix":["Le rêve est le produit aléatoire de l'activité cérébrale nocturne","Le rêve est l'accomplissement déguisé d'un désir refoulé","Le rêve prédit les événements futurs","Le rêve est un souvenir fidèle de la journée"],"bonne":1,"explication":"Pour Freud, le rêve a un sens : il accomplit un désir, sous une forme déformée par la censure. Il s'oppose explicitement à la thèse du produit aléatoire, aux lectures prophétiques, et les restes diurnes ne sont qu'un matériau parmi d'autres."},{"question":"Que désigne le déplacement dans le travail du rêve ?","choix":["Le changement de lieu ou de décor entre deux scènes successives d'un même rêve","La fusion de plusieurs personnes ou de plusieurs souvenirs en une seule figure","Le transfert de l'intensité psychique d'un élément important vers un élément accessoire","La transformation des pensées abstraites en images visuelles ou sonores"],"bonne":2,"explication":"Le déplacement fait passer l'intensité de l'essentiel vers l'accessoire, au service de la censure. La fusion de plusieurs éléments est la condensation ; la conversion en images relève de la prise en compte de la figurabilité ; un simple changement de décor n'est pas le concept freudien."},{"question":"Comment Freud interprète-t-il un rêve ?","choix":["À l'aide d'un dictionnaire de symboles fixes","En demandant au rêveur ce qu'il pense du rêve dans son ensemble","En comparant le rêve à ceux d'autres patients","En faisant associer librement le rêveur sur chaque fragment du rêve"],"bonne":3,"explication":"Le rêve est découpé et chaque élément est suivi par les associations du rêveur, qui détient le sens. Freud rompt avec la clé des songes, ne se contente pas d'une interprétation globale, et privilégie la singularité du rêveur."}],"sources":["Sigmund Freud, *L'Interprétation du rêve*, trad. Jean-Pierre Lefebvre, Seuil, 2010.","Sigmund Freud, *Sur le rêve* (1901), Gallimard, coll. « Folio Essais »."]},{"id":"nietzsche-perspectivisme","discipline":"philosophie","titre":"Pas de faits, seulement des interprétations","figure":"Friedrich Nietzsche","reference":"Fragments posthumes, fin 1886–printemps 1887, 7 [60] ; Par-delà bien et mal, § 22 (1886)","accroche":"La phrase la plus citée de Nietzsche est souvent lue comme un « tout se vaut ». C'est presque l'inverse : une exigence de lecture bien plus rigoureuse.","punch":"Il n'y a pas de faits. Mais il y a de bonnes et de mauvaises lectures.","idee":"Contre le positivisme qui s'en tient aux faits, Nietzsche répond qu'un fait est déjà une interprétation. Ce n'est pas un relativisme : les interprétations se jugent, comme les lectures d'un philologue, à leur probité et à ce qu'elles révèlent du type de vie qui les produit.","citation":"Non, justement, il n'y a pas de faits, seulement des interprétations.","citation_source":"Nietzsche, Fragments posthumes, fin 1886–printemps 1887, 7 [60] — traduit de l'allemand","liens":["nietzsche-ressentiment","ricoeur-soupcon","freud-reve"],"texte":"Le fragment est bref. Contre le positivisme, qui s'arrête au phénomène et dit « il n'y a que des faits », Nietzsche répond : non, justement, il n'y a pas de faits, seulement des interprétations. Nous ne pouvons constater aucun fait « en soi ». Et il ajoute aussitôt une précision décisive : même « le sujet » n'est pas un donné, mais quelque chose d'ajouté par l'imagination, glissé derrière.\n\n## L'interprétation n'est pas l'opinion\n\nLe contresens le plus répandu consiste à entendre « interprétation » comme « point de vue subjectif », et donc à conclure : à chacun sa vérité. Mais chez Nietzsche, l'interprétation n'est pas l'affaire d'un sujet qui donnerait son avis. Ce sont les pulsions, les affects, les besoins d'une forme de vie qui interprètent — qui sélectionnent, simplifient, hiérarchisent. Chaque pulsion a sa perspective qu'elle voudrait imposer aux autres comme norme.\n\nL'interprétation est donc moins un acte de la conscience qu'un processus vital, largement inconscient.\n\n## Le modèle philologique\n\nNietzsche était philologue de formation, et c'est de là que vient sa notion d'interprétation. Un texte se lit bien ou mal. Le bon philologue lit lentement, avec probité, sans projeter ses désirs sur le texte.\n\nLe § 22 de *Par-delà bien et mal* en offre une illustration : les physiciens parlent de la « conformité de la nature à des lois » ; ce n'est pas un fait, c'est un « arrangement naïvement humanitaire » du sens, une mauvaise philologie. Un autre interprète pourrait lire dans les mêmes phénomènes l'affirmation impitoyable de rapports de puissance. Et Nietzsche ajoute avec malice : à supposer que ce soit là aussi une interprétation — eh bien, tant mieux.\n\n## Juger les interprétations\n\nSi tout est interprétation, comment trancher ? Nietzsche ne renonce pas à hiérarchiser. Il demande ce qu'une interprétation exprime : un type de vie ascendant ou déclinant, une volonté de voir ou un besoin de ne pas voir. La question n'est plus « est-ce vrai ? » au sens d'une correspondance avec un fait nu, mais « qui interprète ainsi, et pourquoi en a-t-il besoin ? ».\n\nC'est ce déplacement qui fera de Nietzsche, aux yeux de Ricœur, l'un des trois « maîtres du soupçon ». Dans un tout autre registre, l'analyste rencontre la même exigence : la parole du patient ne livre pas des faits, mais un texte — qu'il s'agit de lire autrement, sans pour autant y lire n'importe quoi.","quiz":[{"question":"À quelle position Nietzsche répond-il dans le fragment 7 [60] ?","choix":["Au scepticisme antique qui doute de tout","Au positivisme qui s'en tient aux faits","À l'idéalisme allemand qui pose l'Esprit absolu","À la théologie chrétienne de la création"],"bonne":1,"explication":"Le fragment répond explicitement au positivisme, qui s'arrête au phénomène en disant « il n'y a que des faits ». Les autres courants ne sont pas visés ici, même si Nietzsche les critique ailleurs."},{"question":"Qui interprète, selon Nietzsche ?","choix":["Le sujet conscient, libre de choisir son point de vue","La communauté scientifique, par consensus","Dieu, qui donne leur sens aux choses","Les pulsions et les affects d'une forme de vie, largement inconsciemment"],"bonne":3,"explication":"L'interprétation est un processus vital : ce sont les pulsions qui interprètent, chacune avec sa perspective. Nietzsche précise même que le sujet est une fiction « ajoutée », et il récuse l'instance divine."},{"question":"Le perspectivisme nietzschéen est-il un relativisme du « tout se vaut » ?","choix":["Oui, puisque chacun a sa vérité et qu'aucune lecture ne prime","Oui, car Nietzsche refuse toute hiérarchie de valeurs","Non : les interprétations se hiérarchisent selon leur probité et le type de vie qu'elles expriment","Non, car Nietzsche croit en une vérité absolue accessible par la raison"],"bonne":2,"explication":"Nietzsche maintient une hiérarchie : il y a de la bonne et de la mauvaise philologie, des interprétations ascendantes ou déclinantes. Il ne renonce pas à juger, mais il ne revient pas non plus à une vérité absolue saisie par la raison."}],"sources":["Friedrich Nietzsche, *Fragments posthumes. Automne 1885–automne 1887*, Œuvres philosophiques complètes, XII, Gallimard.","Friedrich Nietzsche, *Par-delà bien et mal*, trad. Patrick Wotling, GF-Flammarion, 2000.","Patrick Wotling, *Nietzsche et le problème de la civilisation*, PUF, 1995."]},{"id":"lacan-stade-du-miroir","discipline":"psychanalyse","titre":"Le stade du miroir","figure":"Jacques Lacan","reference":"Le stade du miroir comme formateur de la fonction du Je (1949), dans Écrits (1966)","accroche":"Entre six et dix-huit mois, un enfant qui ne tient pas encore debout jubile devant son reflet. Lacan y voit la naissance du moi — et celle d'un malentendu qui ne nous quittera plus.","punch":"Le moi naît d'une image. C'est-à-dire d'un autre.","idee":"L'enfant, encore morcelé dans son corps, anticipe dans le miroir une unité qu'il ne possède pas. Il s'identifie à cette image. Le moi se constitue ainsi au dehors, dans une forme qui le précède et l'aliène : il est, dès l'origine, une fonction de méconnaissance.","citation":"La transformation produite chez le sujet quand il assume une image.","citation_source":"Lacan, Le stade du miroir… (1949), Écrits, Seuil, 1966","liens":["hegel-maitre-esclave","descartes-malin-genie","winnicott-mere-suffisamment-bonne"],"texte":"Lacan présente une première version du stade du miroir au congrès de Marienbad en 1936. Il en donne la version définitive au congrès de Zurich en 1949. Le texte fait une dizaine de pages ; il est l'un des plus commentés des *Écrits*.\n\n## La scène\n\nLe petit d'homme, entre six et dix-huit mois, ne marche pas, se tient à peine. Placé devant un miroir, soutenu par un adulte ou un « trotte-bébé », il se reconnaît, s'agite, et manifeste une jubilation intense. Il se penche, se retourne vers l'adulte comme pour faire confirmer, revient à l'image.\n\nLacan s'appuie sur l'éthologie (la maturation par une image chez certains animaux) et sur l'observation comparée du chimpanzé, qui se désintéresse vite de son reflet. Chez l'enfant, le reflet n'est pas un objet de curiosité passagère : c'est un événement.\n\n## Une identification\n\nLacan l'énonce : il faut comprendre le stade du miroir comme une identification, au sens plein que l'analyse donne à ce terme, à savoir la transformation produite chez le sujet quand il assume une image.\n\nPourquoi cette image fascine-t-elle ? Parce qu'elle offre une forme totale, unifiée, à un être qui ne l'est pas. L'enfant vit son corps comme morcelé ; ses fonctions motrices sont immatures — c'est la « prématuration spécifique » du petit d'homme. L'image lui présente une unité *anticipée*.\n\n## Le moi comme aliénation\n\nLe moi naît de là : non d'un développement interne, mais d'une image extérieure à laquelle le sujet s'identifie. Lacan parle d'une *ligne de fiction* : le moi est situé, dès l'origine, dans une direction qui restera irréductible pour le sujet.\n\nConséquences : le moi est une fonction de *méconnaissance*. Il est structuré comme une armure, une identité aliénante, dont le sujet sera porteur toute sa vie. Il ne coïncide jamais avec le sujet.\n\nIl y a aussi là le germe de la rivalité. Si je suis cette image, l'autre qui me ressemble est à la fois moi et ma place. Lacan évoque la jalousie de l'enfant qui voit un autre téter, ou celui qui frappe et dit avoir été frappé. La relation imaginaire est duelle, et agressive.\n\n## Contre l'ego psychology\n\nLe texte a une cible : les courants qui faisaient du renforcement du moi le but de la cure. Si le moi est l'instance de la méconnaissance, il ne peut pas être l'allié de l'analyste. Lacan y oppose une conception du sujet décentré, qui ne se confond pas avec l'image où il se reconnaît.\n\nOn rapproche souvent ce texte de la dialectique hégélienne de la reconnaissance, telle que Lacan l'avait entendue chez Kojève. Et de Winnicott, qui, en 1967, reprendra la question en se demandant ce que le visage de la mère reflète à l'enfant avant tout miroir.","quiz":[{"question":"Pourquoi l'enfant jubile-t-il devant son reflet selon Lacan ?","choix":["Parce qu'il reconnaît enfin sa mère, qui se tient derrière lui dans le reflet","Parce que l'image lui offre une unité anticipée, alors qu'il vit son corps comme morcelé","Parce qu'il croit voir dans la glace un autre enfant avec qui il pourrait jouer","Parce que le miroir produit des effets lumineux qui amusent tous les nourrissons"],"bonne":1,"explication":"L'image totale anticipe une maîtrise que l'enfant, prématuré, ne possède pas encore. La présence de l'adulte compte, mais n'est pas l'objet de la jubilation ; Lacan oppose justement l'enfant au chimpanzé qui se désintéresse vite du reflet."},{"question":"Que signifie l'expression « identification au sens plein » dans ce texte ?","choix":["Une simple ressemblance perçue entre deux personnes","La reconnaissance légale d'une personne","La transformation produite chez le sujet quand il assume une image","Le fait de connaître parfaitement sa propre identité"],"bonne":2,"explication":"Lacan définit l'identification comme la transformation par assomption d'une image. Il ne s'agit ni d'une ressemblance constatée, ni d'une identité juridique, et c'est précisément une connaissance parfaite de soi que le texte récuse."},{"question":"Quelle conséquence Lacan tire-t-il pour la théorie du moi ?","choix":["Le moi est l'instance la plus fiable, qu'il faut renforcer","Le moi n'existe pas","Le moi est une fonction de méconnaissance, constituée par une image aliénante","Le moi se développe uniquement à partir de l'intérieur"],"bonne":2,"explication":"Le moi naît d'une image extérieure : il est le siège de la méconnaissance. Lacan s'oppose ainsi aux courants qui visent le renforcement du moi ; il ne nie pas le moi, et il récuse l'idée d'un développement purement interne."}],"sources":["Jacques Lacan, « Le stade du miroir comme formateur de la fonction du Je », dans *Écrits*, Seuil, 1966.","D. W. Winnicott, « Le rôle de miroir de la mère et de la famille dans le développement de l'enfant » (1967), dans *Jeu et réalité*, Gallimard, 1975."]},{"id":"hegel-maitre-esclave","discipline":"philosophie","titre":"Le maître et l'esclave","figure":"G. W. F. Hegel","reference":"Phénoménologie de l'esprit, IV, A (1807)","accroche":"Deux consciences se rencontrent et chacune veut être reconnue par l'autre. L'une risque sa vie, l'autre cède. La suite renverse tout ce qu'on attendait.","punch":"Le maître a gagné le combat. C'est l'esclave qui gagne l'histoire.","idee":"La conscience de soi n'existe que reconnue par une autre. Dans la lutte, celui qui préfère la vie devient esclave. Mais le maître, reconnu par qui ne compte pas, s'enlise dans la jouissance, tandis que l'esclave, par la peur et le travail, se forme et se découvre.","citation":"La vérité de la conscience indépendante est la conscience servile.","citation_source":"Hegel, Phénoménologie de l'esprit, IV, A (1807) — traduit de l'allemand","liens":["lacan-desir-de-l-autre","lacan-stade-du-miroir","nietzsche-ressentiment"],"texte":"La section la plus commentée de la *Phénoménologie* tient en une dizaine de pages. Elle a été lue comme une théorie de l'histoire, une philosophie du travail, une anthropologie du désir. Elle part d'une thèse : la conscience de soi n'atteint sa satisfaction que dans une autre conscience de soi.\n\n## Le désir de reconnaissance\n\nJe ne suis pas certain de moi en me regardant moi-même. Le désir qui consomme les choses ne suffit pas : l'objet détruit, le désir renaît. Il faut un objet qui se nie lui-même pour moi, sans disparaître : une autre conscience qui me reconnaisse.\n\nMais l'autre veut la même chose. La rencontre de deux consciences de soi est donc une lutte. Chacune doit prouver qu'elle n'est attachée à rien, pas même à la vie. Elle ne le prouve qu'en risquant sa vie.\n\n## L'issue de la lutte\n\nSi les deux combattants allaient jusqu'au bout, l'un mourrait, et la reconnaissance serait perdue avec lui. L'issue est autre : l'un des deux recule devant la mort. Il préfère la vie à la liberté. Il devient l'esclave ; celui qui n'a pas reculé devient le maître.\n\nLe maître jouit des choses par la médiation de l'esclave, qui les travaille. Il a ce qu'il voulait : il est reconnu.\n\n## Le renversement\n\nSauf que cette reconnaissance est boiteuse. Le maître est reconnu par une conscience qu'il ne reconnaît pas — par un instrument. Sa vérité est une impasse : il jouit sans former, et dépend de l'esclave pour tout.\n\nL'esclave, lui, a fait deux expériences décisives. **La peur** : il a éprouvé l'angoisse de la mort, le « maître absolu », et toute sa substance a été ébranlée. **Le travail** : il forme la chose, il y imprime sa marque, et dans l'objet façonné il se contemple lui-même. Le travail est désir réfréné, disparition retenue ; il *forme*.\n\nD'où la phrase qui condense le renversement : la vérité de la conscience indépendante est la conscience servile.\n\n## La postérité\n\nEn France, cette section doit sa fortune au séminaire d'Alexandre Kojève à l'École pratique des hautes études (1933–1939), suivi par Bataille, Queneau, Merleau-Ponty, Aron — et Lacan. Kojève en fait le cœur de toute la *Phénoménologie* et formule l'idée qui marquera durablement la psychanalyse française : le désir humain est désir de désir, désir d'être reconnu.\n\nLa lecture kojévienne est discutée par les spécialistes de Hegel, qui y voient une anthropologisation forcée. Mais elle a produit une pensée du sujet où l'autre n'est pas un ajout extérieur : il est constitutif.","quiz":[{"question":"Pourquoi la conscience de soi a-t-elle besoin d'une autre conscience ?","choix":["Pour se procurer, par l'échange, les biens matériels nécessaires à sa survie","Parce qu'elle n'atteint sa certitude d'elle-même que reconnue par une autre conscience de soi","Pour éviter la solitude, que l'être humain juge psychologiquement insupportable","Parce que Dieu l'a créée pour vivre en communauté avec ses semblables"],"bonne":1,"explication":"La certitude de soi ne se vérifie que dans la reconnaissance d'une autre conscience. Il ne s'agit ni de besoins vitaux, ni d'une explication psychologique de la solitude, ni d'un fondement théologique."},{"question":"Qu'est-ce qui fait de l'un des combattants l'esclave ?","choix":["Il est physiquement le plus faible","Il est né dans une classe inférieure","Il recule devant la mort et préfère la vie à la liberté","Il a perdu la reconnaissance de ses pairs"],"bonne":2,"explication":"L'esclave est celui qui n'a pas voulu risquer sa vie jusqu'au bout. Hegel ne parle ni de force physique ni de condition sociale de naissance, et la reconnaissance est précisément ce qui est en jeu, non un acquis antérieur perdu."},{"question":"Quelles expériences permettent à l'esclave de dépasser sa condition ?","choix":["La révolte armée contre le maître, puis la fuite","L'éducation reçue du maître et la lecture","La prière et la résignation devant le destin","La peur de la mort et le travail qui forme la chose"],"bonne":3,"explication":"L'angoisse devant la mort, « maître absolu », ébranle tout en lui ; le travail lui permet de se reconnaître dans l'objet formé. Hegel ne décrit ici ni révolte, ni instruction, ni résignation religieuse."}],"sources":["G. W. F. Hegel, *Phénoménologie de l'esprit*, trad. Bernard Bourgeois, Vrin, 2006.","Alexandre Kojève, *Introduction à la lecture de Hegel*, Gallimard, 1947."]},{"id":"lacan-desir-de-l-autre","discipline":"psychanalyse","titre":"Le désir est le désir de l'Autre","figure":"Jacques Lacan","reference":"Subversion du sujet et dialectique du désir (1960), dans Écrits ; Séminaire XI (1964)","accroche":"Une formule de Lacan qu'on récite souvent sans en voir les trois sens. Chacun change la manière d'écouter un patient.","punch":"Je ne désire pas seul. Je désire depuis l'Autre.","idee":"Le désir n'est ni le besoin ni la demande : il naît de leur écart, dans le langage. « Désir de l'Autre » s'entend en plusieurs sens : désirer être désiré par l'Autre, désirer ce que l'Autre désire, et désirer en tant qu'Autre, depuis un lieu qui n'est pas le moi.","citation":"Le désir de l'homme est le désir de l'Autre.","citation_source":"Lacan, Subversion du sujet… (1960), Écrits, Seuil, 1966 ; Séminaire XI","liens":["spinoza-desir","hegel-maitre-esclave","lacan-ne-pas-ceder"],"texte":"La formule a une source philosophique claire : la lecture de Hegel par Kojève, pour qui le désir humain est désir de désir, désir d'être reconnu. Lacan la reprend et la transforme, en y introduisant une majuscule. L'Autre n'est pas seulement l'autre semblable : c'est le lieu du langage, du code, de la loi, d'où le sujet reçoit son propre message.\n\n## Besoin, demande, désir\n\nPour comprendre la formule, il faut d'abord la triade. Le **besoin** est d'ordre vital : la faim, le froid. Mais chez l'être humain, le besoin doit passer par la parole, s'adresser à quelqu'un. Il devient **demande**.\n\nOr la demande change de nature en s'adressant. Au-delà de l'objet qu'elle réclame, elle demande la présence de l'autre, son amour. Le sein n'est pas seulement du lait : il est la preuve qu'on est aimé. Toute demande est, au fond, demande d'amour.\n\nLe **désir** surgit dans l'écart entre les deux : ce qui, du besoin, ne passe pas dans la demande, et ce que la demande réclame d'inconditionnel que nul objet ne peut combler. Lacan l'écrit dans « La signification du phallus » (1958) : le désir n'est ni l'appétit de la satisfaction, ni la demande d'amour, mais la différence qui résulte de la soustraction du premier à la seconde.\n\n## Les sens du génitif\n\n« Le désir de l'Autre » est un génitif ambigu, et Lacan joue de cette ambiguïté.\n\n**Désirer être désiré par l'Autre.** C'est la leçon hégélienne : je veux être reconnu, être l'objet du désir de l'autre.\n\n**Désirer ce que l'Autre désire.** Le désir s'oriente sur le désir de l'autre, comme l'objet qu'un enfant convoite parce qu'un autre le tient. Le désir est d'emblée pris dans une dialectique.\n\n**Désirer en tant qu'Autre.** C'est le sens le plus lacanien : le sujet désire depuis le lieu de l'Autre, c'est-à-dire depuis le langage. Le désir est articulé dans des signifiants qui ne sont pas les siens, qui le précèdent. C'est pourquoi l'inconscient est le discours de l'Autre.\n\n## Che vuoi ?\n\nD'où la question que Lacan place au cœur de son graphe du désir : *Che vuoi ?* — « que veux-tu ? », reprise du *Diable amoureux* de Cazotte. Le sujet se la pose à propos de l'Autre : que me veut-il ? Et c'est en cherchant à y répondre qu'il construit son fantasme.\n\n## Pour l'écoute\n\nLa conséquence clinique est directe. Ce que le patient demande n'est pas forcément ce qu'il désire, et répondre à la demande peut étouffer le désir. L'analyste ne comble pas : il laisse ouverte la question du désir, pour que le sujet puisse y repérer ce qui, de l'Autre, parle en lui.","quiz":[{"question":"Comment Lacan définit-il le désir par rapport au besoin et à la demande ?","choix":["Le désir est un besoin plus intense que les autres","Le désir et la demande sont la même chose","Le désir naît de l'écart entre le besoin et la demande d'amour","Le désir est la satisfaction obtenue d'un besoin"],"bonne":2,"explication":"Le désir est la différence qui résulte de la soustraction de l'appétit de satisfaction à la demande d'amour. Il n'est ni une intensification du besoin, ni identique à la demande, ni la satisfaction elle-même."},{"question":"Que désigne « l'Autre » avec une majuscule ?","choix":["Le père réel de l'enfant, en tant qu'il incarne l'autorité familiale","Le lieu du langage, du code et de la loi, d'où le sujet reçoit son message","L'analyste en personne, tel que le patient le rencontre en séance","N'importe quel autre être humain, semblable à moi et rival"],"bonne":1,"explication":"L'Autre est le lieu du signifiant, distinct du petit autre, le semblable. Il peut être incarné par le père, la mère ou l'analyste, mais il ne se confond avec aucun d'eux."},{"question":"Quelle conséquence clinique découle de la distinction entre demande et désir ?","choix":["L'analyste doit satisfaire toutes les demandes du patient","Le désir du patient est toujours conscient","Le patient sait exactement ce qu'il désire","Répondre à la demande peut étouffer le désir, que l'analyste laisse ouvert"],"bonne":3,"explication":"Combler la demande peut fermer la question du désir. L'analyste ne satisfait pas les demandes, et la théorie suppose précisément que le désir est inconscient et que le sujet ne sait pas ce qu'il désire."}],"sources":["Jacques Lacan, « Subversion du sujet et dialectique du désir dans l'inconscient freudien » (1960), dans *Écrits*, Seuil, 1966.","Jacques Lacan, *Le Séminaire, livre XI. Les quatre concepts fondamentaux de la psychanalyse*, Seuil, 1973.","Alexandre Kojève, *Introduction à la lecture de Hegel*, Gallimard, 1947."]},{"id":"spinoza-desir","discipline":"philosophie","titre":"Le désir, essence de l'homme","figure":"Baruch Spinoza","reference":"Éthique, III, prop. 6–9 et Définitions des affects, 1 (1677)","accroche":"Nous ne désirons pas une chose parce qu'elle est bonne. Nous la jugeons bonne parce que nous la désirons. Spinoza retourne la morale comme un gant.","punch":"Ce n'est pas parce qu'une chose est bonne que nous la désirons. C'est l'inverse.","idee":"Chaque chose s'efforce de persévérer dans son être : c'est le conatus. Chez l'homme, cet effort conscient de lui-même s'appelle désir. Le bien n'est pas un étalon extérieur que le désir viserait : c'est le nom que nous donnons à ce que nous désirons.","citation":"Le désir est l'essence même de l'homme.","citation_source":"Spinoza, Éthique, III, Définitions des affects, 1 — traduit du latin","liens":["lacan-desir-de-l-autre","nietzsche-ressentiment","aristote-akrasia"],"texte":"Spinoza écrit l'*Éthique* « selon l'ordre géométrique », par définitions, axiomes et propositions démontrées. Il annonce, au seuil de la troisième partie, qu'il traitera des actions et des appétits humains comme s'il était question de lignes, de plans et de corps. Ni moquerie ni lamentation : comprendre.\n\n## Le conatus\n\nTout part d'une proposition d'une simplicité vertigineuse : chaque chose, autant qu'il est en elle, s'efforce de persévérer dans son être (III, 6). Cet effort, le *conatus*, n'est rien d'autre que l'essence actuelle de la chose (III, 7).\n\nRapporté à l'esprit seul, cet effort s'appelle volonté ; rapporté à l'esprit et au corps ensemble, appétit. Le désir, enfin, c'est l'appétit avec conscience de lui-même (III, 9, scolie). Il n'y a donc pas, chez Spinoza, une faculté rationnelle qui viendrait dompter les appétits. Il y a un seul effort, plus ou moins clair à lui-même.\n\n## Le renversement\n\nLe scolie de III, 9 contient la phrase qui fait de Spinoza un penseur scandaleux : nous ne nous efforçons vers rien, nous ne voulons, n'appétons ni ne désirons aucune chose parce que nous la jugeons bonne ; au contraire, nous jugeons qu'une chose est bonne parce que nous nous efforçons vers elle, la voulons, l'appétons et la désirons.\n\nLe bien n'est donc pas une propriété des choses, découverte par l'intellect, qui mettrait ensuite le désir en mouvement. C'est l'inverse : le jugement de valeur est l'expression du désir. Toute une tradition, de Platon aux moralistes chrétiens, se trouve retournée.\n\n## Pas un relativisme\n\nOn aurait tort d'en conclure que tout se vaut. Spinoza distingue des affects qui augmentent notre puissance d'agir (la joie) et d'autres qui la diminuent (la tristesse). Il y a un désir qui naît de la raison et un désir qui naît des passions, où nous sommes déterminés par des causes extérieures que nous ne comprenons pas.\n\nLa servitude, c'est cela : être mû par des causes qu'on ignore en se croyant libre. Les hommes se croient libres parce qu'ils ont conscience de leurs désirs et ignorent les causes qui les déterminent. La liberté n'est pas l'absence de détermination ; c'est la connaissance adéquate de ce qui nous détermine.\n\n## Un affect ne se combat que par un affect\n\nUne dernière thèse a une portée clinique évidente : un affect ne peut être contrarié ni supprimé que par un affect contraire et plus fort (IV, 7). La connaissance vraie du bien et du mal, en tant que vraie, ne peut rien contre un affect — seulement en tant qu'elle est elle-même considérée comme un affect.\n\nCe n'est pas l'information qui guérit. C'est un autre rapport, vécu, à ce qui nous meut.","quiz":[{"question":"Que désigne le conatus chez Spinoza ?","choix":["La faculté par laquelle la raison parvient à dominer les passions","L'effort par lequel chaque chose s'efforce de persévérer dans son être","La volonté libre de Dieu, qui gouverne toutes choses selon ses fins","La capacité de l'âme à se séparer du corps après la mort"],"bonne":1,"explication":"Le conatus est l'effort de persévérer dans l'être, et il constitue l'essence actuelle de chaque chose. Spinoza refuse l'idée d'une raison qui dompterait les passions de l'extérieur, d'un Dieu doté de volonté au sens humain, et d'une âme séparable du corps."},{"question":"Quel rapport Spinoza établit-il entre le désir et le bien ?","choix":["Nous désirons une chose parce que nous avons reconnu qu'elle est bonne","Le bien et le désir n'ont aucun rapport","Nous jugeons qu'une chose est bonne parce que nous la désirons","Le désir est toujours mauvais, seul le bien rationnel compte"],"bonne":2,"explication":"C'est le renversement du scolie de III, 9 : le jugement de valeur exprime le désir, il ne le précède pas. La première réponse est précisément la thèse que Spinoza retourne ; il ne condamne pas le désir, qui est l'essence de l'homme."},{"question":"Comment un affect peut-il être supprimé selon l'Éthique ?","choix":["Par la simple connaissance de sa fausseté","Par la volonté libre de l'esprit","Par la prière et la soumission à Dieu","Par un affect contraire et plus fort"],"bonne":3,"explication":"Un affect ne se combat que par un affect contraire et plus fort (IV, 7). La connaissance vraie n'agit qu'en tant qu'elle devient elle-même affect. Spinoza nie le libre arbitre et refuse la soumission religieuse comme voie de libération."}],"sources":["Spinoza, *Éthique*, trad. Bernard Pautrat, Seuil, coll. « Points Essais ».","Gilles Deleuze, *Spinoza. Philosophie pratique*, Minuit, 1981."]},{"id":"freud-apres-coup","discipline":"psychanalyse","titre":"L'après-coup","figure":"Sigmund Freud","reference":"Esquisse d'une psychologie scientifique, IIe partie (1895) ; L'Homme aux loups (1918)","accroche":"Un souvenir anodin peut devenir traumatique des années plus tard, sans que rien ne lui arrive. Freud nomme ce temps à rebours : la Nachträglichkeit.","punch":"Le trauma n'est jamais dans une seule scène. Il est entre deux.","idee":"Un événement ne prend pas toujours son sens au moment où il est vécu. Une seconde scène, plus tardive, peut réinvestir la première et lui conférer, après coup, une portée traumatique. Le passé n'est pas un dépôt fixe : il est remanié par ce qui le suit.","repere":"Nachträglichkeit, nachträglich : « après coup », « ultérieurement ». Le terme n'a été isolé comme concept que par Lacan (1953), puis par Laplanche et Pontalis dans le Vocabulaire de la psychanalyse (1967). Les traductions anglaises ont longtemps dit « deferred action ».","liens":["platon-reminiscence","freud-transfert","ferenczi-confusion"],"texte":"Le cas est exposé dans l'*Esquisse* de 1895, un manuscrit envoyé à Fliess que Freud ne publia jamais. Une jeune femme, Emma, ne peut entrer seule dans un magasin. Elle rattache ce symptôme à un souvenir de ses douze ans : elle était entrée dans une boutique, avait vu deux commis rire ensemble — de sa robe, pensait-elle — et s'était enfuie, prise d'une sorte d'effroi. L'un d'eux lui avait plu.\n\nLe souvenir n'explique rien. Pourquoi une scène aussi banale produirait-elle une phobie ?\n\n## La première scène\n\nL'analyse fait surgir un second souvenir, plus ancien. À huit ans, Emma était entrée seule chez un épicier qui l'avait touchée à travers ses vêtements, avec un sourire. Elle y était pourtant retournée une seconde fois.\n\nAu moment où elle a lieu, cette scène n'a pas été vécue comme sexuelle au sens où l'adulte l'entend : l'enfant n'avait pas les moyens psychiques de la comprendre. Elle n'est pas, à proprement parler, un traumatisme.\n\n## La seconde scène\n\nC'est la scène des douze ans, à la puberté, qui va réveiller la première. Le rire des commis, la boutique, l'attirance ressentie : par des liens associatifs, la scène de l'épicier revient, et elle revient avec une signification sexuelle qu'elle n'avait pas. Le déplaisir se déclenche alors, mais il est rattaché au souvenir récent ; le souvenir ancien, lui, est refoulé.\n\nFreud en tire une formule restée célèbre : un souvenir est refoulé qui n'est devenu traumatisme qu'après coup.\n\n## Un temps qui va à rebours\n\nL'après-coup renverse une conception linéaire de la causalité psychique. Ce n'est pas le passé qui détermine simplement le présent ; c'est aussi le présent qui réécrit le passé. Le trauma n'est pas dans la première scène ni dans la seconde, mais dans leur rapport.\n\nFreud reprend la notion dans *L'Homme aux loups* (1918) : la scène observée à un an et demi n'est comprise qu'à quatre ans, au moment du rêve des loups, et c'est alors qu'elle agit.\n\n## Deux lectures\n\nLacan, dès le *Discours de Rome* (1953), met la notion au centre : le sujet ne cesse de réécrire son histoire, et la cure elle-même opère dans ce temps-là. Laplanche, dans un autre sens, y voit la marque du rôle de l'autre : la première scène contient un message énigmatique, sexuel, venu de l'adulte, que l'enfant ne peut traduire et qui reste à traduire.\n\nDans les deux cas, une conséquence clinique : on ne retrouve pas le passé comme un objet enfoui intact. On le reconstruit — et cette reconstruction, en séance, est elle-même un nouvel après-coup.","quiz":[{"question":"Pourquoi la première scène, chez Emma, n'est-elle pas immédiatement traumatique ?","choix":["Parce que l'enfant ne pouvait pas encore en saisir la signification sexuelle","Parce que l'épicier, selon Freud, n'avait rien fait de répréhensible ce jour-là","Parce qu'Emma l'avait totalement oubliée dès le lendemain de l'événement","Parce que la scène avait été entièrement inventée par Emma au cours de la cure"],"bonne":0,"explication":"C'est faute de pouvoir lui donner sens que l'enfant ne la vit pas comme traumatique : la signification viendra à la puberté. L'acte de l'épicier est bien réel dans le récit de Freud, Emma y était même retournée, et rien n'indique une invention."},{"question":"Que signifie la formule « un souvenir n'est devenu traumatisme qu'après coup » ?","choix":["Que tout souvenir d'enfance finit tôt ou tard par devenir traumatique","Que les traumatismes réels n'existent pas, seuls existent les fantasmes","Que c'est une scène ultérieure qui confère à la première sa portée traumatique","Que le trauma se produit toujours à l'âge adulte, jamais dans l'enfance"],"bonne":2,"explication":"Le trauma se constitue entre deux scènes : la seconde réinvestit la première d'une signification nouvelle. Freud n'en fait pas une loi universelle, ne nie pas la réalité des événements, et la seconde scène se situe ici à la puberté, non à l'âge adulte."},{"question":"Qui a d'abord isolé la Nachträglichkeit comme concept à part entière ?","choix":["Freud lui-même, dans un article qui lui est consacré","Ferenczi, dans le Journal clinique","Lacan, puis Laplanche et Pontalis dans le Vocabulaire de la psychanalyse","Melanie Klein, dans sa théorie des positions"],"bonne":2,"explication":"Freud emploie le mot sans lui consacrer de texte : c'est Lacan qui l'isole en 1953, puis le Vocabulaire de Laplanche et Pontalis en 1967. Ferenczi et Klein ne sont pas à l'origine de ce dégagement."}],"sources":["Sigmund Freud, « Esquisse d'une psychologie scientifique » (1895), dans *Lettres à Wilhelm Fliess*, PUF, 2006.","Jean Laplanche et Jean-Bertrand Pontalis, *Vocabulaire de la psychanalyse*, PUF, 1967, article « Après-coup ».","Jean Laplanche, *Problématiques VI. L'après-coup*, PUF, 2006."]},{"id":"platon-reminiscence","discipline":"philosophie","titre":"La réminiscence","figure":"Platon","reference":"Ménon, 80d–86c (vers 385 av. J.-C.)","accroche":"Comment chercher ce qu'on ignore, puisqu'on ne saurait pas le reconnaître en le trouvant ? Platon répond : on ne découvre pas, on se ressouvient.","punch":"Apprendre, ce n'est pas recevoir. C'est se ressouvenir.","idee":"Face au paradoxe de Ménon, Platon soutient que l'âme a déjà su. Un esclave sans instruction retrouve seul un théorème : le savoir était là, enfoui. Chercher devient un travail sur soi, pas une collecte d'informations.","citation":"Chercher et apprendre ne sont, au total, que réminiscence.","citation_source":"Platon, Ménon, 81d — traduit du grec","liens":["freud-apres-coup","freud-transfert","kant-lumieres"],"texte":"Ménon pose à Socrate une objection qui a l'air d'un tour d'éristique et qui est en réalité redoutable. Si tu ne sais pas ce que tu cherches, comment le chercheras-tu ? Et si par hasard tu tombes dessus, comment sauras-tu que c'est cela ? Soit on sait déjà, et la recherche est inutile ; soit on ne sait pas, et elle est impossible.\n\n## Le détour par le mythe\n\nSocrate ne répond pas d'abord par un argument. Il rapporte ce que disent « des prêtres et des prêtresses » : l'âme est immortelle, elle a tout vu, ici et dans l'Hadès. Rien d'étonnant, donc, à ce qu'elle puisse se ressouvenir de ce qu'elle a su. Ce qu'on appelle apprendre est un rappel.\n\nLe geste est remarquable : le mythe ne clôt pas la discussion, il en fixe la condition. Platon a besoin qu'il y ait déjà du savoir *quelque part* dans l'âme pour que la recherche ait un sens.\n\n## L'esclave et le carré\n\nPuis vient l'expérience. Socrate interroge un jeune esclave de Ménon qui n'a jamais appris la géométrie : comment construire un carré deux fois plus grand qu'un carré donné ? L'esclave répond d'abord avec assurance — doubler le côté — et se trompe. Socrate lui montre que le carré obtenu est quatre fois plus grand. L'esclave est désormais dans l'embarras, l'*aporie*.\n\nC'est le moment décisif. Socrate fait remarquer à Ménon que l'esclave est en meilleure posture qu'avant : il croyait savoir, il sait maintenant qu'il ne sait pas, et il désire chercher. Quelques questions plus loin, il trouve lui-même la solution : la diagonale.\n\nSocrate insiste : il n'a rien enseigné, il a seulement interrogé. Les opinions vraies étaient dans l'esclave ; il fallait les réveiller.\n\n## Ce que la doctrine engage\n\nOn peut ne pas croire à la préexistence de l'âme et garder l'essentiel. La réminiscence soutient trois thèses que la philosophie n'a cessé de reprendre :\n\n- **Le savoir ne s'injecte pas.** Le maître ne transvase rien ; il provoque un travail chez l'autre. C'est le sens de la maïeutique.\n- **L'erreur assumée est un progrès.** L'aporie n'est pas un échec, c'est la condition du désir de savoir.\n- **L'opinion vraie n'est pas encore science.** Elle doit être « liée » par le raisonnement de la cause, sans quoi elle s'enfuit comme les statues de Dédale (97e–98a).\n\n## Une résonance\n\nIl y a quelque chose de troublant à lire cette scène avec une oreille clinique : un savoir qu'on porte sans le savoir, qu'un autre ne vous apprend pas mais vous aide à retrouver, et qui ne vaut que s'il passe par votre propre parole. La comparaison a ses limites — chez Platon, ce qui revient est vrai et intemporel ; chez Freud, ce qui revient est singulier, et souvent remanié. Mais la question de Ménon, *comment chercher ce qu'on ne sait pas*, est aussi celle de toute cure.","quiz":[{"question":"Quel problème la doctrine de la réminiscence vient-elle résoudre dans le Ménon ?","choix":["Comment prouver l'immortalité de l'âme par la seule raison","Comment il est possible de chercher ce que l'on ignore","Pourquoi les esclaves ne reçoivent aucune éducation à Athènes","Comment distinguer un sophiste d'un vrai philosophe"],"bonne":1,"explication":"C'est le « paradoxe de Ménon » : si l'on ignore ce qu'on cherche, on ne peut ni le chercher ni le reconnaître. L'immortalité de l'âme n'est pas démontrée ici, elle est rapportée par le mythe comme condition. La condition des esclaves et la critique des sophistes ne sont pas l'enjeu de ce passage."},{"question":"Pourquoi Socrate juge-t-il que l'esclave progresse quand il tombe dans l'embarras ?","choix":["Parce qu'il a enfin compris que la géométrie est inutile","Parce qu'il accepte désormais l'autorité de son maître","Parce qu'il a mémorisé la bonne réponse donnée par Socrate","Parce qu'il sait à présent qu'il ne sait pas, et désire chercher"],"bonne":3,"explication":"L'aporie remplace une fausse certitude par un savoir de son ignorance, qui relance le désir de chercher. Socrate ne donne aucune réponse à mémoriser, il ne réclame aucune soumission, et la géométrie n'est jamais jugée inutile — elle est au contraire le terrain de la démonstration."},{"question":"Qu'est-ce qui distingue l'opinion vraie de la science, selon la fin du dialogue ?","choix":["La science porte sur le sensible, l'opinion sur l'intelligible","L'opinion vraie doit être liée par le raisonnement de la cause pour devenir science","L'opinion vraie est toujours fausse en pratique","La science vient des dieux, l'opinion vient des hommes"],"bonne":1,"explication":"Les opinions vraies sont comme les statues de Dédale : elles s'enfuient tant qu'on ne les attache pas par un raisonnement causal. L'opinion vraie n'est pas fausse, elle est instable. L'opposition sensible/intelligible n'est pas ce que le Ménon mobilise ici, et la distinction n'oppose pas dieux et hommes."}],"sources":["Platon, *Ménon*, trad. Monique Canto-Sperber, GF-Flammarion, 1991.","Platon, *Phédon*, 72e–77a : seconde exposition de la réminiscence."]},{"id":"freud-transfert","discipline":"psychanalyse","titre":"Répéter au lieu de se souvenir","figure":"Sigmund Freud","reference":"Remémoration, répétition et perlaboration (1914)","accroche":"Le patient ne se souvient pas de ce qu'il a oublié. Il le rejoue — avec l'analyste. Freud fait de cet obstacle le levier même de la cure.","punch":"Ce qu'on ne peut pas se rappeler, on le répète.","idee":"Ce qui est refoulé ne revient pas comme souvenir mais comme acte, sans que le patient sache qu'il répète. Le transfert est un fragment de cette répétition. Il ouvre une « arène » où le passé se rejoue au présent et peut, enfin, être élaboré : c'est la perlaboration.","citation":"Il le répète, sans savoir, naturellement, qu'il le répète.","citation_source":"Freud, Remémoration, répétition et perlaboration (1914) — traduit de l'allemand","liens":["platon-reminiscence","freud-apres-coup","freud-fort-da"],"texte":"Ce court texte de 1914 fait partie des écrits techniques de Freud, rédigés pour les analystes. Il marque un tournant. La méthode cathartique des débuts visait la remémoration : retrouver la scène oubliée, et le symptôme disparaissait. Freud constate que les choses ne se passent pas ainsi.\n\n## L'agir à la place du souvenir\n\nLe patient, écrit Freud, ne se souvient en général de rien de ce qu'il a oublié et refoulé ; il l'agit. Il ne le reproduit pas comme souvenir mais comme acte ; il le répète, sans savoir qu'il le répète.\n\nExemples : le patient ne se souvient pas d'avoir été insolent et rebelle envers l'autorité de ses parents, mais il se comporte ainsi envers le médecin. Il ne se souvient pas d'être resté bloqué dans ses recherches sexuelles d'enfant, mais il apporte en séance un tas de rêves confus et se plaint que rien ne lui réussit.\n\nTant qu'il est en traitement, il ne se libère pas de cette contrainte de répéter. On finit par comprendre que c'est là sa manière de se souvenir.\n\n## Le transfert comme répétition\n\nLe transfert est lui-même un fragment de répétition, et la répétition est le transfert du passé oublié — non seulement sur le médecin, mais sur tous les domaines de la situation présente.\n\nFreud en tire une conséquence technique : il ne faut pas traiter la maladie comme une affaire historique, mais comme une force actuelle. Le patient doit pouvoir rencontrer, en séance, ce qu'il répète.\n\n## L'arène\n\nL'image centrale est celle d'un terrain de jeu, d'une arène. Le transfert crée une zone intermédiaire entre la maladie et la vie, où la compulsion de répétition peut se manifester presque en toute liberté, mais dans un cadre. Le patient y joue ce qui, ailleurs, l'agit.\n\nLe maniement du transfert est donc le moyen principal de dompter la compulsion de répétition et de la transformer en motif de remémoration.\n\n## Perlaborer\n\nReste un dernier temps, le plus long. Nommer une résistance ne la fait pas disparaître. Il faut laisser au patient le temps de s'enfoncer dans la résistance qu'il ne connaît pas encore, de la *perlaborer* (*durcharbeiten*), de la surmonter en poursuivant le travail malgré elle.\n\nFreud prévient : ce travail est une tâche pénible pour l'analysé et une épreuve de patience pour l'analyste. Mais c'est aussi la partie du travail qui a le plus d'effet de transformation. Il ne suffit pas de comprendre. Il faut que la compréhension traverse, encore et encore, les mêmes points de résistance.","quiz":[{"question":"Comment le refoulé revient-il, selon Freud en 1914 ?","choix":["Sous forme de souvenirs nets que le patient raconte","Sous forme d'actes, que le patient répète sans savoir qu'il répète","Sous forme d'hallucinations visuelles","Il ne revient jamais, il reste définitivement enfoui"],"bonne":1,"explication":"Le patient n'en garde aucun souvenir mais agit ce qu'il a oublié, sans le reconnaître comme répétition. C'est précisément l'écart avec la méthode cathartique, qui misait sur la remémoration. Le texte ne parle pas d'hallucinations, et l'enjeu est justement le retour du refoulé."},{"question":"Quel rapport Freud établit-il entre transfert et répétition ?","choix":["Ils n'ont aucun rapport","Le transfert empêche toute répétition","Le transfert est un fragment de répétition, transfert du passé oublié","La répétition ne concerne que la vie hors des séances"],"bonne":2,"explication":"Le transfert est lui-même répétition, et la répétition est le transfert du passé oublié sur le médecin comme sur la situation actuelle. Il ne l'empêche pas : il la rend visible et maniable."},{"question":"Que désigne la perlaboration ?","choix":["La rédaction par l'analyste d'un compte rendu détaillé après chaque séance","La première interprétation que l'analyste donne au patient en début de cure","La fin définitive de l'analyse, une fois tous les symptômes disparus","Le travail par lequel le patient traverse et surmonte une résistance qui a été nommée"],"bonne":3,"explication":"Nommer une résistance ne suffit pas : il faut laisser au patient le temps de s'y enfoncer et de la surmonter. Ce n'est ni un écrit de l'analyste, ni une première interprétation, ni une fin de cure."}],"sources":["Sigmund Freud, « Remémoration, répétition et perlaboration » (1914), dans *La Technique psychanalytique*, PUF.","Sigmund Freud, « Sur la dynamique du transfert » (1912)."]},{"id":"pascal-divertissement","discipline":"philosophie","titre":"Le divertissement","figure":"Blaise Pascal","reference":"Pensées, liasse « Divertissement » (publication posthume, 1670)","accroche":"Pourquoi le roi, qui a tout, a-t-il besoin qu'on l'empêche de penser à lui ? Pascal a une réponse, et elle ne flatte personne.","punch":"Le chasseur ne veut pas le lièvre. Il veut la chasse.","idee":"Si nous courons d'occupation en occupation, ce n'est pas pour ce que nous poursuivons, c'est pour ne pas rester seuls avec notre condition. Le divertissement console de notre misère — et c'est pourtant « la plus grande de nos misères ».","citation":"Tout le malheur des hommes vient d'une seule chose, qui est de ne savoir pas demeurer en repos dans une chambre.","citation_source":"Pascal, Pensées, fr. 139 (Brunschvicg) / 136 (Lafuma)","liens":["freud-fort-da","schopenhauer-pendule","epicure-mort"],"texte":"Pascal regarde les hommes s'agiter : la guerre, le
