ns valeur","Il en fait le sujet principal des propositions du livre","Il les réduit à des préférences psychologiques"],"bonne":0,"explication":"L'inexprimable existe et se montre : c'est le mystique. Wittgenstein ne le juge pas sans valeur, il le tient même pour l'essentiel. Il refuse justement d'en faire des thèses, et ne le réduit pas à la psychologie."},{"question":"Que signifie l'image de l'échelle à la fin du Tractatus ?","choix":["Qu'il faut lire le livre plusieurs fois pour le comprendre","Que les propositions du livre, dénuées de sens, se rejettent une fois comprises","Que la philosophie progresse par étapes vers la vérité absolue","Que la logique est supérieure à l'éthique"],"bonne":1,"explication":"Les propositions du Tractatus ne figurent aucun fait : elles servent d'échelle qu'on rejette après y être monté. Il ne s'agit ni d'une méthode de lecture, ni d'un progrès vers l'absolu, ni d'une hiérarchie entre logique et éthique."}],"sources":["Ludwig Wittgenstein, *Tractatus logico-philosophicus*, trad. Gilles-Gaston Granger, Gallimard, 1993.","Ludwig Wittgenstein, *Recherches philosophiques*, trad. Françoise Dastur et al., Gallimard, 2004."]},{"id":"green-mere-morte","discipline":"psychanalyse","titre":"La mère morte","figure":"André Green","reference":"La mère morte (1980), dans Narcissisme de vie, narcissisme de mort (1983)","accroche":"La mère morte d'André Green est vivante. Elle s'occupe de son enfant. Mais quelque chose en elle s'est éteint — et l'enfant en porte le deuil sans le savoir.","punch":"La mère est là. Mais son regard est ailleurs.","idee":"Une mère, frappée par un deuil ou une dépression, se désinvestit brutalement de son enfant tout en restant présente. L'enfant, qui ne peut comprendre, décathecte l'objet maternel et s'identifie à ce trou. Il en résulte non une perte, mais un vide : une dépression blanche.","repere":"Green parle de « complexe de la mère morte ». Le mot « morte » désigne une mort psychique : une imago maternelle devenue lointaine, atone, quasi inanimée aux yeux de l'enfant, alors que la mère est restée en vie.","liens":["freud-deuil-melancolie","winnicott-mere-suffisamment-bonne","bion-reverie"],"texte":"André Green présente ce texte en 1980, à la Société psychanalytique de Paris. Il deviendra l'un des articles les plus cités de la psychanalyse française. Green le tire de patients qui ne correspondent pas aux tableaux habituels : pas de deuil manifeste, pas de dépression franche, mais un sentiment d'impuissance à aimer, une vie qui fonctionne sans être vivante.\n\n## Ce n'est pas la mort réelle\n\nGreen insiste d'emblée : la mère morte n'est pas une mère qui est morte. C'est une mère qui reste vivante, mais qui est pour ainsi dire morte psychiquement aux yeux du jeune enfant dont elle prend soin.\n\nLa cause est souvent un deuil : la perte d'un proche, d'un enfant (une fausse couche dissimulée), une déception amoureuse, une humiliation. La mère se déprime. Elle continue de nourrir, de laver, d'habiller ; elle n'investit plus.\n\n## Le changement brutal\n\nLe point décisif est le *changement*. Avant, l'enfant vivait une relation vivante, chaleureuse. Brusquement, l'imago maternelle se transforme. L'enfant ne dispose d'aucune explication : il ne peut rapporter ce changement à un deuil dont il ignore tout.\n\nIl interprète donc à partir de lui-même : c'est sa faute, il n'a pas su retenir l'amour de sa mère. Il tente de la réanimer, de la distraire, de la faire rire. En vain.\n\n## La décathexis et l'identification\n\nFace à l'échec, l'enfant met en œuvre une double défense. D'une part il *désinvestit* l'objet maternel — un meurtre psychique sans haine. D'autre part, il *s'identifie* à la mère morte, non pas à l'objet mais au trou qu'elle est devenue.\n\nGreen décrit ainsi une identification « en négatif ». Le sujet porte en lui un vide, un lieu où l'objet aurait dû être. Il devient, à son insu, le gardien de ce vide.\n\n## La dépression blanche\n\nD'où une forme particulière de dépression, que Green nomme *blanche*. Le blanc désigne le vide, l'absence de représentation. Ce n'est pas le noir du deuil, rempli de tristesse et de reproche ; c'est une absence.\n\nDans l'analyse, ces patients sont souvent très investis intellectuellement, capables de réussites, mais leurs relations amoureuses échouent sur un point : l'amour reste « hypothéqué » par la mère morte. Ils ne peuvent aimer sans qu'une part d'eux reste retenue par elle.\n\n## Pour l'analyste\n\nGreen tire de là une indication technique : ces patients ne supportent pas un analyste silencieux, qui risque de répéter la mère absente. Il ne s'agit pas d'abandonner le cadre, mais de maintenir un investissement vivant, perceptible, pour que le transfert ne reproduise pas le désert.","quiz":[{"question":"Qu'est-ce que la « mère morte » selon André Green ?","choix":["Une mère réellement décédée pendant la petite enfance du sujet","Une mère restée vivante mais psychiquement absente, désinvestie de son enfant","Une mère maltraitante et violente envers son jeune enfant","Une figure de la mythologie grecque reprise par la psychanalyse"],"bonne":1,"explication":"Green précise que la mère morte est vivante : c'est son investissement qui s'est éteint, souvent sous l'effet d'un deuil. Ce n'est ni un décès réel, ni nécessairement de la maltraitance, et la notion est clinique, non mythologique."},{"question":"Quelle double défense l'enfant met-il en place ?","choix":["La sublimation dans l'art et la formation réactionnelle","Le refoulement du souvenir et la projection de la haine","Le désinvestissement de l'objet maternel et l'identification au trou qu'il laisse","Le déni de la réalité et l'hallucination de la mère présente"],"bonne":2,"explication":"L'enfant désinvestit la mère, « meurtre psychique sans haine », et s'identifie au vide qu'elle est devenue. Les autres couples de défenses ne sont pas ceux que Green décrit pour ce complexe."},{"question":"Pourquoi Green parle-t-il de dépression « blanche » ?","choix":["Parce qu'elle survient surtout en hiver","Parce qu'elle est moins grave qu'une dépression ordinaire","Parce qu'elle ne nécessite aucun traitement","Parce qu'elle est faite de vide et d'absence de représentation"],"bonne":3,"explication":"Le blanc désigne le vide, par opposition au noir du deuil chargé de tristesse et de reproche. Ce n'est ni une affaire de saison, ni une forme bénigne, et Green en tire au contraire des indications techniques précises."}],"sources":["André Green, « La mère morte », dans *Narcissisme de vie, narcissisme de mort*, Minuit, 1983.","André Green, *Le Travail du négatif*, Minuit, 1993."]},{"id":"nietzsche-ressentiment","discipline":"philosophie","titre":"Le ressentiment","figure":"Friedrich Nietzsche","reference":"Généalogie de la morale, I, § 10–13 (1887)","accroche":"« Bon » et « méchant » ne sont pas des évidences. Nietzsche fait la généalogie d'une valeur qui naît, dit-il, d'une vengeance qui n'a pas pu avoir lieu.","punch":"Le ressentiment ne peut pas agir. Alors il invente des valeurs.","idee":"La morale noble dit oui à elle-même et nomme ensuite « mauvais » ce qui ne lui ressemble pas. La morale du ressentiment commence par un non : elle désigne d'abord le « méchant », l'autre, puis se définit comme « bonne » par contraste. Une vengeance imaginaire devient créatrice de valeurs.","citation":"La révolte des esclaves dans la morale commence lorsque le ressentiment lui-même devient créateur et enfante des valeurs.","citation_source":"Nietzsche, Généalogie de la morale, I, § 10 (1887) — traduit de l'allemand","liens":["hegel-maitre-esclave","nietzsche-perspectivisme","spinoza-desir"],"texte":"La *Généalogie de la morale* se présente comme un « écrit polémique ». Nietzsche n'y demande pas ce qui est bien ou mal, mais d'où viennent nos évaluations, et quelle valeur ont ces valeurs. Il fait de la morale un symptôme, un signe qu'il faut interpréter.\n\n## Deux manières d'évaluer\n\nLa première dissertation oppose deux couples. **Bon / mauvais** (*gut / schlecht*) : c'est l'évaluation noble. Les forts, les bien-portants, commencent par se dire oui à eux-mêmes. « Bon » désigne d'abord leur propre manière d'être ; « mauvais » vient après, comme un terme secondaire, presque un contraste pâle.\n\n**Bon / méchant** (*gut / böse*) : c'est l'évaluation née du ressentiment. Elle procède à l'inverse. Elle commence par concevoir « le méchant » — l'autre, le fort — et c'est seulement ensuite, par contrecoup, qu'elle se pense elle-même comme « bonne ».\n\n## Une action détournée\n\nLe § 10 nomme le mécanisme. Le ressentiment est celui d'êtres à qui la vraie réaction, celle de l'action, est interdite, et qui ne se dédommagent que par une vengeance imaginaire. Alors que la morale noble naît d'un oui triomphant, la morale du ressentiment dit non à ce qui est autre : ce non est son acte créateur.\n\nLe ressentiment a besoin d'un monde extérieur hostile pour agir. Son action est fondamentalement réaction.\n\n## L'agneau et l'oiseau de proie\n\nLe § 13 contient une fable célèbre. Que les agneaux en veuillent aux grands oiseaux de proie, rien d'étonnant. Mais ils en tirent un raisonnement : ces oiseaux sont méchants, et qui leur ressemble le moins, l'agneau, est bon.\n\nLe coup décisif est l'invention d'un sujet libre, séparé de ce qu'il fait : on pourrait exiger de la force qu'elle ne se manifeste pas comme force. Or, dit Nietzsche, il n'y a pas d'« être » derrière le faire ; l'agir est tout. La croyance en un sujet neutre qui pourrait choisir d'être faible permet de faire de la faiblesse un mérite.\n\n## Contre deux contresens\n\n**Ce n'est pas un appel à la cruauté.** Nietzsche ne recommande pas de redevenir des oiseaux de proie. Il juge d'ailleurs que c'est l'homme du ressentiment, avec le prêtre, qui a rendu l'homme « intéressant », lui a donné de la profondeur.\n\n**Ce n'est pas une description historique au sens strict.** La généalogie est une méthode d'interprétation des valeurs par les types de vie qu'elles expriment. Elle demande : quel type d'homme a besoin de croire cela ?\n\nUne question qu'on peut retourner sur soi-même, à chaque fois qu'un jugement moral nous procure un soulagement un peu trop vif.","quiz":[{"question":"Comment procède l'évaluation noble selon Nietzsche ?","choix":["Elle commence par un oui à soi-même, « mauvais » ne vient qu'ensuite par contraste","Elle commence par désigner l'ennemi comme méchant, puis se dit bonne","Elle reçoit ses valeurs d'une révélation divine transmise par les prêtres","Elle s'appuie sur un calcul d'utilité sociale, ce qui est utile étant bon"],"bonne":0,"explication":"La morale noble affirme d'abord sa propre manière d'être ; « mauvais » est un terme secondaire. Désigner d'abord l'ennemi comme méchant caractérise au contraire la morale du ressentiment. Nietzsche critique précisément l'explication utilitariste de l'origine du « bon »."},{"question":"Que signifie que le ressentiment devient « créateur » ?","choix":["Qu'il produit des œuvres d'art remarquables","Qu'il pousse à l'action violente et immédiate","Que, privé d'action réelle, il se venge en inventant des valeurs","Qu'il permet de fonder des institutions politiques"],"bonne":2,"explication":"Le ressentiment est le fait d'êtres à qui la réaction par l'action est interdite : ils se dédommagent par une vengeance imaginaire qui crée des valeurs. Il ne s'agit pas d'art, il est justement privé d'action, et Nietzsche ne parle pas ici d'institutions."},{"question":"Quel est le rôle du « sujet » dans la fable de l'agneau et de l'oiseau de proie ?","choix":["Il prouve que l'agneau est réellement plus vertueux que l'oiseau","Il sépare l'agir de l'agent, pour exiger de la force qu'elle ne se manifeste pas","Il montre que les oiseaux de proie ont eux aussi une conscience morale","Il démontre l'existence du libre arbitre chez tous les vivants"],"bonne":1,"explication":"La fiction d'un sujet neutre derrière l'action permet d'imputer la force comme une faute et la faiblesse comme un mérite. Nietzsche nie qu'il y ait un « être » derrière le faire : loin de démontrer le libre arbitre, il le traite comme une interprétation intéressée."}],"sources":["Friedrich Nietzsche, *Généalogie de la morale*, trad. Patrick Wotling, Le Livre de Poche, 2000.","Patrick Wotling, *La Philosophie de l'esprit libre. Introduction à Nietzsche*, Flammarion, 2008."]},{"id":"lacan-ne-pas-ceder","discipline":"psychanalyse","titre":"Ne pas céder sur son désir","figure":"Jacques Lacan","reference":"Le Séminaire, livre VII. L'éthique de la psychanalyse, leçon du 6 juillet 1960","accroche":"La phrase ressemble à un slogan de développement personnel. C'est presque l'inverse : une éthique qui se mesure à Antigone, et qui ne promet aucun bonheur.","punch":"Une seule faute, au regard de l'analyse : avoir cédé sur son désir.","idee":"L'éthique de la psychanalyse n'est pas une morale du bien ni du bonheur. Elle demande : avez-vous agi conformément au désir qui vous habite ? Céder sur son désir, c'est le trahir au nom du « service des biens ». Antigone en est la figure : elle va jusqu'au bout, au prix de sa vie.","citation":"La seule chose dont on puisse être coupable, au moins dans la perspective analytique, c'est d'avoir cédé sur son désir.","citation_source":"Lacan, Le Séminaire, livre VII (1959–1960), Seuil, 1986","liens":["lacan-desir-de-l-autre","spinoza-desir","kant-lumieres"],"texte":"Le séminaire de 1959–1960 porte sur l'éthique, et il s'ouvre sur une question : la psychanalyse a-t-elle une éthique propre, ou n'est-elle qu'une technique au service d'une morale existante — celle de l'adaptation, de la normalité, du bonheur ?\n\nLacan répond par la négative à la seconde hypothèse. La dernière leçon condense sa position en quelques formules.\n\n## Le service des biens\n\nLacan appelle « service des biens » l'ordre ordinaire de la morale : travailler, posséder, s'adapter, se conformer à ce qui est utile et raisonnable. C'est l'ordre d'Aristote, celui de l'éthique du souverain bien, et c'est aussi celui de la vie sociale. Il n'est pas méprisable ; il est même nécessaire.\n\nMais il a une fonction précise : il ajourne le désir. Que le travail continue ; quant aux désirs, ils attendront — c'est en substance, dit Lacan, la morale de tout pouvoir.\n\n## La question du jugement\n\nLacan propose alors de ramener l'éthique analytique à une question unique, qu'on pourrait poser comme au jugement dernier : *avez-vous agi conformément au désir qui vous habite ?*\n\nIl en tire la formule : la seule chose dont on puisse être coupable, du point de vue analytique, c'est d'avoir cédé sur son désir. Et il précise que la culpabilité qu'on éprouve est, au fond, toujours liée à ce recul.\n\n## Antigone\n\nLe séminaire avait consacré plusieurs leçons à la tragédie de Sophocle. Antigone enterre son frère Polynice, malgré l'édit de Créon qui l'interdit. Créon, c'est le service des biens : le bien de la cité, la loi commune. Antigone se tient sur une autre ligne, celle d'une loi qui n'est pas écrite.\n\nLacan s'intéresse à l'éclat d'Antigone, à sa beauté, et à la zone où elle se tient, « entre deux morts ». Elle ne cède pas. Mais elle n'est pas présentée comme un modèle à imiter : sa position est tragique, elle ouvre sur la mort.\n\n## Contre deux contresens\n\n**Ce n'est pas « faites ce que vous voulez ».** Le désir lacanien n'est pas l'envie ni le caprice. Il est inconscient, articulé dans l'Autre ; il faut une analyse pour en approcher la logique. Ne pas céder sur son désir, ce n'est pas céder à ses envies.\n\n**Ce n'est pas une promesse de bonheur.** Lacan refuse explicitement que l'analyste se fasse le garant du rêve bourgeois de confort. Le désir ne mène pas au bien-être. Il mène à une certaine vérité du sujet, dont le prix peut être élevé.\n\nOn peut d'ailleurs lire le séminaire comme une dispute avec Kant : la loi morale et le désir sont plus proches qu'on ne le croit, et Lacan écrira, deux ans plus tard, « Kant avec Sade ».","quiz":[{"question":"Qu'appelle Lacan le « service des biens » ?","choix":["La prière adressée à Dieu pour obtenir ses faveurs ici-bas","L'ordre du travail, de l'utile et de l'adaptation, qui ajourne le désir","Le paiement des séances d'analyse, qui engage le patient","La charité envers les plus pauvres, prônée par l'Église"],"bonne":1,"explication":"Le service des biens désigne l'ordre de l'utile et du raisonnable, nécessaire mais qui remet le désir à plus tard. Il ne s'agit ni de religion, ni du dispositif financier de la cure, ni de charité."},{"question":"Quel rôle joue Antigone dans le séminaire ?","choix":["Elle incarne l'obéissance aux lois de la cité, même injustes","Elle est présentée comme un modèle de bonheur à imiter","Elle figure celle qui ne cède pas, face à Créon qui incarne le bien de la cité","Elle représente la folie que l'analyste aurait dû soigner"],"bonne":2,"explication":"Antigone se tient sur une autre loi que celle de Créon et ne recule pas. Ce n'est pas l'obéissance à la cité, puisqu'elle transgresse l'édit ; sa position tragique n'a rien d'un bonheur ; et Lacan ne la pathologise pas."},{"question":"Que ne signifie PAS « ne pas céder sur son désir » ?","choix":["Ne pas trahir le désir inconscient au nom du service des biens","Se demander si l'on a agi conformément au désir qui nous habite","Accepter que le désir puisse avoir un prix élevé","Satisfaire toutes ses envies immédiates"],"bonne":3,"explication":"Le désir lacanien n'est pas l'envie ni le caprice : il est inconscient, articulé dans l'Autre. Les trois autres propositions correspondent bien à la position du séminaire."}],"sources":["Jacques Lacan, *Le Séminaire, livre VII. L'éthique de la psychanalyse*, Seuil, 1986.","Sophocle, *Antigone*.","Jacques Lacan, « Kant avec Sade » (1962), dans *Écrits*, Seuil, 1966."]},{"id":"ricoeur-soupcon","discipline":"philosophie","titre":"Les maîtres du soupçon","figure":"Paul Ricœur","reference":"De l'interprétation. Essai sur Freud, livre I, chap. 2 (1965)","accroche":"Marx, Nietzsche, Freud : trois pensées que tout oppose. Ricœur montre qu'elles font le même geste — et qu'il ne suffit pas de démasquer pour comprendre.","punch":"Après Marx, Nietzsche et Freud, la conscience n'est plus crue sur parole.","idee":"Ricœur distingue deux herméneutiques. L'une recueille un sens qui s'adresse à nous ; l'autre soupçonne : elle tient le sens apparent pour un déguisement. Marx, Nietzsche et Freud ont fait du doute sur la conscience une méthode. Mais le soupçon n'est qu'un moment de l'interprétation.","repere":"Herméneutique : art de l'interprétation, d'abord des textes sacrés et juridiques, puis, avec Schleiermacher et Dilthey, de toute expression humaine. Ricœur en fait le lieu où se croisent philosophie et psychanalyse.","liens":["nietzsche-perspectivisme","freud-moi-pas-maitre","descartes-malin-genie"],"texte":"En 1965, Ricœur publie un livre de 500 pages sur Freud, issu de conférences données à Yale. Le livre est mal reçu par les lacaniens, qui lui reprochent de ne pas citer Lacan. Il reste pourtant l'une des lectures philosophiques les plus rigoureuses de Freud, et l'un de ses chapitres a donné une formule à tout un siècle.\n\n## Deux manières d'interpréter\n\nRicœur part d'un constat : il n'y a pas une herméneutique générale, mais deux pôles opposés.\n\n**L'herméneutique comme recueil du sens.** Elle aborde un texte, un symbole, un mythe, avec une confiance : quelque chose s'y dit, qui nous concerne. Interpréter, c'est écouter. C'est l'attitude de la phénoménologie de la religion.\n\n**L'herméneutique comme exercice du soupçon.** Elle part du principe inverse : le sens apparent est un masque. Il faut démystifier, réduire les illusions, remonter du sens manifeste au sens latent.\n\n## Trois maîtres\n\nLe second pôle est dominé, dit Ricœur, par trois maîtres en apparence exclusifs les uns des autres : Marx, Nietzsche et Freud. Ce qui les réunit, c'est d'avoir fait de la conscience elle-même un objet de doute.\n\nDescartes doutait des choses, mais pas de la conscience : ce qu'elle se représentait pouvait être faux, mais que la conscience soit telle qu'elle s'apparaît à elle-même, cela restait certain. Avec les maîtres du soupçon, le doute atteint la conscience. Le sens tel que la conscience le saisit est un effet, produit par l'intérêt de classe, la volonté de puissance, ou le désir inconscient.\n\n## Démasquer pour comprendre\n\nLe point décisif est souvent oublié : pour Ricœur, ces trois penseurs ne sont pas des destructeurs, mais des créateurs d'une nouvelle manière d'interpréter. Ils ne se contentent pas de dénoncer : ils inventent un art de déchiffrer. Ce sont des « exégètes » du sens, pas seulement des sceptiques.\n\nEt le soupçon n'est pas le dernier mot. Ricœur propose une dialectique : il faut traverser la démystification, renoncer aux idoles, pour pouvoir ensuite écouter autrement. Le mot d'ordre est double : volonté de soupçon et volonté d'écoute, vœu de rigueur et vœu d'obéissance.\n\n## Archéologie et téléologie\n\nAppliquée à Freud, cette dialectique donne une thèse forte. La psychanalyse est une *archéologie* du sujet : elle ramène le sens vers l'arrière, vers le désir et l'enfance. Il lui faut une contrepartie, une *téléologie*, que Ricœur trouve chez Hegel : un mouvement vers l'avant, vers les figures de l'esprit.\n\nOn peut discuter cette symétrie. Elle a le mérite de poser une question que tout clinicien connaît : interpréter, est-ce seulement défaire une illusion, ou aussi rendre possible un sens qui n'existait pas encore ?","quiz":[{"question":"Quelles sont les deux herméneutiques que distingue Ricœur ?","choix":["Celle des textes sacrés et celle des textes profanes","Une herméneutique du recueil du sens et une herméneutique du soupçon","L'herméneutique juridique et l'herméneutique littéraire","L'herméneutique rationaliste et l'herméneutique empiriste"],"bonne":1,"explication":"Ricœur oppose une interprétation qui écoute un sens qui nous est adressé et une interprétation qui le démasque. Les autres oppositions désignent des domaines ou des écoles, pas ces deux attitudes fondamentales."},{"question":"Qu'est-ce qui rapproche Marx, Nietzsche et Freud selon Ricœur ?","choix":["Une même théorie de l'économie","Une même hostilité à la religion chrétienne","Le fait de soumettre la conscience elle-même au doute","Une même conception de l'inconscient"],"bonne":2,"explication":"Contrairement à Descartes, qui doutait des choses mais pas de la conscience, les trois maîtres font de la conscience un objet de soupçon. Leurs théories sont par ailleurs très différentes, ce que Ricœur souligne en les disant « en apparence exclusifs »."},{"question":"Quel est le statut du soupçon dans la démarche de Ricœur ?","choix":["C'est le dernier mot de toute interprétation véritable","C'est une erreur de méthode dont il faut se garder","C'est un moment nécessaire, à traverser pour pouvoir écouter autrement","C'est une méthode réservée aux sciences sociales"],"bonne":2,"explication":"Ricœur propose une dialectique : le soupçon doit être traversé pour accéder à une écoute renouvelée. Il n'en fait ni le terme ultime, ni une erreur, ni une méthode cantonnée à une discipline."}],"sources":["Paul Ricœur, *De l'interprétation. Essai sur Freud*, Seuil, 1965 ; rééd. coll. « Points Essais ».","Paul Ricœur, *Le Conflit des interprétations*, Seuil, 1969."]}];
const PAR_ID = Object.fromEntries(FICHES.map(f => [f.id, f]));
const NOM_DISC = { philosophie: 'Philosophie', psychanalyse: 'Psychanalyse' };
const CLE = 'apres-coup.etat.v1';

// ---------- Dates locales ----------
const pad = n => String(n).padStart(2, '0');
const jourDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const aujourdhui = () => jourDe(new Date());
const ecart = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };
const decaler = (j, n) => { const [y, m, d] = j.split('-').map(Number); return jourDe(new Date(y, m - 1, d + n)); };

// ---------- État ----------
function etatVide() {
  return { debut: aujourdhui(), lues: {}, quiz: {}, notes: {}, reglages: { rythme: 'alterne', acces: 'jour', theme: 'auto', voix: '', vitesse: 1 }, reglagesLe: 0 };
}
function chargerLocal() {
  try { const s = localStorage.getItem(CLE); if (s) return Object.assign(etatVide(), JSON.parse(s)); } catch (e) {}
  return etatVide();
}
let etat = chargerLocal();
etat.reglages = Object.assign(etatVide().reglages, etat.reglages);

function fusionner(a, b) {
  const r = etatVide();
  r.debut = [a.debut, b.debut].filter(Boolean).sort()[0] || aujourdhui();
  r.lues = { ...b.lues };
  for (const [id, j] of Object.entries(a.lues || {})) if (!r.lues[id] || j < r.lues[id]) r.lues[id] = j;
  r.quiz = { ...(b.quiz || {}) };
  for (const [id, rep] of Object.entries(a.quiz || {})) {
    const autre = r.quiz[id] || [];
    r.quiz[id] = (rep || []).map((v, i) => v ?? autre[i] ?? null);
    for (let i = (rep || []).length; i < autre.length; i++) r.quiz[id][i] = autre[i];
  }
  r.notes = { ...(b.notes || {}) };
  for (const [id, n] of Object.entries(a.notes || {})) if (!r.notes[id] || (n.le || 0) > (r.notes[id].le || 0)) r.notes[id] = n;
  const plusRecent = (a.reglagesLe || 0) >= (b.reglagesLe || 0) ? a : b;
  r.reglages = Object.assign(etatVide().reglages, plusRecent.reglages);
  r.reglagesLe = plusRecent.reglagesLe || 0;
  return r;
}

let docDistant = null, minuterieSync = null, syncTexte = 'Progression enregistrée sur cet appareil.';
function enregistrer() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
  if (!docDistant) return;
  clearTimeout(minuterieSync);
  minuterieSync = setTimeout(async () => {
    try { await docDistant.set(JSON.parse(JSON.stringify(etat))); syncTexte = 'Synchronisé entre tes appareils.'; }
    catch (e) { syncTexte = 'Synchronisation momentanément indisponible ; la progression reste sur cet appareil.'; }
  }, 1200);
}
async function brancherSync() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    docDistant = db.doc('data/users/' + uid + '/progression');
    const snap = await docDistant.get();
    if (snap.exists) etat = fusionner(etat, snap.data());
    syncTexte = 'Synchronisé entre tes appareils.';
    try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
    await docDistant.set(JSON.parse(JSON.stringify(etat)));
    appliquerTheme(); rendre();
  } catch (e) { docDistant = null; }
}

// ---------- Calendrier des séances ----------
function suite() {
  const r = etat.reglages.rythme;
  return r === 'alterne' ? FICHES : FICHES.filter(f => f.discipline === r);
}
function indexDuJour() { return Math.max(0, ecart(etat.debut, aujourdhui())); }
function ficheDuJour() { const s = suite(); return s[indexDuJour() % s.length]; }
function numeroDe(id) { const i = suite().findIndex(f => f.id === id); return i < 0 ? null : i + 1; }
function ouvertes() {
  const s = suite();
  if (etat.reglages.acces === 'tout') return new Set(FICHES.map(f => f.id));
  const n = Math.min(s.length, indexDuJour() + 1);
  const ids = new Set(s.slice(0, n).map(f => f.id));
  for (const id of Object.keys(etat.lues)) ids.add(id);
  return ids;
}
function serie() {
  const jours = new Set(Object.values(etat.lues));
  let n = 0, j = aujourdhui();
  if (!jours.has(j)) j = decaler(j, -1);
  while (jours.has(j)) { n++; j = decaler(j, -1); }
  const tri = [...jours].sort();
  let record = 0, cur = 0, prec = null;
  for (const d of tri) { cur = prec && ecart(prec, d) === 1 ? cur + 1 : 1; record = Math.max(record, cur); prec = d; }
  return { n, record };
}

// ---------- Utilitaires ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enLigne = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
function markdown(txt) {
  return txt.split(/\n{2,}/).map(bloc => {
    if (bloc.startsWith('## ')) return `<h2>${enLigne(bloc.slice(3))}</h2>`;
    const lignes = bloc.split('\n');
    if (lignes.every(l => l.startsWith('- '))) return `<ul>${lignes.map(l => `<li>${enLigne(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p>${enLigne(lignes.join(' '))}</p>`;
  }).join('');
}
const texteBrut = s => s.replace(/^## /gm, '').replace(/\*\*?/g, '').replace(/^- /gm, '');
function hache(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function melange(n, graine) {
  const ordre = [...Array(n).keys()]; let x = graine || 1;
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
  return ordre;
}
const inkVars = d => `--ink: var(--${d === 'philosophie' ? 'philo' : 'psy'}); --voile: var(--${d === 'philosophie' ? 'philo' : 'psy'}-voile);`;
const dateLongue = j => { const [y, m, d] = j.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); };

  ({ jour: rendreJour, biblio: rendreBiblio, carnet: rendreCarnet, reglages: rendreReglages })[onglet]();

let minuterieCompte = null;
function rendreJour() {
  clearInterval(minuterieCompte);
  const f = ficheDuJour(), lu = !!etat.lues[f.id], s = suite();
  const demain = s[(indexDuJour() + 1) % s.length];
  const rappel = choisirRappel(f.id);
  $vue.innerHTML = `
  <section class="vue">
    <article class="une" style="${inkVars(f.discipline)}">
      <div class="rang" style="justify-content:space-between">
        <span class="disc ${f.discipline}">${NOM_DISC[f.discipline]}</span>
        <span class="seance-num">Séance n° ${numeroDe(f.id)} / ${s.length}</span>
      </div>
      <h1>${esc(f.titre)}</h1>
      <div class="figure">${esc(f.figure)}</div>
      <p class="accroche">${esc(f.accroche)}</p>
      <div class="rang" style="margin-top:8px">
        <button class="bouton" id="lire">${lu ? 'Relire la séance' : 'Commencer la séance'} →</button>
      </div>
      ${lu ? `<div class="verrou">
        <span class="etiquette">Séance suivante dans</span>
        <span class="compte" id="compte">--:--:--</span>
        <p>Demain : <span class="disc ${demain.discipline}">${NOM_DISC[demain.discipline]}</span></p>
      </div>` : ''}
    </article>
    ${rappel ? rendreRappel(rappel) : ''}
  </section>`;
  document.getElementById('lire').onclick = () => ouvrir(f.id);
  if (rappel) brancherRappel(rappel);
  if (lu) { const maj = () => { const el = document.getElementById('compte'); if (!el) return clearInterval(minuterieCompte); const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const t = Math.max(0, Math.floor((m - n) / 1000)); el.textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; if (t === 0) rendre(); }; maj(); minuterieCompte = setInterval(maj, 1000); }
}
function choisirRappel(saufId) {
  const lues = Object.keys(etat.lues).filter(id => id !== saufId && PAR_ID[id]);
  if (!lues.length) return null;
  const g = hache(aujourdhui());
  const f = PAR_ID[lues[g % lues.length]];
  return { f, qi: (g >>> 3) % f.quiz.length };
}
function rendreRappel({ f, qi }) {
  const q = f.quiz[qi], ordre = melange(q.choix.length, hache(f.id + qi));
  return `<section class="rappel" style="${inkVars(f.discipline)}">
    <span class="etiquette">Rappel · ${esc(f.titre)}</span>
    <h2>${esc(q.question)}</h2>
    <div class="choix" id="rappel-choix">${ordre.map(i => `<button data-i="${i}">${esc(q.choix[i])}</button>`).join('')}</div>
    <p class="explication" id="rappel-expl" hidden></p>
  </section>`;
}
function brancherRappel({ f, qi }) {
  const q = f.quiz[qi], zone = document.getElementById('rappel-choix');
  zone.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    marquerChoix(zone, q.bonne, Number(b.dataset.i));
    const ex = document.getElementById('rappel-expl'); ex.hidden = false;
    ex.innerHTML = `<strong>${Number(b.dataset.i) === q.bonne ? 'Retenu.' : 'Pas tout à fait.'}</strong> ${esc(q.explication)}`;
  };
}
function marquerChoix(zone, bonne, choisi) {
  for (const b of zone.querySelectorAll('button')) {
    const i = Number(b.dataset.i); b.disabled = true;
    if (i === bonne) b.classList.add('juste'); else if (i === choisi) b.classList.add('faux'); else b.classList.add('barre');
  }
}

function rendreBiblio() {
  const ouv = ouvertes(), s = suite();
  const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const q = norm(requete.trim());
  const visibles = s.filter(f => ouv.has(f.id)).filter(f => filtre === 'tout' || f.discipline === filtre)
    .filter(f => !q || norm(`${f.titre} ${f.figure} ${f.reference} ${f.texte}`).includes(q));
  const restantes = s.filter(f => !ouv.has(f.id)).length;
  $vue.innerHTML = `
  <section class="vue">
    <div class="outils">
      <div class="filtres" role="group" aria-label="Discipline">
        ${['tout', 'philosophie', 'psychanalyse'].map(d => `<button class="filtre" data-f="${d}" aria-pressed="${filtre === d}">${d === 'tout' ? 'Tout' : NOM_DISC[d]}</button>`).join('')}
      </div>
      <input class="recherche" id="recherche" type="search" placeholder="Chercher une notion, un auteur, une œuvre" value="${esc(requete)}" aria-label="Chercher">
    </div>
    <ul class="liste">${visibles.map(f => `<li><button class="item" data-id="${f.id}">
      <span class="n">${pad(numeroDe(f.id))}</span>
      <span class="t">${esc(f.titre)}</span>
      <span class="etat ${etat.lues[f.id] ? 'lu ' + f.discipline : ''}" title="${etat.lues[f.id] ? 'Lue' : 'Non lue'}"></span>
      <span class="s">${esc(f.figure)} · ${NOM_DISC[f.discipline]}</span>
    </button></li>`).join('') || '<li><p class="vide" style="padding:16px 0">Aucune séance ne correspond.</p></li>'}</ul>
    ${restantes ? `<p class="a-venir">${restantes} séance${restantes > 1 ? 's' : ''} à paraître, une par jour.</p>` : ''}
  </section>`;
  $vue.querySelector('.filtres').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filtre = b.dataset.f; rendreBiblio(); } };
  $vue.querySelector('.liste').onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrir(b.dataset.id); };
  const r = document.getElementById('recherche');
  r.oninput = () => { requete = r.value; const pos = r.selectionStart; rendreBiblio(); const n = document.getElementById('recherche'); n.focus(); n.setSelectionRange(pos, pos); };
}

    </div>
  </article>`;

  document.getElementById('retour').onclick = document.getElementById('retour-bas').onclick = () => { arreterVoix(); lecture = null; rendre(); window.scrollTo(0, 0); };
  document.getElementById('carte').onclick = () => montrerCarte(f);
  for (const b of $vue.querySelectorAll('.resonance[data-id]')) b.onclick = () => ouvrir(b.dataset.id);

  // Quiz
  for (const zone of $vue.querySelectorAll('.question')) {
    const qi = Number(zone.dataset.qi), q = f.quiz[qi], choix = zone.querySelector('.choix'), ex = zone.querySelector('.explication');
    const montrer = choisi => { marquerChoix(choix, q.bonne, choisi); ex.hidden = false; ex.innerHTML = `<strong>${choisi === q.bonne ? 'Juste.' : 'Pas tout à fait.'}</strong> ${esc(q.explication)}`; };
    if (rep[qi] != null) montrer(rep[qi]);
    choix.onclick = e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      const i = Number(b.dataset.i); montrer(i);
      const r = etat.quiz[f.id] || []; r[qi] = i; etat.quiz[f.id] = r; enregistrer();
    };
  }
  // Notes
  const ta = document.getElementById('note-' + f.id), ne = document.getElementById('note-etat'); let tn = null;
  ta.oninput = () => { ne.textContent = '…'; clearTimeout(tn); tn = setTimeout(() => {
    const t = ta.value.trim(); if (t) etat.notes[f.id] = { texte: ta.value, le: Date.now() }; else delete etat.notes[f.id];
    enregistrer(); ne.textContent = 'Enregistré.'; }, 600); };
  // Écoute
  brancherVoix(f);
  // Progression de lecture + lu en fin de corps
  const barre = document.getElementById('progression');
  const surDefil = () => { if (!barre.isConnected) return; const h = document.documentElement.scrollHeight - innerHeight; barre.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 100) + '%'; };
  window.onscroll = surDefil; surDefil();
  if (observateurFin) observateurFin.disconnect();
  observateurFin = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !etat.lues[f.id]) {
    etat.lues[f.id] = aujourdhui(); enregistrer();
    const el = document.getElementById('fin-etat'); if (el) el.textContent = 'Séance lue le ' + dateLongue(etat.lues[f.id]);
  } });
  observateurFin.observe(document.getElementById('fin'));
}

// ---------- Voix ----------
const synth = window.speechSynthesis;
let enLecture = false;
function voixFr() { try { return (synth.getVoices() || []).filter(v => /^fr/i.test(v.lang)); } catch (e) { return []; } }
function arreterVoix() { if (synth) { try { synth.cancel(); } catch (e) {} } enLecture = false; }
function brancherVoix(f) {
  const zone = document.getElementById('ecoute');
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { zone.hidden = true; return; }
  const dessiner = () => {
    const parle = enLecture && (synth.speaking || synth.pending), pause = synth.paused;
    zone.innerHTML = !parle ? `<button class="bouton secondaire" id="v-lire">Écouter la séance</button>`
      : `<button class="bouton secondaire" id="v-pause">${pause ? 'Reprendre' : 'Pause'}</button><button class="bouton discret" id="v-stop">Arrêter</button>`;
    const l = document.getElementById('v-lire'), p = document.getElementById('v-pause'), s = document.getElementById('v-stop');
    if (l) l.onclick = () => {
      arreterVoix(); enLecture = true;
      const morceaux = [f.titre + '.', f.accroche, f.citation ? f.citation + '. ' + f.citation_source : f.repere, ...texteBrut(f.texte).split(/\n{2,}/)];
      const voix = voixFr(), choisie = voix.find(v => v.name === etat.reglages.voix) || voix[0];
      morceaux.forEach((m, i) => {
        const u = new SpeechSynthesisUtterance(m); u.lang = 'fr-FR'; if (choisie) u.voice = choisie; u.rate = etat.reglages.vitesse || 1;
        if (i === morceaux.length - 1) u.onend = () => { enLecture = false; dessiner(); };
        synth.speak(u);
      });
      dessiner();
    };
    if (p) p.onclick = () => { synth.paused ? synth.resume() : synth.pause(); setTimeout(dessiner, 60); };
    if (s) s.onclick = () => { arreterVoix(); dessiner(); };
  };
  dessiner();
}

// ---------- Carnet ----------
function rendreCarnet() {
  const { n, record } = serie(), total = Object.keys(etat.lues).length;
  const parJour = {}; for (const [id, j] of Object.entries(etat.lues)) if (PAR_ID[id]) parJour[j] = PAR_ID[id].discipline;
  const auj = aujourdhui(), lundi = decaler(auj, -((new Date().getDay() + 6) % 7) - 7);
  const cases = [...Array(14).keys()].map(i => decaler(lundi, i));
  const compte = d => Object.keys(etat.lues).filter(id => PAR_ID[id]?.discipline === d).length;
  const dispo = d => FICHES.filter(f => f.discipline === d).length;
  const notes = Object.entries(etat.notes).filter(([id, v]) => PAR_ID[id] && v.texte.trim()).sort((a, b) => b[1].le - a[1].le);
  $vue.innerHTML = `
  <section class="vue">
    <div class="serie">
      <span class="grand">${n}</span>
      <span class="etiquette">${n > 1 ? 'jours de suite' : 'jour de suite'}</span>
      <span class="mineurs"><span>Record · ${record}</span><span>Séances lues · ${total} / ${FICHES.length}</span></span>
    </div>
    <div style="display:grid;gap:10px">
      <span class="etiquette">Relevé des deux dernières semaines</span>
      <div class="jours-sem">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(j => `<span>${j}</span>`).join('')}</div>
      <div class="releve">${cases.map(j => `<span class="${parJour[j] || ''} ${j === auj ? 'aujourdhui' : ''}" title="${dateLongue(j)}${parJour[j] ? ' · ' + NOM_DISC[parJour[j]] : ''}"></span>`).join('')}</div>
    </div>
    <div class="repartition">
      <span class="etiquette">Corpus parcouru</span>
      ${['philosophie', 'psychanalyse'].map(d => `<div class="ligne-rep"><span class="disc ${d}">${NOM_DISC[d]}</span>
        <span class="piste"><i style="width:${dispo(d) ? compte(d) / dispo(d) * 100 : 0}%;background:var(--${d === 'philosophie' ? 'philo' : 'psy'})"></i></span><b>${compte(d)}</b></div>`).join('')}
    </div>
    <div style="display:grid;gap:4px">
      <span class="etiquette">Tes notes</span>
      ${notes.length ? `<ul class="liste">${notes.map(([id, v]) => `<li><button class="note-item" data-id="${id}">
        <span class="t">${esc(PAR_ID[id].titre)}</span><span class="extrait">${esc(v.texte)}</span></button></li>`).join('')}</ul>`
        : '<p class="vide">Les notes que tu prends en fin de séance se retrouvent ici.</p>'}
    </div>
  </section>`;
  const l = $vue.querySelector('.liste'); if (l) l.onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrir(b.dataset.id); };
}

// ---------- Réglages ----------
function appliquerTheme() {
  const t = etat.reglages.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function rendreReglages() {
  const r = etat.reglages, voix = voixFr();
  const seg = (cle, opts) => `<div class="segments" data-cle="${cle}">${opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(r[cle]) === String(v)}">${l}</button>`).join('')}</div>`;
  $vue.innerHTML = `
  <section class="vue" style="gap:0">
    <div class="reglage" style="border-top:3px solid var(--encre)">
      <h2>Rythme</h2><p>Quelles séances composent ta suite quotidienne.</p>
      ${seg('rythme', [['alterne', 'Les deux, en alternance'], ['philosophie', 'Philosophie seule'], ['psychanalyse', 'Psychanalyse seule']])}
    </div>
    <div class="reglage">
      <h2>Accès</h2><p>Une séance par jour, comme un rendez-vous ; ou tout le corpus ouvert pour réviser.</p>
      ${seg('acces', [['jour', 'Une séance par jour'], ['tout', 'Tout le corpus']])}
    </div>
    <div class="reglage">
      <h2>Lecture à voix haute</h2>
      ${voix.length ? `<p>Voix proposées par ton appareil.</p>
        <select class="champ" id="voix" aria-label="Voix">${voix.map(v => `<option value="${esc(v.name)}" ${v.name === r.voix ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : '<p>Aucune voix française détectée sur cet appareil pour l\'instant.</p>'}
      ${seg('vitesse', [['0.9', 'Posée'], ['1', 'Normale'], ['1.15', 'Vive']])}
    </div>
    <div class="reglage">
      <h2>Apparence</h2>
      ${seg('theme', [['auto', 'Comme l\'appareil'], ['light', 'Clair'], ['dark', 'Sombre']])}
    </div>
    <div class="reglage">
      <h2>Progression</h2>
      <p>Commencée le ${dateLongue(etat.debut)}.</p>
      <span class="sync">${esc(syncTexte)}</span>
      <div class="confirmation">${confirmerRaz
        ? `<span>Effacer séances lues, réponses et notes ?</span><button class="bouton" id="raz-oui">Tout effacer</button><button class="bouton discret" id="raz-non">Annuler</button>`
        : `<button class="bouton secondaire" id="raz">Repartir de la séance n° 1</button>`}</div>
    </div>
  </section>`;
  for (const g of $vue.querySelectorAll('.segments')) g.onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const cle = g.dataset.cle; r[cle] = cle === 'vitesse' ? Number(b.dataset.v) : b.dataset.v;
    etat.reglagesLe = Date.now(); enregistrer(); appliquerTheme(); rendreReglages();
  };
  const v = document.getElementById('voix'); if (v) v.onchange = () => { r.voix = v.value; etat.reglagesLe = Date.now(); enregistrer(); };
  const raz = document.getElementById('raz'); if (raz) raz.onclick = () => { confirmerRaz = true; rendreReglages(); };
  const non = document.getElementById('raz-non'); if (non) non.onclick = () => { confirmerRaz = false; rendreReglages(); };
  const oui = document.getElementById('raz-oui'); if (oui) oui.onclick = () => {
    const reg = etat.reglages; etat = etatVide(); etat.reglages = reg; etat.reglagesLe = Date.now(); confirmerRaz = false; enregistrer(); rendreReglages();
  };
}

// ---------- Carte partageable 1080 × 1920 ----------
async function montrerCarte(f) {
  const calque = document.getElementById('calque');
  calque.innerHTML = `<div class="voile-carte" id="voile"><div class="panneau-carte" role="dialog" aria-label="Carte à partager"><p>Composition de la carte…</p></div></div>`;
  const fermer = () => { calque.innerHTML = ''; };
  document.getElementById('voile').onclick = e => { if (e.target.id === 'voile') fermer(); };
  try { await Promise.all(['96px Gloock', '44px Newsreader', '30px "Spline Sans Mono"'].map(p => document.fonts.load(p))); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const encre = f.discipline === 'philosophie' ? '#1E5C57' : '#8C2F3E';
  x.fillStyle = '#ECEEE9'; x.fillRect(0, 0, W, H);
  // Deux disques en surimpression, rappel du sceau
  x.globalAlpha = .9; x.fillStyle = '#1E5C57'; x.beginPath(); x.arc(770, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'multiply'; x.fillStyle = '#8C2F3E'; x.beginPath(); x.arc(930, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  const M = 84, larg = W - 2 * M;
  const lignes = (txt, police, max) => { x.font = police; const mots = txt.split(' '), out = []; let l = ''; for (const m of mots) { const t = l ? l + ' ' + m : m; if (x.measureText(t).width > max && l) { out.push(l); l = m; } else l = t; } if (l) out.push(l); return out; };
  x.fillStyle = encre; x.font = '500 30px "Spline Sans Mono", monospace';
  x.fillText(NOM_DISC[f.discipline].toUpperCase(), M, 760);
  x.fillStyle = '#5A6468'; x.fillText(f.figure.toUpperCase(), M, 805);
  // Zone texte : de 880 jusqu'au cartouche de référence, qui monte selon sa hauteur
  x.font = '28px "Spline Sans Mono", monospace';
  const ref = lignes(f.reference, '28px "Spline Sans Mono", monospace', larg - 40);
  const hautRef = ref.length * 40 + 44, basTexte = 1680 - hautRef - 50;
  let tp = 88, ti = 42, pl, il, hauteur;
  for (;;) {
    pl = lignes(f.punch, `${tp}px Gloock, Georgia, serif`, larg);
    il = lignes(f.idee, `${ti}px Newsreader, Georgia, serif`, larg);
    hauteur = pl.length * tp * 1.08 + 110 + il.length * ti * 1.42;
    if (880 + hauteur <= basTexte || tp <= 56) break;
    tp -= 4; ti = Math.max(32, ti - 2);
  }
  let y = 880 + tp * .8;
  x.fillStyle = '#1B2024'; x.font = `${tp}px Gloock, Georgia, serif`;
  for (const l of pl) { x.fillText(l, M, y); y += tp * 1.08; }
  y += 10; x.fillStyle = encre; x.fillRect(M, y, 120, 6); y += 40 + ti;
  x.fillStyle = '#1B2024'; x.font = `${ti}px Newsreader, Georgia, serif`;
  for (const l of il) { x.fillText(l, M, y); y += ti * 1.42; }
  let yb = 1680 - hautRef + 52;
  x.fillStyle = encre; x.fillRect(M - 20, 1680 - hautRef, larg + 40, hautRef);
  x.fillStyle = '#F7F8F4'; x.font = '28px "Spline Sans Mono", monospace'; for (const l of ref) { x.fillText(l, M, yb); yb += 40; }
  x.fillStyle = '#1B2024'; x.fillRect(M, 1712, larg, 4);
  x.font = '44px Gloock, Georgia, serif'; x.fillText('Après-coup', M, 1782);
  x.font = '28px "Spline Sans Mono", monospace'; const n = 'Séance n° ' + (numeroDe(f.id) ?? ''); x.fillText(n, W - M - x.measureText(n).width, 1780);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  const panneau = calque.querySelector('.panneau-carte');
  panneau.innerHTML = `<img src="${url}" alt="Carte : ${esc(f.punch)}"><div class="rang" style="justify-content:center">
    <button class="bouton" id="enregistrer" hidden>Enregistrer l'image</button><button class="bouton secondaire" id="fermer">Fermer</button></div>
    <p id="carte-msg">Sur téléphone, un appui long sur l'image permet aussi de l'enregistrer.</p>`;
  document.getElementById('fermer').onclick = () => { URL.revokeObjectURL(url); fermer(); };
  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    const b = document.getElementById('enregistrer');
    if (dl && b) { b.hidden = false; b.onclick = async () => {
      try { await dl.save({ filename: `apres-coup-${f.id}.png`, data: blob }); document.getElementById('carte-msg').textContent = 'Image enregistrée.'; }
      catch (e) { if (e && e.code !== 'declined') document.getElementById('carte-msg').textContent = 'L\'enregistrement n\'est pas disponible ici : utilise l\'appui long sur l\'image.'; }
    }; }
  } catch (e) {}
}

// ---------- Démarrage ----------
appliquerTheme();
enregistrer();
rendre();
if (synth) try { synth.onvoiceschanged = () => { if (onglet === 'reglages' && !lecture) rendreReglages(); }; } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !lecture) rendre(); });
brancherSync();
</script>
