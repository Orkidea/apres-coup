 renoncer à son intervention, et Ferenczi l'a présentée malgré tout. Un autre auteur, Bernard Pechberty, parle de la colère de Freud et d'un malentendu qu'il juge insurmontable entre les deux hommes.\n\nLe texte paraît en allemand en 1933 dans l'*Internationale Zeitschrift für Psychoanalyse* (19, p. 5-15). Sa traduction anglaise par Michael Balint n'apparaît qu'en 1949 dans l'*International Journal of Psycho-Analysis* (30, p. 225-230). Ferenczi meurt en 1933 : Evzonas décrit la communication comme son « chant du cygne ».\n\nIl s'agit d'un sujet douloureux, que je traite ici de façon sobre : le texte parle de l'abus sexuel d'enfants.\n\n## Deux langues\n\nLe cœur du texte est une distinction. Ferenczi décrit l'enfant comme étant, à ce stade de sa vie, dans le registre de la tendresse, ce qu'il appelle « le stade de l'amour d'objet passif ou de la tendresse ». L'adulte, lui, relève d'un autre registre, celui des passions. Quand les deux se rencontrent sans que l'adulte se tienne à sa place, « la conséquence doit nécessairement être celle d'une confusion de langues ».\n\nEmmanuel Fleury, qui commente le texte, donne un exemple d'une autre nature : la nurse, dans les familles puritaines, « confond tendresse et érotisme ». L'adulte entend une demande érotique là où l'enfant exprime une tendresse. Evzonas ajoute que les deux « langues » sont des métaphores : tendresse et passion, deux formes de communication.\n\n> **Exemple (une illustration très atténuée, pas un cas de Ferenczi).** Un enfant de six ans court montrer fièrement son dessin à un parent absorbé par une mauvaise nouvelle. Le parent répond sèchement, sans regarder. L'enfant a parlé la langue de la fierté et reçu celle de l'inquiétude d'un autre. Il ne comprend pas le décalage, et il conclut souvent que c'est son dessin, ou lui, qui est en cause. Le cas de Ferenczi est d'une tout autre gravité, mais il ressemble à cette structure : deux langues, et un enfant qui prend la réponse pour un jugement sur lui.\n\n## L'identification à l'agresseur\n\nComment l'enfant réagit-il ? Les commentateurs rapportent que Ferenczi parle de s'« identifier totalement à l'agresseur » (traduction portugaise citée par Mendes et França, p. 117). L'enfant se soumet, devine les désirs de l'adulte, s'y conforme, et finit par intérioriser la figure qui lui fait peur.\n\nPechberty rappelle que Ferenczi a repéré ce mécanisme avant qu'Anna Freud ne le reprenne en 1936, dans *Le Moi et les mécanismes de défense*, ce que confirme Wikipédia. Il ajoute que Ferenczi a inventé le terme d'« introjection ».\n\n## La culpabilité de l'adulte\n\nSelon Blum, qui présente le texte de 1933, l'enfant « introjecte, ou s'identifie à, la honte et à la culpabilité non dites des parents ». Fleury rapporte la même logique : l'enfant pense que « sa soumission et sa tendresse méritent punition ». Mendes et França citent la formule de Ferenczi qui résume cette situation : l'enfant se retrouve « à la fois innocent et coupable ».\n\n## Le clivage\n\nFerenczi parle d'un « clivage » de la personnalité de l'enfant, qu'il décrit aussi comme une fragmentation ou une atomisation (Fleury). Les auteurs brésiliens citent l'une de ses formules : il n'y a ni choc ni effroi sans un début de clivage de la personnalité (Mendes et França, p. 119, traduit du portugais). Blum décrit la même idée comme une scission entre le moi qui observe et réconforte, et le moi dissocié, traumatisé.\n\n## Le déni qui suit\n\nLe trauma ne se limite pas à l'acte. Blum rapporte que Ferenczi relevait chez les adultes « l'hypocrisie, les mensonges pathologiques, les dérobades et la collusion silencieuse », ainsi que « la conspiration du silence, la censure, le blâme de l'enfant, et l'auto-blâme de l'enfant ». Des commentateurs désignent sous le nom de *désaveu* (en portugais, *desmentido*) le refus du monde adulte de reconnaître et d'accueillir l'épisode (Figueiredo, 2003, cité par Mendes et França, p. 129). Ce que l'enfant subit s'aggrave de ce que personne ne le confirme.\n\n## Un texte discuté\n\nCette position a un coût théorique. Wikipédia note que la conviction de Ferenczi sur la réalité des abus sexuels de l'enfance fut l'une des raisons majeures de ses désaccords avec Freud. Fleury explique la différence : Freud parle d'agressions mises en scène, alors que Ferenczi tient le trauma sexuel pour le plus souvent réel.\n\nLe texte n'est pas pour autant à l'abri de la critique. Blum (1994) estime que Ferenczi n'a pas reconnu sa propre tendance au clivage, ni tenu compte de sa subjectivité, et il rattache le trauma qu'il décrit à la maladie de Ferenczi lui-même : une interprétation de l'auteur, qui n'est pas de Ferenczi. On peut donc lire ce texte comme une contribution majeure sur le trauma et comme un document de son époque et de son auteur.\n\nLes sources de cette fiche sont des commentaires et non le texte de Ferenczi lui-même : je n'ai pas pu en retrouver une version intégrale accessible. Les citations de Ferenczi passent par les études qui les rapportent.","quiz":[{"question":"Quelles sont les deux « langues » que distingue Ferenczi ?","choix":["Le hongrois de Ferenczi et l'allemand de Freud","La tendresse, côté enfant, et la passion, côté adulte","La langue du patient et celle de la théorie analytique","Le langage de la conscience et celui de l'inconscient"],"bonne":1,"explication":"Le titre complet parle du « langage de la tendresse et de la passion » : l'enfant se tient dans la tendresse, l'adulte dans la passion. Les autres oppositions ne sont pas celles du texte."},{"question":"Où et quand Ferenczi présente-t-il sa communication ?","choix":["Au douzième congrès international de psychanalyse, à Wiesbaden, en septembre 1932","Au seizième congrès international de psychanalyse, à Zurich, en juillet 1949","À la Société psychanalytique de Vienne, devant le cercle de Freud, en 1913","Au quatorzième congrès international de psychanalyse, à Marienbad, en août 1936"],"bonne":0,"explication":"La communication est présentée à Wiesbaden en septembre 1932. Zurich (1949) et Marienbad (1936) sont les congrès où Lacan a présenté le stade du miroir ; la Société de Vienne n'est pas le lieu de cette communication."},{"question":"Comment Freud a-t-il réagi, selon l'article d'Evzonas ?","choix":["Il a encouragé Ferenczi à présenter sa communication au congrès","Il n'a manifesté aucune réaction particulière","Il a été perturbé et lui a demandé de renoncer à son intervention","Il a repris le texte dans un article de 1936"],"bonne":2,"explication":"Selon Evzonas, Freud fut fortement perturbé par la conception du trauma de Ferenczi et lui demanda de renoncer ; Ferenczi la présenta malgré tout. C'est Anna Freud qui reprend en 1936 le concept d'identification à l'agresseur."},{"question":"Qu'entend-on par identification à l'agresseur dans ce texte ?","choix":["Le désir de l'enfant de se venger plus tard de l'adulte","L'admiration sincère de l'enfant pour l'adulte qui lui fait violence","La décision de l'enfant d'éviter l'adulte à l'avenir","La soumission de l'enfant, qui s'identifie totalement à celui qui l'effraie"],"bonne":3,"explication":"Ferenczi parle de s'identifier totalement à l'agresseur : l'enfant se soumet et intériorise la figure qui lui fait peur. Il ne s'agit ni de vengeance, ni d'admiration, ni d'une simple stratégie d'évitement."}],"sources":[{"texte":"E. Fleury, article sur la « Confusion de langues » de Ferenczi (Cairn)","url":"https://shs.cairn.info/article/SC_001_0037/pdf?lang=fr"},{"texte":"B. Pechberty, article sur Ferenczi, l'identification à l'agresseur et la réaction de Freud (pepsic)","url":"https://pepsic.bvsalud.org/pdf/estic/v24n2/fr_a04v24n2.pdf"},{"texte":"Evzonas, « Sándor Ferenczi's multiple confusions of tongues and their influence on psychoanalytical thinking » (titre original, publication, réaction de Freud)","url":"https://www.alsf-chile.org/Indepsi/Articulos/Trauma-Abuso/Sandor-Ferenczi-multiple-confusions.-of-tongues-and-their-psychoanalytical-thinking.pdf"},{"texte":"H. P. Blum, « The Confusion of Tongues and Psychic Trauma », Int. J. Psycho-Anal. 75 (1994), p. 871-882","url":"https://www.alsf-chile.org/Indepsi/Articulos/Trauma-Abuso/The-Confusion-of-Tongues-and-psychic-trauma.pdf"},{"texte":"A. P. N. Mendes et C. P. França, « Contribuições de Sándor Ferenczi… », Psicologia em Estudo 17 (1), 2012, p. 121-130","url":"https://www.redalyc.org/pdf/2871/287123554014.pdf"},{"texte":"Wikipédia (anglais), « Identification with the aggressor »","url":"https://en.wikipedia.org/wiki/Identification_with_the_aggressor"},{"texte":"Wikipédia (anglais), « Sándor Ferenczi »","url":"https://en.wikipedia.org/wiki/S%C3%A1ndor_Ferenczi"}]},{"id":"wittgenstein-taire","discipline":"philosophie","titre":"Ce dont on ne peut parler","figure":"Ludwig Wittgenstein","reference":"Tractatus logico-philosophicus, 5.6, 6.522, 6.54, 7 (1921 en allemand, 1922 en anglais)","accroche":"La dernière phrase du Tractatus est souvent lue comme un rappel à l'ordre. Wittgenstein y voyait plutôt l'essentiel : ce qui compte vraiment ne se dit pas.","punch":"Les limites de mon langage sont les limites de mon monde.","idee":"Le langage peut dire les faits du monde, et seulement eux. L'éthique, le sens de la vie, le mystique ne se disent pas : ils se montrent. Se taire n'est pas les nier, c'est refuser de les rabattre sur ce qui se dit.","citation":"Sur ce dont on ne peut parler, il faut garder le silence.","citation_source":"Wittgenstein, Tractatus logico-philosophicus, proposition 7 — traduit de l'allemand","citation_url":"https://en.wikipedia.org/wiki/Tractatus_Logico-Philosophicus","liens":["husserl-epoche","ferenczi-confusion","lacan-desir-de-l-autre"],"texte":"Le *Tractatus* est un livre court, composé de propositions numérotées, la plupart d'une ou deux lignes. Wittgenstein en a rédigé l'essentiel pendant la Première Guerre mondiale, où il servait comme soldat dans l'armée austro-hongroise, et l'a achevé en 1918. Il paraît en allemand en 1921, puis en édition bilingue anglaise en 1922. Wittgenstein pensait y avoir résolu, pour l'essentiel, les problèmes de la philosophie.\n\nLa dernière proposition, la septième, tient en une ligne.\n\n## Ce que le langage peut dire\n\nLe livre propose une théorie de la proposition comme *image*. Une proposition a un sens si elle représente un état de choses possible, en partageant avec lui une même forme logique. « Le chat est sur le tapis » est vraie ou fausse selon que le monde est ou non ainsi. Le langage sensé, c'est l'ensemble des propositions qui peuvent représenter des faits.\n\nD'où la proposition 5.6 : les limites de mon langage signifient les limites de mon monde. Ce qui ne peut pas être représenté n'est pas un fait du monde.\n\n> **Exemple.** « Il pleut à Paris » : je peux aller voir. « La tasse est à gauche de l'assiette » : je peux vérifier. Ces phrases ont un sens au sens du *Tractatus*, qu'elles soient vraies ou fausses. Mais « la vie vaut la peine d'être vécue » ? Aucune observation ne la confirmerait ni ne la réfuterait. Elle ne décrit aucun état du monde. Pour le *Tractatus*, elle n'est pas fausse : elle n'est pas, à proprement parler, une proposition.\n\n## Ce qui se montre\n\nQue faire, alors, de l'éthique, de l'esthétique, du sens de la vie ? Ces choses ne sont pas des faits. Wittgenstein ne conclut pas qu'elles n'existent pas. Il distingue *dire* et *montrer*. Il y a assurément de l'inexprimable, écrit-il ; il se montre, c'est le mystique (6.522).\n\nCe qui se montre ne peut pas être dit, mais il n'est pas rien. Le langage, en disant clairement ce qui peut se dire, signifie par contraste ce qui ne le peut pas.\n\n> **Exemple.** Une personne prend soin, pendant des années, d'un parent malade, sans jamais faire de discours sur le dévouement. Une autre écrit de beaux textes sur la bonté et n'en fait rien. Le sens éthique de la première vie se *montre* dans la manière dont elle est menée ; il ne gagnerait rien à être énoncé. C'est l'intuition que le *Tractatus* formule à sa façon.\n\n## L'échelle\n\nLe livre se retourne alors contre lui-même. Ses propres propositions ne représentent aucun fait : ce ne sont pas des descriptions du monde, mais des remarques sur la logique et le langage. Elles sont donc, à la lettre, dépourvues de sens.\n\nWittgenstein l'assume. Celui qui le comprend, dit la proposition 6.54, finit par reconnaître ces propositions comme dépourvues de sens, en s'en servant comme d'une échelle pour monter au-delà ; il doit, pour ainsi dire, jeter l'échelle après y être monté.\n\nLa septième proposition prend alors son poids. Il ne s'agit pas d'interdire de parler de l'important. Il s'agit de ne pas le dégrader en le traitant comme une thèse parmi d'autres.\n\nWittgenstein l'écrit à l'éditeur Ludwig von Ficker, à qui il proposait son manuscrit : son ouvrage se compose de deux parties, celle qui est présentée ici et tout ce qu'il n'a pas écrit ; et c'est précisément cette seconde partie qui est la plus importante.\n\n> **Exemple.** Après un deuil, des amis viennent avec des phrases toutes faites : « il est mieux là où il est », « le temps guérit tout ». Un autre ne dit presque rien, s'assoit, reste. On sent souvent que le second a mieux respecté ce qui se passait. Non pas parce que les mots sont mauvais, mais parce que certains moments ne se laissent pas transformer en énoncés sans être trahis.\n\n## Après le Tractatus\n\nWittgenstein se retire de la philosophie pendant des années, devient instituteur dans des villages autrichiens, puis revient à Cambridge en 1929. Le second Wittgenstein, celui des *Recherches philosophiques*, publiées après sa mort en 1953, critique de nombreuses idées du *Tractatus*. Il abandonne l'idée que le langage a une seule fonction, représenter, au profit des *jeux de langage* : le sens d'un mot, c'est son usage dans une forme de vie.\n\nEntre les deux périodes, une constante : la philosophie n'est pas une doctrine mais une activité de clarification. Elle n'ajoute rien au monde ; elle aide à ne plus se laisser ensorceler par le langage.\n\nIl est frappant que ce philosophe de la logique ait placé l'essentiel du côté du silence. Il y a là une parenté discrète avec toutes les pratiques qui savent que certaines choses ne se transmettent pas par des énoncés, mais par une présence, une forme, une manière d'écouter.","quiz":[{"question":"Selon la théorie du Tractatus, quand une proposition a-t-elle un sens ?","choix":["Quand elle exprime un sentiment sincère de celui qui parle","Quand elle est logiquement nécessaire et ne peut être fausse","Quand elle représente un état de choses possible, vrai ou faux selon le monde","Quand elle est acceptée par une communauté de locuteurs"],"bonne":2,"explication":"La proposition est une image d'un état de choses possible. La sincérité n'y joue aucun rôle ; les tautologies logiques sont justement dites vides de sens ; l'usage communautaire relève du second Wittgenstein."},{"question":"Que fait Wittgenstein de l'éthique et du sens de la vie ?","choix":["Ils ne peuvent se dire, mais ils se montrent","Il les déclare illusoires et sans valeur","Il en fait le sujet principal des propositions du livre","Il les réduit à des préférences psychologiques"],"bonne":0,"explication":"L'inexprimable existe et se montre : c'est le mystique. Wittgenstein ne le juge pas sans valeur, il le tient même pour l'essentiel. Il refuse justement d'en faire des thèses, et ne le réduit pas à la psychologie."},{"question":"Que signifie l'image de l'échelle à la fin du Tractatus ?","choix":["Qu'il faut lire le livre plusieurs fois pour le comprendre","Que les propositions du livre, dénuées de sens, se rejettent une fois comprises","Que la philosophie progresse par étapes vers la vérité absolue","Que la logique est supérieure à l'éthique dans l'ordre du savoir"],"bonne":1,"explication":"Les propositions du Tractatus ne représentent aucun fait : elles servent d'échelle qu'on rejette après y être monté. Il ne s'agit ni d'une méthode de lecture, ni d'un progrès vers l'absolu, ni d'une hiérarchie entre logique et éthique."},{"question":"Que dit Wittgenstein de son livre dans sa lettre à Ludwig von Ficker ?","choix":["Qu'il regrette de l'avoir publié trop vite","Qu'il est entièrement consacré à l'éthique","Qu'il ne contient que des erreurs de jeunesse","Que la partie non écrite est la plus importante"],"bonne":3,"explication":"Le livre se compose de ce qui est écrit et de tout ce qui ne l'est pas, et c'est cette seconde partie qui compte le plus. Wittgenstein ne regrette pas ici sa publication, le livre traite surtout de logique, et la critique de ses idées viendra plus tard."}],"sources":[{"texte":"Tractatus Logico-Philosophicus : rédaction, propositions principales, lettre à Ludwig von Ficker (Wikipédia)","url":"https://en.wikipedia.org/wiki/Tractatus_Logico-Philosophicus"},{"texte":"Wittgenstein, Tractatus Logico-Philosophicus, éd. bilingue allemand-anglais, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/5740"},{"texte":"Stanford Encyclopedia of Philosophy, « Ludwig Wittgenstein »","url":"https://plato.stanford.edu/entries/wittgenstein/"}]},{"id":"green-mere-morte","discipline":"psychanalyse","titre":"La mère morte","figure":"André Green","reference":"« La mère morte » (1980), dans Narcissisme de vie, narcissisme de mort, Minuit, 1983, p. 222-253","accroche":"Elle est là, elle nourrit, elle répond. Et pourtant elle est ailleurs. Green décrit ce que devient un enfant dont la mère est vivante, mais psychiquement absente.","punch":"La mère n'est pas morte. C'est sa présence psychique qui s'est éteinte.","idee":"Pour Green, la « mère morte » est une mère vivante mais plongée dans une absence dépressive, qui n'investit plus son enfant. L'enfant s'identifie à elle « en négatif », et en garde des défenses narcissiques et des difficultés d'attachement.","repere":"Le texte de Green date de 1980 : conférence à la Société psychanalytique de Paris le 20 mai 1980, puis chapitre de Narcissisme de vie, narcissisme de mort (Minuit, 1983). Sa traduction anglaise, « The Dead Mother », figure dans On Private Madness (Hogarth, 1986). Il ne s'agit pas d'une mère réellement décédée : le mot « morte » est une métaphore.","liens":["winnicott-mere-suffisamment-bonne","bion-reverie","freud-deuil-melancolie"],"texte":"André Green, psychanalyste français né au Caire en 1927 et mort à Paris en 2012, est membre de la Société psychanalytique de Paris à partir de 1965 et la préside de 1986 à 1989. En 1980, il y consacre une communication à une figure qu'il a rencontrée en clinique : la « mère morte ». Selon un article de la revue *Psychoanalysis* (HSE), le texte a d'abord été présenté en conférence à la Société psychanalytique de Paris le 20 mai 1980 ; il paraît en 1983 dans *Narcissisme de vie, narcissisme de mort* (Éditions de Minuit, p. 222-253, d'après la référence que donne Lindenmeyer).\n\nLe texte de Green lui-même ne m'est pas accessible en ligne. Ce que je rapporte ici passe donc par des commentateurs qui le citent, et je précise à chaque fois qui parle.\n\n## Une mère vivante, absente\n\nLe titre trompe volontairement. Il ne s'agit pas du deuil réel d'une mère. Cristina Lindenmeyer, dans un article de *Psychologie clinique et projective*, résume le « complexe de la mère morte » comme celui d'une mère physiquement présente mais plongée dans « une absence dépressive », qui la prive de la capacité d'investir psychiquement son enfant. Wikipédia le résume dans le même sens : une mère psychologiquement inaccessible, comme éteinte, peut-être après un deuil dans sa propre famille.\n\nTout tient au décalage entre ce que l'enfant voit et ce qu'il éprouve. La mère est là, elle accomplit les gestes. Mais l'enfant, qui l'avait connue vivante et attentive, perd son visage et son attention du jour au lendemain, sans comprendre pourquoi.\n\n> **Exemple (une illustration, pas un cas de Green).** Une enfant de quatre ans montre un dessin à sa mère, qui répond « c'est joli » sans lever les yeux. Le lendemain, c'est pareil, et la semaine suivante aussi. La mère prépare les repas, accompagne à l'école, rien ne manque matériellement. L'enfant, elle, ne sait pas que sa mère traverse une épreuve qu'elle ne dit pas. Elle ne voit qu'une chose : ce qui l'animait jusque-là ne produit plus d'effet. C'est ce vide, et pas un abandon réel, que le concept désigne.\n\n## Ce que fait l'enfant\n\nQue devient l'enfant ? Lindenmeyer rapporte que, pour Green, il construit une sorte de doublure protectrice, qui prend la forme d'une « identification en négatif » avec la mère morte. Cette identification détermine ensuite le destin de ses investissements, libidinaux, objectaux et narcissiques. L'enfant se met à l'unisson de l'absence plutôt que de lutter contre elle.\n\nUn article de *TAP Magazine* (Qiao, 2025) cite Green à propos du fantasme qui en résulte : il viserait « à nourrir la mère morte, à la maintenir perpétuellement embaumée ». Le même article parle d'un « fantasme vampirique inversé ». Je ne reprends pas ces images sans réserve : ce sont des mots de Green, que j'ai lus seulement par la médiation d'un autre.\n\n> **Exemple (une illustration).** Un adulte décrit son enfance en disant qu'il était « le petit garçon sage », qui ne demandait rien. Aujourd'hui, il se fait vite oublier dans les groupes, fait passer les autres avant lui, et ne comprend pas pourquoi il se sent à la fois irremplaçable et invisible. On pourrait y entendre une trace de cette identification à une absence, mais seule une analyse peut en décider ; l'exemple illustre la structure, pas un diagnostic.\n\n## Les défenses et leurs effets\n\nLes sources s'accordent sur quelques effets. Wikipédia, qui résume la littérature, parle d'un « noyau émotionnel dur et sans réponse » intériorisé par l'enfant, d'un narcissisme destructeur, de difficultés d'attachement, et d'une « résistance majeure au progrès dans le transfert » au cours d'une analyse. L'article de *TAP Magazine* évoque un sentiment d'abandon psychologique, ainsi que des défenses narcissiques.\n\nLindenmeyer rapporte aussi que Green décrit une destructivité mise au service de l'appareil psychique à des fins défensives, avec ce paradoxe que l'enfant « se sert de la destructivité contre la destructivité ». Et quand l'absence de l'objet devient une menace de disparition de soi, il peut se replier sur un mode auto-érotique, une forme de « narcissisme négatif ».\n\nUne lecture publiée sur Qeios (Proia-Lelouey, 2023) résume ainsi la situation : l'enfant reste prisonnier d'une mère morte psychiquement mais très présente, et connaît une triangulation œdipienne précoce et boiteuse. Cette formule est celle d'une commentatrice, non de Green.\n\n## Un voisinage avec d'autres fiches\n\nLe concept se tient dans un voisinage. Chez Winnicott, la mère « suffisamment bonne » est celle qui s'adapte à son enfant puis se désadapte progressivement : la mère morte est, en un sens, l'inverse, puisqu'elle n'est ni présente ni absente. Chez Bion, la rêverie suppose une mère capable de recevoir ce que le bébé projette ; ici, la projection rencontre une surface qui ne répond pas. Et chez Freud (*Deuil et mélancolie*), il est question d'un objet perdu auquel on reste attaché : le mot « deuil » vient de ce voisinage. Ces rapprochements sont les miens, et non ceux de Green ; je les propose comme repères de lecture.\n\n## Les limites de cette fiche\n\nCette fiche s'appuie sur des résumés et des commentaires, non sur le texte de 1980. Je n'ai donc pas pu vérifier certaines notions souvent associées à Green : le « deuil blanc », le « trou » laissé dans le psychisme, le désinvestissement (la décathexis) de l'objet maternel. Aucune des sources lues ne les rapporte pour ce texte : je ne les affirme pas. Pour les citer, il faudra reprendre le chapitre dans l'édition de Minuit.\n\nEnfin, le concept décrit une configuration clinique, repérée chez des patients adultes. Il ne dit pas que toute mère déprimée produit cet effet, ni qu'une mère est « responsable » : les sources que j'ai lues ne le disent pas, et je ne le dis pas à leur place.","quiz":[{"question":"Que désigne la « mère morte » chez André Green ?","choix":["Une mère décédée dans la petite enfance de son enfant","Une mère qui rejette activement son enfant et le punit","Une mère vivante, mais psychiquement absente et déprimée","Une mère trop présente, qui étouffe son enfant de soins"],"bonne":2,"explication":"Pour Lindenmeyer, il s'agit d'une mère physiquement présente mais dans « une absence dépressive », qui ne peut plus investir son enfant. Le mot « morte » est une métaphore, pas un décès réel."},{"question":"Quelle est la réaction de l'enfant décrite par Green, selon Lindenmeyer ?","choix":["Il se révolte ouvertement contre sa mère jusqu'à l'adolescence","Il s'identifie à elle « en négatif », comme une doublure protectrice","Il oublie sa mère et s'attache aussitôt à un autre adulte","Il réclame davantage de soins pour la réveiller"],"bonne":1,"explication":"Lindenmeyer rapporte une « identification en négatif » avec la mère morte, construite comme une doublure protectrice, qui oriente ensuite les investissements de l'enfant."},{"question":"Dans quel livre le texte « La mère morte » a-t-il été publié en 1983 ?","choix":["L'Interprétation des rêves","Au-delà du principe de plaisir","Le Travail du négatif","Narcissisme de vie, narcissisme de mort"],"bonne":3,"explication":"Le texte, écrit en 1980, figure aux pages 222-253 de Narcissisme de vie, narcissisme de mort (Minuit, 1983). Le Travail du négatif est un autre ouvrage de Green, paru en 1993."},{"question":"Que dit cette fiche de la notion de « deuil blanc » associée à Green ?","choix":["Que Green l'introduit dès la première page de 1980","Que les sources lues la décrivent précisément","Que c'est le titre d'un chapitre du même livre","Qu'aucune source lue ne la rapporte : elle n'est pas affirmée"],"bonne":3,"explication":"Les sources consultées ne confirment ni le deuil blanc, ni le trou, ni la décathexis pour ce texte. La fiche s'en tient à ce qui est rapporté."}],"sources":[{"texte":"A. Lindenmeyer, « Au risque d'un destin mélancolique de la perte chez un enfant adopté », Psychologie clinique et projective (2013), p. 151-166 (référence de Green, définition, identification en négatif)","url":"https://shs.cairn.info/revue-psychologie-clinique-et-projective-2013-1-page-151?lang=fr"},{"texte":"Wikipédia (anglais), « Dead mother complex »","url":"https://en.wikipedia.org/wiki/Dead_mother_complex"},{"texte":"Wikipédia (anglais), « André Green (psychoanalyst) » (biographie, SPP, Le Travail du négatif)","url":"https://en.wikipedia.org/wiki/Andr%C3%A9_Green_(psychoanalyst)"},{"texte":"Qiao, « The Shadow of the Dead Mother », TAP Magazine (2025)","url":"https://tapmagazine.org/all-articles/the-shadow-of-the-dead-mother"},{"texte":"Article de Psychoanalysis (HSE) sur la conférence du 20 mai 1980","url":"https://psychoanalysis-journal.hse.ru/article/download/11724/12535"},{"texte":"Proia-Lelouey (2023), lecture du concept, Qeios","url":"https://www.qeios.com/read/0O821D/pdf"}]},{"id":"nietzsche-ressentiment","discipline":"philosophie","titre":"Le ressentiment","figure":"Friedrich Nietzsche","reference":"Généalogie de la morale, première dissertation, § 10–13 (1887)","accroche":"« Bon » et « méchant » ne sont pas des évidences. Nietzsche fait la généalogie d'une valeur qui naît, dit-il, d'une vengeance qui n'a pas pu avoir lieu.","punch":"Le ressentiment ne peut pas agir. Alors il invente des valeurs.","idee":"La morale noble dit oui à elle-même et nomme ensuite « mauvais » ce qui ne lui ressemble pas. La morale du ressentiment commence par un non : elle désigne d'abord le « méchant », l'autre, puis se définit comme « bonne » par contraste. Une vengeance imaginaire devient créatrice de valeurs.","citation":"La révolte des esclaves dans la morale commence lorsque le ressentiment lui-même devient créateur et enfante des valeurs.","citation_source":"Nietzsche, Généalogie de la morale, I, § 10 (1887) — traduit de l'allemand","citation_url":"https://www.gutenberg.org/ebooks/52319","liens":["hegel-maitre-esclave","nietzsche-perspectivisme","spinoza-desir"],"texte":"La *Généalogie de la morale* paraît en 1887 avec un sous-titre qui annonce le ton : « écrit polémique ». Nietzsche n'y demande pas ce qui est bien ou mal. Il demande d'où viennent nos évaluations, quels besoins elles servent, et quelle valeur ont ces valeurs elles-mêmes.\n\nLa morale y devient un symptôme : un signe qu'il faut interpréter, comme un médecin interprète une fièvre.\n\n## Deux manières d'évaluer\n\nLa première dissertation oppose deux couples de mots.\n\n**Bon et mauvais** (*gut* et *schlecht*) : c'est l'évaluation noble. Les forts, les bien-portants, les puissants commencent par se dire oui à eux-mêmes. « Bon » désigne d'abord leur propre manière d'être, leur santé, leur fierté. « Mauvais » ne vient qu'après, comme un terme secondaire, pour désigner ce qui leur est étranger, presque avec une forme d'indifférence.\n\n**Bon et méchant** (*gut* et *böse*) : c'est l'évaluation née du ressentiment. Elle procède à l'inverse. Elle commence par concevoir « le méchant », c'est-à-dire l'autre, le fort, celui qui domine. Et c'est seulement ensuite, par contrecoup, qu'elle se pense elle-même comme « bonne » : bon, c'est celui qui n'est pas comme lui.\n\n## Une action détournée\n\nLe § 10 nomme le mécanisme. La révolte des esclaves dans la morale commence lorsque le ressentiment devient créateur et engendre des valeurs. C'est le ressentiment d'êtres à qui la vraie réaction, celle de l'action, est interdite, et qui ne se dédommagent que par une vengeance imaginaire.\n\nAlors que la morale noble naît d'un oui triomphant à soi-même, la morale du ressentiment dit d'emblée non à ce qui est extérieur, autre, différent. Et ce non est son acte créateur. Elle a besoin d'un monde hostile pour exister : son action est fondamentalement une réaction.\n\n> **Exemple.** Un employé humilié par son chef ne peut ni répondre ni partir. Le soir, il se raconte une autre histoire : ce chef est arrogant, vulgaire, obsédé par l'argent, alors que lui est modeste, honnête, désintéressé. Peut-être est-ce vrai en partie. Mais remarquez l'ordre : il a d'abord défini l'autre comme mauvais, et c'est à partir de là qu'il s'est trouvé bon. Sa vertu est née de son impuissance. C'est la structure que Nietzsche décrit, à l'échelle d'une civilisation.\n\n## L'agneau et l'oiseau de proie\n\nLe § 13 contient une fable célèbre. Que les agneaux en veuillent aux grands oiseaux de proie, rien d'étonnant. Mais ils en tirent un raisonnement moral : ces oiseaux sont méchants ; donc celui qui leur ressemble le moins, l'agneau, est bon.\n\nLe coup décisif est l'invention d'un *sujet* séparé de ce qu'il fait. On pourrait exiger de la force qu'elle ne se manifeste pas comme force, comme si l'oiseau de proie était un agent neutre, libre d'être agneau s'il le voulait. Or, dit Nietzsche, il n'y a pas d'« être » derrière le faire, l'agir, le devenir. L'action est tout.\n\nLa croyance en un sujet libre qui pourrait choisir d'être faible permet alors de transformer la faiblesse en mérite. L'agneau ne se dit plus « je ne peux pas » ; il se dit « je ne veux pas, parce que je suis bon ».\n\n> **Exemple.** « Moi, je ne pourrais jamais écraser les autres pour réussir. » La phrase peut exprimer une vraie valeur. Elle peut aussi transformer en choix moral ce qui était d'abord une incapacité, ou une peur. Nietzsche ne dit pas qu'elle est toujours hypocrite. Il invite à se demander, chaque fois, laquelle des deux voix parle.\n\n## Contre deux contresens\n\n**Ce n'est pas un appel à la cruauté.** Nietzsche ne recommande pas de redevenir des oiseaux de proie. Il juge d'ailleurs que c'est sur le terrain de cette morale sacerdotale que l'homme est devenu un animal intéressant, qu'il a acquis de la profondeur. La généalogie est un diagnostic, pas un programme de retour en arrière.\n\n**Ce n'est pas une description historique au sens strict.** La généalogie est une méthode d'interprétation : elle lit les valeurs à partir des types de vie qu'elles expriment. Sa question n'est pas « est-ce vrai ? », mais « quel type d'homme a besoin de croire cela ? ».\n\n> **Exemple, pour soi.** Il arrive qu'un jugement moral nous procure un soulagement un peu trop vif : l'indignation contre quelqu'un qui réussit, le plaisir de le voir échouer, la satisfaction d'être « du bon côté ». Nietzsche propose de prendre ce plaisir lui-même comme un indice. Qu'est-ce qu'il me permet de ne pas sentir ? Quelle impuissance vient-il réparer ?\n\n## Pourquoi lire ce texte aujourd'hui\n\nOn peut contester l'histoire que raconte Nietzsche, et beaucoup l'ont fait. Mais la structure qu'il dégage reste un outil d'une grande finesse : une valeur peut être l'expression d'une blessure plutôt que d'une conviction, et le non adressé à l'autre peut être la manière dont un sujet se fabrique une identité. La psychologie et la psychanalyse retrouveront, avec d'autres mots, cette idée que nos jugements portent la marque de ce qui nous manque.","quiz":[{"question":"Comment procède l'évaluation noble selon Nietzsche ?","choix":["Elle commence par un oui à soi-même ; « mauvais » ne vient qu'ensuite","Elle commence par désigner l'ennemi comme méchant, puis se dit bonne","Elle reçoit ses valeurs d'une révélation divine transmise par les prêtres","Elle s'appuie sur un calcul d'utilité sociale, l'utile étant le bon"],"bonne":0,"explication":"La morale noble affirme d'abord sa propre manière d'être ; « mauvais » est un terme secondaire. Désigner d'abord l'ennemi comme méchant caractérise au contraire la morale du ressentiment. Nietzsche critique précisément l'explication utilitariste de l'origine du « bon »."},{"question":"Que signifie que le ressentiment devient « créateur » ?","choix":["Qu'il produit des œuvres d'art remarquables","Qu'il pousse à l'action violente et immédiate","Que, privé d'action réelle, il se venge en inventant des valeurs","Qu'il permet de fonder des institutions politiques stables"],"bonne":2,"explication":"Le ressentiment est le fait d'êtres à qui la réaction par l'action est interdite : ils se dédommagent par une vengeance imaginaire qui crée des valeurs. Il ne s'agit pas d'art, il est justement privé d'action, et Nietzsche ne parle pas ici d'institutions."},{"question":"Quel est le rôle du « sujet » dans la fable de l'agneau et de l'oiseau de proie ?","choix":["Il prouve que l'agneau est réellement plus vertueux que l'oiseau","Il sépare l'agir de l'agent, pour exiger de la force qu'elle ne se manifeste pas","Il montre que les oiseaux de proie ont une conscience morale","Il démontre l'existence du libre arbitre chez tous les vivants"],"bonne":1,"explication":"La fiction d'un sujet neutre derrière l'action permet d'imputer la force comme une faute et la faiblesse comme un mérite. Nietzsche nie qu'il y ait un « être » derrière le faire : loin de démontrer le libre arbitre, il le traite comme une interprétation intéressée."},{"question":"Quelle question la généalogie pose-t-elle à une valeur ?","choix":["Cette valeur est-elle conforme à la raison universelle ?","Cette valeur a-t-elle été votée par une majorité ?","Cette valeur est-elle plus ancienne que les autres ?","Quel type de vie a besoin de croire à cette valeur ?"],"bonne":3,"explication":"La généalogie lit les valeurs comme les symptômes d'un type de vie, ascendant ou déclinant. Elle ne cherche ni une validation rationnelle, ni un consensus, et l'ancienneté d'une valeur ne prouve rien à ses yeux."}],"sources":[{"texte":"Nietzsche, The Genealogy of Morals, trad. Horace B. Samuel, Project Gutenberg","url":"https://www.gutenberg.org/ebooks/52319"},{"texte":"Stanford Encyclopedia of Philosophy, « Nietzsche's Moral and Political Philosophy »","url":"https://plato.stanford.edu/entries/nietzsche-moral-political/"},{"texte":"Major Prépa, Nietzsche et les jugements moraux","url":"https://major-prepa.com/culture-generale/jugements-moraux-nietzsche/"}]},{"id":"lacan-ne-pas-ceder","discipline":"psychanalyse","titre":"Ne pas céder sur son désir","figure":"Jacques Lacan","reference":"Le Séminaire, livre VII. L'éthique de la psychanalyse (1959-1960), éd. J.-A. Miller, Seuil, 1986","accroche":"La phrase ressemble à un slogan de développement personnel. C'est presque l'inverse : une éthique qui se mesure à Antigone, et qui ne promet aucun bonheur.","punch":"Une seule faute, au regard de l'analyse : avoir cédé sur son désir.","idee":"L'éthique de la psychanalyse n'est pas une morale du bien ni du bonheur. Elle pose une question : avez-vous agi conformément au désir qui vous habite ? Céder sur son désir est la seule faute qu'elle reconnaît. Antigone, qui ne cède pas, en est la figure tragique.","citation":"the only thing of which one can be guilty is of having given ground relative to one's desire","citation_source":"Lacan, Le Séminaire, livre VII (1959-1960), trad. anglaise D. Porter (1992), telle que citée sur nosubject.com — en français : « la seule chose dont on puisse être coupable, c'est d'avoir cédé sur son désir » (ma traduction)","citation_url":"https://nosubject.com/Seminar_VII","liens":["lacan-desir-de-l-autre","spinoza-desir","kant-lumieres"],"texte":"Le Séminaire VII, tenu en 1959-1960 et publié par Jacques-Alain Miller aux éditions du Seuil en 1986, porte sur l'éthique. L'*Encyclopédie de philosophie de Stanford* y voit un tournant dans l'œuvre de Lacan : il y est question de Kant, de la figure de la mère comme Autre réel et de *das Ding*, « la Chose ».\n\nLa maxime qu'on en retient, « ne pas céder sur son désir », est devenue une sorte de formule de la psychanalyse lacanienne. Les commentateurs la présentent comme une maxime, c'est-à-dire comme un condensé de la position du séminaire plutôt que comme une phrase isolée de Lacan : Thatyana Pitavy l'écrit ainsi, « Ne pas céder sur son désir, telle est la maxime ». Ce que dit Lacan lui-même est un peu différent, et plus intéressant.\n\n## La question de l'éthique\n\nLa synthèse de nosubject.com résume l'argument du séminaire en deux temps. D'abord, la morale traditionnelle : l'éthique de la tradition, celle d'Aristote, de Kant et d'autres moralistes, s'organise autour de ce que Lacan appelle le « service des biens », qui place le travail et l'ordre avant le désir (Séminaire VII, p. 314 de l'édition Porter). Ensuite, l'éthique analytique : elle se ramène à une question, « Avez-vous agi conformément au désir qui vous habite ? » (même page).\n\nCe déplacement est important. L'éthique de la psychanalyse ne demande pas si l'acte était bon, ni utile, ni conforme à la loi. Elle demande si le sujet a trahi quelque chose en lui.\n\n> **Exemple (une illustration, pas un cas de Lacan).** Quelqu'un renonce, à vingt-cinq ans, à un projet qui comptait pour lui, parce qu'il faut un revenu stable, une place, de la sécurité. Chaque raison est raisonnable, et personne ne lui en voudrait. Quinze ans plus tard, une insatisfaction diffuse le suit partout, qu'il ne parvient pas à expliquer. La maxime ne dit pas qu'il aurait dû tout abandonner pour son projet. Elle dit que la question mérite d'être posée : y a-t-il là quelque chose auquel il a cédé ?\n\n## La seule faute\n\nLacan énonce la formule dans une version qui est à la fois très simple et très dure. Dans la traduction anglaise de Dennis Porter, que cite nosubject.com, elle se lit ainsi : « the only thing of which one can be guilty is of having given ground relative to one's desire ». La seule chose dont on puisse être coupable est d'avoir cédé sur son désir.\n\nElle déplace le sens de la culpabilité. La page résume l'argument en disant que le sentiment de culpabilité se rattache à l'idée d'avoir « cédé » sur son désir. Elle ne dit pas qu'il faille s'abandonner à toutes ses envies ; elle dit où se loge, selon Lacan, la faute qui compte.\n\n## Antigone\n\nPour donner un visage à cette position, Lacan prend la tragédie de Sophocle. La synthèse de nosubject.com note qu'Antigone y est la figure de celle qui ne « cède » pas, « même au prix de sa vie ». Elle se situe dans ce que Lacan appelle l'*entre-deux-morts*, un espace entre la mort biologique et la mort symbolique. Et la tragédie, ajoute la même page, est traitée « non comme une leçon morale mais comme un lieu privilégié » où la question du désir apparaît.\n\nCet exemple empêche de lire la maxime comme un encouragement. Antigone ne finit pas heureuse. La fidélité à son désir la mène à la mort. La position qu'elle tient a un prix, et Lacan ne la recommande pas à tout le monde : il en fait un point de repère pour penser l'éthique.\n\n## La Chose et la sublimation\n\nLe séminaire donne à ce désir un horizon. Selon la page de nosubject.com, *das Ding* est « un objet primordial, perdu », qui reste en dehors de la symbolisation. Lacan y redéfinit aussi la sublimation comme « l'élévation d'un objet à la dignité de la Chose ».\n## Ce que la maxime ne dit pas\n\nPlusieurs commentateurs rappellent que le désir dont il s'agit ne se confond pas avec l'envie. Pitavy parle d'un « désir averti », c'est-à-dire d'un désir qu'une analyse a permis de reconnaître, et pas d'un caprice immédiat. Dans une conférence de 2020, Pierre Bruno glose aussi la maxime : ne pas céder sur son désir, c'est ne pas se détourner de l'*atè*. Ces lectures sont celles de commentateurs, et non des citations du séminaire.\n\nIl faut enfin rappeler un point de méthode. Je n'ai pas pu retrouver dans une source accessible le texte français de la leçon, ni la page exacte de l'édition du Seuil. La phrase est donnée ici en anglais, d'après une traduction citée par un site spécialisé. Pour la citer ailleurs, il faudra la reprendre dans l'édition imprimée.","quiz":[{"question":"Comment la synthèse du séminaire résume-t-elle l'éthique analytique ?","choix":["Par la question « Avez-vous fait le bien autour de vous ? »","Par la question « Avez-vous agi conformément au désir qui vous habite ? »","Par la question « Avez-vous obéi aux lois de votre cité ? »","Par la question « Avez-vous cherché le plus grand bonheur ? »"],"bonne":1,"explication":"La page résume l'éthique analytique par la question : « Avez-vous agi conformément au désir qui vous habite ? » Elle s'oppose à la morale traditionnelle du « service des biens », qui met l'ordre et le travail avant le désir."},{"question":"Qu'est-ce que Lacan appelle le « service des biens » ?","choix":["Le fait d'offrir des cadeaux à ses proches pour s'en faire aimer","Le paiement des séances par le patient, qui engage la cure","La charité envers les plus pauvres, prônée par l'Église","L'éthique traditionnelle, qui place le travail et l'ordre avant le désir"],"bonne":3,"explication":"La synthèse décrit le « service des biens » comme l'organisation de la morale traditionnelle (Aristote, Kant et d'autres), où le travail et l'ordre passent avant le désir. Ce n'est ni la charité, ni un paiement, ni des cadeaux."},{"question":"Quel rôle joue Antigone dans le séminaire ?","choix":["Elle figure celle qui ne cède pas, même au prix de sa vie","Elle représente la soumission aux lois de la cité","Elle est un modèle de bonheur que l'analyste doit proposer","Elle illustre une folie dont la cure doit guérir"],"bonne":0,"explication":"Antigone ne « cède » pas, même au prix de sa vie. Elle se tient entre la mort biologique et la mort symbolique : son sort est tragique, loin de tout bonheur promis."},{"question":"Que n'est pas « ne pas céder sur son désir », d'après les commentateurs cités ?","choix":["Une façon de se demander si l'on a trahi quelque chose en soi","Un point de repère pour penser l'éthique sans promettre le bonheur","Une position qui peut avoir un prix très élevé","Un encouragement à satisfaire toutes ses envies immédiates"],"bonne":3,"explication":"Pitavy parle d'un désir « averti » : il ne s'agit pas d'un caprice. Les trois autres propositions sont conformes au séminaire tel que le résument les sources : l'éthique du désir interroge, ne promet pas le bonheur, et peut coûter cher."}],"sources":[{"texte":"Nosubject.com, « Seminar VII » (maxime, Antigone, entre-deux-morts, das Ding, sublimation ; trad. Porter)","url":"https://nosubject.com/Seminar_VII"},{"texte":"Nosubject.com, « Ethics » (service des biens, question de l'éthique analytique)","url":"https://nosubject.com/Ethics"},{"texte":"Stanford Encyclopedia of Philosophy, « Jacques Lacan » (Séminaire VII, 1959-1960, éd. Miller, 1986)","url":"https://plato.stanford.edu/entries/lacan/"},{"texte":"Thatyana Pitavy, texte de séminaire sur « Ne pas céder sur son désir » (freud-lacan.com)","url":"https://freud-lacan.com/wp-content/themes/freudlacan-front/assets/content/2024/02/FINAL-L-16-TXT-ACCORD-T.-PITAVY-05_05_2020.pdf"},{"texte":"Pierre Bruno, conférence de séminaire d'été (29 août 2020) sur l'éthique de la psychanalyse (freud-lacan.com)","url":"https://freud-lacan.com/wp-content/themes/freudlacan-front/assets/content/2024/02/20240216162119-22940-2.pdf"}]},{"id":"ricoeur-soupcon","discipline":"philosophie","titre":"Les maîtres du soupçon","figure":"Paul Ricœur","reference":"De l'interprétation. Essai sur Sigmund Freud, livre I (1965)","accroche":"Marx, Nietzsche, Freud : trois pensées que tout oppose. Ricœur montre qu'elles font le même geste, et qu'il ne suffit pas de démasquer pour comprendre.","punch":"Après Marx, Nietzsche et Freud, la conscience n'est plus crue sur parole.","idee":"Ricœur distingue deux façons d'interpréter. L'une recueille un sens qui s'adresse à nous ; l'autre soupçonne et tient le sens apparent pour un déguisement. Marx, Nietzsche et Freud ont fait du doute sur la conscience une méthode. Mais le soupçon n'est qu'un moment de l'interprétation.","repere":"Herméneutique : art de l'interprétation, d'abord des textes sacrés et juridiques, puis, avec Schleiermacher et Dilthey au XIXe siècle, de toute expression humaine. Ricœur en fait le lieu où se croisent philosophie et psychanalyse.","liens":["nietzsche-perspectivisme","freud-moi-pas-maitre","descartes-malin-genie"],"texte":"En 1965, Paul Ricœur publie un livre de plus de cinq cents pages sur Freud, *De l'interprétation*. L'ouvrage est né de conférences données à l'université Yale en 1961, les Terry Lectures, puis à Louvain en 1962. Il deviendra l'une des lectures philosophiques les plus rigoureuses de Freud, et l'un de ses chapitres a donné une formule à tout un siècle : les « maîtres du soupçon ».\n\n## Deux manières d'interpréter\n\nRicœur part d'un constat : il n'existe pas une herméneutique générale, une seule bonne manière d'interpréter. Il y a deux pôles opposés, qui se disputent le terrain.\n\n**L'interprétation comme recueil du sens.** Elle aborde un texte, un symbole, un mythe avec une forme de confiance : quelque chose s'y dit, qui nous concerne et nous est adressé. Interpréter, c'est écouter, restaurer un sens. C'est l'attitude de la phénoménologie de la religion, qui décrit le sacré sans le réduire.\n\n**L'interprétation comme exercice du soupçon.** Elle part du principe inverse : le sens apparent est un masque, une ruse. Il faut démystifier, réduire les illusions, remonter du sens manifeste à un sens caché qui le produit.\n\n> **Exemple.** Une personne dit qu'elle donne chaque mois à une association « par pure générosité ». Une lecture de recueil prend la phrase au sérieux : il y a là un geste de solidarité, qui a un sens pour elle. Une lecture de soupçon cherche ce que la générosité recouvre : un avantage fiscal (lecture marxiste), un besoin de se sentir supérieur (lecture nietzschéenne), une culpabilité à apaiser (lecture freudienne). Ricœur ne demande pas de choisir une fois pour toutes ; il demande de comprendre ce que fait chaque lecture.\n\n## Trois maîtres\n\nLe second pôle est dominé, dit Ricœur, par trois maîtres qui semblent s'exclure les uns les autres : Marx, Nietzsche et Freud. Ce qui les réunit malgré tout, c'est d'avoir fait de la conscience elle-même un objet de doute.\n\nDescartes doutait des choses, mais pas de la conscience : ce qu'elle se représentait pouvait être faux, mais que la conscience soit telle qu'elle s'apparaît à elle-même, cela restait certain. Avec les trois maîtres, le doute atteint la conscience. Le sens tel que la conscience le saisit devient un effet, produit par autre chose : l'intérêt de classe et l'idéologie chez Marx, la volonté de puissance chez Nietzsche, le désir inconscient chez Freud.\n\n> **Exemple.** « Je ne me suis pas présenté à ce poste parce qu'il ne m'intéressait pas vraiment. » Pour Descartes, si je le pense, c'est ce que je pense. Pour les maîtres du soupçon, la phrase est peut-être le produit d'autre chose : une peur de l'échec, une loyauté envers un milieu d'origine, un ressentiment déguisé en indifférence. La conscience n'est plus le dernier juge de ses propres raisons.\n\n## Démasquer pour comprendre\n\nLe point décisif est souvent oublié. Pour Ricœur, ces trois penseurs ne sont pas des destructeurs, mais les créateurs d'une nouvelle manière d'interpréter. Ils ne se contentent pas de dénoncer : ils inventent un art de déchiffrer, avec ses règles. Ce sont des exégètes du sens, pas des sceptiques qui jettent le sens par la fenêtre.\n\nEt le soupçon n'est pas le dernier mot. Ricœur propose une dialectique : il faut traverser la démystification, renoncer aux idoles, pour pouvoir ensuite écouter autrement. Le soupçon purifie l'écoute ; il ne la remplace pas.\n\n> **Exemple.** Un rêve d'ascension, une montagne gravie avec joie. Le soupçon y lira peut-être un désir de supériorité ou un fantasme infantile de toute-puissance, et il aura peut-être raison. Mais une fois cette lecture faite, il reste la question de ce que ce rêve ouvre pour le rêveur : un projet, un élan, un sens à venir. Ricœur tient aux deux temps.\n\n## Archéologie et téléologie\n\nAppliquée à Freud, cette dialectique donne une thèse forte. La psychanalyse est une *archéologie* du sujet : elle ramène le sens vers l'arrière, vers le désir, l'enfance, ce qui précède la conscience. Il lui faut une contrepartie, une *téléologie*, que Ricœur cherche du côté de Hegel : un mouvement vers l'avant, vers les figures de l'esprit que le sujet n'a pas encore atteintes.\n\n## Une réception orageuse\n\nLe livre est mal reçu dans les milieux lacaniens. Le psychanalyste Jean-Paul Valabrega, dans la revue *Critique*, accuse Ricœur d'avoir emprunté à Lacan sans le dire ; Michel Tort, dans *Les Temps modernes*, en fait une critique sévère au nom de la lecture lacanienne. Ces accusations de plagiat ont été depuis largement contestées.\n\nOn peut discuter la symétrie entre archéologie et téléologie. Elle a le mérite de poser une question que tout clinicien connaît : interpréter, est-ce seulement défaire une illusion, ou aussi rendre possible un sens qui n'existait pas encore ?","quiz":[{"question":"Quelles sont les deux manières d'interpréter que distingue Ricœur ?","choix":["Celle des textes sacrés et celle des textes profanes","Le recueil du sens et l'exercice du soupçon","L'herméneutique juridique et l'herméneutique littéraire","L'herméneutique rationaliste et l'herméneutique empiriste"],"bonne":1,"explication":"Ricœur oppose une interprétation qui écoute un sens qui nous est adressé et une interprétation qui le démasque. Les autres oppositions désignent des domaines ou des écoles, pas ces deux attitudes fondamentales."},{"question":"Qu'est-ce qui rapproche Marx, Nietzsche et Freud selon Ricœur ?","choix":["Une même théorie de l'économie","Une même hostilité à la religion chrétienne","Le fait de soumettre la conscience elle-même au doute","Une même conception de l'inconscient"],"bonne":2,"explication":"Contrairement à Descartes, qui doutait des choses mais pas de la conscience, les trois maîtres font de la conscience un objet de soupçon. Leurs théories sont par ailleurs très différentes, ce que Ricœur souligne en les disant en apparence exclusives."},{"question":"D'où vient le livre De l'interprétation ?","choix":["D'une thèse de doctorat soutenue à la Sorbonne","D'un séminaire suivi auprès de Jacques Lacan","De conférences données à Yale en 1961, puis à Louvain","D'une commande de la Société psychanalytique de Paris"],"bonne":2,"explication":"L'ouvrage est issu des Terry Lectures prononcées à Yale en 1961, puis de conférences à Louvain en 1962. Il n'est ni une thèse, ni un compte rendu du séminaire de Lacan, ni une commande d'une société psychanalytique."},{"question":"Quel est le statut du soupçon dans la démarche de Ricœur ?","choix":["C'est le dernier mot de toute interprétation véritable","C'est une erreur de méthode dont il faut se garder","C'est une méthode réservée aux sciences sociales","C'est un moment nécessaire, à traverser pour pouvoir écouter autrement"],"bonne":3,"explication":"Ricœur propose une dialectique : le soupçon doit être traversé pour accéder à une écoute renouvelée. Il n'en fait ni le terme ultime, ni une erreur, ni une méthode cantonnée à une discipline."}],"sources":[{"texte":"Freud and Philosophy (De l'interprétation) : genèse, thèses et réception (Wikipédia)","url":"https://en.wikipedia.org/wiki/Freud_and_Philosophy"},{"texte":"« Marx, Nietzsche, Freud: Masters of Suspicion », université de Pennsylvanie","url":"https://web.sas.upenn.edu/psys/?p=790"},{"texte":"Stanford Encyclopedia of Philosophy, « Paul Ricoeur »","url":"https://plato.stanford.edu/entries/ricoeur/"}]}];

const decaler = (j, n) => { const [y, m, d] = j.split('-').map(Number); return jourDe(new Date(y, m - 1, d + n)); };

function etatVide() {
  return { debut: aujourdhui(), lues: {}, quiz: {}, notes: {}, reglages: { rythme: 'alterne', acces: 'jour', theme: 'auto', voix: '', vitesse: 1 }, reglagesLe: 0 };

etat.reglages = Object.assign(etatVide().reglages, etat.reglages);

function fusionner(a, b) {
  const r = etatVide();
  r.debut = [a.debut, b.debut].filter(Boolean).sort()[0] || aujourdhui();
  r.lues = { ...b.lues };
  for (const [id, j] of Object.entries(a.lues || {})) if (!r.lues[id] || j < r.lues[id]) r.lues[id] = j;
  r.quiz = { ...(b.quiz || {}) };
  for (const [id, rep] of Object.entries(a.quiz || {})) {
    const autre = r.quiz[id] || [];
    r.quiz[id] = (rep || []).map((v, i) => v ?? autre[i] ?? null);
    for (let i = (rep || []).length; i < autre.length; i++) r.quiz[id][i] = autre[i];
  }
  r.notes = { ...(b.notes || {}) };
  for (const [id, n] of Object.entries(a.notes || {})) if (!r.notes[id] || (n.le || 0) > (r.notes[id].le || 0)) r.notes[id] = n;
  const plusRecent = (a.reglagesLe || 0) >= (b.reglagesLe || 0) ? a : b;
  r.reglages = Object.assign(etatVide().reglages, plusRecent.reglages);
  r.reglagesLe = plusRecent.reglagesLe || 0;
  return r;
}

function suite() {
  const r = etat.reglages.rythme;
  return r === 'alterne' ? FICHES : FICHES.filter(f => f.discipline === r);
}
function indexDuJour() { return Math.max(0, ecart(etat.debut, aujourdhui())); }
function ficheDuJour() { const s = suite(); return s[indexDuJour() % s.length]; }
function numeroDe(id) { const i = suite().findIndex(f => f.id === id); return i < 0 ? null : i + 1; }
function ouvertes() {
  const s = suite();
  if (etat.reglages.acces === 'tout') return new Set(FICHES.map(f => f.id));
  const n = Math.min(s.length, indexDuJour() + 1);
  const ids = new Set(s.slice(0, n).map(f => f.id));
  for (const id of Object.keys(etat.lues)) ids.add(id);
  return ids;
}
function serie() {
  const jours = new Set(Object.values(etat.lues));
  let n = 0, j = aujourdhui();
  if (!jours.has(j)) j = decaler(j, -1);
  while (jours.has(j)) { n++; j = decaler(j, -1); }
  const tri = [...jours].sort();
  let record = 0, cur = 0, prec = null;
  for (const d of tri) { cur = prec && ecart(prec, d) === 1 ? cur + 1 : 1; record = Math.max(record, cur); prec = d; }
  return { n, record };
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enLigne = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
function markdown(txt) {
  return txt.split(/\n{2,}/).map(bloc => {
    if (bloc.startsWith('## ')) return `<h2>${enLigne(bloc.slice(3))}</h2>`;
    const lignes = bloc.split('\n');
    if (lignes.every(l => l.startsWith('>'))) {
      const paras = lignes.map(l => l.replace(/^> ?/, '')).join('\n').split(/\n(?=\S)/).filter(t => t.trim());
      return `<aside class="exemple">${paras.map(t => `<p>${enLigne(t)}</p>`).join('')}</aside>`;
    }
    if (lignes.every(l => l.startsWith('- '))) return `<ul>${lignes.map(l => `<li>${enLigne(l.slice(2))}</li>`).join('')}</ul>`;
    return `<p>${enLigne(lignes.join(' '))}</p>`;
  }).join('');
}
const texteBrut = s => s.replace(/^## /gm, '').replace(/\*\*?/g, '').replace(/^- /gm, '').replace(/^> ?/gm, '');
function hache(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function melange(n, graine) {
  const ordre = [...Array(n).keys()]; let x = graine || 1;
  for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [ordre[i], ordre[j]] = [ordre[j], ordre[i]]; }
  return ordre;
}

        <span class="compte" id="compte">--:--:--</span>
        <p>Demain : <span class="disc ${demain.discipline}">${NOM_DISC[demain.discipline]}</span></p>
      </div>` : ''}
    </article>
    ${rappel ? rendreRappel(rappel) : ''}
  </section>`;
  document.getElementById('lire').onclick = () => ouvrir(f.id);
  if (rappel) brancherRappel(rappel);
  if (lu) { const maj = () => { const el = document.getElementById('compte'); if (!el) return clearInterval(minuterieCompte); const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const t = Math.max(0, Math.floor((m - n) / 1000)); el.textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; if (t === 0) rendre(); }; maj(); minuterieCompte = setInterval(maj, 1000); }
}
function choisirRappel(saufId) {
  const lues = Object.keys(etat.lues).filter(id => id !== saufId && PAR_ID[id]);
  if (!lues.length) return null;
  const g = hache(aujourdhui());
  const f = PAR_ID[lues[g % lues.length]];
  return { f, qi: (g >>> 3) % f.quiz.length };
}
function rendreRappel({ f, qi }) {
  const q = f.quiz[qi], ordre = melange(q.choix.length, hache(f.id + qi));
  return `<section class="rappel" style="${inkVars(f.discipline)}">
    <span class="etiquette">Rappel · ${esc(f.titre)}</span>
    <h2>${esc(q.question)}</h2>
    <div class="choix" id="rappel-choix">${ordre.map(i => `<button data-i="${i}">${esc(q.choix[i])}</button>`).join('')}</div>
    <p class="explication" id="rappel-expl" hidden></p>
  </section>`;
}
function brancherRappel({ f, qi }) {
  const q = f.quiz[qi], zone = document.getElementById('rappel-choix');
  zone.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    marquerChoix(zone, q.bonne, Number(b.dataset.i));
    const ex = document.getElementById('rappel-expl'); ex.hidden = false;
    ex.innerHTML = `<strong>${Number(b.dataset.i) === q.bonne ? 'Retenu.' : 'Pas tout à fait.'}</strong> ${esc(q.explication)}`;
  };
}
function marquerChoix(zone, bonne, choisi) {
  for (const b of zone.querySelectorAll('button')) {
    const i = Number(b.dataset.i); b.disabled = true;
    if (i === bonne) b.classList.add('juste'); else if (i === choisi) b.classList.add('faux'); else b.classList.add('barre');
  }
}

// ---------- Bibliothèque ----------
function rendreBiblio() {
  const ouv = ouvertes(), s = suite();
  const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const q = norm(requete.trim());
  const visibles = s.filter(f => ouv.has(f.id)).filter(f => filtre === 'tout' || f.discipline === filtre)
    .filter(f => !q || norm(`${f.titre} ${f.figure} ${f.reference} ${f.texte}`).includes(q));
  const restantes = s.filter(f => !ouv.has(f.id)).length;
  $vue.innerHTML = `
  <section class="vue">
    <div class="outils">
      <div class="filtres" role="group" aria-label="Discipline">
        ${['tout', 'philosophie', 'psychanalyse'].map(d => `<button class="filtre" data-f="${d}" aria-pressed="${filtre === d}">${d === 'tout' ? 'Tout' : NOM_DISC[d]}</button>`).join('')}
      </div>
      <input class="recherche" id="recherche" type="search" placeholder="Chercher une notion, un auteur, une œuvre" value="${esc(requete)}" aria-label="Chercher">
    </div>
    <ul class="liste">${visibles.map(f => `<li><button class="item" data-id="${f.id}">
      <span class="n">${pad(filtre === 'tout' ? numeroDe(f.id) : s.filter(g => g.discipline === filtre).findIndex(g => g.id === f.id) + 1)}</span>
      <span class="t">${esc(f.titre)}</span>
      <span class="etat ${etat.lues[f.id] ? 'lu ' + f.discipline : ''}" title="${etat.lues[f.id] ? 'Lue' : 'Non lue'}"></span>
      <span class="s">${esc(f.figure)} · ${NOM_DISC[f.discipline]}</span>
    </button></li>`).join('') || '<li><p class="vide" style="padding:16px 0">Aucune séance ne correspond.</p></li>'}</ul>
    ${restantes ? `<p class="a-venir">${restantes} séance${restantes > 1 ? 's' : ''} à paraître, une par jour.</p>` : ''}
  </section>`;
  $vue.querySelector('.filtres').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filtre = b.dataset.f; rendreBiblio(); } };
  $vue.querySelector('.liste').onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrir(b.dataset.id); };
  const r = document.getElementById('recherche');
  r.oninput = () => { requete = r.value; const pos = r.selectionStart; rendreBiblio(); const n = document.getElementById('recherche'); n.focus(); n.setSelectionRange(pos, pos); };
}

// ---------- Voix ----------
const synth = window.speechSynthesis;
let enLecture = false;
function voixFr() { try { return (synth.getVoices() || []).filter(v => /^fr/i.test(v.lang)); } catch (e) { return []; } }
function arreterVoix() { if (synth) { try { synth.cancel(); } catch (e) {} } enLecture = false; }
function brancherVoix(f) {
  const zone = document.getElementById('ecoute');
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { zone.hidden = true; return; }
  const dessiner = () => {
    const parle = enLecture && (synth.speaking || synth.pending), pause = synth.paused;
    zone.innerHTML = !parle ? `<button class="bouton secondaire" id="v-lire">Écouter la séance</button>`
      : `<button class="bouton secondaire" id="v-pause">${pause ? 'Reprendre' : 'Pause'}</button><button class="bouton discret" id="v-stop">Arrêter</button>`;
    const l = document.getElementById('v-lire'), p = document.getElementById('v-pause'), s = document.getElementById('v-stop');
    if (l) l.onclick = () => {
      arreterVoix(); enLecture = true;
      const morceaux = [f.titre + '.', f.accroche, f.citation ? 'Citation de ' + f.figure + '. ' + f.citation + '.' : 'Repère. ' + f.repere, ...texteBrut(f.texte).split(/\n{2,}/)];
      const voix = voixFr(), choisie = voix.find(v => v.name === etat.reglages.voix) || voix[0];
      morceaux.forEach((m, i) => {
        const u = new SpeechSynthesisUtterance(m); u.lang = 'fr-FR'; if (choisie) u.voice = choisie; u.rate = etat.reglages.vitesse || 1;
        if (i === morceaux.length - 1) u.onend = () => { enLecture = false; dessiner(); };
        synth.speak(u);
      });
      dessiner();
    };
    if (p) p.onclick = () => { synth.paused ? synth.resume() : synth.pause(); setTimeout(dessiner, 60); };
    if (s) s.onclick = () => { arreterVoix(); dessiner(); };
  };
  dessiner();
}

// ---------- Carte partageable 1080 × 1920 ----------
async function montrerCarte(f) {
  const calque = document.getElementById('calque');
  calque.innerHTML = `<div class="voile-carte" id="voile"><div class="panneau-carte" role="dialog" aria-label="Carte à partager"><p>Composition de la carte…</p></div></div>`;
  const fermer = () => { calque.innerHTML = ''; };
  document.getElementById('voile').onclick = e => { if (e.target.id === 'voile') fermer(); };
  try { await Promise.all(['96px Gloock', '44px Newsreader', '30px "Spline Sans Mono"'].map(p => document.fonts.load(p))); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const encre = f.discipline === 'philosophie' ? '#1E5C57' : '#8C2F3E';
  x.fillStyle = '#ECEEE9'; x.fillRect(0, 0, W, H);
  // Deux disques en surimpression, rappel du sceau
  x.globalAlpha = .9; x.fillStyle = '#1E5C57'; x.beginPath(); x.arc(770, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'multiply'; x.fillStyle = '#8C2F3E'; x.beginPath(); x.arc(930, 470, 190, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  const M = 84, larg = W - 2 * M;
  const lignes = (txt, police, max) => { x.font = police; const mots = txt.split(' '), out = []; let l = ''; for (const m of mots) { const t = l ? l + ' ' + m : m; if (x.measureText(t).width > max && l) { out.push(l); l = m; } else l = t; } if (l) out.push(l); return out; };
  x.fillStyle = encre; x.font = '500 30px "Spline Sans Mono", monospace';
  x.fillText(NOM_DISC[f.discipline].toUpperCase(), M, 760);
  x.fillStyle = '#5A6468'; x.fillText(f.figure.toUpperCase(), M, 805);
  // Zone texte : de 880 jusqu'au cartouche de référence, qui monte selon sa hauteur
  x.font = '28px "Spline Sans Mono", monospace';
  const ref = lignes(f.reference, '28px "Spline Sans Mono", monospace', larg - 40);
  const hautRef = ref.length * 40 + 44, basTexte = 1680 - hautRef - 50;
  let tp = 88, ti = 42, pl, il, hauteur;
  for (;;) {
    pl = lignes(f.punch, `${tp}px Gloock, Georgia, serif`, larg);
    il = lignes(f.idee, `${ti}px Newsreader, Georgia, serif`, larg);
    hauteur = pl.length * tp * 1.08 + 110 + il.length * ti * 1.42;
    if (880 + hauteur <= basTexte || tp <= 56) break;
    tp -= 4; ti = Math.max(32, ti - 2);
  }
  let y = 880 + tp * .8;
  x.fillStyle = '#1B2024'; x.font = `${tp}px Gloock, Georgia, serif`;
  for (const l of pl) { x.fillText(l, M, y); y += tp * 1.08; }
  y += 10; x.fillStyle = encre; x.fillRect(M, y, 120, 6); y += 40 + ti;
  x.fillStyle = '#1B2024'; x.font = `${ti}px Newsreader, Georgia, serif`;
  for (const l of il) { x.fillText(l, M, y); y += ti * 1.42; }
  let yb = 1680 - hautRef + 52;
  x.fillStyle = encre; x.fillRect(M - 20, 1680 - hautRef, larg + 40, hautRef);
  x.fillStyle = '#F7F8F4'; x.font = '28px "Spline Sans Mono", monospace'; for (const l of ref) { x.fillText(l, M, yb); yb += 40; }
  x.fillStyle = '#1B2024'; x.fillRect(M, 1712, larg, 4);
  x.font = '44px Gloock, Georgia, serif'; x.fillText('Après-coup', M, 1782);
  x.font = '28px "Spline Sans Mono", monospace'; const n = 'Séance n° ' + (numeroDe(f.id) ?? ''); x.fillText(n, W - M - x.measureText(n).width, 1780);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  const panneau = calque.querySelector('.panneau-carte');
  panneau.innerHTML = `<img src="${url}" alt="Carte : ${esc(f.punch)}"><div class="rang" style="justify-content:center">
    <button class="bouton" id="enregistrer" hidden>Enregistrer l'image</button><button class="bouton secondaire" id="fermer">Fermer</button></div>
    <p id="carte-msg">Sur téléphone, un appui long sur l'image permet aussi de l'enregistrer.</p>`;
  document.getElementById('fermer').onclick = () => { URL.revokeObjectURL(url); fermer(); };
  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    const b = document.getElementById('enregistrer');
    if (dl && b) { b.hidden = false; b.onclick = async () => {
      try { await dl.save({ filename: `apres-coup-${f.id}.png`, data: blob }); document.getElementById('carte-msg').textContent = 'Image enregistrée.'; }
      catch (e) { if (e && e.code !== 'declined') document.getElementById('carte-msg').textContent = 'L\'enregistrement n\'est pas disponible ici : utilise l\'appui long sur l\'image.'; }
    }; }
  } catch (e) {}
}

// ---------- Démarrage ----------
appliquerTheme();
enregistrer();
rendre();
if (lecture && derniereY) setTimeout(() => window.scrollTo(0, derniereY), 60);
if (synth) try { synth.onvoiceschanged = () => { if (onglet === 'reglages' && !lecture) rendreReglages(); }; } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !lecture) rendre(); });
brancherSync();
</script>
